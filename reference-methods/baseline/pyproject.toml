[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncpbench-reference-baseline"
version = "0.1.0"
description = "Paper reference narrator method for NCP-Bench"
requires-python = ">=3.10"
dependencies = ["ncpbench>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ncpbench_reference_baseline = ["prompts/*.txt"]
