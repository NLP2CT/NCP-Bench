[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncpbench-reference-hiagent"
version = "0.1.0"
description = "Paper HiAgent narrator method for NCP-Bench"
requires-python = ">=3.10"
dependencies = ["ncpbench>=0.1.0", "tiktoken>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ncpbench_reference_hiagent = ["prompts/*.txt"]
