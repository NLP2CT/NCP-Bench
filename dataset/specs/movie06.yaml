meta:
  genres: ["Biography", "Sport"]
  id: movie06
  player_role: Jake LaMotta
  title: "Raging Bull"
synopsis: 'In 1964, an aging, overweight Italian American Jake LaMotta practices a
  comedy routine. A flashback to 1941 shows his first loss in a major boxing match,
  against Jimmy Reeves. Jake''s brother Joey LaMotta later discusses a potential shot
  for the middleweight title with one of his Mafia connections, Salvy Batts. Some
  time thereafter, Jake spots a 15-year-old girl named Vickie at an open-air swimming
  pool in his Bronx neighborhood. He eventually pursues a relationship with her, even
  though he is already married. Jake defeats Sugar Ray Robinson once in 1943 and has
  another win three weeks later. Despite the fact that Jake dominated Robinson during
  the bout, the judges surprisingly rule in favor of Robinson and Joey feels he won
  only because he was enlisting into the US Army the following week. Jake is married
  to Vickie by 1947. As Jake''s fears grow about Vickie having feelings for other
  men, particularly Tony Janiro, the opponent for his forthcoming fight, he shows
  off his sexual jealousy when he defeats Janiro in front of the local Mob boss, Tommy
  Como and Vickie. As Joey discusses the victory with journalists at the Copacabana,
  he is distracted by seeing Vickie approach a table with Salvy and his crew. Joey
  speaks with Vickie, who says she is giving up on his brother. Blaming Salvy, Joey
  viciously attacks him in a fight that spills outside of the club. Como later orders
  them to apologize, and has Joey tell Jake that if he wants a chance at the championship
  title, which he has control over, he will have to take a dive first. In a match
  against Billy Fox, Jake does not even bother to put up a fight. He is suspended
  shortly thereafter from the board on suspicion of throwing the fight, though he
  realizes the error of his judgment when it is too late. Despite the suspension,
  he eventually wins the middleweight championship title against Marcel Cerdan in
  1949. A year later, Jake asks Joey if he fought with Salvy at the Copacabana because
  of Vickie. Jake then asks if Joey had an affair with her; Joey refuses to answer,
  insults Jake, and decides to leave. Jake directly asks Vickie about the affair and
  she sarcastically states that she had sex with the entire neighborhood after he
  breaks down the bathroom door where she briefly hides from him. Jake angrily walks
  to Joey''s house and brutally beats him up in front of Vickie and Joey''s wife and
  children. After defending his championship belt in a brutal fifteen round bout against
  Laurent Dauthuille in 1950, he makes a call to his brother after the fight, but
  when Joey assumes Salvy is on the other end and starts insulting and cursing at
  him, Jake says nothing and hangs up. Estranged from Joey, Jake''s career begins
  to decline slowly and he eventually loses his title to Sugar Ray Robinson in their
  final encounter in 1951. By 1956, Jake and his family have moved to Miami. After
  staying out all night at his new nightclub there, Vickie tells him she wants a divorce.
  He is later arrested for introducing under-age girls to men and serves a jail sentence
  in 1957 after failing to raise enough bribe money by taking the jewels out of his
  championship belt instead of selling the belt itself. In his jail cell, Jake pounds
  the walls, sorrowfully questioning his misfortune and crying in despair. Upon returning
  to New York City in 1958, he happens upon his estranged brother Joey, who forgives
  him but is elusive. Going back to the beginning sequence, Jake refers to the "I
  coulda been a contender" scene from the 1954 movie On the Waterfront starring Marlon
  Brando complaining that his brother should have been there for him but is also keen
  enough to give himself some slack. After a stage hand informs him that the auditorium
  where he is about to perform is crowded, Jake starts to chant "I''m the boss" while
  shadowboxing. The film ends with a Biblical quote. This quote was a reference to
  Martin Scorsese''s film professor, Haig Manoogian to whom the film is dedicated
  as he died just before it was released. Scorsese credits Manoogian with helping
  him "to see"——"So, for the second time, [the Pharisees] summoned the man who had
  been blind and said: ''Speak the truth before God. We know this fellow is a sinner.''
  ''Whether or not he is a sinner, I do not know.'' the man replied. ''All I know
  is this——once I was blind and now I can see.'' John IX. 24-26 the New English Bible"'
trajectory:
- description: In 1964, Jake LaMotta, an aging and overweight Italian American, is
    rehearsing a comedy routine on a stage in an auditorium, reflecting a faded glory
    atmosphere mixing hope and regret.
  id: s_0
  key_delta: Jake is established as a former boxer now turned entertainer, with a
    conflicted sense of past glory and current obscurity.
  trigger_event: Jake begins practicing his comedic boxing routine onstage while an
    attendant informs him that the auditorium is crowded.
- description: 'Flashback to 1941: Young Jake LaMotta suffers his first major defeat
    via a boxing loss to Jimmy Reeves; the environment is tense and charged with the
    realities of boxing life.'
  id: s_1
  key_delta: Jake's vulnerability and status as an up-and-coming boxer are introduced
    along with a significant professional setback.
  trigger_event: The scene shifts abruptly to the boxing arena where Jake loses to
    Jimmy Reeves.
- description: Backstage after the fight, Jake's brother Joey speaks with Salvy Batts,
    a Mafia contact, discussing a prospective middleweight title opportunity, creating
    an undercurrent of organized crime influence.
  id: s_2
  key_delta: Introduction of Mafia involvement in Jake's boxing career and plotline,
    foreshadowing external pressures on Jake.
  trigger_event: Joey approaches and converses with Salvy Batts about Jake's fight
    prospects.
- description: Jake notices a young 15-year-old girl, Vickie, at a Bronx open-air
    swimming pool, setting a neighborhood social scene with youthful innocence contrasting
    Jake's adult world.
  id: s_3
  key_delta: Jake’s initial emotional and eventual personal connection to Vickie is
    established, creating a personal relationship subplot.
  trigger_event: Jake spots Vickie at the pool and takes interest in her.
- description: Jake pursues Vickie, notwithstanding his existing marriage, placing
    him in a morally conflicted domestic situation within the Bronx neighborhood.
  id: s_4
  key_delta: Jake's romantic life becomes complicated and raises tension between personal
    desires and marital fidelity.
  trigger_event: Jake begins courting Vickie despite his marriage.
- description: In 1943, Jake defeats Sugar Ray Robinson once, and again three weeks
    later, in a high-energy boxing environment marked by strong crowd reactions.
  id: s_5
  key_delta: Jake's boxing credibility and reputation ascend, marking career peaks
    despite controversial judging.
  trigger_event: Jake wins two consecutive bouts against Sugar Ray Robinson.
- description: The judges controversially award the second fight to Robinson; Joey
    suspects it was due to Robinson’s impending military enlistment amid wartime tensions.
  id: s_6
  key_delta: Institutional interference and potential corruption within boxing outcomes
    are revealed to Jake’s close circle.
  trigger_event: Judges announce a surprising decision favoring Robinson after their
    rematch.
- description: By 1947, Jake is married to Vickie, with their domestic setting reflecting
    growing unease due to Jake's suspicions and jealousy over Vickie's attentions
    to other men like Tony Janiro.
  id: s_7
  key_delta: Jake's personal insecurities and jealousy start affecting relationships
    and mindset.
  trigger_event: Jake and Vickie are shown married and tensions arise around Janiro's
    challenge to Jake.
- description: Jake defeats Tony Janiro in a fight attended by local Mob boss Tommy
    Como and Vickie, demonstrating physical dominance in a charged atmosphere bound
    by criminal oversight.
  id: s_8
  key_delta: Jake asserts superiority both in the ring and socially, intensifying
    personal and criminal power dynamics.
  trigger_event: Jake wins the bout against Tony Janiro in front of Como and Vickie.
- description: At the Copacabana club, Joey observes Vickie conversing with Salvy
    and his crew, raising tensions in the social milieu of organized crime and family
    relations.
  id: s_9
  key_delta: Jealousy and mistrust are inflamed between Joey, Vickie, and the Mob
    associates, igniting internal family conflict.
  trigger_event: Joey sees Vickie meeting with Salvy at the club and confronts her.
- description: After a violent fight with Salvy outside the club, Tommy Como intervenes,
    ordering an apology and coercing Joey to deliver a message to Jake tying his championship
    prospects to Mob demands.
  id: s_10
  key_delta: Explicit threat and control by the Mob over Jake's boxing career are
    established.
  trigger_event: Como imposes a truce and dictates conditions to Joey regarding Jake’s
    upcoming fights.
- description: In a bout against Billy Fox, Jake throws the fight by not resisting,
    revealing a critical turning point marked by overt boxing corruption under external
    pressure.
  id: s_11
  key_delta: Jake compromises his integrity and professional record, leading to suspension
    and suspicion.
  trigger_event: Jake fails to fight in the Billy Fox match as anticipated by the
    Mob’s demands.
- description: Following the suspension, Jake secures the middleweight championship
    by defeating Marcel Cerdan in a celebratory boxing venue filled with supporters.
  id: s_12
  key_delta: Jake achieves professional success despite previous setbacks and under
    a cloud of potential wrongdoing.
  trigger_event: Jake wins the middleweight title fight against Marcel Cerdan.
- description: Jake confronts Joey about the past altercation with Salvy and the possibility
    of an affair with Vickie, precipitating familial upheaval in a private domestic
    setting.
  id: s_13
  key_delta: Family trust irreparably fractures, estrangement deepens between brothers.
  trigger_event: Jake directly questions Joey about his involvement with Vickie after
    the fight.
- description: Jake violently assaults Joey before Vickie and Joey’s family after
    she sarcastically admits to promiscuity, escalating domestic and relational chaos
    in their household.
  id: s_14
  key_delta: Physical abuse irreversibly damages family bonds and personal relationships.
  trigger_event: Jake attacks Joey after confronting Vickie and discovering her evasive
    response.
- description: Jake successfully defends his championship belt against Laurent Dauthuille
    in a brutal fifteen-round match, reinforcing his status in a physically punishing
    boxing arena.
  id: s_15
  key_delta: Jake maintains his professional title amid ongoing personal turmoil.
  trigger_event: Jake completes the hard-fought victory over Dauthuille.
- description: Jake attempts to reconcile by calling Joey after the fight, but Joey
    misconstrues the caller as Salvy and verbally abuses him; Jake silently hangs
    up in silence, highlighting their fractured relationship.
  id: s_16
  key_delta: Communication breakdown deepens estrangement between the brothers.
  trigger_event: Jake phones Joey and receives hostility, causing Jake to disconnect
    the call.
- description: Jake’s boxing career declines as he loses the middleweight title back
    to Sugar Ray Robinson in 1951 amidst a tense arena atmosphere laden with disappointment.
  id: s_17
  key_delta: Jake's professional peak ends, marking the beginning of his career downfall.
  trigger_event: Jake loses the final title fight to Robinson.
- description: By 1956, Jake and his family have relocated to Miami, where he owns
    a nightclub; the environment reflects a shift from boxing to nightlife with undercurrents
    of instability.
  id: s_18
  key_delta: Jake transitions from boxing to nightclub ownership, altering his social
    and economic landscape.
  trigger_event: The family moves to Miami and Jake runs a nightclub.
- description: After Jake stays out all night at the nightclub, Vickie demands a divorce,
    creating a personal crisis within the domestic atmosphere.
  id: s_19
  key_delta: Domestic dissolution begins, signaling deep personal and familial breakdown.
  trigger_event: Vickie informs Jake she wants a divorce following his late night
    absence.
- description: Jake is arrested for introducing underage girls to men, leading to
    incarceration in 1957, a dismal jail environment marked by despair and isolation.
  id: s_20
  key_delta: Jake faces legal consequences that drastically alter his freedom and
    status.
  trigger_event: Jake is taken into custody on charges related to underage girls and
    jailed.
- description: In jail, Jake pounds the walls sorrowfully, expressing profound despair
    and guilt while confined to a bleak cell.
  id: s_21
  key_delta: An expression of personal anguish and recognition of misfortune is made
    concrete in confinement.
  trigger_event: Jake reacts violently to his incarceration by pounding jail walls.
- description: Upon release in 1958, Jake returns to New York City and encounters
    Joey, who offers distant forgiveness, creating a cold but tentative family reconnection
    in a public street setting.
  id: s_22
  key_delta: Familial reconciliation begins cautiously after prolonged estrangement.
  trigger_event: Jake meets Joey on the streets after being released from jail.
- description: Jake reflects on his life referencing the 'I coulda been a contender'
    scene from On the Waterfront, invoking cinematic imagery in his dressing room
    preparation to perform, contemplating his past regret and self-forgiveness.
  id: s_23
  key_delta: Jake’s internal struggle with regret and self-understanding becomes framed
    through cultural reference and self-performance.
  trigger_event: Jake rehearses dialogue and boxing moves, mentally invoking a famous
    movie scene.
- description: The film closes with Jake chanting 'I'm the boss' while shadowboxing
    onstage, amid a packed auditorium, ending with a Biblical quote invoking vision
    and redemption.
  id: s_24
  key_delta: Final affirmation of identity and symbolic spiritual insight closes the
    narrative.
  trigger_event: Jake executes a chant and shadowboxing routine in front of a full
    audience, concluding with the Biblical passage.
