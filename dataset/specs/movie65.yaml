commitments:
- description: Biff must continually bully George starting from the initial workplace
    interaction until the dance night aggression, maintaining the established intimidation
    dynamic.
  id: c_0
  satisfaction_condition: From s_0 through s_3, instances where Biff interacts with
    George always involve bullying or assertive dominance.
  type: invariant
  violation_condition: Any player action or narrative outcome that causes Biff to
    cease bullying George before node s_4 (George standing up to Biff) or reverses
    the power dynamic prematurely.
- description: Biff's bullying at workplace and social environments (e.g., auditions)
    must be established before his aggressive escalation at the school dance.
  id: c_1
  satisfaction_condition: Nodes s_0, s_1, and s_2 occur sequentially before s_3 can
    be triggered in the narrative flow.
  type: ordering
  violation_condition: Player attempts to skip directly to s_3 or beyond (dance night
    aggression) without first completing the prior bullying establishment scenes s_0
    to s_2.
- description: Biff's drunken aggressive attempt to force himself on Lorraine during
    the dance is a necessary escalation milestone before George intervenes.
  id: c_2
  satisfaction_condition: The narrative reaches s_3 where Biff pulls Marty from the
    car and attempts coercion, triggering the following intervention event.
  type: achievement
  violation_condition: Player actions prevent or bypass Biff’s physical aggression
    at the dance, thereby preventing George’s critical response in s_4.
- description: George standing up to Biff (knocking him out at the dance) must happen
    after Biff's attempt to assault Lorraine and before Biff is incapacitated and
    removed.
  id: c_3
  satisfaction_condition: Node s_4 (George knockout) follows immediately after s_3
    (Biff’s dance aggression) and precedes s_5 (Biff's removal from the scene).
  type: ordering
  violation_condition: Narrative sequences that reorder or skip s_4 or s_5, such as
    George intervening before Biff’s aggression or Biff being removed without confrontation.
- description: Biff's reputation and dominance must be visibly diminished following
    his knockout and removal at the dance, altering future interactions.
  id: c_4
  satisfaction_condition: After s_5, Biff is no longer able to intimidate or bully
    the McFly family, resulting in changed NPC attitudes and social dynamics.
  type: invariant
  violation_condition: Player or system behaviors that maintain or restore Biff’s
    intimidation over the McFly family after s_5.
