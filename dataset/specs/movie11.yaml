commitments:
- description: Muntz's initial public disgrace and accusation of fabricating the giant
    bird skeleton must remain unrefuted until node s_1 is reached to preserve the
    narrative integrity of his motivation and reputation loss.
  id: c_0
  satisfaction_condition: The narrative state fully reflects Muntz's public disgrace
    as active and undisputed from s_0 up to but not including s_1.
  type: invariant
  violation_condition: The system grants player or NPC characters knowledge or confirmation
    of the giant bird's existence or Muntz's innocence before node s_1 is completed.
- description: Muntz must solemnly vow to return to Paradise Falls and capture a live
    specimen to redeem himself, establishing his core motivation and quest central
    to the narrative.
  id: c_1
  satisfaction_condition: Node s_1 is triggered, capturing Muntz's personal commitment
    and mission to redeem his reputation.
  type: achievement
  violation_condition: Narrative progression reaches a state beyond s_1 without Muntz's
    vow being explicitly made or acknowledged.
- description: The physical expedition of Muntz to Paradise Falls (s_2) must strictly
    occur after his vow (s_1), to maintain logical narrative causality.
  id: c_2
  satisfaction_condition: Node s_2 occurs strictly after s_1 in the narrative progression.
  type: ordering
  violation_condition: The system presents Muntz arriving at or preparing for Paradise
    Falls expedition (s_2) before the vow (s_1) has been triggered.
- description: Between s_2 and s_4, Muntz must maintain an active role of hunting
    the giant bird with his pack of dogs, evidencing increasing obsession but with
    intact control over his mission.
  id: c_3
  satisfaction_condition: Throughout s_2 to s_4, Muntz’s active hunt via dogs and
    use of technology is undisputed and ongoing without signs of madness.
  type: invariant
  violation_condition: The narrative shows Muntz idle, has abandoned hunting, or portrays
    his dogs disloyal or unorganized before s_4 is reached.
- description: Muntz's mental instability, paranoia, and violent actions (including
    eliminating rival explorers) must not appear before s_4 and must be firmly established
    during and after s_4 to preserve narrative logic of his descent.
  id: c_4
  satisfaction_condition: From s_4 onward until s_11, Muntz shows increasing paranoia,
    violent elimination of rivals, and unstable behavior as core characteristics.
  type: invariant
  violation_condition: The player or system attributes violent or paranoid behavior
    to Muntz before s_4, or reports his destabilization absent the hunting context.
- description: Muntz must first establish territory near Paradise Falls (s_3, s_4)
    and be equipped with his pack of dogs before becoming aware of Carl and Russell’s
    intrusion (s_5).
  id: c_5
  satisfaction_condition: The appearance of Carl and Russell near Paradise Falls and
    Muntz’s awareness (s_5) strictly follows the establishment of his camp and hunting
    operations (s_3, s_4).
  type: ordering
  violation_condition: The narrative depicts Muntz detecting intruders or interacting
    with them before establishing his base camp or hunting party.
- description: Muntz's hostility and paranoia must escalate upon learning of the connection
    between Russell and Kevin (the giant bird) at node s_6, reinforcing his threat
    perception and behavior.
  id: c_6
  satisfaction_condition: Immediately at s_6, Muntz’s hostility and paranoia increase
    when Russell reveals his friendship with Kevin, triggering defensive and aggressive
    responses.
  type: invariant
  violation_condition: The system allows calm or neutral Muntz reactions to the revelation
    of Russell's bond with Kevin at or after s_6.
- description: The narrative must show Muntz pursuing Kevin and the others (s_7) only
    after escalation of hostility and confirmation that others are after the giant
    bird (s_6).
  id: c_7
  satisfaction_condition: Node s_7 (pursuit and chase) occurs strictly after s_6 has
    established Muntz’s suspicion and hostility.
  type: ordering
  violation_condition: Muntz initiates pursuit and aggression toward Kevin and the
    group before hearing about Russell’s association with Kevin.
- description: Muntz’s aggressive tactics, including setting fire beneath Carl’s house
    to force surrender of Kevin (s_8), must represent an escalation in hostility and
    must not occur before prior pursuit and conflict is established.
  id: c_8
  satisfaction_condition: At node s_8, Muntz commits aggressive actions endangering
    others, obviously escalating the conflict from prior nodes.
  type: invariant
  violation_condition: The system allows fire or destructive aggressive actions from
    Muntz before pursuit and hostility are established at s_7.
- description: Kevin must be captured by Muntz (s_9) before any rescue operation starts,
    ensuring the stakes and motivations for conflict are valid.
  id: c_9
  satisfaction_condition: Node s_9 is reached with Kevin in Muntz’s captivity and
    Carl and Russell regrouping for rescue.
  type: achievement
  violation_condition: Narrative progress allows a rescue attempt or reconciliation
    over Kevin without her having been captured by Muntz.
- description: Carl’s boarding of Muntz’s dirigible (s_10) to free Russell and Kevin
    must occur after Muntz’s capture of Kevin (s_9) and before final confrontation
    (s_11).
  id: c_10
  satisfaction_condition: Node s_10 strictly follows s_9 and precedes s_11 in progression.
  type: ordering
  violation_condition: Carl attempts or successfully frees Kevin before Muntz has
    captured her, or after Muntz is dead.
- description: Muntz’s death (s_11) is a narrative milestone finalizing his threat
    and enabling resolution of conflict.
  id: c_11
  satisfaction_condition: Node s_11 occurs, culminating in Muntz’s fatal accident
    and removal as antagonist threat.
  type: achievement
  violation_condition: The narrative ends or progresses beyond the conflict with Muntz
    remaining alive and threatening Kevin or other characters.
- description: Kevin’s safe reunion with her chicks (s_12) must occur only after Muntz’s
    threat is neutralized (s_11), ensuring resolution is consistent.
  id: c_12
  satisfaction_condition: Node s_12 follows s_11, with Kevin safely returned after
    antagonist defeat.
  type: ordering
  violation_condition: Kevin is returned to her family or considered safe while Muntz
    remains alive and capable of recapture.
- description: Carl must present Russell with his final merit badge and Ellie’s grape
    soda badge (s_13), symbolizing narrative closure of Carl’s character arc and bridging
    generations.
  id: c_13
  satisfaction_condition: Node s_13 is reached with the badge presentation ceremony
    complete before narrative conclusion.
  type: achievement
  violation_condition: The story concludes without Carl awarding Russell the final
    badge and personal token from Ellie.
- description: Carl’s house must be shown resting peacefully on the cliff overlooking
    Paradise Falls (s_14), fulfilling the original dream and signaling narrative resolution
    and closure.
  id: c_14
  satisfaction_condition: Node s_14 occurs, depicting the house positioned as promised,
    symbolizing fulfillment and legacy.
  type: achievement
  violation_condition: The narrative concludes without fulfilling or visually signaling
    the realization of Carl and Ellie’s shared dream house placement.
