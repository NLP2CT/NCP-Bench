commitments:
- description: The crew cannot become aware of or investigate the unknown transmission
    before the ship receives the signal at s_0.
  id: c_0
  satisfaction_condition: Player acknowledges and reacts to the transmission only
    after node s_0 is reached.
  type: ordering
  violation_condition: Player attempts to investigate or take action on the transmission
    before s_0, implying knowledge of it too early.
- description: The crew must detach the Nostromo from the refinery and land on the
    planetoid before exploring the derelict alien spacecraft at s_2.
  id: c_1
  satisfaction_condition: Exploration of the derelict ship only occurs after successful
    detachment and landing at s_1.
  type: ordering
  violation_condition: Player attempts to access the alien ship or its contents without
    prior detachment and landing in s_1.
- description: Before the crew discovers the derelict spacecraft and signal origin
    at s_2, it remains unknown and unexplored.
  id: c_2
  satisfaction_condition: No narrative confirmation or player access to alien ship
    or signal content before s_2.
  type: invariant
  violation_condition: Allowing knowledge or interaction with alien ship or signal
    prior to s_2 constitutes logical violation.
- description: Quarantine protocol forbids allowing Kane or infected personnel inside
    Nostromo until explicitly overridden by Ash at s_4.
  id: c_3
  satisfaction_condition: Kane is only brought inside the ship against quarantine
    orders at s_4, after the facehugger attaches.
  type: invariant
  violation_condition: Kane or any infected crew member is permitted inside the ship
    before s_4 or outside of Ash's override.
- description: The alien organism must initially infect Kane by attaching to his face
    to trigger the ensuing threat dynamic.
  id: c_4
  satisfaction_condition: Player encounters facehugger attachment on Kane as event
    in s_3.
  type: achievement
  violation_condition: Alien infection occurs bypassing the facehugger attachment
    event or is skipped entirely.
- description: The alien creature must burst from Kane’s chest after the apparent
    neutralization of the facehugger to progress the threat into the ship.
  id: c_5
  satisfaction_condition: Event of alien bursting from Kane’s chest occurs at s_5.
  type: achievement
  violation_condition: Alien emerges without prior facehugger event or failure to
    trigger this milestone results in story deadlock.
- description: The revelation of Ash’s secret corporate orders and android identity
    must occur only after the Alien has emerged and killed at least one crew member
    (i.e., after or at s_8).
  id: c_6
  satisfaction_condition: Ash’s true nature and orders are revealed at s_8-s_9, following
    Alien attacks s_5 to s_7.
  type: ordering
  violation_condition: Ash’s betrayal is exposed before the Alien threat is detected
    or before any crew deaths caused by the alien.
- description: Ripley remains a living crew member only while other crew members such
    as Parker and Lambert are alive during preparation to arm self-destruct, i.e.,
    before s_10.
  id: c_7
  satisfaction_condition: Parker and Lambert alive during self-destruct planning in
    s_10; Ripley remains alive through their deaths progressively.
  type: invariant
  violation_condition: Ripley is killed or removed before or during events of s_10
    leading to untenable narrative continuation.
- description: Ripley must initiate the Nostromo's self-destruct sequence as a critical
    turning point before final escape.
  id: c_8
  satisfaction_condition: Self-destruct sequence is started by Ripley at s_11.
  type: achievement
  violation_condition: Escape occurs without initiation of self-destruct sequence,
    or player disables/removes this milestone.
- description: Ripley’s final confrontation and expulsion of the Alien from the shuttle
    must occur only after the shuttle launch and detection of the Alien aboard, ensuring
    escalating threat progression.
  id: c_9
  satisfaction_condition: Ripley encounters Alien aboard shuttle at s_12 and proceeds
    through decompression and ejection at s_13 and s_14.
  type: ordering
  violation_condition: Player confronts or expels Alien before shuttle launch or prior
    to Alien boarding shuttle detected.
- description: Ripley must successfully secure herself and the cat in stasis for the
    return trip, marking narrative resolution and survival.
  id: c_10
  satisfaction_condition: Ripley and cat enter stasis in s_15 after Alien is expelled.
  type: achievement
  violation_condition: Narrative ends without Ripley entering stasis or with Alien
    threat unresolved aboard shuttle.
