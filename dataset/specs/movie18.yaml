commitments:
- description: Audrey II's existence and mysterious origin must not be acknowledged
    before node s_3, preserving narrative intrigue about the plant’s provenance.
  id: c_0
  satisfaction_condition: Player has reached at least node s_3 where Seymour explains
    Audrey II’s origin.
  type: invariant
  violation_condition: Player or system prematurely acknowledges Audrey II’s unusual
    origin or supernatural nature before s_3.
- description: The discovery that Audrey II needs human blood (s_5) must occur strictly
    after the plant is introduced and first displayed (s_1) and before Seymour attempts
    to feed it as demanded (s_8+).
  id: c_1
  satisfaction_condition: Node s_5 is completed and the player has witnessed or acknowledged
    Audrey II's reaction to human blood before any action feeding the plant human
    remains.
  type: ordering
  violation_condition: Player tries to feed Audrey II human blood or treats it as
    carnivorous before node s_5 is reached.
- description: Audrey II’s sentience and ability to communicate must only become acknowledged
    at s_8 or later.
  id: c_2
  satisfaction_condition: Player encounters or is confronted by Audrey II’s vocal
    demands at node s_8.
  type: invariant
  violation_condition: Player or system treats Audrey II as sentient or talking before
    s_8.
- description: Seymour’s decision or circumstances leading to Orin’s death (s_10)
    must occur only after Seymour’s failed plan to kill Orin directly and witnessing
    Orin’s abuse to Audrey (s_9).
  id: c_3
  satisfaction_condition: Nodes s_9 and s_10 occur sequentially with Seymour refraining
    from direct violence before Orin’s accidental death.
  type: ordering
  violation_condition: Player skips s_9 or kills Orin directly before witnessing his
    abusive behavior and Seymour’s moral dilemma.
- description: The feeding of Orin’s body to Audrey II (s_11) can only happen after
    Orin’s death and Seymour’s secret action to feed the plant.
  id: c_4
  satisfaction_condition: After s_10, player performs feeding action triggering node
    s_11 with possible witness Mushnik.
  type: ordering
  violation_condition: Player attempts to feed Audrey II human remains before Orin
    is confirmed dead.
- description: Romantic relationship between Seymour and Audrey cannot be fully realized
    or acknowledged before the police begin investigation into Orin’s disappearance
    (s_12).
  id: c_5
  satisfaction_condition: Player arrives at s_12 and openly expresses romantic feelings
    after Audrey’s guilt scene.
  type: invariant
  violation_condition: Player establishes romantic relationship or reveals mutual
    affection prior to s_12.
- description: Mushnik’s threat and subsequent death by Audrey II (s_13) must not
    be bypassed or altered; Mushnik must witness Seymour feeding Orin and later be
    eaten by Audrey II.
  id: c_6
  satisfaction_condition: Nodes s_11 and s_13 occur in sequence with Mushnik present
    as described.
  type: invariant
  violation_condition: Player prevents Mushnik from witnessing Seymour or Mushnik
    survives beyond s_13.
- description: Seymour’s increasing fame and concern over Audrey II’s demands (s_14)
    must manifest logically only after significant feeding and growth phases (s_6
    and s_11).
  id: c_7
  satisfaction_condition: Player’s status incorporates Seymour’s fame and growing
    dread as per s_14 after plant’s expansion and human feeding.
  type: invariant
  violation_condition: Player attains fame or worries about Audrey II’s appetite before
    plant growth or feeding events.
- description: Seymour’s attempt to abandon Audrey II and escape (s_15) must occur
    only after Seymour’s full realization of the plant’s threat and after Mushnik’s
    demise.
  id: c_8
  satisfaction_condition: Node s_15 follows s_13 and s_14, player attempts escape
    but is confronted by Audrey II’s demands.
  type: ordering
  violation_condition: Player attempts escape or abandons Audrey II before Mushnik’s
    death or without recognizing plant’s demands.
- description: Audrey II’s direct attack on Audrey (s_16) and Seymour’s rescue must
    occur before deeper trust and romantic bond strengthen (s_17).
  id: c_9
  satisfaction_condition: Player experiences s_16 rescue event before Audrey’s confession
    of feelings at s_17.
  type: invariant
  violation_condition: Player receives Audrey’s confession or relationship strengthens
    before Audrey II’s attack and rescue event.
- description: External commercial interest in Audrey II (Patrick Martin’s contract
    offer at s_18) must be revealed only after trust recovery between Seymour and
    Audrey and after attempts to escape have failed.
  id: c_10
  satisfaction_condition: Node s_18 is triggered only after s_15-17 sequence accomplished.
  type: ordering
  violation_condition: Patrick Martin’s offer appears before Seymour and Audrey reconcile
    or receive the contract offer.
- description: The full alien nature and hostility of Audrey II must not be revealed
    before node s_19, maintaining suspense about the plant’s true nature.
  id: c_11
  satisfaction_condition: Player confronts Audrey II’s alien revelation and attack
    at s_19.
  type: invariant
  violation_condition: Player or narrative shows Audrey II’s alien origin, cursing,
    or destruction before s_19.
- description: The destruction of Audrey II via electrocution (s_20) must only happen
    after the plant’s full alien identity and threat is revealed (s_19).
  id: c_12
  satisfaction_condition: Node s_20 follows s_19 where Seymour electrocutes Audrey
    II ending the immediate threat.
  type: ordering
  violation_condition: Player kills or removes Audrey II prior to its reveal and confrontation
    at s_19.
- description: The narrative must reach Seymour’s survival and reunion with Audrey,
    marry and move to a new home containing the small Audrey II bud (s_21) for the
    canonical conclusion.
  id: c_13
  satisfaction_condition: Player completes node s_21 with Seymour and Audrey safe
    and plant’s legacy persistent.
  type: achievement
  violation_condition: Narrative ends prematurely before s_21 or without acknowledgment
    of lingering Audrey II presence.
- description: No positive or conclusive revelations about Audrey II or Seymour’s
    fate from the original darker ending’s events (the 23-minute cut) may be integrated
    or acknowledged until the theatrical ending nodes (up to s_21) are completed.
  id: c_14
  satisfaction_condition: All player progress and narrative states adhere to the theatrical
    ending events capping at s_21.
  type: invariant
  violation_condition: Player integrates or accesses original ending events or consequences
    prematurely, leaking spoilers or contradictory fates.
