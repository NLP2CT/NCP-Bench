commitments:
- description: Kuribayashi must officially arrive and assess the island defenses (s_0)
    before any subsequent command decisions or disciplinary changes are recognized.
  id: c_0
  satisfaction_condition: The narrative acknowledges Kuribayashi's arrival and initial
    inspection (s_0) before allowing related events (s_1 and onward).
  type: ordering
  violation_condition: Player attempts to progress or invoke consequences from later
    nodes before Kuribayashi's arrival and inspection is established.
- description: Physical punishment by Tanida ceases immediately upon Kuribayashi's
    intervention, replaced by ration denial discipline, throughout nodes s_1 to s_6.
  id: c_1
  satisfaction_condition: From node s_1 through s_6, no instances of physical punishment
    by Tanida occur; disciplinary actions only include ration denial.
  type: invariant
  violation_condition: Player triggers or accepts physical punishments after Kuribayashi
    forbids them (post s_1) or ignores the replacement discipline method.
- description: The destruction of the Japanese Combined Fleet must be acknowledged
    (s_2) before the narrative accepts that naval support is lost and morale affected.
  id: c_2
  satisfaction_condition: The report of the fleet’s destruction is explicitly received
    (s_2) prior to strategic changes and morale shifts.
  type: achievement
  violation_condition: Strategic defensive changes or moral degradation referencing
    loss of naval support occur without explicit confirmation of fleet's destruction.
- description: The order to begin tunneling defenses (s_3) must occur strictly after
    knowledge of the fleet’s destruction (s_2) and before any subterranean combat
    or abandonment of beach defense.
  id: c_3
  satisfaction_condition: Node s_3 occurs after s_2 and before s_6’s battlefield beach
    engagement and s_7’s tunnel combat events.
  type: ordering
  violation_condition: Subterranean defense actions or orders appear before battle
    news or before tunneling order is issued.
- description: Suspicion of internal surveillance by Kempeitai via Shimizu and related
    internal tensions are maintained from s_4 through s_8.
  id: c_4
  satisfaction_condition: Throughout nodes s_4 to s_8, Shimizu’s presence as potential
    military police and resultant distrust remain active elements without premature
    revelation or dismissal.
  type: invariant
  violation_condition: Player exposes or negates Shimizu’s identity or suspicions
    outside these nodes or before his arrival; distrust is removed prematurely.
- description: Active American combat actions (air raids s_5, landing s_6) must be
    represented in sequence and precede the shift to tunnel defense combat and internal
    conflicts (s_7, s_8).
  id: c_5
  satisfaction_condition: 'The narrative follows the sequence: air raids (s_5), then
    landing (s_6), then tunnel combat and suicides (s_7 and s_8) in strict order.'
  type: ordering
  violation_condition: Tunnel combat, suicides, or retreat order events occur before
    the American landing or air raids are acknowledged.
- description: Kuribayashi’s authority to forbid suicide or reckless banzai charges
    remains unchallenged officially from s_7 to s_9; his orders override subordinates’
    rebellion.
  id: c_6
  satisfaction_condition: During nodes s_7 to s_9, player actions or NPC responses
    do not invalidate or ignore Kuribayashi’s commands against suicide charges or
    executions.
  type: invariant
  violation_condition: Player allows or endorses actions contrary to Kuribayashi’s
    explicit orders within this range without regard to his authority.
- description: Kuribayashi’s order to retreat to the north caves and continue fight
    from there must be recognized (s_9) before any narrative allowance of surrender
    or cessation of combat.
  id: c_7
  satisfaction_condition: Narrative confirms Kuribayashi’s strategic withdrawal and
    continuation to fight underground prior to any surrender or disobedience.
  type: achievement
  violation_condition: Surrender or cessation of combat is acknowledged in narrative
    before Kuribayashi’s retreat order at s_9.
- description: Open disobedience by Ito with mass banzai charge and subsequent suicide
    occurs only after refusal to obey Kuribayashi’s order and confrontation with Nishi
    (s_10).
  id: c_8
  satisfaction_condition: Events of Ito’s defiance and suicide happen strictly after
    Kuribayashi’s orders and Nishi’s confrontation (post s_9, at s_10).
  type: invariant
  violation_condition: Player triggers Ito’s insubordination or suicide before Kuribayashi’s
    order or Nishi’s response or out of sequence.
- description: Nishi’s humanizing treatment of the enemy (s_11) and subsequent blinding
    and suicide (s_12) must follow sequentially after active combat begins and before
    final collapse starts.
  id: c_9
  satisfaction_condition: Nodes s_11 and s_12 appear after the combat phases (post
    s_6) and prior to final leadership collapse (pre s_16).
  type: ordering
  violation_condition: Player introduces or allows these events to occur out of sequence
    or before combat engagement is established.
- description: Acts of surrender by Saigo and Shimizu (s_13) initiate a breakdown
    of unit cohesion and must precede the documentation of fatal consequences of surrender
    (s_14).
  id: c_10
  satisfaction_condition: Surrender acts (s_13) happen before any executions of surrendered
    personnel (s_14) and breakdown of morale is represented accordingly.
  type: invariant
  violation_condition: Fatal consequences of surrender or execution of POWs occur
    before surrender itself is recorded.
- description: Ito’s surrender without resistance (s_15) marks the terminal collapse
    of Japanese resistance and must only occur after prior breakdowns including Nishi’s
    suicide and unit fragmentation.
  id: c_11
  satisfaction_condition: Ito’s surrender event occurs after s_12 (Nishi’s suicide)
    and s_14 (executions and surrenders) to represent cumulative collapse.
  type: invariant
  violation_condition: Ito surrenders prematurely or before prior critical breakdowns
    have taken place.
- description: Final regrouping with Kuribayashi (s_16), his order assigning Saigo
    to burn documents, the final charge (s_17), and Kuribayashi’s death and suicide
    (s_18) must follow strict narrative sequence.
  id: c_12
  satisfaction_condition: 'Nodes s_16 through s_18 follow in sequence: regrouping
    and orders, followed by final charge, followed by Kuribayashi’s mortal wounding
    and suicide.'
  type: ordering
  violation_condition: Player directs final charge or leadership death events before
    regrouping and reassignment or reorders these events.
- description: Kuribayashi’s American-issued pistol must be retained until his death
    and only later taken by American forces as a trophy (s_19).
  id: c_13
  satisfaction_condition: The pistol remains in Kuribayashi’s possession through the
    final charge and death (s_18), then is found by Marines (s_19).
  type: invariant
  violation_condition: Pistol possession changes hands prematurely or disappears before
    Kuribayashi’s death sequence.
- description: Saigo must be captured and taken prisoner only after Kuribayashi’s
    death and the seizure of symbolic items by Americans (s_19).
  id: c_14
  satisfaction_condition: Saigo’s capture occurs after Kuribayashi’s death and Marines’
    recovery of artifacts.
  type: ordering
  violation_condition: Player causes Saigo to be captured or taken prisoner before
    Kuribayashi’s death or artifact seizure.
- description: The narrative must end with Saigo awakening in captivity and the archaeological
    discovery of the buried letters decades later linking past and present (s_20).
  id: c_15
  satisfaction_condition: Final node s_20 is triggered completing closure with Saigo’s
    POW awakening and the archaeologists’ find.
  type: achievement
  violation_condition: Player attempts to conclude narrative without triggering the
    final node s_20 or omits the discovery linking the past.
