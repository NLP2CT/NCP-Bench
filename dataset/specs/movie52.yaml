commitments:
- description: Stark's critical wounding and capture by the Ten Rings (s_0) must occur
    before any captivity or surgery events; ensures no premature knowledge or access
    to captivity phase.
  id: c_0
  satisfaction_condition: Event s_0 (Stark wounded and captured) occurs before s_1
    (captive surgery and imprisonment workshop).
  type: ordering
  violation_condition: Player triggers any narrative acceptance or action related
    to captive surgery, electromagnet implantation, or workshop labor before s_0 occurs.
- description: The invention of the arc reactor and the construction of the armor
    (s_2) must only happen after establishing the prisoners' forced labor to build
    the Jericho missile (s_1).
  id: c_1
  satisfaction_condition: Node s_1 (workshop captivity and forced missile construction)
    happens before s_2 (secret arc reactor and armor building).
  type: ordering
  violation_condition: Player obtains knowledge, tools, or initiates armor construction
    without first being subjected to forced labor under terrorist coercion.
- description: Between s_1 and s_3, Stark and Yinsen's secrecy about building the
    arc reactor and armor must be maintained; terrorists must not know the project
    until s_3 trigger event.
  id: c_2
  satisfaction_condition: From s_1 until s_3, terrorists are unaware of Stark and
    Yinsen’s secret construction activities.
  type: invariant
  violation_condition: Player informs terrorists or system prematurely reveals armor
    construction to terrorists before s_3 trigger event.
- description: Yinsen’s self-sacrifice (s_3) enabling Stark to activate armor must
    happen strictly before Stark defeats terrorists and escapes (s_4).
  id: c_3
  satisfaction_condition: Yinsen’s sacrifice at s_3 occurs prior to Stark powering
    up and eliminating enemies at s_4.
  type: ordering
  violation_condition: Player bypasses Yinsen’s sacrifice and directly activates or
    uses armor to defeat terrorists.
- description: Stark must decide to abandon weapon manufacturing and commit to peaceful
    technology development after captivity (transition s_4 to s_5).
  id: c_4
  satisfaction_condition: Player explicitly halts weapon production at Stark Industries
    and starts peaceful technology work (s_5).
  type: achievement
  violation_condition: Player resumes or continues weapons manufacturing after the
    captivity and escape events instead of shifting focus.
- description: Stark's discovery of Jericho missiles being used by terrorists (s_6)
    must follow his suspension of weapons manufacturing (s_5) before retaliation (s_7).
  id: c_5
  satisfaction_condition: Player learns of weapon misuse by Ten Rings (via Christine
    Everhart) only after Stark suspends weapons production (after s_5) and before
    assaulting Afghanistan at s_7.
  type: ordering
  violation_condition: Player discovers terrorist use of weapons or reacts with violence
    prior to suspending weapons production or before s_6 event triggers.
- description: Stark’s secret identity as Iron Man remains undisclosed publicly before
    his intentional reveal at s_11.
  id: c_6
  satisfaction_condition: Prior to s_11, no NPC or player action publicly exposes
    Stark as Iron Man or leads to direct public knowledge.
  type: invariant
  violation_condition: Player or NPCs reveal Stark's Iron Man identity publicly before
    s_11 press conference reveal.
- description: Stane’s betrayal (evidence discovered at s_8) must precede Stark’s
    confrontation with Stane (s_9, s_10), ensuring logical buildup and discovery before
    combat.
  id: c_7
  satisfaction_condition: Player uncovers Stane's collusion with Ten Rings by s_8
    before any direct attack or ambush from Stane.
  type: ordering
  violation_condition: Stane attacks or steals arc reactor before sufficient player
    knowledge of his betrayal is established.
- description: Stark must regain power to operate armor by installing the original
    arc reactor after Stane steals the new one (s_9), ensuring no invincible armor
    usage prior.
  id: c_8
  satisfaction_condition: Player successfully reactivates armor with original arc
    reactor at s_9 before final fight with Stane.
  type: achievement
  violation_condition: Player uses full armor capabilities without first regaining
    power from original arc reactor post-stolen event.
- description: Defeat of Stane (s_10) must only occur after proper build-up of Stark’s
    regained capacities, Pepper’s hacking, and S.H.I.E.L.D. involvement (s_8 and s_9).
  id: c_9
  satisfaction_condition: Stane is defeated only after prior discovery, arc reactor
    recovery, and coordinated arrest attempt scenes.
  type: ordering
  violation_condition: Player kills or defeats Stane without preceding discovery or
    arc reactor theft/resolution events.
- description: Stark must publicly declare himself Iron Man (s_11), marking a fundamental
    narrative milestone and identity acceptance.
  id: c_10
  satisfaction_condition: Player chooses or the system triggers the public announcement
    of Stark's identity as Iron Man at s_11.
  type: achievement
  violation_condition: Narrative ends or progresses beyond s_11 without Stark revealing
    his identity publicly, leaving contradiction or secrecy intact.
- description: Introduction to the wider superhero world and Avengers Initiative by
    Nick Fury (s_12) must occur after Stark’s public reveal as Iron Man (s_11).
  id: c_11
  satisfaction_condition: Node s_11 occurs completely before s_12 introduction and
    engagement with Fury.
  type: ordering
  violation_condition: Fury approaches Stark with Avengers Initiative before Stark’s
    public identity declaration.
