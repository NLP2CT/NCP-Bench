commitments:
- description: The initial ambush by Acheron (s_0) must happen before Surprise can
    be damaged and forced into retreat (s_1), ensuring the cause-effect sequence of
    battle initiation and consequence.
  id: c_0
  satisfaction_condition: Node s_0 is completed before s_1 is reached; the ambush
    event precedes damage and retreat.
  type: ordering
  violation_condition: Player attempts to progress to damage/retreat state s_1 without
    the ambush event s_0 having occurred.
- description: From s_1 to s_3, Surprise remains heavily damaged, unsteerable, and
    forced into evasive maneuvers until proper repairs or decisive action occurs.
  id: c_1
  satisfaction_condition: During phases s_1 through s_3, the ship’s damage state and
    limited maneuverability remain active and acknowledged.
  type: invariant
  violation_condition: Player actions cause Surprise to be fully repaired, steered
    normally, or regain offensive capability before node s_3 completion.
- description: Aubrey’s knowledge of Acheron’s superiority and decision to pursue
    must precede any further pursuit actions or tactical gameplay responses (s_2 before
    s_3).
  id: c_2
  satisfaction_condition: The order to continue pursuit and risk ship damage (s_2)
    is confirmed before the second encounter and escape attempt (s_3).
  type: ordering
  violation_condition: Player initiates second encounter or evasion (s_3) before receiving
    or acknowledging the strategic assessment at s_2.
- description: The rescue of survivors from a whaling ship destroyed by Acheron at
    the Galapagos (s_4) is the event that confirms Acheron’s nearby presence and
    renews the chase.
  id: c_3
  satisfaction_condition: At s_4, rescuing the survivors and learning from their
    fate establishes that Acheron is operating near the Galapagos, motivating continued
    pursuit.
  type: ordering
  violation_condition: Player causes Acheron’s confirmed proximity at the Galapagos
    to be established before or independently of the survivor rescue event at s_4.
- description: Maturin’s injury (s_5) must be recognized and treated before continuing
    pursuit or battle preparedness, ensuring logical progression of medical priority.
  id: c_4
  satisfaction_condition: Maturin’s wound and need for shore surgery (s_5) is acknowledged
    prior to any renewed pursuit or combat escalation.
  type: ordering
  violation_condition: Player ignores or skips the injury event and orders pursuit
    or combat engagement before medical treatment initiation.
- description: Between s_5 and s_7, pursuit of Acheron is explicitly halted to prioritize
    Maturin’s surgery and recovery, enforcing an enforced narrative pause in the chase.
  id: c_5
  satisfaction_condition: No pursuit or combat attempts against Acheron occur while
    medical procedures and recovery at Galapagos are ongoing.
  type: invariant
  violation_condition: Player attempts to resume chase or engages Acheron before Maturin’s
    surgery and recovery phase at s_7 completes.
- description: Maturin must survive self-surgery and recovery (node s_6) to progress
    the narrative and allow resumption of pursuit activities.
  id: c_6
  satisfaction_condition: Maturin successfully completes surgery and survives, enabling
    further narrative progress past s_6.
  type: achievement
  violation_condition: Maturin dies or surgery fails, preventing continuation into
    subsequent narrative stages.
- description: Discovery of Acheron at the Galapagos by Maturin (s_7) must precede
    preparation for the decisive battle (s_8) to reflect narrative build-up.
  id: c_7
  satisfaction_condition: Node s_7 completes by locating Acheron on the island before
    any battle preparations at s_8 initiate.
  type: ordering
  violation_condition: Player attempts battle preparation or disguising Surprise as
    a whaler (s_8) before Acheron’s location is discovered at s_7.
- description: Between s_8 and s_9, Surprise is disguised as a whaler, and the enemy
    ship falls for the deception only after this tactic is implemented.
  id: c_8
  satisfaction_condition: Surprise’s disguise occurs before Acheron approaches and
    is disabled; no premature success in battle before deploying disguise.
  type: invariant
  violation_condition: Player gains battle advantage or disables Acheron without first
    executing the deception tactic at s_8.
- description: Acheron must be disabled and captured through boarding (s_9), marking
    the successful climax of the conflict phase.
  id: c_9
  satisfaction_condition: The boarding and capture of Acheron are completed, handing
    control firmly to Aubrey’s crew.
  type: achievement
  violation_condition: Battle ends without Acheron being disabled and captured, or
    player fails to initiate or complete boarding successfully.
- description: After capture (s_9), Aubrey’s confirmation of the enemy captain’s death
    and receipt of his sword (s_10) is required before proceeding to repairs and escort
    arrangements.
  id: c_10
  satisfaction_condition: Leadership transfer and prisoner identification completes
    at s_10 before preparations to escort Acheron begin.
  type: ordering
  violation_condition: Player attempts to proceed with escort or ship repairs and
    strategic decisions without verifying command transfer at s_10.
- description: Between s_10 and s_11, the identity deception of the false French captain
    remains undisclosed until Maturin reveals the truth.
  id: c_11
  satisfaction_condition: No player or NPC gains knowledge of the captain’s impersonation
    prior to node s_11.
  type: invariant
  violation_condition: Player uncovers or acts upon the captain’s fake identity before
    the narrative delivery at s_11.
- description: The narrative must reach the recognition of the enemy deception and
    ordering of the escort to Valparaíso (s_11) to conclude the careful resolution
    of the threat.
  id: c_12
  satisfaction_condition: Aubrey realizes deception and orders engagement (beat to
    quarters) and escort duty at s_11.
  type: achievement
  violation_condition: Player fails to uncover the deception or neglects to place
    escort under alert, ending the narrative unresolvably.
- description: All critical discoveries and key tactical choices follow the explicit
    s_i sequence as outlined in the Reference Trajectory, preventing out-of-order
    conclusions or premature narrative jumps.
  id: c_13
  satisfaction_condition: Progress through all narrative nodes s_0 to s_11 follows
    the numerical order without skipping required logical events.
  type: ordering
  violation_condition: Player actions or narrative logic attempt to jump forward,
    skipping intermediate node results or conclusions essential to story coherence.
