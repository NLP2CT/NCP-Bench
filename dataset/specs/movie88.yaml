meta:
  genres: ["Adventure", "War"]
  id: movie88
  player_role: Jack Aubrey
  title: "Master and Commander——The Far Side of the World"
synopsis: The film takes place in May 1805, during the Napoleonic Wars. Captain "Lucky
  Jack" Aubrey of HMS Surprise is ordered to pursue the French privateer Acheron,
  and "Sink, Burn, or take her a Prize." As the film opens, a crewmember aboard the
  British warship hears a bell sound and the ship becomes alert. As captain Aubrey
  looks through his telescope at the fog, he sees cannonfire, and the ship is ambushed
  by Acheron, a ship twice as large as the British warship. Surprise is heavily damaged,
  while its own cannon fire does not penetrate the enemy ship's hull. Later in the
  battle, Surprise's rudder is shot off and her helm is blown away, making the ship
  unsteerable, adding to the fact that the ship is taking water fast. Using smaller
  boats, the crew of Surprise tow the ship into a fog bank and evade pursuit. Aubrey
  learns from a crewman who saw Acheron being built that it is heavier and faster
  than Surprise, and the senior officers consider the ship out of their class. Aubrey
  notes that such a ship could tip the balance of power in Napoleon's favour if allowed
  to plunder the British whaling fleet at will. He orders pursuit of Acheron, rather
  than returning to port for repairs. Acheron again ambushes Surprise, but Aubrey
  slips away in the night by using a clever decoy buoy and ships lamps. Following
  the privateer south, Surprise rounds Cape Horn and heads to the Galapagos Islands,
  where Aubrey is sure Acheron will prey on Britain's whaling fleet. The ship's doctor,
  Maturin, is interested in the islands' fauna and flora; Aubrey promises his friend
  several days' exploration time. When Surprise reaches the Galapagos they recover
  the survivors of a whaling ship destroyed by Acheron. Realizing the ship is close,
  Aubrey hastily pursues the privateer. Maturin accuses Aubrey of going back on his
  word, and of following Acheron more out of pride rather than duty, something which
  Aubrey flatly denies, although not without acknowledging that he has exceeded his
  orders in pursuit of the privateer. Marine officer Captain Howard attempts to shoot
  an albatross, but accidentally hits Maturin. The surgeon's mate informs Aubrey that
  the bullet and a piece of cloth it took with it must be removed, but also that the
  operation should be performed on solid ground. Despite closing in on Acheron, Aubrey
  turns around and takes the doctor back to the Galapagos. Maturin performs surgery
  on himself using a mirror. Giving up the pursuit of the privateer, Aubrey grants
  Maturin the chance to explore the island and gather specimens before they head for
  home. On crossing the island looking for a species of flightless cormorant, the
  doctor discovers Acheron on the other side of the island. Abandoning most of his
  specimens, Maturin hastens back to warn Aubrey, and Surprise prepares for battle.
  Due to Acheron's sturdy hull, Surprise must get within very close range to deal
  damage, something which the officers consider almost impossible. However, after
  observing the camouflage ability of one of Maturin's specimens — a stick insect
  — Aubrey disguises Surprise as a whaling ship; he hopes the French would move close
  to capture the valuable ship rather than destroy it. The Acheron falls for the disguise
  and is disabled. Aubrey leads boarding parties across the wreckage, engaging in
  fierce hand-to-hand combat before the ship is captured. Looking for the Acheron's
  captain, Aubrey is directed to the sickbay, where a French doctor tells him the
  captain is dead and offers Aubrey the commander's sword. Acheron and Surprise are
  repaired; while Surprise will remain in the Galapagos, the captured Acheron is to
  be taken to Valparaíso. As Acheron sails away, Maturin mentions that their doctor
  had died months ago. Realizing the French captain deceived him by pretending to
  be the ship's doctor, Aubrey gives the order to beat to quarters and escort Acheron
  to Valparaíso. Maturin is again denied the chance to explore the Galapagos. Aubrey
  notes that since the bird Maturin seeks is flightless, "it's not going anywhere",
  and the two play a selection of Luigi Boccherini as the crew assumes battle stations.
trajectory:
- description: In May 1805, aboard HMS Surprise during the Napoleonic Wars, Captain
    Jack Aubrey stands watch. The ship is on alert with orders to pursue and capture
    or destroy the French privateer Acheron. The atmosphere is tense, and a shipboard
    crewmember hears a bell sound signaling heightened vigilance.
  id: s_0
  key_delta: The Surprise is ambushed by the larger French privateer Acheron, initiating
    combat that exposes Surprise's inferior firepower.
  trigger_event: Aubrey observes cannonfire through his telescope in the fog, revealing
    an ambush by Acheron.
- description: Surprise is heavily damaged from the ambush; its cannon fire fails
    to penetrate Acheron's hull. The ship’s rudder and helm are destroyed, leaving
    it unsteerable and taking on water rapidly amidst battle damage.
  id: s_1
  key_delta: Surprise escapes immediate danger by hiding in a fog bank, transitioning
    from active battle to retreat and repair mode.
  trigger_event: Surprise’s crew uses smaller boats to tow the damaged ship into a
    fog bank to evade further pursuit.
- description: Aubrey learns from a crewmember that Acheron is a heavier and faster
    ship, outclassing Surprise. Senior officers acknowledge the threat’s severity.
    Aubrey contemplates the risk to the British whaling fleet if Acheron remains free.
  id: s_2
  key_delta: Pursuit is prioritized over repairs based on the strategic threat Acheron
    poses to British interests.
  trigger_event: Aubrey orders the pursuit of Acheron to continue despite Surprise
    needing repairs.
- description: During a second encounter, Acheron ambushes Surprise again. The battle
    begins anew with Surprise attempting to evade.
  id: s_3
  key_delta: Surprise escapes a second ambush through deception but remains in active
    pursuit.
  trigger_event: Using a decoy buoy and ship’s lamps, Aubrey successfully slips away
    from Acheron under cover of night.
- description: Surprise sails south, rounding Cape Horn and reaching the Galapagos
    Islands, a known target of Acheron’s raiding.
  id: s_4
  key_delta: Confirmation of Acheron’s presence near the Galapagos and the continuation
    of Aubrey’s pursuit toward engagement.
  trigger_event: Surprise rescues survivors from a British whaling ship destroyed
    by Acheron upon arrival at the islands.
- description: While closing in on Acheron, Maturin is accidentally shot by a marine
    officer’s misfired weapon during a hunting attempt on the island.
  id: s_5
  key_delta: Maturin is wounded severely enough to require surgical intervention off
    the ship, halting the immediate pursuit.
  trigger_event: Surgeon’s mate reports the bullet wound requires an operation, which
    must be performed on stable ground.
- description: Aubrey decides to turn back to the Galapagos rather than continue pursuit,
    prioritizing Maturin’s surgery and recovery.
  id: s_6
  key_delta: Maturin survives a self-conducted surgery, and pursuit of Acheron is
    temporarily abandoned.
  trigger_event: Maturin performs surgery on himself using a mirror on shore at the
    Galapagos Islands.
- description: After recovery, Maturin is granted exploration time to study the islands'
    unique fauna, including the sought-after flightless cormorant.
  id: s_7
  key_delta: Acheron’s proximity is discovered on land, prompting Surprise to prepare
    for an imminent battle.
  trigger_event: While crossing the island, Maturin spots Acheron anchored nearby,
    renewing the immediate threat.
- description: Surprise prepares for combat, acknowledging the need to get within
    close range to damage the heavily armored Acheron.
  id: s_8
  key_delta: Surprise masquerades as a non-threatening whaler, setting a trap to engage
    Acheron in close combat.
  trigger_event: Aubrey implements a disguise for Surprise, camouflaging it as a whaling
    ship to lure Acheron close.
- description: Acheron is deceived by the disguise, approaches within range, and is
    disabled by Surprise’s attack.
  id: s_9
  key_delta: Acheron is captured after a brutal boarding action, shifting control
    to Aubrey and his crew.
  trigger_event: Aubrey leads boarding parties onto Acheron, engaging in fierce hand-to-hand
    combat.
- description: Aubrey searches for Acheron’s captain but learns from the French doctor
    in sickbay that the captain is dead; the doctor hands over the commander’s sword.
  id: s_10
  key_delta: The ship is secured under British control; the command structure of Acheron
    officially passes to Aubrey.
  trigger_event: Acheron and Surprise are repaired; plans are made to escort the captured
    Acheron to Valparaíso with Surprise remaining in the Galapagos.
- description: As Acheron departs, Maturin reveals their French doctor died months
    earlier, implying the captured captain had impersonated him.
  id: s_11
  key_delta: Aubrey recognizes the enemy’s last deception, securing vigilance while
    escorting the prize; Maturin again postpones his exploration.
  trigger_event: Aubrey orders Surprise to beat to quarters and escort Acheron to
    Valparaíso upon realizing the deception.
