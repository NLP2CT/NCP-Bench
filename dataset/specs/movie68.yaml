meta:
  genres: ["Sci-Fi", "Thriller"]
  id: movie68
  player_role: Agatha
  title: "Minority Report"
synopsis: In April 2054, Captain John Anderton is chief of the highly controversial
  Washington, D.C., PreCrime police force. They use future visions generated by three
  "precogs", mutated humans with precognitive abilities, to stop murders; because
  of this, the city has been murder-free for six years. Though Anderton is a respected
  member of the force, he is addicted to Neuroin, an illegal psychoactive drug. His
  addiction started following the disappearance of his son Sean, which also caused
  his wife Lara to leave him. With the PreCrime force poised to go nationwide, the
  system is audited by Danny Witwer, a member of the United States Justice Department.
  During the audit, the precogs predict that Anderton will murder a man named Leo
  Crow in 36 hours. Believing the incident to be a setup by Witwer, who is aware of
  Anderton's addiction, Anderton attempts to hide the case and quickly departs the
  area before Witwer begins a manhunt for him. Anderton seeks the advice of Dr. Iris
  Hineman, the lead researcher of the PreCrime technology. She explains to Anderton
  that sometimes the three precogs see different visions of the future, in which case
  the system only provides data on the two reports which agree; the "minority report",
  reflecting the potential future where a predicted killer would have done something
  different, is discarded. According to Dr. Hineman, the female precog Agatha is most
  likely to be the precog that witnesses the minority report. Anderton undergoes a
  dangerous underground eye replacement to avoid detection by the city's optical recognition
  system. He travels back to PreCrime and kidnaps Agatha, which disables the precogs'
  hive mind and shuts down the system. Anderton takes Agatha to a shopping mall, and
  a hacker, who extracts both Agatha's vision of Crow's murder—with no differences
  from the other two precogs, so there was no minority report—and another of the murder
  of a woman named Anne Lively—which Agatha also showed to Anderton the day before
  he was incriminated. Anderton and Agatha then head to the apartment where Crow is
  to be killed. Inside, Anderton finds hundreds of pictures of children, one of which
  is of his son, and concludes that Crow is responsible for Sean's disappearance.
  When Crow arrives, Anderton holds him at gunpoint, but ultimately decides to control
  his anger and places Crow under arrest instead. Crow admits that he was hired to
  plant these photos and then be killed, so his family would be paid handsomely. Since
  Anderton refuses to kill him, Crow grabs the officer's hand and makes him fire at
  point-blank range, effectively committing suicide by cop. On the run, Anderton and
  Agatha approach his ex-wife Lara for refuge. Anderton learns Lively was Agatha's
  former drug-addicted mother, once before a target of a failed murder attempt after
  requesting to see her daughter before her death. Anderton realizes that his knowledge
  of the Lively case is why he is being targeted. Meanwhile, Witwer assesses Crow's
  "murder" and doubts that Anderton killed him in cold blood. He comes to recognize
  that the archival footage of Lively's murder shows what appears to be a future echo
  by one of the visions, routinely discarded by PreCrime, which he realizes is a different
  murder as nearby water is rippling in a different direction from the original PreCrime
  vision. He suspects someone used this to stage the first murder attempt, and then
  recreated the setting to actually kill Lively and avoid being detected by PreCrime.
  Witwer realizes that the murderer would had to have been someone high up in PreCrime
  to have access to the vision, and reports these findings to PreCrime's Director
  Lamar Burgess. Burgess, noting that the PreCrime division is currently disabled
  due to Agatha's absence, kills Witwer and frames Anderton for that murder as well.
  The PreCrime unit eventually captures Anderton and restores Agatha to the system.
  Burgess attempts to comfort Lara, but accidentally reveals that he was the one that
  killed Lively. Lara acts on this information and frees Anderton at gunpoint. At
  a banquet to celebrate the success of the PreCrime unit attended by Burgess, Anderton
  plays back Agatha's vision of Lively's murder for the gathered crowd, which shows
  Burgess as the murderer. While Burgess begins to hunt down Anderton, a new PreCrime
  report is created——Anderton is the victim and Burgess, the murderer. When Burgess
  catches up to Anderton, Anderton explains the impossible situation——if Burgess kills
  Anderton, he proves the system works but at the cost of a life sentence, while if
  he does not, the system will not have worked and the PreCrime division will be shut
  down. Anderton explains the fundamental flaw in the system——if one knows his or
  her future, he or she can change it. Burgess resolves the dilemma by killing himself.
  The PreCrime program is shut down and the prisoners are unconditionally pardoned
  and released, though police departments keep watch on many of them. Anderton and
  Lara remarry and start a new family. The precogs are sent to an "undisclosed location",
  a small uncharted island in the North Atlantic Ocean to live out a full happy life
  in peace.
trajectory:
- description: Agatha is in the precogs' aquatic sensory tank, connected with the
    other two precogs in a hive mind system in the PreCrime facility. The environment
    is clinical, quiet except for the subtle hum of machinery supporting their precognitive
    visions. The PreCrime system is operational, scanning futures to detect murders.
  id: s_0
  key_delta: The precogs generate and output a majority report predicting Captain
    John Anderton will murder Leo Crow in 36 hours, initiating a potential case linked
    to Anderton.
  trigger_event: Precogs simultaneously receive a precognitive vision of an upcoming
    murder of Leo Crow.
- description: Agatha remains in the sensory tank but now her individual visions begin
    to diverge from the other two precogs. The PreCrime system continues running but
    is dependent on majority agreement among the precogs’ visions.
  id: s_1
  key_delta: A minority report vision emerges from Agatha of a separate murder attempt
    against Anne Lively, unknown to others and not reported by PreCrime.
  trigger_event: Agatha shows a different vision depicting the murder of Anne Lively,
    a woman unrelated to the majority report's murder case.
- description: Agatha's sensory tank input is disrupted as Captain Anderton forcibly
    extracts her from the hive mind to prevent the PreCrime system from functioning
    normally.
  id: s_2
  key_delta: PreCrime's hive mind is disabled; Agatha is physically removed from the
    system, halting standard precognitive murder predictions temporarily.
  trigger_event: Anderton kidnaps Agatha and severs her connection to the other precogs,
    shutting down the hive mind.
- description: Agatha and Anderton are now outside PreCrime, in a non-clinical environment—a
    shopping mall where Anderton has brought Agatha for interrogation via a hacker.
  id: s_3
  key_delta: Agatha reveals through extracted visions that Crow’s murder prediction
    is unanimous, and independently that Anne Lively’s death is a separate and real
    future event previously hidden from PreCrime.
  trigger_event: A hacker accesses Agatha’s isolated visions and extracts detailed
    future images of Crow’s murder with no minority report discrepancies and separate
    vision of Anne Lively’s murder.
- description: Agatha accompanies Anderton to the apartment where the predicted murder
    of Leo Crow is to take place. The surroundings are tense and lined with photographs.
  id: s_4
  key_delta: Agatha’s visions provide confirmation of Crow’s connection to Sean’s
    disappearance, solidifying the suspicion without external knowledge beyond her
    visions.
  trigger_event: Anderton discovers photographs of missing children, including his
    son Sean, inside Crow’s apartment.
- description: Agatha and Anderton witness the confrontation between Anderton and
    Crow near the predicted murder site. The environment is tightly controlled but
    fraught with danger.
  id: s_5
  key_delta: The predicted murder of Crow occurs but in a different manner than anticipated,
    validating Agatha’s vision accuracy while introducing new causal complexities.
  trigger_event: Crow seizes Anderton’s gun and forces him to fire, committing suicide
    by cop instead of being murdered.
- description: Agatha remains physically with Anderton as they seek refuge at Lara’s
    residence; the atmosphere is one of mistrust and tension. Lara is Anderton’s ex-wife.
  id: s_6
  key_delta: Agatha reveals contextual connections between Lively and herself; Lively
    was Agatha’s mother and a victim of a previous overlooked murder attempt.
  trigger_event: Anderton brings Agatha to Lara, who reacts to Agatha’s presence and
    the implications of the visions related to Anne Lively’s murder.
- description: Agatha is still with Anderton; the PreCrime facility is offline pending
    her restoration. The environment is charged with political and institutional intrigue.
  id: s_7
  key_delta: The PreCrime system is reactivated, but Agatha’s visions now enable key
    revelations exposing Lamar Burgess as the murderer of Anne Lively.
  trigger_event: Agatha is restored to the system by PreCrime after Anderton’s capture;
    her visions become available again to PreCrime leadership.
- description: At a PreCrime celebratory banquet, Agatha’s visions are publicly displayed,
    implicating Burgess. The room is formal and tense with underlying hostility.
  id: s_8
  key_delta: Burgess’s identity as a murderer is publicly exposed through Agatha’s
    direct vision, turning political power dynamics upside down and escalating conflict.
  trigger_event: Agatha’s recorded vision of Lively’s murder is played back, showing
    Burgess as the killer.
- description: Agatha is separated from PreCrime’s hive mind again as the institution
    collapses. The environment for her transitions to an undisclosed isolated location.
  id: s_9
  key_delta: Agatha and the precogs are removed from institutional control to live
    peacefully in isolation, ending their forced use for precognition in law enforcement.
  trigger_event: Following Burgess’s suicide and the shutdown of PreCrime, Agatha
    and the other precogs are relocated to a small, uncharted island in the North
    Atlantic.
