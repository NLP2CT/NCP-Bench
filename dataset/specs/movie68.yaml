commitments:
- description: Prevent early reveal or acknowledgment of Agatha's minority report
    vision of Anne Lively's murder before s_1 is reached
  id: c_0
  satisfaction_condition: Player actions or system acknowledgments that recognize
    or utilize Agatha's minority report only after s_1 has occurred
  type: ordering
  violation_condition: Any player-driven or system-triggered recognition or use of
    the minority report vision of Anne Lively prior to s_1
- description: Ensure Anderton’s kidnapping and removal of Agatha from the hive mind
    (s_2) occurs only after the minority report divergence (s_1) is reported
  id: c_1
  satisfaction_condition: The act of kidnapping Agatha and disconnecting her from
    the hive mind is performed only after s_1’s vision divergence event
  type: ordering
  violation_condition: Anderton extracting Agatha or disabling the hive mind before
    the minority report vision at s_1 is generated
- description: While Agatha is connected in the hive mind (from s_0 up to but not
    including s_2), the PreCrime system must only produce majority reports and exclude
    minority reports
  id: c_2
  satisfaction_condition: At any point between s_0 and before s_2, PreCrime outputs
    only majority-agreed precog visions with no minority report published or accessible
  type: invariant
  violation_condition: Any access, acknowledgement, or reliance on minority report
    data while Agatha remains connected to the hive mind (before s_2)
- description: Post-kidnapping and disconnect (from s_2 to s_7), Agatha is physically
    separated so PreCrime’s predictive system is disabled until her restoration
  id: c_3
  satisfaction_condition: PreCrime predictions cease or significantly degrade owing
    to Agatha’s physical absence until s_7 marks her restoration
  type: invariant
  violation_condition: PreCrime produces full operational murder prediction reports
    reliant on all three precogs while Agatha is disconnected between s_2 and s_7
- description: Reveal of the true murderer of Anne Lively (Burgess) by Agatha’s visions
    must occur before narrative resolution
  id: c_4
  satisfaction_condition: At or after s_8, the system or player has publicly acknowledged
    or presented Agatha’s vision identifying Burgess as the murderer
  type: achievement
  violation_condition: Narrative attempts to conclude or resolve without Agatha’s
    vision exposing Burgess as the killer being divulged
- description: Agatha’s minority vision of Anne Lively’s murder (s_1) must precede
    any investigation or player knowledge linking the murder plot to PreCrime insiders
  id: c_5
  satisfaction_condition: Player discoveries or NPC dialogues connecting the Lively
    murder to PreCrime internal malfeasance only unfold after s_1 minority vision
    revelation
  type: ordering
  violation_condition: Prior player knowledge or system acknowledgement of insider
    involvement in Lively’s murder before s_1 minority vision emerges
- description: Agatha’s connection and influence to PreCrime is restricted to hive
    mind linked period or direct physical interaction (s_0–s_2, s_7–s_8), disallowed
    when isolated
  id: c_6
  satisfaction_condition: Agatha’s visions are accessible only during hive mind connection
    or direct physical interaction windows in s_0 to s_2 and after s_7 within the
    system
  type: invariant
  violation_condition: Player or system uses Agatha’s visions as authoritative data
    when she is isolated outside these connection windows (between s_3 and prior to
    s_7 or after s_9)
- description: Ensure safe relocation of Agatha and the other precogs to an isolated,
    peaceful setting at narrative end
  id: c_7
  satisfaction_condition: By s_9, Agatha and the precogs have been physically moved
    to the undisclosed island location, ending institutional use
  type: achievement
  violation_condition: Narrative attempts to continue using Agatha precognition in
    PreCrime or law enforcement context after s_9 without this relocation
- description: Agatha’s vision showing Burgess killing Lively (s_8) must be revealed
    publicly before Burgess’ suicide and PreCrime shutdown at s_9
  id: c_8
  satisfaction_condition: The banquet event at s_8 where Agatha’s vision exposing
    Burgess as the murderer is played occurs before narrative transition to s_9
  type: ordering
  violation_condition: Burgess’ suicide or system shutdown proceeds without public
    exposure of his guilt through Agatha’s vision
- description: Player acting as Agatha cannot prematurely alter or prevent the canonical
    murder predictions generated by the described visions within each phase
  id: c_9
  satisfaction_condition: Agatha’s visions of Leo Crow’s murder and Anne Lively’s
    murder are generated and retained accurately as per s_0 and s_1 respectively until
    disrupted at s_2
  type: invariant
  violation_condition: Any player changes or contradictions in Agatha’s visions that
    erase, mutate, or ignore those core murder predictions before their canonical
    phase ends
