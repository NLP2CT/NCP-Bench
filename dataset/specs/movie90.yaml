commitments:
- description: Mortimer’s bounty collection on Guy Calloway (s_1) must occur before
    Manco kills Red 'Baby' Cavanagh (s_2), ensuring the proper establishment of bounty
    targets and territorial tension.
  id: c_0
  satisfaction_condition: Node s_1 has been completed before node s_2 is triggered
    in the narrative progression.
  type: ordering
  violation_condition: Manco kills Red 'Baby' Cavanagh (s_2) before Mortimer collects
    bounty on Guy Calloway (s_1).
- description: Manco and Mortimer must meet (s_3) before forming their alliance to
    pursue Indio’s gang (s_4), so collaboration logically follows acknowledgment of
    each other.
  id: c_1
  satisfaction_condition: Node s_3 (their meeting) is completed prior to node s_4
    (deciding to team up).
  type: ordering
  violation_condition: Player action or narrative events start teamwork or infiltration
    (s_4) without the prior meeting (s_3).
- description: Between s_4 and s_5, Manco must maintain cover as a member of Indio's gang, preserving the infiltration premise critical for inside access to the robbery
    and subsequent plans.
  id: c_2
  satisfaction_condition: Throughout nodes s_4 to s_5, Manco is recognized and treated as part of Indio’s gang by NPCs and narrative logic.
  type: invariant
  violation_condition: At any point between s_4 and s_5, Manco’s gang membership is
    exposed or revoked, breaking the infiltration status.
- description: The major bank robbery event (s_4) must occur before Manco and Mortimer
    plan to steal the money (s_6), enforcing the logical progression from heist to
    counter-heist.
  id: c_3
  satisfaction_condition: Node s_4 is completed before node s_6 is triggered.
  type: ordering
  violation_condition: Attempt to steal the bank money (s_6) before the robbery itself
    has taken place (s_4).
- description: Between s_8 and the standoff at s_10, Indio’s musical pocketwatch must
    be the unique trigger for the gun duel start, so the iconic duel setup is unchanged.
  id: c_4
  satisfaction_condition: At s_8 and s_9, Indio’s pocketwatch chimes serve as the
    exclusive signal to commence the duel.
  type: invariant
  violation_condition: The duel begins without Indio playing the pocketwatch or the
    timing signal being different than the watch’s chimes.
- description: Manco’s intervention with an identical pocketwatch and provision of
    a Volcanic Rifle must precede the gun duel between Mortimer and Indio (s_9 before
    s_10), to balance combat odds.
  id: c_5
  satisfaction_condition: Node s_9 occurs fully before the actual duel duel event
    (s_10).
  type: ordering
  violation_condition: Mortimer and Indio’s duel begins (s_10) without Manco appearing
    and providing assistance with the second pocketwatch and rifle (s_9).
- description: The revelation of Mortimer’s sister in the pocketwatch photo and Mortimer's
    killing of Indio for revenge (s_10) must precede Mortimer’s refusal of bounty
    and the accounting of money by Manco (s_11) to preserve narrative causality.
  id: c_6
  satisfaction_condition: Node s_10 is completed before node s_11.
  type: ordering
  violation_condition: Player actions or narrative allow Mortimer to refuse bounty
    or reveal sister before killing Indio and acquiring the watch.
- description: Throughout nodes s_0 to s_12, the core threat of Indio’s gang remains until the final cleanup at s_12, disallowing premature
    resolution or removal of key enemies.
  id: c_7
  satisfaction_condition: The narrative conflict with the gang persists until the final confrontation at node s_12 is completed.
  type: invariant
  violation_condition: The gang threat is entirely resolved or Manco leaves the territory before the final confrontation at s_12.
- description: The narrative must culminate in Manco eliminating Groggy (s_12) to
    prevent unresolved threats and ensure the final resolution of conflict.
  id: c_8
  satisfaction_condition: Player triggers Groggy’s death during or at s_12, confirming
    all hostile threats are neutralized.
  type: achievement
  violation_condition: Player allows Groggy to survive and threaten Manco or prevent
    Groggy’s death before the narrative end.
- description: Manco’s final collection of the stolen Bank of El Paso money must come
    after eliminating all gang members (s_12), ensuring the loot possession occurs
    only after complete gang neutralization.
  id: c_9
  satisfaction_condition: Manco’s acquisition of the bank money happens only after
    all enemies have been killed at s_12.
  type: ordering
  violation_condition: Loot is acquired by Manco before the gang is fully dealt with
    or gang members remain alive after money is taken.
