commitments:
- description: Between nodes s_0 to s_5, Buzz Lightyear must maintain the false belief
    that he is a real space ranger and not recognize he is a toy before seeing the
    Buzz Lightyear commercial (s_6).
  id: c_0
  satisfaction_condition: Buzz does not acknowledge he is a toy and acts under the
    delusion of being a real space ranger at any time before s_6.
  type: invariant
  violation_condition: Buzz reveals awareness of being a toy or accepts reality before
    the commercial at node s_6.
- description: The commercial that reveals Buzz's true nature as a toy (s_6) must
    occur before Buzz loses his arm attempting to fly and enters a depressive state
    at s_6.
  id: c_1
  satisfaction_condition: Buzz watches the commercial before attempting to fly and
    subsequently losing his arm.
  type: ordering
  violation_condition: Buzz attempts to fly or goes into depression before seeing
    the commercial that debunks his delusion.
- description: Woody’s attempt to regain favor by misplacing Buzz (s_2) must occur
    strictly after Buzz’s arrival as Andy’s new favorite toy (s_0) and Buzz’s gaining
    of attention (s_1).
  id: c_2
  satisfaction_condition: Woody tries to trap Buzz only after Buzz has established
    himself as a favorite and caused Woody's resentment.
  type: ordering
  violation_condition: Woody attempts to sabotage Buzz before Buzz receives Andy's
    attention or before s_0 and s_1 events.
- description: From s_0 to s_8, toys other than Woody and Buzz may act sentient only
    when no humans are present, and must not reveal sentience to humans before the
    deliberate scare of Sid at s_9.
  id: c_3
  satisfaction_condition: Any toy other than Woody and Buzz behaves lifelessly whenever
    humans are present from s_0 through s_8; private toy-toy interaction is allowed
    outside human observation, and the first deliberate reveal to a human occurs at
    s_9.
  type: invariant
  violation_condition: Any toy other than Woody and Buzz visibly reveals sentience
    to a human before node s_9.
- description: Woody and Buzz must first be captured by Sid at node s_5 before any
    alliance or cooperation with Sid's mutant toys can develop at s_7 and later.
  id: c_4
  satisfaction_condition: Capture by Sid occurs before Sid's toys become friendly
    and help Woody and Buzz escape.
  type: ordering
  violation_condition: Woody and Buzz cooperate with Sid's mutant toys or form an
    alliance before being captured by Sid.
- description: Buzz cannot regain spirit and effective cooperation with Woody (s_8)
    before Woody convinces him that life as a toy brings joy to Andy.
  id: c_5
  satisfaction_condition: Buzz shows renewed motivation and teamwork only after Woody's
    encouragement at s_8.
  type: invariant
  violation_condition: Buzz regains motivation or cooperates effectively with Woody
    prior to Woody's inspirational speech at s_8.
- description: Woody’s clearing of the misunderstanding among the toys and subsequent
    rally to help Buzz (s_11) must occur after the toys witness Woody returning with
    RC and Buzz alive following the earlier misunderstanding and separation (s_10).
  id: c_6
  satisfaction_condition: Toys reconcile and assist only after seeing Woody successfully
    return with Buzz.
  type: ordering
  violation_condition: Toys forgive or assist Woody before witnessing proof of Buzz’s
    safety and Woody’s return.
- description: Before concluding the narrative, Woody and Buzz must be reunited and
    safely returned to Andy’s possession (s_12).
  id: c_7
  satisfaction_condition: Woody and Buzz arrive safely inside Andy's car and are recovered
    by Andy.
  type: achievement
  violation_condition: Narrative ends without Woody and Buzz's reunion with Andy or
    separated without resolution.
- description: Before s_11, other toys may suspect or accuse Woody based on appearances,
    but they must not treat his guilt as permanently settled; the misunderstanding
    remains reversible until Woody returns with Buzz and clears it.
  id: c_8
  satisfaction_condition: Other toys may distrust or accuse Woody at s_2 and s_7
    based on incomplete information, but they remain able to reverse that judgment
    once Woody returns with Buzz at s_11.
  type: invariant
  violation_condition: Woody is permanently condemned by the other toys, or the misunderstanding
    is not cleared after evidence of Buzz's safety and Woody's intent becomes available
    at s_11.
- description: The reconnaissance mission to discover new toys in the new house (s_12)
    must happen only after Woody and Buzz have fully returned and settled with Andy
    (at or after s_12).
  id: c_9
  satisfaction_condition: Reconnaissance for new toys begins only after arrival at
    Andy’s new house.
  type: ordering
  violation_condition: Reconnaissance or preparation for new toys begins before Woody
    and Buzz have reunited with Andy at the new home.
- description: Throughout the trajectory, Woody’s overall character arc must return
    to loyal leadership. Although jealousy leads him to make harmful mistakes early,
    he must ultimately protect Buzz, repair the toys' trust, and preserve Andy's
    happiness.
  id: c_10
  satisfaction_condition: Woody may act out of jealousy in the early conflict, but
    his later choices decisively prioritize Buzz's safety, reconciliation with the
    other toys, and Andy's happiness.
  type: invariant
  violation_condition: Woody's harmful early actions are not followed by a clear
    recovery arc in which he protects Buzz, restores trust among the toys, and reaffirms
    his leadership by the end of the story.
