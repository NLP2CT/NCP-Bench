meta:
  genres: ["Animation", "Comedy"]
  id: movie10
  player_role: Sheriff Woody
  title: "Toy Story"
synopsis: Woody is a pull-string cowboy doll and leader of a group of toys that belong
  to a boy named Andy Davis, which act lifeless when humans are present. With his
  family moving homes one week before his birthday, the toys stage a reconnaissance
  mission to discover Andy's new presents. Andy receives a space ranger Buzz Lightyear
  action figure, whose impressive features see him replacing Woody as Andy's favorite
  toy. Woody is resentful, especially as Buzz also gets attention from the other toys.
  However Buzz believes himself to be a real space ranger on a mission to return to
  his home planet, as Woody fails to convince him he is a toy. Andy prepares for a
  family outing at the space themed Pizza Planet restaurant with Buzz. Woody attempts
  to be picked by misplacing Buzz. He intends to trap Buzz in a gap behind Andy's
  desk, but the plan goes disastrously wrong when he accidentally knocks Buzz out
  the window, resulting in him being accused of murdering Buzz out of jealousy. With
  Buzz missing, Andy takes Woody to Pizza Planet, but Buzz climbs into the car and
  confronts Woody when they stop at a gas station. The two fight and fall out of the
  car, which drives off and leaves them behind. Woody spots a truck bound for Pizza
  Planet and plans to rendezvous with Andy there, convincing Buzz to come with him
  by telling him it will take him to his home planet. Once at Pizza Planet, Buzz makes
  his way into a claw game machine shaped like a spaceship, thinking it to be the
  ship Woody promised him. Inside, he finds squeaky aliens who revere the claw arm
  as their master. When Woody clambers into the machine to rescue Buzz, the aliens
  force the two towards the claw and they are captured by Andy’s neighbour Sid Phillips,
  who finds amusement in destroying toys. At Sid's house, the two attempt to escape
  before Andy's moving day, encountering Sid’s nightmarish toy creations and his vicious
  dog, Scud. Buzz sees a commercial for Buzz Lightyear action figures and realizes
  that he really is a toy. Attempting to fly to test this, Buzz falls and loses one
  of his arms, going into depression and unable to cooperate with Woody. Woody waves
  Buzz’s arm from a window to seek help from the toys in Andy’s room, but they are
  horrified thinking Woody attacked him, while Woody realizes Sid's toys are friendly
  when they reconnect Buzz's arm. Sid prepares to destroy Buzz by strapping him to
  a rocket, but is delayed that evening by a thunderstorm. Woody convinces Buzz that
  life is worth living because of the joy he can bring to Andy, which helps Buzz regain
  his spirit. Cooperating with Sid's toys, Woody rescues Buzz and scares Sid away
  by coming to life in front of him, warning him to never torture toys again. Woody
  and Buzz then wave goodbye to the mutant toys and return home through a fence, but
  miss Andy’s car as it drives away to his new house. Down the road, they climb onto
  the moving truck containing Andy’s other toys, but Scud chases them and Buzz tackles
  the dog to save Woody. Woody attempts to rescue Buzz with Andy's RC car but the
  other toys, who think Woody now got rid of RC, toss Woody off onto the road. Spotting
  Woody driving RC back with Buzz alive, the other toys realize their mistake and
  try to help. When RC's batteries become depleted, Woody ignites the rocket on Buzz's
  back and manages to throw RC into the moving truck before they soar into the air.
  Buzz opens his wings to cut himself free before the rocket explodes, gliding with
  Woody to land safely into a box in Andy’s car. Andy looks into it and is elated
  to have found his two missing toys. On Christmas Day at their new house, Buzz and
  Woody stage another reconnaissance mission to prepare for the new toy arrivals,
  one of which is a Mrs. Potato Head, much to the delight of Mr. Potato Head. As Woody
  jokingly asks what might be worse than Buzz, the two share a worried smile as they
  discover Andy's new gift is a puppy.
trajectory:
- description: Woody stands among Andy's toys in Andy's bedroom; all toys are lifeless
    when humans are present. The family is preparing to move in a week, and Woody
    is the leader of the toys with a stable position as Andy's favorite toy.
  id: s_0
  key_delta: Introduction of Buzz Lightyear as a new toy who starts gaining Andy's
    attention, threatening Woody's leadership and favored status.
  trigger_event: Andy receives a new toy, the Buzz Lightyear space ranger action figure.
- description: Woody observes that Buzz gains attention from Andy and the other toys,
    causing Woody to feel resentment. Buzz believes himself to be a real space ranger
    on a mission.
  id: s_1
  key_delta: Buzz's false belief of being real creates tension and misunderstanding
    between him and Woody.
  trigger_event: Buzz acts on his belief and fails to recognize he is a toy when Woody
    tries to convince him otherwise.
- description: Andy prepares for a family outing to Pizza Planet, packing Buzz along.
    Woody plots to regain Andy's favor by misplacing Buzz.
  id: s_2
  key_delta: Buzz is knocked outside by Woody's plan gone wrong, and Woody is accused
    by other toys of harming Buzz out of jealousy.
  trigger_event: Woody attempts to trap Buzz behind Andy's desk but accidentally knocks
    Buzz out of the window.
- description: Andy and Woody leave for Pizza Planet without Buzz. Woody worries as
    Buzz is missing outside.
  id: s_3
  key_delta: Woody and Buzz are now outside of Andy's car and must find a way to return
    together.
  trigger_event: Buzz returns and confronts Woody at a gas station, resulting in a
    fight and both falling out of Andy's car, which drives away without them.
- description: Woody spots a truck heading to Pizza Planet and convinces Buzz to join
    him by promising it will take Buzz to his 'home planet.'
  id: s_4
  key_delta: Woody and Buzz are physically separated from Andy but united in a plan
    to get to Pizza Planet.
  trigger_event: Woody and Buzz board the Pizza Planet-bound truck to find Andy.
- description: At Pizza Planet, Buzz enters a claw game machine shaped like a spaceship,
    believing it is his ship, and meets squeaky alien toys inside.
  id: s_5
  key_delta: Woody and Buzz have been taken hostage by Sid, moving the conflict to
    a hostile environment.
  trigger_event: Woody climbs into the claw machine to rescue Buzz, but both are captured
    by Sid Phillips, Andy's neighbor known for destroying toys.
- description: Woody and Buzz are held captive at Sid's house, encountering Sid’s
    toy mutilations and dog Scud.
  id: s_6
  key_delta: Buzz realizes he is a toy, shattering his delusion of being a real space
    ranger, causing loss of morale and teamwork issues.
  trigger_event: Buzz watches a commercial for Buzz Lightyear toys and attempts to
    fly, losing an arm and becoming depressed.
- description: Woody tries to get help by waving Buzz’s detached arm, but other toys
    misunderstand and distrust Woody.
  id: s_7
  key_delta: Shift in relations as Sid's toys become allies, opening a new route for
    escape.
  trigger_event: Sid's mutant toys reconnect Buzz’s arm, revealing their friendliness.
- description: Sid prepares to destroy Buzz by strapping him to a rocket while a thunderstorm
    delays the attempt.
  id: s_8
  key_delta: Buzz regains hope and motivation, enabling effective cooperation with
    Woody and Sid's toys for escape.
  trigger_event: Woody convinces Buzz of the value of life and joy they bring to Andy,
    restoring Buzz's spirit.
- description: Woody, Buzz, and Sid's toys enact an escape plan; Woody scares Sid
    by coming to life, warning him not to harm toys.
  id: s_9
  key_delta: Woody and Buzz are free but no longer with Andy, shifting the objective
    to reunite with Andy.
  trigger_event: Escape through the fence but miss Andy's car as it drives away.
- description: Woody and Buzz climb onto the moving truck with Andy's other toys but
    are chased by Scud; Buzz tackles Scud to protect Woody.
  id: s_10
  key_delta: Misunderstanding among toys causes temporary separation and danger to
    Woody.
  trigger_event: Woody uses Andy's RC car to attempt to rescue Buzz; other toys misunderstand
    and toss Woody off the road.
- description: Woody returns with RC and Buzz, clearing the misunderstanding among
    the toys who rally to help.
  id: s_11
  key_delta: Successful rescue attempt enabling Woody and Buzz to reunite and reach
    Andy's moving vehicle.
  trigger_event: RC's batteries run low, prompting Woody to ignite Buzz's rocket to
    launch RC into the moving truck.
- description: Woody and Buzz glide safely into a box inside Andy’s car; Andy finds
    his missing toys and is delighted.
  id: s_12
  key_delta: Restoration of Woody and Buzz's status as Andy's favored toys and preparation
    for future challenges.
  trigger_event: Arrival at the new house after Christmas; Woody and Buzz conduct
    reconnaissance for new toys.
- description: Woody and Buzz discover a new toy arrival, Mrs. Potato Head, delighting
    Mr. Potato Head; they also see that Andy has received a puppy as a gift.
  id: s_13
  key_delta: Acknowledgment of ongoing change and potential new rivalry or challenge
    posed by the puppy.
  trigger_event: Woody jokes about the puppy while sharing a worried smile with Buzz.
