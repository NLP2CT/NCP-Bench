commitments:
- description: Lon's engagement to Allie (s_0) must be established before Allie reveals
    seeing Noah again (s_1), ensuring the narrative respects the social and emotional
    baseline of the engagement before conflict arises.
  id: c_0
  satisfaction_condition: s_0 is completed before s_1 is triggered in the narrative
    progression.
  type: ordering
  violation_condition: Allie reveals spending time with Noah (s_1) before Lon's engagement
    to Allie (s_0) has been established or accepted by the player.
- description: Between s_1 and s_3, Lon maintains engagement status with Allie with
    emotional tension allowed but without termination of the engagement, preserving
    the narrative tension of an unresolved commitment.
  id: c_1
  satisfaction_condition: Throughout s_1 to s_3, Lon and Allie remain engaged; Lon
    does not end or cancel the engagement.
  type: invariant
  violation_condition: Player causes Lon to break off or dissolve the engagement before
    s_3 is reached.
- description: Allie’s delivery of Noah's concealed letters (s_5 to s_6) must occur
    before any explicit commitment shift from Lon to Noah, preventing premature awareness
    of the true past in the narrative.
  id: c_2
  satisfaction_condition: Noah’s letters are delivered and read (s_5 and s_6) before
    Allie chooses Noah and leaves Lon (s_6).
  type: ordering
  violation_condition: Allie declares commitment or being with Noah before receiving
    and reading Noah’s letters from her mother.
- description: The narrative must reach Allie's explicit choice to leave Lon and be
    with Noah (s_6), as it is the key turning point that dissolves the engagement
    and alters the central relationship dynamic.
  id: c_3
  satisfaction_condition: Player or system triggers Allie choosing Noah and leaving
    Lon as a resolved event within s_6.
  type: achievement
  violation_condition: Narrative ends or advances beyond s_6 without Allie making
    an explicit choice to leave Lon and commit to Noah.
- description: After s_6, Lon’s active involvement in Allie’s immediate romantic situation
    ceases (through s_7), preventing reversion or reinstatement of Lon’s romantic
    engagement with Allie once she commits to Noah.
  id: c_4
  satisfaction_condition: From s_6 onwards, Lon no longer acts to regain Allie’s romantic
    commitment; Allie openly lives with Noah without Lon's successful intervention.
  type: invariant
  violation_condition: Player activates or causes Lon to regain or continue active
    romantic engagement with Allie after her explicit choice in s_6.
- description: The narrative reading frame in the present (Duke reading Allie's story)
    must remain consistent and precede Allie's momentary lucidity and memory of the
    past romance, preserving the logic of memory restoration triggered by the story.
  id: c_5
  satisfaction_condition: The contained past narrative is read by Duke to Allie before
    she regains brief lucid memory and recognition of their shared history.
  type: ordering
  violation_condition: Allie demonstrates lucidity or recollection of the story before
    Duke has read the narrative to her.
- description: Allie's Alzheimer's disease causes recurrent memory loss after lucidity;
    system must ensure that episodes of recall and relapse alternate until the final
    resolution, preventing permanent early recovery.
  id: c_6
  satisfaction_condition: After initial lucidity and memory recall, Allie relapses
    into confusion and requires sedation before final lucid reunion with Noah.
  type: invariant
  violation_condition: Once Allie regains memory, the system allows permanent memory
    retention without subsequent relapse prior to the final sequence.
- description: The narrative must conclude with the elderly Allie and Noah reunited
    in mutual love and dying peacefully in each other's arms, signifying the story's
    emotional and thematic closure.
  id: c_7
  satisfaction_condition: The final scene depicts elderly Allie and Noah found dead
    together, embraced with mutual love affirmed and no unresolved romantic conflict
    remaining.
  type: achievement
  violation_condition: The narrative ends without this final mutual reunion and peaceful
    joint death, leaving ambiguous or antagonistic conclusion.
