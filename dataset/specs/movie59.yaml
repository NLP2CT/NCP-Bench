meta:
  genres: ["Fantasy", "Action"]
  id: movie59
  player_role: Nizam
  title: "Prince of Persia——The Sands of Time"
synopsis: An attack on the sacred city of Alamut is planned by Dastan, an orphan in
  the Persian Empire adopted by King Sharaman; his royal-blooded adoptive brothers,
  Tus and Garsiv; and his uncle, Nizam, after Alamut is believed to be selling weapons
  to Persia's enemies. Dastan leads a surprise attack to open the city's gates to
  allow the army in; during the ensuing battle, Dastan comes into possession of a
  unique dagger. Alamut's princess, Tamina, is arrested and agrees to marry Tus in
  order to achieve peace after noticing Dastan's dagger. Dastan unknowingly presents
  a poisoned robe, given to him by Tus, to his father, who dies upon donning it. After
  being blamed for the murder, Dastan flees Alamut with Tamina. When Tamina attempts
  to kill the prince, Dastan discovers the dagger can reverse time and only the one
  who activates it is aware of what happened. After an encounter with shady ostrich
  racing-organizer Sheik and his men, Dastan and Tamina head to Avrat for Sharaman's
  funeral. Dastan attempts to convince Nizam that he did not kill his father but Garsiv
  and the city guards appear and attack Dastan and he is forced to escape. Dastan
  catches up with Tamina and explains that Nizam was behind the murder because his
  hands were burned. Once Tamina finally explains everything about the Dagger, Dastan
  realizes why Nizam wants the Dagger of Time——to use it with the massive Sandglass
  to go back in time and undo saving Sharaman from a lion so he could become king.
  He fabricated the false allegations that Alamut had been dealing weapons to Persia's
  enemies so that he would have the opportunity to search the city for the Sandglass.
  However, Tamina warns that opening the Sandglass would release the sands, triggering
  an apocalyptic sandstorm that would destroy the entire world. Meanwhile, Nizam hires
  the lethal Hassansins to slay Dastan. Dastan and Tamina are again captured by Sheik
  Amar, seeking to rebuild his ruined business by turning them in for bounty. But
  that night, the Hassansin leader, Zolm attacks the group with vipers, which are
  killed by Dastan with the dagger. Amar decides to go along with Dastan and Tamina
  to a secret sanctuary near India. They run into Garsiv's men. Dastan manages to
  persuade his brother that he is innocent, only for Garsiv to be fatally wounded
  by a Hassansin. The Hassansins attack, while Dastan and Tamina sneak away to the
  secret cave where they can hide the Dagger. After Dastan prevents Tamina from giving
  up her life to protect the Dagger, they are found and Zolm manages to snatch the
  Dagger of Time from Tamina. Garsiv saves Dastan from a Hassansin just before he
  dies. The group returns to Alamut to reveal the truth about Nizam and the Dagger
  to Tus. Seso manages to take back the Dagger after a battle with Setam, the Hassansin
  who killed Garsiv, that ends up killing both men. Dastan confronts Tus and explains
  the dagger's mechanics to him and then stabs the dagger into his heart, killing
  himself. Tus brings Dastan back to life by rewinding time and realizes his brother
  has been innocent all along. But Nizam arrives, kills Tus, and takes the Dagger,
  leaving a Hassansin, Ghazab, to kill Dastan. Tamina arrives to help Dastan defeat
  Ghazab as Nizam goes to the Sandglass caves beneath Alamut. Dastan and Tamina go
  behind, and on the way Tamina kills Zolm with the Hassansin's own snake, while preventing
  him from killing Dastan. The pair share a kiss. They reach Nizam before he can pierce
  the Sandglass with the Dagger, but he knocks Tamina and Dastan over the edge. Dastan
  grabs hold of Tamina. Admitting that she loves him, Tamina asks Dastan to stop Nizam,
  saying it's been his destiny all along. She lets go of his hand, leaving Dastan
  devastated. Dastan pulls himself up just as Nizam stabs the Sandglass with the Dagger.
  Dastan grabs hold and activates the dagger. This causes Dastan to go back to the
  immediate aftermath of the invasion of Alamut. Dastan reveals Nizam's treachery.
  Nizam, realizing the allegation will be confirmed by an investigation ordered by
  Tus, attacks Dastan, but is eventually stabbed in the chest by Tus's blade and dies.
  After apologizing for the ransacking of her city, Tus suggests that perhaps Tamina
  should become Dastan's wife as a sign of good will since he is the "conqueror and
  savior of her city". Prince Dastan returns the Dagger of Time to Tamina and the
  two take a walk together. During their conversation, Dastan hints at his knowledge
  of the dagger's power and tells Tamina that he looks forward to a future with her.
trajectory:
- description: Nizam is in the Persian royal court, where Dastan, an orphaned adopted
    prince, and his royal adoptive brothers Tus and Garsiv live under King Sharaman.
    Suspicion is growing about Alamut allegedly trading weapons to enemies of Persia,
    and tensions simmer beneath the surface.
  id: s_0
  key_delta: The Persian Empire plans a coordinated attack on Alamut with Nizam working
    alongside the royal family to justify the assault.
  trigger_event: King Sharaman and his princes prepare to launch a preemptive strike
    on Alamut based on intel of arms trafficking.
- description: Alamut is under surprise attack; Dastan leads the assault and opens
    the city gates to the Persian army. Amidst chaos, Dastan comes into possession
    of a mysterious dagger with unique properties.
  id: s_1
  key_delta: The dagger's acquisition introduces a powerful artifact into the conflict
    unknown to others, altering future events.
  trigger_event: Dastan breaches Alamut’s defenses and finds the unique dagger during
    the battle.
- description: Princess Tamina of Alamut is captured and agrees to marry Tus to secure
    peace, recognizing Dastan's dagger as significant.
  id: s_2
  key_delta: A political alliance is formed to maintain peace, but latent mistrust
    persists between factions.
  trigger_event: Tamina is formally arrested and consents to the political marriage
    proposal by Tus.
- description: Dastan unknowingly presents a poisoned robe, given to him by Tus, to
    King Sharaman, who dies after wearing it.
  id: s_3
  key_delta: King Sharaman’s death triggers political chaos; Dastan becomes the prime
    suspect in a murder plot.
  trigger_event: King Sharaman dons the poisoned robe at a royal gathering.
- description: Dastan, blamed for the king’s death, flees Alamut accompanied by Princess
    Tamina who initially attempts to kill him.
  id: s_4
  key_delta: Dastan enters exile, and Tamina’s perception of him begins to shift as
    they flee together.
  trigger_event: Dastan escapes the palace grounds with Tamina following an escalating
    confrontation.
- description: During the journey, Dastan discovers the dagger's power to reverse
    time locally, while only the activator retains memories of the reversal.
  id: s_5
  key_delta: The dagger’s time-reversal capability becomes known and usable, providing
    strategic advantage.
  trigger_event: Dastan activates the dagger in a critical moment to undo Tamina’s
    attempted attack.
- description: Nizam’s hand is burned, revealing a motive; Dastan explains to Tamina
    that Nizam orchestrated King Sharaman’s murder to access the Sandglass beneath
    Alamut.
  id: s_6
  key_delta: Nizam is identified as the true antagonist seeking the Dagger and Sandglass
    for power manipulation.
  trigger_event: Dastan confronts Tamina with evidence of Nizam's injuries linked
    to his treachery.
- description: Tamina reveals the Sandglass’s destructive potential if opened; Nizam
    hires assassins (Hassansins) to eliminate Dastan and seize the dagger.
  id: s_7
  key_delta: Nizam escalates his campaign to secure the Dagger and Sandglass by lethal
    means.
  trigger_event: Assassins arrive in Persia, and threats to Dastan and Tamina escalate.
- description: Dastan and Tamina are captured by Sheikh Amar who wants to claim the
    bounty but are saved when the Hassansins attack the group with vipers.
  id: s_8
  key_delta: Dastan proves deadly with the dagger, forcing a reluctant alliance with
    Amar for safety.
  trigger_event: Assassins led by Zolm attack Amar’s compound at night.
- description: The group journeys to a secret sanctuary near India but are ambushed
    by Garsiv’s men. Dastan convinces Garsiv of his innocence before Garsiv is fatally
    wounded by a Hassansin.
  id: s_9
  key_delta: Garsiv’s death eliminates a royal ally but confirms the depth of Nizam’s
    conspiracy.
  trigger_event: Garsiv confronts Dastan and is attacked during the Hassansin skirmish.
- description: Dastan and Tamina reach a cave to hide the dagger; after a confrontation,
    Zolm steals the dagger and Garsiv dies saving Dastan.
  id: s_10
  key_delta: The Dagger is lost to enemy hands, heightening the stakes of its retrieval.
  trigger_event: The Hassansins overrun the sanctuary and seize the dagger in a violent
    skirmish.
- description: Dastan, Tamina, and allies return to Alamut to expose Nizam to Tus.
    A brutal fight ensues for the dagger, ending with both Seso and Setam (Hassansin)
    dead and the dagger recovered by Seso.
  id: s_11
  key_delta: The dagger returns to the protagonists, enabling Dastan to reveal Nizam’s
    treachery.
  trigger_event: The dagger changes hands after a deadly confrontation within Alamut
    walls.
- description: Dastan explains the dagger’s powers to Tus, then sacrifices himself
    by stabbing the dagger into his own heart. Tus revives Dastan by rewinding time
    with the dagger.
  id: s_12
  key_delta: Time manipulation proves possible, confirming Dastan’s innocence and
    undermining Nizam’s plans.
  trigger_event: Dastan activates the dagger’s power on himself, demonstrating its
    time-altering ability.
- description: Nizam kills Tus, steals the dagger, and leaves a Hassansin named Ghazab
    to kill Dastan. Tamina intervenes to aid Dastan in fighting off Ghazab.
  id: s_13
  key_delta: Nizam gains direct control over the dagger and accelerates his plan to
    use the Sandglass.
  trigger_event: Nizam assassinates Tus and commandeers the dagger amidst palace upheaval.
- description: Dastan and Tamina pursue Nizam to the Sandglass caves beneath Alamut;
    Tamina kills Zolm during the chase while saving Dastan.
  id: s_14
  key_delta: The final confrontation site is reached, and key enemy leaders are eliminated.
  trigger_event: The pair navigate underground tunnels, confronting Hassansin enemy
    forces.
- description: Dastan and Tamina reach Nizam as he attempts to stab the Sandglass
    with the dagger, triggering a catastrophic event. Both are knocked over the edge;
    Dastan barely holds Tamina’s hand before she lets go, expressing her love and
    acceptance of his destiny.
  id: s_15
  key_delta: Nizam initiates the apocalyptic chain; the emotional bond between Dastan
    and Tamina is affirmed.
  trigger_event: Nizam violently attacks the Sandglass while confronting Dastan and
    Tamina.
- description: Dastan activates the dagger, traveling back in time to just after the
    invasion. He exposes Nizam’s treachery publicly. Nizam attacks but is killed by
    Tus, resolving the conflict.
  id: s_16
  key_delta: Nizam is removed as threat by Tus; political and temporal order restored.
  trigger_event: Dastan uses the dagger to rewind and reveal the truth to the court.
- description: With peace restored, Tus apologizes to Tamina for the city’s suffering
    and suggests the marriage to Dastan as a sign of goodwill. Dastan returns the
    dagger to Tamina, and they walk together, hinting at a hopeful future.
  id: s_17
  key_delta: A new era begins symbolized by the alliance and understanding of the
    dagger’s power.
  trigger_event: The royal family reconciles and formalizes alliances after the upheaval.
