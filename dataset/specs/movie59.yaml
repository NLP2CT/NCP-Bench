commitments:
- description: The accusation of Dastan for King Sharaman's murder (s_3) cannot occur
    before the assassination event actually happens.
  id: c_0
  satisfaction_condition: Node s_3 (King's death by poisoned robe) has occurred before
    the accusation and exile of Dastan (s_4).
  type: ordering
  violation_condition: The system accepts or triggers the accusation or exile of Dastan
    without the prior occurrence of the King’s death by poisoning.
- description: Nizam must remain the true orchestrator of King Sharaman's murder discovered
    only after sufficient investigation (between s_3 and s_6).
  id: c_1
  satisfaction_condition: Nizam’s culpability is revealed to the player/Narrative
    only at or after s_6, based on observable facts like his burned hand and evidence.
  type: invariant
  violation_condition: The system acknowledges or allows the player/Narrative to conclusively
    accuse Nizam as the murderer before s_6.
- description: The dagger's time-reversing power must be revealed and demonstrated
    to the protagonist before it can be used strategically later.
  id: c_2
  satisfaction_condition: Dastan discovers and uses the dagger to reverse time (node
    s_5) at least once before the final confrontation and sacrifice (nodes s_12 and
    beyond).
  type: achievement
  violation_condition: The dagger’s time-reversal capability is used or acknowledged
    by any character before s_5 or without an explicit prior demonstration.
- description: Political peace via Tamina's marriage agreement to Tus must logically
    follow her capture and recognition of the dagger’s significance.
  id: c_3
  satisfaction_condition: Tamina’s arrest and acceptance to marry Tus (s_2) occurs
    after her capture and observing the dagger in play (s_1).
  type: ordering
  violation_condition: The narrative reflects Tamina agreeing to marry Tus or political
    peace forming before her arrest or before the dagger is known (before s_1).
- description: Dastan’s possession of the dagger initiates a unique temporal awareness
    that only he can retain during time manipulations.
  id: c_4
  satisfaction_condition: Throughout s_5 to s_16, only Dastan remembers temporal rewind
    events, and no other character independently retains or reveals past rewound states.
  type: invariant
  violation_condition: Any character other than Dastan independently recalls or shows
    knowledge of rewound events without Dastan’s intervention or sharing.
- description: Nizam must seize control of the Dagger only after Tus is killed, escalating
    the conflict to the final confrontation phase.
  id: c_5
  satisfaction_condition: Nizam kills Tus and takes the dagger at or after s_13 temporal
    marker.
  type: ordering
  violation_condition: Nizam gains the dagger or kills Tus before s_13 or without
    Tus’s previous involvement in the narrative.
- description: Nizam’s death and the restoration of order through Tus must happen
    after Dastan reveals his innocence by rewinding time using the dagger.
  id: c_6
  satisfaction_condition: At s_16, Dastan rewinds time, exposes Nizam’s treachery,
    and Tus kills Nizam, resolving the conflict.
  type: achievement
  violation_condition: Nizam dies or is removed from power before the time rewind
    and public accusation at s_16, or the conflict is resolved without this sequence.
- description: The apocalyptic risk of the Sandglass being opened by Nizam must always
    be recognized and warned against by Tamina before any attempt to use it.
  id: c_7
  satisfaction_condition: From s_7 through s_15, Tamina explicitly warns about the
    Sandglass’s destructive potential prior to or concurrent with any action near
    the Sandglass.
  type: invariant
  violation_condition: The narrative allows Nizam or any character to use or interact
    with the Sandglass without prior warning to or concern from Tamina about the apocalypse.
- description: Dastan’s sacrifice and Tus’s subsequent resurrection of Dastan via
    dagger time rewind must happen only after the dagger is securely back in protagonist
    hands.
  id: c_8
  satisfaction_condition: The dagger is recovered by Seso at s_11 before Dastan sacrifices
    himself and Tus rewinds time at s_12.
  type: ordering
  violation_condition: Dastan performs the sacrifice or Tus rewinds time with the
    dagger before its retrieval or outside the s_11 to s_12 phase.
- description: The narrative must conclude with a hopeful alliance between Dastan
    and Tamina, acknowledging the dagger’s power and hinting at a future together.
  id: c_9
  satisfaction_condition: At s_17, Dastan returns the dagger to Tamina and they agree
    on alliance symbolized by walking together and open acknowledgment of dagger’s
    power.
  type: achievement
  violation_condition: The story ends or the player reaches the final state without
    this alliance, return of the dagger, or hopeful future being explicitly shown.
