commitments:
- description: Lucy’s severe memory loss condition (Goldfield Syndrome) must be revealed
    to Henry only after he initially meets her and attempts contact; this prevents
    premature player knowledge of Lucy’s amnesia.
  id: c_0
  satisfaction_condition: Node s_3 is reached, where Sue explains Lucy’s condition
    to Henry.
  type: ordering
  violation_condition: Player gains knowledge or system acknowledges Lucy’s amnesia
    before s_3, bypassing initial meeting and confusion at s_2.
- description: Lucy must not remember Henry on any given morning unless triggered
    by the coping mechanisms or the video intervention, maintaining the narrative
    integrity of her anterograde amnesia until the proper healing progression.
  id: c_1
  satisfaction_condition: From s_2 to s_11 inclusive, Lucy’s memory resets daily and
    she does not recall Henry unless exposed to the video or other designed narrative
    triggers.
  type: invariant
  violation_condition: Lucy recalls Henry spontaneously or acknowledges him as familiar
    outside of controlled narrative elements before s_11.
- description: Henry’s attempts to pursue Lucy persistently must be discovered by
    her family before their direct confrontation and warning scene, ensuring narrative
    cause and effect in relationship escalation.
  id: c_2
  satisfaction_condition: Node s_5 is reached, where Marlin and Doug recognize Henry’s
    contrived encounters.
  type: ordering
  violation_condition: Player or system advances to s_6 or later interactions with
    Lucy as if family discovery of Henry’s schemes never occurred.
- description: Lucy must learn and comprehend her accident and amnesia through medical
    explanation before she can request deeper understanding and visit Dr. Keats.
  id: c_3
  satisfaction_condition: Node s_7 is reached where Lucy asks to see Dr. Keats and
    views Ten-Second Tom.
  type: ordering
  violation_condition: Player or system provides Lucy with this medical insight or
    visitation before Henry has conversed with her family or she has been exposed
    to the accident explanation.
- description: The use of the video to extend Lucy’s memory and allow her to temporarily
    move past the fixed memory date is required, establishing a new narrative coping
    mechanism before relationship progression.
  id: c_4
  satisfaction_condition: Node s_8 is reached where Henry creates and Lucy watches
    the video, enabling her to spend the day beyond October 13.
  type: achievement
  violation_condition: Progression or relationship deepening attempts occur before
    the creation and viewing of the video intervention.
- description: Lucy must choose to erase Henry from her life after learning of his
    reluctance to leave for the walrus study trip, marking a critical emotional turning
    point.
  id: c_5
  satisfaction_condition: Node s_9, where Lucy requests to destroy journal entries
    and cut ties with Henry, occurs only after the video coping mechanism is established.
  type: ordering
  violation_condition: Player forces or system acknowledges Lucy’s rejection of Henry
    before s_8 (video coping mechanism) is achieved.
- description: Henry’s departure preparation and Marlin’s disclosure of Lucy’s changed
    status must precede Henry’s emotional realization triggered by the Beach Boys
    CD and his decision to return.
  id: c_6
  satisfaction_condition: Node s_10 precedes s_11, reflecting informed emotional recommitment
    based on new insight.
  type: ordering
  violation_condition: Henry acts on emotional realization (s_11) or returns prematurely
    without Marlin’s information from s_10.
- description: Lucy claims to not consciously remember Henry during their reunion
    despite emotional or subconscious connections, preserving the complexity of amnesia
    versus emotional memory distinction.
  id: c_7
  satisfaction_condition: From s_11 to s_12, Lucy verbally denies memory while showing
    signs of dreaming and painting Henry.
  type: invariant
  violation_condition: Lucy explicitly remembers or recognizes Henry consciously during
    reunion before the final resolution.
- description: The narrative must reach a stable integrated family state where Lucy,
    Henry, and their daughter Nicole live together, marking resolution of memory and
    relational conflicts.
  id: c_8
  satisfaction_condition: Node s_13 is reached, depicting Lucy awakening on Henry’s
    boat in Alaska with their family present.
  type: achievement
  violation_condition: Narrative attempts to conclude or define resolution without
    reaching this integrated family scene.
