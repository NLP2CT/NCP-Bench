meta:
  genres: ["War", "Drama"]
  id: movie82
  player_role: Cpl. Timothy P. Upham
  title: "Saving Private Ryan"
synopsis: On the morning of June 6, 1944, the beginning of the Normandy invasion,
  American soldiers prepare to land on Omaha Beach. They struggle against dug-in German
  infantry, machine gun nests, and artillery fire, which cut down many of the men.
  Captain John H. Miller, the company commander of Charlie Company, 2nd Ranger Battalion,
  survives the initial landing and assembles a group of soldiers to penetrate the
  German defenses, leading to a breakout from the beach. In the United States Department
  of War in Washington, D.C., General George Marshall is informed that three of four
  brothers in the Ryan family have all died within days of each other and that their
  mother will receive all three telegrams on the same day. He learns that the fourth
  son, Private First Class James Francis Ryan of Baker Company, 506th Parachute Infantry
  Regiment, 101st Airborne Division is missing in action somewhere in Normandy. After
  reading to his staff Abraham Lincoln's letter to Mrs. Bixby, Marshall orders that
  Ryan be found and sent home immediately. In France, three days after D-Day, Miller
  receives orders to find Ryan. He assembles six men from his company, plus one detailed
  from the 29th Infantry Division, a clerk who speaks fluent French and German, to
  accomplish the task. With no information about Ryan's whereabouts, Miller and his
  men move out to Neuville. On the outskirts of Neuville they meet a platoon from
  the 101st. After entering the town under heavy rain, Caparzo is wounded by a sniper
  in the chest, and slowly bleeds to death, since nobody can go out into the open
  without getting hit. Jackson is able to kill the sniper after Caparzo dies. They
  locate a Private James Frederick Ryan from Minnesota, but soon realize that he's
  not their man. They find a member of Charlie Company, 506th, who informs them that
  his drop zone was at Vierville and that Baker and Charlie companies had the same
  rally point. Once they reach it, Miller locates a friend of Ryan's, who reveals
  that Ryan is defending a strategically important bridge over the Merderet River
  in the town of Ramelle. On the way to Ramelle, Miller decides to take the opportunity
  to neutralize a small German machine gun position close to an abandoned radar station,
  despite the misgivings of his men. Wade, their medic, is fatally wounded in the
  ensuing skirmish. The last surviving German, known only as "Steamboat Willie", incurs
  the wrath of all the squad members except Upham, who protests to Miller about letting
  the squad shoot the German soldier. The German pleads for his life and Miller decides
  to let him walk away, blindfolded, and surrender himself to the next Allied patrol.
  Viewing Miller's decision as letting the enemy go free, and no longer confident
  in Miller's leadership, Reiben declares his intention to desert the squad and the
  mission, prompting a confrontation with Horvath. The argument heats up, until Miller
  defuses the situation by revealing his pre-war occupation as an English teacher,
  a question upon which the squad had set up a betting pool. Reiben then reluctantly
  decides to stay. The squad finally arrives on the outskirts of Ramelle, where they
  come upon three paratroopers ambushing a German half-track. Among the paratroopers
  is Ryan. After entering Ramelle, Ryan is told of his brothers' deaths, and their
  mission to bring him home, and that two lives had been lost in the quest to find
  him. He is distressed at the loss of his brothers, but does not feel it is fair
  to go home, asking Miller to tell his mother "when you found me I was here, I was
  with the only brothers I have left," looking at the small band whose duty it was
  to defend a bridge and destroy an approaching German mechanized unit. Miller decides
  to take command and defend the bridge with what little manpower and resources are
  available. The Germans arrive in force with more than 50 men supported by armor.
  In spite of inflicting heavy German casualties and destroying two tanks with sticky
  bombs, most of the Americans—including Jackson, Mellish, and Horvath—are killed.
  While attempting to blow the bridge, Miller is shot and mortally wounded. Just before
  a Tiger reaches the bridge, an American P-51 Mustang flies over and destroys it,
  followed by more Mustangs and advancing American infantry and M4 Sherman tanks who
  rout the remaining Germans. Upham, who was cut off from the Americans and hid in
  a ditch next to the advancing Germans, comes out of hiding as the Germans flee and
  orders them to drop their weapons. The Germans comply but Upham summarily executes
  "Steamboat Willie" when the latter recognizes him. Ryan, Reiben, and Upham are the
  only surviving Americans of the battle. Ryan is with Miller as he dies and says
  his last words, "James... earn this. Earn it." In the present day, Ryan, now an
  elderly veteran, and his family visit the Normandy American Cemetery and Memorial
  at Colleville-sur-mer; Normandy, France. Ryan stands at Miller's grave. He asks
  his wife to confirm that he has led a good life and that he is a "good man" and
  thus worthy of the sacrifice of Miller and the others. He then salutes Miller's
  grave.
trajectory:
- description: Early morning on June 6, 1944. Cpl. Timothy P. Upham is aboard a landing
    craft approaching Omaha Beach amid heavy gunfire, with American soldiers preparing
    to disembark under intense German defensive fire.
  id: s_0
  key_delta: American soldiers have landed on Omaha Beach and are under immediate
    heavy attack, marking the start of the Normandy invasion with high casualties
    occurring.
  trigger_event: Landing craft reaches Omaha Beach and soldiers begin to disembark
    amid machine gun, artillery, and infantry fire.
- description: After surviving the initial landing chaos, Upham is with Captain Miller
    and the assembled squad that is organizing to push inland beyond the beachhead
    under continuous threat.
  id: s_1
  key_delta: Upham becomes part of Captain Miller’s squad tasked with breaking through
    German beach defenses.
  trigger_event: Captain Miller gathers a group of soldiers, including Upham, to penetrate
    German defenses and lead the breakout from the beach.
- description: Upham and the squad receive new orders three days after D-Day to locate
    Pvt. James Francis Ryan, who is missing in action somewhere in Normandy, with
    no known location assigned.
  id: s_2
  key_delta: The squad’s mission shifts to a rescue operation to find the missing
    Pvt. Ryan in Normandy.
  trigger_event: Squad receives orders from headquarters to find Private Ryan and
    bring him home.
- description: Upham and the squad depart from the beach and move towards Neuville,
    encountering a platoon from the 101st Airborne outside the town under heavy rain
    conditions.
  id: s_3
  key_delta: Squad establishes contact with 101st Airborne units, broadening their
    knowledge of the local battlefield environment.
  trigger_event: The squad pushes into Neuville under heavy rain and immediately
    comes under sniper fire.
- description: While entering Neuville under heavy sniper fire, squad member Caparzo
    is fatally wounded, dying while the sniper position remains active until Jackson
    kills the sniper.
  id: s_4
  key_delta: Squad suffers a fatal casualty; enemy sniper nest is neutralized but
    at the cost of a squad member’s life.
  trigger_event: Sniper shoots Caparzo; sniper is killed by Jackson after Caparzo’s
    death.
- description: In Neuville, the squad locates a Private James Frederick Ryan but confirms
    he is not their target, learning from a Charlie Company member about rally points
    linked to Pvt. Ryan’s drop zone.
  id: s_5
  key_delta: Squad eliminates a false lead and gains actionable intelligence on Ryan's
    probable location.
  trigger_event: Squad identifies and interrogates a soldier who provides critical
    information on Ryan’s likely position near Vierville.
- description: The squad reaches the rally point near Vierville and meets a friend
    of Ryan’s, who confirms Ryan is defending a strategic bridge in Ramelle over the
    Merderet River.
  id: s_6
  key_delta: Key location of Ryan is identified, setting the next phase of the mission
    toward Ramelle.
  trigger_event: Squad meets Ryan’s comrade who reveals Ryan’s defensive position
    at Ramelle’s bridge.
- description: En route to Ramelle, the squad encounters and neutralizes a German
    machine gun nest at an abandoned radar station despite reservations, resulting
    in the fatal wounding of medic Wade.
  id: s_7
  key_delta: Squad suffers another casualty; enemy resistance reduced but internal
    tension arises due to Miller sparing a captured German soldier (Steamboat Willie).
  trigger_event: Squad attacks German machine gun position; Wade is fatally wounded
    during the skirmish.
- description: After Miller spares the blindfolded surrendering German soldier, Reiben
    confronts and threatens to desert, creating a heated argument that Miller diffuses
    by revealing his prior profession.
  id: s_8
  key_delta: Squad cohesion is tested but ultimately reinforced by Miller's revelation
    and leadership.
  trigger_event: Reiben voices intention to desert over Miller's decision to spare
    the German; confrontation escalates and is defused.
- description: The squad arrives on the outskirts of Ramelle and witnesses three paratroopers
    ambushing a German half-track; among them is Pvt. Ryan.
  id: s_9
  key_delta: Ryan is located alive and in combat; mission to find him is fulfilled.
  trigger_event: Squad encounters paratroopers engaging enemy mechanized vehicle near
    Ramelle.
- description: Ryan learns of his brothers’ deaths and that Miller’s squad suffered
    losses trying to find him; he refuses to leave, choosing to defend the bridge
    with his comrades.
  id: s_10
  key_delta: Ryan commits to remaining at his strategic post rather than returning
    home; the group prepares to defend the bridge.
  trigger_event: Ryan is informed about his brothers and the squad’s sacrifices during
    the mission.
- description: Miller assumes command of the combined group at the Ramelle bridge,
    preparing defenses despite limited manpower and resources, anticipating the approaching
    German mechanized assault.
  id: s_11
  key_delta: Defensive posture established at the bridge, setting up for a major battle.
  trigger_event: Miller organizes the defense of the Merderet River bridge against
    an imminent German attack.
- description: The German forces attack with more than 50 men and armor; heavy fighting
    ensues with American casualties mounting and two German tanks destroyed by sticky
    bombs before most Americans are killed or wounded.
  id: s_12
  key_delta: Massive casualties among American defenders; tactical defense inflicts
    significant damage to German forces.
  trigger_event: German mechanized assault launches on the bridge defense.
- description: Miller is mortally wounded attempting to blow up the bridge; just as
    a Tiger tank approaches, American P-51 Mustangs arrive, destroying the tank and
    opening the way for Allied ground reinforcements.
  id: s_13
  key_delta: Miller is fatally wounded; air and ground reinforcements arrive, turning
    the tide against the Germans.
  trigger_event: Miller attempts to destroy the bridge and is shot; air support arrives
    destroying German armor.
- description: Separated from the main American force, Upham hides next to advancing
    Germans; as Germans retreat and surrender to Upham, he executes Steamboat Willie,
    the German soldier spared earlier.
  id: s_14
  key_delta: Upham transitions from a passive hiding position to active authority;
    executes enemy who previously caused internal squad conflict.
  trigger_event: Upham emerges from hiding and accepts surrender from retreating Germans,
    executing 'Steamboat Willie'.
- description: Ryan, Reiben, and Upham are the sole American survivors of the battle;
    Ryan is by Miller’s dying side when Miller implores him to 'earn this,' meaning
    to live worthy of their sacrifice.
  id: s_15
  key_delta: Loss of squad leader creates emotional and mission-driven imperative
    for survivors; Ryan inherits Miller’s charge.
  trigger_event: Miller dies after giving last words to Ryan.
- description: In present day, an elderly Ryan visits the Normandy American Cemetery
    with his family and stands at Miller’s grave, seeking affirmation from his wife
    that he has lived a good life worthy of Miller’s sacrifice before saluting the
    grave.
  id: s_16
  key_delta: Closure and remembrance of past sacrifices; Ryan’s life is retrospectively
    evaluated against Miller’s final charge.
  trigger_event: Ryan visits and salutes Miller’s grave at the Normandy Cemetery in
    present time.
