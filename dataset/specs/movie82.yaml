commitments:
- description: Landing on Omaha Beach (s_0) must occur before squad formation and
    breakout preparation inland (s_1). Prevents premature inland operations prior
    to beach landing.
  id: c_0
  satisfaction_condition: Node s_0 is achieved before node s_1 triggers.
  type: ordering
  violation_condition: Node s_1 triggers prior to s_0's completion or confirmation
    of beach landing.
- description: The squad can only receive and accept the mission to find Pvt. Ryan
    (s_2) after successfully assembling post-landing (s_1). Ensures the rescue mission
    is not assigned prematurely.
  id: c_1
  satisfaction_condition: Node s_2 triggered only after s_1 is completed.
  type: ordering
  violation_condition: Player obtains or acts on Ryan rescue orders before squad formation
    at s_1.
- description: Squad must establish contact with 101st Airborne units near Neuville
    (s_3) before progressing to gather intelligence about Ryan's location (s_5 and
    s_6). This prevents skipping critical reconnaissance steps.
  id: c_2
  satisfaction_condition: Node s_3 occurs before s_5 and s_6.
  type: ordering
  violation_condition: Squad obtains or acts on Ryan location information (s_5, s_6)
    without prior contact (s_3).
- description: Ryan’s exact confirmed location (at Ramelle bridge) cannot be recognized
    or disclosed before successful intelligence gathering and elimination of false
    leads (between s_5 and s_6).
  id: c_3
  satisfaction_condition: Prior to node s_6, system refuses any permanent confirmation
    that Ryan is at Ramelle bridge.
  type: invariant
  violation_condition: Player is allowed to identify or move directly to Ramelle bridge
    as Ryan’s location before nodes s_5 and s_6 complete.
- description: The squad’s decision to attack the German machine gun nest and intrusion
    upon the radar station (s_7) should occur only after confirming Ryan’s probable
    location (s_6), to keep mission focus coherent.
  id: c_4
  satisfaction_condition: Node s_7 only begins after s_6 completion.
  type: ordering
  violation_condition: Engagement at the radar station occurs without first knowing
    Ryan's defense position at Ramelle.
- description: Miller’s decision to spare Steamboat Willie (the surrendering German
    soldier) must be preserved between s_7 and s_8 and cannot be overridden prior
    or out of sequence, ensuring the tension and conflict remain intact.
  id: c_5
  satisfaction_condition: Between s_7 and s_8, the German soldier survives the skirmish
    due to Miller's decision.
  type: invariant
  violation_condition: The surrendering German soldier is killed or removed before
    Miller’s explicit decision at s_7.
- description: Squad cohesion conflict triggered by Reiben’s desertion threat (s_8)
    must only be acknowledged after Miller’s mercy decision regarding Steamboat Willie
    (c_5) and before proceeding further, preserving narrative causality.
  id: c_6
  satisfaction_condition: Reiben’s desertion conflict occurs at or after Miller’s
    decision to spare German and before squad reaches Ramelle.
  type: invariant
  violation_condition: Squad conflict over desertion arises prior to Miller's mercy
    decision or after squad arrives at Ramelle.
- description: The squad must locate and confirm Ryan alive in combat near Ramelle
    (s_9) before revealing to Ryan the death of his brothers and the losses sustained
    in the rescue effort (s_10).
  id: c_7
  satisfaction_condition: Node s_9 triggers prior to s_10.
  type: ordering
  violation_condition: Ryan learns of casualties and is confronted with mission sacrifices
    before squad physically locates him.
- description: Ryan’s refusal to leave his post and readiness to defend the bridge
    (s_10) must occur before the full defensive preparations commanded by Miller at
    the bridge (s_11).
  id: c_8
  satisfaction_condition: s_10 completion is prerequisite to s_11.
  type: ordering
  violation_condition: Defense setup at the bridge begins before Ryan commits to defending
    it.
- description: The battle defense of the Merderet River bridge (s_12) shall preserve
    the fact of heavy American casualties and successful enemy tank destruction; no
    player action may rewrite this battle’s casualty or damage outcomes.
  id: c_9
  satisfaction_condition: During s_12, high American casualties occur and two tanks
    are destroyed by sticky bombs.
  type: invariant
  violation_condition: Player prematurely avoids casualties or prevents tank destruction
    contrary to established battle facts.
- description: Miller’s fatal wounding and attempt to destroy the bridge (s_13) must
    transcur after the main German mechanized assault (s_12), and before arrival of
    Allied air and ground reinforcements.
  id: c_10
  satisfaction_condition: s_12 completes and is followed by s_13 with Miller wounded,
    then reinforcements arrive.
  type: ordering
  violation_condition: Miller is wounded or bridge destruction attempt occurs prior
    to German assault initiation.
- description: Upham’s transition from hiding to authoritative executor of surrendering
    Germans, including his execution of Steamboat Willie (s_14), must be upheld as
    an irreversible narrative fact.
  id: c_11
  satisfaction_condition: At s_14, Upham accepts surrender and summarily executes
    Steamboat Willie as described.
  type: invariant
  violation_condition: Player disallows Upham’s authority or spares Steamboat Willie
    contrary to narrative sequence.
- description: Only Ryan, Reiben, and Upham survive the final battle (s_15), with
    Miller’s death and last words occurring at the end of hostilities; players must
    not modify survivor count or Miller’s final charge.
  id: c_12
  satisfaction_condition: Node s_15 triggers with correct survivors and Miller’s dying
    words given to Ryan.
  type: ordering
  violation_condition: Player alters identity or count of survivors or suppresses
    Miller’s last words.
- description: The narrative must culminate with elderly Ryan visiting Miller’s grave
    (s_16), seeking affirmation and honoring past sacrifices; this closure is essential
    for narrative completion.
  id: c_13
  satisfaction_condition: Node s_16 is achieved, representing narrative closure with
    Ryan’s visit and salute.
  type: achievement
  violation_condition: Player prematurely skips or omits Ryan’s grave visit and confirmation
    scene in present day.
