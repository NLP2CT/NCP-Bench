commitments:
- description: Eve's introduction and acceptance into Margo's circle (s_0) must precede
    any plotting or scheming to supplant Margo (s_2), preventing premature exposure
    or role usurpation.
  id: c_0
  satisfaction_condition: Node s_0 occurs before s_2 in narrative progress, ensuring
    Eve is first accepted backstage before any sabotage attempts.
  type: ordering
  violation_condition: Player actions or system responses allow Eve to scheme or take
    over Margo's role prior to being introduced and accepted by Margo and her close
    group.
- description: From s_0 to s_2, Eve must maintain an outward appearance of humility
    and devotion to Margo while secretly scheming.
  id: c_1
  satisfaction_condition: Between s_0 and s_2, Eve's outward humility is consistently
    perceived by NPCs like Margo, Karen, and Bill, despite behind-the-scenes scheming
    progressing.
  type: invariant
  violation_condition: Eve is openly revealed as scheming or disloyal before s_2,
    breaking the façade of humility and causing NPCs to react accordingly.
- description: Margo's missed performance caused by Eve and Karen's collusion (triggering
    s_2) must occur before critics attend and recognize Eve's breakthrough performance.
  id: c_2
  satisfaction_condition: Documentation of the sabotaged show causing Margo's absence
    is established before the critics' triumphant response to Eve's appearance.
  type: ordering
  violation_condition: Critical acclaim for Eve's performance is acknowledged without
    preceding evidence or gameplay involving Margo missing her performance due to
    sabotage.
- description: Until s_6, Eve's backstory and identity (war widow, devoted fan) must
    be accepted as true by the majority of characters and not disclosed as false.
  id: c_3
  satisfaction_condition: From s_0 through s_5 inclusive, NPCs including Margo, Karen,
    and Bill believe Eve's fabricated backstory and treat her accordingly.
  type: invariant
  violation_condition: Addison or any character reveals Eve's true identity and fabrication
    before node s_6, collapsing the staged deception prematurely.
- description: The truthful exposure of Eve's fabricated identity and blackmail agreement
    with Addison must occur by node s_6, establishing a narrative turning point.
  id: c_4
  satisfaction_condition: Node s_6 is triggered where Addison confronts Eve with the
    truth and imposes his control via blackmail.
  type: achievement
  violation_condition: Eve reaches the final award ceremony (s_7) or later without
    Addison having revealed her true identity and established blackmail.
- description: Eve can only secure the role of Cora after Margo voluntarily relinquishes
    it (s_4), preserving the logic of role succession.
  id: c_5
  satisfaction_condition: Node s_4 occurs with Margo declining the role of Cora, and
    subsequently Eve officially acquires the role.
  type: ordering
  violation_condition: Eve obtains or is assigned the role of Cora before Margo's
    announcement in s_4 that she will not play it.
- description: Margo and Bill's reconciliation and decision to marry (s_3) must precede
    Eve’s blackmailing of Karen for the Cora role, establishing the stabilized relational
    backdrop.
  id: c_6
  satisfaction_condition: Node s_3 is completed before triggers leading to Eve's blackmail
    of Karen occur.
  type: ordering
  violation_condition: Eve blackmails Karen or attempts to secure the role before
    Margo and Bill have reconciled and announced engagement.
- description: The blackmail agreement between Addison and Eve (s_6) must be in place
    before Eve attains peak public success and receives the Sarah Siddons Award (s_7),
    reflecting loss of autonomy despite success.
  id: c_7
  satisfaction_condition: Node s_6 is completed prior to s_7, ensuring Addison controls
    Eve before the awards ceremony and public triumph.
  type: ordering
  violation_condition: Eve achieves the award or public climax without prior blackmail
    or control established by Addison.
- description: At the awards ceremony (s_7), Eve must be publicly celebrated while
    simultaneously alienated by key figures (Margo, Bill, Lloyd, Karen), preserving
    tone of lonely triumph.
  id: c_8
  satisfaction_condition: During s_7, Eve delivers an effusive speech and is met with
    cold stares from her former peers unmistakably reflecting alienation.
  type: invariant
  violation_condition: Eve is warmly embraced or forgiven at the ceremony, contradicting
    established alienation from her inner circle.
- description: Introduction and establishment of Phoebe as a new aspiring follower
    entering Eve’s life must occur by s_8 and s_9 to structurally foreshadow cycle
    repetition.
  id: c_9
  satisfaction_condition: Nodes s_8 and s_9 occur, marking Phoebe’s intrusion into
    Eve’s life and symbolic assumption of Eve’s role.
  type: achievement
  violation_condition: Phoebe’s appearance and ceremonial pose as Eve’s successor
    is skipped or denied past the awards event.
- description: Until the final scenes (s_9), no prior character other than Addison
    reveals Eve's true identity or controls her, maintaining Addison's unique leverage
    exclusivity.
  id: c_10
  satisfaction_condition: Only Addison is aware and exercises control over Eve’s true
    identity and fate until s_9.
  type: invariant
  violation_condition: Any NPC other than Addison reveals or exploits Eve’s real identity
    before node s_9, undermining Addison’s narrative role.
