meta:
  genres: ["Comedy", "Horror"]
  id: movie17
  player_role: Tallahassee
  title: "Zombieland"
synopsis: Two months after a mutated strain of mad cow disease has turned most humans
  into cannibal zombies, unaffected college student "Columbus" is making his way to
  Columbus, Ohio to see whether his parents are still alive. He encounters "Tallahassee",
  another survivor who seeks Twinkies. They travel together. They later meet "Wichita"
  and her younger, 12-year-old sister "Little Rock". The sisters were con artists
  before the catastrophe, and have little trouble tricking the two guys into handing
  over their weapons and stealing their vehicle. Later, the two men find a Hummer
  loaded with weapons, but when they meet the girls again, the girls once more gain
  the upper hand, taking their weapons and car. Tallahassee manages to wrestle away
  Little Rock's gun, resulting in a Mexican standoff. Columbus negotiates a truce.
  The girls are going to the "Pacific Playland" amusement park, which is supposedly
  free of zombies. Columbus does not want to go along at first, but when Wichita informs
  him that his hometown has been destroyed, he stays with the group. When they reach
  Hollywood, Tallahassee takes them to Bill Murray's mansion. Tallahassee and Wichita
  meet Murray himself, uninfected but disguised as a zombie so he can walk safely
  among the infected. When Murray attempts to scare Columbus and Little Rock as a
  practical joke, Columbus shoots and kills him, believing him a real zombie. Later,
  Columbus realizes Tallahassee has been grieving for his young son, lost to the zombies,
  rather than his dog as he had earlier led Columbus to believe. Wichita nearly kisses
  Columbus, but fearing attachment, she leaves with Little Rock for Pacific Playland
  without warning. Columbus persuades a reluctant Tallahassee to follow in one of
  Murray's vehicles. At Pacific Playland, Wichita and Little Rock activate all the
  rides and lights, attracting nearby zombies. A battle ensues, leaving the sisters
  trapped on a drop tower ride. Tallahassee and Columbus arrive just as the sisters'
  ammunition runs out. Tallahassee lures the zombies away, then locks himself in a
  game booth, shooting zombies at his leisure, while Columbus goes after the sisters.
  In thanks, Wichita reveals her real name, Krista. Tallahassee eliminates the remaining
  zombies, then joyfully eats a Twinkie that Little Rock has found. The group leaves
  Pacific Playland together after Little Rock and Wichita pretend to leave them behind,
  Columbus having realized he's finally found what he's been looking for——a family.
trajectory:
- description: Two months after a mutated mad cow disease outbreak has transformed
    most humans into cannibal zombies, Tallahassee is traveling alone in a post-apocalyptic
    world overrun by zombies, survival is harsh and resources are scarce.
  id: s_0
  key_delta: Tallahassee meets Columbus, forming a new alliance with another survivor
    who has a different goal.
  trigger_event: Encountering Columbus, an unaffected college student traveling towards
    Columbus, Ohio.
- description: Tallahassee and Columbus are traveling together, scavenging for resources
    in a dangerous zombie-infested environment.
  id: s_1
  key_delta: Tallahassee and Columbus lose their weapons and vehicle to Wichita and
    Little Rock, shifting the power dynamic in the group.
  trigger_event: Meeting Wichita and Little Rock, two con artist sisters who trick
    Tallahassee and Columbus into giving up their weapons and vehicle.
- description: Tallahassee and Columbus locate a Hummer loaded with weapons, temporarily
    regaining superior firepower.
  id: s_2
  key_delta: Tallahassee and Columbus are disarmed and stranded again, increasing
    tension and vulnerability.
  trigger_event: Re-encountering Wichita and Little Rock, who again deceive Tallahassee
    and Columbus to steal their weapons and vehicle for the second time.
- description: Tallahassee and Columbus confront Wichita and Little Rock in a tense
    Mexican standoff, weapons drawn.
  id: s_3
  key_delta: A truce is negotiated by Columbus, temporarily halting the conflict and
    establishing uneasy cooperation.
  trigger_event: Tallahassee wrestles Little Rock's gun, escalating the confrontation
    to a Mexican standoff.
- description: The group, now including Tallahassee, Columbus, Wichita, and Little
    Rock, prepare to journey towards the Pacific Playland amusement park believed
    to be zombie-free.
  id: s_4
  key_delta: The group aligns on a shared objective of reaching Pacific Playland,
    agreeing to travel together.
  trigger_event: Wichita informs Tallahassee and Columbus that Pacific Playland is
    their destination, and Columbus learns his hometown has been destroyed.
- description: Arriving in Hollywood, Tallahassee leads the group to Bill Murray's
    mansion, who is disguised as a zombie to move safely among the infected.
  id: s_5
  key_delta: Columbus shoots and kills Bill Murray, believing him to be a real zombie,
    resulting in a fatal misunderstanding.
  trigger_event: Bill Murray attempts to scare Columbus and Little Rock as a joke.
- description: After Bill Murray's death, Tallahassee reveals his true grief over
    the loss of his young son to Columbus, correcting a prior false claim that it
    was his dog.
  id: s_6
  key_delta: Columbus gains deeper understanding of Tallahassee’s emotional state;
    bond between them is deepened.
  trigger_event: Tallahassee's revelation of his son's death during conversation with
    Columbus.
- description: Wichita almost kisses Columbus but abruptly leaves with Little Rock
    without informing the others, moving ahead toward Pacific Playland alone.
  id: s_7
  key_delta: The group is temporarily split, forcing Tallahassee and Columbus to decide
    whether to pursue.
  trigger_event: Wichita departs suddenly for Pacific Playland, leaving Columbus and
    Tallahassee behind.
- description: Tallahassee, persuaded by Columbus, follows Wichita and Little Rock
    to Pacific Playland in one of Bill Murray’s vehicles.
  id: s_8
  key_delta: The group is reunited en route to the shared destination, restoring their
    alliance.
  trigger_event: Tallahassee and Columbus get into Bill Murray’s vehicle and resume
    travel towards the amusement park.
- description: At Pacific Playland, Wichita and Little Rock trigger all the rides
    and lights, attracting a large horde of zombies.
  id: s_9
  key_delta: Zombies gather in large numbers, escalating direct confrontation imminently.
  trigger_event: Activation of amusement park rides and lights by Wichita and Little
    Rock.
- description: A fierce battle against zombies unfolds; Wichita and Little Rock become
    trapped on a drop tower ride as their ammunition runs out.
  id: s_10
  key_delta: The sisters are endangered and immobilized, requiring a rescue.
  trigger_event: Zombies surround the sisters on the drop tower ride, and their weapons
    are depleted.
- description: Tallahassee distracts the zombies by locking himself in a game booth
    and shooting them, while Columbus goes to rescue Wichita and Little Rock.
  id: s_11
  key_delta: The threat to the sisters is temporarily mitigated, allowing Columbus
    to attempt a rescue.
  trigger_event: Tallahassee lures zombies away into a game booth and starts shooting
    them, creating opportunity for rescue.
- description: Wichita reveals her real name 'Krista' to Columbus after being rescued,
    signaling trust within the group.
  id: s_12
  key_delta: Group members share authentic identities, reinforcing group cohesion.
  trigger_event: Wichita discloses her true identity to Columbus in gratitude.
- description: Tallahassee eliminates the remaining zombies and happily eats a Twinkie
    found by Little Rock, symbolizing a small victory and moment of joy.
  id: s_13
  key_delta: Tallahassee fulfills his personal quest momentarily, lifting group morale.
  trigger_event: Tallahassee consumes a Twinkie after dispatching the last zombies
    in Pacific Playland.
- description: The group leaves Pacific Playland together; Little Rock and Wichita
    pretend to leave them behind, but the group remains united as a newly formed family.
  id: s_14
  key_delta: The survivors form a cohesive family unit, resolving earlier tensions
    and conflicts.
  trigger_event: The group departs Pacific Playland after Little Rock and Wichita
    simulate abandonment.
