commitments:
- description: The outbreak of mutated mad cow disease causing humans to become cannibal
    zombies must remain established throughout from s_0 to s_14.
  id: c_0
  satisfaction_condition: From s_0 onwards, the system always acknowledges the world
    is overrun by cannibal zombies due to mutated mad cow disease.
  type: invariant
  violation_condition: Any event or player action denying or contradicting the existence
    of the outbreak as origin of zombies after s_0.
- description: Tallahassee must meet Columbus before forming a traveling alliance
    to prevent logical gap in their partnership (ensures s_0 occurs before s_1).
  id: c_1
  satisfaction_condition: s_0 (encounter of Tallahassee and Columbus) occurs before
    any joint travel or alliance represented by s_1.
  type: ordering
  violation_condition: System treats any outcome implying alliance or joint travel
    before meeting at s_0.
- description: The deception by Wichita and Little Rock must happen before Tallahassee
    and Columbus lose their weapons and vehicles (s_1 before s_2).
  id: c_2
  satisfaction_condition: s_1 (first con by sisters) occurs before s_2 (regaining
    weapons then losing them again).
  type: ordering
  violation_condition: Player bypasses or reverses this order, e.g., losing weapons
    prior to encountering the sisters.
- description: Wichita and Little Rock maintain their con artist deception consistently
    from s_1 through s_3, enabling their repeated weapon/vehicle thefts.
  id: c_3
  satisfaction_condition: Between s_1 and s_3, all interactions preserve that Wichita
    and Little Rock are tricksters who seize control via deception or force.
  type: invariant
  violation_condition: Any event where sisters act honestly or relinquish weapons/vehicle
    without conflict during this phase.
- description: A Mexican standoff with weapons drawn involving all four characters
    (Tallahassee, Columbus, Wichita, Little Rock) must precede the negotiated truce
    (s_3).
  id: c_4
  satisfaction_condition: s_3 (standoff and truce) only occurs after the conflict
    buildup starting in s_2.
  type: ordering
  violation_condition: Truce or cooperation established before conflict escalation
    and weapons draw confrontation.
- description: All group members must agree to travel together towards Pacific Playland
    only after the truce and explanation about the destination (s_3 before s_4).
  id: c_5
  satisfaction_condition: The joint decision and shared goal in s_4 logically follow
    from the truce and group dynamic at s_3.
  type: ordering
  violation_condition: Group aligns or attempts journey together prior to resolving
    the standoff or learning about Pacific Playland.
- description: Bill Murray is uninfected but disguised as a zombie at s_5; he must
    not be mistaken for a zombie by Tallahassee or Columbus until that point.
  id: c_6
  satisfaction_condition: At s_5, Bill Murray is recognized as human only after player/NPC
    interactions reveal his disguise.
  type: invariant
  violation_condition: Player or system reveals Bill Murray's true nature before reaching
    s_5 or misconstrues his identity prematurely.
- description: Columbus must shoot and kill Bill Murray only after the attempted scare
    prank at s_5 to maintain narrative causality.
  id: c_7
  satisfaction_condition: The fatal misunderstanding happens strictly at s_5 after
    Bill Murray’s prank.
  type: ordering
  violation_condition: Bill Murray’s death occurs before the prank or without player
    interaction triggering the misunderstanding.
- description: Tallahassee must reveal his true grief about his son (s_6) only after
    Bill Murray’s death (s_5).
  id: c_8
  satisfaction_condition: Conversation revealing Tallahassee's son's death takes place
    at or after s_6, following s_5's events.
  type: ordering
  violation_condition: Truth of Tallahassee’s grief is disclosed prior to s_5 or without
    the emotional context provided by Bill Murray’s incident.
- description: Wichita’s near kiss and sudden departure (s_7) must happen only after
    her growing relationship with Columbus and revealing tensions post s_6.
  id: c_9
  satisfaction_condition: s_7 event of nearly kissing then leaving occurs chronologically
    after s_6’s revelations and group dynamics shifts.
  type: ordering
  violation_condition: Wichita leaves abruptly without preceding relational development
    or emotional events.
- description: Tallahassee’s pursuit of Wichita and Little Rock to Pacific Playland
    (s_8) must follow Wichita’s departure (s_7).
  id: c_10
  satisfaction_condition: s_8 travel by Tallahassee and Columbus occurs only after
    s_7 triggers Wichita and Little Rock’s departure.
  type: ordering
  violation_condition: The group reunites or pursues before the sisters actually leave.
- description: The activation of amusement park rides and resultant zombie aggregation
    (s_9) must occur to escalate the final confrontation.
  id: c_11
  satisfaction_condition: By s_9, the group has triggered all rides and lights, attracting
    zombies, advancing plot tension.
  type: achievement
  violation_condition: Player action prevents or skips activation of rides, thereby
    averting zombie convergence incompatible with plot escalation.
- description: Wichita and Little Rock become trapped on the drop tower with depleted
    ammunition during the zombie battle (s_10) and conflict must remain intense and
    unresolved here.
  id: c_12
  satisfaction_condition: At s_10, sisters are surrounded, armed but out of ammo,
    clearly endangered.
  type: invariant
  violation_condition: They have ammo, escape freely, or battle ends before s_10 triggers.
- description: Tallahassee must distract zombies and enable Columbus’s rescue attempt
    during s_11, preserving coordinated teamwork.
  id: c_13
  satisfaction_condition: s_11 occurs with the stalling action by Tallahassee and
    rescue effort by Columbus sequentially aligned.
  type: ordering
  violation_condition: Player action prevents Tallahassee’s baiting or rescue attempts,
    breaking cooperation logic.
- description: Wichita reveals her real name 'Krista' to Columbus (s_12) as a milestone
    of group trust and cohesion.
  id: c_14
  satisfaction_condition: s_12 happens only after siblings are rescued and trust is
    sufficiently established.
  type: achievement
  violation_condition: Name revelation occurs before or without rescue or trust-building
    events.
- description: Tallahassee consumes a Twinkie after eliminating remaining zombies
    (s_13), symbolizing fulfillment of his personal quest.
  id: c_15
  satisfaction_condition: s_13 is reached with zombie clearance and Twinkie consumption
    acknowledged.
  type: achievement
  violation_condition: Twinkie consumption or zombie elimination happens prematurely
    or is omitted from the narrative resolution.
- description: The final group unity representing a newly formed family must be maintained
    after s_14, resolving previous hostility and fragmentation.
  id: c_16
  satisfaction_condition: Post s_14, all four survivors remain united, with previous
    conflicts resolved and collective cohesion present.
  type: invariant
  violation_condition: Player causes permanent group rupture or abandonment violating
    the final family bond logic.
