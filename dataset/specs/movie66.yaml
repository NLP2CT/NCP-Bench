meta:
  genres: ["Sci-Fi", "Action"]
  id: movie66
  player_role: Sarah Connor
  title: "The Terminator"
synopsis: In a post-apocalyptic 2029, artificially intelligent machines seek to exterminate
  what is left of the human race. Two beings from this era travel back in time to
  1984 Los Angeles——One is a Terminator, a cyborg assassin programmed to kill Sarah
  Connor; the other is Kyle Reese, a human resistance fighter sent to protect her.
  After killing two other Sarah Connors listed in the telephone directory, the Terminator
  tracks its target to a nightclub. Kyle saves Sarah from the Terminator's attack
  and the two make an escape. Kyle explains that in the near future an artificial
  intelligence network called Skynet will become self-aware and initiate a nuclear
  holocaust of mankind. Sarah's yet-unborn son John will rally the survivors and lead
  a resistance movement against Skynet and its army of machines. With the Resistance
  on the verge of victory, Skynet has sent a Terminator back in time to kill Sarah
  before John can be born, as a last-ditch effort to avert the formation of the Resistance.
  The Terminator is an emotionless and efficient killing machine with a powerful metal
  endoskeleton, but with an external layer of living tissue that makes it resemble
  a human being. Kyle and Sarah are again attacked by the Terminator, leading to a
  car chase and their arrest. Lieutenant Ed Traxler and Detective Hal Vukovich tell
  Sarah that Kyle is insane. Kyle is questioned by psychologist Dr. Silberman, who
  concludes that he is paranoid and delusional. The Terminator attacks the police
  station and kills many police officers, including Traxler and Vukovich, in its attempt
  to locate Sarah, but she and Kyle escape and seek refuge in a motel. Kyle confesses
  that he has long been in love with Sarah, having been given a photograph of her
  by her son John. Sarah reciprocates Kyle's feelings and they have sex. The Terminator
  tracks them to the motel and wounds Kyle. In the ensuing chase the Terminator is
  caught in the blast of an exploding gasoline tank truck. With its flesh coating
  burned away, it pursues Sarah and Kyle into a factory. Kyle jams a pipe bomb into
  its abdomen, causing an explosion which severely damages it, but at the cost of
  his own life. Still partially functional, the Terminator tries to kill Sarah. She
  leads it into a hydraulic press and crushes it, causing it to deactivate. Later,
  a pregnant Sarah is traveling through Mexico. Along the way she records audio tapes
  which she intends to pass on to her unborn son, John. She debates whether to tell
  him that Kyle is his father. A Mexican boy takes a photograph of her which she purchases—it
  is the photograph that John will later give to Kyle. She drives on towards approaching
  storm clouds.
trajectory:
- description: In 1984 Los Angeles, Sarah Connor lives a regular life unaware of impending
    future dangers. The environment is a typical urban cityscape with nightclubs and
    everyday social activity. Sarah is not yet targeted or hunted.
  id: s_0
  key_delta: Sarah becomes aware that she is specifically hunted by a Terminator;
    the conflict with hostile AI machines from the future is introduced.
  trigger_event: Sarah is informed about a cyborg assassin targeting her after two
    other Sarah Connors have been killed.
- description: Sarah is in a nightclub where the Terminator is searching for her.
    The atmosphere is tense and dangerous as the assassin closes in.
  id: s_1
  key_delta: Sarah experiences a direct and violent attempt on her life by the Terminator.
  trigger_event: The Terminator attacks Sarah at the nightclub.
- description: Sarah is rescued from the Terminator's attack at the nightclub by Kyle
    Reese, a stranger who claims to protect her. They escape together.
  id: s_2
  key_delta: Sarah gains an ally who reveals that her danger is linked to an apocalyptic
    future involving AI and a resistance movement.
  trigger_event: Kyle Reese intervenes and saves Sarah from immediate danger.
- description: Sarah and Kyle are on the run in 1984 Los Angeles, moving through urban
    streets. Sarah learns that Skynet, an AI network, will cause a nuclear holocaust,
    and her unborn son John will lead resistance in the future.
  id: s_3
  key_delta: Sarah's understanding of the stakes expands to include the birth of John
    Connor and the central role she will play in the future war.
  trigger_event: Kyle explains Skynet’s origin, the future war, and the reason why
    Sarah is targeted.
- description: Sarah and Kyle are again attacked by the Terminator on the streets,
    resulting in a chaotic car chase.
  id: s_4
  key_delta: The Terminator’s relentless pursuit escalates the threat level; Sarah
    and Kyle are captured by local authorities.
  trigger_event: The Terminator locates them and initiates a high-speed pursuit followed
    by their arrest.
- description: Sarah and Kyle are in police custody, in a police station with Lieutenant
    Ed Traxler and Detective Hal Vukovich present. Kyle is questioned by Dr. Silberman.
  id: s_5
  key_delta: Authority figures doubt Kyle’s warnings; Sarah’s external support system
    becomes conflicted and untrusting.
  trigger_event: Police interrogate Kyle and dismiss his story as insanity; Sarah
    is told Kyle is delusional.
- description: The Terminator attacks the police station violently, killing multiple
    officers including Traxler and Vukovich. Sarah and Kyle narrowly escape during
    the chaos.
  id: s_6
  key_delta: The Terminator’s threat becomes overt and lethal in the immediate environment;
    Sarah and Kyle are forced to flee into hiding.
  trigger_event: The Terminator breaches the police station and initiates a lethal
    rampage to find Sarah.
- description: Sarah and Kyle take refuge in a remote motel, both physically and mentally
    exhausted but momentarily safe.
  id: s_7
  key_delta: Sarah and Kyle establish a temporary safe space, allowing deeper personal
    interaction.
  trigger_event: Sarah and Kyle arrive at the motel seeking shelter.
- description: At the motel, Kyle reveals his long-standing love for Sarah, showing
    her a photograph of her that was given by John in the future. Sarah reciprocates
    his feelings.
  id: s_8
  key_delta: The personal relationship between Sarah and Kyle deepens, bonding them
    emotionally amid chaos.
  trigger_event: Kyle shares the photograph and expresses his feelings openly to Sarah.
- description: The Terminator tracks Sarah and Kyle to the motel and wounds Kyle during
    an attack.
  id: s_9
  key_delta: Kyle is seriously injured, escalating the stakes and vulnerability of
    Sarah and her protector.
  trigger_event: The Terminator discovers their location and assaults the motel, injuring
    Kyle.
- description: Sarah and Kyle flee from the motel with the Terminator in pursuit,
    leading to a violent, desperate chase into an industrial factory at night.
  id: s_10
  key_delta: The final confrontation setting is established, hostile environment inside
    a factory with limited options for escape.
  trigger_event: Sarah and the wounded Kyle escape the motel and enter a factory to
    evade the Terminator.
- description: Inside the factory, Kyle sacrifices himself by planting a pipe bomb
    inside the Terminator, causing severe damage but resulting in Kyle’s death.
  id: s_11
  key_delta: Kyle dies heroically; the Terminator is heavily impaired but not yet
    neutralized.
  trigger_event: Kyle jams the pipe bomb into the Terminator and triggers the explosion.
- description: Sarah, alone and desperate, leads the damaged but still dangerous Terminator
    into a hydraulic press inside the factory, crushing and deactivating it.
  id: s_12
  key_delta: The Terminator is destroyed; Sarah survives the immediate threat.
  trigger_event: With the Terminator crushed and Kyle gone, Sarah escapes the factory
    alone and drives on into the future.
- description: Sarah, now pregnant, travels alone through Mexico on a stormy day,
    recording audio tapes to pass on to her unborn son John, and buys a photograph
    taken by a Mexican boy.
  id: s_13
  key_delta: Sarah embraces her future as John’s mother and prepares for the coming
    challenges; the origin of the photograph given to Kyle is established.
  trigger_event: Sarah purchases the photograph and records messages for her son.
