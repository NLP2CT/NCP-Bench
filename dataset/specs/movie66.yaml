commitments:
- description: The player must not acknowledge that Sarah is specifically hunted by
    a Terminator before the system triggers s_0's event informing Sarah of the assassin
    targeting her.
  id: c_0
  satisfaction_condition: The player only accepts Sarah's specific targeting by the
    Terminator after s_0's trigger event has occurred.
  type: ordering
  violation_condition: The player prompts or forces the system to reveal or treat
    Sarah as targeted by the Terminator before s_0's trigger event.
- description: Between s_0 and s_2 (inclusive), Sarah must remain unaware or unconvinced
    of any protector or future war details until Kyle rescues her and explains the
    future threat.
  id: c_1
  satisfaction_condition: Before the conclusion of s_2, no confirmed awareness or
    acceptance by Sarah of Kyle as protector or of the AI war exists.
  type: invariant
  violation_condition: The player causes Sarah to recognize or trust Kyle or know
    about Skynet's war before s_2 completes.
- description: Sarah’s full understanding of the stakes including her son John's future
    role must only be acknowledged after Kyle's explanation in s_3.
  id: c_2
  satisfaction_condition: Claims or realization about John leading the resistance
    against Skynet only appear after s_3 trigger event.
  type: ordering
  violation_condition: Premature acceptance or player-driven revelations about John
    Connor, the Resistance, or Skynet occurring before s_3.
- description: Between s_5 and s_6, law enforcement officials must remain skeptical
    of Kyle’s claims and treat him as delusional until the Terminator’s police station
    attack happens.
  id: c_3
  satisfaction_condition: Kyle is consistently portrayed by NPCs (police, Dr. Silberman)
    as paranoid or insane before s_6 initiates the attack.
  type: invariant
  violation_condition: The player enables or forces police or medical staff to accept
    Kyle’s story as credible or accurate prior to the Terminator attack at s_6.
- description: Kyle’s declarations of love and the exchange of the photograph must
    occur only during or after the stay at the motel in s_8.
  id: c_4
  satisfaction_condition: Any emotional bonding or personal relationship establishment
    between Sarah and Kyle happens strictly at or after s_8.
  type: ordering
  violation_condition: The player drives or triggers expressions of love or sharing
    the photograph before arriving at or during s_7 (motel refuge establishment).
- description: Kyle must be wounded by the Terminator only after the Terminator tracks
    them to the motel (trigger event s_9) and prior to the factory confrontation.
  id: c_5
  satisfaction_condition: Kyle’s injury occurs only at s_9 or subsequent nodes; before
    s_9, Kyle remains uninjured by the Terminator.
  type: ordering
  violation_condition: Player causes Kyle to be injured or incapacitated due to the
    Terminator prior to s_9.
- description: Kyle’s heroic sacrifice by planting the bomb to damage the Terminator
    must only occur during the factory showdown at s_11.
  id: c_6
  satisfaction_condition: Kyle’s death by pipe bomb planting and explosion happens
    strictly at s_11.
  type: ordering
  violation_condition: Kyle dies or attempts self-sacrifice to damage the Terminator
    before reaching the factory confrontation node s_11.
- description: The Terminator must be neutralized by Sarah crushing it in the hydraulic
    press at s_12 to conclude the immediate threat.
  id: c_7
  satisfaction_condition: Sarah successfully deactivates the Terminator via hydraulic
    press at node s_12.
  type: achievement
  violation_condition: The Terminator remains functional or is destroyed through any
    means other than the hydraulic press sequence at s_12.
- description: After s_12 and before s_13, Sarah must retain awareness of her pregnancy
    and her role as John Connor’s mother while preparing for future challenges by
    recording tapes and obtaining the photograph.
  id: c_8
  satisfaction_condition: Sarah is shown pregnant and making audio recordings for
    her unborn son, including purchasing the photograph only at or after s_13.
  type: invariant
  violation_condition: Sarah denies pregnancy, neglects recording messages for John,
    or fails to obtain the photograph before or outside s_13.
- description: The photograph that John gives to Kyle for his mission can only originate
    at s_13, where Sarah buys it from the Mexican boy, linking past and future events
    correctly.
  id: c_9
  satisfaction_condition: The system acknowledges the in-universe origin of the photograph
    at s_13 and does not allow earlier recognition or possession by Kyle or Sarah.
  type: ordering
  violation_condition: The photograph is introduced, exchanged, or referenced before
    s_13, breaking the causal chain.
