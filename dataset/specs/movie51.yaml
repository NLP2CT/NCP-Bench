meta:
  genres: ["Fantasy", "Adventure"]
  id: movie51
  player_role: Aragorn
  title: "The Lord of the Rings——The Return of the King"
synopsis: Gandalf, Aragorn, Legolas, Gimli, Théoden, Gamling, and Éomer meet up with
  Merry, Pippin and Treebeard at Isengard. The group returns to Edoras, where Pippin
  looks into Saruman's recovered palantír, in which Sauron appears and invades his
  mind; Pippin tells him nothing regarding Frodo and the Ring. From this event, Gandalf
  deduces that Sauron is planning to attack Minas Tirith. Gandalf rides with Pippin
  to find Denethor, the Steward of Gondor, to whom Pippin swears his service. Gandalf
  urges Denethor to call Rohan for aid, but Denethor declines, fearing Aragorn and
  Gandalf plan to depose him. The Morgul army, led by the Nazgûl, drives the Gondorians
  out of Osgiliath. Denethor sends his son Faramir on a suicide mission to reclaim
  the city. Pippin lights a beacon, signaling Théoden and Aragorn to assemble the
  Rohirrim for battle. Elrond informs Aragorn that Arwen did not go to the Undying
  Lands, and is now dying. Believing their forces to be outnumbered by Sauron's, Elrond
  gives Aragorn the sword Andúril to acquire the service of the Army of the Dead,
  who owe allegiance to the heir of Isildur. Éowyn confesses her love for Aragorn
  and asks him not to go, but Aragorn reaffirms his love for Arwen and heads into
  battle. Accompanied by Legolas and Gimli, Aragorn ventures into the Paths of the
  Dead and gains the loyalty of the King of the Dead and his men by brandishing Andúril,
  proving himself the Heir of Isildur. At Dunharrow, Théoden rides off to war, unaware
  that Éowyn and Merry have secretly joined his forces. Sauron's armies lay siege
  to Minas Tirith, led by the Witch-king. Believing a grievously wounded Faramir to
  be dead, Denethor tries to burn his son and himself alive, but Gandalf intervenes;
  he saves Faramir, but Denethor commits suicide. Just as the Gondorians are about
  to be overrun, the Rohirrim army arrives and counter-attacks in a massive cavalry
  charge led by Théoden. This shifts the tide of the battle, and the Orcs begin to
  retreat. However, the Haradrim arrive and join the Orc army, turning the tide. The
  Witch-king kills Théoden, only to be killed himself by Éowyn with help from Merry.
  On the verge of defeat, the Rohirrim are saved when Aragorn, Legolas, and Gimli
  arrive with the Army of the Dead and overwhelm Sauron's forces, ending the battle.
  Aragorn frees the Army of the Dead and their souls go to the afterlife. Meanwhile,
  Frodo, Sam and Gollum travel to Minas Morgul. Sam overhears Gollum's plans to murder
  them and take the Ring for himself. Gollum persuades Frodo that Sam wants the Ring
  for himself, and Frodo angrily tells Sam to go home. A heartbroken Sam leaves, but
  discovers Gollum's treachery and follows after them. Gollum betrays Frodo, leaving
  him in the lair of the giant spider Shelob, who paralyzes Frodo before being wounded
  and driven away by Sam. An Orc patrol captures Frodo and takes him to Sauron's fortress.
  Sam rescues Frodo from the tower, and they continue the journey to Mount Doom. Meanwhile,
  Aragorn leads his remaining men to the Black Gate of Mordor, distracting Sauron
  and his forces and allowing Sam and Frodo to enter Mount Doom. Sam carries the weakened
  Frodo up the volcano, but Gollum attacks them. At the Crack of Doom, Frodo succumbs
  to the Ring's power, refusing to destroy it. Gollum attacks Frodo and bites his
  finger off, seizing the Ring for himself. An enraged Frodo attacks Gollum, and they
  both fall over the edge. At the last second, Frodo grabs onto the ledge, leaving
  Gollum to fall into the lava, taking the Ring with him. As the Ring melts in the
  volcano, Sauron is destroyed and the land of Mordor collapses, taking down most
  of his forces. Frodo and Sam are saved from the rising lava by Eagles, led by Gandalf.
  In the aftermath, Aragorn is crowned King, heralding a new age of peace, and is
  reunited with Arwen and the four hobbits are bowed by all of Gondor for their courageous
  efforts. The four Hobbits return home to the Shire, where Sam marries his childhood
  sweetheart, Rosie Cotton. A few years later, Frodo leaves Middle-earth for the Undying
  Lands with Gandalf, Bilbo, Elrond, Celeborn, and Galadriel, leaving his account
  of their quest to Sam.
trajectory:
- description: At Isengard's remains, Aragorn stands among Gandalf, Legolas, Gimli,
    Théoden, Gamling, Éomer, and the hobbits Merry and Pippin, along with Treebeard,
    preparing to regroup and strategize in the wake of Saruman's defeat.
  id: s_0
  key_delta: Formation of a united group with leaders from Rohan, Gondor, and the
    Fellowship, along with hobbits and Ents, consolidating their alliance.
  trigger_event: The group begins the journey to Edoras to consolidate their forces
    and plan next steps.
- description: At Edoras, Pippin investigates Saruman's recovered palantír, observing
    a vision of Sauron looming in the device.
  id: s_1
  key_delta: Sauron's intent to attack Minas Tirith becomes known; Pippin withholds
    information about Frodo and the Ring, while Gandalf deduces the impending threat.
  trigger_event: Pippin touches the palantír and witnesses Sauron invading his mind.
- description: Gandalf rides with Pippin to Minas Tirith to seek an alliance with
    Denethor, the Steward of Gondor, amidst growing tension in the city.
  id: s_2
  key_delta: Denethor refuses to call Rohan for aid, suspicious of Gandalf and Aragorn’s
    intentions; Pippin pledges his service to Denethor.
  trigger_event: Gandalf and Pippin arrive at Minas Tirith and meet Denethor to request
    aid from Rohan.
- description: The Morgul army led by the Nazgûl attacks Osgiliath; Gondor's defenses
    begin to crumble under heavy assault.
  id: s_3
  key_delta: Gondor loses control of Osgiliath; Denethor dispatches his son Faramir
    on a dangerous mission to reclaim the city.
  trigger_event: The Nazgûl-led Morgul army pushes Gondorian forces out of Osgiliath.
- description: At Minas Tirith, Pippin lights a beacon atop the city walls, signaling
    for Rohan's aid as the threat grows more dire.
  id: s_4
  key_delta: Rohan is alerted to Gondor's peril, prompting imminent military mobilization
    by Théoden and Aragorn.
  trigger_event: Pippin ignites the beacon fire visible from distant Rohan.
- description: In Rivendell, Elrond informs Aragorn of Arwen's critical condition
    and confers upon him the reforged sword Andúril.
  id: s_5
  key_delta: Aragorn inherits the heirloom sword and the responsibility to claim the
    allegiance of the Army of the Dead.
  trigger_event: Aragorn receives Andúril and Elrond’s message about Arwen’s illness.
- description: Éowyn expresses her love to Aragorn and pleads with him not to join
    the battle, while Aragorn reaffirms his commitment to Arwen and the war effort.
  id: s_6
  key_delta: Emotional tensions within the group surface, clarifying Aragorn’s personal
    commitments despite personal sacrifice.
  trigger_event: Éowyn's confession and request met with Aragorn’s reaffirmed resolve
    to fight.
- description: Aragorn, accompanied by Legolas and Gimli, ventures into the Paths
    of the Dead seeking the pledge of the King of the Dead and his spectral army.
  id: s_7
  key_delta: The Army of the Dead swears allegiance to Aragorn, strengthening his
    forces significantly.
  trigger_event: Aragorn brandishes Andúril before the Dead to assert his claim as
    heir of Isildur.
- description: At Dunharrow, Théoden rallies Rohan’s army and departs for Minas Tirith,
    unaware that Éowyn and Merry have secretly joined the campaign.
  id: s_8
  key_delta: Rohan's army is fully mobilized, including secret volunteers, preparing
    to support Gondor.
  trigger_event: Théoden leads the Rohirrim cavalry out of Dunharrow toward battle.
- description: Minas Tirith is under siege by Sauron’s forces, commanded by the Witch-king;
    the city's defenders brace for a devastating assault.
  id: s_9
  key_delta: Open warfare begins at Minas Tirith, with heavy casualties and impending
    threats to the city’s survival.
  trigger_event: The Witch-king leads the attack on Minas Tirith’s gates and walls.
- description: Believing Faramir dead, Denethor attempts to burn himself and his son
    alive on a pyre, but Gandalf intervenes and rescues Faramir; Denethor commits
    suicide.
  id: s_10
  key_delta: Denethor’s death leaves Minas Tirith without its Steward; Faramir survives
    to fight another day.
  trigger_event: Denethor’s suicidal act is thwarted by Gandalf in the city’s citadel.
- description: The Rohirrim arrive at Minas Tirith, launching a massive cavalry charge
    led by Théoden that pushes back the orcish forces and shifts the battle’s momentum.
  id: s_11
  key_delta: The tide of battle turns in favor of Gondor and its allies through the
    Rohirrim assault.
  trigger_event: The charging arrival of Rohan’s cavalry is seen on the battlefield
    by Gondorians and orcs alike.
- description: The Haradrim counterattack joins the orc army; the Witch-king kills
    Théoden but is slain by Éowyn with Merry’s aid, intensifying the battle’s stakes.
  id: s_12
  key_delta: The Witch-king’s death weakens Sauron’s leadership; Théoden’s death causes
    loss and rallying for Rohan’s forces.
  trigger_event: Éowyn and Merry strike down the Witch-king amid the battle’s chaos.
- description: Aragorn arrives at Minas Tirith with Legolas, Gimli, and the Army of
    the Dead, overwhelming the remaining enemy forces and ending the battle.
  id: s_13
  key_delta: Sauron’s forces are decisively defeated at Minas Tirith; the Army of
    the Dead is freed from its oath.
  trigger_event: The spectral Army of the Dead sweeps through the battlefield with
    Aragorn’s command.
- description: Meanwhile, Frodo, Sam, and Gollum continue their perilous journey into
    Mordor toward Mount Doom, with increasing tension and treachery within the group.
  id: s_14
  key_delta: Frodo and Sam’s trust fractures; Gollum’s betrayal plans become imminent.
  trigger_event: The trio travels through Minas Morgul’s vicinity as Gollum’s duplicity
    grows apparent.
- description: Frodo is left paralyzed by Shelob’s attack after Gollum’s betrayal;
    Sam battles Shelob and rescues Frodo from captivity in an orc tower.
  id: s_15
  key_delta: Frodo is saved from death; the hobbits continue their quest despite severe
    hardships.
  trigger_event: Sam fights Shelob and rescues the incapacitated Frodo from orc guards.
- description: Aragorn leads the forces to the Black Gate of Mordor to distract Sauron’s
    army, providing Frodo and Sam a chance to enter Mount Doom undetected.
  id: s_16
  key_delta: Distraction at the Black Gate enables stealth entry for Sam and Frodo
    toward Mount Doom.
  trigger_event: Aragorn’s army advances and challenges the Black Gate, drawing Sauron’s
    attention.
- description: Sam carries the weakened Frodo up Mount Doom; at the Cracks of Doom,
    Frodo succumbs to the Ring's power, claiming it instead of destroying it.
  id: s_17
  key_delta: Frodo’s claim over the Ring allows Gollum to attack and seize it by biting
    off Frodo’s finger.
  trigger_event: Frodo refuses to destroy the Ring at the volcanic summit.
- description: Frodo and Gollum struggle at the volcano’s edge; Frodo survives by
    clutching the ledge, while Gollum falls into the lava with the Ring.
  id: s_18
  key_delta: The One Ring is destroyed with Gollum; the source of Sauron’s power is
    annihilated.
  trigger_event: Both fall into the fiery chasm, but Frodo grabs the ledge, Gollum
    plunges with the Ring.
- description: With the Ring destroyed, Mordor collapses; Eagles led by Gandalf rescue
    Frodo and Sam from the rising lava and the battlefield stabilizes.
  id: s_19
  key_delta: Survival of the hobbits and collapse of Sauron’s domain, ending the war.
  trigger_event: Eagles arrive and carry Frodo and Sam away from the devastated Mount
    Doom.
- description: In the aftermath, Aragorn is crowned King of Gondor; reunited with
    Arwen and honored alongside the four hobbits for their bravery and endurance.
  id: s_20
  key_delta: Restoration of the kingdom under Aragorn’s rule; friendship and alliances
    are celebrated.
  trigger_event: The coronation ceremony in Minas Tirith and public recognition of
    the heroes.
- description: The four hobbits return to the Shire, where life returns to normal;
    Sam marries Rosie Cotton, symbolizing peace and renewal.
  id: s_21
  key_delta: Reintegration into peaceful home life; hope for the future of the Shire.
  trigger_event: The hobbits arrive at the Shire and Sam weds Rosie in a festive ceremony.
- description: Years later, Frodo departs Middle-earth for the Undying Lands, accompanied
    by Gandalf, Bilbo, Elrond, Celeborn, and Galadriel, leaving Sam as the custodian
    of their tale.
  id: s_22
  key_delta: Closure of Frodo’s journey; legacy entrusted to Sam; end of the Ring’s
    saga.
  trigger_event: Frodo boards a ship departing the Grey Havens toward the West with
    the company.
