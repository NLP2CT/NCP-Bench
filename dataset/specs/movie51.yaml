commitments:
- description: Pippin must encounter the palantír and witness Sauron's mind invasion
    before Gandalf deduces Sauron's intent to attack Minas Tirith or before any strategic
    response regarding Sauron's threat.
  id: c_0
  satisfaction_condition: Node s_1 has been achieved (Pippin's palantír vision and
    Gandalf's deduction).
  type: ordering
  violation_condition: Any narrative or player action implying knowledge of Sauron's
    plan or Gandalf's deduction before s_1 is completed.
- description: Pippin must not reveal any information regarding Frodo or the Ring
    to Sauron via the palantír at any point between s_1 and s_20 to preserve secrecy
    of the Ring's location.
  id: c_1
  satisfaction_condition: Throughout nodes s_1 to s_20, Pippin consistently withholds
    info about Frodo and the Ring; no NPC or player disclosure occurs.
  type: invariant
  violation_condition: Any event or player action that causes Pippin or any character
    to reveal Frodo's or the Ring's whereabouts via the palantír or other means before
    s_20.
- description: Gandalf and Pippin must present themselves to Denethor at Minas Tirith
    and formally request aid from Rohan before any alliance or troops from Rohan are
    mobilized to assist Gondor.
  id: c_2
  satisfaction_condition: Node s_2 completed (meeting Denethor and requesting Rohan
    aid) before s_4 or s_8 (Rohan's mobilization/beacon signaling).
  type: ordering
  violation_condition: Rohan's aid or troop movements initiated prior to the completion
    of s_2.
- description: Denethor refuses aid from Rohan due to suspicion of Gandalf and Aragorn,
    maintaining political tension until his death at s_10.
  id: c_3
  satisfaction_condition: From s_2 up to and including s_9, Denethor does not call
    Rohan for aid; suspicion remains unresolved.
  type: invariant
  violation_condition: Denethor calls for Rohan's aid earlier than s_10 or displays
    trustful cooperation before Pippin's pledge and Gandalf's urgings.
- description: Denethor must send Faramir on a mission to reclaim Osgiliath only after
    the Morgul army led by the Nazgûl attacks and pushes Gondorian forces out.
  id: c_4
  satisfaction_condition: Node s_3 completed (Morgul army expulsion of Gondorians)
    before s_4 and the dispatch of Faramir.
  type: ordering
  violation_condition: Faramir is sent on his mission or is gravely wounded/killed
    before s_3 occurs.
- description: Pippin must light the beacon fire as a signal to Rohan, triggering
    their mobilization to assist Gondor in battle.
  id: c_5
  satisfaction_condition: Node s_4 completed with Pippin lighting the beacon and Rohan
    being alerted and responding.
  type: achievement
  violation_condition: No successful beacon lighting occurs, or Rohan is not alerted
    and mobilized by s_11.
- description: Aragorn must receive the sword Andúril and the message of Arwen’s condition
    from Elrond before pursuing the Paths of the Dead and claiming the Army of the
    Dead’s allegiance.
  id: c_6
  satisfaction_condition: Node s_5 is completed with Aragorn receiving Andúril and
    Elrond's message prior to s_7.
  type: invariant
  violation_condition: Aragorn attempts to claim the Army of the Dead or proceed with
    the Paths of the Dead quest before acquiring Andúril and Elrond's message.
- description: Éowyn's confession and Aragorn's reaffirmation of his love for Arwen
    must occur before Aragorn departs to the Paths of the Dead or goes to battle.
  id: c_7
  satisfaction_condition: Node s_6 is completed before s_7 and s_8.
  type: ordering
  violation_condition: Aragorn departs without this emotional exchange occurring or
    acknowledging Éowyn’s confession.
- description: Aragorn, Legolas, and Gimli must secure the allegiance of the Army
    of the Dead by brandishing Andúril and proving Aragorn’s heirship before the arrival
    of forces at Minas Tirith.
  id: c_8
  satisfaction_condition: Node s_7 completed with the Army of the Dead sworn to Aragorn
    prior to s_13.
  type: achievement
  violation_condition: Aragorn proceeds to the Black Gate or Minas Tirith battle without
    having the Army of the Dead’s support.
- description: Éowyn and Merry secretly join Théoden's forces without Théoden’s initial
    knowledge, preserving the secrecy of their involvement until s_8 and s_11 respectively.
  id: c_9
  satisfaction_condition: From s_8 through s_11, the secret participation of Éowyn
    and Merry is maintained without open revelation.
  type: invariant
  violation_condition: Any premature exposure of their participation or Théoden knowingly
    includes them at the beginning of the march.
- description: Denethor’s attempt to burn himself and Faramir alive and Gandalf’s
    intervention must occur after Faramir is gravely wounded and believed dead, and
    before Denethor’s death and the final defense of Minas Tirith.
  id: c_10
  satisfaction_condition: Node s_10 completed prior to s_11 and s_13.
  type: ordering
  violation_condition: Denethor dies, or Faramir is saved before this suicide attempt
    sequence or contradicts the sequence outlined.
- description: The Rohirrim’s cavalry charge led by Théoden must occur after Minas
    Tirith’s siege is underway and after Pippin’s beacon signaling and Rohan’s mobilization.
  id: c_11
  satisfaction_condition: Node s_11 completed only after s_4 (beacon) and s_9 (siege)
    have taken place.
  type: ordering
  violation_condition: Rohirrim charge occurs before the siege begins or before Rohan
    is alerted and mobilized.
- description: The Witch-king kills Théoden and is killed in turn by Éowyn with Merry’s
    help during the battle, reinforcing the stakes of the battle and shifting the
    morale of allies.
  id: c_12
  satisfaction_condition: Node s_12 occurs with these deaths acknowledged before s_13.
  type: invariant
  violation_condition: Either the Witch-king survives past the battle, Théoden stays
    alive, or Éowyn does not kill the Witch-king with Merry’s aid.
- description: Aragorn’s arrival at Minas Tirith with the Army of the Dead decisively
    ends the siege battle by overwhelming Sauron’s forces.
  id: c_13
  satisfaction_condition: Node s_13 completed with Aragorn’s forces defeating the
    enemy and the Army of the Dead being freed.
  type: achievement
  violation_condition: The siege concludes without Aragorn and the Army of the Dead’s
    intervention or their failure to defeat Sauron’s forces.
- description: Frodo and Sam’s trust must fracture due to Gollum’s manipulation before
    Frodo is betrayed and left for Shelob’s attack.
  id: c_14
  satisfaction_condition: Node s_14 completed before s_15, with evident distrust and
    Gollum’s treachery emerging.
  type: invariant
  violation_condition: Frodo and Sam maintain trust or Gollum’s betrayal occurs without
    prior strain on their relationship.
- description: Sam’s rescue of Frodo from Shelob’s lair and the orc tower must occur
    after Frodo’s paralysis and Gollum’s betrayal.
  id: c_15
  satisfaction_condition: Node s_15 completed after s_14 and prior to journey continuation
    towards Mount Doom (s_16).
  type: ordering
  violation_condition: Sam rescues Frodo before Frodo is attacked or paralyzed by
    Shelob or before Gollum’s betrayal is established.
- description: Aragorn’s army must advance to the Black Gate of Mordor to draw Sauron’s
    attention only after Minas Tirith has been defended and the hobbits approach Mount
    Doom.
  id: c_16
  satisfaction_condition: Node s_16 completed after s_13 (Minas Tirith defense) and
    in parallel with s_14-15 (Frodo and Sam’s journey).
  type: ordering
  violation_condition: Aragorn’s distraction at the Black Gate occurs before Minas
    Tirith’s siege or before the hobbits have reached Mordor.
- description: Frodo must succumb to the Ring’s power at the Cracks of Doom, refusing
    to destroy it, which triggers Gollum’s attack and the Ring’s eventual destruction.
  id: c_17
  satisfaction_condition: Node s_17 completed with Frodo’s refusal, followed by s_18
    where Gollum seizes the Ring and falls.
  type: invariant
  violation_condition: Frodo destroys the Ring willingly or resists its power without
    the final struggle involving Gollum.
- description: The One Ring’s destruction at Mount Doom must be achieved through the
    fall of Gollum into the lava, leading to Sauron’s downfall.
  id: c_18
  satisfaction_condition: Node s_18 completed describing the Ring’s destruction as
    Gollum falls into lava with it.
  type: achievement
  violation_condition: The Ring remains intact, or both Frodo and Gollum fall without
    the Ring’s destruction occurring.
- description: Frodo and Sam must be rescued by the Eagles after the Ring is destroyed
    and before leaving Mordor.
  id: c_19
  satisfaction_condition: Node s_19 completed with Eagles rescuing Frodo and Sam following
    the Ring’s destruction.
  type: ordering
  violation_condition: No rescue occurs; Frodo and Sam perish or remain stranded after
    the Ring’s destruction.
- description: Aragorn must be crowned King of Gondor, reunited with Arwen and honored
    alongside the hobbits, marking restoration and victory.
  id: c_20
  satisfaction_condition: Node s_20 completed with the coronation and reunions fulfilled.
  type: achievement
  violation_condition: Aragorn fails to be crowned or is not publicly recognized;
    reunions and honors do not occur.
- description: The four hobbits must return safely to the Shire and resume peaceful
    life, including Sam’s marriage to Rosie Cotton.
  id: c_21
  satisfaction_condition: Node s_21 completed with hobbits’ return and Sam’s wedding
    ceremony.
  type: achievement
  violation_condition: Any hobbit fails to return; Sam does not marry Rosie or peace
    is not restored in the Shire.
- description: Frodo’s departure for the Undying Lands with Gandalf and others marks
    the definitive closure of the Ring’s saga and legacy transfer to Sam.
  id: c_22
  satisfaction_condition: Node s_22 completed with Frodo’s sea departure and Sam entrusted
    with the quest’s account.
  type: achievement
  violation_condition: Frodo remains in Middle-earth or the saga ends without this
    departure and passing of legacy.
