commitments:
- description: Julia’s death (s_0) must occur before the rivalry and sabotage between
    Angier and Borden begins (s_1) to prevent premature blame attribution.
  id: c_0
  satisfaction_condition: Node s_0 is completed before node s_1 is triggered.
  type: ordering
  violation_condition: Player attempts to proceed to or acknowledge sabotage acts
    (s_1) without first confirming Julia’s death (s_0).
- description: The rivalry and sabotage phase (s_1 to s_6) must maintain the ongoing
    mutual hostility without early reconciliation or cooperation.
  id: c_1
  satisfaction_condition: From s_1 through s_6, Angier and Borden continuously sabotage
    each other’s acts and show enmity.
  type: invariant
  violation_condition: Player facilitates cooperation or mutual forgiveness between
    Angier and Borden before s_6 is reached.
- description: Angier’s discovery of Borden’s family life (s_2) must precede sabotage
    of bullet catch (s_3) to preserve Angier’s jealousy motivation.
  id: c_2
  satisfaction_condition: Node s_2 completes before any sabotage of Borden’s acts
    (s_3).
  type: ordering
  violation_condition: Player causes sabotage of Borden’s acts (s_3) before learning
    about Borden’s family (s_2).
- description: Angier must successfully replicate Borden’s 'Transported Man' trick
    using Root (s_4) before initiating investigative attempts.
  id: c_3
  satisfaction_condition: Node s_4 is completed prior to sending Olivia to uncover
    secrets (s_5).
  type: achievement
  violation_condition: Player triggers Olivia’s espionage or secretrelated events
    (s_5) prior to Angier’s replication of the trick (s_4).
- description: Olivia’s shift in loyalty (s_5) prevents Angier from directly obtaining
    Borden’s real secrets early; information flow must remain mediated.
  id: c_4
  satisfaction_condition: From s_5 onwards, Olivia acts as an intermediary controlling
    access to Borden’s diary, never directly confirming the secret without events
    progressing.
  type: invariant
  violation_condition: Player obtains Borden’s true secret knowledge without Olivia’s
    diary involvement or Olivia’s informed choice at s_5.
- description: The keyword 'Tesla' as the key to secrets (s_7) must be revealed before
    Angier pursues Nikola Tesla’s machine (s_8).
  id: c_5
  satisfaction_condition: Node s_7 completes before Angier visits Tesla’s lab (s_8).
  type: ordering
  violation_condition: Player triggers Angier’s Tesla lab visit or acquisition of
    teleportation machine (s_8) without first having obtained the keyword (s_7).
- description: Tesla’s machine inevitably creates duplicates; player decisions cannot
    negate or change this duplication property during or after s_8.
  id: c_6
  satisfaction_condition: During and after s_8, actions or dialogue never deny the
    machine’s duplication effect.
  type: invariant
  violation_condition: Player or system allows that teleportation machine works by
    transporting original only, or denies duplication property post s_8.
- description: Sarah’s suicide (s_9) and subsequent deterioration of Borden’s relationships
    must precede Angier’s final perfected 'Real Transported Man' act debut (s_10).
  id: c_7
  satisfaction_condition: Node s_9 completes before s_10 is triggered.
  type: ordering
  violation_condition: Player advances to Angier’s final act (s_10) prior to Sarah’s
    death and Borden’s personal downfall (s_9).
- description: Borden must witness Angier’s drowning backstage (s_10) to enable the
    consequent framing and arrest for murder (s_11).
  id: c_8
  satisfaction_condition: Evidence of Borden witnessing Angier’s fall (s_10) is established
    before arrest and conviction events (s_11).
  type: achievement
  violation_condition: Player causes Borden’s arrest and conviction (s_11) without
    the witnessing event of Angier’s drowning (s_10).
- description: Borden’s imprisonment (s_11) and receipt of Angier’s diary must precede
    discovery of Angier’s survival as Lord Caldlow (s_12).
  id: c_9
  satisfaction_condition: Node s_11 completes before s_12 is triggered.
  type: ordering
  violation_condition: Player attempts to reveal Angier’s living identity as Lord
    Caldlow (s_12) before Borden’s conviction and diary acquisition (s_11).
- description: Borden’s death and Fallon’s vow to continue their shared life (s_12)
    is necessary before Cutter’s final confrontation with Caldlow/Angier (s_13).
  id: c_10
  satisfaction_condition: s_12 occurs prior to s_13, establishing Fallon's full role.
  type: achievement
  violation_condition: Player initiates Cutter’s confrontation and killing of Caldlow
    (s_13) before Borden’s execution and the vow (s_12).
- description: The true identity of Fallon and Borden as identical twins sharing lives,
    including the finger mutilation and lover exchange, must remain consistent from
    s_13 onward.
  id: c_11
  satisfaction_condition: Their twin identity and shared life narrative is confirmed
    and unaltered once revealed from s_13 forward.
  type: invariant
  violation_condition: Player or system allows contradictory identity or denies twin
    shared life after s_13 reveal.
- description: The repetitive tragic cycle of Angier’s duplications and Julia’s drowning
    must be established and ended with the fire consuming the building (s_14).
  id: c_12
  satisfaction_condition: Node s_14 is reached, ending the cycle definitively.
  type: achievement
  violation_condition: Player prevents or circumvents the destruction of the duplicating
    machine and tanks (s_14), allowing indefinite repetition.
- description: The film’s narrative closure recapping the opening bird magic illusion
    and Fallon/Borden reclaiming Jess (s_15) must occur only after all prior key narrative
    death and resolution events (s_0 to s_14).
  id: c_13
  satisfaction_condition: Node s_15 triggers strictly after node s_14 completes.
  type: ordering
  violation_condition: Player triggers the final resolution scene (s_15) prematurely,
    before the concluding events including death and destruction (s_14).
