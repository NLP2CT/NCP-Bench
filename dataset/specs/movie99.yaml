commitments:
- description: Cole and Hitch must be officially hired and given full authority over
    Appaloosa by the town council before enforcing law in the town.
  id: c_0
  satisfaction_condition: Node s_0 is triggered, indicating formal hiring and authority
    transfer has occurred.
  type: achievement
  violation_condition: Any attempt to exercise law enforcement powers or gain full
    control over Appaloosa before s_0 is reached and authority granted.
- description: The confrontation with the four of Bragg’s men in the saloon (s_1)
    must occur only after Cole and Hitch are formally hired and empowered (s_0).
  id: c_1
  satisfaction_condition: Node s_1 occurs strictly after s_0 in the narrative timeline.
  type: ordering
  violation_condition: Confrontation or lethal actions against Bragg’s men take place
    before s_0 is reached.
- description: After the saloon confrontation at s_1 and before Bragg’s trial at s_4,
    hostility between the factions remains high and no peaceful resolution is accepted.
  id: c_2
  satisfaction_condition: Between s_1 and s_4 (inclusive), no negotiation reduces
    the conflict to anything less than mutual hostility as established at s_2.
  type: invariant
  violation_condition: Player actions or narrative states induce reconciliation or
    peace agreements between Cole/Hitch and Bragg’s faction before the trial testimony
    at s_4.
- description: Bragg must be officially found guilty through the testimony of his
    own man prior to any attempt to carry out his sentence or transfer custody.
  id: c_3
  satisfaction_condition: 'Node s_4 triggered: Testimony and verdict of guilty established.'
  type: achievement
  violation_condition: Bragg is taken into custody, sentenced, or actions to execute
    him initiated before the court trial and guilty verdict at s_4.
- description: Bragg's escape by the Shelton brothers (s_5) can only occur after his
    official conviction (s_4).
  id: c_4
  satisfaction_condition: s_5 occurs strictly after s_4.
  type: ordering
  violation_condition: Bragg escapes from custody or is freed without having been
    found guilty in s_4.
- description: Allie French's allegiance cannot be assumed as purely a hostage until
    after the encounter at the stream (s_6) reveals her complicity with the Sheltons.
  id: c_5
  satisfaction_condition: Between s_5 and s_6, Allie is treated as a hostage; at s_6
    the new information alters this assumption.
  type: invariant
  violation_condition: Player or system treats Allie as knowingly allied with Sheltons
    before s_6 is achieved and observed frolicking scene is recognized.
- description: Bragg must be delivered into Beauville sheriff Russell’s custody before
    the Sheltons intervene and free him.
  id: c_6
  satisfaction_condition: 'Node s_7 triggered: Bragg transferred to Beauville Sheriff''s
    control.'
  type: achievement
  violation_condition: Bragg is freed or challenged before lawful delivery to Beauville
    sheriff Russell.
- description: Sheriff Russell’s corruption and kinship to Sheltons must remain unknown
    to Cole and Hitch until Bragg’s escape and the gunfight occur.
  id: c_7
  satisfaction_condition: Between s_7 and s_8, no knowledge or suspicion of Russell's
    collusion is revealed or acted upon by the player character.
  type: invariant
  violation_condition: Player uncovers or acts on Russell’s relationship to Sheltons
    before s_8 is triggered.
- description: The gunfight with the Shelton brothers and Russell (s_8) must precede
    the return to Appaloosa with Allie (s_9).
  id: c_8
  satisfaction_condition: s_8 occurs strictly before s_9.
  type: ordering
  violation_condition: Return to Appaloosa with Allie happens without prior confrontation
    with Sheltons and Russell.
- description: Bragg’s return under presidential pardon (s_10) must only occur after
    he has escaped custody and survived the gunfight.
  id: c_9
  satisfaction_condition: s_10 triggered only after s_8 (gunfight) and s_9 (return)
    have been completed.
  type: achievement
  violation_condition: Bragg’s pardon and reestablishment in town occurs before he
    escapes and survives the prior conflicts.
- description: Hitch’s knowledge of Bragg’s illegal activities and secret relationship
    with Allie cannot develop before Bragg’s reappearance in Appaloosa at s_10.
  id: c_10
  satisfaction_condition: Between s_10 and s_11, Hitch uncovers this information;
    before s_10, no such knowledge exists.
  type: invariant
  violation_condition: Player gains or acts upon evidence of Bragg’s secret dealings
    or Allie’s betrayal before s_10.
- description: Hitch’s resignation and duel challenge to Bragg (s_12) must occur after
    uncovering Bragg’s deception and the secret relationship (s_11).
  id: c_11
  satisfaction_condition: s_12 occurs strictly after s_11.
  type: ordering
  violation_condition: Hitch resigns or challenges Bragg without prior discovery of
    Bragg’s illegal activities or Allie’s involvement.
- description: Bragg must be killed by Hitch in a duel for the narrative to reach
    resolution of the primary conflict.
  id: c_12
  satisfaction_condition: At s_12, Bragg is killed by Hitch in the duel.
  type: achievement
  violation_condition: The narrative ends or progresses without Bragg’s death occurring
    through Hitch’s public duel.
- description: Hitch’s departure from Appaloosa (s_13) must follow his duel with and
    killing of Bragg (s_12).
  id: c_13
  satisfaction_condition: s_13 happens strictly after s_12.
  type: ordering
  violation_condition: Hitch leaves the town prior to completing the duel and killing
    Bragg.
