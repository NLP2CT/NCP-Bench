meta:
  genres: ["Western", "Drama"]
  id: movie99
  player_role: Everett Hitch
  title: "Appaloosa"
synopsis: In 1882, the small western town of Appaloosa, New Mexico, is being terrorized
  by local rancher Randall Bragg, who killed Marshal Jack Bell and two of his deputies
  in cold blood when they came to his ranch to arrest two of Bragg's ranch hands.
  The town decides to hire lawman and town-tamer Virgil Cole and his deputy, Everett
  Hitch, to protect and regain control of the town. The council members agree to give
  complete control to Cole and Hitch. They begin taking control by confronting four
  of Bragg's men who are causing a disturbance in the saloon. Three men refuse to
  allow themselves to be arrested and Cole kills two of them while Hitch kills the
  third with his weapon of choice——an eight-gauge shotgun. The survivor surrenders
  his weapon to Hitch and leaves the saloon. Bragg has a meeting with Cole and Hitch
  and neither side will cede an inch to the other. Cole meets a new arrival to the
  town, recently widowed Allie French, and starts a relationship with her. When one
  of Bragg's men tells Cole and Hitch he will testify that his boss killed the marshall,
  Bragg is tried and found guilty. En route via train to his execution, Bragg is rescued
  by gunfighter brothers Ring and Mackie Shelton, old acquaintances of Cole, who have
  captured Allie and bring her along as a bargaining chip. Cole and Hitch catch up
  with the outlaws and discover that Allie is not a hostage when they see her and
  Ring Shelton frolicking naked together in a stream. After a brief fight with Indians,
  they turn Bragg in to the sheriff of Beauville, the nearest town. Unbeknownst to
  Cole, Sheriff Russell is a cousin of the Shelton brothers. Knowing that Cole is
  determined to bring Bragg back to hang, Ring and Mackie free Bragg and challenge
  Cole and Hitch to a gunfight. Both lawmen are wounded but manage to kill Ring, Mackie,
  and Russell. Cole and Hitch are unable to prevent Bragg from escaping on horseback,
  and they return to Appaloosa with Allie. Some time later, Bragg is granted a full
  pardon by President Chester A. Arthur and returns to Appaloosa in an attempt to
  publicly reform himself. He buys the hotel and ingratiates himself with the locals.
  Cole and Hitch suspect Bragg is using his claims of a silver strike to cover up
  illegal activity; specifically, a robbery of a gold shipment in Mexico. Hitch also
  discovers that Bragg is in a secret relationship with Allie. Unable to deal with
  Bragg legally, and wanting Allie to be with Cole, he quits as deputy and successfully
  challenges Bragg to a duel in front of Cole. He kills Bragg, and then leaves town;
  his parting words express his hope that Cole can find happiness with the fickle
  Allie.
trajectory:
- description: In 1882, the small western town of Appaloosa, New Mexico, is tense
    and fearful under the violent reign of rancher Randall Bragg, who has recently
    killed Marshal Jack Bell and two deputies in cold blood. The local town council,
    desperate for order, is contemplating hiring outside lawmen to restore peace,
    while Everett Hitch is present as deputy to newly arrived Virgil Cole, prepared
    to take on the challenge.
  id: s_0
  key_delta: The authority to enforce law and order in Appaloosa is formally given
    to Cole and Hitch, shifting power away from the locals and setting them as central
    agents against Bragg's terror.
  trigger_event: Town council members convene and officially hire Virgil Cole and
    Everett Hitch as lawman and deputy with full control of the town.
- description: Cole and Hitch enter the saloon where four of Bragg's men are causing
    disturbances, signaling the beginning of their active enforcement to regain control
    of the town.
  id: s_1
  key_delta: 'Confrontation escalates to violence: Cole kills two men; Hitch kills
    a third with his eight-gauge shotgun, and the fourth surrenders and leaves, demonstrating
    Cole and Hitch''s lethal effectiveness and marking their first direct clash with
    Bragg''s men.'
  trigger_event: Cole and Hitch confront the four disruptive men inside the saloon.
- description: Following the saloon confrontation, Bragg arranges a face-to-face meeting
    with Cole and Hitch where tensions remain high and neither side shows willingness
    to yield.
  id: s_2
  key_delta: Mutual hostility is cemented, confirming that no peaceful resolution
    is forthcoming and that the conflict will escalate.
  trigger_event: Randall Bragg holds a tense negotiation meeting with Cole and Hitch,
    refusing to compromise.
- description: Virgil Cole meets Allie French, a recently widowed woman newly arrived
    in Appaloosa, beginning a personal connection amidst the town’s ongoing turmoil.
  id: s_3
  key_delta: Introduction of Allie French into Cole’s life, establishing the beginnings
    of a relationship that will later impact both lawmen's dynamics.
  trigger_event: Cole encounters Allie French and initiates contact with her.
- description: Bragg’s control weakens as one of his own men offers to testify to
    Bragg’s role in the marshal’s murder, leading to a formal trial.
  id: s_4
  key_delta: Bragg is officially charged and found guilty of murdering the marshal,
    marking a major legal victory for Cole and Hitch.
  trigger_event: Bragg’s man comes forward to testify against him.
- description: En route on a train to execution, Bragg is rescued by gunfighter brothers
    Ring and Mackie Shelton, former acquaintances of Cole, who unexpectedly bring
    Allie French along as leverage.
  id: s_5
  key_delta: Bragg escapes custody; Allie is forcibly taken along, complicating loyalties
    and introducing the Sheltons as significant new antagonists.
  trigger_event: Ring and Mackie Shelton intercept the train, free Bragg, and capture
    Allie French.
- description: Cole and Hitch catch up with the Shelton brothers after noticing Allie
    and Ring Shelton apparently intimately involved in a stream, revealing Allie is
    not their hostage but complicit with them.
  id: s_6
  key_delta: New understanding that Allie may be allied with the Sheltons, challenging
    Hitch’s and Cole’s assumptions about her role.
  trigger_event: Cole and Hitch observe Allie French and Ring Shelton frolicking naked
    together at a stream.
- description: After an encounter with hostile Indians, Cole and Hitch successfully
    turn Bragg in to the sheriff of Beauville, the nearest town, expecting lawful
    custody to hold.
  id: s_7
  key_delta: Bragg is out of Appaloosa custody, placed under Beauville law enforcement,
    with Russell's role as Sheriff established.
  trigger_event: Cole and Hitch deliver Bragg to Beauville's sheriff, Russell.
- description: Unbeknownst to Cole and Hitch, Sheriff Russell is a cousin of the Shelton
    brothers who then orchestrate Bragg’s release and directly challenge Cole and
    Hitch to a gunfight.
  id: s_8
  key_delta: Trusted law enforcement is revealed compromised; Cole and Hitch are wounded
    but kill Ring, Mackie, and Russell; however, Bragg escapes, prolonging the conflict.
  trigger_event: Shelton brothers free Bragg from Sheriff Russell’s custody and confront
    Cole and Hitch in a gunfight.
- description: Cole and Hitch return to Appaloosa with Allie, recovering from their
    wounds and regrouping, as Bragg remains at large and dangerous.
  id: s_9
  key_delta: Crisis moment resolved with enemies neutralized but key antagonist Bragg
    still free, and presence of Allie integrated back into Appaloosa.
  trigger_event: Cole and Hitch come back to Appaloosa after the gunfight, bringing
    Allie with them.
- description: Months later, Bragg returns to Appaloosa under a full pardon from President
    Chester A. Arthur, publicly seeking to reform by buying the hotel and ingratiating
    himself with the townspeople.
  id: s_10
  key_delta: Bragg regains official social standing and economic foothold within the
    town, creating new tensions and suspicion.
  trigger_event: Bragg reappears in Appaloosa, announcing his pardon and reform efforts.
- description: Cole and Hitch grow wary of Bragg’s purported silver strike, suspecting
    it is a cover for illegal gold shipment robbery in Mexico; additionally, Hitch
    discovers Bragg is secretly involved with Allie.
  id: s_11
  key_delta: Hitch obtains critical knowledge of Bragg’s continued illegal operations
    and Allie’s betrayal, intensifying personal and professional conflicts.
  trigger_event: Hitch uncovers evidence suggesting Bragg’s criminal activities and
    secret relationship with Allie.
- description: Unable to legally confront Bragg and wishing Allie to be free of him,
    Hitch resigns as deputy, challenges Bragg to a duel in front of Cole, and kills
    him.
  id: s_12
  key_delta: Bragg is killed by Hitch in a duel; Hitch severs official ties to the
    town and sets the stage for his departure.
  trigger_event: Hitch formally quits his deputy role and engages Bragg in a public
    duel.
- description: Following the duel, Hitch departs from Appaloosa, expressing hope for
    Cole to find happiness with the complex Allie as he leaves the town’s uncertain
    future behind.
  id: s_13
  key_delta: Hitch’s exit concludes his involvement in Appaloosa’s affairs, transferring
    the responsibility for the town and Allie’s fate fully to Cole.
  trigger_event: Hitch leaves Appaloosa after the duel, parting words directed toward
    Cole.
