commitments:
- description: The mission assignment from Saito (s_0) must occur before entering
    Fischer's subconscious dream (s_1), ensuring the narrative progresses logically
    from preparation to execution.
  id: c_0
  satisfaction_condition: Node s_0 is completed before s_1 begins, with the team having
    received and acknowledged Saito's assignment.
  type: ordering
  violation_condition: Player attempts to enter or act within Fischer’s subconscious
    (s_1) before receiving the assignment (s_0).
- description: While inside the dream layers (from s_1 through s_8), death of a dreamer
    causes that dream layer to collapse unless it results in entering limbo if death
    occurs at the deepest level or from sedation effects.
  id: c_1
  satisfaction_condition: During dream-layered infiltration phases (s_1–s_8), death
    of non-Cobb dreamers triggers the collapse of that dream layer’s dreamscape; death
    of key characters (Cobb or Saito) at deep layers leads to limbo (s_5 onwards)
    without immediate collapse.
  type: invariant
  violation_condition: Player causes death of a dreamer within a dream layer without
    triggering the corresponding dream collapse or fails to respond to collapse rules,
    leading to inconsistent narrative states.
- description: Extraction or inception efforts cannot succeed or advance before overcoming
    subconscious security projections controlling the dream defenses at each layer
    (starting s_2).
  id: c_2
  satisfaction_condition: Subconscious projections opposing the team’s mission have
    been effectively neutralized or distracted before moving deeper or influencing
    Fischer’s thoughts (achieved by s_3).
  type: invariant
  violation_condition: Player obtains key information or inception success without
    engaging or handling subconscious projections, violating the logical defense mechanisms.
- description: Ariadne’s architectural design and understanding (introduced by s_3)
    must be established before Cobb and the team enter and manipulate limbo spaces
    (from s_5 onward) to prevent unstructured dream chaos.
  id: c_3
  satisfaction_condition: Node s_3 (Ariadne joins and designs dreams) occurs before
    s_5 (entry into limbo), implying knowledge of dream construction precedes entrance
    to limbo.
  type: ordering
  violation_condition: Player enters limbo (s_5) without previously having Ariadne’s
    involvement and dream architectural support (no completion of s_3).
- description: The inception must be successfully implanted into Robert Fischer’s
    subconscious before the team begins synchronized kicks to awaken (node s_7), defining
    mission success milestone.
  id: c_4
  satisfaction_condition: Fischer fully accepts the planted idea in the safe room
    during s_7, prior to team members initiating synchronized kicks back to reality.
  type: achievement
  violation_condition: Player attempts to exit or wake from dream layers (initiate
    kicks) before the inception is accepted by Fischer, or Fischer rejects the idea.
- description: The sequence of synchronized kicks from deepest dream layer to waking
    reality must maintain strict timing coordination to prevent dream collapse or
    becoming trapped in limbo (s_6 to s_9).
  id: c_5
  satisfaction_condition: All team members (except Cobb and Saito initially) successfully
    execute their respective kicks in proper order and timing resulting in layer-by-layer
    awakening (from s_6 through s_9).
  type: invariant
  violation_condition: Player desynchronizes or mistimes kicks causing premature dream
    collapse or failure to ascend dream layers, leading to logical narrative deadlock.
- description: Cobb’s cathartic confession and acceptance of responsibility for Mal’s
    death (s_6) must occur before he chooses to leave limbo and complete the mission
    (s_8), ensuring proper psychological resolution.
  id: c_6
  satisfaction_condition: Node s_6 is fully completed, with Cobb confronting Mal’s
    projection and confessing, before node s_8 (awakening from limbo) is triggered.
  type: ordering
  violation_condition: Player attempts to trigger awakening from limbo or mission
    completion (s_8) without Cobb’s confession and emotional resolution (s_6).
- description: Cobb must return to outer-world reality and reunite with his children
    (s_9) as the final narrative milestone, after passing through customs following
    successful inception and awakening.
  id: c_7
  satisfaction_condition: Node s_9 occurs upon airplane landing, Cobb’s clearance
    through customs, and reunion with children, marking mission closure.
  type: achievement
  violation_condition: Player fails to trigger return to reality and Cobb’s reunion
    after mission completion, causing the narrative to remain in dream or limbo indefinitely.
- description: Cobb’s totem behavior remains a reliable indicator of being in dream
    or reality from s_0 through s_9; top spinning forever only occurs inside dreams,
    spinning top falling occurs only in reality.
  id: c_8
  satisfaction_condition: The spinning top perpetually spins during all dream layers
    and stops spinning (falls over) upon waking in reality (noted by interaction events
    across s_0–s_9).
  type: invariant
  violation_condition: Player observes spinning top behavior inconsistent with the
    dream or reality status, such as top falling in dream or spinning infinitely in
    reality, violating internal logic.
