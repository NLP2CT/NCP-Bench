meta:
  genres: ["War", "Drama"]
  id: movie81
  player_role: Captain Benjamin L. Willard
  title: "Apocalypse Now"
synopsis: U.S. Army Captain and special operations veteran Benjamin L. Willard has
  returned from action to Saigon where he drinks heavily and destroys his hotel room.
  Intelligence officers Lieutenant General Corman and Colonel Lucas approach him with
  an assignment——Willard must follow the Nung River into the remote Cambodian jungle,
  find rogue U.S. Army Special Forces Colonel Walter E. Kurtz and kill him. Kurtz
  apparently went insane and now commands his own Montagnard troops inside neutral
  Cambodia. Willard joins a U.S. Navy PBR commanded by Chief Petty Officer George
  "Chief" Phillips and crewmen Lance Johnson, Jay "Chef" Hicks and Tyrone "Mr. Clean"
  Miller. For escort they rendezvous with reckless Lieutenant Colonel Bill Kilgore,
  who commands a squadron of attack helicopters. Initially scoffing at them, Kilgore
  befriends Johnson as both are keen surfers. When Willard suggests the Viet Cong-filled
  coastal mouth of the Nung River, Kilgore accepts due to the surfing conditions there.
  After napalm strikes and Ride of the Valkyries playing over the chopper loudspeakers,
  the beach is taken and Kilgore orders others to surf it amid enemy fire. While Kilgore
  nostalgically regales everyone about a previous strike, Willard gathers his men
  to the PBR, which had been transported from a helicopter. Willard sifts through
  files of Kurtz, learning he was a model officer and possible future general, a top
  soldier in the field. Navigating upstream, the crew encounters a tiger and later
  visit a supply depot USO show featuring Playboy Playmates. The crew search a civilian
  sampan they come across, but Mr. Clean snaps and kills almost all on board, while
  Willard coldly shoots an injured survivor to prevent any delay of his mission. On
  reaching a US outpost at a bridge under constant attack, Willard is informed that
  a Captain Colby was sent to find Kurtz, but is now missing. Lance and Chef are continually
  under the influence of drugs and Lance becomes withdrawn, smearing his face with
  camouflage paint. The next day the boat is fired upon by an unseen enemy in the
  trees, killing Mr. Clean and turning Chief hostile toward Willard. Later, they are
  ambushed again, by Montagnard warriors. They return fire and Chief is impaled with
  a spear, who then tries to kill Willard by pulling him onto it, but dies from his
  wound. Afterwards, Willard confides in the remaining Chef and Lance about his mission,
  and they reluctantly agree to continue upriver where they see the coastline is littered
  with bodies. Arriving at Kurtz's outpost, Willard takes Lance with him to the village,
  leaving Chef behind with orders to call an airstrike on the village if he does not
  return. In the camp, the two men are met by a manic freelance photographer, who
  explains that Kurtz's great philosophical skills inspire his people to follow him.
  As they proceed, they see bodies and severed heads scattered about the nearby temple
  that serves as Kurtz's living quarters, and encounter the missing Captain Colby,
  who is nearly catatonic. Willard is brought before Kurtz in the darkened temple,
  where Kurtz derides him as an errand boy. Meanwhile Chef calls in the airstrike
  but is kidnapped. Bound to a post, Willard screams helplessly as Kurtz drops Chef's
  severed head into his lap. After some time, Willard is released and given the freedom
  of the compound. Kurtz lectures him on his theories of war, humanity and civilization
  while praising the ruthlessness and dedication of the Viet Cong. He asks Willard
  to tell his son everything about him in the event of his death. That night, as the
  villagers ceremonially slaughter a water buffalo, Willard enters Kurtz's chamber
  as Kurtz is making a recording, and attacks him with a machete. Lying mortally wounded
  on the ground, Kurtz whispers his final words "The horror ... the horror ..." before
  dying. Willard descends the stairs from Kurtz's chamber and drops his weapon. The
  villagers do likewise and allow Willard to take Lance by the hand and lead him to
  the boat. The two of them sail away as airstrikes are launched on the village and
  Kurtz's final words echo. In some, but not all, prints of the film, the closing
  credits play over footage of Kurtz's temple-base exploding; some viewers interpreted
  this as an air strike called in by Willard. Because this was not Coppola's intention,
  after the film's original general release he replaced this footage with a plain
  black screen.
trajectory:
- description: Captain Benjamin L. Willard is in Saigon, recently returned from combat
    duty, staying in a hotel room where he is drinking heavily and exhibiting self-destructive
    behavior.
  id: s_0
  key_delta: Willard receives orders to find and kill rogue Colonel Walter E. Kurtz
    in Cambodia.
  trigger_event: Lieutenant General Corman and Colonel Lucas approach Willard with
    a new assignment.
- description: Willard joins a Navy PBR crew consisting of Chief Petty Officer Phillips,
    Lance Johnson, Jay 'Chef' Hicks, and Tyrone 'Mr. Clean' Miller preparing to navigate
    the Nung River into Cambodia.
  id: s_1
  key_delta: Kilgore engages with the PBR crew and chooses to support an assault near
    the river mouth due to his interest in surfing there.
  trigger_event: Lieutenant Colonel Bill Kilgore and his attack helicopter squadron
    rendezvous with the PBR flotilla for escort.
- description: Kilgore leads an intense helicopter assault on the Viet Cong-controlled
    coastal mouth of the Nung River with napalm and loud music while the PBR crew
    prepares to move upriver.
  id: s_2
  key_delta: Willard learns Kurtz was a decorated officer and potential general before
    going rogue.
  trigger_event: Willard gathers his men to the PBR and reviews Kurtz's military files.
- description: The PBR crew travels upstream encountering jungle wildlife and a USO
    show at a supply depot, maintaining military patrol operations.
  id: s_3
  key_delta: Violent escalation on the river with crew killing civilians to maintain
    mission secrecy and progress.
  trigger_event: The crew inspects a civilian sampan, leading to Mr. Clean killing
    the occupants and Willard executing a wounded survivor.
- description: The crew arrives at a US outpost under siege; informed about missing
    Captain Colby sent to find Kurtz; Lance and Chef display drug-induced altered
    behaviors.
  id: s_4
  key_delta: Casualty inflicted on crew; deteriorating trust and cohesion among remaining
    members.
  trigger_event: The PBR boat is ambushed from the trees, killing Mr. Clean and turning
    Chief hostile towards Willard.
- description: After a Montagnard warrior ambush, Chief is fatally speared and dies
    attempting to kill Willard; Willard shares mission details with Chef and Lance,
    who reluctantly agree to continue.
  id: s_5
  key_delta: Crew is reduced and committed to advancing toward Kurtz’s location with
    greater awareness of the mission's deadly stakes.
  trigger_event: The crew observes a coastline littered with bodies as they proceed
    upriver.
- description: Willard and Lance arrive at Kurtz’s jungle outpost; Chef remains at
    the boat with orders to call an airstrike if Willard does not return.
  id: s_6
  key_delta: Introduction to Kurtz's ideological and charismatic hold on his Montagnard
    troops and the dangerous environment surrounding the compound.
  trigger_event: Inside the village, they meet a manic freelance photographer who
    explains Kurtz’s influence over his followers.
- description: Willard and Lance traverse Kurtz's compound filled with scattered bodies
    and severed heads; they find the catatonic Captain Colby.
  id: s_7
  key_delta: Willard is now inside Kurtz's compound and under his direct power, with
    the remaining boat crew exposed outside.
  trigger_event: Willard is brought before Colonel Kurtz in a darkened temple room.
- description: Chef calls in an airstrike from the boat but is suddenly kidnapped;
    Willard is bound yet witnesses Chef's severed head dropped in his lap by Kurtz.
  id: s_8
  key_delta: Heightened danger with the loss of Chef and explicit threat from Kurtz
    toward Willard.
  trigger_event: Willard is released and given freedom within the compound.
- description: Willard roams Kurtz’s compound, listening to Kurtz’s lectures on war
    and humanity while Kurtz praises Viet Cong determination.
  id: s_9
  key_delta: Psychological and ideological immersion into Kurtz's worldview and community
    rituals.
  trigger_event: Nightfall; villagers perform a water buffalo slaughter ceremony while
    Kurtz records philosophical thoughts in his chamber.
- description: Willard attacks mortally wounded Kurtz with a machete inside the temple
    chamber; Kurtz dies uttering 'The horror... the horror...'.
  id: s_10
  key_delta: End of Kurtz’s leadership and symbolic collapse of his cult; Willard
    assumes control of the survivors.
  trigger_event: Willard descends the stairs, disarms himself, and villagers show
    submission, allowing him to take Lance and leave.
- description: Willard and Lance sail away from the village as distant airstrikes
    commence on the compound; Kurtz’s final words echo.
  id: s_11
  key_delta: Mission effectively concluded; departure from the conflict zone with
    ambiguous consequences.
  trigger_event: The boat moves downstream accompanied by the closing sounds of destruction
    and silence.
