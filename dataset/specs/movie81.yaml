commitments:
- description: Willard must receive his mission orders (s_0) before proceeding to
    join the PBR crew and start the river journey (s_1), preventing premature action
    without mission authorization.
  id: c_0
  satisfaction_condition: Narrative only advances to s_1 after s_0 is achieved, ensuring
    Willard has accepted the assignment to find and kill Kurtz.
  type: ordering
  violation_condition: Player attempts to engage upstream river patrol or gather Kurtz
    intelligence before s_0 completion, breaking the required mission reception sequence.
- description: Between s_1 and s_3, Willard’s knowledge of Kurtz’s profile is incomplete
    until he reviews military files upstream at s_2; the system must prevent any possession
    or revelation of Kurtz's background prior.
  id: c_1
  satisfaction_condition: Player gains Kurtz’s dossier and learns his prior status
    only at or after s_2, no earlier acknowledgement permitted.
  type: invariant
  violation_condition: Player acts or reveals Kurtz’s status as a model officer or
    potential general before s_2 node interaction.
- description: The violent encounter with the sampan civilians and subsequent crew
    killings (s_3) must occur before the crew's trust and cohesion begins to fray
    under ambush and casualties (s_4); ensures realistic escalation.
  id: c_2
  satisfaction_condition: 'Narrative progression from innocent patrols to fatal violence
    occurs strictly in order: s_3 precedes s_4.'
  type: ordering
  violation_condition: Player triggers crew hostility, distrust, or deaths from ambush
    (s_4 content) before engaging or resolving the sampan civilian encounter (s_3).
- description: From s_4 through s_5, crew must display increasing casualty and mistrust
    dynamics, with no restoration of full crew health or unwavering loyalty until
    Kurtz confrontation.
  id: c_3
  satisfaction_condition: Between s_4 and s_5, at least one crew member is dead or
    fatally wounded, and trust among survivors is deteriorated as displayed by Chief's
    hostility and ultimate death.
  type: invariant
  violation_condition: Player heals or restores crew full strength, or prematurely
    reestablishes full cohesion/trust during this phase, contradicting established
    fatal attrition.
- description: Willard must fully brief Chef and Lance on the mission only after Chief’s
    death and before proceeding to Kurtz’s outpost (transition from s_5 to s_6), ensuring
    informed companions during final approach.
  id: c_4
  satisfaction_condition: Mission details explicitly shared with remaining crew at
    or after s_5 and before arrival at Kurtz’s village (s_6).
  type: ordering
  violation_condition: Player advances upriver or interacts with Kurtz’s compound
    without having disclosed mission info to Chef and Lance.
- description: At s_6 and s_7, exposure to Kurtz’s ideological influence and compound
    environment must precede Willard’s direct confrontation with Kurtz to preserve
    narrative impact and logical immersion.
  id: c_5
  satisfaction_condition: Player experiences Kurtz’s followers’ fanaticism and compound
    atmosphere (including meeting photographer and Colby) before any direct meeting
    with Kurtz (s_7).
  type: invariant
  violation_condition: Willard encounters Kurtz prior to meeting key environmental
    and narrative elements confirming Kurtz’s control and influence.
- description: Chef’s kidnapping and death (s_8) is a pivotal emotional and narrative
    milestone that must occur only after Willard’s meeting with Kurtz; it anchors
    Willard’s captivity and tension escalation.
  id: c_6
  satisfaction_condition: Chef is abducted and killed only at or after s_7’s direct
    encounter with Kurtz and before Willard’s release in s_8.
  type: ordering
  violation_condition: Player witnesses or triggers Chef’s death prior to Kurtz meeting
    or before Willard’s binding and captivity.
- description: During s_8 and s_9, Willard remains under constrained freedom inside
    Kurtz’s compound and must endure Kurtz’s philosophical indoctrination; no escape
    or mission completion is logically admitted prior to this phase conclusion.
  id: c_7
  satisfaction_condition: Willard is bound or confined, subsequently granted conditional
    freedom within the compound while receiving Kurtz’s lectures before any assassination
    attempt.
  type: invariant
  violation_condition: Player escapes compound or kills Kurtz without first undergoing
    the binding, CCTV lectures, and psycho-philosophical immersion phases.
- description: The narrative succeeds only if Willard executes the assassination of
    Kurtz within the compound (s_10), marking the mission’s climax and symbolic resolution.
  id: c_8
  satisfaction_condition: Willard attacks and mortally wounds Kurtz, culminating in
    Kurtz’s final words and the collapse of his leadership.
  type: achievement
  violation_condition: Player fails to confront or kill Kurtz before mission end,
    or Kurtz survives beyond designated climax event.
- description: Willard’s departure from the compound with Lance (s_11) must only happen
    post-Kurtz’s death and the ritualized surrender of the villagers; prevents premature
    mission conclusion.
  id: c_9
  satisfaction_condition: Willard departs downstream with Lance only following Kurtz’s
    death and visible submission by villagers.
  type: ordering
  violation_condition: Player removes Willard and/or Lance from the compound prior
    to the death of Kurtz or without villagers’ submission.
