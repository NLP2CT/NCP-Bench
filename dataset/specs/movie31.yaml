meta:
  genres: ["Film-Noir", "Mystery"]
  id: movie31
  player_role: Philip Marlowe
  title: "The Big Sleep"
synopsis: The plot of The Big Sleep is unusually complex. Some details remain hazy
  at the film's end. Private detective Philip Marlowe calls on new client General
  Sternwood at his Los Angeles mansion. The wealthy general wants to resolve gambling
  debts his daughter, Carmen Sternwood, owes to bookseller Arthur Gwynn Geiger. As
  Marlowe is leaving, General Sternwood's older daughter, Mrs. Vivian Rutledge, stops
  him. She suspects her father's true motive for calling in a detective is to find
  his friend Sean Regan, who had mysteriously disappeared a month earlier. Marlowe
  goes to Geiger's "rare book shop." Agnes Louzier, Geiger's assistant, minds the
  shop——the front for an illegal operation. Marlowe follows Geiger to his house and
  hears a gunshot and a woman scream. Breaking into the house, he finds Geiger's body
  and a drugged Carmen, as well as a hidden camera with an empty cartridge. Marlowe
  picks Carmen up and brings her home. Marlowe later goes back to the house, but discovers
  the body is no longer there. Later, Marlowe learns that the Sternwood driver has
  been found dead, with his car driven off a pier. Vivian comes to Marlowe's office
  the next morning with scandalous pictures of Carmen she received with a blackmail
  demand for the negatives. Marlowe returns to Geiger's bookstore, and discovers that
  they are packing up the store. Marlowe follows a car leaving the bookstore to the
  apartment of Joe Brody, a gambler who previously blackmailed General Sternwood.
  Marlowe returns to Geiger's house where he finds Carmen. She initially claims ignorance
  about the murder of Geiger but then insists Brody killed Geiger. They are interrupted
  by the owner of the home, small-time gangster Eddie Mars. Marlowe follows Vivian
  to Joe Brody's apartment, where they join Brody and Agnes, and later, Carmen, who
  wants her photos. Marlowe takes the photos and sends Vivian and Carmen home. After
  Brody admits he was blackmailing both General Sternwood and Vivian, he is suddenly
  shot and killed; the assailant flees. Marlowe follows and apprehends Carol Lundgren,
  Geiger's former driver, who has killed Brody in revenge for Geiger's death. Marlowe
  visits Mars' casino, where he asks about Regan, who is supposed to have run off
  with Mars' wife. Mars is evasive and tells Marlowe that Vivian is running up debts
  in his casino. Vivian later tells Marlowe she wants him to take her home. While
  Marlowe waits for her, a stooge of Mars' attempts to rob Vivian. Marlowe intervenes
  and punches him out. While driving home, Marlowe unsuccessfully presses Vivian on
  her connection with Mars, telling her he knew the money she won and subsequent robbery
  was a setup by Mars and her to try to show Mars and Vivian had animosity toward
  each other. Vivian still won't say anything. Marlowe then returns home to find Carmen
  waiting for him. She admits she didn't like Regan and mentions that Mars calls Vivian
  frequently. She attempts to seduce Marlowe, who throws her out of his apartment.
  In the morning, Vivian calls Marlowe to say that Regan has been found in Mexico,
  and that she is going to see him. Harry Jones, an associate of Brody's, and Agnes'
  lover, conveys an offer from Agnes to reveal the location of Mars' wife for $200.
  However, when Marlowe goes to meet Jones, Canino, a hired killer, attempts to find
  Agnes himself and then poisons Jones after being told of her location. Marlowe then
  meets Agnes himself, after she telephones the office where Jones was killed. She
  reveals that she's seen Mona Mars near Realito by an auto repair shop. In Realito,
  Canino attacks Marlowe, who wakes to find himself tied up, being watched by Mona.
  Vivian then comes in. Mona throws a drink at him and leaves when Marlowe tells her
  that Mars is a gangster and a killer. Vivian fears for Marlowe's life and frees
  him, allowing him to get to his car and his gun. After Vivian helps distract him,
  Marlowe kills Canino and they leave together. During the drive back to Geiger's
  bungalow, Vivian unconvincingly tries to claim she killed Sean Regan. When they
  arrive, Marlowe calls Eddie Mars and says that he is still in Realito at the payphone.
  They arrange to meet at Geiger's house, giving Marlowe ten minutes to prepare. Mars
  arrives with four men, who set up ambush points outside. When Mars enters the home,
  Marlowe holds him at gunpoint. Marlowe reveals to him that he has discerned the
  truth——Mars blackmailed Vivian, saying Carmen had killed Regan. When Mars threatens
  Marlowe with his men outside, Marlowe begins to fire his gun near Mars, causing
  him to run outside where he is mistakenly shot dead by his own men. Marlowe then
  calls the police, telling them that Mars killed Regan. In the process, he tells
  them Vivian helped him with Eddie Mars, exempting her from criminal prosecution
  and that her sister Carmen needs a doctor's help.
trajectory:
- description: Private detective Philip Marlowe arrives at the Los Angeles mansion
    of wealthy General Sternwood. The mansion is grand but shadowed by underlying
    tensions. Marlowe stands in the opulent entry hall, aware of Sternwood's request
    for help with his younger daughter Carmen's gambling debts and the mysterious
    disappearance of Sternwood's friend Sean Regan.
  id: s_0
  key_delta: 'Marlowe is officially engaged to resolve two connected issues: Carmen
    Sternwood''s gambling debts and the potential search for the missing Sean Regan.'
  trigger_event: General Sternwood hires Marlowe to investigate Carmen's gambling
    debts and possibly find Sean Regan.
- description: Marlowe is leaving the Sternwood mansion when the elder daughter, Vivian
    Rutledge, confronts him in the mansion's driveway, dressed with an air of suspicion
    and control.
  id: s_1
  key_delta: Vivian reveals an alternative motive behind the investigation, expanding
    Marlowe’s understanding of Sternwood’s concerns.
  trigger_event: Vivian Rutledge stops Marlowe and tells him she suspects her father’s
    real motive is to find Sean Regan.
- description: Marlowe arrives at Arthur Gwynn Geiger's rare bookshop, a deceptively
    quiet storefront in a rundown part of Los Angeles, where Geiger and his assistant
    Agnes Louzier run an illegal operation behind the scenes.
  id: s_2
  key_delta: Marlowe uncovers the front nature of Geiger’s shop and identifies Agnes
    Louzier as Geiger’s assistant and potential informant.
  trigger_event: Marlowe visits Geiger’s rare bookshop in pursuit of information on
    Carmen’s gambling debts.
- description: Following Geiger to his house late at night, Marlowe hears a gunshot
    and a woman's scream coming from the property, cloaked in darkness and tension.
  id: s_3
  key_delta: Marlowe finds Geiger dead and Carmen drugged, leaving him with incriminating
    evidence and a vulnerable Sternwood daughter to remove from the scene.
  trigger_event: After hearing the shot, Marlowe enters the house and finds Carmen
    inside Geiger's murder scene.
- description: Marlowe brings the drugged Carmen back to the Sternwood mansion, concerned
    for her safety and integrity.
  id: s_4
  key_delta: Carmen is physically rescued from danger; Marlowe now holds her as a
    key witness and protected party.
  trigger_event: Marlowe carries Carmen from Geiger’s house and returns her to the
    mansion.
- description: Returning to Geiger’s house during the day, Marlowe finds the body
    of Geiger missing, the scene strangely altered and emptied.
  id: s_5
  key_delta: The disappearance of Geiger’s corpse reveals interference from other
    parties, complicating the investigation.
  trigger_event: Marlowe revisits Geiger’s house and notices the body is gone.
- description: Marlowe learns that the Sternwood family driver has been found dead,
    his car driven off a pier; the mood darkens around the Sternwood household.
  id: s_6
  key_delta: A new related death deepens the mystery and raises stakes around the
    Sternwood household.
  trigger_event: The new death draws Vivian back to Marlowe with fresh blackmail
    trouble involving Carmen.
- description: Vivian visits Marlowe's office the next morning, presenting scandalous
    photographs of Carmen accompanied by a blackmail demand for the negatives.
  id: s_7
  key_delta: The blackmail plot is revealed, adding pressure and urgency to protect
    the Sternwood family.
  trigger_event: With the blackmail photos in hand, Marlowe returns to Geiger's bookshop
    to push the investigation further.
- description: Marlowe returns to Geiger’s bookshop to investigate further but finds
    the shop closing and a suspicious car leaving the premises.
  id: s_8
  key_delta: The closing of the shop signals a cover-up or retreat and directs Marlowe
    toward new suspects.
  trigger_event: Marlowe arrives at Geiger’s bookstore to find it being packed up
    and closes behind a departing car.
- description: Marlowe follows the car to Joe Brody’s apartment, where tension builds
    amid known connections with the Sternwoods and the blackmail scheme.
  id: s_9
  key_delta: Marlowe identifies Brody as a key figure linked to blackmail and gambling
    debts.
  trigger_event: Marlowe tails the car from the bookstore to Joe Brody’s apartment.
- description: At the apartment, Marlowe finds Carmen, who initially denies knowledge
    of Geiger’s murder but later accuses Brody. Suddenly, Eddie Mars, a small-time
    gangster and owner of Geiger’s house, interrupts.
  id: s_10
  key_delta: Marlowe confirms Mars’ involvement and Carmen’s conflicting statements,
    exposing multiple layers of deception.
  trigger_event: Marlowe confronts Carmen at Brody's apartment; Eddie Mars arrives
    unexpectedly.
- description: Later, at Brody’s apartment, Vivian, Brody, Agnes, and Carmen gather
    with Marlowe taking possession of the blackmail photos before sending the sisters
    home.
  id: s_11
  key_delta: Marlowe gains control over blackmail evidence, shifting leverage away
    from the criminals.
  trigger_event: Once Marlowe secures the photos and sends the sisters away, Brody
    begins confessing the blackmail scheme.
- description: Brody admits blackmailing both General Sternwood and Vivian but is
    suddenly shot dead by an unknown assailant.
  id: s_12
  key_delta: Brody’s death removes a key suspect and introduces a new killer into
    the narrative.
  trigger_event: Brody confesses and is immediately killed by an unknown gunman.
- description: Marlowe chases and apprehends Carol Lundgren, Geiger’s former driver,
    who confesses to killing Brody in revenge for Geiger’s murder.
  id: s_13
  key_delta: The motive and identity of Brody’s killer are revealed, partially untangling
    the chain of violence.
  trigger_event: Marlowe captures Carol Lundgren after following the trail from Brody’s
    murder.
- description: At Eddie Mars’ casino, Marlowe inquires about Sean Regan and learns
    Mars is evasive, but reveals Vivian is running up debts there.
  id: s_14
  key_delta: Mars’ evasiveness and Vivian’s debts reveal layers of entanglement between
    Sternwood family and gangsters.
  trigger_event: Marlowe visits Mars’ casino and questions him about Regan and Vivian’s
    gambling.
- description: Vivian approaches Marlowe, expressing desire to leave, but while Marlowe
    waits for her, a Mars associate tries to rob her, which Marlowe stops.
  id: s_15
  key_delta: An attempt on Vivian’s safety exposes active criminal threats and possible
    setups.
  trigger_event: A Mars stooge attempts to rob Vivian during Marlowe’s vigilant watch.
- description: Driving Vivian home, Marlowe presses her on Mars connections and suspects
    their animosity is a setup, but Vivian refuses to cooperate.
  id: s_16
  key_delta: Vivian’s silence deepens the mystery of family involvement with Mars.
  trigger_event: Marlowe confronts Vivian about her relationship with Mars during
    their car ride.
- description: Marlowe returns home at night to find Carmen waiting; she admits disliking
    Regan and mentions Mars’s frequent calls to Vivian. She attempts to seduce Marlowe,
    who rejects her advances and expels her.
  id: s_17
  key_delta: Marlowe gains insight into Carmen’s feelings, confirming fractured family
    loyalties and her manipulative tendencies.
  trigger_event: Carmen visits Marlowe’s apartment, reveals resentments and tries
    to seduce him.
- description: The next morning, Vivian calls Marlowe to report Regan found alive
    in Mexico and tells him she is going to see him.
  id: s_18
  key_delta: Marlowe receives critical information that Regan is not dead but missing
    abroad.
  trigger_event: Vivian phones Marlowe with news of Regan’s whereabouts in Mexico.
- description: Harry Jones, associate of Brody and Agnes' lover, offers to reveal
    Mars' wife’s location for $200. Marlowe goes to meet Jones but finds Jones poisoned
    after Canino, a hired killer, attempts to locate Agnes and follows her trail.
  id: s_19
  key_delta: A new lethal player, Canino, is introduced, threatening witnesses and
    escalating danger.
  trigger_event: Marlowe investigates the meeting with Harry Jones and discovers Jones
    has been poisoned by Canino.
- description: Agnes calls Marlowe’s office to confirm seeing Mona Mars near Realito;
    Marlowe travels there and is ambushed by Canino, waking tied up under Mona's watch
    in a remote garage.
  id: s_20
  key_delta: Marlowe is physically trapped and endangered, while Mona Mars is introduced
    as an actor in the unfolding drama.
  trigger_event: Marlowe follows Agnes’ tip to Realito and is captured by Canino at
    the auto repair shop.
- description: Vivian arrives and frees Marlowe. After a brief struggle, Marlowe kills
    Canino, and he and Vivian escape together by car.
  id: s_21
  key_delta: Marlowe survives the ambush, eliminating a major threat and securing
    Vivian’s assistance.
  trigger_event: Vivian rescues Marlowe during the attack and they kill Canino while
    fleeing Realito.
- description: During the return to Geiger’s bungalow, Vivian claims she killed Sean
    Regan, an unconvincing confession that Marlowe questions silently.
  id: s_22
  key_delta: Vivian’s statement adds an uncertain confession to the mystery surrounding
    Regan’s disappearance.
  trigger_event: Vivian admits to killing Regan while they drive back to Geiger’s
    property.
- description: At Geiger’s house, Marlowe calls Eddie Mars, arranging a meeting. Mars
    arrives with armed men prepared to ambush. The house is tense and heavily guarded.
  id: s_23
  key_delta: Confrontation is set with Mars and his gang, linking all players directly.
  trigger_event: Mars comes to Geiger’s house with armed men for a confrontation arranged
    by Marlowe.
- description: Inside the house, Marlowe holds Mars at gunpoint and reveals that Mars
    blackmailed Vivian with the lie that Carmen killed Regan. Mars panics when Marlowe
    fires shots, causing him to flee outside, where he is mistakenly shot dead by
    his own men.
  id: s_24
  key_delta: Mars is accidentally killed by his own men, removing the antagonist and
    exposing the blackmail scheme's truth.
  trigger_event: Marlowe reveals the blackmail truth, fires gunshots indoors, provoking
    Mars' fatal retreat outside.
- description: Marlowe calls the police, telling them that Mars killed Regan, clearing
    Vivian of suspicion, and stating Carmen needs medical attention.
  id: s_25
  key_delta: 'The official narrative is shaped: Mars is blamed for Regan’s death,
    Vivian is exonerated, and Carmen’s condition is acknowledged, concluding Marlowe’s
    investigation.'
  trigger_event: Marlowe informs police of Mars’ death and fabrications, absolving
    Vivian and seeking help for Carmen.
