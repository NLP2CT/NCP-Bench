- description: Marlowe must call police after Mars's death and shape the official
    narrative clearing Vivian and addressing Carmen’s needs (s_25) to close the investigation
    properly.
  id: c_13
  satisfaction_condition: s_25 node reached with Marlowe's official police report
    including Mars’ blame for Regan’s death and Vivian’s exoneration.
  type: achievement
  violation_condition: Narrative attempts to conclude before ensuring Marlowe informs
    police with correct attribution and protective orders.
