commitments:
- description: Prevent player from recognizing Kathy's true identity or her relationship
    with Don before s_0 event introducing Kathy and Lina's romantic misbelief are
    established.
  id: c_0
  satisfaction_condition: Player acknowledgement of Kathy as chorus girl or skeptic
    of Lina-Don romance only after or at s_0 completion.
  type: ordering
  violation_condition: Player prematurely reveals Kathy's true identity or the falsity
    of Lina and Don's romance before s_0 triggers.
- description: Between s_0 and s_2, Lina must remain confident in her romantic relationship
    with Don despite external contradictions or provocations.
  id: c_1
  satisfaction_condition: Throughout s_0 to s_2, Lina's player-controlled behavior
    sustains belief in mutual love with Don and resists conceding otherwise.
  type: invariant
  violation_condition: Player causes Lina to openly admit or accept that Don does
    not love her before or during s_2.
- description: Don and Kathy's romantic connection cannot begin before s_2 when Don
    reunites with Kathy under Monumental Pictures production context.
  id: c_2
  satisfaction_condition: Any player-led development or narrative progress of Don-Kathy
    relationship only unfolds at or after s_2.
  type: ordering
  violation_condition: Player coerces or reveals Don-Kathy romantic alliance prior
    to s_2.
- description: From s_3 to s_5, the production shift to talking pictures and the resultant
    technical challenges with Lina’s voice must remain active, reflecting Lina's vocal
    unsuitability for talkies.
  id: c_3
  satisfaction_condition: Player inputs or story progression acknowledge keeping Lina’s
    voice as problematic and no successful talkie production with her intact before
    s_5.
  type: invariant
  violation_condition: Player prematurely bypasses or solves Lina’s vocal problem
    before s_5, e.g., allowing Lina flawless talkie performance or ignoring technical
    difficulties.
- description: The dubbing scheme using Kathy’s voice must be implemented before s_6,
    establishing the secret cooperation and sidelining Lina’s vocal role.
  id: c_4
  satisfaction_condition: Player action or narrative confirms acceptance and enactment
    of voice dubbing plan at or before s_6.
  type: achievement
  violation_condition: Player fails to authorize or triggers reveal of dubbing plan
    before it is secretly put into place, or enables Lina to continue solo voice acting.
- description: Post s_6 and until s_8, Lina must actively resist publicity or credit
    for Kathy as her voice double, using legal or other means to block Kathy’s recognition.
  id: c_5
  satisfaction_condition: Player-controlled Lina enforces restrictions on Kathy’s
    promotion and silences Kathy’s credit as voice double during s_6 to s_8.
  type: invariant
  violation_condition: Player permits or endorses Kathy’s public credit or promotion
    despite Lina’s legal threats before s_8 exposure.
- description: The staged live lip-sync performance must occur at s_7 only after the
    film conversion and dubbing is in place; live singing demand and staged performance
    cannot be presented before s_7.
  id: c_6
  satisfaction_condition: Narrative progression waits until s_7 to present public
    demand for Lina's live singing and subsequent lip-sync reveal preparation.
  type: ordering
  violation_condition: Player triggers or acknowledges live singing demand and lip-sync
    performance before s_7 dubbing scheme is established.
- description: The public exposure of the dubbing deception and Lina’s humiliation
    must occur at s_8, shifting public opinion and ending Lina’s star dominance.
  id: c_7
  satisfaction_condition: Player or narrative confirms Cosmo reveals the dubbing scheme
    and Lina flees in embarrassment at or during s_8.
  type: achievement
  violation_condition: Player avoids or negates the exposure event, allowing Lina
    to maintain the illusion beyond s_8.
- description: The final affirmation of Don and Kathy as the recognized romantic and
    professional pair must occur at s_9, culminating narrative closure.
  id: c_8
  satisfaction_condition: Don and Kathy are publicly acknowledged as couple and stars,
    confirmed by player or narrative at s_9 final event.
  type: achievement
  violation_condition: Player disrupts or reverses public recognition of Don and Kathy
    as new leads after s_9.
- description: Throughout narrative progression, Lina’s vocal inadequacy for talkies
    must remain consistent and never be overcome naturally or honestly by Lina herself.
  id: c_9
  satisfaction_condition: At any point from s_4 onwards, Lina’s voice continues to
    be unsuitable for talkies with no direct correction or accepted improvement.
  type: invariant
  violation_condition: Player causes Lina to successfully perform talkie acting and
    singing by herself, invalidating the dubbing necessity.
