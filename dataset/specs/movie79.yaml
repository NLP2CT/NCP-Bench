commitments:
- description: Max Cady must be released from prison before approaching Bowden and
    initiating the conflict sequence.
  id: c_0
  satisfaction_condition: Node s_0 has been reached, indicating Cady's release and
    intent to confront Bowden.
  type: ordering
  violation_condition: Any player action or system state showing Cady interacting
    with Bowden's family or environment prior to s_0.
- description: Cady’s initial proximity surveillance (s_1) around Bowden’s home must
    occur before any direct attacks or threats against family property or members.
  id: c_1
  satisfaction_condition: Node s_1 is completed before nodes s_2, s_3, or s_4.
  type: ordering
  violation_condition: Player or system acknowledges attacks, home intrusions, or
    direct contact with family members before s_1.
- description: No direct evidence allows police to legally detain Cady before the
    poisoning of the dog and subsequent attacks, maintaining legal impunity at early
    stages.
  id: c_2
  satisfaction_condition: Between nodes s_0 and s_6, Cady remains unarrested due to
    lack of legal evidence despite suspicious behavior.
  type: invariant
  violation_condition: Player or system triggers lawful arrest or prosecution of Cady
    prior to s_6 based on evidence or witnessed crimes.
- description: Cady’s assaults on individuals close to Bowden (Lori Davis and Danielle)
    must precede full escalation and family flight.
  id: c_3
  satisfaction_condition: Nodes s_3 and s_4 happen before nodes s_7 and onward.
  type: invariant
  violation_condition: Player or system portrays family fleeing or lethal home invasion
    before these assaults.
- description: Bowden must confront Cady with a direct warning before Cady uses the
    recording legally against Bowden.
  id: c_4
  satisfaction_condition: Node s_5 (restaurant confrontation and recording) occurs
    prior to legal actions like restraining orders or Bar complaints in s_6.
  type: achievement
  violation_condition: Player or system shows legal repercussions against Bowden before
    the confrontation and recording happen.
- description: Physical retaliation by Bowden’s hired men against Cady occurs strictly
    after the warning confrontation (s_5) and before Cady’s legal counteractions (s_6).
  id: c_5
  satisfaction_condition: s_6 follows s_5 where Cady is assaulted and then uses this
    to file complaints.
  type: ordering
  violation_condition: Player acts or system states that the assault happened before
    warning confrontation or legal counteractions are initiated.
- description: Cady must not cause lethal violence inside Bowden’s home or kill Kersek
    before s_7 to preserve narrative escalation integrity.
  id: c_6
  satisfaction_condition: From s_0 up to s_6, no lethal attack inside Bowden’s home
    is acknowledged.
  type: invariant
  violation_condition: Player or system recognizes Kersek’s death or lethal home invasion
    prior to s_7.
- description: The family flight to the houseboat refuge (s_8) must occur following
    the home invasion and deaths on the property.
  id: c_7
  satisfaction_condition: Node s_8 is triggered after s_7 with no skipped steps.
  type: achievement
  violation_condition: Family flees or retreats to the houseboat before lethal home
    invasion and discovery of bodies.
- description: The violent assault on the family aboard the houseboat (s_9) with the
    ensuing burning incident must follow the flight to the houseboat (s_8).
  id: c_8
  satisfaction_condition: s_9 occurs only after s_8 has been reached.
  type: ordering
  violation_condition: Any player or system state showing assault or fire incident
    on family before the boat refuge is established.
- description: Bowden’s admission of hiding the report must happen during the climactic
    mock trial confrontation (s_10) aboard the houseboat.
  id: c_9
  satisfaction_condition: At s_10, Bowden admits to having buried the report before
    final physical confrontation.
  type: achievement
  violation_condition: Admission occurs before s_10 or is omitted from the final confrontation,
    preventing core psychological conflict.
- description: Cady must remain physically unrestrained until the storm enables Bowden
    to shackling him to the boat (s_11).
  id: c_10
  satisfaction_condition: Prior to s_11, Cady is not physically restrained by Bowden
    or others.
  type: invariant
  violation_condition: Player or system restrains Cady before s_11, disrupting narrative
    tension and struggle balance.
- description: Cady’s removal by river tide tied to debris (s_12) marks the narrative’s
    resolution with the family safe and threat ended.
  id: c_11
  satisfaction_condition: Node s_12 concludes the story arc with Cady swept away and
    Bowden reunited with family.
  type: achievement
  violation_condition: The narrative concludes or Bowden rejoins family without Cady’s
    removal by the river or equivalent resolution.
- description: Bowden’s symbolic cleansing of his blood from hands after Cady’s removal
    acts as final character catharsis and must occur at the narrative end.
  id: c_12
  satisfaction_condition: At s_12, Bowden engages in washing his hands before reuniting
    with Leigh and Dani.
  type: invariant
  violation_condition: Ending occurs without the washing scene, omitting final symbolic
    closure.
