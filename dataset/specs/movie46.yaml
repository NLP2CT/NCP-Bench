commitments:
- description: Edward's nature as a storyteller and Will's initial distrust must remain
    consistent from s_0 to s_13, disallowing any premature acceptance of Edward's
    stories as literal truth.
  id: c_0
  satisfaction_condition: From s_0 up to but not including s_13, the system maintains
    that Edward exaggerates and Will does not fully trust him; narrative elements
    reflect skepticism.
  type: invariant
  violation_condition: If before s_13 the player or system acknowledges Edward's tales
    as completely factual or allows Will to fully trust and accept Edward's stories
    as truth.
- description: The estrangement of Will and Edward must precede their reconciliation
    efforts prompted by Edward's health decline, preserving emotional narrative progression
    from s_2 to s_3.
  id: c_1
  satisfaction_condition: Node s_2 (three years no contact) must be completed before
    triggering s_3 (Edward's health fails and Will returns).
  type: ordering
  violation_condition: If the narrative allows Edward's health decline or Will's return
    to occur before or without the established estrangement at s_2.
- description: Will cannot fully understand or reassess his father's stories before
    confronting Edward directly about the truth at s_13, preventing premature resolution
    of the core conflict.
  id: c_2
  satisfaction_condition: The confrontation at s_13 must occur before Will reaches
    conclusions about the truthfulness or meaning of Edward's stories.
  type: ordering
  violation_condition: If Will comes to a final, positive trust or acceptance of Edward's
    stories without undergoing the confrontation at s_13.
- description: Edward's stories include exaggerations but are grounded in kernels
    of truth; this premise must hold from s_13 through s_18, shaping Will's eventual
    realization.
  id: c_3
  satisfaction_condition: Between s_13 and s_18, information and NPC interactions
    acknowledge that Edward's tales are partially true with embellishments rather
    than pure fiction.
  type: invariant
  violation_condition: If Edward's stories are revealed to be entirely fabricated
    or entirely literal, eliminating the nuanced truth/exaggeration balance before
    s_18.
- description: Will's visit to Spectre and meeting with Jenny (s_14, s_15) must occur
    before the final hospitalization and storytelling role reversal at s_16, preserving
    narrative causality and knowledge acquisition.
  id: c_4
  satisfaction_condition: Nodes s_14 and s_15 occur strictly before node s_16.
  type: ordering
  violation_condition: If the story proceeds to Edward's hospital scene and role reversal
    (s_16) before Will has visited Spectre and spoken to Jenny.
- description: Will must tell Edward the final story before Edward dies, ensuring
    closure and completion of their narrative arc by s_17.
  id: c_5
  satisfaction_condition: By or during s_17, Will narrates the story of 'how it all
    ends' to Edward before Edward's death and symbolic transformation.
  type: achievement
  violation_condition: If Edward dies without Will having told this final story or
    the narrative skips this storytelling exchange.
- description: Edward's death and transformation into the big fish is a fixed narrative
    event and symbolism that must not be altered or negated after s_17.
  id: c_6
  satisfaction_condition: At s_17 and beyond, Edward's death and transformation into
    the fish always occur as described.
  type: invariant
  violation_condition: If Edward survives without transformation or if the symbolic
    farewell and transformation into the fish are omitted or reversed.
- description: Will's acceptance of Edward's legacy and continuation of storytelling
    occurs only after attending the funeral and realizing the truth behind the stories
    at s_18.
  id: c_7
  satisfaction_condition: Node s_18 (funeral and realization) must occur before s_19
    (Will passes on the stories to his own son).
  type: ordering
  violation_condition: If Will passes on Edward's stories to his son before attending
    the funeral and reassessing the stories' truthfulness.
- description: 'Romantic relationships and fidelity: Edward only truly loves Sandra
    and does not have an affair with Jenny throughout s_6 to s_15, excluding infidelity
    implications.'
  id: c_8
  satisfaction_condition: Between s_6 and s_15, narrative consistently supports that
    Edward's romantic loyalty lies solely with Sandra as confirmed by Jenny at s_15.
  type: invariant
  violation_condition: If the narrative allows confirmed infidelity, or Edward reciprocates
    romantic feelings with Jenny beyond friendship during this period.
