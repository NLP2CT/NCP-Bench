meta:
  genres: ["Comedy", "Adventure"]
  id: movie28
  player_role: Stu Price
  title: "The Hangover"
synopsis: Celebrating his impending marriage to Tracy Garner, Doug Billings and his
  friends Phil Wenneck, Stu Price, and Tracy's brother Alan travel to Las Vegas for
  a bachelor party, staying at Caesars Palace. The next morning, Phil, Stu and Alan
  awaken to find they have no memory of the previous night and Doug is nowhere to
  be found. Stu is missing a tooth, their hotel suite is in disarray, a tiger is in
  their bathroom, and a baby is in the closet. They find Doug's mattress impaled on
  a statue outside of their hotel and when they ask for their Mercedes, the valet
  delivers a police cruiser. Following clues to their steps, the trio travel to a
  hospital where they discover they were drugged with rohypnol, causing their memory
  loss, and that they came to the hospital from a chapel. At the chapel they learn
  that Stu married a stripper, Jade, despite having a long-term relationship with
  his mean-spirited girlfriend, Melissa. Outside the chapel, the trio are attacked
  by gangsters saying they are looking for someone. They flee and visit Jade, discovering
  that she is the mother of the baby, before being arrested by the police. Having
  been told that the Mercedes has been impounded, the trio is released when they volunteer
  to be targets for a taser demonstration. While driving the Mercedes, they discover
  a naked man in the trunk who attacks them and flees. Alan confesses that he drugged
  their drinks to ensure they had a good night, thinking the drug to be ecstasy. Returning
  to their villa, they find Mike Tyson, who orders the trio to return the tiger to
  his mansion immediately. Stu drugs the tiger with the remaining rohypnol and they
  drive towards Tyson's home in the Mercedes, but the tiger attacks them and damages
  the car's interior. After pushing the car the rest of the way to avoid the tiger,
  Tyson shows the trio footage of them stealing the tiger to help them locate Doug.
  While driving, their car is struck by another vehicle intentionally; the passengers
  are revealed to be the gangsters from the chapel and their boss, Leslie Chow – the
  naked man from their trunk – who accuses the trio of stealing $80,000 of his money
  and kidnapping him. Chow says he has their friend, and threatens to kill him if
  his money is not returned. Unaware of the location of Chow's $80,000, Alan, with
  help from Stu and Jade, uses his knowledge of card counting to win $82,400 playing
  Blackjack. They meet with Chow and exchange the money, only to find that "Doug"
  is the drug dealer who inadvertently sold Alan the roofies. With the wedding occurring
  in hours, Phil tells Tracy they cannot find Doug. Following a conversation with
  "Black Doug", Stu realizes where Doug is. The trio travel back to their hotel where
  they find Doug on the roof, moved there on his mattress while he was asleep, as
  a practical joke by Stu, Phil and Alan. Before leaving, Stu makes arrangements to
  go on a date with Jade the following week. With less than four hours before the
  wedding and with no flights available, the foursome race home, with Doug revealing
  he has possession of Chow's original $80,000. Despite their late arrival, Doug and
  Tracy are married and Stu breaks up with Melissa after having grown tired of her
  controlling his life. As the reception ends, Alan finds Stu's digital camera detailing
  the events they cannot remember and the four agree to look at the pictures together
  before deleting the evidence of their exploits.
trajectory:
- description: Stu Price is in a hotel suite at Caesars Palace, Las Vegas, with friends
    Phil Wenneck, Alan Garner, and the groom-to-be Doug Billings. They have arrived
    for Doug's bachelor party, the suite is orderly, and the group is looking forward
    to festivities without any memory loss or unusual events.
  id: s_0
  key_delta: The characters experience memory loss of the previous night; Doug is
    missing; physical state of the suite is disordered; a tiger occupies the bathroom,
    a baby is found in the closet, and Stu is missing a tooth.
  trigger_event: Stu, Phil, and Alan wake up in the suite the morning after the party.
- description: Stu, Phil, and Alan examine the hotel suite in disarray with the tiger
    in the bathroom and a baby in the closet. They find Doug's mattress impaled on
    a statue outside and request their Mercedes from the valet, who brings a police
    cruiser instead.
  id: s_1
  key_delta: The trio initiates an investigation by seeking tangible evidence and
    exploring the consequences of their blackout night.
  trigger_event: The trio decides to follow clues to trace their lost memories and
    track Doug's whereabouts.
- description: Stu, Phil, and Alan arrive at a hospital and learn from staff that
    they were drugged with rohypnol, which caused their memory loss, and that they
    were brought to the hospital from a wedding chapel.
  id: s_2
  key_delta: It is revealed Stu married a stripper, Jade, at the chapel despite being
    in a relationship with Melissa, expanding the factual complexity of the night’s
    events.
  trigger_event: The trio travels to the chapel to learn more about what happened
    there during the missing night.
- description: Outside the chapel, Stu, Phil, and Alan are confronted and attacked
    by gangsters searching for someone. The trio escapes and visits Jade, learning
    she is the mother of the baby found earlier.
  id: s_3
  key_delta: The trio is detained by authorities; their actions have drawn law enforcement
    attention, indicating escalating external conflict.
  trigger_event: The trio is arrested by police shortly after visiting Jade.
- description: After volunteering as taser demonstration subjects, Stu, Phil, and
    Alan are released. While driving, they discover a naked man in the Mercedes trunk
    who attacks them and flees.
  id: s_4
  key_delta: The source of the drugging causing their blackout is revealed as Alan’s
    mistake with rohypnol.
  trigger_event: Alan confesses to drugging their drinks mistakenly with rohypnol
    instead of ecstasy.
- description: Back at the villa, Stu, Phil, and Alan find Mike Tyson, who directs
    them to return the tiger to his mansion immediately.
  id: s_5
  key_delta: The tiger is incapacitated with rohypnol; the trio begins returning it,
    advancing responsibility for prior chaos.
  trigger_event: The trio drugs the tiger with the remaining rohypnol and drive toward
    Tyson’s home in the Mercedes.
- description: During their journey, the tiger awakens, attacks, and damages the car
    interior. The trio pushes the car the rest of the way to Tyson’s mansion where
    he shows them footage of them stealing the tiger.
  id: s_6
  key_delta: Physical confrontation with gangsters escalates; Leslie Chow is identified
    as the naked man and antagonist; stakes rise with threats against Doug.
  trigger_event: While driving, the gangsters and their boss Leslie Chow intentionally
    hit their car and confront them over stolen money and kidnapping accusations.
- description: Alan, with help from Stu and Jade, uses card counting to win $82,400
    playing Blackjack to cover Chow’s $80,000 lost money. The trio exchanges the money
    with Chow.
  id: s_7
  key_delta: Real identity of 'Doug' as a drug dealer is revealed, separating him
    from their missing friend; financial debt toward Chow is cleared.
  trigger_event: After money exchange, Trio discovers that 'Doug' is actually a drug
    dealer who sold Alan the rohypnol unintentionally.
- description: With the wedding hours away, Phil informs Tracy that Doug is missing.
    Attempts to find Doug stall until Stu recalls Doug's location after speaking with
    'Black Doug'.
  id: s_8
  key_delta: Doug’s true location is uncovered; the confusion about his disappearance
    is resolved.
  trigger_event: The trio returns to the hotel and finds Doug asleep on a mattress
    on the roof, placed there as a prank by Stu, Phil, and Alan.
- description: With less than four hours before the wedding and no flights available,
    Stu, Phil, Alan, and Doug race home. Stu arranges a date with Jade for after the
    wedding.
  id: s_9
  key_delta: Doug's timely return enables the wedding to proceed; Stu’s future relationship
    with Jade is established.
  trigger_event: Despite their late arrival, Doug and Tracy get married on time.
- description: The wedding reception concludes. Stu breaks up with controlling girlfriend
    Melissa. Alan finds Stu’s digital camera documenting their missing night events.
  id: s_10
  key_delta: The friends recover photographic proof of the blackout and agree to
    erase it together before moving on.
  trigger_event: The four friends agree to review the camera's pictures together and
    then delete them to erase evidence of their chaotic exploits.
