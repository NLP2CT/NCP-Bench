commitments:
- description: The trio must experience memory loss and discover the suite in disarray
    before investigating the missing Doug and the strange circumstances of the previous
    night.
  id: c_0
  satisfaction_condition: Node s_0 occurs before node s_1.
  type: ordering
  violation_condition: Player gains knowledge of Doug's disappearance or suite disorder
    before the trio wakes up with memory loss in s_0.
- description: The trio must learn they were drugged and brought to a chapel before
    knowing about Stu's unintended marriage and Jade's parenthood of the baby.
  id: c_1
  satisfaction_condition: Node s_2 occurs before node s_3.
  type: ordering
  violation_condition: Player uncovers the marriage or Jade as mother before the hospital
    revelation of drugging and chapel arrival.
- description: The trio remains unaware of the source of drugging until Alan confesses
    his mistake with rohypnol.
  id: c_2
  satisfaction_condition: The system never confirms Alan’s drugging confession (s_4)
    before it occurs.
  type: invariant
  violation_condition: System or player reveals Alan’s mistake before s_4 event triggers.
- description: The trio must meet Mike Tyson and receive instructions about the tiger
    before attempting to return it to Tyson’s mansion.
  id: c_3
  satisfaction_condition: Node s_5 occurs before the tiger return attempt in s_6.
  type: ordering
  violation_condition: Player returns tiger or interacts with tiger's aftermath before
    meeting Tyson.
- description: The confrontation with gangsters and Leslie Chow (including car collision)
    must happen before the resolution involving Blackjack winnings and money exchange.
  id: c_4
  satisfaction_condition: Node s_6 occurs before node s_7.
  type: ordering
  violation_condition: Money exchange or clearing of Chow's debt happens before the
    gangster confrontation in s_6.
- description: Stu and the trio must fail to find Doug and be informed of his true
    location by 'Black Doug' before finding Doug on the hotel roof.
  id: c_5
  satisfaction_condition: Node s_8 occurs after the conversation with 'Black Doug'
    and repositioning events.
  type: ordering
  violation_condition: Player locates Doug on the roof before the 'Black Doug' conversation
    or prior investigative steps.
- description: Doug and Tracy’s wedding must occur on time despite the chaotic events
    and near-misses before the narrative ends.
  id: c_6
  satisfaction_condition: Node s_9 triggers with successful wedding occurring regardless
    of delays.
  type: achievement
  violation_condition: Wedding fails to proceed due to absence of Doug or other unresolved
    logistical obstacles.
- description: The photographic evidence of the blackout night remains undisclosed
    and unshared publicly until the end of the narrative where it is reviewed and
    then deleted.
  id: c_7
  satisfaction_condition: Camera pictures are only reviewed at node s_10 and are deleted
    thereafter; no premature sharing or exposure occurs prior.
  type: invariant
  violation_condition: Pictures or memory evidence are revealed or used before node
    s_10 review and deletion.
- description: Stu’s relationship status with Melissa remains unchanged until after
    the wedding reception where he chooses to break up with her.
  id: c_8
  satisfaction_condition: Stu remains in relationship with Melissa up to and including
    node s_9; breakup only acknowledged at node s_10.
  type: invariant
  violation_condition: Player induces breakup or status change prior to node s_10.
