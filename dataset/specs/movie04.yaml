commitments:
- description: Bond cannot attain double-0 status before eliminating the traitorous
    MI6 section chief and the station chief's contact (establishes initial trust and
    authority).
  id: c_0
  satisfaction_condition: Node s_0 (traitor eliminated) occurs before node s_1 (double-0
    status assigned).
  type: ordering
  violation_condition: System acknowledges Bond as double-0 (s_1) before the assassination
    of traitors (s_0).
- description: Bond must kill Mollaka and escape the embassy chase before uncovering
    connection to Alex Dimitrios through Mollaka's phone (ensures proper investigative
    progression).
  id: c_1
  satisfaction_condition: Node s_2 (Mollaka killed) occurs before node s_3 (message
    on phone leads to Dimitrios).
  type: ordering
  violation_condition: Bond obtains information on Dimitrios (s_3) without first neutralizing
    Mollaka (s_2).
- description: Bond must establish contact with Dimitrios’s inner circle before pursuing
    Dimitrios to Miami (logical intelligence gathering sequence).
  id: c_2
  satisfaction_condition: Node s_4 (seduction of Solange) occurs before node s_5 (pursuit
    to Miami).
  type: ordering
  violation_condition: Bond pursues Dimitrios (s_5) without first making contact via
    Solange (s_4).
- description: Dimitrios must be killed before Bond can foil the plot at Miami International
    Airport (removes intermediary threat before confronting higher threat).
  id: c_3
  satisfaction_condition: Node s_6 (Dimitrios killed) occurs before node s_7 (bomb
    plot foiled).
  type: ordering
  violation_condition: Bond foils the bombing attempt (s_7) before eliminating Dimitrios
    (s_6).
- description: Bond must meet allies Rene Mathis and Vesper Lynd before entering the
    Casino Royale poker tournament (ensures necessary support is in place).
  id: c_4
  satisfaction_condition: Node s_8 (meeting allies) occurs before node s_9 (start
    of poker tournament).
  type: ordering
  violation_condition: Bond participates in poker tournament (s_9) without prior contact
    with Mathis and Vesper (s_8).
- description: Bond’s loss of initial buy-in must precede his decision to assassinate
    Le Chiffre or to accept Felix Leiter’s stake (progresses player motivation and
    external assistance logically).
  id: c_5
  satisfaction_condition: Node s_9 (loss) occurs before the resolution in nodes s_10
    (assassination resolve) or s_11 (Leiter’s stake).
  type: ordering
  violation_condition: Bond receives funding or resolves to act without first experiencing
    the loss at the tournament (before s_9).
- description: Bond must survive Le Chiffre’s poisoning attempt with Vesper’s help
    before winning the tournament (survival prerequisite for victory).
  id: c_6
  satisfaction_condition: Node s_12 (poisoning attempt survived) occurs before node
    s_13 (tournament win).
  type: ordering
  violation_condition: Bond wins the tournament (s_13) without experiencing and surviving
    the poisoning attempt (s_12).
- description: Vesper’s abduction as bait must occur after Bond wins the tournament
    and before his torture (timing of escalating threats).
  id: c_7
  satisfaction_condition: Node s_13 (tournament win) precedes s_14 (Vesper kidnapped),
    which precedes s_15 (Bond tortured).
  type: ordering
  violation_condition: Bond is tortured (s_15) without Vesper’s abduction (s_14) or
    before winning the tournament (s_13).
- description: Le Chiffre and his associates must be eliminated by Mr. White before
    Bond recovers and initiates Mathis’s arrest (keeps cause-effect in internal betrayal
    sequence).
  id: c_8
  satisfaction_condition: Node s_15 (Mr. White kills Le Chiffre) occurs before node
    s_16 (Mathis’s arrest ordered).
  type: ordering
  violation_condition: Mathis is arrested (s_16) before Le Chiffre’s death (s_15).
- description: Bond learns of Vesper’s theft only after their relocation to Venice
    and initial convalescence (delays betrayal revelation properly).
  id: c_9
  satisfaction_condition: Node s_17 (discovery of stolen winnings) occurs after nodes
    s_16 and s_17’s preceding events (hospital recovery, relationship formation).
  type: ordering
  violation_condition: Bond detects betrayal (s_17) before his recovery and relationship
    establishment (prior to s_16).
- description: The gunfight and sinking building scenario must occur after Bond pursues
    Vesper and her organization into the building (escalation of conflict).
  id: c_10
  satisfaction_condition: Node s_18 (gunfight in sinking building) happens after node
    s_17 (pursuit).
  type: ordering
  violation_condition: Gunfight/scenario (s_18) occurring before the pursuit (s_17).
- description: Vesper’s death must follow the sinking building gunfight and partial
    flooding (final betrayal and consequence).
  id: c_11
  satisfaction_condition: Node s_18 (gunfight and sinking starts) occurs before node
    s_19 (Vesper drowns).
  type: ordering
  violation_condition: Vesper dies (s_19) without the preceding fight and sinking
    building (s_18).
- description: Bond must be reinstated and briefed about Vesper’s coercion before
    confronting Mr. White (sets motivations for final confrontation).
  id: c_12
  satisfaction_condition: Node s_20 (intelligence briefing on Vesper) occurs before
    node s_21 (confront Mr. White).
  type: ordering
  violation_condition: Bond confronts Mr. White (s_21) without prior briefing on Vesper’s
    coercion (s_20).
- description: Bond must successfully complete the assassination of Mollaka and Dimitrios
    to disrupt the terrorist network at early stages.
  id: c_13
  satisfaction_condition: Nodes s_2 (Mollaka killed) and s_6 (Dimitrios killed) are
    both completed before narrative end.
  type: achievement
  violation_condition: Narrative attempts to conclude or progress to final stages
    without having killed Mollaka and Dimitrios.
- description: Bond must win the Texas hold 'em tournament to gain leverage over Le
    Chiffre's network.
  id: c_14
  satisfaction_condition: Node s_13 (tournament won) is achieved before proceeding
    to subsequent key plot events.
  type: achievement
  violation_condition: Narrative advances beyond tournament without Bond winning it.
- description: Bond must survive torture and be rescued to continue the pursuit of
    the terrorist organization.
  id: c_15
  satisfaction_condition: Node s_15 (torture interrupted by Mr. White) followed by
    Bond’s survival and recovery (s_16).
  type: achievement
  violation_condition: Narrative continues without Bond surviving torture or without
    Mr. White's intervention.
- description: From the assignment of double-0 status (s_1) until his resignation after the tournament (s_16), Bond holds this status unrevoked.
  id: c_16
  satisfaction_condition: Between nodes s_1 and s_16, Bond’s double-0 status remains active without suspension or removal.
  type: invariant
  violation_condition: Bond loses or has revoked double-0 status during the active mission against Le Chiffre (between s_1 and s_16).
- description: From Bond’s meeting with Vesper (s_8) until the discovery of the theft (s_17), Bond maintains personal trust in Vesper despite evidence of possible betrayal.
  id: c_17
  satisfaction_condition: Between nodes s_8 and s_17, narrative does not allow Bond to conclusively distrust or reveal Vesper’s betrayal until s_17 event.
  type: invariant
  violation_condition: Bond acts on or reveals Vesper’s betrayal conclusively before node s_17 (discovery of the theft).
