meta:
  genres: ["Action", "Thriller"]
  id: movie04
  player_role: James Bond
  title: "Casino Royale"
synopsis: After killing a traitorous MI6 section chief—who has been selling classified
  information—and the station chief's contact, James Bond gets his double-0 status.
  The new agent 007 then goes to Madagascar in pursuit of an international bomb-maker
  named Mollaka. After a parkour chase to an embassy, Bond kills his target and blows
  up a part of the building in order to escape. Searching through Mollaka's mobile
  phone, Bond discovers a text message which he traces to Alex Dimitrios, an associate
  of banker and terrorist financer Le Chiffre. Le Chiffre's investments involve short-selling
  stock in successful companies and then engineering terrorist attacks to sink their
  share prices. Bond travels to Dimitrios's house in the Bahamas and seduces his wife,
  Solange. While answering a phone call, Solange reveals that her husband is flying
  to Miami; Bond leaves to pursue him. In Miami, 007 kills Dimitrios during a fight
  and then follows Le Chiffre's henchman, Carlos, to Miami International Airport.
  There, Bond foils Le Chiffre's plan to destroy the prototype Skyfleet airliner.
  Left with a huge loss and under pressure to recoup his terrorist clients' money,
  Le Chiffre sets up a high-stakes Texas hold 'em tournament at the Casino Royale
  in Montenegro. Hoping that a defeat would force Le Chiffre to aid the British government
  in exchange for protection from his creditors, MI6 enters Bond into the tournament.
  On the train to Montenegro, Bond meets an ally, Rene Mathis, and Vesper Lynd, a
  Treasury agent who is looking after the $10 million buy-in. During the tournament,
  Bond loses his initial stake and Vesper refuses to give him $5 million to continue
  playing. Distraught over his failure, Bond resolves to assassinate Le Chiffre. Before
  he can, a fellow player reveals himself as CIA agent Felix Leiter, who offers to
  stake Bond in exchange for custody of Le Chiffre. Back in the game, Bond begins
  to amass chips. Le Chiffre and his associates attempt to kill Bond by poisoning
  his drink, but he survives with the help of Vesper and wins the tournament, and
  the winnings are deposited into a Swiss bank account. Soon afterward, Le Chiffre
  abducts Vesper and uses her as bait to capture Bond. Le Chiffre tortures Bond for
  the access code to the game's winnings, but is interrupted by Mr. White, who kills
  Le Chiffre and his associates. Bond awakens in a hospital on Lake Como and orders
  Mathis, whom Le Chiffre identified as a double agent, arrested. Bond admits his
  love for Vesper, and posts his resignation to M. The couple then goes to Venice.
  There Bond learns that his poker winnings were never deposited in the Treasury's
  account. Realising that Vesper has stolen them, he pursues her and members of the
  organisation for which she is working into a building under renovation, which is
  being kept from sinking only by inflatable supports. A gunfight ensues and the supports
  are punctured. Bond kills the men and tries to rescue Vesper, but she locks herself
  in an iron-frame lift and allows herself to drown as the building sinks. Mr. White,
  watching from a nearby balcony, walks away with the money. Bond rejoins the service
  and learns that Vesper had a French-Algerian boyfriend who was kidnapped by the
  organisation behind Le Chiffre and Mr. White in order to blackmail her into co-operation,
  and that she agreed to deliver the money in exchange for saving Bond's life. Bond
  then discovers White's name and cell phone number which he uses to find him where
  he demands answers before wounding him and introducing himself——"The name's Bond,...
  James Bond."
trajectory:
- description: James Bond is a newly assigned MI6 agent without double-0 status. The
    environment is tense within the MI6 station where suspicions about a traitor selling
    classified information exist but remain unconfirmed.
  id: s_0
  key_delta: Bond eliminates the traitorous MI6 section chief and contact, exposing
    internal betrayal and earning eligibility for double-0 status.
  trigger_event: Assassination of the traitorous MI6 section chief and the station
    chief's contact by Bond.
- description: Bond, now recognized as agent 007, prepares for his first assignment
    with the new status, focusing on the pursuit of an international bomb-maker named
    Mollaka in Madagascar.
  id: s_1
  key_delta: Bond’s status is officially elevated to double-0, authorizing him to
    engage in high-risk international missions.
  trigger_event: Bond is assigned to track Mollaka in Madagascar.
- description: In Madagascar, Bond chases Mollaka through urban environments, culminating
    at the embassy surrounded by heightened security.
  id: s_2
  key_delta: Bond kills Mollaka and detonates part of the embassy to ensure his escape,
    neutralizing the immediate bomb-maker threat.
  trigger_event: A parkour chase leading Bond and Mollaka to the embassy.
- description: Bond investigates Mollaka’s belongings, situated in a secure location
    where he examines the mobile phone found on Mollaka.
  id: s_3
  key_delta: Bond uncovers connection to Alex Dimitrios, linking Mollaka to a larger
    terrorist-financer network.
  trigger_event: Discovering a text message on Mollaka's phone leading to Alex Dimitrios.
- description: Bond travels to Dimitrios's residence in the Bahamas, a wealthy and
    secured estate, aiming to gather intelligence on Le Chiffre through Dimitrios.
  id: s_4
  key_delta: Bond establishes contact within Dimitrios's close circle, gaining insight
    into Dimitrios's movements.
  trigger_event: Bond's seduction of Solange, Dimitrios’s wife, during an evening
    at the estate.
- description: Bond tracks Dimitrios's movements from the Bahamas towards Miami, following
    newly acquired information from Solange’s phone call.
  id: s_5
  key_delta: Bond initiates pursuit of Dimitrios to Miami based on verified travel
    information.
  trigger_event: Solange unintentionally reveals Dimitrios’s flight to Miami while
    answering a phone call.
- description: In Miami, a confrontation unfolds in urban settings leading to a lethal
    fight between Bond and Dimitrios.
  id: s_6
  key_delta: Elimination of Dimitrios removes a critical intermediary in Le Chiffre’s
    network.
  trigger_event: Bond kills Dimitrios during a physical altercation in Miami.
- description: Bond shadows Le Chiffre's henchman Carlos to Miami International Airport,
    where heightened security measures are in place around the Skyfleet prototype.
  id: s_7
  key_delta: Disruption of Le Chiffre's destructive scheme at Miami Airport preserves
    the prototype and uncovers direct terrorist intentions.
  trigger_event: Bond follows Carlos to the airport and foils the bomb plot targeting
    the Skyfleet airliner prototype.
- description: MI6 coordinates a strategic entry into Le Chiffre’s plan as Bond travels
    to Montenegro aboard a train en route to Casino Royale for a high-stakes poker
    tournament.
  id: s_8
  key_delta: Bond gains new allies and financial backing for the upcoming poker tournament
    against Le Chiffre.
  trigger_event: Bond meets Rene Mathis and Treasury agent Vesper Lynd onboard the
    train.
- description: The tense atmosphere of Casino Royale sets the stage for the Texas
    hold 'em tournament where multiple players, including Le Chiffre, assemble.
  id: s_9
  key_delta: Bond's financial disadvantage escalates the stakes and pressure of the
    competition.
  trigger_event: Bond loses his initial buy-in stake during the poker tournament.
- description: At the casino, Bond faces rejection from Vesper Lynd who refuses additional
    funds, increasing interpersonal tension in the playing area.
  id: s_10
  key_delta: Bond's inability to secure funds leads him to resolve to assassinate
    Le Chiffre, intensifying personal stakes.
  trigger_event: Vesper denies Bond’s request for $5 million to continue playing.
- description: Before Bond acts on his resolve, a player reveals himself as CIA agent
    Felix Leiter inside the conspicuous casino environment.
  id: s_11
  key_delta: Formation of a cross-agency alliance provides Bond renewed resources
    and mission parameters within the tournament.
  trigger_event: Felix Leiter offers to stake Bond in exchange for custody of Le Chiffre.
- description: During the tournament, in a private casino lounge, Le Chiffre attempts
    to poison Bond’s drink amidst tense gameplay.
  id: s_12
  key_delta: Bond survives an assassination attempt and continues competing with renewed
    determination and protection.
  trigger_event: Le Chiffre’s poisoning attempt on Bond, which Bond survives with
    Vesper’s intervention.
- description: The tournament proceeds towards climax inside Casino Royale’s main
    poker room where Bond steadily amasses poker chips.
  id: s_13
  key_delta: Bond secures financial leverage against Le Chiffre, shifting the balance
    of power temporarily.
  trigger_event: Bond wins the tournament, depositing the winnings into a Swiss bank
    account.
- description: After the tournament, Bond and Vesper are separated; the atmosphere
    becomes threatening when Le Chiffre abducts Vesper as bait.
  id: s_14
  key_delta: Vesper’s abduction forces Bond into direct confrontation and immediate
    threat.
  trigger_event: Le Chiffre kidnaps Vesper to lure Bond into a trap.
- description: Bond is held captive in an austere location where he is tortured by
    Le Chiffre, the environment hostile and grim.
  id: s_15
  key_delta: Le Chiffre and associates are eliminated by Mr. White, Bond gains unexpected
    rescue.
  trigger_event: Le Chiffre’s torture session is interrupted by the arrival of Mr.
    White.
- description: Bond awakens in a hospital on Lake Como, recovering under medical supervision
    with MI6 agents nearby.
  id: s_16
  key_delta: Bond initiates internal security measures filtering traitorous elements
    within MI6 contacts.
  trigger_event: Bond orders Rene Mathis's arrest upon suspecting him as a double
    agent based on Le Chiffre’s identification.
- description: Bond and Vesper form a personal relationship during convalescence;
    they relocate to Venice amidst an aura of tentative peace.
  id: s_17
  key_delta: Discovery that Vesper absconded with the winnings introduces a new betrayal
    and conflict.
  trigger_event: Bond learns poker winnings were never deposited into the Treasury
    account.
- description: Bond pursues Vesper and her organization into a partially submerged,
    under-renovation Venetian building supported by inflatable structures.
  id: s_18
  key_delta: Escalation to a deadly confrontation in a collapsing structure; Bond
    kills Vesper's captors.
  trigger_event: A gunfight breaks out as the inflatable supports are punctured, causing
    the building to begin sinking.
- description: Vesper locks herself in an iron-frame lift within the sinking building,
    cutting off Bond’s access as water fills the space.
  id: s_19
  key_delta: Vesper’s death represents ultimate betrayal and loss; Mr. White escapes
    with the stolen money.
  trigger_event: Vesper allows herself to drown by refusing to escape the sinking
    building.
- description: Bond, restored in active service, receives intelligence briefing in
    a secure MI6 location regarding Vesper’s coerced cooperation and background.
  id: s_20
  key_delta: Bond learns the truth behind Vesper’s betrayal, contextualizing her actions
    under coercion.
  trigger_event: MI6 reveals Vesper’s French-Algerian boyfriend was kidnapped to blackmail
    her into collaborating with the terrorist organization.
- description: Bond locates Mr. White’s contact information and tracks him to a discreet
    urban location, setting a confrontational atmosphere.
  id: s_21
  key_delta: Bond directly connects with the mastermind behind the terrorist network,
    asserting his identity and mission resolve.
  trigger_event: Bond confronts Mr. White and shoots him after demanding answers.
