meta:
  genres: ["Action", "Thriller"]
  id: movie05
  player_role: Red Grant
  title: "From Russia with Love"
synopsis: SPECTRE's expert planner Kronsteen devises a plot to steal a Lektor cryptographic
  device from the Soviets and sell it back to them while exacting revenge on Bond
  for killing their agent Dr. No. The Spectre Number 1 puts ex-SMERSH operative and
  Number 3 Rosa Klebb in charge of the mission. Klebb recruits Grant as an assassin,
  and Tatiana Romanova, a cipher clerk at the Soviet consulate in Istanbul, as an
  unwitting pawn, as Romanova thinks Klebb is still working for SMERSH. In London,
  M tells Bond – agent 007 and sometimes simply '007' – that Romanova has contacted
  their "Station 'T'" in Turkey, offering to defect with a Lektor, which MI6 and the
  CIA have been after for years – but Romanova said she will only defect to Bond,
  whose photo she has allegedly found in a Soviet intelligence file. Bond then flies
  to Istanbul, where he meets station head Ali Kerim Bey. 007 is followed from the
  airport by an unkempt man in glasses and by Red Grant. The next day, after Kerim
  Bey's office is bombed, Bond and Kerim Bey spy on the Soviet consulate, where Kerim
  Bey sees rival agent Krilencu. At night, Kerim Bey and Bond go to a rural gypsy
  settlement, which suffers an attack by Krilencu's men, who wound Kerim Bey and nearly
  kill Bond, who is saved by a hidden Red Grant. On the following night, Kerim Bey
  kills Krilencu with Bond's sniper rifle. When Bond returns to his hotel suite, he
  finds Romanova in bed waiting for him, unaware that they are being filmed by SPECTRE.
  The next day, Romanova heads off for a pre-arranged rendezvous at Hagia Sophia.
  The bespectacled man who followed Bond to the airport tries to intercept Romanova's
  floor plan of the Soviet consulate, but is killed by Grant. Upon finding the body,
  Bond takes the floor plan, and brings it to Kerim Bey to devise their invasion.
  After stealing the Lektor, Bond, Romanova, and Kerim Bey escape with the device
  on the Orient Express. On the train, Kerim Bey and a Soviet security officer named
  Benz are killed by Grant, who makes it appear as if they killed each other. At Zagreb,
  Grant boards the train and meets Bond pretending to be agent Nash from "Station
  'Y'". He drugs Romanova at dinner, then overcomes Bond. Grant taunts him, boasting
  SPECTRE has been pitting the Soviets and the British against each other, and claims
  that Romanova thinks that "she's doing it all for mother Russia" when she is really
  working for SPECTRE. Grant also mentions the film of Bond and Romanova at the hotel
  suite, saying that after both are killed, Grant will plant it in her handbag along
  with a forged blackmail letter so it looks like it was a murder-suicide. Bond tricks
  Grant into opening Bond's attaché case in the manner that detonates its tear gas
  booby trap in his face, allowing Bond to attack him. In the ensuing struggle, Bond
  eventually manages to stab Grant with the knife hidden in the attaché case, and
  strangles Grant to death with his own garrotte. At dawn, Bond and Romanova leave
  the train, hijack Grant's getaway truck, destroy an enemy helicopter, and drive
  to a dock, eventually boarding a powerboat. Number 1 is very unhappy, and summons
  Kronsteen and Klebb. He reminds them that SPECTRE does not tolerate failure, and
  brings in agent Morzeny to then execute Kronsteen with a poisoned spike in the toe
  of his shoe. Number 1 tells a frightened Klebb that she now has total control of
  the mission and has one last chance. Klebb sends Morzeny after Bond with a squadron
  of SPECTRE's boats. Morzeny nearly catches Bond, but the agent sets his pursuers'
  boats on fire with a signal flare. Bond and Romanova reach Venice and check into
  a hotel. Rosa Klebb, disguised as a maid, attempts to steal the Lektor. She gets
  the drop on Bond, and attempts to kill Bond with both a gun and her poisoned toe-spike,
  but ends up being shot by Romanova. Riding in a gondola, Bond throws the film of
  him and Romanova into the water as they are rowed away.
trajectory:
- description: Red Grant works as an assassin under SPECTRE's command, with a plot
    devised by Kronsteen and supervision by Rosa Klebb to steal the Lektor device
    from the Soviets. The environment is tense with espionage activities ongoing,
    and Grant is stationed and ready to act, unaware of the full scope of the mission's
    unfolding.
  id: s_0
  key_delta: Grant becomes directly involved in the Lektor theft mission under Klebb's
    control, shifting from general operative status to active assassin on a covert
    operation.
  trigger_event: Grant is deployed into the field as SPECTRE begins the Istanbul
    phase of the operation.
- description: Grant prepares for the mission while surveillance and counterintelligence
    activities begin around Bond and Romanova in Istanbul, with the Soviet consulate
    under watch. The atmosphere is charged with mutual suspicion between agents and
    hostile forces.
  id: s_1
  key_delta: Grant initiates covert monitoring of Bond, confirming the target and
    beginning direct engagement in the operational theater.
  trigger_event: Grant follows Bond from the Istanbul airport, establishing physical
    surveillance of the target.
- description: Grant moves to intercept critical intelligence, including the floor
    plan of the Soviet consulate, as Bond takes possession of it after Grant kills
    the bespectacled man who also pursued Romanova's floor plan.
  id: s_2
  key_delta: Grant removes a rival pursuer and secures control over a key component
    of the mission, eliminating obstacles to SPECTRE's plan.
  trigger_event: With Bond and Romanova moving onto the Orient Express, Grant boards
    the train to shadow them and prepare the kill.
- description: Grant boards the Orient Express to continue the mission after Bond
    and Romanova steal the Lektor. The journey is clandestine; Grant prepares for
    the lethal phase of the plan.
  id: s_3
  key_delta: Grant gains covert access to Bond's group and incapacitates Romanova,
    taking a tactical advantage for the forthcoming attack.
  trigger_event: Grant boards the train at Zagreb, posing as agent Nash from Station
    'Y' and drugs Romanova at dinner.
- description: Grant assaults Bond, overpowering him after the drugging. They engage
    in combat in the confined quarters of the Orient Express, escalating into a deadly
    struggle.
  id: s_4
  key_delta: Grant reveals critical antagonistic intentions and the danger posed by
    SPECTRE’s intrigues while physically dominating Bond temporarily.
  trigger_event: Grant overcomes Bond and taunts him with information about SPECTRE's
    manipulation.
- description: Grant opens Bond's attaché case, triggering a tear gas booby trap that
    incapacitates him and allows Bond to counterattack, initiating a violent personal
    confrontation.
  id: s_5
  key_delta: Grant suffers a debilitating setback during the fight, enabling Bond
    to reverse the combat dynamics.
  trigger_event: Grant opens the attache case, releasing tear gas and losing his advantage.
- description: In a fierce struggle aboard the train, Bond ultimately kills Grant
    by stabbing him with a hidden knife and strangling him with his own garrotte.
    The immediate threat of Grant is eliminated in a confined, high tension environment.
  id: s_6
  key_delta: Grant, the active assassin and direct threat, is irreversibly neutralized,
    removing a key SPECTRE operative from the mission.
  trigger_event: Bond stabs and strangles Grant during their fight aboard the Orient
    Express.
