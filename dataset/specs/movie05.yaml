commitments:
- description: Grant must be recruited by Rosa Klebb before he begins active surveillance
    and engagement with Bond in Istanbul, ensuring logical mission commencement.
  id: c_0
  satisfaction_condition: Node s_0 is achieved before any player action acknowledges
    or initiates Grant's active engagement (s_1 or later).
  type: ordering
  violation_condition: Player actions or system acknowledges Grant surveilling or
    following Bond before Klebb's recruitment (i.e., s_1 or later occurs without s_0
    completion).
- description: Grant's surveillance and follow-up on Bond (s_1) must occur before
    Grant intercepts rivals and kills the bespectacled man for the floor plan (s_2),
    maintaining sequential situational escalation.
  id: c_1
  satisfaction_condition: Node s_1 is completed before s_2 begins.
  type: ordering
  violation_condition: Grant is shown to kill the bespectacled man or intercept the
    floor plan without prior established surveillance on Bond (s_2 before s_1).
- description: Grant's interception and role in controlling the floor plan intelligence
    (s_2) must precede his boarding of the Orient Express and infiltration as agent
    Nash (s_3), ensuring mission phases occur in sequence.
  id: c_2
  satisfaction_condition: Node s_2 is fulfilled before s_3 becomes active or acknowledged.
  type: ordering
  violation_condition: Grant is on the train posing as Nash or attempts assaulting
    Bond without having first removed the rival and gained intelligence control (s_3
    before s_2).
- description: Grant successfully drugs Romanova on the train (s_3) before overpowering
    Bond and taunting him (s_4), defining a logical progression of incapacitation
    leading to assault.
  id: c_3
  satisfaction_condition: s_3 precedes s_4 in narrative progression and player/system
    acknowledgment.
  type: ordering
  violation_condition: Player or system triggers Bond’s assault by Grant before Romanova
    is drugged or incapacitated (s_4 before s_3).
- description: The tear gas booby trap inside Bond’s attaché case (s_5) must trigger
    after Grant’s initial assault and taunting phase (s_4), marking a tactical turning
    point in the conflict.
  id: c_4
  satisfaction_condition: s_4 completed before s_5 occurs, with open combat established
    prior to trap activation.
  type: ordering
  violation_condition: Tear gas trap is triggered prior to Grant’s assault or dominance
    over Bond (s_5 before s_4).
- description: Bond must kill Grant (s_6) only after Grant has been debilitated by
    the tear gas trap (s_5), ensuring the combat outcome is logically justified and
    sequenced.
  id: c_5
  satisfaction_condition: s_5 occurs before s_6 triggers the death of Grant.
  type: ordering
  violation_condition: Grant is killed by Bond without prior incapacitation by the
    tear gas trap (s_6 before s_5).
- description: After s_6, Red Grant is permanently removed as an active threat; no
    subsequent actions can restore or imply Grant alive or operative status.
  id: c_6
  satisfaction_condition: From node s_6 onwards, system states Grant is dead and inactive
    as a threat.
  type: invariant
  violation_condition: System or player input results in Grant’s actions, survivance,
    or influence appearing post s_6 (e.g., Grant acting or alive after death).
- description: Grant’s death at the hands of Bond (s_6) must be achieved before the
    narrative proceeds to mission resolution phases involving Klebb and Number 1,
    ensuring the assassin's defeat as a critical milestone.
  id: c_7
  satisfaction_condition: Node s_6 is reached and confirmed before advancing story
    segments where Klebb commands or gets reprimanded post-failure.
  type: achievement
  violation_condition: Later narrative stages reference Klebb’s control and Number
    1’s reactions without confirmed Grant death (s_6 not achieved).
