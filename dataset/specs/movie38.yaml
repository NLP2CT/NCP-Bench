commitments:
- description: The contract killing in Freedomtown must occur before Tony and group
    receive green cards and enter Miami’s underworld.
  id: c_0
  satisfaction_condition: Node s_0 is completed before s_1 begins (i.e., assassination
    of Cuban official and Freedomtown release precedes underworld dealings).
  type: ordering
  violation_condition: Player attempts to engage in drug trade or meet Frank Lopez
    before completing the contract killing and release from Freedomtown (before completing
    s_0).
- description: The murder of Angel by Colombian dealers must precede the retaliatory
    killing of the Colombians.
  id: c_1
  satisfaction_condition: Event of Angel’s chainsaw murder occurs before killing Colombians
    (progress from s_1 to s_2).
  type: ordering
  violation_condition: Player initiates violence against Colombian dealers without
    Angel being murdered first (i.e., no prior Angel murder).
- description: Tony and Manny must personally meet Frank Lopez and deliver seized
    money/drugs before being officially hired.
  id: c_2
  satisfaction_condition: Completion of meeting with Frank (s_2) occurs after avenging
    Angel and retrieval of deal goods; hiring event triggers only afterward.
  type: ordering
  violation_condition: Player gains Frank's employment or access to his resources
    before delivering the drugs and money or meeting him directly.
- description: Tony’s protective stance toward his sister Gina regarding Manny is
    consistent from s_3 onward.
  id: c_3
  satisfaction_condition: Throughout nodes s_3 to s_9, Tony consistently warns or
    reacts protectively about Manny’s association with Gina.
  type: invariant
  violation_condition: Player allows Manny uninhibited access to Gina or ignores Tony’s
    protective warnings prior to s_9 confrontation.
- description: Tony must learn of Omar’s betrayal and witness his execution before
    permanently trusting Sosa and dismissing Frank.
  id: c_4
  satisfaction_condition: Node s_4 (Bolivia meeting, Omar’s execution) precedes s_5
    and s_6 where Tony’s relationship shifts from Frank to Sosa.
  type: ordering
  violation_condition: Player establishes independent dealings with Sosa or severs
    ties with Frank before knowing Omar is an informant and seeing his death.
- description: Frank’s anger and dissolution of partnership with Tony only occur after
    Tony’s unauthorized deal with Sosa and pursuit of Elvira.
  id: c_5
  satisfaction_condition: Node s_5 is completed, showing Frank’s anger and partnership
    end, before Tony openly establishes his own operation and relationship with Elvira.
  type: ordering
  violation_condition: Player is permitted to seize control of the empire or pursue
    Elvira without first triggering Frank’s ire and partnership breakdown.
- description: Attempted assassinations and police intimidation attempts must precede
    confrontation with Frank and killing of Frank and Bernstein.
  id: c_6
  satisfaction_condition: Events of hits on Tony and police shake-down occur before
    Tony confronts and kills Frank and Bernstein (s_6).
  type: ordering
  violation_condition: Player kills Frank or Bernstein before the prior attempt on
    Tony’s life and police conflict have happened.
- description: Tony’s cocaine addiction and internal empire tensions persist between
    marriage to Elvira and legal troubles.
  id: c_7
  satisfaction_condition: From s_7 start to s_8 end, Tony exhibits cocaine abuse,
    strained relationships with Manny and Elvira, and financial/legal pressures.
  type: invariant
  violation_condition: Player removes or ignores cocaine addiction signs, interpersonal
    conflict, or legal jeopardy during s_7 to s_8 phases.
- description: Assassination attempt on the Bolivian journalist must be planned and
    called off before Sosa ends his business relationship with Tony.
  id: c_8
  satisfaction_condition: Node s_8 (failed assassination and Alberto’s death) completed
    before s_9 where Sosa terminates ties with Tony.
  type: ordering
  violation_condition: Player proceeds to war declaration or loss of Sosa alliance
    prior to planning and canceling the assassination attempt.
- description: Tony discovering Manny and Gina’s secret marriage and killing Manny
    must happen only after failed assassination and Sosa’s withdrawal.
  id: c_9
  satisfaction_condition: Node s_9’s events occur after s_8 and before war declaration
    in s_10.
  type: ordering
  violation_condition: Player kills Manny out of context without prior discovery of
    secret marriage and actual disappearance of Manny and Gina.
- description: Tony declares war on Sosa only after killing Manny and bringing Gina
    to his mansion, triggered by Sosa’s assault on Tony’s empire.
  id: c_10
  satisfaction_condition: s_10’s declaration of war happens strictly after killing
    Manny in s_9 and before final assault and mansion attack.
  type: ordering
  violation_condition: Player initiates war or assault on Sosa before killing Manny
    and consolidating Gina at the mansion.
- description: Tony’s death after a violent last stand defending his mansion marks
    the conclusive end of the narrative arc.
  id: c_11
  satisfaction_condition: Node s_11 triggers Tony’s mortal wounding, final battle,
    and ultimate death at the mansion.
  type: achievement
  violation_condition: Player avoids Tony’s death or defeats final assault without
    triggering the fatal shootout and Tony’s fall.
