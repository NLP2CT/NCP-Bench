meta:
  genres: ["Action", "Sci-Fi"]
  id: movie13
  player_role: The Predator
  title: "Predator"
synopsis: An alien spacecraft enters the Earth's atmosphere and jettisons a pod, which
  descends onto the planet. Some time later, Major Alan "Dutch" Schaefer  arrives
  in Central America with his elite team for an operation to rescue a presidential
  cabinet minister and his aide who had been abducted by guerrilla forces. The team
  consists of Mac Eliot , Blain Cooper , Billy Sole , Jorge "Poncho" Ramirez , and
  Rick Hawkins . Dutch's old military friend George Dillon , now working for the CIA,
  accompanies them as a liaison. The team is inserted into the jungle by helicopter
  and begins its hunt. They soon find the wreckage of a downed helicopter and later,
  the remains of Army Special Forces, whose presence in the country mystifies Dutch,
  while shocking them that the bodies are found to be hanged with their skin removed.
  They track the guerillas to a heavily defended rebel encampment which they destroy,
  except for a woman named Anna  whom they take prisoner. Dutch is enraged when Dillon
  confesses the rescue mission had been a ploy to get his group to attack the camp
  and that the men they found earlier had disappeared in a failed rescue of two CIA
  agents. As the team make their way to the extraction point, they are observed from
  afar by an unknown creature using thermal imaging. Anna briefly escapes, but when
  Hawkins catches her, he is seized and dragged off. The nearly invisible creature
  spares the unarmed Anna. Moments later, while the team is looking for Hawkins' killer,
  Blain is killed. Mac physically sees the creature and opens fire on it, but it disappears
  into the jungle. Anna offers the team insight on the creature which is something
  of a local legend. The team sets a trap, but it avoids capture, severely wounding
  Poncho in the process. Mac and Dillon are killed in the ensuing chase, and Billy
  is slain making a stand. The Predator catches up to Dutch and engages in a short
  shootout during which Poncho is killed. Realizing the creature only attacks those
  possessing weapons, a wounded Dutch sends Anna unarmed to the extraction point.
  Jumping off a waterfall, he narrowly escapes the creature by inadvertently masking
  his body's heat signature with mud and witnesses the Predator's true form when its
  active camouflage fails in the water. Dutch applies more mud, improvises various
  weaponry and traps, then baits the Predator into coming out by starting a large
  fire. Hearing Dutch's war-cry, the Predator arrives to investigate and eventually
  traps him. Discarding its electronic weaponry, the alien challenges Dutch to hand-to-hand
  combat. Battered and barely able to move, Dutch manages to drop the counterweight
  from one of his traps, which falls and crushes the creature. As Dutch asks the mortally
  wounded alien what it is, the creature mimics his question in garbled English and
  then activates a self-destruct mechanism on its wrist device while laughing, gradually
  increasing its laugh into a human-like pitch. Dutch barely escapes the massive explosion
  and is rescued by helicopter along with Anna.
trajectory:
- description: An alien spacecraft is entering Earth's atmosphere and releases a pod
    that begins its descent through the atmosphere towards a remote jungle area on
    Earth. The environment is tense and unpopulated as the pod descends.
  id: s_0
  key_delta: Introduction of the extraterrestrial element entering Earth undetected;
    the pod is now on Earth’s surface.
  trigger_event: The pod lands undetected in the jungle as Dutch's team is dispatched
    into the same region.
- description: Major Alan 'Dutch' Schaefer and his elite team have arrived by helicopter
    in a dense Central American jungle to conduct a rescue operation of a presidential
    cabinet minister and his aide abducted by guerrillas.
  id: s_1
  key_delta: Introduction of human military forces and the mission setting in hostile
    jungle territory.
  trigger_event: Dutch and his team are inserted into the jungle by helicopter.
- description: The team discovers the wreckage of a downed helicopter and the bodies
    of Army Special Forces soldiers who have been hanged and skinned. The environment
    is ominous, dense jungle surroundings imply danger.
  id: s_2
  key_delta: Evidence of a previous failed military mission and an unknown hostile
    presence becomes apparent.
  trigger_event: The team finds the helicopter wreckage and the mutilated remains
    of Special Forces troops.
- description: The team locates and destroys a heavily defended guerrilla encampment,
    capturing a female survivor named Anna. Morale is tense; jungle warfare context
    is intensified.
  id: s_3
  key_delta: Guerrilla opposition is neutralized and potential intelligence source
    (Anna) is obtained.
  trigger_event: The team attacks and overtakes the rebel camp, taking Anna prisoner.
- description: Dutch learns from George Dillon that the rescue mission was a covert
    ploy to provoke an attack on the camp; the special forces deaths were from a failed
    prior CIA agent rescue. The team proceeds through dense jungle terrain towards
    the extraction point.
  id: s_4
  key_delta: Revelation that their mission was manipulated and betrayal by the CIA
    liaison alters team trust and objective clarity.
  trigger_event: Dillon confesses the true purpose of the mission to Dutch and the
    team.
- description: The team is being stalked in the jungle, with an unknown creature observing
    them via thermal imaging from a distance. The atmosphere is tense and foreboding
    in the dense foliage.
  id: s_5
  key_delta: Introduction of the Predator as a hostile invisible hunter targeting
    the team.
  trigger_event: The unseen hunter makes its first move, seizing Hawkins when Anna
    tries to flee.
- description: Anna temporarily escapes captivity but is recaptured after Hawkins
    is seized and dragged off by the creature. The jungle is silent except for signs
    of the unseen predator's presence.
  id: s_6
  key_delta: The Predator begins direct lethal interaction with the team, escalating
    threat level.
  trigger_event: Hawkins is taken by the creature during Anna's escape and recapture.
- description: Blain is killed during an encounter; Mac sees the creature briefly
    and fires at it, but it vanishes into the jungle. The team is aware now of a flesh-and-blood
    hunter with advanced camouflage.
  id: s_7
  key_delta: Confirmation of an intelligent invisible predator that can kill team
    members stealthily.
  trigger_event: Blain’s death and Mac’s sighting of the Predator.
- description: Anna provides information identifying the creature as part of a local
    legend. The team attempts to trap it, but it evades capture and severely wounds
    Poncho in the process.
  id: s_8
  key_delta: The Predator's superior hunting skills and lethality are further demonstrated;
    team’s knowledge base expands.
  trigger_event: The team attempts and fails to trap the creature, resulting in Poncho's
    injury.
- description: Mac and Dillon are killed during a chase by the Predator. The atmosphere
    grows increasingly dangerous and desperate in the jungle environment.
  id: s_9
  key_delta: Significant reduction in team strength and increase in threat presence.
  trigger_event: Mac and Dillon are killed by the Predator while fleeing.
- description: Billy is killed defending the group; Dutch encounters the Predator
    again, initiating a firefight during which Poncho is killed. The jungle setting
    is now a hostile hunting ground with decimated survivors.
  id: s_10
  key_delta: Survival stakes increase with continued Predator kills; team members
    critically reduced.
  trigger_event: Billy's death and Dutch’s shootout with the Predator where Poncho
    is killed.
- description: Dutch realizes the Predator hunts only armed targets and sends the
    unarmed Anna to extraction. He escapes the Predator by covering himself in mud
    to mask his heat signature and witnesses the Predator’s true form when its cloak
    fails underwater.
  id: s_11
  key_delta: Dutch gains critical insight into the Predator’s hunting method and visual
    confirmation of its form.
  trigger_event: Dutch evades the Predator by using mud while jumping off a waterfall
    and sees its active camouflage fail.
- description: Dutch improvises weapons and traps with mud camouflage and lures the
    Predator by starting a large fire. The jungle is transformed into a battleground
    marked by traps and flames.
  id: s_12
  key_delta: Dutch takes offensive action leveraging knowledge and environment to
    engage the Predator on his terms.
  trigger_event: Dutch starts a large fire to bait the Predator.
- description: The Predator arrives and traps Dutch, discarding its electronic weapons
    and challenging him to hand-to-hand combat in the jungle clearing.
  id: s_13
  key_delta: The combat escalates to a primal, physical duel between Dutch and the
    Predator.
  trigger_event: The Predator confronts Dutch and discards its weapons for melee combat.
- description: Dutch, battered and barely able to move, drops the counterweight of
    a trap, crushing the Predator. The jungle falls silent after the devastating impact.
  id: s_14
  key_delta: The Predator is mortally wounded and defeated by Dutch.
  trigger_event: Dutch activates the trap that crushes the Predator.
- description: As Dutch questions the mortally wounded Predator, the creature mimics
    his question in broken English and activates a self-destruct sequence on its wrist
    device. Dutch escapes the massive explosion.
  id: s_15
  key_delta: Final fatal threat neutralized with Predator’s self-destruction; Dutch
    survives the explosion.
  trigger_event: The Predator activates self-destruct and laughs in escalating human-like
    pitch.
- description: Dutch and Anna are rescued by helicopter from the jungle area post-explosion,
    the environment shows the aftermath of the conflict with charred earth and silence.
  id: s_16
  key_delta: Survival and extraction of the last team members marking the mission’s
    conclusion.
  trigger_event: Rescue helicopter arrives and extracts Dutch and Anna.
