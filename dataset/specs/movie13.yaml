commitments:
- description: The alien spacecraft must jettison the pod (s_0) before any human or
    team activities begin to ensure extraterrestrial presence is introduced first.
  id: c_0
  satisfaction_condition: Node s_0 event has occurred prior to the initiation of node
    s_1 or any subsequent nodes.
  type: ordering
  violation_condition: Player forces team or human activity nodes (s_1 or later) to
    occur before the pod entry event s_0.
- description: The team’s insertion into the jungle (s_1) must happen before discovering
    the helicopter wreckage and special forces remains (s_2) to maintain logical chronological
    progression.
  id: c_1
  satisfaction_condition: Node s_1 occurs before s_2.
  type: ordering
  violation_condition: Player attempts to reveal or investigate the crash site or
    remains before the team has been inserted into the jungle.
- description: The team must not obtain full intelligence about the previous failed
    missions or true nature of the rescue mission (CIA ploy) before s_4 to avoid premature
    exposure of betrayal and mission manipulation.
  id: c_2
  satisfaction_condition: Prior to node s_4, no information or acknowledgment of the
    CIA deception is accessible or accepted as true by the team.
  type: invariant
  violation_condition: Player gains or triggers definitive knowledge/acknowledgment
    of the rescue mission's true purpose and CIA betrayal before node s_4.
- description: The Predator’s presence and thermal stalking (s_5) must be established before the first abduction (s_6), and this initial threat must be revealed before further lethal encounters (s_7 onwards) to maintain narrative tension.
  id: c_3
  satisfaction_condition: Node s_5 occurs before s_6, and both are completed before any team deaths subsequent to Hawkins (node s_7 and later).
  type: achievement
  violation_condition: Player causes Predator kills or direct attacks on the team (s_6) before the thermal observation (s_5) is established, or causes kills beyond Hawkins before s_6 is completed.
- description: The team discovering and briefly seeing the Predator (s_7) must occur
    before they attempt traps or tactics based on knowledge (s_8) to maintain proper
    knowledge acquisition sequence.
  id: c_4
  satisfaction_condition: Node s_7 (Blain death and Predator sighting) occurs before
    node s_8 (trap attempt and Anna's insight).
  type: ordering
  violation_condition: Player initiates trapping efforts or discusses the creature
    intelligently (s_8) before any confirmed Predator sighting at s_7.
- description: The team’s reduction in strength by Predator kills must reflect the
    order and number of deaths as per trajectory nodes (Hawkins, Blain, Mac, Dillon,
    Billy, Poncho) to uphold story continuity and challenge escalation.
  id: c_5
  satisfaction_condition: Deaths occur in the narrative logical order and no team
    member is killed before official kill nodes s_6 through s_10 respectively.
  type: invariant
  violation_condition: Player causes deaths out of order, skips deaths, or prevents
    expected character deaths before their designated nodes or timeline segments.
- description: Dutch’s understanding that the Predator only hunts armed targets and
    his sending unarmed Anna to extraction (s_11) must hold true to justify stealth
    tactics and final showdown conditions.
  id: c_6
  satisfaction_condition: Player enables Dutch to evade Predator by masking heat signature
    with mud at s_11 before hand-to-hand fight.
  type: invariant
  violation_condition: Player uses Anna as armed combatant or reveals knowledge of
    Predator hunting behavior before node s_11.
- description: Dutch’s evasion by mud camouflage (s_11) and witnessing Predator’s
    active camouflage failure must occur before Dutch prepares traps and starts the
    fire to bait the Predator (s_12).
  id: c_7
  satisfaction_condition: s_11 occurs before s_12.
  type: ordering
  violation_condition: Player starts offensive baiting/trapping (s_12) without Dutch
    first exploiting mud camouflage or seeing Predator’s true form.
- description: The Predator must discard its ranged electronic weapons and initiate
    hand-to-hand combat (s_13) only after Dutch has baited it and traps are set, preserving
    the climax’s narrative escalation.
  id: c_8
  satisfaction_condition: Node s_12 (baiting with fire) is completed before node s_13
    (hand-to-hand combat initiation).
  type: ordering
  violation_condition: Player initiates melee combat with Predator before Dutch’s
    offensive baiting and trap preparation.
- description: Dutch must mortally wound the Predator through the trap counterweight
    crush (s_14) to provide conclusive resolution of the battle.
  id: c_9
  satisfaction_condition: The trap counterweight is triggered crushing the Predator
    during node s_14.
  type: achievement
  violation_condition: Player causes the Predator’s defeat without activating the
    trap or through alternate means violating the climactic milestone.
- description: The Predator activates self-destruct with escalating human-like laughter
    (s_15) following mortal wounding, forcing Dutch’s narrow escape and concluding
    the threat.
  id: c_10
  satisfaction_condition: After s_14’s mortal wound, the Predator self-destructs as
    described in s_15, with Dutch narrowly escaping.
  type: invariant
  violation_condition: Player prevents or alters the Predator’s self-destruct sequence
    or the manner of sound and timing after its defeat.
- description: Dutch and Anna must be extracted safely by helicopter at story end
    (s_16), closing the narrative arc of survival and rescue.
  id: c_11
  satisfaction_condition: Helicopter arrives and extracts Dutch and Anna after the
    self-destruct event.
  type: achievement
  violation_condition: Player kills or prevents rescue of Dutch and Anna after the
    final explosion, or extracts them prematurely before s_15.
