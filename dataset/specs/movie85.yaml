commitments:
- description: The Persian demand at Sparta (s_0) must occur before Leonidas rejects
    it by kicking the messenger into the well (s_1), establishing the external threat
    prior to conflict escalation.
  id: c_0
  satisfaction_condition: Node s_0 event (Persian messenger demand) is triggered before
    node s_1 event (Leonidas kicks messenger).
  type: ordering
  violation_condition: Player triggers Leonidas rejecting the demand (s_1) before
    the Persian messenger arrives and delivers ultimatum (s_0).
- description: Leonidas must secure Ephors’ consultation (s_2) and receive the Oracle
    decree (s_3) prior to proceeding with war preparations or troop deployment.
  id: c_1
  satisfaction_condition: Node s_2 and s_3 complete before Leonidas sets out with
    300 soldiers (s_5).
  type: ordering
  violation_condition: Leonidas departs with personal guards (s_5) before obtaining
    Ephors' input and Oracle decree (s_2 and s_3).
- description: The Oracle's decree forbidding official war during Carnea (s_3) remains
    valid as long as official council authorization has not been bypassed or overturned.
  id: c_2
  satisfaction_condition: Between s_3 and s_5, no official Spartan wide-scale war
    declaration is enacted and the Oracle’s command is recognized as binding.
  type: invariant
  violation_condition: Player achieves official council war authorization or large-scale
    war actions during the Carnea festival before the Oracle decree is respected.
- description: Bribery and corruption of Ephors by Persian agents (s_4) must occur
    or be acknowledged before any meaningful weakening or treasonous influence within
    Sparta is recognized.
  id: c_3
  satisfaction_condition: Node s_4 event happens and is confirmed before Theron’s
    later betrayal (s_18) or council conflict.
  type: ordering
  violation_condition: Council or narrative accepts Theron’s treachery or undermines
    Spartan unity without prior reference to Ephors’ bribery (s_4).
- description: Leonidas’ departure with 300 soldiers (s_5) must follow the loss or
    refusal of official approval and is a deliberately limited force mission, preserving
    the political context of limited sanction.
  id: c_4
  satisfaction_condition: Node s_5 occurs after Ephors’ input and Oracle decree (s_2,
    s_3) and before any official council reinforcement.
  type: ordering
  violation_condition: Leonidas leads a full sanctioned Spartan army or large reinforcements
    to Thermopylae prior to s_5 or without it occurring.
- description: Ephialtes’ knowledge of the secret goat path and request to join the
    battle (s_7) remains exclusive and unresolved until the betrayal unfolds, maintaining
    suspense around the flank threat.
  id: c_5
  satisfaction_condition: Ephialtes’ offer is declined (s_8) and secret path threat
    is unknown to Persians until he defects (s_15).
  type: invariant
  violation_condition: Player obtains or reveals secret path or Ephialtes’ role prior
    to s_7 and s_8 or prematurely betrays Spartans before s_15 event.
- description: Spartan rejection of surrender demands (s_9) and subsequent defensive
    successes (s_10, s_12, s_13) lead sequentially to escalated Persian attacks and
    failed attempts to break Spartan formation.
  id: c_6
  satisfaction_condition: Persian assaults and Spartan repulses (nodes s_9 through
    s_13) occur in order before the outflanking phase begins (s_15 onwards).
  type: ordering
  violation_condition: Persians use secret path or escalate to flank phase (s_15)
    before initial frontal assault phases and Spartan resistance are established.
- description: Leonidas’ refusal of Xerxes’ offers of wealth and power (s_11) remains
    firm throughout the battle, reflecting his unwavering defiance.
  id: c_7
  satisfaction_condition: All gestures of surrender or allegiance to Xerxes by Leonidas
    between s_11 and s_23 are rejected or feigned only tactically without true submission.
  type: invariant
  violation_condition: Player accepts Xerxes’ offers authentically or surrenders Sparta’s
    independence before or during the battle phases.
- description: The betrayal by Ephialtes (s_15) must occur before the Spartan force
    is finally outflanked and overwhelming assault ordered (s_20 to s_23).
  id: c_8
  satisfaction_condition: Ephialtes defecting and revealing the secret path (s_15)
    precedes any Persian successful flanking movements and final attacks.
  type: ordering
  violation_condition: Persians outflank Spartans (s_20) or achieve tactical victory
    without the prior confirmed betrayal and secret path exposure (s_15).
- description: Dilios’ dispatch back to Sparta (s_16, s_17) and arrival must occur
    before Spartan council unites and counteracts Persian influence, culminating in
    Theron’s exposure and death (s_18, s_19).
  id: c_9
  satisfaction_condition: Dilios departs battlefield with news (s_17) before council’s
    confrontation with Theron’s betrayal (s_18, s_19).
  type: ordering
  violation_condition: Council political resolution or exposure of Theron’s treason
    occurs before Dilios returns with battlefield news.
- description: Theron's role as a Persian agent inside Sparta and the subsequent political
    betrayal must be directly connected and provable only upon the xiphē killing incident
    (s_19).
  id: c_10
  satisfaction_condition: Theron’s accusation against Gorgo (s_18) is immediately
    followed by his death revealing Persian coins, cementing his traitor status.
  type: invariant
  violation_condition: Theron is exposed or eliminated without connection to bribery
    evidence or prior accusation sequence.
- description: Leonidas’ strategic battle climax actions—feigning surrender, Stelios
    killing Persian general (s_21), and Leonidas wounding Xerxes (s_22)—occur in strict
    sequence before Spartans' final stand and death (s_23).
  id: c_11
  satisfaction_condition: Nodes s_21 and s_22 events occur consecutively before the
    final Persian arrow barrage and Spartan sacrifice (s_23).
  type: ordering
  violation_condition: Final Spartan deaths (s_23) happen before Leonidas’ spear wound
    to Xerxes or before the killing of the Persian general by Stelios.
- description: Leonidas’ heroic death and pledge of undying love to Queen Gorgo (s_23)
    must be achieved, marking the culmination of Spartan sacrifice and motivating
    the Greek resistance.
  id: c_12
  satisfaction_condition: Node s_23 combat and death scene, including Leonidas’ love
    pledge to Gorgo, is properly triggered and completed.
  type: achievement
  violation_condition: Leonidas survives the final assault without pledging his love,
    or Spartan forces survive beyond the intended sacrificial defeat.
- description: Dilios’ narration to Greek allies (s_24) and subsequent leadership
    of the united Greek forces (s_25) must occur after Thermopylae's events (s_23),
    reflecting the inspirational legacy of Spartan sacrifice.
  id: c_13
  satisfaction_condition: Dilios’ speech (s_24) and alliance charge (s_25) are triggered
    only after the full Spartan defeat at Thermopylae (s_23) is acknowledged.
  type: ordering
  violation_condition: Greek unity or charge against Persians (s_24, s_25) happens
    before Spartan sacrifice at Thermopylae (s_23) or in absence of Dilios’ narrative.
- description: The narrative must culminate in the Greek coalition preparing to battle
    Persia at Plataea (s_25), ensuring that Spartan sacrifice leads to tangible Greek
    unity and resistance success.
  id: c_14
  satisfaction_condition: Node s_25 event of leading 40,000 Greek forces charging
    Persians is triggered before narrative conclusion.
  type: invariant
  violation_condition: Narrative ends or diverges before united Greek army charge
    is deployed or without reference to Spartan-inspired alliance.
