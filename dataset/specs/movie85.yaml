meta:
  genres: ["Action", "War"]
  id: movie85
  player_role: Dilios
  title: "300"
synopsis: Dilios, a Spartan soldier, narrates the story of Leonidas from his boyhood
  to becoming a king of Sparta. Years later, a Persian messenger arrives at the gates
  of Sparta, demanding the submission of Sparta to King Xerxes. In response to this
  demand, Leonidas kicks the messenger into a large well. Knowing this will prompt
  a Persian attack, Leonidas visits the Ephors—ancient leprosy-ridden priests whose
  blessing he needs before the Spartan council will authorize going to war. He proposes
  they repel the numerically superior Persians by using the terrain of Thermopylae
  and funneling the Persians into a narrow pass between the rocks and the sea. The
  Ephors consult the Oracle, who decrees that Sparta must not go to war during their
  religious festival Carnea. As Leonidas departs, two agents of Xerxes appear—one
  of them, Theron, a Spartan—who bribe the Ephors with concubines and money. Leonidas
  follows his plan anyway, setting out with only 300 soldiers, whom he calls his personal
  guards to avoid needing the council's permission. Though he regards the mission
  as certain suicide, he hopes the sacrifice will spur the council to unite against
  Persia. On the way to Thermopylae, Arcadians join the Spartans. At Thermopylae they
  construct a wall to contain the approaching Persians. As construction goes on, Leonidas
  meets Ephialtes, a hunchbacked Spartan in exile whose parents fled Sparta to spare
  him certain infanticide. Wanting to redeem his father's name, Ephialtes asks to
  join the fight; he warns Leonidas of a secret path the Persians could use to outflank
  and surround them. Though Leonidas sympathizes with Ephialtes's will to fight, he
  turns him down, as Ephialtes cannot properly hold a shield——this would compromise
  the Spartans' phalanx formation. Before the battle, the Persian Captain demands
  that the Spartans lay down their weapons. Leonidas refuses, and with their tightly-knit
  phalanx formation, the Spartans use the narrow terrain to repeatedly rebuff the
  advancing Persian army. Xerxes personally parleys with Leonidas, offering him wealth
  and power in exchange for his loyalty and surrender. Leonidas declines, and Xerxes
  sends his elite guard, the formidable Immortals, to attack, but the Spartans successfully
  dispatch them, suffering a few casualties of their own. Xerxes then sends a number
  of exotic weapons at the Spartans, including black powder bombs and war elephants,
  but all of these attacks fail. During these attacks, Astinos is killed, which drives
  his father Captain Artemis into a fit of rage. Angered by Leonidas's rejection,
  Ephialtes defects to the Persians and informs them of the secret path. When they
  realize Ephialtes's treachery, the Arcadians retreat, and Leonidas orders Dilios
  to return to Sparta to tell the Council of their sacrifice. Though Dilios had recently
  injured his left eye in combat, he is still fit for battle, but Leonidas decides
  to use Dilios's gift for storytelling to appeal to the Spartan council. Though reluctant
  to leave his brothers behind, Dilios leaves with the Arcadians. In Sparta, Queen
  Gorgo is raped by Theron, before which he promises his help in persuading the Spartan
  council to send reinforcements to Leonidas. However, following her address to the
  Council, Theron publicly betrays the Queen by accusing her of adultery, prompting
  the councilmen to cry out in outrage and Gorgo to kill him in a fit of anger. The
  xiphē that Gorgo uses to kill Theron pierces his purse, spilling Persian coins from
  his robe, revealing his role as traitor, and the Council agrees to unite against
  Persia. At Thermopylae, the Persians use the goat path to outflank the Spartans.
  Xerxes's general demands their surrender, again offering Leonidas titles and prestige.
  Leonidas seemingly bows in submission, allowing Stelios to leap over him and kill
  the general instead. Furious, Xerxes orders his troops to attack. Leonidas rises
  and hurls his spear at Xerxes, cutting the King on the cheek, thus fulfilling an
  earlier promise to "make the God-King bleed". Visibly disturbed by this reminder
  of his mortality, Xerxes watches as a massive barrage of arrows kills all the Spartans.
  Moments before his death, Leonidas pledges his undying love to Gorgo. Concluding
  his tale before an audience of Spartans on the edge of the battlefield a year after
  Thermopylae, Dilios relates how the Persian army has suffered desertions, out of
  fear and the heavy casualties they suffered at the hands of a mere 300 Spartans.
  Word of their valiant resistance spread across Greece, inspiring the different city-states
  to unite against the Persians. Now, the Persians face 10,000 Spartans leading 30,000
  free Greeks. Although still outnumbered three to one, Dilios declares that the Greeks
  shall be victorious and praises the sacrifice of the 300. He then leads the Greeks
  in a charge against the Persian army at the Battle of Plataea, the battle that would
  end Persia's invasion of Greece.
trajectory:
- description: Dilios stands among the Spartan citizens as Leonidas recounts his early
    life and rise to kingship, in a time of relative peace before Persian demands.
    The city of Sparta is calm but tense, with an undercurrent of impending conflict.
  id: s_0
  key_delta: Presence of Persian demand introduces the external threat and potential
    for war against Persia.
  trigger_event: A Persian messenger arrives at the gates of Sparta, demanding submission
    to King Xerxes.
- description: The Persian messenger stands at the gates, making the ultimatum clear
    to Spartan guards and citizens, including Dilios and Leonidas.
  id: s_1
  key_delta: Sparta openly rejects the Persian demands, solidifying the conflict and
    guaranteeing Persian retaliation.
  trigger_event: Leonidas forcibly kicks the Persian messenger into a large well at
    the city gate.
- description: Leonidas visits the Ephors, the leprosy-ridden Spartan priests, in
    their chamber seeking their blessing and permission for war preparations.
  id: s_2
  key_delta: Leonidas presents a strategic defense plan contingent on Ephors' approval
    and the Oracle's decree.
  trigger_event: Leonidas proposes to repel the Persians by using the terrain of Thermopylae
    to narrow the battlefield.
- description: The Ephors and Leonidas assemble as the Oracle delivers her decree
    forbidding war during the religious festival Carnea.
  id: s_3
  key_delta: Sparta is restricted from official war authorization during Carnea, impeding
    immediate large-scale action.
  trigger_event: The Ephors inform Leonidas of the Oracle's mandate and deliberate
    on war timing.
- description: As Leonidas departs from the Ephors' chambers, two Persian agents,
    one being Theron a Spartan, bribe the Ephors with concubines and money.
  id: s_4
  key_delta: Ephors are compromised by Persian bribery, introducing internal betrayal
    within Sparta.
  trigger_event: The bribery transaction between Persian agents and Ephors is completed.
- description: Leonidas assembles 300 soldiers, his personal guards, preparing to
    head to Thermopylae without official council sanction, to execute his plan.
  id: s_5
  key_delta: Leonidas commits to a limited force strategy, initiating the defensive
    operation independently.
  trigger_event: Leonidas departs Sparta with 300 Spartans and some Arcadian allies
    towards Thermopylae.
- description: At Thermopylae, Spartans and Arcadians begin constructing defensive
    walls in the narrow mountain pass between rocks and sea.
  id: s_6
  key_delta: Fortifications are established to channel and contain the approaching
    Persian forces.
  trigger_event: Construction of defensive walls at the pass begins under Spartan
    oversight.
- description: Leonidas meets Ephialtes, the hunchbacked Spartan exile who offers
    to fight and reveals knowledge of a secret path around the pass.
  id: s_7
  key_delta: Introduction of threat to Spartan flank via secret route; Ephialtes'
    presence signals potential risk.
  trigger_event: Ephialtes requests to join the battle and warns Leonidas of the secret
    goat path.
- description: Leonidas declines Ephialtes' offer, citing his inability to properly
    hold a shield which would compromise the phalanx formation.
  id: s_8
  key_delta: Spartan defensive integrity is preserved, leaving Ephialtes outside the
    main force and the secret path threat unresolved.
  trigger_event: Leonidas refuses Ephialtes' participation in the battle.
- description: Persian Captain demands Spartans lay down their weapons at the battlefield
    edge; Spartans form their tightly-knit phalanx in refusal.
  id: s_9
  key_delta: Open hostilities begin with Spartan collective resistance using terrain
    and phalanx tactics.
  trigger_event: Persian Captain makes his surrender demand at the battlefield.
- description: Spartans successfully repel repeated Persian frontal assaults in the
    narrow pass, inflicting heavy casualties despite being outnumbered.
  id: s_10
  key_delta: Persian force loses men and momentum, validating Spartan strategy and
    terrain advantage.
  trigger_event: Persian repeated assaults are repressed by Spartan defense.
- description: Xerxes personally meets Leonidas, offering wealth and power for loyalty;
    Leonidas declines supreme offers.
  id: s_11
  key_delta: Leonidas' defiance is reaffirmed, escalating Xerxes' resolve for total
    conquest.
  trigger_event: Xerxes conducts personal parley with Leonidas on the battlefield.
- description: Xerxes unleashes his elite guard, the Immortals, who are met and defeated
    by the Spartans with limited Spartan casualties.
  id: s_12
  key_delta: Elite Persian unit is rendered ineffective; Spartan morale and tactical
    superiority confirmed.
  trigger_event: Immortals launch assault and are defeated by Spartans.
- description: Xerxes deploys exotic warfare, including black powder bombs and elephants,
    in attempts to break Spartan defenses.
  id: s_13
  key_delta: All attempts fail against Spartan formation; Persian offensive technology
    is neutralized.
  trigger_event: Persian use of new war machines and animals against Spartans.
- description: Astinos, son of Captain Artemis, is killed in battle, inciting rage
    in his father.
  id: s_14
  key_delta: Loss of a key Spartan warrior heightens emotional stakes and warrior
    fury.
  trigger_event: Astinos falls during combat against the Persians.
- description: Ephialtes defects to Persia, betraying Spartans by revealing the secret
    goat path to Xerxes' forces.
  id: s_15
  key_delta: Persians gain strategic advantage enabling outflanking of Spartan defensive
    position.
  trigger_event: Ephialtes physically approaches Persian camp and shares the secret
    route.
- description: On discovery of Ephialtes' betrayal, Arcadians retreat; Leonidas orders
    Dilios to return to Sparta and inform the council.
  id: s_16
  key_delta: Spartan force diminished; intelligence sent to Sparta leading to potential
    political ramifications.
  trigger_event: Arcadian withdrawal and Leonidas' dispatch of Dilios as messenger.
- description: Dilios, recently injured but alive, departs Thermopylae with Arcadians
    to deliver Leonidas' message to the Spartan council.
  id: s_17
  key_delta: Communication channel established between battlefield and Spartan political
    leadership.
  trigger_event: Dilios leaves the battlefield carrying the story of Spartan sacrifice.
- description: In Sparta, Queen Gorgo is assaulted by Theron, who promises to support
    her but later betrays her before the council.
  id: s_18
  key_delta: Political betrayal revealed; Gorgo's honor challenged and Persian influence
    within Sparta exposed.
  trigger_event: Theron publicly accuses Queen Gorgo of adultery during the council
    assembly.
- description: Gorgo, enraged, kills Theron with a xiphē during the council session,
    exposing Persian coins spilled from his robe indicating treason.
  id: s_19
  key_delta: Traitor identified and eliminated; council unites against Persia with
    renewed resolve.
  trigger_event: Theron is killed by Gorgo; Persian bribery evidence revealed.
- description: Back at Thermopylae, Persians use the goat path to outflank Spartans;
    Xerxes' general demands Spartan surrender with offers of titles.
  id: s_20
  key_delta: Spartan position compromised strategically; psychological pressure renewed.
  trigger_event: Persians appear behind Spartan lines via secret path and demand surrender.
- description: Leonidas feigns submission, allowing Stelios to kill the Persian general
    in a surprise move; Xerxes enraged orders full attack.
  id: s_21
  key_delta: Persian leadership loses a key commander; battle escalates to final confrontation.
  trigger_event: Leonidas bows while Stelios kills the general; Xerxes orders all-out
    assault.
- description: Leonidas throws a spear that wounds Xerxes on the cheek, fulfilling
    his vow to make the God-King bleed as Spartans brace for the final wave.
  id: s_22
  key_delta: Xerxes' perceived invincibility challenged; battle morale impacted on
    both sides.
  trigger_event: Leonidas hurls spear hitting Xerxes visibly.
- description: Massive Persian arrow barrage overwhelms Spartans; all 300 Spartans
    fall in combat, Leonidas pledges undying love to Queen Gorgo before dying.
  id: s_23
  key_delta: Spartan heroic sacrifice completed; physical forces lost but legacy preserved.
  trigger_event: Final Persian assault kills the Spartans; Leonidas dies on battlefield.
- description: One year later, Dilios narrates to assembled Greeks near battlefield
    how 300 Spartans' sacrifice inspired Greek city-states to unite against Persia.
  id: s_24
  key_delta: Spartan sacrifice elevates to symbol of Greek unity and resistance.
  trigger_event: Dilios addresses and rallies Greeks on the battlefield edge.
- description: Greek coalition under Spartans now number 40,000 and prepare to charge
    against Persian army at the decisive Battle of Plataea.
  id: s_25
  key_delta: Greek united front formed, setting stage for turning the tide against
    Persia.
  trigger_event: Dilios leads charge of allied Greek forces against Persians.
