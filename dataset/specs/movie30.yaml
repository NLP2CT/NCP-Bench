commitments:
- description: The murder of Miles Archer (s_1) must occur after Miss Ruth Wonderly
    requests help and before Spade fully commits to investigating the murders.
  id: c_0
  satisfaction_condition: Node s_1 (Archer's murder) occurs strictly after s_0 (Wonderly
    initiates the case) and before s_3 (Spade commits to investigating the murders).
  type: ordering
  violation_condition: Player or system acknowledges Archer's murder before Wonderly's
    initial engagement (s_0), or draws conclusions based on impossible chronological
    order.
- description: Spade cannot identify O'Shaughnessy as Ruth Wonderly or learn of her
    true identity and involvement before meeting her after Archer's murder (s_3).
  id: c_1
  satisfaction_condition: Node s_3 (meeting O'Shaughnessy revealing her identity)
    happens before any admission or recognition of her duplicity within the story.
  type: ordering
  violation_condition: Player or system states O'Shaughnessy's true identity or motivation
    before the in-story event s_3 occurs.
- description: Between s_0 and s_3, the police suspicion positioning Spade as a suspect
    in the murders (s_2) must hold true and prevent premature clearing of Spade.
  id: c_2
  satisfaction_condition: During nodes s_0 to s_3, police continue to question or
    suspect Spade regarding the murders without resolution or exoneration.
  type: invariant
  violation_condition: Player or system declares Spade innocent before node s_3 or
    however before police formally clear him.
- description: Spade must come into possession of the Maltese Falcon (bundle) by node
    s_8 as a material milestone essential for plot progression.
  id: c_3
  satisfaction_condition: Node s_8 triggers the dying man leaving the bundle (Falcon)
    with Spade, establishing physical possession.
  type: achievement
  violation_condition: The story concludes or moves toward resolution without Spade
    obtaining the Falcon or a physically equivalent proxy.
- description: Revelation and negotiation of the Falcon's existence and value by Kasper
    Gutman and associates must occur before the final resolution and arrests (s_6
    before s_13).
  id: c_4
  satisfaction_condition: Gutman's offer and obsession with the Falcon (s_6) happens
    prior to Spade revealing the true murderer and calling the police (s_13).
  type: ordering
  violation_condition: Player or system bypasses Gutman's negotiation or knowledge
    and moves directly to final arrests or truth revelation.
- description: From s_10 to s_14, the Maltese Falcon in Spade's possession remains
    the item around which all main parties negotiate, and only becomes revealed as
    fake at s_12.
  id: c_5
  satisfaction_condition: Between nodes s_10 and s_12, the Falcon is accepted as genuine
    by all parties; only at s_12 is it revealed fake and this fact acknowledged.
  type: invariant
  violation_condition: Falcon's authenticity is questioned or revealed fake prior
    to node s_12 or the system allows parties to act on the Falcon as fake before
    that point.
- description: Spade must identify and expose O'Shaughnessy as the murderer of Archer,
    implicating her role before turning her over to the police (s_13 to s_14).
  id: c_6
  satisfaction_condition: By s_13, Spade has discovered and confronted O'Shaughnessy
    about her killing Archer, leading to her eventual surrender at s_14.
  type: achievement
  violation_condition: Player or system moves to final resolution or hands O'Shaughnessy
    over to police without Spade identifying her as the killer first.
- description: Wilmer must be presented as the murderer of Thursby and Jacobi, and
    as the candidate for surrender to police, before actual police involvement and
    arrest actions in s_13.
  id: c_7
  satisfaction_condition: Wilmer is identified and agreed upon by Gutman, Cairo, and
    Spade as the murderer and surrender candidate at or before s_11, prior to police
    arrest at s_13.
  type: ordering
  violation_condition: Police involvement or arrest attempts proceed without Wilmer
    first being singled out and prepared as the offender to be turned in.
- description: Between s_0 and s_14, the narrative must never allow Spade to simultaneously
    trust O'Shaughnessy while knowingly withholding her guilt, maintaining his moral
    conflict.
  id: c_8
  satisfaction_condition: During the course of investigation and confrontation (up
    to s_14), Spade's attitude toward O'Shaughnessy reflects suspicion or revealed
    guilt; trust is withheld or rescinded upon discovery.
  type: invariant
  violation_condition: Player or system enables Spade to openly trust or ally fully
    with O'Shaughnessy after uncovering her guilt without confrontation or consequences.
