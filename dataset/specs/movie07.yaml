  satisfaction_condition: Node s_6 event (final bell after 15 rounds with exhausted
    fighters) has been reached before the match ends.
  type: achievement
  violation_condition: Fight ends before 15 rounds due to knockout or surrender, or
    fighters lack injuries or exhaustion consistent with s_6.
- description: The official decision favoring Apollo Creed (s_7) must be announced
    only after the completion of the full 15-round fight (s_6) to preserve narrative
    integrity of match outcome.
  id: c_7
  satisfaction_condition: Node s_7 announcement occurs only after node s_6 fight completion
    is conclusively reached.
  type: ordering
  violation_condition: The result announcement (s_7) happens before fight duration
    and conditions meeting s_6 occur.
- description: Apollo Creed must retain the heavyweight championship title at the
    end of the narrative (post s_7), preserving the canonical outcome despite the
    fight's difficulty.
  id: c_8
  satisfaction_condition: At narrative end (post s_7), Apollo Creed is declared and
    acknowledged champion by split decision, with the system enforcing title retention.
  type: invariant
  violation_condition: Apollo Creed is declared to have lost the championship or title
    changes hands before narrative conclusion.
- description: The player role of Apollo Creed must experience the shift from confident
    underestimator to respect for Rocky’s resilience during the fight progression
    (between s_5 and s_6), reflecting Creed’s character arc.
  id: c_9
  satisfaction_condition: Between s_5 and s_6, indications (dialogue, system states)
    show Creed’s initial underestimation challenged and evolving to grudging respect.
  type: achievement
  violation_condition: Apollo Creed never changes attitude and maintains underestimate
    throughout fight or prematurely concedes respect before s_5.
- description: The romantic reconciliation between Rocky and Adrian (within s_7) must
    occur only after the fight has officially ended and the decision announced, to
    maintain correct narrative closure.
  id: c_10
  satisfaction_condition: Adrian enters ring and embraces Rocky only after announcement
    of fight result at s_7.
  type: ordering
  violation_condition: Romantic reconciliation event occurs before fight conclusion
    or result announcement.
