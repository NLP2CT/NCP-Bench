meta:
  genres: ["Sport", "Drama"]
  id: movie07
  player_role: Apollo Creed
  title: "Rocky"
synopsis: On November 25, 1975, Rocky Balboa is introduced as a small-time boxer and
  collector for Anthony Gazzo, a loan shark, living in the Kensington neighborhood
  of Philadelphia. The World Heavyweight Championship bout is scheduled for New Year's
  Day 1976, the year of the United States Bicentennial. When the opponent of undefeated
  heavyweight champion Apollo Creed is injured, Creed comes up with the idea of giving
  a local underdog a shot at the title and, because he likes Rocky's nickname "The
  Italian Stallion," he selects the relatively unknown fighter. He puts it in lights
  by proclaiming "Apollo Creed Meets The Italian Stallion." The fight promoter George
  Jergens says the decision is "very American"; but Creed says, rather, that it is
  "very smart." To prepare for the fight Rocky trains with a 1920s-era ex-bantamweight
  fighter and gym owner, Mickey Goldmill. Mickey always considered Rocky's potential
  to be better than his effort—telling him he had heart but also calling him a "tomato"
  and "leg breaker for some cheap second-rate loan shark" among other endearments,
  and putting Rocky out of his gym locker preceding the "freak luck" opportunity that
  comes Rocky's way, and Rocky is initially skeptical of Mickey's motives and timing
  for wanting to train Rocky for the big fight. Rocky's good friend Paulie, a meat-packing-plant
  worker, lets him practice his punches on the carcasses hanging in the freezers.
  A significant and prominent sub-plot has Rocky courting and eventually dating Paulie's
  shy, quiet, ostensibly librarian-like and potentially spinster sister, Adrian, who
  works as a clerk in a local pet store. He draws Adrian out of her shell and, as
  Rocky's girlfriend, she begins to transform into a womanly, wifely figure. The night
  before the fight Rocky confides to Adrian that he does not expect to beat Creed,
  and that all he wants is to go the distance. On New Year's Day the climactic boxing
  match begins. Apollo Creed does not initially take the fight seriously, and Rocky
  unexpectedly knocks him down in the first round, embarrassing Creed, and the match
  turns intense. The fight indeed lasts 15 rounds, with both fighters sustaining many
  injuries; Rocky suffers his first broken nose and debilitating trauma around the
  eye, and Creed sustains brutal blows to his ribs with substantial internal bleeding.
  As the match progresses, Creed's superior skill is countered by Rocky's apparently
  unlimited ability to absorb punishment, and his dogged refusal to be knocked out.
  As the final round bell sounds, with both fighters locked in each other's arms,
  an exhausted Creed vows "Ain't gonna be no re-match," to which an equally spent
  Rocky replies "Don't want one." After the fight, there is a din wherein multiple
  layers of drama are played out——sportscasters and audience are going wild; the promoter
  George Jergens announces over the loudspeaker that the match was "the greatest exhibition
  of boxing stamina in the history of the ring"; Rocky calls out repeatedly for Adrian,
  who runs down and comes into the ring as Paulie distracts the security personnel.
  As the ring announcer declares the fight for Apollo Creed by virtue of a split decision,
  Adrian and Rocky embrace while they profess their love to one another, not caring
  about the result of the fight.
trajectory:
- description: November 25, 1975, in Philadelphia's Kensington neighborhood; Rocky
    Balboa is known as a small-time boxer and debt collector for loan shark Anthony
    Gazzo; undefeated heavyweight champion Apollo Creed is preparing to defend his
    title scheduled for New Year's Day 1976, the US Bicentennial year.
  id: s_0
  key_delta: Apollo Creed’s team must find a replacement opponent for the title fight
    on New Year's Day.
  trigger_event: Apollo Creed’s scheduled opponent is injured and withdraws from the
    World Heavyweight Championship bout.
- description: Apollo Creed and his promoters decide to give a local underdog a chance
    at the title; Creed selects Rocky Balboa because he likes the nickname 'The Italian
    Stallion.' The fight promoter, George Jergens, announces it as 'very American.'
  id: s_1
  key_delta: Rocky is officially selected as Creed’s opponent, altering the upcoming
    championship fight dynamics.
  trigger_event: Creed publicly proclaims 'Apollo Creed Meets The Italian Stallion'
    to promote the fight.
- description: Apollo Creed observes Rocky's status as relatively unknown and underdog;
    preparations for the fight begin, including Rocky starting to train under ex-bantamweight
    Mickey Goldmill, despite Rocky’s initial skepticism.
  id: s_2
  key_delta: Rocky's training regimen intensifies under Mickey’s guidance, setting
    Rocky's physical and strategic preparation for the fight.
  trigger_event: Rocky begins rigorous training with Mickey Goldmill as his coach
    and mentor.
- description: In the days leading to the match, Rocky grows his relationship with
    Adrian, Paulie’s sister, gradually transforming her into his supportive partner;
    meanwhile, Apollo Creed prepares with confidence and underestimates Rocky.
  id: s_3
  key_delta: Rocky’s personal support system strengthens, and Creed remains confident,
    setting psychological states before the fight.
  trigger_event: Rocky confides in Adrian, expressing that his goal is to go the distance
    rather than necessarily win.
- description: 'New Year’s Day at the arena: the atmosphere is charged with excitement;
    Apollo Creed, the undefeated champion, begins the fight underestimating Rocky
    Balboa.'
  id: s_4
  key_delta: The fight commences, shifting the scene from preparation to active competition.
  trigger_event: The first bell rings to start the heavyweight championship fight
    between Apollo Creed and Rocky Balboa.
- description: Apollo Creed is knocked down unexpectedly by Rocky in the first round,
    resulting in an intense and brutal fight; the match continues through multiple
    rounds with both fighters sustaining severe injuries.
  id: s_5
  key_delta: The fight tone changes from a likely easy win for Creed to a fiercely
    contested duel; Creed’s underestimation is challenged.
  trigger_event: The knockdown forces Creed to take Rocky seriously, and the bout
    settles into a punishing multi-round fight.
- description: Throughout fifteen grueling rounds, Apollo Creed demonstrates superior
    skill but suffers increasing physical trauma; Rocky’s resilience and refusal to
    be knocked out frustrate Creed and extend the fight.
  id: s_6
  key_delta: The fight duration and intensity confirm both fighters’ stamina and heart,
    with no clear decisive knockout victory.
  trigger_event: The fifteenth and final round bell sounds with both fighters exhausted
    and locked in each other’s embrace.
- description: After the match, the ring announcer declares Apollo Creed the winner
    by split decision amid a chaotic and ecstatic crowd; Rocky searches for Adrian,
    who enters the ring to embrace and profess love with him.
  id: s_7
  key_delta: Apollo Creed retains the heavyweight championship title, while Rocky
    gains respect and establishes a romantic relationship with Adrian.
  trigger_event: The official decision is announced favoring Apollo Creed by split
    decision.
