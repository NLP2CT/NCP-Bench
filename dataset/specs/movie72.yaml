commitments:
- description: Travis must begin his taxi driving routine before he can develop infatuation
    towards Betsy, to preserve narrative pacing and character development.
  id: c_0
  satisfaction_condition: Node s_1 (Travis notices Betsy) occurs only after node s_0
    (Travis starts night taxi driving).
  type: ordering
  violation_condition: Player attempts to initiate interaction or infatuation with
    Betsy before completing the taxi driving introduction phase (before s_0).
- description: Travis's infatuation with Betsy and his volunteering must precede his
    attempt to bond and subsequent offense at the sex film date.
  id: c_1
  satisfaction_condition: Node s_2 (coffee date and film watching) occurs only after
    s_1 (infatuation and volunteering).
  type: ordering
  violation_condition: Player triggers Betsy’s offense or rejection scenarios before
    having established initial infatuation and volunteering context (before s_1).
- description: Travis’s escalation towards violent thoughts and weapon acquisition
    must only occur after his social rejection and confiding thoughts to Wizard.
  id: c_2
  satisfaction_condition: Node s_4 (training and guns) only occurs after s_3 (confiding
    violent thoughts after rejection).
  type: ordering
  violation_condition: Player equips, trains, or uses weapons prior to experiencing
    Betsy’s rejection and confiding violent impulses (before s_3).
- description: Travis’s violent impulses, as expressed and shared to Wizard, must
    remain dismissed by Wizard until the narrative reaches escalation (after s_3).
  id: c_3
  satisfaction_condition: Wizard consistently dismisses Travis’s violent thoughts
    during and until node s_3.
  type: invariant
  violation_condition: Wizard acknowledges or encourages violent actions prior to
    s_3.
- description: Travis must cross the threshold from being a passive observer to active
    participant in violence by shooting the convenience store robber before narrative
    end.
  id: c_4
  satisfaction_condition: Node s_4 (shooting the robber) is triggered and resolves.
  type: achievement
  violation_condition: Narrative attempt to progress beyond s_4 without Travis having
    taken violent action in defense.
- description: Travis's intervention to help Iris must only initiate following his
    violent engagement and personal frustration, ensuring logical motivation.
  id: c_5
  satisfaction_condition: Node s_5 (Iris encounter and meeting) occurs only following
    s_4 (shooting the robber).
  type: ordering
  violation_condition: Player attempts to meet or intervene with Iris (s_5) before
    Travis has taken violent action against crime (before s_4).
- description: Travis’s militant transformation and planning of an assassination attempt
    must happen only after he commits to helping Iris and shows contemplations of
    death.
  id: c_6
  satisfaction_condition: Node s_6 (mohawk, letter, and rally attendance) occurs only
    after s_5 and s_6’s persuasion phase.
  type: ordering
  violation_condition: Player changes appearance to militant or attempts assassination
    rally (s_6, s_7) before establishing responsibility for Iris (s_5).
- description: Assassination attempt on Senator Palantine must precede the personal
    violent vendetta against Sport and brothel confrontation.
  id: c_7
  satisfaction_condition: Node s_7 (assassination attempt) occurs before s_8 (confrontation
    with Sport and brothel shootout).
  type: ordering
  violation_condition: Player attempts to confront Sport or initiate brothel violence
    (s_8) before the assassination attempt at the rally (s_7).
- description: The violent climax involving confrontation with Sport, brothel shootout,
    and Travis being wounded must occur before police arrest and resolution.
  id: c_8
  satisfaction_condition: Node s_8 (violent shootout) completes triggering subsequent
    police arrival.
  type: achievement
  violation_condition: Narrative attempts to proceed to interrogation, arrest, or
    media recognition without full resolution of violent confrontation.
- description: Travis must signal attempted suicide to police following the violent
    climax, marking the narrative turning point towards resolution.
  id: c_9
  satisfaction_condition: Node s_9 (Travis attempts suicide and is arrested) is triggered
    and completed.
  type: achievement
  violation_condition: Narrative reaches post-violent resolution stages without Travis
    signaling suicide attempt to authorities.
- description: Travis denies being a hero despite public/media acclaim, preserving
    his ambiguous emotional state during the narrative resolution phase.
  id: c_10
  satisfaction_condition: During and after s_10, Travis explicitly rejects hero status
    when confronted by Betsy and media narrative.
  type: invariant
  violation_condition: Player forces Travis to accept or affirm hero status post s_9
    and during s_10 interactions.
- description: Travis’s internal conflict or anxiety remains observable in his behavior
    (e.g., anxious glance in rearview mirror) after climax and during resolution.
  id: c_11
  satisfaction_condition: At s_10, system marks Travis as exhibiting ongoing internal
    tension or vigilance (e.g., rearview mirror glance).
  type: invariant
  violation_condition: Player causes Travis to exhibit calm, fully resolved emotional
    state with no hint of anxiety or tension post s_9 events.
