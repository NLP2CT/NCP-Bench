meta:
  genres: ["Drama", "Crime"]
  id: movie72
  player_role: Travis Bickle
  title: "Taxi Driver"
synopsis: Travis Bickle , an honorably discharged U.S. Marine, is a lonely and depressed
  man living in Manhattan, New York. He becomes a taxi driver in order to cope with
  chronic insomnia, driving passengers every night around the boroughs of New York
  City. He also spends time in seedy porn theaters and keeps a diary. Travis becomes
  infatuated with Betsy , a campaign volunteer for Senator Charles Palantine. After
  watching her through her office window, interacting with fellow worker Tom, Travis
  enters to volunteer as a pretext to talk to her and takes her out for coffee. On
  a later date he takes her to see a sex film, which offends her, so she goes home
  alone. His attempts at reconciliation by sending flowers are rebuffed so he berates
  her at the campaign office, before being kicked out by Tom. Travis confides in fellow
  taxi driver Wizard  about his thoughts, which are beginning to turn violent, but
  Wizard assures him that he will be fine. Disgusted by the street crime and prostitution
  that he witnesses through the city, Travis finds a focus for his frustration and
  begins a program of intense physical training. He buys guns from dealer Easy Andy  and
  constructs a sleeve gun to attach on his arm with which he practices drawing his
  weapons. One night, Travis enters a convenience store moments before a man attempts
  to rob it and shoots the robber. The shop owner  takes responsibility and Travis
  leaves. On another night, 12-year-old child prostitute Iris  enters Travis's cab,
  attempting to escape her pimp Matthew "Sport" . Sport drags Iris from the cab and
  throws Travis a crumpled twenty-dollar bill, which continually reminds him of her.
  Travis arranges to meet Iris and attempts to persuade her to quit prostitution.
  They meet again the next day for breakfast and Travis becomes obsessed with helping
  her return to her parents' home, sending her money to do so and a letter in which
  he states he will soon be dead. After shaving his head into a mohawk, Travis attends
  a public rally where he attempts to assassinate Senator Palantine, but Secret Service
  agents notice him and he flees. He returns to his apartment and then drives to the
  East Village, where he confronts Sport. Travis shoots him, then walks into Iris’
  brothel and shoots off the bouncer's fingers. After Sport shoots Travis in the neck,
  wounding him, Travis shoots him dead. Another thug appears and shoots Travis in
  the arm, but Travis reveals his sleeve gun and kills the thug. The bouncer continues
  to harass Travis, causing Travis to shoot him in the head and kill him. As a horrified
  Iris cries, Travis attempts suicide but, out of ammunition, resigns himself to a
  sofa until police arrive. When they do, he places his index finger against his temple
  gesturing the act of shooting himself. Recuperating, Travis receives a letter from
  Iris's parents who thank him for saving her and the media hail him as a hero. Travis
  then returns to his job and encounters Betsy as a fare. She discusses his newly
  found fame, but he denies being a hero and drops her off for free. He glances anxiously
  at an object in his rear view mirror as he drives away.
trajectory:
- description: Travis Bickle, an honorably discharged U.S. Marine, lives alone in
    a modest Manhattan apartment, struggling with chronic insomnia. The city outside
    is gritty, dark, and filled with crime and seedy elements like porn theaters.
    Travis has begun driving a taxi at night to cope with his sleeplessness, carrying
    a diary where he writes his thoughts.
  id: s_0
  key_delta: Travis has engaged in night taxi driving as a coping mechanism for insomnia
    and initiated his exposure to the nocturnal urban environment.
  trigger_event: Travis starts his first night shift as a taxi driver in New York
    City.
- description: Travis routinely drives passengers across New York City boroughs, frequenting
    porn theaters and writing in his diary. He is lonely and disconnected, with minimal
    interaction beyond night rides.
  id: s_1
  key_delta: Travis becomes infatuated with Betsy, shifting some of his attention
    from general alienation to this new focus.
  trigger_event: Travis notices Betsy, a campaign volunteer for Senator Palantine,
    through the window of her office while driving by.
- description: Travis volunteers at the Senator Palantine campaign office to be near
    Betsy and succeeds in securing a coffee date with her.
  id: s_2
  key_delta: Travis’s attempt to bond with Betsy results in offense to her, creating
    tension between them.
  trigger_event: Travis takes Betsy to see a sex film at a theater.
- description: After Betsy leaves offended from the film, Travis tries to reconcile
    by sending her flowers, which she rejects. At the campaign office, Travis confronts
    her but is kicked out by her coworker Tom.
  id: s_3
  key_delta: Travis shares his emerging violent impulses, showing verbal indication
    of internal agitation though Wizard dismisses the concern.
  trigger_event: Travis confides his violent thoughts to fellow taxi driver Wizard
    during a night shift.
- description: Disgusted by street crime and prostitution witnessed while driving,
    Travis commits to intense physical training and begins acquiring firearms, including
    a custom sleeve gun.
  id: s_4
  key_delta: Travis crosses a threshold from observer of crime to active participant
    by using lethal force in defense.
  trigger_event: Travis intervenes in a convenience store robbery by shooting the
    robber before police arrive.
- description: While working, Travis picks up 12-year-old child prostitute Iris, who
    tries to escape her pimp Sport but is dragged away. Travis is left with a crumpled
    twenty-dollar bill Sport throws to him.
  id: s_5
  key_delta: Travis takes responsibility for Iris's welfare, initiating direct intervention
    in her life.
  trigger_event: Travis arranges a meeting to talk with Iris and attempts to persuade
    her to quit prostitution.
- description: Travis and Iris meet for breakfast and have further discussions about
    her leaving prostitution. Travis sends her money and a letter indicating he plans
    to die soon.
  id: s_6
  key_delta: Travis adopts a militant appearance signaling a shift toward violent
    action and attends a major political event.
  trigger_event: Travis shaves his head into a mohawk and attends a public rally for
    Senator Palantine.
- description: At the rally, Travis attempts to assassinate Senator Palantine but
    is spotted by Secret Service agents and flees the scene.
  id: s_7
  key_delta: Travis escalates his violence from a political attack to a personal vendetta
    against crime figures.
  trigger_event: Travis returns to his apartment and then drives to the East Village
    to confront Sport.
- description: Travis shoots Sport and enters the brothel where Iris works, shooting
    the bouncer's fingers, then is wounded in the neck by Sport before shooting him
    dead. Additional attackers shoot Travis, but he kills them using his sleeve gun,
    including the bouncer.
  id: s_8
  key_delta: A violent shootout concludes with Travis wounded and multiple deaths,
    including the pimp and criminal bouncers.
  trigger_event: Police arrive at the scene after the violent confrontation in the
    brothel.
- description: Travis attempts suicide but is out of ammunition and waits on a sofa
    until police arrest him. He gestures the action of shooting himself to the officers.
  id: s_9
  key_delta: Travis gains recognition for his actions from Iris's family and the media,
    who portray him as a hero.
  trigger_event: Travis recuperates in hospital and receives a letter from Iris’s
    parents thanking him for saving her.
- description: Travis returns to work driving his taxi, where he encounters Betsy
    again as a passenger. They talk briefly about his newfound fame, which Travis
    denies, and he drops her off without charging her fare.
  id: s_10
  key_delta: Travis maintains ambiguous emotional state and possible ongoing internal
    conflict after violent events and newfound public perception.
  trigger_event: Travis glances anxiously at an object in his rearview mirror as he
    drives away from Betsy.
