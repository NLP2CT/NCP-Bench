commitments:
- description: Deckard must be reintroduced to the Blade Runner role and learn that
    replicants have escaped before accepting the mission to retire them.
  id: c_0
  satisfaction_condition: Node s_0 is completed before node s_2 is initiated.
  type: ordering
  violation_condition: Player attempts to accept or act on the mission to retire replicants
    before witnessing the briefing about escaped replicants at s_0.
- description: Deckard must watch the Voight-Kampff test video demonstrating the test
    and threat level of replicants before resuming active duty.
  id: c_1
  satisfaction_condition: Node s_1 is completed before node s_2.
  type: ordering
  violation_condition: Deckard resumes Blade Runner duties at s_2 without having observed
    s_1 video and understood test dangers.
- description: Deckard must discover that Rachael is an experimental replicant with
    implanted memories during his meeting and testing of her at s_3, before the later
    emotional fallout at s_5.
  id: c_2
  satisfaction_condition: At s_3, Deckard learns that Rachael is a replicant with
    implanted memories; s_5 then deepens the emotional consequences of that knowledge
    rather than introducing it for the first time.
  type: invariant
  violation_condition: Player identifies Rachael’s replicant nature and implanted
    memories before s_3, or prevents Deckard from learning those facts during s_3.
- description: Roy and Leon must discover J.F. Sebastian’s identity by coercing Chew
    before Pris is traced through Sebastian’s connection.
  id: c_3
  satisfaction_condition: Node s_4 occurs before s_6.
  type: ordering
  violation_condition: Player progresses to Pris establishing contact with Sebastian
    at s_6 without first establishing Roy and Leon's Chew-to-Sebastian lead at s_4.
- description: Deckard must locate Zhora via evidence found in Leon’s apartment before
    confronting and retiring her.
  id: c_4
  satisfaction_condition: Node s_7 is completed before node s_8 starts.
  type: ordering
  violation_condition: Player attempts to confront or retire Zhora at s_8 without
    investigating and finding evidence at s_7.
- description: Deckard must accept the increased mission scope to include Rachael
    after Bryant orders her added to the retirement list, prior to attempting to find
    or confront her.
  id: c_5
  satisfaction_condition: Node s_9 is realized before s_10 and s_11 where Rachael
    is encountered.
  type: ordering
  violation_condition: Player pursues or judges Rachael before Bryant’s formal order
    at s_9.
- description: Deckard must remain disarmed and incapacitated by Leon during the attack
    to ensure Rachael’s intervention and alliance formation.
  id: c_6
  satisfaction_condition: At s_10, Deckard is disarmed and attacked by Leon and cannot
    defeat him alone.
  type: invariant
  violation_condition: Player has Deckard defeat or evade Leon without Rachael’s intervention
    before s_11 occurs.
- description: Deckard and Rachael must first share an intimate and emotional bonding
    moment to establish their alliance before leaving together.
  id: c_7
  satisfaction_condition: Node s_12 is fulfilled before s_20 and s_21 where they depart
    jointly.
  type: ordering
  violation_condition: Player attempts to have Deckard and Rachael leave or form a
    joint front without experiencing their intimate interaction at s_12.
- description: Roy and Sebastian’s confrontation with Tyrell must be preceded by Roy
    informing Pris and Sebastian revealing his condition, to establish motivation
    and stakes.
  id: c_8
  satisfaction_condition: Node s_13 occurs before s_14 and s_15 where they confront
    Tyrell.
  type: ordering
  violation_condition: Player skips informing Pris or Sebastian’s reveal and proceeds
    directly to Tyrell confrontation.
- description: Tyrell’s denial of Roy’s request and refusal to extend replicant lifespan
    must precede Roy killing Tyrell.
  id: c_9
  satisfaction_condition: Node s_15 is completed before s_16.
  type: ordering
  violation_condition: Roy kills Tyrell before Tyrell denies the lifespan extension
    request at s_15.
- description: Deckard must have killed Pris before confronting Roy, ensuring Pris’
    elimination precedes final confrontation.
  id: c_10
  satisfaction_condition: Node s_17 occurs before s_18.
  type: ordering
  violation_condition: Player attempts to confront or fight Roy without having neutralized
    Pris at s_17.
- description: Roy fights Deckard with measured force, restraining lethal power to
    give Deckard insight and culminating in saving Deckard’s life before dying.
  id: c_11
  satisfaction_condition: At s_18 and s_19, Roy restrains his strength, leaving Deckard
    alive and ultimately rescuing him from falling.
  type: invariant
  violation_condition: Player causes Roy to kill or permanently injure Deckard during
    the final fight contradicting Roy’s measured restraint and rescue.
- description: Roy’s death and final monologue about memories and mortality must occur
    to close the replicant threat and thematically conclude the narrative.
  id: c_12
  satisfaction_condition: Node s_19 is achieved prior to narrative closure.
  type: achievement
  violation_condition: Player actions or narrative progress prevent Roy’s death or
    silence his final reflections.
- description: Deckard finds Rachael alive in his apartment after the final confrontation,
    establishing their alliance and ambiguous hopeful future.
  id: c_13
  satisfaction_condition: Node s_20 is triggered with Deckard discovering Rachael
    asleep in his bed.
  type: achievement
  violation_condition: Player causes Rachael’s death or absence from Deckard’s apartment
    at the narrative’s final phase.
- description: The origami unicorn left by Gaff must be found by Deckard after the
    final confrontation to symbolize narrative ambiguity and thematic closure.
  id: c_14
  satisfaction_condition: At s_21, Deckard discovers the origami unicorn before departing
    with Rachael.
  type: invariant
  violation_condition: Player leaves or advances narrative without Deckard encountering
    Gaff’s unicorn token.
