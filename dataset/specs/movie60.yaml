meta:
  genres: ["Sci-Fi", "Thriller"]
  id: movie60
  player_role: Rick Deckard
  title: "Blade Runner"
synopsis: In Los Angeles, November 2019, retired police officer Rick Deckard is detained
  by officer Gaff and brought to meet with his former supervisor, Bryant. Deckard,
  whose job as a "Blade Runner" was to track down bioengineered beings known as replicants
  and "retire" them, is told by Bryant that several have escaped and come to Earth
  illegally. As Tyrell Corporation Nexus-6 models, they have only a four-year lifespan,
  and may have come to Earth to try to extend their lives. Deckard watches a video
  of another Blade Runner named Holden administering a "Voight-Kampff" test designed
  to distinguish replicants from humans based on their empathic response to questions.
  The subject of the test, Leon, shoots Holden. Bryant wants Deckard to return to
  work to retire Leon and three other replicants—Roy Batty, Zhora and Pris. Deckard
  refuses, but after Bryant makes an overt threat, he reluctantly agrees. Sent to
  the Tyrell Corporation to ensure that the test works on Nexus-6 models, Deckard
  discovers that Tyrell's assistant Rachael is an experimental replicant who believes
  herself to be human; Rachael's consciousness has been enhanced with false memories
  to provide an "emotional cushion". As a result, a more extensive test is required
  to determine if she is a replicant. Trying to find a way to meet with Tyrell, Roy
  and Leon go to the eye-manufacturing laboratory of Chew, forcing him to divulge
  the identity of J.F. Sebastian, a gifted designer who works closely with Tyrell.
  Rachael visits Deckard at his apartment to prove her humanity by showing him a family
  photo. Dropping the photo to the floor, Rachael leaves in tears after Deckard tells
  her that her memories are only implants taken from a real person. Sent by Roy, Pris
  meets and gains the confidence of Sebastian at his apartment, where he lives with
  manufactured companions. While searching Leon's apartment, Deckard finds a photo
  of Zhora, and a synthetic snake scale that leads him to a strip club where Zhora
  works. Deckard retires Zhora, and shortly after is told by Bryant to add Rachael,
  who has disappeared from the Tyrell Corporation headquarters, to his list of retirements.
  Deckard spots Rachael in a crowd but is disarmed and attacked by Leon, who saw him
  kill Zhora. Rachael kills Leon using Deckard's gun, and the two return to Deckard's
  apartment, where he promises not to hunt her. Later they share an intimate moment;
  Rachael then tries to leave, but Deckard seduces her. Arriving at Sebastian's apartment,
  Roy tells Pris the others are dead. Sympathetic to their plight, Sebastian reveals
  that because of a genetic disorder that accelerates his aging, his life will also
  be cut short. Under a pretext, Sebastian and Roy gain entrance into Tyrell's secure
  penthouse, where Roy demands more life from his maker. Told that this has proved
  to be impossible, Roy confesses that he has done "questionable things". Tyrell dismisses
  Roy's guilt, praising Roy's advanced design and his accomplishments. Responding
  "Nothing the god of biomechanics wouldn't let you into heaven for", Roy kisses Tyrell,
  then kills him. Sebastian runs for the elevator followed by Roy, who rides the elevator
  down alone. Upon entering Sebastian's apartment, Deckard is ambushed by Pris, but
  manages to kill her just as Roy returns. Roy fights Deckard without using his full
  strength against him. Eventually Deckard is hanging from a rooftop. Just as he is
  about to fall, Roy saves him. His life ending, Roy delivers a monologue on how his
  memories are about to be lost and dies in front of Deckard, who watches silently.
  Gaff arrives and, referring to Rachael, shouts to Deckard "It's too bad she won't
  live, but then again, who does?" Deckard returns to his apartment to find Rachael
  alive and sleeping in his bed; as they leave, Deckard finds a small tin-foil unicorn,
  a calling card left by his origami-making partner Gaff. Depending on the version,
  Deckard and Rachael either leave the apartment block to an uncertain future, or
  drive through an idyllic pastoral landscape.
trajectory:
- description: In a Los Angeles police office, retired Blade Runner Rick Deckard is
    detained by officer Gaff and brought to meet his former supervisor, Bryant. The
    atmosphere is tense and bureaucratic, with an undercurrent of urgency about replicants
    having escaped to Earth.
  id: s_0
  key_delta: Deckard is reintroduced to the Blade Runner role and learns that Nexus-6
    replicants have escaped and need to be 'retired'.
  trigger_event: Deckard is summoned by Bryant and shown a briefing about replicants
    having come illegally to Earth.
- description: Bryant shows Deckard a video of Holden administering a Voight-Kampff
    empathy test to Leon, which ends with Leon shooting Holden. The office is charged
    with the demonstration of the test's dangers and necessity.
  id: s_1
  key_delta: Deckard understands the ruthless reality of dealing with replicants and
    the use of the empathy test as a detection tool.
  trigger_event: Bryant threatens Deckard and orders him back into service to retire
    the escaped replicants.
- description: Back in Bryant's office, Deckard reluctantly agrees to return to active
    duty to retire Leon, Roy Batty, Zhora, and Pris after Bryant threatens him.
  id: s_2
  key_delta: Deckard officially resumes his Blade Runner duties, committing to hunt
    down the four replicants.
  trigger_event: Bryant's overt threat persuades Deckard to accept the assignment
    despite his refusal.
- description: At the Tyrell Corporation headquarters, Deckard meets Rachael, Tyrell's
    assistant, in a sterile and high-tech environment. She demonstrates ambiguous
    human traits, challenging Deckard's assumptions.
  id: s_3
  key_delta: Deckard realizes Rachael is a replicant with false memories, complicating
    the Blade Runner empathy test process.
  trigger_event: Deckard meets Rachael and learns she is an experimental replicant
    with implanted memories.
- description: Roy and Leon visit Chew's eye lab and force him to reveal the identity
    of J.F. Sebastian, a genetically afflicted designer who works closely with Tyrell.
  id: s_4
  key_delta: Roy and Leon gain a new lead toward Tyrell through Sebastian, preparing
    the route that later connects Pris to him.
  trigger_event: The narrative focus then shifts back to Deckard when Rachael comes
    to his apartment and challenges what he has learned about her memories.
- description: Rachael visits Deckard’s apartment and shows him a family photo as
    proof of her humanity. The atmosphere is private and emotionally charged.
  id: s_5
  key_delta: Deckard confirms Rachael’s implanted memories are not real, deepening
    his understanding of her condition.
  trigger_event: Rachael displays the family photo to Deckard before leaving upset
    upon his revelation.
- description: Pris meets and gains the trust of Sebastian at his cluttered and lonely
    apartment filled with artificial companions, seeking a safe place.
  id: s_6
  key_delta: Pris secures an ally and refuge in Sebastian, linking replicants directly
    to Tyrell’s designer.
  trigger_event: Pris approaches Sebastian and forms a bond with him.
- description: Deckard searches Leon's apartment, finding a photo of Zhora and evidence
    leading him to her workplace in a bustling strip club environment.
  id: s_7
  key_delta: Deckard locates Zhora's whereabouts, advancing his hunt.
  trigger_event: Deckard discovers a synthetic snake scale and photo in Leon's apartment,
    leading to Zhora.
- description: Deckard confronts and retires Zhora in the strip club amid hostile
    and chaotic surroundings.
  id: s_8
  key_delta: One replicant, Zhora, is eliminated, narrowing the targets.
  trigger_event: Deckard engages Zhora and successfully retires her.
- description: Bryant orders Deckard to add Rachael, who has disappeared from Tyrell,
    to his retirement list, increasing pressure in a tense office environment.
  id: s_9
  key_delta: Deckard is tasked with retiring an experimental replicant who has fled,
    heightening the mission’s complexity.
  trigger_event: Bryant directs Deckard to pursue Rachael after her disappearance.
- description: Deckard spots Rachael in a crowded urban area but is unexpectedly attacked
    and disarmed by Leon, escalating danger in a public setting.
  id: s_10
  key_delta: Deckard is incapacitated by Leon, demonstrating replicants’ aggressiveness
    and threat level.
  trigger_event: Leon assaults Deckard after recognizing him from the Zhora incident.
- description: Rachael retrieves Deckard's gun and kills Leon, then they retreat to
    Deckard's apartment, sharing a fragile and complex alliance.
  id: s_11
  key_delta: Deckard and Rachael form an uneasy partnership after Leon's death.
  trigger_event: After Leon's death, Deckard and Rachael return to his apartment
    and are left alone together.
- description: Deckard and Rachael share an intimate moment in his apartment reflecting
    trust and vulnerability; Rachael attempts to leave but is persuaded to stay.
  id: s_12
  key_delta: A personal and emotional bond is established between Deckard and Rachael.
  trigger_event: Deckard seduces Rachael, preventing her departure from his apartment.
- description: At Sebastian's apartment filled with synthetic companions, Roy informs
    Pris of the deaths, and Sebastian reveals his own limited lifespan due to genetic
    disease.
  id: s_13
  key_delta: Sebastian’s role as a sympathetic insider with a fatal condition is revealed,
    linking replicants’ desperation for life extension.
  trigger_event: Roy arrives at Sebastian's apartment and discusses recent events
    with Pris.
- description: Roy and Sebastian gain entrance to Tyrell's secure penthouse under
    a pretext in a high-security corporate setting.
  id: s_14
  key_delta: Roy confronts Tyrell directly, escalating the conflict to its source.
  trigger_event: Roy confronts Tyrell face to face and demands more life.
- description: Roy demands more life from Tyrell, who reveals the impossibility of
    extending replicants’ lifespans, dismissing Roy's guilt.
  id: s_15
  key_delta: The fundamental limitation of replicants’ lifespan is confirmed, intensifying
    Roy's desperation.
  trigger_event: Tyrell denies Roy’s request to extend his life.
- description: Roy kills Tyrell in the penthouse, a violent and climactic act amid
    the cold corporate environment.
  id: s_16
  key_delta: The Tyrell Corporation’s founder is dead, removing the creator figure
    from the narrative.
  trigger_event: Roy murders Tyrell after their confrontation.
- description: Deckard returns to Sebastian's apartment and is ambushed by Pris, but
    manages to kill her just as Roy returns, setting a tense and dangerous confrontation
    scene.
  id: s_17
  key_delta: Pris is eliminated, leaving Roy as the last replicant target.
  trigger_event: Pris attacks Deckard, who kills her in self-defense.
- description: Roy fights Deckard using measured force, ultimately leaving him hanging
    from a rooftop in a life-threatening situation.
  id: s_18
  key_delta: Deckard’s life is at risk, demonstrating Roy’s superior strength tempered
    with restraint.
  trigger_event: Roy subdues Deckard and leaves him dangling from a ledge.
- description: At the rooftop, Roy saves Deckard from falling, delivers a monologue
    about memories and mortality, and dies peacefully as dawn breaks over the cityscape.
  id: s_19
  key_delta: Roy’s death marks the end of the replicant threat; his final reflections
    highlight themes of memory and mortality.
  trigger_event: Roy rescues Deckard and then dies from his failing body.
- description: Gaff arrives at the scene, cryptically mentioning Rachael's uncertain
    fate. Deckard returns to his apartment, finding Rachael alive, resting in his
    bed as dawn light filters in.
  id: s_20
  key_delta: Deckard and Rachael form a united front, suggesting hope for their ambiguous
    future together.
  trigger_event: Deckard returns home to find Rachael sleeping in his bed.
- description: Deckard discovers Gaff’s origami unicorn, a symbolic and mysterious
    token left at his apartment as he and Rachael depart together. The environment
    transitions from urban to open pastoral scenery depending on the narrative version.
  id: s_21
  key_delta: Deckard leaves with Rachael after finding Gaff's unicorn, carrying the
    unresolved question of what Gaff knows about them.
  trigger_event: Deckard finds a tin-foil unicorn left by Gaff before leaving with
    Rachael.
