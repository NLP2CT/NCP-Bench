meta:
  genres: ["Action", "Drama"]
  id: movie84
  player_role: Commodus
  title: "Gladiator"
synopsis: In AD 180, General Maximus Decimus Meridius leads the Roman army to a decisive
  victory against Germanic tribes at Vindobona, ending a long war on the Roman frontier
  and earning the esteem of the elderly Emperor Marcus Aurelius. Though he has a son,
  Commodus, the dying emperor wishes to grant temporary leadership to Maximus, hoping
  eventually to return power to the Roman Senate. When his father tells him of the
  decision, Commodus, already bitter that Marcus favors Maximus over him, murders
  his father in a fit of rage and claims the throne. Maximus realizes the truth about
  Marcus' death, but is betrayed by his friend, General Quintus, who reluctantly instructs
  the Praetorian guards to carry out Commodus' order to execute Maximus and his wife
  and son. Maximus manages to escape, but is unable to return in time to save his
  family. After burying them, Maximus is found unconscious by slave traders and taken
  to Zucchabar, a Roman city in North Africa. There, he is bought by Proximo, and
  forced to fight for his life as a gladiator in arena tournaments. During this time,
  he befriends gladiators Juba, and Hagen. Juba tells Maximus to have faith that he
  will be reunited with his family in the afterlife. Maximus proves a fierce gladiator;
  with nothing left to live for, he is fearless in the arena. He ultimately reaches
  the prestigious Roman Colosseum, where his group is contracted to fight in a tribute
  to the Battle of Zama. Concealing his identity with a helmet, he skillfully leads
  a band of gladiators to defeat an opposing chariot and archer force, earning the
  crowd's praise. Forced to reveal himself to a stunned Commodus in the arena afterward,
  the crowd votes to spare his life, and Commodus, being obsessed with the people's
  approval, appeases them by doing so. Maximus later wins against the undefeated gladiator
  Tigris, as well as tigers released into the arena, yet refuses to obey Commodus'
  command to perform the coup de grâce. As a result, he is declared "Maximus the Merciful"
  by the crowd, increasing his popularity and further frustrating Commodus, who cannot
  kill Maximus without losing favor with the Roman people. Following the fight, Maximus
  is told by his former servant Cicero that his army is still loyal to him. Maximus
  then conspires with Commodus' sister Lucilla and the senator Gracchus to rejoin
  with his army and topple Commodus by force. Commodus, however, suspects his sister
  of betrayal and forces her to reveal the plot using veiled threats against her young
  son Lucius. During Maximus's attempted escape, Commodus' guards attack Proximo's
  gladiator school, killing Hagen and Proximo. Juba and the survivors are imprisoned,
  but Maximus makes it to the city walls, where he is captured after a failed attempt
  to save Cicero. Desperate to get Maximus out of the way and prove his own greatness,
  Commodus arranges a duel with him in the arena. Unknown to the crowd, Commodus stabs
  a restrained Maximus with a stiletto to gain advantage over him before they enter
  the arena. During the fight, Maximus manages to disarm Commodus, while Quintus disobeys
  the emperor's demand for his sword and commands his soldiers to do the same. Commodus
  then produces the hidden stiletto, but Maximus plunges the blade into Commodus'
  throat, killing him. With his dying words, Maximus carries out Marcus Aurelius'
  wishes, calling for Gracchus to be reinstated, the slaves to be freed, and power
  to be restored to the Senate. As he dies, Maximus reunites with his family in the
  afterlife. Lucilla then reiterates his wishes and honors his memory. Some time later,
  Juba buries Maximus' two small figurines of his wife and son in the ground where
  his friend Maximus died, promising to see him in the afterlife, "but not yet".
trajectory:
- description: In AD 180, Emperor Marcus Aurelius is elderly and ill, residing within
    the Roman imperial palace. General Maximus Decimus Meridius has just achieved
    a decisive victory over Germanic tribes at Vindobona. Commodus, Marcus Aurelius'
    son, is present at the palace, aware of his father's declining health and the
    ongoing war's end.
  id: s_0
  key_delta: Marcus Aurelius reveals his plan to appoint Maximus as temporary leader
    until power is returned to the Senate; Commodus learns he is effectively disinherited.
  trigger_event: Emperor Marcus Aurelius summons Commodus to disclose his decision
    to grant Maximus temporary leadership, bypassing Commodus.
- description: Inside the imperial palace, after hearing the emperor's decision, Commodus
    is alone with the emperor in a dimly lit chamber.
  id: s_1
  key_delta: Marcus Aurelius is dead by Commodus' hand; Commodus immediately claims
    the imperial throne.
  trigger_event: Commodus murders Emperor Marcus Aurelius in a sudden violent outburst.
- description: Commodus, now Emperor, commands loyalty from the Praetorian guards.
    Maximus is present in the city and comes to realize the true circumstances of
    Marcus Aurelius' death as Commodus moves against him.
  id: s_2
  key_delta: An official order for Maximus’ execution is given; Maximus becomes a
    target of imperial assassination.
  trigger_event: Commodus orders Maximus' execution; General Quintus, acting under
    duress, commands the Praetorian guards to carry out the order.
- description: At Maximus’ estate, soldiers arrive to arrest him and kill his family.
    Maximus fights back but is overwhelmed.
  id: s_3
  key_delta: Maximus’ immediate family is dead; Maximus survives but is now a hunted
    fugitive.
  trigger_event: Maximus escapes execution but finds his wife and son have been killed
    by the guards.
- description: Maximus lies unconscious in a rural area and is discovered by slave
    traders who transport him to Zucchabar in North Africa.
  id: s_4
  key_delta: Maximus’ status changes from fugitive general to enslaved gladiator trainee
    under Proximo’s ownership.
  trigger_event: Proximo purchases Maximus from the slave traders and brings him to
    the gladiator school.
- description: Inside the gladiator school arena in Zucchabar, Maximus trains and
    fights alongside other gladiators including Juba and Hagen.
  id: s_5
  key_delta: Maximus establishes himself as a fierce gladiator and gains alliances
    with other gladiators like Juba and Hagen.
  trigger_event: Maximus participates in gladiatorial fights and gains the respect
    of fellow gladiators and audiences.
- description: Maximus and his gladiator group arrive at the Roman Colosseum to perform
    in a tribute to the Battle of Zama. Commodus watches publicly as emperor while
    Maximus fights masked among the gladiators.
  id: s_6
  key_delta: Maximus’ identity remains hidden from Commodus, though he gains public
    acclaim from the crowd.
  trigger_event: Maximus fights masked to conceal his identity and leads the gladiators
    to a notable victory in the arena.
- description: In the Colosseum arena post-battle, Maximus is forced to reveal his
    identity to Commodus and the public.
  id: s_7
  key_delta: Maximus’ true identity is revealed to Commodus and the people, boosting
    his popularity; Commodus tolerates Maximus to maintain public favor.
  trigger_event: The crowd votes to spare Maximus’ life, demonstrating popular support.
- description: Within the Colosseum, Maximus defeats undefeated gladiator Tigris and
    wild tigers during a subsequent fight.
  id: s_8
  key_delta: Maximus gains the title 'Maximus the Merciful' and further public admiration;
    Commodus’ frustration grows as he cannot execute Maximus without losing favor.
  trigger_event: Maximus refuses to kill a defeated gladiator as ordered by Commodus.
- description: In the city, Maximus meets with his former servant Cicero who informs
    him that loyal soldiers remain within his army.
  id: s_9
  key_delta: A plan for rebellion against Commodus is set in motion involving Maximus,
    Lucilla, and Gracchus.
  trigger_event: Maximus and conspirators Lucilla and Gracchus plan to overthrow Commodus
    and restore the Senate.
- description: Commodus suspects betrayal from his sister Lucilla and coerces her
    to disclose the conspiracy details to him at the imperial palace.
  id: s_10
  key_delta: The conspiracy is compromised; Commodus gains foreknowledge of Maximus’
    rebellion.
  trigger_event: Commodus threatens Lucilla’s son, Lucius, leveraging him to expose
    the plot.
- description: At the gladiator school, Commodus’ guards attack, killing Proximo and
    Hagen, and imprisoning Juba and other gladiators.
  id: s_11
  key_delta: Maximus is captured by imperial forces; key allies are killed or imprisoned,
    weakening the rebellion.
  trigger_event: Maximus attempts to flee toward the city walls but is captured after
    a failed attempt to save Cicero.
- description: In the Colosseum arena, preparations for a duel between Commodus and
    Maximus take place. Commodus secretly wounds Maximus with a hidden stiletto before
    the fight.
  id: s_12
  key_delta: Maximus enters the duel physically impaired but determined; Commodus
    cheats by stabbing Maximus before combat.
  trigger_event: The duel between Commodus and Maximus begins in front of the assembled
    crowd.
- description: During the duel, Quintus disobeys Commodus’ orders and commands soldiers
    not to intervene. Maximus disarms Commodus after fierce combat.
  id: s_13
  key_delta: Commodus dies by Maximus’ hand, ending his reign; Quintus switches allegiance
    implicitly in this moment.
  trigger_event: Maximus uses the hidden stiletto to fatally wound Commodus.
- description: As Maximus lies dying in the arena, he speaks final commands to restore
    the Senate, free the slaves, and reinstate Gracchus.
  id: s_14
  key_delta: Power begins to shift according to Marcus Aurelius’ original plan; Maximus’
    death marks the end of conflict.
  trigger_event: Maximus dies in the arena; the crowd and Lucilla witness his last
    wishes.
- description: Post-battle, Lucilla publicly acknowledges Maximus’ wishes and honors
    his memory. Juba buries Maximus’ figurines of his wife and son at the site of
    his death.
  id: s_15
  key_delta: Maximus’ legacy is preserved by his allies; a symbolic closure to his
    story is established.
  trigger_event: Juba promises to reunite with Maximus in the afterlife in the future.
