commitments:
- description: Emperor Marcus Aurelius must be murdered by Commodus only after the
    decision to appoint Maximus as temporary leader is communicated.
  id: c_0
  satisfaction_condition: Node s_0 (Emperor's decision) occurs before or simultaneously
    with node s_1 (murder of Marcus Aurelius).
  type: ordering
  violation_condition: Player causes Marcus Aurelius' murder (s_1) to occur without
    prior or concurrent disclosure of the leadership decision (s_0).
- description: Maximus must not fully realize the truth of Marcus Aurelius’ murder
    until Commodus seizes the throne and orders Maximus’ execution at s_2.
  id: c_1
  satisfaction_condition: From s_0 through s_1, Maximus does not yet fully understand
    Marcus Aurelius’ death circumstances; by s_2, he realizes Commodus’ culpability
    as the execution order is issued.
  type: invariant
  violation_condition: Player action or narrative causes Maximus to fully realize
    Commodus' guilt before node s_2, or prevents that realization from occurring by
    the time s_2 unfolds.
- description: Maximus’ family must be killed by imperial order only after Commodus
    becomes emperor and orders Maximus' execution.
  id: c_2
  satisfaction_condition: Node s_2 (execution order) precedes node s_3 (Maximus’ family
    killed).
  type: ordering
  violation_condition: Player causes Maximus’ family to be killed before Commodus’
    formal execution order is established in s_2.
- description: Once Commodus assumes the throne, he commands loyalty of Praetorian
    guards including General Quintus; orders to execute Maximus are officially sanctioned
    by Commodus only.
  id: c_3
  satisfaction_condition: Between s_1 and s_3, execution orders targeting Maximus
    originate solely from Commodus' authority.
  type: invariant
  violation_condition: Execution or assassination attempts on Maximus are initiated
    without orders from Commodus during these nodes.
- description: Maximus must survive the execution attempt but lose his immediate family,
    resulting in his capture and enslavement.
  id: c_4
  satisfaction_condition: By node s_4, Maximus escapes death but is enslaved, and
    his wife and son are dead.
  type: achievement
  violation_condition: Player prevents the death of Maximus' immediate family or Maximus
    is killed before enslavement at s_4.
- description: Maximus’ transition from fugitive to gladiator owned by Proximo happens
    strictly after his escape and family loss.
  id: c_5
  satisfaction_condition: Node s_3 (family killed and Maximus escapes) occurs before
    s_4 (enslavement and purchase by Proximo).
  type: ordering
  violation_condition: Player triggers Maximus' gladiator ownership or training (s_4/s_5)
    before family death and escape (s_3).
- description: Maximus conceals his identity as a gladiator during initial public
    arena performances until forced to reveal himself in the Roman Colosseum.
  id: c_6
  satisfaction_condition: From s_5 through s_6, Maximus’ identity is unknown to Commodus
    and the public during arena fights.
  type: invariant
  violation_condition: Player exposes Maximus’ true identity to Commodus or crowd
    before s_7 (forced reveal).
- description: The public reveal of Maximus’ identity to Commodus and the crowd must
    occur after his victorious tribute battle at the Colosseum.
  id: c_7
  satisfaction_condition: Node s_6 (victory under concealment) precedes node s_7 (forced
    reveal and crowd vote).
  type: ordering
  violation_condition: Player causes public identification of Maximus before his arena
    victory at s_6.
- description: Maximus refuses to kill a defeated gladiator on Commodus’ order, thereby
    earning the crowd’s title 'Maximus the Merciful'.
  id: c_8
  satisfaction_condition: At node s_8, Maximus explicitly disobeys Commodus' command
    to kill, leading to increased public support.
  type: invariant
  violation_condition: Player obeys Commodus’ order to kill the defeated gladiator
    during s_8, negating the 'Merciful' title and popularity boost.
- description: A conspiracy to overthrow Commodus involving Maximus, Lucilla, and
    Gracchus must be formed following confirmation of loyal army remnants.
  id: c_9
  satisfaction_condition: By node s_9, Maximus, Lucilla, and Gracchus have actively
    planned rebellion against Commodus.
  type: achievement
  violation_condition: Player fails to initiate or confirm conspiracy after s_9 or
    bypasses this step entirely.
- description: Commodus must learn of the rebellion plot through coercion of Lucilla
    only after the conspiracy is established.
  id: c_10
  satisfaction_condition: Node s_9 (conspiracy formation) occurs before s_10 (Lucilla’s
    coerced betrayal).
  type: ordering
  violation_condition: Player triggers Commodus discovering plot details before the
    conspiracy exists at s_9.
- description: Attack on gladiator school and capture or death of key allies must
    occur only after Commodus learns of the rebellion and acts.
  id: c_11
  satisfaction_condition: From s_10 to s_11, the assault killing Proximo and Hagen
    and imprisoning survivors happens after knowledge of conspiracy.
  type: invariant
  violation_condition: Player arranges attack on gladiator school before s_10’s discovery
    of the conspiracy.
- description: Commodus cheats the duel by stabbing Maximus with a concealed weapon
    prior to their combat in the Colosseum arena.
  id: c_12
  satisfaction_condition: At s_12, Maximus is secretly wounded by Commodus before
    the duel begins.
  type: invariant
  violation_condition: Player allows the duel to start at s_12 without Commodus inflicting
    the hidden stiletto wound.
- description: Quintus must disobey Commodus to withhold soldiers’ intervention only
    during the duel, facilitating Maximus’ victory.
  id: c_13
  satisfaction_condition: Node s_12 (duel start) and s_13 (Quintus disobedience and
    duel outcome) occur sequentially without interruption.
  type: ordering
  violation_condition: Player causes soldier intervention or suppression of Quintus’
    disobedience before or during duel at s_13.
- description: Commodus’ death by Maximus’ hand in the duel must occur as the climax,
    marking an end to Commodus' reign.
  id: c_14
  satisfaction_condition: At s_13, Maximus successfully kills Commodus with the hidden
    stiletto during the duel.
  type: achievement
  violation_condition: Player allows Commodus to survive or kills Maximus first, violating
    the defined narrative outcome.
- description: Maximus must issue final commands to restore Senate authority, free
    slaves, and reinstate Gracchus before his death.
  id: c_15
  satisfaction_condition: At s_14, before dying in the arena, Maximus explicitly gives
    these final instructions.
  type: invariant
  violation_condition: Player causes Maximus to die without delivering the final commands
    at s_14.
- description: Maximus’ legacy is preserved through Lucilla’s public honoring and
    Juba’s burial ritual, symbolizing closure and ongoing hope.
  id: c_16
  satisfaction_condition: At s_15, Lucilla endorses Maximus’ wishes publicly and Juba
    buries Maximus’ figurines with a promise of future reunion.
  type: achievement
  violation_condition: Player prevents Lucilla’s public recognition or Juba’s burial
    and promise, undermining narrative closure at s_15.
