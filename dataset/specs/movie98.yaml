commitments:
- description: Prevent player from knowing or acting on the fact that Thao is pressured
    by the gang before catching him attempting to steal the Gran Torino (trigger event
    s_0).
  id: c_0
  satisfaction_condition: Node s_0 (Walt catching Thao stealing) has occurred before
    any player acknowledgment or action involving gang pressure on Thao.
  type: ordering
  violation_condition: Player accesses or acts on knowledge about Thao's gang coercion
    before s_0 is completed.
- description: Walt must reject moving to a retirement community and remain living
    alone with his dog throughout the narrative progression until his death at s_5.
  id: c_1
  satisfaction_condition: From s_0 through s_5, Walt does not relocate or permanently
    leave his house and continuously lives alone with his dog.
  type: invariant
  violation_condition: Player forces or causes Walt to move out of his home or abandon
    living alone prior to s_5.
- description: Thao can only begin working for Walt after Walt confronts and scares
    off the gang (s_1), establishing the forced relationship.
  id: c_2
  satisfaction_condition: Thao’s work-for-Walt arrangement is only enabled after s_1
    is achieved.
  type: ordering
  violation_condition: Player initiates or triggers Thao working for Walt before Walt
    confronts the gang and gains their respect.
- description: The gang’s violent retaliation against the Vang Lor family, including
    injuring Thao and assaulting his sister, must occur only after Walt escalates
    his intervention by attacking a gang member (between s_3 and s_4).
  id: c_3
  satisfaction_condition: Gang drive-by shooting and sister’s kidnapping occur strictly
    after s_3 event (Walt attacking gang member) has occurred.
  type: invariant
  violation_condition: Gang violence or retaliation against the family occurs before
    s_3 or without Walt’s intervention.
- description: Walt’s preparations (buying a suit, haircut, confession) and the act
    of locking Thao in the basement with the Silver Star must precede Walt’s solo
    confrontation of the gang (s_4 before s_5).
  id: c_4
  satisfaction_condition: Player completes Walt’s personal preparations and basement
    scene with Thao prior to initiating confrontation leading to Walt’s death.
  type: ordering
  violation_condition: Player triggers gang confrontation or Walt’s death before Walt
    completes these preparations and locks Thao away.
- description: Walt's confrontation with the gang is carried out unarmed, provoking
    the gang to shoot him, leading to his death; he never draws a real weapon during
    this confrontation in s_5.
  id: c_5
  satisfaction_condition: During confrontation, Walt simulates drawing a gun but actually
    has only a lighter, resulting in being shot dead without firing any weapon.
  type: invariant
  violation_condition: Player causes Walt to be armed and shoot gang members or fails
    to provoke gang shooting as designed.
- description: Thao and Sue’s liberation and arrival at the gang scene with the Gran
    Torino must occur after Walt’s death (s_5) and before police arrest announcement
    (s_6).
  id: c_6
  satisfaction_condition: Thao and Sue are freed and arrive at gang scene only after
    s_5 and before s_6 narration proceeds.
  type: ordering
  violation_condition: Player frees Thao or arrives at gang scene before Walt’s sacrificial
    death is completed.
- description: Walt’s last will must be read posthumously, transferring his house
    to the church and the Gran Torino to Thao, symbolizing legacy transfer to the
    community and Thao.
  id: c_7
  satisfaction_condition: After Walt’s funeral (s_6), the will is read explicitly
    specifying these bequests before narrative resolution.
  type: achievement
  violation_condition: Player or system bypasses the will reading or alters the intended
    distribution of Walt’s possessions at the narrative ending.
- description: The narrative must conclude with the scene of Thao driving the Gran
    Torino with Walt’s dog Daisy along Lakeshore Drive, symbolizing legacy continuation.
  id: c_8
  satisfaction_condition: Final narrative state (s_7) shows Thao driving with Daisy
    peacefully, marking story resolution.
  type: achievement
  violation_condition: Player or system prevents or skips this final scene or replaces
    it with incongruent outcomes.
- description: Walt’s emotional isolation and physical symptoms (coughing fits with
    blood) must persist and remain concealed from family from s_0 up to his death
    at s_5.
  id: c_9
  satisfaction_condition: Throughout s_0 to s_5, Walt’s health issues remain private,
    and family remain unaware.
  type: ordering
  violation_condition: Player actions cause Walt’s health issues to be admitted or
    exposed to family prior to s_5.
