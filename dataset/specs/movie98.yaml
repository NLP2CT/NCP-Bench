meta:
  genres: ["Drama", "Crime"]
  id: movie98
  player_role: Walt Kowalski
  title: "Gran Torino"
synopsis: Walt Kowalski, a gruff retired Polish American factory worker and war veteran,
  has recently been widowed after 50 years of marriage. His Highland Park neighborhood
  in Detroit, formerly populated by working-class white families, is now dominated
  by poor Asian immigrants, and gang violence is commonplace. Adding to the isolation
  he feels is the emotional detachment of his family. He rejects a suggestion from
  one of his sons to move to a retirement community, and lives alone with his dog.
  Walt suffers from coughing fits, occasionally coughing up blood, but conceals this
  from his family. A young Catholic priest tries to comfort him, but Walt disdains
  the young, inexperienced man. The Hmong Vang Lor family reside next door to Walt.
  Initially, he wants nothing to do with his new neighbors, particularly after he
  catches Thao Vang Lor, a member of that family, attempting to steal his Ford Gran
  Torino as a coerced initiation into a Hmong gang run by Thao's cousin, "Spider."
  The gang is infuriated and attacks Thao, but Walt confronts them with a rifle and
  chases them off, earning the respect of the Hmong community. As penance, Thao's
  mother makes him work for Walt, who has him do odd jobs around the neighborhood,
  and the two form a grudging mutual respect. Walt helps Thao get a job and gives
  him advice on dating. The gang continues to pressure Thao and again assaults him
  on his way home from work. Walt sees Thao's injuries and visits the gang members'
  house where he attacks a gang member. In retaliation, the gang performs a drive-by
  shooting on the Vang Lor home, injuring Thao, and kidnapping and raping his sister.
  The next day, Thao seeks Walt's help to exact revenge, who tells him to return later
  in the afternoon. In the meantime, Walt makes personal preparations——he buys a suit,
  gets a haircut and makes a confession to Father Janovich. When Thao returns, Walt
  takes him to the basement and gives him his Silver Star; Walt then locks Thao in
  his basement and tells him that he has been haunted by the memory of killing an
  enemy soldier and insists that Thao must never be haunted with the experience of
  killing another man. Walt then goes to the house of the gang members where they
  draw their weapons on him. He talks loudly, berating them and drawing the attention
  of the neighbors. Putting a cigarette in his mouth, he asks for a light; he then
  puts his hand in his jacket and provocatively pulls it out as if it is a gun, inciting
  the gang members to shoot and kill him. As he falls to the ground, his hand opens
  to reveal an army lighter——he was unarmed. Sue frees Thao and they drive to the
  scene in Walt's Gran Torino. A Hmong police officer tells them the gang will be
  arrested for murder and imprisoned for a long time. Walt's funeral Mass is celebrated
  by the young priest, Father Janovich, and attended by his family and many of the
  Hmong community. Afterward, his last will and testament is read, and to the surprise
  of his family, Walt leaves them nothing——his house goes to the church and his cherished
  Gran Torino to Thao. As the film ends, Thao is seen driving the car along Lakeshore
  Drive with Walt's dog, Daisy.
trajectory:
- description: Walt Kowalski lives alone in his Highland Park Detroit home, recently
    widowed, surrounded by a neighborhood transformed from working-class white families
    to predominantly poor Asian immigrants with frequent gang violence; Walt is emotionally
    isolated from his family and conceals his coughing fits, occasionally with blood.
  id: s_0
  key_delta: Walt now sees that Thao is acting under gang pressure, and his intervention
    makes him newly visible to the Hmong family next door.
  trigger_event: Walt catches Thao attempting to steal his Ford Gran Torino.
- description: After catching Thao trying to steal his car, Walt confronts and scares
    off the gang members who typically coerce Thao, earning respect from the Hmong
    community.
  id: s_1
  key_delta: Thao begins working for Walt, establishing a forced but burgeoning relationship
    between them.
  trigger_event: Thao's mother insists Thao work for Walt as penance.
- description: Thao works for Walt doing odd jobs, and Walt advises Thao about finding
    employment and managing personal life.
  id: s_2
  key_delta: The gang threat intensifies, leaving Thao visibly injured and dependent
    on Walt’s support.
  trigger_event: Thao is assaulted again by gang members after work.
- description: Walt observes Thao's injuries and escalates his intervention by attacking
    a gang member at their home.
  id: s_3
  key_delta: The gang's violent retaliation dramatically raises the stakes, severely
    impacting the Vang Lor family and pushing Walt toward decisive action.
  trigger_event: Gang retaliates with a drive-by shooting at the Vang Lor home, injuring
    Thao and kidnapping and raping his sister.
- description: Thao seeks Walt’s help to take revenge; Walt prepares himself by purchasing
    a suit, getting a haircut, and confessing to Father Janovich.
  id: s_4
  key_delta: Walt takes symbolic and practical steps to face the gang alone, distancing
    Thao from violent retaliation and foreshadowing Walt's self-sacrifice.
  trigger_event: Walt locks Thao in the basement and gives him his Silver Star medal
    before confronting the gang.
- description: Walt confronts the gang at their house, provoking them to shoot him
    by simulating drawing a gun while actually holding only a lighter, resulting in
    his death.
  id: s_5
  key_delta: Walt’s death incapacitates the local gang leadership and enables Thao’s
    liberation, shifting power away from the gang.
  trigger_event: Sue frees Thao from captivity and they arrive with the Gran Torino
    at the gang’s scene.
- description: Thao and Sue are freed; police inform them gang members will be arrested
    and imprisoned; Walt's funeral is held, attended by both family and the Hmong
    community.
  id: s_6
  key_delta: Walt’s posthumous actions redistribute his possessions, symbolizing a
    transfer of legacy and trust to Thao and the community.
  trigger_event: Walt's last will and testament is read, revealing Walt leaves his
    house to the church and his Gran Torino to Thao.
- description: Thao drives Walt’s Gran Torino with Walt’s dog, Daisy, along Lakeshore
    Drive, embodying the continuation of Walt’s legacy and the bonding between cultures.
  id: s_7
  key_delta: Resolution of Walt’s story thread with peaceful legacy transmission and
    hopeful future implied for Thao.
  trigger_event: Scene shown of Thao driving the car with Daisy.
