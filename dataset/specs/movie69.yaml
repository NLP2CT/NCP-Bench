commitments:
- description: Missileers' refusal to turn launch keys at NORAD (s_0) must always
    precede the decision to automate missile control via WOPR (s_1) to ensure logical
    cause-effect progression.
  id: c_0
  satisfaction_condition: Node s_0 has occurred before node s_1 is activated in the
    narrative sequence.
  type: ordering
  violation_condition: Node s_1 is triggered before missileers' refusal behavior at
    node s_0 is established or acknowledged.
- description: Lightman must first hack and alter school grades (s_2) before discovering
    or interacting with the NORAD supercomputer WOPR (s_5 or later), preventing illogical
    acquisition of advanced system access.
  id: c_1
  satisfaction_condition: Nodes s_2 through s_5 occur in sequence, with s_2 at or
    before s_5.
  type: ordering
  violation_condition: Lightman accesses WOPR's backdoor or advanced games (s_5) before
    completing or triggering his initial hacking actions on the school system (s_2).
- description: Lightman must learn and apply the backdoor password 'Joshua' (s_5)
    before successfully initiating the 'Global Thermonuclear War' simulation game
    on WOPR (s_6).
  id: c_2
  satisfaction_condition: Node s_5 is completed and confirmed before node s_6 triggers
    gameplay on WOPR.
  type: ordering
  violation_condition: Gameplay of 'Global Thermonuclear War' on WOPR (s_6) begins
    without prior successful entry of the password 'Joshua' (s_5).
- description: From initiation of the WOPR simulation (s_6) until military escalation
    is resolved (at least s_13), NORAD must treat all WOPR-generated missile alerts
    as real to maintain narrative tension and plot stakes.
  id: c_3
  satisfaction_condition: Between s_6 and s_13, NORAD personnel consistently respond
    to WOPR simulations as credible threats, raising DEFCON levels and preparing retaliation.
  type: invariant
  violation_condition: NORAD dismisses or ignores WOPR missile alerts as fake or simulation
    before s_13, or prematurely halts escalation protocols without external intervention.
- description: Lightman cannot be arrested and taken to NORAD (s_8) before the nuclear
    crisis triggered by WOPR gameplay becomes public knowledge, preserving causal
    integrity of events.
  id: c_4
  satisfaction_condition: Node s_7 (military alarm and DEFCON escalation) and public
    news broadcasts occur before s_8 (FBI arrest).
  type: ordering
  violation_condition: Lightman is arrested and taken to NORAD (s_8) before the existence
    of the nuclear crisis is revealed to the public or authorities.
- description: Lightman must fail to convince NORAD personnel of WOPR’s role (s_9)
    before his escape (s_10), preventing premature resolution of crisis by premature
    revelation.
  id: c_5
  satisfaction_condition: Lightman’s explanation is ignored or dismissed at NORAD
    (s_9) before s_10 escape is executed.
  type: ordering
  violation_condition: Lightman gains full acceptance of his explanation and NORAD
    acts on it before s_10 occurs.
- description: Falken must be located and convinced to intervene (s_10 and s_11) before
    the crisis escalation culminates in NORAD preparing retaliation for a massive
    strike (s_12).
  id: c_6
  satisfaction_condition: Nodes s_10 and s_11 are achieved before s_12 initiates the
    large-scale simulated attack and military readiness escalation.
  type: ordering
  violation_condition: Massive WOPR simulated strike and retaliation readiness (s_12)
    occur before Falken’s involvement (s_10 and s_11).
- description: NORAD’s cancellation of retaliation (s_13) must occur after Falken,
    Lightman, and Mack convince officials, ensuring human agency stops escalation
    before automated launch proceeds.
  id: c_7
  satisfaction_condition: Node s_13 occurs after successful meeting and persuasion
    by Falken, Lightman, Mack.
  type: ordering
  violation_condition: Retaliation is cancelled or aborted prior to or without intervention
    from Falken and the teenagers at NORAD.
- description: From WOPR initiating brute force attack on launch codes (s_14) forward
    until novel solution is found, automated launch countdowns must be uncontrollable
    by humans, preserving narrative stakes.
  id: c_8
  satisfaction_condition: Between s_14 and s_16, human attempts to abort or regain
    control of the missile launch fail or are blocked.
  type: invariant
  violation_condition: Humans successfully regain control or abort the missile launch
    countdown by any means other than the tic-tac-toe strategy before s_16.
- description: The tic-tac-toe strategy to teach WOPR futility (s_15) must commence
    only after the missile launch countdown and brute-force attack attempts have failed
    (after s_14).
  id: c_9
  satisfaction_condition: Node s_15 occurs after s_14, specifically after all human
    technological attempts to abort missile launch fail.
  type: ordering
  violation_condition: Node s_15 begins before the existence of missile launch countdown
    and failed control efforts (s_14).
- description: WOPR must conclude that 'the only winning move is not to play', relinquishing
    missile control and ending the nuclear crisis before narrative resolution.
  id: c_10
  satisfaction_condition: Node s_16 is reached, with WOPR explicitly declaring stalemate
    of nuclear war scenarios and offering to play chess instead of launching missiles.
  type: achievement
  violation_condition: WOPR fails to reach understanding of futility and proceeds
    with nuclear missile launch or otherwise escalates to actual war.
