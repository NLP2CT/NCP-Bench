commitments:
- description: DuPont cannot identify or accuse the traitor within the Grammaton Clerics
    before receiving intelligence and ordering a mission (s_0) to justify suspicion
    and covert operations.
  id: c_0
  satisfaction_condition: Node s_0 has been triggered establishing DuPont's awareness
    and initiation of traitor investigation.
  type: ordering
  violation_condition: Player triggers traitor identification or accusation events
    prior to the occurrence of s_0.
- description: Surveillance and suspicion on Preston must only escalate after DuPont
    directs Brandt to observe him under the pretext of loyalty tests (from s_1 to
    s_7).
  id: c_1
  satisfaction_condition: Between nodes s_1 and s_7, any observation or interrogation
    of Preston by Brandt or DuPont aligns with the established surveillance plan.
  type: invariant
  violation_condition: Preston is surveilled or confronted without DuPont’s directive
    or outside the context of Brandt’s involvement before s_1 or after s_7.
- description: Preston’s emotional instability and deviance must only be officially
    noted after DuPont receives the relevant reports and orders Preston’s interrogation
    (triggered at s_2).
  id: c_2
  satisfaction_condition: Node s_2 has occurred and Preston’s changed behavior is
    acknowledged and justified by DuPont.
  type: ordering
  violation_condition: Preston’s emotional deviation is acted upon or publicly confronted
    by DuPont or others before s_2.
- description: Preston must be detained and interrogated only under DuPont’s direct
    orders and within the timeframe of s_3 to s_5 to maintain narrative coherence
    of controlled containment.
  id: c_3
  satisfaction_condition: Arrest and interrogation actions against Preston occur exclusively
    under DuPont’s orders and during nodes s_3 to s_5.
  type: invariant
  violation_condition: Preston is detained or interrogated without DuPont’s authorization
    or outside of the s_3 to s_5 temporal bounds.
- description: The staging of Brandt’s false arrest and the summoning of Preston to
    meet ‘Father’ must strictly occur after Preston’s arrest and interrogation (s_4),
    serving as a narrative trap.
  id: c_4
  satisfaction_condition: Node s_4’s trigger event of orchestrating Brandt’s ruse
    and summoning Preston occurs only after s_3.
  type: ordering
  violation_condition: Brandt’s staged arrest or Preston’s meeting with ‘Father’ happen
    before Preston’s arrest/interrogation has taken place.
- description: DuPont’s dual identity as ‘Father’ and his secret collection of illicit
    art and literature must be revealed during the meeting with Preston (s_5) before
    narrative escalation.
  id: c_5
  satisfaction_condition: Node s_5 event of revealing DuPont as Father and exposing
    his secret defiance has been triggered.
  type: achievement
  violation_condition: DuPont’s true identity or secret defiance is revealed to Preston
    or player before s_5.
- description: During the confrontation and gun kata combat from s_5 through s_7,
    Brandt must act as DuPont’s loyal agent, and the full scope of DuPont’s taunting
    about emotion must be actively present.
  id: c_6
  satisfaction_condition: From s_5 to s_7, Brandt’s allegiance remains with DuPont;
    taunts on emotional cost occur as scripted during combat.
  type: invariant
  violation_condition: Brandt betrays DuPont prematurely or emotional taunts are missing
    or replaced before s_7’s completion.
- description: DuPont must be killed by Preston only after the full ideological and
    physical confrontation is realized (s_7), cementing the narrative climax and thematic
    resolution.
  id: c_7
  satisfaction_condition: Node s_7 event of Preston killing DuPont with explicit dialogue
    referencing emotional cost occurs.
  type: achievement
  violation_condition: DuPont is killed or removed from power before the ideological
    confrontation and taunt exchange of s_7.
- description: The destruction of propaganda systems and the initiation of the Underground’s
    uprising must only take place after DuPont’s death at s_7 (trigger s_8), ensuring
    logical causality in regime collapse.
  id: c_8
  satisfaction_condition: Node s_8 triggers the coordinated assault and destruction
    only after s_7 is complete.
  type: ordering
  violation_condition: Resistance uprising and key facility destruction are initiated
    before DuPont’s death.
- description: The narrative must conclude with Preston observing the revolution’s
    unfolding and experiencing emotional awakening (s_9) following the regime’s fall.
  id: c_9
  satisfaction_condition: Node s_9 event occurs with Preston holding O’Brien’s ribbon
    and smiling, symbolizing hope and transformation.
  type: achievement
  violation_condition: The narrative ends or transitions without this final reflective
    moment for Preston and the symbolic closure.
