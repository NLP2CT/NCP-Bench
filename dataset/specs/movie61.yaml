meta:
  genres: ["Sci-Fi", "Action"]
  id: movie61
  player_role: Dupont
  title: "Equilibrium"
synopsis: Libria is governed by the Tetragrammaton Council, which is led by a reclusive
  figurehead known as "Father". Father never interacts with anyone directly, but he
  is seen on giant video screens throughout the city. The Tetragrammaton Council uses
  the police to enforce conformity. At the pinnacle of Librian law enforcement are
  the Grammaton Clerics, who are trained in the martial art of gun kata. The Clerics
  raid the "Nether" region outside the city, where they destroy emotionally stimulating
  materials such as art, books and music, executing the people hiding them. Despite
  their efforts, a resistance movement, known as the "Underground", has emerged. John
  Preston is a high ranking Grammaton Cleric and a widower with two children whose
  wife, Viviana, was executed for "Sense Offense". After a raid, Preston notices his
  partner, Errol Partridge, taking a book of poems instead of incinerating them. Realizing
  Partridge is keeping the book, Preston tracks him down and executes him. Before
  he dies, Partridge says that all the consequences of feeling are a "cost he would
  pay gladly". The next morning Preston accidentally breaks his daily vial of Prozium,
  and as he does not have an immediate replacement he begins to experience emotions.
  Upon gaining replacement vials, he decides against taking them and instead hides
  them behind the mirror in his bathroom. Preston is partnered with career-conscious
  Brandt. Together, they arrest Mary O'Brien, for sense offense. Preston's emotional
  confusion is exacerbated during her interrogation. Without Prozium Preston finds
  it difficult keeping an emotionless facade in front of his son and his suspicious
  partner. Preston forges an emotional connection with O'Brien and he feels remorse
  for killing Partridge, especially after he finds out that Partridge and O'Brien
  were lovers. He eventually contacts the Resistance and is then summoned before Vice-Counsel
  DuPont who reveals there is a traitor in the clerics. DuPont tells him to exterminate
  the Resistance and to find the traitor. The Resistance convinces him to assassinate
  Father to start a revolution. They plan to disrupt Prozium production which will
  then lead to an uprising by the populace. After Preston fails to stop Mary O'Brien's
  execution he is caught having an emotional breakdown by Brandt, who arrests him
  and brings him before the Vice-Counsel. After tricking DuPont into believing that
  Brandt is the real traitor, Preston rushes home to destroy the hidden vials of unused
  Prozium, but finds that his son - who reveals that he stopped taking Prozium after
  his mother died - has already destroyed the unused vials. As planned, the leaders
  of the Resistance are captured and Preston is granted an exclusive audience with
  Father. Father actually turns out to be DuPont, who replaced the original Father
  after his death. Preston goes on a rampage, fighting his way to DuPont's office,
  which is filled with artwork and ornate furniture, all illegal items. It is revealed
  that Brandt was not arrested but was part of a ruse to expose Preston. It also becomes
  clear that DuPont does not take Prozium and has been reading poetry. DuPont taunts
  him, asking Preston how it felt to betray the Underground. Preston kills all of
  DuPont's bodyguards, and defeats Brandt in a katana battle. Preston and DuPont finally
  fight in a gun kata battle in which Preston wins. DuPont tries to convince Preston
  to spare him, asking if taking his life is worth the emotion of knowing he killed
  someone who is "feeling" and knows how beautiful life can be. Preston repeats Partridge's
  last words and announces that he gladly will pay the cost, shooting DuPont in the
  chest. He then destroys the propaganda communication control systems, freezing all
  of the indoctrination propaganda everyone had been subjected to all their lives.
  The Underground blows up the Prozium manufacturing and storage facilities, while
  scores of rebels successfully attack key points throughout the city. Preston quietly
  watches the overthrow of the government from DuPont's office, holding O'Brien's
  red ribbon and smiling.
trajectory:
- description: DuPont operates as Vice-Counsel within the Tetragrammaton Council.
    The city of Libria is tightly controlled under the Council's rule, with 'Father'
    as the reclusive figurehead. The Grammaton Clerics enforce law through violent
    raids, maintaining the use of Prozium to suppress emotions. The underground resistance
    exists but is not directly confronted by DuPont yet.
  id: s_0
  key_delta: DuPont's awareness of internal threats within the enforcement body is
    established, setting the stage for covert manipulations.
  trigger_event: DuPont receives intelligence regarding a possible traitor within
    the Grammaton Clerics and orders a mission to identify and eliminate the threat.
- description: DuPont organizes a covert plan with Brandt to monitor Preston and
    expose the true cleric traitor while preserving the appearance of internal loyalty
    testing. Political intrigue within the Council intensifies.
  id: s_1
  key_delta: Surveillance on Preston is escalated, embedding Brandt as a key operative
    in DuPont's strategy.
  trigger_event: DuPont directs Brandt to intensify surveillance on John Preston under
    the guise of loyalty tests.
- description: DuPont receives reports of Preston’s emotional instability and unexpected
    resistance to standard protocols after his Prozium supply is interrupted.
  id: s_2
  key_delta: Preston's deviation from expected behavior is officially noted, justifying
    further watchfulness and potential disciplinary actions.
  trigger_event: DuPont instructs an interrogation of Preston about his loyalty and
    secret behaviors.
- description: DuPont presides over Preston’s interrogation, maintaining an authoritative
    and suspicious demeanor while reviewing Preston’s emotional breakdown captured
    by Brandt.
  id: s_3
  key_delta: Preston is temporarily neutralized as a variable, while DuPont prepares
    to manipulate the situation to his advantage.
  trigger_event: DuPont orders the temporary arrest and containment of Preston pending
    further investigation.
- description: DuPont executes a ruse by 'arresting' Brandt for treason, concealing
    Brandt's true role as his loyal agent to further manipulate Preston.
  id: s_4
  key_delta: The trap is set with Preston lured into a controlled meeting, consolidating
    DuPont’s control.
  trigger_event: DuPont summons Preston under pretext to meet 'Father' for a confidential
    audience.
- description: DuPont reveals himself as the true 'Father,' having succeeded the original
    figurehead. His office is filled with illicit art and forbidden literature, evidencing
    his secret defiance of Council doctrine.
  id: s_5
  key_delta: DuPont’s dual identity as both a political leader and a clandestine figure
    embracing emotion is exposed; battle erupts signaling the collapse of established
    order.
  trigger_event: Preston confronts DuPont/Father, initiating a violent altercation
    within the office.
- description: Amidst gun kata combat, DuPont taunts Preston about the 'cost' of emotion.
    Brandt reappears revealing his true allegiance to DuPont, escalating the fight's
    intensity.
  id: s_6
  key_delta: The last loyal forces to DuPont are eliminated; the ultimate ideological
    confrontation unfolds.
  trigger_event: DuPont and Preston engage in a final duel after Brandt’s defeat.
- description: Preston kills DuPont in gun kata battle, decisively ending DuPont’s
    reign. DuPont questions if sparing him would mean accepting the emotional weight
    of killing a 'feeling' man.
  id: s_7
  key_delta: DuPont’s death irrevocably ends the Council’s secretive internal rule
    by the false Father; the emotional revolution is symbolically affirmed.
  trigger_event: Preston executes DuPont, affirming his commitment to emotional truth.
- description: With DuPont dead, Preston destroys the propaganda communication systems,
    halting the city-wide indoctrination. Simultaneously, the Underground initiates
    a coordinated uprising, including destruction of Prozium facilities and attacks
    on strategic targets.
  id: s_8
  key_delta: The authoritarian regime is dismantled; systemic emotional suppression
    infrastructure is neutralized.
  trigger_event: Explosions and rebellions erupt throughout the city as the resistance
    takes advantage of the power vacuum.
- description: The city of Libria begins to fall into revolutionary chaos. Preston
    watches from the former Father’s office, holding O’Brien’s red ribbon and smiling
    subtly in a moment of emotional awakening and hope.
  id: s_9
  key_delta: The legacy of emotional repression is destroyed; a new era of emotional
    freedom dawns following DuPont’s death and the collapse of the regime.
  trigger_event: Preston observes the unfolding revolution, signaling the end of his
    journey and the start of societal transformation.
