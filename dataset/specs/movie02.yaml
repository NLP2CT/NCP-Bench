commitments:
- description: The golden idol must be retrieved in the Peruvian temple (s_0) before
    Indiana is confronted and surrenders it to Belloq (s_1).
  id: c_0
  satisfaction_condition: Node s_0 occurs strictly before node s_1 in the narrative
    progression.
  type: ordering
  violation_condition: Player actions or system responses acknowledge surrendering
    the idol to Belloq (s_1) before Indiana has retrieved it (s_0).
- description: Indiana cannot possess the golden idol and be simultaneously outside
    the temple environment before escaping on the seaplane (between s_0 and s_2).
  id: c_1
  satisfaction_condition: Indiana’s possession of the idol only occurs inside the
    temple up to s_1; by s_2 he no longer has the idol and is outside the temple on
    the seaplane.
  type: invariant
  violation_condition: The system acknowledges Indiana holding the idol while also
    showing he has escaped the temple zone before s_2.
- description: Indiana’s fear of snakes must only be revealed after escaping the temple
    on the seaplane (at s_2).
  id: c_2
  satisfaction_condition: Snakes fear revelation occurs no earlier than node s_2.
  type: ordering
  violation_condition: Player triggers or system admits knowledge of Indiana’s snake
    fear before node s_2.
- description: Indiana must be informed by Army intelligence about the Nazi interest
    in occult artifacts and Abner Ravenwood only after returning to the United States
    (s_3).
  id: c_3
  satisfaction_condition: Node s_3 takes place after escape from the temple and before
    any information about Nazis or Ravenwood is acknowledged.
  type: ordering
  violation_condition: System reveals Nazi occult pursuit or Ravenwood’s involvement
    before Indiana’s interview by agents at s_3.
- description: Indiana can only start active pursuit of the headpiece in Nepal after
    receiving the intelligence briefing (after s_3 but enforced at s_4).
  id: c_4
  satisfaction_condition: Node s_4 occurs after s_3 and before acquisition of the
    headpiece conversations.
  type: ordering
  violation_condition: Player obtains or uses the headpiece without the prior intelligence
    briefing at s_3 and deployment to Nepal at s_4.
- description: The negotiation and purchase offer for the headpiece by Indiana to
    Marion must precede the Nazi tavern attack and headpiece seizure attempt (s_5
    before s_6).
  id: c_5
  satisfaction_condition: Node s_5 strictly precedes s_6; negotiation terms are established
    before the raid.
  type: ordering
  violation_condition: Nazi raid on the tavern at s_6 is acknowledged before any prior
    negotiation or agreement at s_5.
- description: The Nazis do not possess the original headpiece prior to the tavern
    raid (between s_5 and s_6), but hold only a forged replica in Cairo (from s_7).
  id: c_6
  satisfaction_condition: Headpiece possession by Nazis is marked only by a replica
    at node s_7 onwards, not before s_6.
  type: invariant
  violation_condition: Nascent acknowledgment or NPC dialogue grants Nazis possession
    of the authentic headpiece prior to s_7.
- description: Marion’s apparent death in the bazaar explosion must occur after arrival
    in Cairo and before the deduction of the Nazis' error locating the Well of Souls
    (s_8 before s_9).
  id: c_7
  satisfaction_condition: Events at nodes s_7 and s_8 happen before s_9, with Marion’s
    presumed death establishing urgency.
  type: ordering
  violation_condition: Player or system recognizes or explores Well of Souls correction
    before seeing Marion’s disappearance in s_8.
- description: Indiana must successfully deduce the correct location of the Well of
    Souls based on the headpiece markings before entering it (completion of s_9 prerequisite
    for s_10).
  id: c_8
  satisfaction_condition: Node s_9 concluded with successful location deduction prior
    to entering the Well of Souls in s_10.
  type: achievement
  violation_condition: Indiana enters or interacts with the Well of Souls environment
    without prior correct location identification at s_9.
- description: Indiana cannot acquire the Ark of the Covenant before battling the
    hostile snake environment inside the Well of Souls (s_10).
  id: c_9
  satisfaction_condition: Ark possession by Indiana is registered only after the snake
    confrontation at s_10.
  type: invariant
  violation_condition: System states or player obtains Ark possession bypassing the
    snake challenge prior to s_10.
- description: Indiana and Marion must be captured and sealed in the Well by Nazis
    only after Indiana acquires the Ark (s_10 before s_11).
  id: c_10
  satisfaction_condition: Node s_11 occurs strictly subsequent to Ark acquisition
    at s_10.
  type: ordering
  violation_condition: Player or system events show Indiana and Marion captured and
    sealed before the Ark is obtained.
- description: Escape from the Well and reclaiming exclusive Ark control requires
    nodes s_11 and s_12 to follow in sequence.
  id: c_11
  satisfaction_condition: Node s_12 (pursuit and regaining Ark) occurs after the escape
    and freedom restoration of s_11.
  type: ordering
  violation_condition: Ark is reclaimed or Nazi shipment prevented (s_12) prior to
    Indiana and Marion’s escape from the Well (s_11).
- description: Transporting the Ark away from active conflict zones aboard the tramp
    steamer happens only after the Ark is secured in Cairo (s_12 before s_13).
  id: c_12
  satisfaction_condition: Node s_13 event of boarding steamer with the Ark strictly
    follows Ark recovery and control in s_12.
  type: ordering
  violation_condition: Ark transport by steamer is initiated before Indiana has secured
    it in s_12.
- description: Nazis hijack the steamer and recapture Marion and the Ark only after
    Indiana and Marion have embarked on the transport (s_13 before s_14).
  id: c_13
  satisfaction_condition: Node s_14 hijack event happens strictly after s_13 boarding.
  type: ordering
  violation_condition: Hijack or recapture events at s_14 precede steamer boarding
    at s_13.
- description: The ceremonial opening of the Ark by Belloq and Nazi leaders happens
    only after Indiana infiltrates the U-boat and arrives at the isolated island (s_14
    before s_15).
  id: c_14
  satisfaction_condition: Node s_15 occurs strictly after Indiana’s infiltration at
    s_14.
  type: ordering
  violation_condition: Ark opening ceremony at s_15 occurs before Indiana’s pursuit
    and infiltration of the Nazi U-boat at s_14.
- description: Indiana must warn Marion to close her eyes before the supernatural
    entities emerge from the opened Ark (between s_15 and s_16).
  id: c_15
  satisfaction_condition: Directive to close eyes is delivered immediately prior to
    the Ark’s opening manifestations at s_16.
  type: invariant
  violation_condition: Supernatural events are acknowledged or player witnesses them
    without prior warning given to Marion.
- description: The Ark’s divine wrath must destroy the Nazi personnel and Belloq during
    the ceremonial opening, ending their threat (conclusion of s_16).
  id: c_16
  satisfaction_condition: Killing of Nazi soldiers and Belloq by Ark’s supernatural
    forces occurs during s_16.
  type: achievement
  violation_condition: The Ark’s opening ceremony results in survival or successful
    escape of the Nazis and Belloq.
- description: The Ark’s secure confiscation and storage by U.S. Army intelligence
    and removal from Indiana’s control happens only after the supernatural events
    conclude (s_16 before s_17).
  id: c_17
  satisfaction_condition: Node s_17 occurs strictly after all Ark-related supernatural
    events at s_16 have concluded.
  type: ordering
  violation_condition: Ark is stored by government or declared safe prior to or during
    the supernatural manifestations in s_16.
