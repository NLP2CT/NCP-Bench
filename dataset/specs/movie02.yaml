meta:
  genres: ["Adventure", "Action"]
  id: movie02
  player_role: Indiana Jones
  title: "Raiders of the Lost Ark"
synopsis: In 1936, archaeologist Indiana Jones braves an ancient Peruvian temple filled
  with booby traps to retrieve a golden idol. Upon fleeing the temple, Indiana is
  confronted by rival archaeologist René Belloq and the indigenous Hovitos. Surrounded
  and outnumbered, Indiana is forced to surrender the idol to Belloq and escapes aboard
  a waiting Waco seaplane, in the process revealing his fear of snakes. Shortly after
  returning to the college in the United States where he teaches archaeology, Indiana
  is interviewed by two Army intelligence agents. They inform him that the Nazis,
  in their quest for occult power, are searching for his old mentor, Abner Ravenwood,
  who is the leading expert on the ancient Egyptian city of Tanis and possesses the
  headpiece of an artifact called the Staff of Ra. Indiana deduces that the Nazis
  are searching for Tanis because it is believed to be the location of the Ark of
  the Covenant, the biblical chest built by the Israelites to contain the fragments
  of the Ten Commandments; the Nazis believe that if they acquire it, their armies
  will become invincible. The Staff of Ra, meanwhile, is the key to finding the Well
  of Souls, a secret chamber in which the Ark is buried. The agents subsequently authorize
  Indiana to recover the Ark before the Nazis. Indiana travels to Nepal, only to find
  that Ravenwood has died and that the headpiece is in the possession of his daughter,
  Marion, Indiana's embittered former lover. Indiana offers to buy the headpiece for
  three thousand dollars, plus two thousand more when they return to the United States.
  Marion's tavern is suddenly raided by a group of thugs commanded by Nazi agent Toht.
  The tavern is burned down in the ensuing fight, during which Toht burns his hand
  on the searing hot headpiece as he tries to grab it. Indiana and Marion escape with
  the headpiece, with Marion declaring she will accompany Indiana in his search for
  the Ark so he can repay his debt. They travel to Cairo where they learn from Indiana's
  friend Sallah, a skilled excavator, that Belloq and the Nazis, led by Colonel Dietrich,
  are currently digging for the Well of Souls with a replica of the headpiece modeled
  after the scar on Toht's hand. In a bazaar, Nazi operatives attempt to kidnap Marion
  and as Indiana chases after them it appears that she dies in an explosion. While
  deciphering the markings on the headpiece, Indiana and Sallah realize that the Nazis
  have miscalculated the location of the Well of Souls. Using this to their advantage,
  they infiltrate the Nazi dig and use the Staff of Ra to determine the location correctly
  and uncover the Well of Souls, which is filled with snakes. Indiana fends off the
  snakes and acquires the Ark, but Belloq, Dietrich and the Nazis arrive to take it.
  They toss Marion into the well with Indiana and seal them in, but they manage to
  escape. After a fistfight with a giant Nazi mechanic, blowing up a flying wing on
  the airstrip, and chasing down a convoy of trucks, Indiana takes back the Ark before
  it can be shipped to Berlin. Indiana and Marion leave Cairo to escort the Ark to
  England on board a tramp steamer. The next morning, their boat is boarded by Belloq,
  Dietrich and the Nazis, who once again steal the Ark and kidnap Marion. Indiana
  stows away on their U-boat and follows them to an isolated island in the Aegean
  Sea where Belloq plans to test the power of the Ark before presenting it to Hitler.
  Indiana reveals himself and threatens to destroy the Ark with a rocket-propelled
  grenade launcher, but Belloq calls his bluff, knowing Indy cannot bear to eradicate
  an important historical artifact. Indiana surrenders and is tied to a post with
  Marion as Belloq performs a ceremonial opening of the Ark, which appears to contain
  nothing but sand. Suddenly, spirits resembling Old Testament Seraphim emerge from
  the Ark. Aware of the supernatural danger of looking at the opened Ark, Indiana
  warns Marion to close her eyes. The apparitions suddenly morph into "angels of death",
  and lightning bolts begin flying out of the Ark, gruesomely killing the Nazi soldiers,
  while Belloq, Dietrich and Toht meet even more gruesome fates. The fires rise into
  the sky, then fall back down to Earth and the Ark closes with a crack of thunder.
  Back in Washington, D.C., the Army intelligence agents tell a suspicious Indiana
  and Brody that the Ark "is someplace safe" to be studied by "top men". In reality,
  the Ark is sealed in a wooden crate labeled "top secret" and stored in a giant government
  warehouse filled with countless similar crates.
trajectory:
- description: Inside an ancient Peruvian temple, Indiana Jones cautiously navigates
    a dimly lit stone chamber riddled with deadly booby traps aiming to retrieve a
    golden idol placed on a pedestal.
  id: s_0
  key_delta: Indiana possesses the golden idol, shifting from outsider to target within
    the temple environment.
  trigger_event: Indiana Jones retrieves the golden idol from its pedestal.
- description: Indiana rushes through the temple corridors after taking the idol,
    confronted at the temple exit by rival archaeologist René Belloq and indigenous
    Hovitos surrounding him.
  id: s_1
  key_delta: Indiana loses physical possession of the idol to Belloq and escapes the
    temple environment.
  trigger_event: Indiana is compelled to surrender the golden idol to Belloq when
    outnumbered.
- description: Aboard a Waco seaplane flying away from the Peruvian jungle, Indiana
    Jones recuperates but reveals a fear of snakes during his escape.
  id: s_2
  key_delta: Indiana escapes the immediate danger of the temple and its inhabitants
    but is marked by a revealed personal weakness.
  trigger_event: The seaplane departs from the temple area to return Indiana to the
    United States.
- description: At the college campus in the United States where Indiana teaches, two
    Army intelligence agents interview him in a secured office regarding Nazis' occult
    pursuits.
  id: s_3
  key_delta: Indiana learns of the Nazi interest in Norse artifact expertise and the
    Staff of Ra’s significance from intelligence sources.
  trigger_event: The Army intelligence agents meet with Indiana to discuss the Nazi
    search for Abner Ravenwood.
- description: Indiana, now informed about the Staff of Ra and the location, prepares
    to travel to Nepal to find Abner Ravenwood’s headpiece, crucial for locating the
    Ark of the Covenant.
  id: s_4
  key_delta: Indiana moves from intellectual preparation to active pursuit of key
    artifact in Nepal.
  trigger_event: Indiana departs from the United States to Nepal on the mission to
    acquire the headpiece of the Staff of Ra.
- description: In a Nepalese tavern owned by Marion Ravenwood, Indiana negotiates
    the purchase of the headpiece while tensions simmer.
  id: s_5
  key_delta: The headpiece’s ownership and deal terms are established, linking Marion
    to the quest.
  trigger_event: Indiana offers Marion three thousand dollars for the headpiece of
    the Staff of Ra.
- description: Marion’s tavern is violently raided by Nazi thugs led by agent Toht,
    who attempts to seize the headpiece but burns his hand on it.
  id: s_6
  key_delta: The Nazis confirm their immediate pursuit of the headpiece; Indiana and
    Marion escape together with it.
  trigger_event: Nazi agents attack the tavern and try to grab the headpiece, which
    causes Toht’s injury.
- description: Indiana and Marion travel to Cairo, Egypt; Indiana meets Sallah, who
    informs them of Nazi and Belloq digging operations using a forged headpiece.
  id: s_7
  key_delta: Indiana gains local intelligence on Nazi activity and false artifacts,
    shifting strategic focus to the Well of Souls.
  trigger_event: Indiana and Marion arrive in Cairo and consult with Sallah regarding
    the ongoing Nazi excavations.
- description: At a crowded Cairo bazaar, Nazis attempt to kidnap Marion; an explosion
    seemingly results in her death during Indiana’s pursuit.
  id: s_8
  key_delta: Marion’s apparent death removes her immediate presence, intensifying
    Indiana’s solitary quest.
  trigger_event: Nazis kidnap Marion in the bazaar and an explosion breaks out during
    the chase.
- description: Indiana and Sallah deduce the Nazis have miscalculated the exact location
    of the Well of Souls on the excavation site.
  id: s_9
  key_delta: Knowledge of the Well’s accurate location corrects the strategic error
    in Nazi excavation efforts.
  trigger_event: Indiana and Sallah analyze cryptic markings on the headpiece to identify
    the true Well of Souls location.
- description: Inside the Well of Souls filled with snakes, Indiana battles the hostile
    environment to retrieve the Ark of the Covenant amid the excavation site.
  id: s_10
  key_delta: Indiana gains possession of the Ark, escalating direct conflict with
    the Nazis and Belloq.
  trigger_event: Indiana descends into the Well of Souls and retrieves the Ark amidst
    attacking snakes.
- description: Belloq, Dietrich, and Nazi forces capture Indiana and Marion, sealing
    them in the Well; Indiana and Marion escape confinement shortly thereafter.
  id: s_11
  key_delta: Indiana and Marion recover freedom and retain the Ark, maintaining opposition
    to Nazi control.
  trigger_event: Nazis trap Indiana and Marion in the Well, then Indiana and Marion
    evade captivity and rejoin the fight.
- description: After a physical confrontation with a Nazi mechanic, Indiana survives
    a destroyed flying wing and pursues a Nazi convoy, reclaiming the Ark.
  id: s_12
  key_delta: Indiana regains exclusive control of the Ark, preventing its shipment
    to Berlin.
  trigger_event: Indiana fights, causes the crash of the flying wing, and intercepts
    the Nazi convoy transporting the Ark.
- description: Indiana and Marion prepare to transport the Ark aboard a tramp steamer
    to England, away from the Middle Eastern war zone.
  id: s_13
  key_delta: The Ark is moved from active conflict zones to nominally safer transport.
  trigger_event: Indiana and Marion board the tramp steamer for their voyage to England
    with the Ark.
- description: The tramp steamer is boarded by Belloq, Dietrich, and Nazis who steal
    the Ark and kidnap Marion, forcing Indiana to stow away on a U-boat pursuing them.
  id: s_14
  key_delta: The Ark and Marion fall again under Nazi control; Indiana moves covertly
    onto the U-boat to pursue.
  trigger_event: Nazis hijack the steamer and take the Ark along with Marion captive.
- description: On an isolated Aegean island, Belloq prepares a ritual opening of the
    Ark before Nazi leaders with Indiana and Marion captured and tied to wooden posts
    nearby.
  id: s_15
  key_delta: Indiana is forced into helpless witness of the Ark’s revealing and Nazi
    arrogance.
  trigger_event: Belloq initiates the Ark’s ceremonial opening while Indiana is exposed
    and Marion is held captive.
- description: The Ark opens revealing no visible contents but unleashes supernatural
    Old Testament seraphim, who kill the Nazis and Belloq with divine wrath as Indiana
    and Marion shield their eyes.
  id: s_16
  key_delta: The Ark’s supernatural power destroys the Nazi threat and Belloq, ending
    their quest forcibly.
  trigger_event: The spirits emerge from the Ark and begin killing Nazi personnel
    present during the ceremony.
- description: Back in Washington, D.C., Army intelligence officers inform Indiana
    and Marcus Brody the Ark is secure and under study by top government officials,
    then store it in a secret warehouse.
  id: s_17
  key_delta: The Ark is confiscated by the U.S. government and removed from Indiana’s
    control, concluding his immediate involvement.
  trigger_event: Indiana and Brody witness the government officials storing the Ark
    in a labeled, secure warehouse.
