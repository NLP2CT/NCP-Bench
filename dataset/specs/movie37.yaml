commitments:
- description: Tony cannot gain knowledge or control over Franky's last known activities
    before receiving the briefing from Doug and Avi (s_0).
  id: c_0
  satisfaction_condition: Player only obtains investigative leads about Franky after
    s_0 is completed.
  type: ordering
  violation_condition: Player acts on or reveals information about Franky's last movements
    prior to Doug and Avi briefing Tony at s_0.
- description: Tony must identify the link between Franky, Boris, and Brick Top’s
    betting operations before narrowing down the investigation to Boris (s_1 before
    s_3).
  id: c_1
  satisfaction_condition: Player uncovers evidence connecting Franky to Brick Top
    and Boris no earlier than s_1 and only then pursues Boris at or after s_3.
  type: ordering
  violation_condition: Player targets or confronts Boris with diamond-related accusations
    before establishing the gambling link at s_1.
- description: Franky remains missing and in danger between s_2 and s_7, ensuring
    Tony’s investigation continuously reflects Franky’s captivity and vulnerability.
  id: c_2
  satisfaction_condition: Narrative consistently shows Franky as kidnapped or dead
    but undiscovered until at least s_7.
  type: invariant
  violation_condition: Player discovers Franky is safe or free before security footage/viewing
    at s_2 or claims Franky’s fate before s_7.
- description: Tony must apprehend Boris before extracting diamond location information
    and triggering the pursuit by Vinny, Sol, and Tyrone (s_3 before s_4).
  id: c_3
  satisfaction_condition: Boris is held captive prior to players gaining key intelligence
    leading to pursuit.
  type: ordering
  violation_condition: Player obtains diamond location intelligence or initiates pursuit
    sequences without having captured Boris first.
- description: The car crash triggered by Tommy spilling milk must occur after Boris’s
    capture and before the regroup at the pub (between s_4 and s_6), causing casualties
    and Boris’s escape.
  id: c_4
  satisfaction_condition: The crash event happens in sequence after the kidnap of
    Boris and before Tony confronts Vinny, Sol, and Tyrone at the pub.
  type: invariant
  violation_condition: Player prevents or reorders the crash to occur before Boris
    capture or after the pub confrontation, breaking causal continuity.
- description: During the pub confrontation (around s_6), Vinny, Sol, and Tyrone carry
    only fake guns loaded with blanks making Tony realize the threat is a bluff.
  id: c_5
  satisfaction_condition: Player learns or discovers the pistols are replicas at or
    before confrontation, allowing Tony to intimidate instead of shooting.
  type: invariant
  violation_condition: Player has Tony shoot or escalate violence against Vinny, Sol
    and Tyrone before discovering the guns as blanks.
- description: Boris must be alive and arrive wounded with an assault rifle during
    the pub confrontation and be killed by Tony there (s_7).
  id: c_6
  satisfaction_condition: Boris appears wounded with an assault rifle at or before
    s_7 and is killed by Tony during the confrontation.
  type: invariant
  violation_condition: Player kills Boris before this point or Boris does not arrive
    wounded with an assault rifle, breaking the narrative escalation.
- description: Tony must die accidentally by Avi’s gunshot after the diamond is swallowed
    by the dog, marking the inevitable end of Tony’s active role (s_8).
  id: c_7
  satisfaction_condition: Tony’s death occurs only after the diamond is swallowed
    by the dog and the ensuing panic.
  type: achievement
  violation_condition: Player causes Tony’s premature death before the diamond swallowing
    event or the dog incident occurs.
- description: The diamond must be lost inside the dog only after Vinny and Sol escape
    with it and the subsequent confrontation at their pawnshop (s_8).
  id: c_8
  satisfaction_condition: Diamond swallowing event and subsequent Tony shooting happen
    at or after Vinny and Sol’s escape and confrontation.
  type: ordering
  violation_condition: Player causes the diamond to be lost or swallowed by the dog
    prior to Vinny and Sol’s escape or earlier in the sequence.
