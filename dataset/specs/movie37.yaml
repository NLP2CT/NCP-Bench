meta:
  genres: ["Crime", "Comedy"]
  id: movie37
  player_role: Bullet Tooth Tony
  title: "Snatch"
synopsis: After stealing an diamond in a heist in Antwerp, Franky "Four-Fingers" goes
  to London to deliver it to diamond dealer Doug "The Head" on behalf of New York
  jeweller "Cousin Avi", who bankrolled the theft. One of the other robbers advises
  Franky to obtain a gun from ex-KGB agent Boris "The Blade". Unbeknownst to Franky,
  Boris and the robber are brothers and plan to hire a third party to rob him of the
  diamond. Meanwhile, unlicensed boxing promoter and casino owner Turkish convinces
  local gangster "Brick Top" to add the matches of boxer "Gorgeous George" to the
  bets at Brick Top's bookies. However, when Turkish sends his partner Tommy and Gorgeous
  George to purchase a caravan from a group of pikeys, George gets into an impromptu
  fight with Mickey O'Neil, a bare-knuckle boxing champ who badly injures George with
  a single punch. Turkish convinces Mickey to replace George in his upcoming match
  by agreeing to purchase a new caravan for Mickey's mother. Brick Top agrees to the
  change on the condition that Mickey throws the fight in the fourth round. Boris
  gives Franky a gun in exchange for a favour——Franky is to place a bet on Boris'
  behalf at Brick Top's bookies. Avi learns of this and, knowing Franky has a gambling
  problem, flies to London with his bodyguard "Rosebud" to claim the diamond. Boris
  hires Vinny and Sol, two pawnbrokers and small-time crooks, to rob Frankie of the
  diamond while he is at the bookies. The robbery goes awry and Sol, Vinny, and their
  driver Tyrone are caught on-camera, but manage to kidnap Franky. Instead of throwing
  the fight, Mickey knocks his opponent out with a single punch. Infuriated, Brick
  Top robs Turkish of his savings and demands that Mickey fight again, and lose this
  time. Meanwhile, Boris retrieves the diamond and executes Franky. As Sol, Vinny,
  Tyrone, and their accomplice "Bad Boy" Lincoln are puzzling over how to dispose
  of Franky's body, Brick Top arrives to execute them for robbing his bookies. Sol
  bargains for their lives by promising Brick Top the stolen diamond, and is given
  48 hours to retrieve it. Avi and Doug hire "Bullet-Tooth" Tony to help them find
  Franky. When the trail leads to Boris, they kidnap him and retrieve the gemstone,
  closely pursued by Sol, Vinnie, and Tyrone. As they are driving, Tommy carelessly
  throws Turkish's carton of milk out the window of their car; it splashes over Tony's
  windshield, causing him to crash. Rosebud is killed, and Boris escapes from the
  wreck only to be hit by Tyrone's car. Tony and Avi regroup at a pub where they are
  confronted by Sol, Vinny, and Tyrone. Tony quickly realizes that their pistols are
  replicas loaded with blanks, and intimidates them into leaving him alone. The wounded
  Boris arrives with an assault rifle and is killed by Tony, but Sol and Vinny escape
  with the diamond, which Vinnie hides in his pants. When Tony catches up to them,
  they tell him that the diamond is back at their pawn shop. Once there, they run
  out of stall tactics and produce the diamond, but it is promptly swallowed by a
  dog that Vinnie got from the pikeys. Avi fires wildly at the fleeing dog and accidentally
  kills Tony. He gives up his pursuit and returns to New York. Mickey refuses to fight
  again unless Turkish buys an even more lavish caravan for his mother, but Turkish
  has no money left. Furious, Brick Top has his men vandalize Turkish's gambling arcade
  and burn down Mickey's mother's caravan while she is asleep inside it. Mickey agrees
  to fight in order to avoid more carnage, but gets so drunk after his mother's wake
  the night before that Turkish fears he won't even make it to the fourth round. If
  he fails to go down as agreed, Brick Top's men will execute Turkish, Tommy, Mickey,
  and the entire campsite of pikeys. Mickey takes a heavy beating but makes it to
  the fourth round, when he makes a sudden recovery and knocks out his opponent with
  a powerful blow. As they flee the building, Brick Top is killed by the pikeys, who
  have turned the tables on him——Mickey had bet on himself to win, and waited until
  the fourth round to allow the other pikeys time to ambush and kill Brick Top's men
  at the campsite. The next morning, Turkish and Tommy find the pikey campsite deserted.
  They are confronted by the police and don't know what to say, until Vinny's dog
  suddenly arrives and they claim to be walking it. They are released, while Sol and
  Vinnie are arrested when the police find the corpses of Franky and Tony in their
  car. Turkish and Tommy take the dog to a veterinarian to extract a squeaky toy that
  it had swallowed earlier, and discover the diamond in its stomach as well. They
  consult Doug about selling the diamond, and he calls Avi who returns to London.
trajectory:
- description: Bullet Tooth Tony is in London, recently hired by Doug 'The Head' and
    Cousin Avi to help find Franky 'Four-Fingers', who has gone missing after a diamond
    heist. The city is tense with underlying criminal scheming involving multiple
    factions including Boris 'The Blade', Brick Top, and Turkish.
  id: s_0
  key_delta: Tony is introduced to the main players and given the mission to locate
    Franky and recover the diamond, setting Tony’s investigative role and the key
    conflict in motion.
  trigger_event: Doug and Avi brief Tony on the disappearance of Franky and the importance
    of retrieving the stolen diamond.
- description: Tony begins his investigation and learns that Franky was last seen
    at Brick Top’s bookies where Boris 'The Blade' gave him a gun in exchange for
    placing a bet.
  id: s_1
  key_delta: Tony establishes the link between Franky, Boris, and Brick Top's gambling
    operations, focusing the search on gambling circles.
  trigger_event: Tony visits Brick Top’s betting shop to gather information about
    Franky’s last movements.
- description: At the bookies, Tony uncovers that Franky was ambushed and kidnapped
    by Vinny, Sol, and Tyrone during a robbery meant to steal the diamond.
  id: s_2
  key_delta: Tony confirms Franky is in danger and that the diamond is the target
    of multiple criminal parties including Boris’s hired crooks.
  trigger_event: Tony reviews security footage and questions witnesses at the bookies.
- description: Tony tracks leads to Boris, who is suspected of orchestrating the robbery
    on Franky to get the diamond for himself.
  id: s_3
  key_delta: Tony narrows down the investigation to Boris as a major antagonist controlling
    parts of the diamond’s fate.
  trigger_event: Tony obtains intel on Boris’s whereabouts and sets out to apprehend
    him.
- description: In a confrontation, Tony and Avi kidnap Boris to extract information
    and locate the diamond, simultaneously pursued by Vinny, Sol, and Tyrone.
  id: s_4
  key_delta: Tony gains direct control over Boris and insights into the diamond’s
    location, escalating the conflict and pursuit dynamics.
  trigger_event: Tony apprehends Boris during a tense encounter and prepares to transport
    him for questioning.
- description: While Tony, Avi, and Boris travel, Tommy accidentally causes a car
    crash by throwing milk on Tony’s windshield; Rosebud dies and Boris escapes but
    is wounded by Tyrone’s car.
  id: s_5
  key_delta: The crash results in casualties and Boris escapes, increasing chaos and
    threat to Tony’s mission.
  trigger_event: Tony’s car crashes due to milk spilled on his windshield during the
    transit.
- description: Tony regroups with Avi at a pub where they are confronted by armed
    Vinny, Sol, and Tyrone, who reveal their pistols are loaded with blanks.
  id: s_6
  key_delta: Tony realizes the threat is bluff, uses intimidation to neutralize the
    crooks temporarily without violence.
  trigger_event: Vinny, Sol, and Tyrone confront Tony with fake guns to regain leverage.
- description: The wounded Boris returns with an assault rifle intending to regain
    the diamond but is killed by Tony in the ensuing clash.
  id: s_7
  key_delta: Boris, a key adversary, is eliminated by Tony, removing a major obstacle
    but not resolving the diamond’s whereabouts.
  trigger_event: Boris ambushes Tony and Avi at the pub with an assault rifle.
- description: Vinny and Sol escape with the diamond, but Vinnie hides it in his dog;
    returning to their pawnshop, the dog swallows the diamond during a confrontation,
    leading Avi to shoot Tony accidentally.
  id: s_8
  key_delta: The diamond goes missing inside the dog; Tony is accidentally shot and
    killed by Avi during the panic, ending Tony’s active involvement.
  trigger_event: Vinny and Sol showcase the diamond but it is swallowed by the dog
    during a struggle.
