meta:
  genres: ["Comedy", "Romance"]
  id: movie21
  player_role: Sugar Kane Kowalczyk
  title: "Some Like It Hot"
synopsis: It is February 1929 in the city of Chicago. Two friends who are struggling
  jazz musicians, Joe, a saxophone player, irresponsible gambler and ladies' man,
  and Jerry, a sensible double-bass player, accidentally witness the Saint Valentine's
  Day massacre. When the gangsters, led by "Spats" Colombo, spot them, the two have
  to run for their lives. Penniless, freezing cold, and in a rush to get out of town,
  the two musicians take a job in a women's band headed to Miami. Disguised as women
  and calling themselves "Josephine" and "Daphne", they board a train with "Sweet
  Sue and her Society Syncopators", an "all-girl" band and their male manager, Beanstock.
  Before they board the train, Joe and Jerry have already noticed Sugar Kane, the
  band's vocalist and ukulele player, marveling over how she walks "like jello on
  springs," as they struggle along in their high heels not at all sure they will be
  able to "pass" as women. As they board the train however, "Daphne" experiences the
  kind of sexual harassment common to women when Beanstock feels "her" up. Both Joe
  and Jerry become enamored of Sugar, and compete for her affection while maintaining
  their disguises. Sugar confides that she has sworn off of male saxophone players,
  who have stolen her heart in the past and left her with "the fuzzy end of the lollipop."
  She has now set her sights on finding a sweet, bespectacled millionaire in Florida.
  During the forbidden drinking and partying on the train with all the women in the
  band, "Josephine" and "Daphne" become intimate friends with Sugar, and continually
  have to struggle to remember that they are "girls" and cannot make a pass at her.
  Once in Miami, Joe woos Sugar by assuming a second disguise as a millionaire named
  "Junior", the heir to Shell Oil, while mimicking Cary Grant's voice and feigning
  disinterest in Sugar. An actual millionaire, an aging mama's boy, the much-married
  Osgood Fielding III, tries repeatedly to pick up "Daphne", who repeatedly rebuffs
  him. One night Osgood invites "Daphne" for a champagne supper on his yacht. Joe
  convinces "Daphne" to keep Osgood occupied onshore, so that "Junior" can take Sugar
  to Osgood's yacht, passing it off as his. Once on the yacht, "Junior" uses metaphors
  to explain to Sugar that unfortunately, due to psychological trauma, he is impotent
  and frigid, but that he would certainly marry anyone who could change that. Sugar
  tries desperately to arouse some sexual response in "Junior", and begins to succeed.
  Meanwhile, Jerry and Osgood dance the tango till dawn. When Joe and Jerry get back
  to the hotel, "Daphne" happily explains that Osgood has proposed and that "she"
  has accepted. Joe finally convinces Jerry that he can't actually marry Osgood. Joe
  then breaks Sugar's heart by telling her that he, "Junior", has to marry a woman
  of his father's choosing and move to Venezuela. Many mobsters arrive at the hotel
  for a conference honoring the "Friends of Italian Opera". Spats and his gang from
  Chicago eventually recognize Joe and Jerry as the witnesses to the Valentine's Day
  murders. After several humorous but potentially lethal chases, Joe and Jerry end
  up witnessing additional mob killings, this time of Spats and his crew. Once again
  Joe and Jerry have to run for their lives. Joe, dressed as "Josephine", sees Sugar
  onstage singing sadly that she will never love again. He kisses her before he leaves,
  and Sugar suddenly understands that Joe is both "Josephine" and "Junior". Sugar
  runs from the stage at the end of her performance and is able to jump into the launch
  from Osgood's yacht just as it is leaving the dock with Joe, Jerry and Osgood in
  it. Joe tells Sugar that he is not good enough for her, that she would be getting
  the "fuzzy end of the lollipop" yet again, but Sugar wants him anyway. Jerry, for
  his part, tries to explain to Osgood that "Daphne" cannot marry him, offering a
  series of objections——"Daphne" smokes a lot; "Daphne" can't get married in Osgood's
  mother's dress; "Daphne" sadly "can never have children." Osgood dismisses all this
  information as insignificant; he loves "Daphne" and is determined to marry her.
  Finally, exasperated, Jerry removes his wig and says in his male voice, "I'm a man!",
  but a smiling Osgood overrides this final barrier using the film's memorable last
  line, "Well... nobody's perfect!"
trajectory:
- description: It is February 1929 in Chicago; Sugar Kane is performing as the vocalist
    and ukulele player with 'Sweet Sue and her Society Syncopators,' an all-girl band
    preparing to board a train to Miami. The atmosphere is lively with excitement
    for the upcoming tour, and Sugar is seen admiring her own prospects and the company
    around her.
  id: s_0
  key_delta: Introduction of Joe and Jerry in female disguise as new members of the
    band, establishing their presence in Sugar’s immediate environment.
  trigger_event: Joe and Jerry, two men disguised as women named 'Josephine' and 'Daphne,'
    board the train with the band.
- description: On board the train, Sugar interacts with 'Josephine' and 'Daphne' and
    observes their struggle to adapt to their disguises. The band is engaged in forbidden
    drinking and partying, creating a convivial but secretive atmosphere.
  id: s_1
  key_delta: '''Daphne'' experiences gender-based harassment, revealing the precarious
    nature of Joe and Jerry’s disguise and deepening Sugar’s direct connection with
    them.'
  trigger_event: Beanstock, the band’s male manager, sexually harasses 'Daphne' during
    the train journey.
- description: Sugar confides in 'Josephine' and 'Daphne' during the train trip that
    she has sworn off male saxophone players and is seeking a bespectacled millionaire
    in Florida. The three grow closer in a circle of trust amid the constraints of
    their roles.
  id: s_2
  key_delta: The band reaches Miami, and Sugar, Joe, Jerry, and Osgood all enter
    the hotel-and-performance world that drives their next round of pursuit and courtship.
  trigger_event: The train arrives in Miami, and the band begins their engagements
    in the city.
- description: Sugar is performing and socializing in Miami where a wealthy suitor,
    Osgood Fielding III, persistently courts 'Daphne,' while Sugar is unaware of Joe’s
    true identity amidst the disguises.
  id: s_3
  key_delta: Joe adopts a second male identity to woo Sugar, complicating the relationships
    and the dynamics of deception.
  trigger_event: Joe, as 'Junior,' makes his first appearance to Sugar while maintaining
    a second disguise as a millionaire heir.
- description: Sugar meets 'Junior' and is intrigued by his detachment and mysteriousness
    despite his apparent wealth, while Osgood continues courting 'Daphne' who rebuffs
    his advances.
  id: s_4
  key_delta: The setting shifts to an intimate yacht dinner, providing Joe a private
    environment to deepen his connection with Sugar under the millionaire guise.
  trigger_event: Joe, as 'Junior,' invites Sugar onto Osgood’s yacht for a champagne
    supper.
- description: On the yacht, Sugar attempts to arouse 'Junior,' who confesses to impotency
    and psychological trauma through metaphorical language, expressing willingness
    to marry if that could change.
  id: s_5
  key_delta: Sugar’s emotional investment intensifies as she supports 'Junior' despite
    his apparent issues, while the band’s social environment continues around them.
  trigger_event: Sugar and the band return to the hotel after the yacht event.
- description: Sugar remains unaware of 'Junior’s' true identity as Joe, while Osgood
    has proposed marriage to 'Daphne,' who has ostensibly accepted under Jerry’s influence.
  id: s_6
  key_delta: Sugar experiences emotional heartbreak based on Joe’s deception, solidifying
    her romantic conflict.
  trigger_event: Joe reveals to Sugar that 'Junior' must marry another woman and leave
    for Venezuela, breaking her heart.
- description: A mob conference honoring the 'Friends of Italian Opera' is underway
    at the hotel. Sugar is performing onstage, singing sadly about never loving again,
    while Joe and Jerry are pursued by gangsters who recognize them as witnesses.
  id: s_7
  key_delta: The kiss acts as revelation and climax for Sugar’s understanding of Joe’s
    true identity and feelings, intertwining her fate with Joe and Jerry's peril.
  trigger_event: Joe, disguised as 'Josephine,' kisses Sugar onstage before fleeing
    with Jerry and Osgood.
- description: Sugar runs from the stage, jumps into the launch leaving the dock with
    Joe, Jerry, and Osgood, fully committing to Joe despite his flaws; Jerry reveals
    his true male identity to Osgood who accepts 'Daphne' regardless.
  id: s_8
  key_delta: Sugar leaves with Joe, and Osgood accepts Jerry even after learning
    he is a man.
  trigger_event: Departure by launch from the yacht with all principal characters
    aboard.
