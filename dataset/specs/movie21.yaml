commitments:
- description: Joe and Jerry must first board the train disguised as women ('Josephine'
    and 'Daphne') before Sugar develops any romantic or trusting relationship with
    them.
  id: c_0
  satisfaction_condition: Node s_0 has been achieved before any trust or romantic
    engagement with 'Josephine' and 'Daphne' occurs at node s_1 or beyond.
  type: ordering
  violation_condition: Player attempts to initiate trust or affection towards Joe
    or Jerry prior to the event s_0 where they join the band as women.
- description: Between nodes s_1 and s_6, Joe and Jerry must maintain their female
    disguises as 'Josephine' and 'Daphne' whenever interacting socially with Sugar;
    their true male identities must not be revealed or acknowledged by Sugar before
    s_7.
  id: c_1
  satisfaction_condition: Throughout s_1 to s_6, player inputs or system states never
    lead to Sugar discovering or recognizing Joe and Jerry's male identities.
  type: invariant
  violation_condition: Sugar learns or verbally acknowledges Joe or Jerry's true male
    identity before the narrative reaches node s_7.
- description: Sugar maintains her belief that 'Junior' is a distinct millionaire
    persona separate from 'Josephine' throughout s_3 to s_6 and until explicit revelation
    at s_7.
  id: c_2
  satisfaction_condition: Sugar does not connect Joe's 'Junior' persona with 'Josephine'
    before node s_7 is reached.
  type: invariant
  violation_condition: Player action or narrative acknowledges or reveals the connection
    between 'Junior' and 'Josephine' prior to s_7.
- description: The emotional heartbreak of Sugar caused by Joe's revelation of marrying
    another woman must occur before she shows open acceptance or pursuit of Joe's
    true identity.
  id: c_3
  satisfaction_condition: Node s_6 (heartbreak event) is reached before s_7 or s_8
    where Sugar reconciles or accepts Joe's identity.
  type: ordering
  violation_condition: Sugar knowingly accepts or pursues Joe before the heartbreak
    event at s_6 has been triggered.
- description: The pivotal kiss onstage where Sugar realizes Joe is both 'Josephine'
    and 'Junior' must happen before Sugar fully commits to Joe and departs with him
    in s_8.
  id: c_4
  satisfaction_condition: Node s_7 kiss event has occurred, triggering Sugar’s revelation
    of Joe’s true identity before s_8 final commitment.
  type: achievement
  violation_condition: Sugar accepts or departs with Joe at s_8 without the kiss and
    revelation having taken place at s_7.
- description: Jerry must explicitly reveal his male identity to Osgood only after
    Osgood proposes to 'Daphne' and is rejected, ensuring gradual exposure and acceptance.
  id: c_5
  satisfaction_condition: Osgood's proposal event (s_6 or s_7) precedes Jerry's male
    identity reveal at s_8.
  type: ordering
  violation_condition: Jerry reveals his male identity to Osgood before Osgood's proposal
    to 'Daphne' and their disputes have occurred.
- description: Between s_0 and s_7, Sugar never experiences or expresses romantic
    or sexual advances towards Joe or Jerry that violate her belief in their female
    disguises or social boundaries established under the disguise.
  id: c_6
  satisfaction_condition: All player or narrative actions respect Sugar’s understanding
    of Joe and Jerry as women and refrain from transgressing gender/social boundaries
    prematurely.
  type: invariant
  violation_condition: Sugar makes or accepts romantic/sexual advances towards 'Josephine'
    or 'Daphne' inconsistent with her understanding of their gender before s_7.
- description: Joe's impersonation as 'Junior' includes the claim of impotency and
    psychological trauma which is accepted by Sugar as true between s_5 and s_6, forming
    a critical emotional barrier.
  id: c_7
  satisfaction_condition: Sugar believes and interacts with Joe's 'Junior' persona,
    acknowledging the impotence claim during s_5 and s_6 timeframe.
  type: invariant
  violation_condition: Sugar disbelieves or contradicts Joe's impotence claim prior
    to s_7, or player forces narrative to invalidate that claim prematurely.
