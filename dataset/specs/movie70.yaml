meta:
  genres: ["Thriller", "Crime"]
  id: movie70
  player_role: Clarice Starling
  title: "The Silence of the Lambs"
synopsis: Clarice Starling is pulled from her training at the FBI Academy at Quantico,
  Virginia, by Jack Crawford of the Bureau's Behavioral Science Unit. He tasks her
  with interviewing Hannibal Lecter, a former psychiatrist and incarcerated cannibalistic
  serial killer, believing Lecter's insight might be useful in the pursuit of a serial
  killer nicknamed "Buffalo Bill", who skins his female victims' corpses. Starling
  travels to the Baltimore State Hospital for the Criminally Insane, where she is
  led by Dr. Frederick Chilton to Lecter's solitary quarters. Although initially pleasant
  and courteous, Lecter grows impatient with Starling's attempts at "dissecting" him
  and rebuffs her. As she is leaving, one of the prisoners flicks semen at her. Lecter,
  who considers the discourtesy "unspeakably ugly", calls Starling back and tells
  her to seek out an old patient of his. This leads her to a storage shed where she
  discovers a man's severed head. She returns to Lecter, who tells her that the man
  is linked to Buffalo Bill. He offers to profile Buffalo Bill on the condition that
  he be transferred away from Chilton, whom he detests. When Buffalo Bill kidnaps
  a Senator's daughter, Catherine Martin, Crawford authorizes Starling to offer Lecter
  a fake deal promising a prison transfer if he provides information that helps find
  Buffalo Bill and rescue the abductee. Instead, Lecter begins a game of quid pro
  quo with Starling, offering comprehensive clues and insights about Buffalo Bill
  if Starling will give him information about her own past, something she was advised
  not to do. Chilton secretly records the conversation and reveals Starling's deal
  as a sham before offering to transfer Lecter in exchange for a deal of Chilton's
  own making. Lecter agrees and is flown to Memphis, Tennessee, where he reveals personal
  information on Buffalo Bill to federal agents. As the manhunt begins, Starling visits
  Lecter at his special cell in a Tennessee courthouse and confronts him with her
  decryption of the name he provided. Lecter refuses Starling's pleas for the truth
  and forces her to recount her traumatic childhood. She tells him how she was orphaned
  and relocated to a relative's farm, where she discovered a lamb slaughterhouse and
  made a failed attempt to rescue one of the lambs. Lecter gives her back the case
  files on Buffalo Bill after their conversation is interrupted by Chilton and the
  police who escort her from the building. Later that evening, Lecter kills his two
  guards, escapes from his cell and disappears. Starling analyzes Lecter's annotations
  to the case files and realizes that Buffalo Bill knew his first victim personally.
  Starling travels to the victim's hometown and discovers that Buffalo Bill was a
  tailor, with dresses and dress patterns identical to the patches of skin removed
  from each of his victims. She telephones Crawford to inform him that Buffalo Bill
  is trying to fashion a "woman suit" of real skin, but Crawford is already en route
  to make an arrest, having cross-referenced Lecter's notes with hospital archives
  and finding a man named Jame Gumb, who once applied unsuccessfully for a sex-change
  operation. Starling continues interviewing friends of Buffalo Bill's first victim
  in Ohio while Crawford leads an FBI tactical team to Gumb's address in Illinois.
  The house in Illinois is empty and Starling is led to the house of "Jack Gordon",
  who she realizes is actually Jame Gumb. She pursues him into his multi-room basement,
  where she discovers that Catherine is still alive, but trapped in a dry well. After
  turning off the basement lights, Gumb stalks Starling in the dark with night-vision
  goggles but gives his position away when he cocks his revolver; Starling turns around
  just in time and kills him. Some time later at her FBI Academy graduation party,
  Starling receives a phone call from Lecter, who is at an airport in Bimini. He assures
  her that he does not plan to pursue her and asks her to return the favor, which
  she says she cannot do. Lecter then hangs up the phone, saying that he is "having
  an old friend for dinner" and begins following a newly-arrived Chilton before disappearing
  into the crowd.
trajectory:
- description: Clarice Starling is training at the FBI Academy in Quantico, Virginia.
    The atmosphere is formal and disciplined, with new agents undergoing rigorous
    preparation. Clarice is unaware of any immediate field assignment and is focused
    solely on her training under the supervision of FBI instructors.
  id: s_0
  key_delta: Clarice is pulled from training by Jack Crawford to interview Hannibal
    Lecter, establishing the initial mission and connecting her to the serial killer
    investigation.
  trigger_event: Jack Crawford arrives at the FBI Academy and summons Clarice Starling
    for an urgent assignment.
- description: Clarice Starling arrives at the Baltimore State Hospital for the Criminally
    Insane, standing outside the imposing facility and preparing to meet Hannibal
    Lecter. Dr. Frederick Chilton, the hospital administrator, leads her to Lecter's
    solitary cell. The atmosphere is tense and clinical.
  id: s_1
  key_delta: The first direct interaction with Lecter occurs; his initial courteous
    demeanor followed by growing impatience defines their relationship’s dynamic.
  trigger_event: Clarice enters Hannibal Lecter's quarters and begins the first interview.
- description: Clarice is leaving Lecter's cell after the first interrogation when
    a prisoner silently spits semen at her. Lecter calls her back into his cell, appearing
    displeased by the disrespect shown.
  id: s_2
  key_delta: Lecter reveals a new investigative lead by directing Clarice to follow
    up on another patient, expanding the investigation beyond Lecter himself.
  trigger_event: Hannibal Lecter instructs Clarice to seek out an old former patient
    of his.
- description: Clarice finds a storage shed containing a man's severed head, linked
    to the Buffalo Bill case. She returns to Lecter for confirmation and further insight.
    Lecter is now negotiating terms for his cooperation.
  id: s_3
  key_delta: Lecter establishes a quid pro quo condition linking his cooperation to
    a change in his imprisonment conditions.
  trigger_event: Lecter offers to profile Buffalo Bill if he is transferred away from
    Dr. Chilton.
- description: Buffalo Bill kidnaps Senator's daughter Catherine Martin. Crawford
    authorizes Clarice to offer Lecter a fake deal promising transfer in exchange
    for information. Clarice confronts Lecter with the fake deal proposition.
  id: s_4
  key_delta: The informational exchange turns intimate and strategic; Lecter provides
    clues but demands personal details from Clarice, complicating their interaction.
  trigger_event: Lecter begins exchanging clues about Buffalo Bill in return for personal
    information from Clarice during an interview.
- description: Dr. Chilton secretly records Lecter and Clarice's conversation and
    exposes the sham deal. Chilton offers his own deal to transfer Lecter and personally
    takes charge of the transfer arrangements.
  id: s_5
  key_delta: Lecter's transfer out of Baltimore is arranged under Chilton’s terms,
    shifting control of Lecter’s custody and setting up his temporary relocation.
  trigger_event: Lecter agrees to Chilton’s deal and is flown to Memphis, Tennessee,
    for transfer.
- description: Lecter reveals personal information about Buffalo Bill to federal agents
    after arriving in Memphis. Clarice visits him at a courthouse cell and confronts
    him with the decrypted key name. Lecter refuses to confirm and presses Clarice
    to reveal her childhood traumas.
  id: s_6
  key_delta: Lecter releases the Buffalo Bill case files annotated, and Clarice shares
    personal history, deepening their psychological connection and information transfer.
  trigger_event: Clarice recounts her orphaned childhood and the lamb rescue attempt
    to Lecter during this confrontation.
- description: Clarice is escorted away by Chilton and police after the courthouse
    encounter while Lecter kills his guards during the night and escapes from custody.
    The atmosphere shifts from containment to open threat with Lecter’s escape.
  id: s_7
  key_delta: Lecter's escape removes him from controlled custody; Clarice gains fresh
    insights from his case file annotations, advancing the Buffalo Bill investigation.
  trigger_event: Clarice later analyzes Lecter's annotations in the case files.
- description: Clarice travels to the first victim's hometown and discovers Buffalo
    Bill was a tailor with dresses matching skin patches removed from victims. She
    calls Crawford to report the pattern discovering Buffalo Bill’s clothing-based
    modus operandi.
  id: s_8
  key_delta: Identification of Jame Gumb as Buffalo Bill crystallizes the investigation’s
    suspect profile and grounds the hunt geographically and personally.
  trigger_event: Crawford cross-references Lecter's notes and hospital archives identifying
    Jame Gumb as a suspect.
- description: Clarice interviews friends of the first victim in Ohio while Crawford
    leads an FBI tactical team to Jame Gumb's Illinois residence. The tactical team
    arrives at an apparently empty house. Clarice is led to another house attributed
    to the alias Jack Gordon.
  id: s_9
  key_delta: Clarice locates Buffalo Bill’s lair and the abducted victim, progressing
    from suspect identification to active search and confrontation.
  trigger_event: Clarice chases Buffalo Bill into his basement after discovering the
    victim Catherine Martin trapped in a dry well.
- description: Clarice navigates the dark, multi-room basement. Jame Gumb stalks her using night-vision goggles but gives his position away when he cocks his revolver. Clarice turns around just in time and shoots him.
  id: s_10
  key_delta: Clarice shoots and kills Buffalo Bill, rescuing Catherine Martin and resolving the primary serial killer threat.
  trigger_event: With Buffalo Bill dead and Catherine rescued, Clarice returns to normal FBI life until Lecter later contacts her from Bimini.
- description: At her FBI Academy graduation party, Clarice receives a phone call
    from Lecter, who is at an airport in Bimini. Lecter assures her he will not pursue
    her and requests a favor he knows she cannot grant. Lecter then mentions having
    an old friend for dinner, signaling future danger.
  id: s_11
  key_delta: Lecter is free and already tailing Chilton after contacting Clarice
    from abroad.
  trigger_event: Lecter ends the phone call and begins following Dr. Chilton before
    disappearing into a crowd.
