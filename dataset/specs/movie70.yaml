commitments:
- description: Clarice cannot begin interviewing Hannibal Lecter before Jack Crawford
    pulls her from Quantico training and assigns the task.
  id: c_0
  satisfaction_condition: Node s_0 has been reached and completed before s_1 begins.
  type: ordering
  violation_condition: Player attempts to initiate Lecter interview (s_1) without
    first triggering Crawford's summoning and Clarice leaving training (s_0).
- description: Lecter's first demeanor toward Clarice is initially courteous but progressively
    grows impatient, establishing their dynamic early interaction.
  id: c_1
  satisfaction_condition: During s_1, Lecter expresses initial courtesy and then clearly
    shows impatience as Clarice interrogates.
  type: invariant
  violation_condition: Lecter’s initial interaction with Clarice lacks this evolving
    demeanor from courteous to impatient in s_1, or contradicts this pattern.
- description: Clarice must receive the investigative lead from Lecter (direction
    to the old patient) before discovering the severed head evidence.
  id: c_2
  satisfaction_condition: s_2 completes prior to s_3, ensuring Clarice is first instructed
    by Lecter before following up at the storage shed.
  type: ordering
  violation_condition: Player uncovers or references severed head evidence (s_3) before
    Lecter instructs Clarice to seek the old patient (s_2).
- description: Lecter's cooperation in profiling Buffalo Bill is strictly conditional
    on his transfer away from Dr. Chilton.
  id: c_3
  satisfaction_condition: From s_3 onwards until the transfer occurs at s_5, Lecter
    consistently links his cooperation to the transfer demand.
  type: invariant
  violation_condition: Lecter provides profiling help or key information before securing
    or negotiating the transfer condition, violating quid pro quo logic.
- description: The fake deal offering Lecter transfer in exchange for info is presented
    only after Buffalo Bill kidnaps Catherine Martin and Crawford authorizes Clarice
    to negotiate.
  id: c_4
  satisfaction_condition: Node s_4 occurs only after the kidnapping event and authorization;
    prior nodes do not contain this negotiation attempt.
  type: ordering
  violation_condition: Player attempts or system acknowledges a fake deal negotiation
    with Lecter before the kidnapping and Crawford authorization events.
- description: Lecter’s information exchange with Clarice during the fake deal interview
    involves him demanding personal details about Clarice in return for clues.
  id: c_5
  satisfaction_condition: During s_4, Lecter explicitly demands Clarice share personal
    past details as part of information exchange.
  type: invariant
  violation_condition: Lecter fully discloses clues without requesting or coercing
    Clarice for personal information in s_4.
- description: Lecter's transfer to Memphis under Chilton’s terms (s_5) must occur
    before Lecter reveals personal Buffalo Bill information to federal agents.
  id: c_6
  satisfaction_condition: s_5 completes before s_6 begins, preserving logical custody
    and transfer sequence.
  type: ordering
  violation_condition: Player or system allows Lecter to reveal personal Buffalo Bill
    info to agents (s_6) before confirmed transfer (s_5).
- description: Clarice must recount her traumatic childhood to Lecter to receive back
    Buffalo Bill’s case files annotated during their courthouse encounter.
  id: c_7
  satisfaction_condition: In s_6, Clarice openly shares details of her orphaned past
    and lamb rescue attempt, followed by Lecter giving case files.
  type: invariant
  violation_condition: Case files are transferred or Lecter grants full information
    without Clarice revealing her childhood history at s_6.
- description: Lecter’s escape from custody (s_7) must occur after his interaction
    with Clarice at the courthouse and her receiving annotated case files.
  id: c_8
  satisfaction_condition: s_6 precedes s_7; Lecter’s escape only occurs after the
    courthouse encounter and handing over of files.
  type: ordering
  violation_condition: Lecter escapes prior to or during his meeting with Clarice
    before annotated files are received, disrupting narrative flow.
- description: Clarice’s analysis of Lecter’s case file annotations correctly reveals
    Buffalo Bill’s personal connection to his first victim and his tailoring modus
    operandi.
  id: c_9
  satisfaction_condition: At s_8, Clarice logically deduces from Lecter's notes that
    Buffalo Bill was a tailor connected to victim patterns.
  type: invariant
  violation_condition: Clarice or player prematurely identifies Buffalo Bill’s identity
    or modus operandi before analyzing Lecter’s annotations post-escape (after s_7).
- description: Identification of Jame Gumb as Buffalo Bill must occur before tactical
    operations and Clarice’s pursuit to the killer’s basement lair.
  id: c_10
  satisfaction_condition: s_8 node completes (identification) before s_9 begins (interviews
    and pursuit).
  type: ordering
  violation_condition: Player or system allows direct confrontation or pursuit of
    Buffalo Bill prior to formal identification by Crawford and Clarice.
- description: Clarice must kill Buffalo Bill during the basement confrontation to
    resolve the main serial killer threat.
  id: c_11
  satisfaction_condition: At s_10, Buffalo Bill is explicitly killed by Clarice following
    the night-vision confrontation in the dark basement.
  type: achievement
  violation_condition: The narrative ends or moves forward without Buffalo Bill’s
    death or neutralization after the confrontation sequence.
- description: Lecter remains at large and active after Buffalo Bill’s death, continuing
    his own agenda including targeting Dr. Chilton.
  id: c_12
  satisfaction_condition: Post s_11, Lecter is confirmed escaped, follows Chilton,
    and remains free at large.
  type: invariant
  violation_condition: Lecter is captured, neutralized, or permanently restrained
    before or during s_11, contradicting the open-ended danger.
