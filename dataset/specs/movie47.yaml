commitments:
- description: Mia's discovery of her royal identity at s_1 must precede any acknowledgment
    or use of her princess status elsewhere.
  id: c_0
  satisfaction_condition: Node s_1 has occurred before any other node where Mia's
    royal status is publicly or privately acknowledged or acted upon.
  type: ordering
  violation_condition: Narrative allows Mia or any NPC to treat Mia as princess or
    reveal her status before s_1 has occurred.
- description: Mia's rejection of the princess identity after initial revelation remains
    consistent until she accepts it at s_19 or later.
  id: c_1
  satisfaction_condition: Between s_2 and s_18 (inclusive), Mia explicitly resists
    or denies fully accepting her role as princess without final commitment.
  type: invariant
  violation_condition: Mia acts or decides to fully embrace her princess identity
    or authority before s_19 is triggered.
- description: Mia's secret royal identity must only be publicly known after the leak
    at s_7, not before.
  id: c_2
  satisfaction_condition: Public awareness of Mia as crown princess is only revealed
    at s_7 or afterward.
  type: ordering
  violation_condition: Any public or press knowledge of Mia’s princess status occurs
    before s_7.
- description: Between s_6 and s_7, Mia's royal identity remains confidential outside
    the existing family and royal inner circle, with Lilly newly informed directly
    and Paulo aware through his makeover work under an expectation of confidentiality.
  id: c_3
  satisfaction_condition: Between s_6 and s_7, Mia's identity is known only within
    the established family and royal circle, by Lilly through Mia's disclosure, and
    by Paulo through his makeover role; no media or broader public awareness exists.
  type: invariant
  violation_condition: Any character or media outside the established family and royal
    circle, Lilly, and Paulo learns Mia's secret before s_7, or Paulo discloses it
    before the leak event at s_7.
- description: Mia’s formal princess lessons and lifestyle shift start at s_4 and
    are not to begin earlier.
  id: c_4
  satisfaction_condition: Princess lessons and formal lifestyle elements like limousine
    and bodyguard appear following s_4 only.
  type: ordering
  violation_condition: Mia begins princess lessons or uses royal privileges before
    s_4.
- description: Mia’s humiliation and media incidents (s_8, s_12) must not occur before
    the public leak of her royal identity at s_7.
  id: c_5
  satisfaction_condition: Events involving public embarrassment or paparazzi exposure
    happen only at or after s_7.
  type: ordering
  violation_condition: Media or public humiliation related to Mia’s princess status
    occurs before s_7.
- description: Legal and reputational consequences of Mia's accident at s_9 are resolved
    by Queen Clarisse’s intervention at s_10, preventing legal prosecution.
  id: c_6
  satisfaction_condition: After s_10, no charges or legal penalties remain pending
    from the accident event s_9.
  type: invariant
  violation_condition: Player causes Mia to be prosecuted or penalized for driving-related
    charges after s_9 and s_10.
- description: Mia’s decision to publicly accept the Genovian throne (s_21) must only
    occur after her receipt of the letter from her father (s_18/s_19).
  id: c_7
  satisfaction_condition: Mia publicly accepts the throne at s_21 only if s_18 and
    s_19 events have occurred, reflecting her resolved decision.
  type: ordering
  violation_condition: Mia publicly accepts the throne or commits to the crown before
    receiving and considering her father’s letter.
- description: Mia must publicly announce acceptance of the Genovian throne (s_21)
    to conclude her narrative arc successfully.
  id: c_8
  satisfaction_condition: Node s_21 is reached and Mia declares her acceptance of
    the throne in a public setting.
  type: achievement
  violation_condition: The narrative ends or branches off without Mia making a public
    acceptance declaration of her royal role.
- description: Mia’s close friendships with Lilly and Michael require active engagement
    and repair after conflicts triggered around s_16 and s_17 until the ball.
  id: c_9
  satisfaction_condition: Between s_16 and s_21, Mia takes actions to restore and
    maintain trust with Lilly and Michael, including invitations and apologies.
  type: invariant
  violation_condition: Mia permanently alienates Lilly or Michael without attempts
    to reconcile before s_21.
- description: Mia’s romantic involvement with Michael is permitted only after she
    publicly accepts her princess role (post s_21).
  id: c_10
  satisfaction_condition: The kiss and romantic connection with Michael occur at s_22,
    which is after Mia accepts her royal status at s_21.
  type: ordering
  violation_condition: Romantic actions or expressions between Mia and Michael occur
    before Mia’s acceptance of her royal role at s_21.
- description: Queen Clarisse's supportive relationship with Joe develops only after
    Mia commits to the throne, maintaining appropriate leadership focus.
  id: c_11
  satisfaction_condition: Clarisse and Joe’s relationship is only shown developing
    at s_23 or after.
  type: invariant
  violation_condition: The Queen and Joe form a romantic or personal relationship
    prior to Mia's final decision on the throne.
- description: Mia’s physical relocation to Genovia with her mother (s_24 and s_25)
    marks the successful narrative transition into her role as a royal heir.
  id: c_12
  satisfaction_condition: Mia boards the plane to Genovia and reflects on her new
    life, concluding with arrival and welcome to Genovia.
  type: achievement
  violation_condition: Narrative concludes without Mia physically transitioning to
    Genovia or expressing commitment to her new life.
