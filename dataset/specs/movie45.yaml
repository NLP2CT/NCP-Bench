commitments:
- description: Elle's motivation to attend Harvard Law is triggered only after Warner
    breaks up with her; the system must not allow acceptance or law school actions
    before s_0 completes.
  id: c_0
  satisfaction_condition: 'Node s_0 completed: player has experienced Warner''s breakup
    and Elle''s shattered expectations.'
  type: ordering
  violation_condition: Player triggers Elle's acceptance to Harvard (s_1) or law school
    preparation before experiencing Warner's breakup (s_0).
- description: Elle must receive an acceptance letter to Harvard Law before arriving
    at Harvard and facing social challenges; prevents skipping law school admission
    step.
  id: c_1
  satisfaction_condition: 'Node s_1 completed: player has received Harvard acceptance
    and begun law school trajectory.'
  type: ordering
  violation_condition: Player attempts to enact s_2 (Harvard arrival and social disapproval)
    or later events before acceptance letter (s_1) is obtained.
- description: Elle's social status at Harvard is initially one of disapproval and
    naivete until she shifts focus from Warner to her own success at s_3; this state
    must persist in [s_2 to s_3).
  id: c_2
  satisfaction_condition: During nodes s_2 to before s_3, Elle is treated with social
    disapproval and regarded as naive by peers.
  type: invariant
  violation_condition: Player alters social perception so that Elle is regarded as
    respected or successful at Harvard before s_3 is reached.
- description: Elle must decisively end her pursuit of Warner and begin focusing on
    her own merit by securing an internship with Professor Callahan before advancing
    the trial phase.
  id: c_3
  satisfaction_condition: Node s_3 completed, including Elle rejecting Warner and
    obtaining Professsor Callahan internship.
  type: achievement
  violation_condition: Trial-related events (nodes s_4 and beyond) triggered without
    Elle having rejected Warner or securing the internship.
- description: Elle holds confidential knowledge about Brooke's liposuction alibi
    that she must keep secret until the defense strategy is revealed post s_4; this
    secret must never be prematurely disclosed.
  id: c_4
  satisfaction_condition: Between s_4 and trial resolution (before s_7), Brooke's
    liposuction alibi remains confidential and undisclosed to prosecution or other
    parties.
  type: invariant
  violation_condition: Player causes the liposuction alibi or related confidential
    information to become public or known to prosecution before proper trial cross-examination
    phase.
- description: Vivian's friendship and trust toward Elle only forms after witnessing
    Elle's integrity in keeping Brooke's secret, disallowing premature alliance or
    cooperation.
  id: c_5
  satisfaction_condition: 'Node s_5 completed: Vivian befriends Elle post-discovery
    of her integrity and reveals Warner''s admission circumstances.'
  type: ordering
  violation_condition: Player establishes Vivian as Elle's friend or ally before Elle
    keeps Brooke's secret at s_4 and displays integrity.
- description: Key prosecution witness (cabana boy) testimony discrediting must occur
    only after Elle deduces and exposes his falsehood in the cross-examination at
    s_5 to ensure proper trial build-up.
  id: c_6
  satisfaction_condition: Node s_5 completed with cabana boy's false testimony exposed
    and discredited in courtroom.
  type: ordering
  violation_condition: Player attempts to discredit prosecution witness before gathering
    sufficient evidence or without undergoing trial preparation shown in s_5.
- description: Après Elle rejecting Callahan's advances and contemplating withdrawal
    (end of s_6), player cannot advance to prosecution dismissal or changing attorneys
    before Professor Stromwell helps Elle regain confidence.
  id: c_7
  satisfaction_condition: Node s_6 completed with Stromwell's encouragement and Elle
    recommitting to law school.
  type: invariant
  violation_condition: Player triggers Elle's dismissal or trial lead attorney appointment
    at s_7 or beyond before Stromwell intervention.
- description: Elle must formally be hired as Brooke's lead attorney after Callahan
    is dismissed, signifying Elle's legal responsibility before trial resolution actions
    can proceed.
  id: c_8
  satisfaction_condition: Node s_7 completed in which Brooke dismisses Callahan and
    hires Elle as lead attorney.
  type: achievement
  violation_condition: Player attempts to resolve trial outcomes, including exposing
    Chutney's lie or exonerating Brooke before Elle is officially lead counsel.
- description: Chutney's false alibi (washing permed hair) contradicting her testimony
    about hearing a gunshot must remain unresolved and unexposed before cross-examination
    under Elle's direct trial questioning at s_7.
  id: c_9
  satisfaction_condition: Prior to s_7 cross-examination, Chutney's alibi remains
    unrefuted and unchallenged by Elle.
  type: invariant
  violation_condition: Player preempts trial logic by revealing Chutney's alibi falsehood
    before proper cross-examination scene at s_7.
- description: Trial must conclude with Chutney's confession and Brooke's exoneration;
    this milestone is necessary to demonstrate Elle's legal success before narrative
    closure.
  id: c_10
  satisfaction_condition: 'Node s_8 completed: Chutney confesses, Brooke cleared,
    and justice served.'
  type: achievement
  violation_condition: Player attempts to end narrative or proceed to post-trial events
    without trial resolution at s_8.
- description: Elle rejects Warner's reconciliation attempt after trial resolution;
    this rejection must be explicit and persistent to establish Elle's independence.
  id: c_11
  satisfaction_condition: After s_8, player has triggered Elle's firm rejection of
    Warner's reconciliation attempts.
  type: invariant
  violation_condition: Player permits Elle to reconcile or continue romantic involvement
    with Warner post-trial resolution (after s_8).
- description: Elle's successful graduation with honors and full personal and professional
    transformation must be realized and celebrated by the narrative end.
  id: c_12
  satisfaction_condition: 'Node s_9 completed: Elle graduates with honors, delivers
    speech, and is placed in a prestigious law firm with mature relationships established.'
  type: achievement
  violation_condition: Narrative attempts to conclude or proceed to epilogue without
    Elle graduating, giving speech, or having matured relationships as described in
    s_9.
