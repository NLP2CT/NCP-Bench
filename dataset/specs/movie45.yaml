meta:
  genres: ["Comedy", "Romance"]
  id: movie45
  player_role: Elle Woods
  title: "Legally Blonde"
synopsis: In her senior year as a Southern California college student, girlish sorority
  president Elle Woods majors in fashion merchandising and is seriously in love with
  her boyfriend, Warner Huntington III, who will attend Harvard Law School the following
  year. She excitedly expects him to ask her to marry him, but instead he breaks up
  with her. Desperate to win Warner back, Elle studies for and passes the law-school
  entrance exam, applies to Harvard, and is accepted. Upon arriving at Harvard, her
  classmates disapprove of her because of her naivete, and she discovers that Warner
  is engaged to another student, Vivian Kensington. The only friend Elle makes is
  Paulette, a divorced manicurist. Elle later helps Paulette gain custody of her dog
  back from her ex-husband as well as seduce the delivery man on whom she has a crush.
  After Vivian tricks Elle into attending a party in a Playboy Bunny costume, Elle
  has a discussion with Warner and finally realizes he will never respect her. Now
  determined to succeed on her own, Elle studies hard and wins an internship with
  Professor Callahan, as do Warner and Vivian. They work with Callahan and an associate,
  attorney Emmett Richmond, to defend Brooke Taylor-Windham, a famous fitness instructor
  accused of murdering her much older billionaire husband, Hayworth Windham. Brooke
  was once Elle's fitness instructor and a member of her sorority. Elle believes Brooke
  is innocent, but Brooke's stepdaughter, Chutney, and the household cabana boy say
  she is guilty, and that they saw Brooke standing over Windham's dead body, covered
  in his blood, while Brooke testifies that she loved her husband and only found him
  after he had been shot to death. Brooke refuses to provide Callahan an alibi, but
  when Elle visits her in prison, Brooke admits that she had liposuction on the day
  of the murder. Public knowledge of this fact would ruin Brooke's reputation as a
  fitness instructor, so Elle agrees to keep it secret and refuses to reveal the alibi
  to Callahan. Impressed by her integrity, Vivian starts to befriend Elle, also admitting
  that Warner was put on Harvard's wait-list and only got in because his father pulled
  some strings. The case against Brooke begins to weaken when Elle deduces that the
  cabana boy is gay after he correctly identifies Elle's shoe style. During the cross-examination,
  Emmett tricks him into identifying his boyfriend in court, proving that his testimony
  about having an affair with Brooke was a lie. Impressed by her performance, Callahan
  discusses Elle's future with her and then makes sexual advances on her, which Elle
  immediately rejects. Overhearing part of the conversation, Vivian is frustrated
  by Elle apparently using her sexuality to gain her internship. Elle, also thinking
  that Callahan chose her for sexual reasons, decides to leave law school. Professor
  Stromwell, who once removed Elle from her class for being unprepared, helps regain
  Elle's spirit. Meanwhile, Emmett explains Elle's encounter with Callahan to Vivian
  and Brooke. Brooke is enraged by that and Vivian realizes her mistake. Before the
  trial continues, Brooke dismisses Callahan and hires Elle as her new attorney with
  Emmett supervising. Elle begins shakily while cross-examining Chutney, who testifies
  that she was home during her father's murder, but did not hear the gunshot because
  she was in the shower washing her hair after getting her hair permed earlier that
  day. Elle gets Chutney to reconfirm her story, then reveals that washing permed
  hair within the first 24 hours would have deactivated the ammonium thioglycolate,
  and Chutney's curls are still intact. Exposed, Chutney admits to killing Hayworth
  accidentally because she thought he was Brooke, whom she hated for marrying her
  father because she was Chutney's age. Brooke is exonerated, and Chutney is arrested.
  After the trial, Warner tries to reconcile with Elle, but she rejects him, explaining
  that she needs a boyfriend who is less of a "bonehead" in her new career. Two years
  later, Elle, who has graduated with high honors, is the class-elected speaker at
  the ceremony, and has been invited into one of Boston's best law firms; Vivian is
  now Elle's best friend and has called off her engagement with Warner, who graduated
  without honors and no girlfriend and with no job offers; Paulette has married her
  delivery man and is expecting a baby girl to be named after Elle; and finally, Emmett
  has started his own practice, is now Elle's boyfriend, and will propose to her that
  night.
trajectory:
- description: Elle Woods is a Southern California college student in her senior year,
    serving as sorority president and majoring in fashion merchandising. She is happily
    in love with her boyfriend, Warner Huntington III, who is preparing to attend
    Harvard Law School next year.
  id: s_0
  key_delta: Elle's expectations of engagement are shattered, introducing the motivation
    to win Warner back.
  trigger_event: Warner Huntington III breaks up with Elle instead of proposing marriage.
- description: Elle decides to take control of her future by preparing for law school;
    she studies for and passes the law-school entrance exam and applies to Harvard.
  id: s_1
  key_delta: Elle gains admission to Harvard Law, setting her on a new academic and
    personal path.
  trigger_event: Elle receives her acceptance letter from Harvard Law School.
- description: Elle arrives at Harvard Law School and faces disapproval and ridicule
    from classmates due to her girlish naivete. She discovers Warner is engaged to
    another student, Vivian Kensington. Paulette, a divorced manicurist, becomes Elle's
    only friend.
  id: s_2
  key_delta: Elle forms a loyal friendship with Paulette, gaining personal support
    at Harvard.
  trigger_event: Elle meets Paulette and helps her regain custody of her dog and start
    a relationship with the delivery man.
- description: At a party, Vivian tricks Elle into attending dressed as a Playboy
    Bunny. After a confrontational discussion with Warner, Elle ends contact realizing
    Warner will never respect her.
  id: s_3
  key_delta: Elle shifts from pursuing Warner to committing to her own academic and
    professional development.
  trigger_event: Elle decides to focus on her own success and works hard to secure
    an internship with Professor Callahan.
- description: Elle, Warner, and Vivian all work as interns with Professor Callahan
    and Emmett Richmond. They prepare to defend Brooke Taylor-Windham, a fitness instructor
    accused of murdering her billionaire husband.
  id: s_4
  key_delta: Elle gains confidential knowledge about Brooke’s alibi and establishes
    trust, affecting the defense strategy.
  trigger_event: Elle visits Brooke in prison and learns Brooke had liposuction on
    the day of the murder, which she agrees to keep secret.
- description: Impressed by Elle's integrity in keeping Brooke's secret, Vivian begins
    to befriend Elle and reveals that Warner only got into Harvard through his father's
    influence.
  id: s_5
  key_delta: The key prosecution witness is discredited, weakening the case against
    Brooke.
  trigger_event: During the trial, Elle deduces the cabana boy is lying and, with
    Emmett’s help, exposes his false testimony.
- description: After Elle's strong performance, Callahan makes a sexual advance which
    Elle rejects. Vivian overhears a misunderstanding and resents Elle, who then decides
    to leave Harvard Law School.
  id: s_6
  key_delta: Elle overcomes disillusionment and recommits to her legal studies.
  trigger_event: Professor Stromwell intervenes and encourages Elle to regain her
    confidence and stay in law school.
- description: Emmett clarifies the misunderstanding about Callahan to Vivian and
    Brooke. Brooke dismisses Callahan and hires Elle as her lead attorney with Emmett
    supervising.
  id: s_7
  key_delta: Chutney’s fabricated story collapses, revealing her as the true murderer.
  trigger_event: During cross-examination, Elle exposes Chutney’s false alibi by demonstrating
    that Chutney’s hair is still curled despite claiming to have washed it that day.
- description: Chutney confesses to accidentally killing her father, Brooke is exonerated,
    and Chutney is arrested. Elle has proven her capability as a lawyer.
  id: s_8
  key_delta: Elle breaks free from her past relationship, affirming her independence
    and self-respect.
  trigger_event: Warner approaches Elle to reconcile, but she rejects him, seeking
    a more mature partner.
- description: 'Two years later, Elle has graduated Harvard Law with high honors,
    is the class speaker, has a prestigious job offer, and her relationships have
    matured: Vivian is her best friend, Warner is unattached and less successful,
    Paulette is married and expecting a child named after Elle, and Emmett is her
    boyfriend preparing to propose.'
  id: s_9
  key_delta: Elle's full professional and personal transformation is realized and
    celebrated.
  trigger_event: Elle prepares for the graduation ceremony where she will deliver
    the commencement speech.
