meta:
  genres: ["Sci-Fi", "Adventure"]
  id: movie63
  player_role: Han Solo
  title: "Star Wars——A New Hope"
synopsis: The film begins with an opening crawl explaining that the galaxy is in a
  state of civil war and that spies for the Rebel Alliance have stolen plans to the
  Galactic Empire's Death Star, a heavily armed and armored space station capable
  of annihilating an entire planet. Rebel leader Princess Leia is in possession of
  the plans, but her ship is captured by Imperial forces under the command of the
  evil lord Darth Vader. Before she is captured, Leia hides the plans in the memory
  of an astromech droid called R2-D2, along with a holographic recording. The small
  droid flees to the surface of the desert planet Tatooine with fellow protocol droid
  C-3PO. The droids are quickly captured by Jawa traders, who sell the pair to moisture
  farmers Owen and Beru Lars and their nephew, Luke Skywalker. While Luke is cleaning
  R2-D2, he accidentally triggers part of Leia's message, in which she requests help
  from Obi-Wan Kenobi. The only "Kenobi" Luke knows of is an old hermit named Ben
  Kenobi who lives in the nearby hills. The next morning, upon finding R2-D2 after
  he escapes to seek Obi-Wan, Luke meets Ben Kenobi, revealing himself to be Obi-Wan.
  Obi-Wan tells Luke of his days as a Jedi Knight, one of a faction of former galactic
  peacekeepers who were wiped out by the Empire. Contrary to his uncle's statements,
  Luke learns that his father Anakin Skywalker fought alongside Obi-Wan as a Jedi
  Knight before he was betrayed and killed by Vader, Obi-Wan's former pupil who turned
  to the "dark side of the Force", and gives Luke his father's lightsaber. Obi-Wan
  views Leia's complete message in which she begs Obi-Wan to take the Death Star plans
  to her home planet of Alderaan for her father to retrieve and analyze. He then asks
  Luke to accompany him and learn the ways of the Force. Luke initially refuses, but
  changes his mind after discovering that Imperial stormtroopers have destroyed his
  home and killed his aunt and uncle in search of C-3PO and R2-D2. Obi-Wan and Luke
  hire smuggler Han Solo and his Wookiee first mate Chewbacca to transport them on
  their ship, the Millennium Falcon. Upon the Falcon's arrival at Alderaan, they find
  that the planet has been destroyed under the orders of the Death Star's commanding
  officer Grand Moff Tarkin to demonstrate the Death Star's power. The Falcon is caught
  by the nearby Death Star's tractor beam and brought into its hangar bay. While Obi-Wan
  goes off to disable the tractor beam, Luke discovers that Leia is imprisoned on
  board and, with the help of Han and Chewbacca, rescues her. After several harrowing
  escapes, they make their way back to the Falcon, but Obi-Wan sacrifices himself
  in a lightsaber duel with Vader. The Falcon escapes the Death Star but the Empire
  has placed a tracking device on the ship to follow them to the rebels' hidden base
  on Yavin IV. The rebels analyze the Death Star plans, disclosing a vulnerable exhaust
  port leading to the station's main reactor. Luke joins the assault team, but Han
  collects his reward for the rescue and plans to leave despite Luke asking him to
  stay. The rebels suffer heavy losses after several failed attack runs, leaving Luke
  one of the few surviving pilots. Vader and a group of TIE fighters are about to
  destroy Luke's ship, but Han Solo returns at the last moment and destroys the TIE
  Fighters and the blast sends Vader spiraling away. Then Luke successfully destroys
  the Death Star seconds before it can fire on the rebel base. Luke and Han are subsequently
  awarded medals by Leia for their heroism.
trajectory:
- description: Han Solo is aboard the Millennium Falcon, a fast and heavily armed
    starship, co-piloting alongside his Wookiee first mate Chewbacca, while the galaxy
    is engulfed in a civil war between the Rebel Alliance and the Galactic Empire.
  id: s_0
  key_delta: Han Solo and Chewbacca agree to transport Obi-Wan Kenobi and Luke Skywalker
    aboard the Millennium Falcon.
  trigger_event: The Millennium Falcon receives a request for transport from Obi-Wan
    Kenobi and Luke Skywalker.
- description: The Millennium Falcon approaches the planet Alderaan, a peaceful world
    connected to the Rebel Alliance, preparing to deliver the stolen Death Star plans.
  id: s_1
  key_delta: Alderaan has been completely destroyed by the Death Star under orders
    from Grand Moff Tarkin.
  trigger_event: The ship arrives in orbit around Alderaan but finds the planet has
    been destroyed.
- description: The Millennium Falcon is pulled into the Death Star’s hangar bay by
    a tractor beam, trapped inside the Galactic Empire's massive space station.
  id: s_2
  key_delta: The Falcon is immobilized inside the Death Star and Obi-Wan begins a
    covert mission aboard the station.
  trigger_event: Obi-Wan Kenobi leaves the ship to disable the tractor beam.
- description: Han Solo is on the Millennium Falcon inside the Death Star with Luke
    Skywalker; they discover Princess Leia is imprisoned aboard the station.
  id: s_3
  key_delta: Princess Leia is rescued and joins the group aboard the Millennium Falcon.
  trigger_event: Luke, Han, and Chewbacca find and free Princess Leia from her cell.
- description: The group prepares to escape the Death Star with the stolen plans after
    several close calls and confrontations with Imperial forces.
  id: s_4
  key_delta: Obi-Wan Kenobi is killed, allowing the others to escape the Death Star.
  trigger_event: Obi-Wan Kenobi sacrifices himself in a duel with Darth Vader.
- description: The Millennium Falcon escapes the Death Star but is tracked by an Imperial
    device planted on the ship, leading the Empire to the Rebel base on Yavin IV.
  id: s_5
  key_delta: The Rebel Alliance learns of the Death Star’s exhaust port weakness and
    prepares an assault.
  trigger_event: Rebel commanders analyze the stolen Death Star plans, identifying
    a critical vulnerability.
- description: Han Solo is with Rebel forces preparing for an attack on the Death
    Star to prevent it from destroying their base and the Rebel Alliance.
  id: s_6
  key_delta: Several Rebel fighters are lost, and Han Solo initially prepares to leave
    after collecting his reward.
  trigger_event: Rebel pilots launch an attack run against the Death Star, encountering
    heavy Imperial resistance.
- description: During the climactic space battle, Luke’s starfighter is under heavy
    attack and nearly destroyed by Darth Vader and TIE fighters.
  id: s_7
  key_delta: Han Solo’s timely return saves Luke’s ship from destruction.
  trigger_event: Han Solo returns with reinforcements, attacking and destroying the
    pursuing TIE fighters.
- description: The Rebel forces seize the opportunity to concentrate fire on the Death
    Star, with Luke aiming a precise shot guided by the Force.
  id: s_8
  key_delta: The Death Star is destroyed, saving the Rebel base and striking a major
    blow against the Empire.
  trigger_event: Luke fires the proton torpedoes into the Death Star’s exhaust port,
    initiating its destruction.
- description: After the battle, Han Solo, Luke Skywalker, and Princess Leia stand
    among Rebel commanders in a celebratory ceremony at the Rebel base.
  id: s_9
  key_delta: Han Solo is officially recognized as a hero of the Rebel Alliance.
  trigger_event: The Rebel leadership awards Han Solo and Luke medals for their heroism
    and contributions.
