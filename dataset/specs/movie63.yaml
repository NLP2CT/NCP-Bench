commitments:
- description: The Millennium Falcon must agree to transport Obi-Wan Kenobi and Luke
    Skywalker before arriving at Alderaan or engaging further missions.
  id: c_0
  satisfaction_condition: s_0 has been completed before any progress on s_1 or later
    nodes.
  type: ordering
  violation_condition: Player attempts to navigate to or interact with Alderaan (s_1)
    or beyond without agreeing to transport Obi-Wan and Luke (completing s_0).
- description: Alderaan remains intact before s_1 and is confirmed destroyed at s_1;
    it must never be presented as intact after s_1.
  id: c_1
  satisfaction_condition: Alderaan is intact before arrival (prior to s_1), and the
    fact of its destruction is only acknowledged at s_1 and thereafter.
  type: invariant
  violation_condition: Player or system asserts Alderaan is intact after s_1 or before
    arrival, or Alderaan is portrayed destroyed prior to arrival at s_1.
- description: Obi-Wan Kenobi must leave the Millennium Falcon to disable the tractor
    beam only after the Falcon is trapped inside the Death Star (s_2).
  id: c_2
  satisfaction_condition: Action of Obi-Wan leaving the Falcon to disable the tractor
    beam occurs strictly at or after s_2.
  type: ordering
  violation_condition: Player or system allows Obi-Wan to undertake the disabling
    mission before the Falcon is caught in the tractor beam at s_2.
- description: Princess Leia must be found imprisoned within the Death Star and rescued
    before escape (s_3 completion).
  id: c_3
  satisfaction_condition: Leia's imprisonment is discovered and she is rescued on
    board the Death Star, completing s_3 before any escape attempts.
  type: achievement
  violation_condition: Escape attempts or progression beyond s_3 occur without Leia
    having been found and freed.
- description: Obi-Wan Kenobi's self-sacrifice in the duel with Darth Vader must occur
    before the Death Star escape sequence.
  id: c_4
  satisfaction_condition: Obi-Wan’s sacrifice event occurs at s_4 prior to any narrative
    advancement that includes escape from the Death Star.
  type: ordering
  violation_condition: Player escapes Death Star or moves narrative beyond s_4 without
    triggering Obi-Wan’s sacrifice.
- description: The Millennium Falcon carries a tracking device planted by the Empire
    after escaping the Death Star, which leads the Empire to the Rebel base (between
    s_4 and s_5).
  id: c_5
  satisfaction_condition: The system acknowledges the tracking device is planted post-s_4
    and prior to s_5; it remains active and known throughout s_5.
  type: invariant
  violation_condition: Tracking device is absent, disabled, or unknown to the Empire
    after escaping the Death Star (post-s_4, pre-s_5).
- description: The Rebel Alliance must identify the Death Star’s exhaust port weakness
    and prepare an assault before the battle (end of s_5).
  id: c_6
  satisfaction_condition: The Rebel commanders analyze and confirm the exhaust port
    vulnerability and launch preparations by s_5 completion.
  type: achievement
  violation_condition: Battle engagement or further assault actions occur without
    the Rebels having identified this critical weakness.
- description: Han Solo may prepare to leave after collecting his reward during the
    assault, but the narrative must allow for and acknowledge his return to assist
    Luke in battle (s_6 to s_7).
  id: c_7
  satisfaction_condition: Han Solo collects reward and prepares to leave, then returns
    in time to engage Imperial fighters at or before s_7.
  type: invariant
  violation_condition: Han leaves and does not return during the battle, specifically
    before s_7’s event where he saves Luke’s ship.
- description: Han Solo’s return and destruction of pursuing TIE fighters must occur
    before Luke’s successful destruction of the Death Star (s_7 strictly before s_8).
  id: c_8
  satisfaction_condition: Han’s reinforcements arrive and destroy TIE fighters (s_7)
    prior to Luke firing proton torpedoes and destroying the Death Star (s_8).
  type: ordering
  violation_condition: Luke destroys the Death Star (s_8) without Han first returning
    to save him at s_7.
- description: At the conclusion, Han Solo must be officially recognized as a hero
    of the Rebel Alliance with a medal awarded by Leia (s_9).
  id: c_9
  satisfaction_condition: Medal awarding ceremony including Han Solo occurs, marking
    his recognized heroism after the Death Star’s destruction.
  type: achievement
  violation_condition: Narrative advances to post-battle closure without Han receiving
    official recognition and a medal.
