commitments:
- description: The village remains vulnerable and under the threat of Calvera’s bandits
    before any defensive actions begin (from s_0 to s_3).
  id: c_0
  satisfaction_condition: In all nodes from s_0 up to and including s_3, Calvera’s
    bandits hold a credible threat over the village; no lasting defense or repulsion
    has yet occurred.
  type: invariant
  violation_condition: The system acknowledges the village as secure or effectively
    defended before s_4 or before gunmen begin training villagers in s_3.
- description: Chris and the other gunmen must be recruited before any defense or
    training of villagers begins.
  id: c_1
  satisfaction_condition: Nodes s_1 and s_2, where Chris agrees to help and gunmen
    are recruited, occur before s_3 where training commences.
  type: ordering
  violation_condition: Training or cooperative defense is acknowledged before the
    recruitment of Chris and the other gunmen (before s_1 or s_2).
- description: The villagers must successfully repel an initial bandit raid after
    training begins, demonstrating the effectiveness of their defense.
  id: c_2
  satisfaction_condition: Node s_4 is reached where the village, aided by the gunmen,
    repels Calvera’s bandits.
  type: achievement
  violation_condition: The village never effectively repels the bandits after training
    begins or the first raid ends in failure.
- description: Chico must infiltrate Calvera’s camp and learn the bandits’ desperation
    and plan to raid again before the gunmen decide to take offensive action.
  id: c_3
  satisfaction_condition: In node s_5, Chico successfully gains intelligence on Calvera’s
    intentions; this knowledge exists before s_7’s surprise attack.
  type: invariant
  violation_condition: The gunmen launch a surprise attack or plan offensive action
    based on knowledge of Calvera’s plans before Chico’s infiltration and intelligence
    gathering (before s_5).
- description: The gunmen’s decision to defend or abandon the village after gaining
    intelligence must come before the offensive surprise raid on Calvera’s camp.
  id: c_4
  satisfaction_condition: Node s_6, where the gunmen debate and decide on their course,
    precedes s_7, the surprise raid.
  type: ordering
  violation_condition: The system allows s_7 (raid) to occur before the gunmen’s informed
    decision-making and debate in s_6.
- description: Calvera’s bandit camp must be found abandoned at the time of the gunmen’s
    surprise raid.
  id: c_5
  satisfaction_condition: At s_8, the gunmen discover the bandit camp empty.
  type: invariant
  violation_condition: The system recognizes the camp as occupied or defended during
    the surprise raid in s_7 or s_8.
- description: After the failed surprise raid, the village falls under Calvera’s control,
    and the gunmen are expelled before any further attempts to free the village.
  id: c_6
  satisfaction_condition: In s_8 and s_9, the village is occupied by bandits, and
    the gunmen are driven out.
  type: invariant
  violation_condition: The gunmen retain control or freedom of action inside the village
    after the failed raid or before the second assault attempts.
- description: The gunmen must collectively resolve to retake the village, except
    for Harry who leaves alone prior to the final battle.
  id: c_7
  satisfaction_condition: In s_9, most gunmen agree to return and free the village;
    Harry departs alone.
  type: achievement
  violation_condition: The group splits differently, or there is no clear decision
    to retake the village; Harry’s departure as a lone dissenter does not occur before
    final battle.
- description: The final gunfight in the village must follow the gunmen’s regrouping
    and decision to retake the village.
  id: c_8
  satisfaction_condition: s_10 occurs after s_9, as the direct consequence of the
    gunmen’s decision.
  type: ordering
  violation_condition: The battle (s_10) initiates before or without the prior regrouping
    and vow to fight from s_9.
- description: Key defenders must die during the final battle in the correct sequence,
    preserving their narrative roles and sacrifices.
  id: c_9
  satisfaction_condition: During s_11, Bernardo, Britt, Lee, and Harry die in battle
    as specified; deaths do not occur before the battle starts at s_10 or outside
    that context.
  type: invariant
  violation_condition: Any key defender dies before the battle begins or outside the
    battle flow, or their deaths happen out of sequence violating their narrative
    role.
- description: Chris must kill Calvera to end the bandit threat conclusively before
    the story ends.
  id: c_10
  satisfaction_condition: Node s_12, where Chris shoots and kills Calvera, is achieved.
  type: achievement
  violation_condition: The story concludes without Chris killing Calvera or the bandit
    threat remaining active.
- description: After the final battle, Chico must commit to staying with the village
    while Chris and Vin leave, preserving the thematic closure.
  id: c_11
  satisfaction_condition: At s_13, Chico announces his decision to stay; Chris and
    Vin depart.
  type: invariant
  violation_condition: Chico leaves or the gunmen remain engaged indefinitely, disrupting
    the story’s resolution and thematic intent.
- description: The narrative fatalism that only the villagers truly ‘win’ must be
    preserved at the story’s conclusion.
  id: c_12
  satisfaction_condition: In s_13, the village elder’s statement and Chris’s fatalistic
    remark about only the farmers winning remain intact.
  type: invariant
  violation_condition: The narrative ends with a triumphant, unambiguous victory for
    the gunmen or erases the villagers’ ultimate survival as key thematic closure.
