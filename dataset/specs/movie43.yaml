meta:
  genres: ["Romance", "Comedy"]
  id: movie43
  player_role: Leopold
  title: "Kate & Leopold"
synopsis: In 1876, Leopold Alexis Elijah Walker Thomas Gareth Mountbatten, Duke of
  Albany, is a stifled dreamer. Strict Uncle Millard has no patience for Leopold's
  disrespect for the monarchy, chastising him and telling him he must marry a rich
  American, as the Mountbatten family finances are depleted. His uncle has told him
  that on his "thirtieth birthday he had become a blemish to the family name". The
  Duke finds Stuart Besser, an amateur physicist perusing his schematic diagrams and
  taking photographs of them. He had seen him earlier at Roebling's speech about the
  Brooklyn Bridge. Leopold follows Stuart and tries to save him from falling off the
  unfinished bridge; only to fall with him into a temporal portal between centuries.
  Leopold awakens in 21st century New York. He is at first confused and thinks that
  he has been kidnapped. Stuart says that he has created formulae to forecast portals
  in the temporal universe and that Leopold must stay inside his apartment until the
  portal opens again a week later. As Stuart takes his dog out, he is injured by falling
  into the elevator shaft, and is eventually institutionalized for speaking about
  his scientific discovery. Leopold is intrigued by the cynical and ambitious Kate
  McKay, Stuart's ex-girlfriend, who comes to the apartment for her Palm Pilot stylus.
  He observes that she is a "career woman" and that her field, market research, is
  a fine avocation for a woman and states that he once dated a librarian from Sussex.
  Kate dismisses him and demands that he take Stuart's dog for a walk. Leopold is
  overwhelmed to see that Roebling's bridge is still standing. Back at the apartment,
  he befriends Charlie, Kate's brother and an actor between gigs, who believes him
  to be an actor as well, steadfast to his character. Kate and Leopold become romantically
  involved, as they dine and tour New York. When shooting begins on the commercial
  in which Leopold has agreed to act, he finds the product, diet margarine, disgusting.
  He cannot understand how Kate would have him endorse a flawed item without qualms,
  and declares that "when someone is involved in something entirely without merit,
  one withdraws". Echoing his uncle, Kate says that sometimes one has to do things
  one doesn't want to. He chides her about integrity. She retorts, "I don't have time
  for pious speeches from two hundred year old men who have not worked a day in their
  life". Their dalliance seems at an end. Stuart escapes from the mental hospital,
  and sends Leopold back to his own time. That night, while Kate is accepting her
  promotion at a company banquet, Stuart and Charlie are racing to meet her. Moments
  before she goes on stage, they arrive and produce pictures from Stuart's camera that show
  her in 1876. Stuart says that he had thought he disrupted the spacetime continuum,
  but actually "the whole thing is a beautiful 4-D pretzel of kismetic inevitability".
  Kate chooses a life with Leopold over her career, and the three of them escape to
  the Brooklyn Bridge. There, catching the portal before it closes at midnight, Kate
  vanishes into 1876, where Leopold appears resigned to be pragmatic, as Kate and
  his uncle had advised him, and marry Miss Tree for her family fortune; but, just
  as he is about to announce his intention to become engaged to Miss Tree, as he opens
  his mouth to speak, he sees Kate and announces her name, Kate McKay, as his bride-to-be.
  In the closing scene, they kiss and the camera is drawn outward showing a grandfather's
  clock depicting 12:15.
trajectory:
- description: In 1876, Leopold Alexis Elijah Walker Thomas Gareth Mountbatten, Duke
    of Albany, is at his family estate feeling constrained and pressured by the strict
    atmosphere imposed by his uncle Millard, who demands he marry a rich American
    to rescue the depleted Mountbatten finances and calls him a blemish to the family.
  id: s_0
  key_delta: Introduction of Leopold's familial conflict, financial pressures on the
    Mountbatten family, and the expectation to marry for money rather than love.
  trigger_event: Uncle Millard reprimands Leopold for disrespecting the monarchy and
    insists he marry a wealthy American by his thirtieth birthday.
- description: Leopold encounters Stuart Besser, an amateur physicist, poring over
    schematic diagrams and taking photographs during a public speech about the construction
    of the Brooklyn Bridge in 1876.
  id: s_1
  key_delta: Leopold identifies Stuart as a person of interest connected to the Brooklyn
    Bridge and its scientific mysteries.
  trigger_event: Leopold observes Stuart studying the bridge schematics and photographs
    at the speech and decides to follow him.
- description: Leopold and Stuart are on the unfinished Brooklyn Bridge when Stuart
    nearly falls off; Leopold attempts to save him, but both fall through a temporal
    portal bridging the 19th and 21st centuries.
  id: s_2
  key_delta: Leopold is transported from 1876 to the 21st century, entering an unfamiliar
    modern environment and timeline.
  trigger_event: Leopold tries to prevent Stuart from falling off the bridge, resulting
    in both falling through a portal to the 21st century.
- description: Leopold awakens inside Stuart's modern-day New York apartment and initially
    believes he has been kidnapped amid the unfamiliar surroundings of the 21st century.
  id: s_3
  key_delta: Leopold gains physical presence in the 21st century but remains disoriented
    and unaware of temporal mechanics at play.
  trigger_event: Leopold regains consciousness in Stuart's apartment after arriving
    through the portal.
- description: Stuart explains to Leopold the existence of formulae predicting temporal
    portals and instructs him to remain indoors until the portal reopens in one week,
    beginning to reveal the scientific framework behind Leopold's displacement.
  id: s_4
  key_delta: Leopold learns about temporal portals and his limited ability to move
    through time, imposing confinement within the modern apartment.
  trigger_event: Stuart describes his scientific discovery and requests Leopold stay
    inside until the next portal appears.
- description: Stuart leaves the apartment to walk his dog, but suffers an accident
    by falling into an elevator shaft and is subsequently institutionalized after
    expressing his scientific theories publicly.
  id: s_5
  key_delta: Stuart becomes unavailable to assist Leopold; the sole scientific guide
    is removed from the situation, leaving Leopold isolated.
  trigger_event: Stuart exits the apartment with his dog and falls down the elevator
    shaft, leading to his hospitalization.
- description: Kate McKay, Stuart's pragmatic ex-girlfriend and career-driven market
    researcher, arrives at the apartment to retrieve her Palm Pilot stylus; Leopold
    observes her modern demeanor and interacts with her.
  id: s_6
  key_delta: Introduction of a new social connection in the 21st century and a contrasting
    worldview embodied by Kate.
  trigger_event: Kate arrives to collect a forgotten item, entering the apartment
    inhabited by Leopold.
- description: Leopold, overwhelmed by the sight of the still-standing Brooklyn Bridge,
    befriends Charlie, Kate's brother and a struggling actor who mistakes him for
    a fellow performer devoted to his role.
  id: s_7
  key_delta: Leopold establishes social ties in the modern world, deepening his integration
    and support network.
  trigger_event: Leopold accompanies Kate and meets Charlie, who invites him into
    his circle under a misapprehension.
- description: Leopold and Kate develop a romantic relationship as they share meals
    and tour New York, blending Victorian ideals with contemporary life experiences.
  id: s_8
  key_delta: Leopold forms an emotional bond with Kate, creating personal stakes spanning
    time periods.
  trigger_event: Kate and Leopold spend time together socially, leading to mutual
    romantic involvement.
- description: Leopold acts in a commercial for diet margarine directed by Kate but
    is disgusted by endorsing a product he finds flawed, leading to a clash over integrity
    and compromises in modern work life.
  id: s_9
  key_delta: Leopold confronts cultural and ethical differences in 21st-century commerce,
    causing tension with Kate.
  trigger_event: Filming of the commercial begins with Leopold in front of the camera
    supporting the margarine product.
- description: Kate retorts to Leopold’s objections with a pragmatic dismissal, emphasizing
    the necessity of compromise and hard work, prompting a rift that threatens their
    relationship.
  id: s_10
  key_delta: Conflict crystallizes between Leopold’s Victorian values and Kate’s modern
    realism, straining their romance.
  trigger_event: Kate responds sharply to Leopold’s integrity speech during the commercial
    shoot.
- description: Stuart escapes from the mental hospital and contacts Leopold, sending
    him back through the temporal portal to 1876, reinitiating the timeline’s causal
    loop.
  id: s_11
  key_delta: Leopold transitions back to 1876, maintaining memory of the 21st century
    and setting up potential historical alterations.
  trigger_event: Stuart’s escape and communication facilitate Leopold’s return to
    his original time period.
- description: On the night Kate receives a promotion at a corporate banquet, Stuart
    and Charlie race to present photographs from Stuart’s camera, proving Kate’s
    presence in 1876 and affirming the temporal link.
  id: s_12
  key_delta: Concrete proof of time travel and intertwined destinies between Leopold
    and Kate is established publicly.
  trigger_event: Stuart and Charlie arrive just before Kate’s banquet speech to show
    evidence of her temporal connection.
- description: Kate chooses to leave her corporate career behind and embrace a life
    with Leopold, and together with Stuart, they go to the Brooklyn Bridge portal
    at midnight.
  id: s_13
  key_delta: Kate alters her personal timeline by entering the past, merging two eras
    through her relationship with Leopold.
  trigger_event: Kate decides to cross the portal, symbolizing her commitment to a
    life in 1876.
- description: Back in 1876, Leopold, pressured by practical considerations and family
    advice, prepares to announce his engagement to the wealthy Miss Tree but is interrupted
    when he publicly proclaims Kate McKay as his intended bride.
  id: s_14
  key_delta: Leopold defies expectations by choosing love over financial expedience,
    altering his predetermined future.
  trigger_event: Leopold steps forward to announce his engagement at a family gathering.
- description: Leopold and Kate kiss as the camera pulls away to reveal a grandfather
    clock marking 12:15, symbolizing the convergence of time and their unified destinies.
  id: s_15
  key_delta: Resolution of the temporal and romantic threads, affirming their commitment
    across time and the story’s closure.
  trigger_event: The couple shares a kiss in the closing moment after the engagement
    announcement.
