commitments:
- description: 'Frank must not accept to transport more or fewer than the originally
    agreed number of passengers before resolving any violation of Rule #1.'
  id: c_0
  satisfaction_condition: From s_0 until delivery at s_3, Frank only transports the
    agreed three men; no unauthorized passengers are allowed in the vehicle.
  type: invariant
  violation_condition: Player permits transport to proceed with a passenger number
    different from the agreed three without first addressing or resetting the transport
    conditions.
- description: 'Frank cannot accept or agree to modify the original deal once it is
    set (Rule #1: ''No new deals, when it''s a deal, it''s a deal'').'
  id: c_1
  satisfaction_condition: From s_0 through s_3 and continuing at future transport
    tasks, Frank refuses any offer that changes the terms of an existing transport
    agreement.
  type: invariant
  violation_condition: 'Player actions lead Frank to accept altered terms or additional
    transport conditions after a deal is confirmed, contradicting Rule #1.'
- description: 'Frank must not open the package during transport unless an unavoidable
    emergency justifies it (Rule #3: ''Don''t open the package'' upheld until the
    flat tire event at s_6).'
  id: c_2
  satisfaction_condition: Between s_5 and s_6, the package remains sealed and unopened
    unless explicitly triggered by the flat tire incident.
  type: invariant
  violation_condition: Player opens the package prematurely, outside of the authorized
    emergency context associated with s_6.
- description: Frank must discover Lai inside the package (s_6) before any knowledge
    of her identity or engagement with Wall Street's criminal network is revealed.
  id: c_3
  satisfaction_condition: Node s_6 (opening the package and discovering Lai) occurs
    before s_7 and later nodes involving Lai's background or the trafficking plot.
  type: ordering
  violation_condition: Player accesses Lai’s identity, background, or trafficking
    knowledge before opening the package to discover her physically.
- description: Frank must be attacked by the briefcase bomb (s_8) before he initiates
    active hostility toward Wall Street (s_9).
  id: c_4
  satisfaction_condition: The briefcase explosion event s_8 occurs prior to s_9 where
    Frank retaliates against Wall Street.
  type: ordering
  violation_condition: Player provokes or initiates hostile actions against Wall Street
    before the briefcase bomb attack happens.
- description: 'Frank and Lai must maintain fabricated cover stories during police
    interrogation (Rule #2: ''No names'' extended to avoid revealing Lai’s true status
    until necessary).'
  id: c_5
  satisfaction_condition: Between s_10 and s_13, Lai and Frank consistently deny or
    obscure Lai’s true relationship and background to police inquiries.
  type: invariant
  violation_condition: Player reveals Lai’s true identity or relationship to Frank
    prematurely during police questioning prior to s_13.
- description: Frank and Lai must successfully access and obtain credible intelligence
    about Wall Street’s human trafficking operation before confronting the traffickers
    directly.
  id: c_6
  satisfaction_condition: By s_12, Lai has hacked police computer records and provided
    Frank with actionable information about the trafficking operation.
  type: achievement
  violation_condition: Player attempts to confront or make legal accusations against
    Wall Street’s trafficking operation without first obtaining intelligence at s_12.
- description: Frank must be framed and arrested (s_13) before he escapes custody
    to directly intervene in the trafficking operation (s_14).
  id: c_7
  satisfaction_condition: Node s_13 (arrest) precedes s_14 (escape and intervention).
  type: ordering
  violation_condition: Player bypasses arrest and escape steps, directly proceeding
    to dock intervention without arrest occurring.
- description: Frank must eliminate Wall Street and neutralize immediate threats before
    rescuing the trafficking victims, marking the climax of hostile engagement.
  id: c_8
  satisfaction_condition: At s_15, Frank kills Wall Street and henchmen; Lai shoots
    her father, effectively neutralizing key antagonists.
  type: achievement
  violation_condition: Player attempts to rescue victims or end the trafficking operation
    without first eliminating Wall Street and the trafficker leadership.
- description: The human trafficking victims must be safely rescued as the narrative
    resolution after defeating the traffickers.
  id: c_9
  satisfaction_condition: At s_16, victims are released from shipping containers and
    assisted by Frank, Lai, and police.
  type: achievement
  violation_condition: Player concludes or ends narrative conflict without effecting
    the rescue of trafficking victims at s_16.
- description: Player cannot obtain official police clearance or dismissal of suspicion
    regarding Frank’s role before key evidence patterns unfold and proper investigative
    steps complete.
  id: c_10
  satisfaction_condition: Until s_16, Inspector Tarconi remains suspicious and no
    official exoneration is granted to Frank.
  type: invariant
  violation_condition: Player prematurely clears Frank from suspicion or obtains police
    exoneration before reaching s_16.
