commitments:
- description: Ensure Mary Swanson is introduced via Lloyd's limo pickup before any
    knowledge or action related to her or the briefcase occurs.
  id: c_0
  satisfaction_condition: Node s_0 (Lloyd picks up Mary) must occur before any player
    or system acknowledgement of Mary or the briefcase.
  type: ordering
  violation_condition: Player attempts to act on or reference Mary or the briefcase
    prior to completion of s_0.
- description: Lloyd and Harry lose their jobs only after the respective failing actions
    at the airport and dog grooming job; unemployment status remains true from s_2
    onward until new employment or story end.
  id: c_1
  satisfaction_condition: After s_2, both Lloyd and Harry are unemployed and this
    state remains until the story resolves or they seek new work.
  type: invariant
  violation_condition: Player circumvents or negates losing of either job before s_2,
    or regains employment without narrative justification before story end.
- description: The decision to move to Aspen (s_4) must logically follow the loss
    of jobs and robbery (s_2 and s_3), preserving narrative causal progression.
  id: c_2
  satisfaction_condition: Nodes s_2 (both unemployed) and s_3 (robbery) occur before
    s_4 (decision to leave Providence).
  type: ordering
  violation_condition: Player triggers decision to leave Providence before jobs are
    lost and money is stolen.
- description: By s_5, the kidnappers have identified the briefcase as ransom money
    and retaliated against Harry and Lloyd, while Harry and Lloyd themselves remain
    unaware of the briefcase's true contents until Aspen.
  id: c_3
  satisfaction_condition: After s_5, the kidnappers' retaliation and Petey's death
    are established, but Harry and Lloyd do not discover the briefcase contains ransom
    money until s_11.
  type: invariant
  violation_condition: Player causes Harry and Lloyd to discover the ransom money
    before s_11, causes kidnappers' retaliation before s_5, or negates Petey's death
    after s_5.
- description: Travel encounters and related events occur in correct sequence (picking
    up Mental and family at s_6, Mental's incapacitation and death at s_7, rest stop
    chaos at s_8, navigation error at s_9 and transport trade at s_10).
  id: c_4
  satisfaction_condition: Series of nodes s_6 through s_10 occur strictly in ascending
    order with no skips or reversals.
  type: ordering
  violation_condition: Player attempts to access later events (e.g., minibike trip)
    without prior encounters or causes logical contradiction in event order.
- description: Arrival in Aspen with ransom money and spending of it must occur (s_11)
    before relational and social interactions with Mary (s_12 and beyond).
  id: c_5
  satisfaction_condition: Node s_11 is reached and ransom money is spent before Harry's
    accidental charm and meeting Mary transitions the relationship status.
  type: achievement
  violation_condition: Player tries to initiate relationship developments or luxury
    spending without the arrival and acquisition of ransom money.
- description: Harry's accidental romantic involvement with Mary and Lloyd's jealousy
    must remain logically consistent from s_12 through s_13, with Lloyd sabotaging
    Harry's date.
  id: c_6
  satisfaction_condition: Harry's charming Mary and arranging a date without Lloyd's
    knowledge is accepted as true during s_12 and s_13; Lloyd sabotages the date as
    per s_13.
  type: invariant
  violation_condition: Player negates Harry's charm or date arrangement, or bypasses
    Lloyd's sabotage causing a contradictory relationship state.
- description: Nicholas's hostage taking and the subsequent events (s_14 and s_15)
    must occur after expenditure of ransom money and interpersonal conflicts (s_11
    to s_13).
  id: c_7
  satisfaction_condition: Order of nodes s_11 through s_15 is preserved, with hostage
    taking and rescue following the lavish spending and interpersonal conflict.
  type: ordering
  violation_condition: Player jumps to hostage event before ransom money spending
    or relationship events occur, or resolves hostage crisis prematurely.
- description: Harry is apparently shot but regains consciousness in s_15 facilitating
    Nicholas's capture and hostage rescue; this critical event must hold true when
    s_15 triggers.
  id: c_8
  satisfaction_condition: At s_15, Harry's apparent death and revival are both consistently
    established in narrative and player knowledge.
  type: invariant
  violation_condition: Player circumvents or contradicts Harry’s apparent shooting
    or prevents his timely revival during s_15.
- description: The FBI confiscates ransom money and Harry and Lloyd must lose their
    lavish lifestyle by s_16; subsequent impoverished departure from Aspen is mandatory.
  id: c_9
  satisfaction_condition: After s_16, Harry and Lloyd no longer possess ransom money
    or lavish assets and depart Aspen on foot.
  type: invariant
  violation_condition: Player retains or gains ransom money or lavish assets after
    s_16, or avoids leaving Aspen on foot post-confiscation.
- description: The encounter with Hawaiian Tropic models (s_17) and the missed opportunity
    occurs strictly after the loss of wealth and departure on foot (s_16).
  id: c_10
  satisfaction_condition: Node s_17 occurs after s_16 with no bypassing or reordering.
  type: ordering
  violation_condition: Player encounters or capitalizes on models before losing money
    or departing Aspen.
- description: Harry and Lloyd remain best friends and optimistic throughout all story
    progression nodes from start to end (s_0 to s_18).
  id: c_11
  satisfaction_condition: At any node between s_0 and s_18, Harry and Lloyd maintain
    their friendship and good-natured spirit without betrayal or permanent schism.
  type: invariant
  violation_condition: Player triggers a permanent rupture or enmity between Harry
    and Lloyd violating their core relationship.
