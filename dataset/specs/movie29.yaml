meta:
  genres: ["Comedy", "Adventure"]
  id: movie29
  player_role: Harry Dunne
  title: "Dumb and Dumber"
synopsis: Lloyd Christmas and Harry Dunne are two good natured, though incredibly
  inept best friends and roommates who share an apartment in Providence. One day while
  Lloyd is working as a limo driver, he picks up Mary Swanson who is on her way to
  the airport. When inquired where she is going, she mentions she is flying to Aspen
  and Lloyd immediately develops a crush on her. After dropping her off, he notices
  her leaving a briefcase in the airport terminal and rushes to return it only to
  fail and to lose his job in the process. Meanwhile, Harry, who is a dog groomer
  loses his job when he feeds a caravan of animals junk food on their way to a Dog
  Show. Later that night, after he is robbed of their food and remaining money by
  a little old lady, Lloyd suggests they leave Providence and start a new life in
  Aspen, while hesitant to the idea, Harry sees how deeply interested Lloyd is in
  doing this and agrees. Unbeknownst to the pair, however, Mary Swanson's husband
  had been kidnapped the suitcase Lloyd has contains ransom money, the kidnappers
  receive word that Lloyd and Harry have the money and kill Harry's bird Petey in
  retaliation. As they are leaving, Lloyd scores a little extra cash by selling some
  of their things including Petey to a blind kid who is convinced that the dead bird
  is very quiet, much to Harry's horror and amusement. Enroute to Aspen, Harry and
  Lloyd pick up one of the kidnappers, Mental, posing as a hitchhiker as well as a
  family of hispanic travelers who drive him crazy singing Mockingbird non-stop until
  they arrive at a gas station. Learning Mental has a penchant for avoiding spicy
  foods, Harry and Lloyd spike his food with hot peppers until he collapses from his
  sensitivity, inadvertently giving him Rat Poison pills intended for them instead
  of his heart medication and killing him. Later, Lloyd manages to trick a bullying
  trucker into paying for their meals at a rest stop, and innocently allow a police
  officer to drink urine from an open container of beer that Lloyd had to pee in when
  Harry refused to stop. Lloyd accidentally gets turned on the incorrect route while
  Harry is asleep, which infuriates him when they arrive in Nebraska instead of Colorado.
  But Lloyd redeems himself by trading in Harry's van for a minibike which takes them
  all the way to Aspen. Lloyd recognizes Mary in a newspaper promoting a fundraiser
  dinner, and the two find the suitcase has a lot of money in it, and immediately
  spend it lavishly. Renting a massive suite at the hotel, buying expensive cars and
  clothes including a pair of candy-colored outfits to wear to the formal. Lloyd is
  too nervous however to approach Mary and asks Harry to introduce them, but he unintentionally
  charms Mary who mistakes Harry's stupidity for intentional humor and they arrange
  a date to go skiing without Lloyd's knowledge. When Lloyd discovers that he's been
  stood up and his best friend is dating Mary he sabotages Harry's dinner date with
  her and goes in her place. When Nicholas, a family friend of the Swansons and secret
  mastermind behind Bobby's kidnapping discovers Harry and Lloyd spent all of his
  ransom money, he holds Lloyd and Mary hostage. Harry arrives and is apparently shot
  dead by him, but as he is about to kill Lloyd, Harry regains consciousness and helps
  send Nicholas into the hands of the authorities as part of a sting operation. Mary
  and Bobby are reunited and they give Lloyd and Harry special thanks for helping
  them. However, their lavish lifestyle is taken away from them, as Harry and Lloyd
  had spent the FBI's money and they leave Aspen on foot. Eventually coming across
  a bus load of Hawaiian Tropic bikini models looking for two towel boys to hire.
  Oblivious to the possibilities, Harry and Lloyd direct them to the nearest town,
  exclaiming how lucky two guys are going to be to have that opportunity as they continue
  on toward the horizon.
trajectory:
- description: Harry Dunne shares an apartment in Providence with his best friend
    Lloyd Christmas. Harry works as a dog groomer, and Lloyd works as a limo driver.
    They live a simple, modest life with limited means but good natured spirits.
  id: s_0
  key_delta: Introduction of Mary Swanson into their environment and Lloyd's immediate
    crush establishing a new personal interest.
  trigger_event: Lloyd picks up Mary Swanson as a limo passenger heading to the airport.
- description: Harry is at his dog grooming job managing a caravan of animals going
    to a Dog Show. Lloyd has just dropped Mary at the airport and notices she left
    a briefcase behind.
  id: s_1
  key_delta: Lloyd loses his job due to his failed attempt to return the briefcase;
    Harry is still employed but close to trouble.
  trigger_event: Lloyd attempts to return Mary's briefcase at the airport but fails
    and loses his job.
- description: Harry at his dog grooming job feeds the animals junk food and is about
    to face consequences. Lloyd has lost his limo driver job and is at home with Harry.
  id: s_2
  key_delta: Both Harry and Lloyd are now unemployed, increasing the urgency of their
    situation.
  trigger_event: With both men now jobless, Harry and Lloyd return home to figure
    out what to do next.
- description: Harry and Lloyd are at home late at night, having lost their jobs and
    with little money left. They are discussing their next steps.
  id: s_3
  key_delta: Harry and Lloyd are left with no money and food, heightening their desperation
    and vulnerability.
  trigger_event: A little old lady robs Harry and Lloyd of their food and remaining
    money.
- description: Harry and Lloyd are still at their apartment in Providence after being
    robbed, feeling dejected but planning ahead.
  id: s_4
  key_delta: Decision made to leave Providence and head to Aspen, setting the direction
    of their journey.
  trigger_event: Lloyd suggests leaving Providence and moving to Aspen to start anew;
    Harry agrees hesitantly.
- description: Harry and Lloyd prepare to leave Providence while still unaware that
    the briefcase contains ransom money tied to Mary's kidnapped husband.
  id: s_5
  key_delta: The kidnappers realize Harry and Lloyd have the ransom briefcase and
    retaliate by killing Petey, escalating danger even though Harry and Lloyd still
    do not understand the suitcase's significance.
  trigger_event: The kidnappers track the briefcase to Harry and Lloyd and kill Harry's
    bird Petey in retaliation as the pair leave Providence.
- description: Harry and Lloyd start their journey from Providence to Aspen, having
    sold belongings, including Petey, to raise cash. They are traveling in Harry’s
    van.
  id: s_6
  key_delta: Mental is now traveling in the van with Harry and Lloyd, turning the
    road trip into a direct encounter with the kidnappers.
  trigger_event: They pick up hitchhiker Mental (one of the kidnappers) and a family
    of Hispanic travelers while en route to Aspen.
- description: Harry and Lloyd are on the road with Mental and the traveling family.
    Mental is sensitive to spicy food and becomes incapacitated after they spike his
    meal with hot peppers.
  id: s_7
  key_delta: Mental is accidentally killed by rat poison after being incapacitated,
    removing one antagonist but complicating their situation.
  trigger_event: Mental collapses from the spicy food; the ingestion of rat poison
    pills intended for Harry and Lloyd kills Mental.
- description: Harry and Lloyd continue their journey alone after the death of Mental.
    They stop at a rest stop where Lloyd tricks a trucker into paying for their meals.
  id: s_8
  key_delta: After the stop, they are back on the road with no progress made, leaving
    Lloyd alone at the wheel long enough to misroute them into Nebraska.
  trigger_event: Police officer drinks urine from an open beer container accidently
    left by Lloyd; Harry refuses to stop the van during a bathroom break leading to
    this incident.
- description: Harry is asleep in the van while Lloyd drives, mistakenly taking the
    wrong route and leading them into Nebraska instead of Colorado.
  id: s_9
  key_delta: Navigation mistake causes delay and frustration but no major harm.
  trigger_event: They arrive in Nebraska, causing Harry to be infuriated by the navigation
    error.
- description: Harry and Lloyd are in Nebraska with the van. To continue their trip,
    Lloyd trades in Harry’s van for a minibike.
  id: s_10
  key_delta: Transport mode changes from van to minibike allowing progress to Aspen
    despite setbacks.
  trigger_event: Lloyd successfully trades the van for a minibike which ultimately
    carries them all the way to Aspen.
- description: Harry and Lloyd arrive in Aspen. Lloyd spots Mary Swanson in a newspaper
    promoting a fundraiser dinner. They have the ransom suitcase with a lot of money.
  id: s_11
  key_delta: They adopt a lavish lifestyle funded by ransom money, altering their
    social and financial status.
  trigger_event: Harry and Lloyd lavishly spend the ransom money, renting a large
    hotel suite and buying expensive clothes and cars.
- description: Harry and Lloyd are settled in their Aspen suite. Lloyd is too nervous
    to approach Mary, asking Harry instead to introduce them.
  id: s_12
  key_delta: Mary’s interest shifts to Harry, causing tension as Harry unwittingly
    becomes closer to her than Lloyd.
  trigger_event: Harry inadvertently charms Mary, who mistakes his stupidity for humor;
    Mary and Harry arrange a ski date without Lloyd’s knowledge.
- description: Lloyd discovers Harry's date with Mary after being stood up himself.
    He feels betrayed and plans to intervene.
  id: s_13
  key_delta: Lloyd disrupts Harry and Mary’s growing relationship, replacing Harry
    at the date and escalating interpersonal conflict.
  trigger_event: Lloyd sabotages Harry’s dinner date with Mary and attends in Harry’s
    place.
- description: Nicholas, family friend and secret mastermind behind the kidnapping,
    discovers Harry and Lloyd have spent the ransom money. Lloyd and Mary are held
    hostage by him.
  id: s_14
  key_delta: Hostage crisis initiated; personal danger escalates with Harry apparently
    shot and both Lloyd and Mary captured.
  trigger_event: Harry arrives during the hostage situation and is apparently shot
    by Nicholas.
- description: Nicholas is about to kill Lloyd when Harry unexpectedly regains consciousness
    and intervenes.
  id: s_15
  key_delta: Nicholas is arrested; Bobby is rescued; hostage situation resolved through
    Harry’s intervention.
  trigger_event: Harry helps subdue Nicholas, leading to his capture by authorities
    as part of a sting operation.
- description: Mary and her husband Bobby are reunited and thank Harry and Lloyd.
    The lavish lifestyle funded by ransom money is now revoked by the authorities.
  id: s_16
  key_delta: Loss of wealth and status; Harry and Lloyd become impoverished again
    and start departure on foot.
  trigger_event: Harry and Lloyd must leave Aspen on foot as all the money was spent
    and the FBI confiscates the ransom funds.
- description: Harry and Lloyd are traveling on foot out of Aspen, exhausted and lacking
    clear direction.
  id: s_17
  key_delta: Potential new opportunity presents itself, but Harry and Lloyd miss the
    chance by directing the models to the nearest town.
  trigger_event: They encounter a bus full of Hawaiian Tropic bikini models looking
    for two towel boys to hire.
- description: Harry and Lloyd continue walking towards the horizon, unaware of missed
    opportunities ahead but optimistic about future prospects.
  id: s_18
  key_delta: Harry and Lloyd remain together and keep drifting forward despite missing
    another opportunity.
  trigger_event: Harry and Lloyd keep walking after missing the models' offer.
