  id: c_0
  satisfaction_condition: Node s_0 has been completed before node s_1 is triggered.
  type: ordering
  violation_condition: Node s_1 triggers or is accepted before node s_0 is completed.
- description: The survival and river arrival event (s_2) must follow the plane crash
    (s_1). Prevents skipping the crash survival sequence.
  id: c_1
  satisfaction_condition: Node s_1 has been completed before node s_2 is triggered.
  type: ordering
  violation_condition: Node s_2 triggers before completion of node s_1.
- description: Arrival at Mayapore village (s_3) and reception by villagers must only
    occur after arrival via river from plane crash (s_2).
  id: c_2
  satisfaction_condition: Node s_2 completed prior to node s_3 activation.
  type: ordering
  violation_condition: Node s_3 occurs before node s_2.
- description: Indiana and companions must be assigned the quest to retrieve the stolen
    Sivalinga stone and rescue villagers’ children in Mayapore (s_3).
  id: c_3
  satisfaction_condition: Node s_3 is reached and villagers explicitly task the trio
    with the mission.
  type: achievement
  violation_condition: The narrative ends or progresses to resolution without the
    quest assignment having been given.
- description: The journey from Mayapore to Pankot Palace (s_4) must only occur after
    receiving the quest (s_3).
  id: c_4
  satisfaction_condition: Node s_3 completed before node s_4.
  type: ordering
  violation_condition: Direct progression to s_4 without completing s_3.
- description: Entry and acceptance as guests at Pankot Palace with banquet attendance
    (s_5) cannot happen before traveling to the palace (s_4).
  id: c_5
  satisfaction_condition: Node s_4 completed before node s_5.
  type: ordering
  violation_condition: Node s_5 triggered before s_4.
- description: During banquet (s_5 to s_6), palace residents must consistently rebuff
    or deflect Indiana’s inquiries about the stolen stone and villagers’ claims.
  id: c_6
