    assassination attempt skipped.
- description: Discovery and exploration of tunnels beneath the palace (s_8) must
    only occur after the assassination attempt (s_7).
  id: c_8
  satisfaction_condition: Node s_7 completed before node s_8.
  type: ordering
  violation_condition: Direct tunnel exploration at s_8 without prior attack at s_7.
- description: Within the tunnel exploration phase (s_8 to s_9), players must encounter
    booby traps and insect-infested rooms as protective hazards.
  id: c_9
  satisfaction_condition: During s_8 and s_9 progression, environments include traps
    and bug-infested chambers.
  type: invariant
  violation_condition: Skipping hazards or traps in the tunnels before reaching s_9.
- description: The trio must discover the underground Kali temple and learn of the
    Thuggee cult’s human sacrifices and possession of Sankara stones (s_10, s_11).
  id: c_10
  satisfaction_condition: Nodes s_10 and s_11 are reached, revealing cult’s ritual
    and stone possession.
  type: achievement
  violation_condition: Narrative advances past s_9 without revealing temple and cult
    details.
- description: Capture and separation by the Thuggee cult (s_12) can only occur after
    the trio’s attempt to retrieve stones (after s_11).
  id: c_11
  satisfaction_condition: Node s_11 completed before s_12 triggers.
  type: ordering
  violation_condition: S_12 capture occurs before full discovery of cult’s plans (s_11).
- description: Indiana must be forced to drink the Blood of Kali potion and fall into
    the trance (Black Sleep) under Mola Ram’s control during captivity (s_13).
  id: c_12
  satisfaction_condition: At node s_13, Indiana is officially under trance state and
    behaves accordingly.
  type: invariant
  violation_condition: Indiana remains free-minded or resists blood potion effects
    before s_13.
- description: Willie must be held as a human sacrifice and Short Round enslaved in
    the mines during captivity phase (s_14).
  id: c_13
  satisfaction_condition: Node s_14 established with respective character captures
    as described.
  type: invariant
  violation_condition: Characters are free or in another state prior to s_14.
- description: Short Round must escape the mines and break Indiana’s trance by burning
    him with a torch (s_15).
  id: c_14
  satisfaction_condition: Node s_15 reached with Short Round’s escape and awakening
    of Indiana.
  type: achievement
  violation_condition: Indiana remains entranced or Short Round fails to escape before
    narrative progresses.
- description: The Maharajah must be freed from trance via Short Round’s intervention,
    gaining his cooperation (s_16).
  id: c_15
  satisfaction_condition: Node s_16 occurs with Maharajah’s trance broken and subsequent
    guidance.
  type: achievement
  violation_condition: Maharajah remains entranced or attempts sabotage successfully
    beyond s_16.
- description: The rescue of Willie, recovery of the three Sankara stones, and freeing
    of the children (s_17) must only occur after awakening Indiana and Maharajah’s
    cooperation (after s_15 and s_16).
  id: c_16
  satisfaction_condition: Nodes s_15 and s_16 completed before triggering s_17.
  type: ordering
  violation_condition: Skipping character awakenings and directly proceeding to s_17.
- description: Escape through the mine cart chase from underground temple (s_18) follows
    the rescue and recovery (s_17).
  id: c_17
  satisfaction_condition: Node s_17 finished prior to s_18 activation.
  type: ordering
  violation_condition: Escape sequence s_18 triggered before rescue s_17.
- description: Final confrontation with Mola Ram on the rope bridge over the gorge
    (s_19) must happen after escape from temple (s_18).
  id: c_18
  satisfaction_condition: Node s_19 occurs only after node s_18.
  type: achievement
  violation_condition: Direct confrontation before escaping temple.
- description: During final rope bridge confrontation (s_19 to s_20), Indiana must
    cut the bridge, causing Mola Ram’s death and loss of two stones, with Indiana
    retaining one stone.
  id: c_19
  satisfaction_condition: Nodes s_19 and s_20 performed with described events and
    resulting states of characters and stones.
  type: invariant
  violation_condition: Mola Ram survives the confrontation or stones' fates are inconsistent
    with narrative.
- description: British Indian Army arrival and defeat of remaining Thuggee cultists
    (s_21) must occur after Mola Ram’s death (s_20).
  id: c_20
  satisfaction_condition: Node s_20 finished before triggering s_21.
  type: ordering
  violation_condition: Army arrives and battles cult before Mola Ram is defeated.
- description: Victory celebration with return of sacred stone and children to Mayapore
    (s_22) must occur only after the cult threat is neutralized (s_21) and stones
    partially recovered (s_20).
  id: c_21
  satisfaction_condition: Node s_22 occurs after s_20 and s_21, completing restoration
    of village and quest.
  type: achievement
  violation_condition: Narrative concludes without resolution via s_22 or before cult
    defeated and stones recovered.
