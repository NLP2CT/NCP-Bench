    of villagers’ plight or theft inquiries.
  type: invariant
  violation_condition: Palace residents admit culpability or confirm villagers’ claims
    before s_6 occurs.
- description: Indiana must experience an assassination attempt inside the palace
    (s_7), marking the danger level and suspicion confirmation.
  id: c_7
  satisfaction_condition: Node s_7 triggers with Indiana being attacked by an assassin.
