commitments:
- description: Cher cannot successfully renegotiate her grades based on teacher matchmaking
    before she initiates and completes the matchmaking plan with Mr. Hall and Miss
    Geist (s_1 then s_2).
  id: c_0
  satisfaction_condition: The matchmaking plan triggering and affective grade renegotiation
    is acknowledged only after s_1 and s_2 have occurred sequentially.
  type: ordering
  violation_condition: The system accepts grade renegotiation success or teacher relationship
    improvements without the matchmaking plan being initiated and confirmed in s_1
    and s_2.
- description: Cher’s superficial and mall-centric worldview remains intact and unchallenged
    from s_0 until the matchmaking success shift in s_2.
  id: c_1
  satisfaction_condition: Player input and system recognition maintain Cher’s framing
    as self-centered and superficial with mall-focus between s_0 and s_2 inclusive.
  type: invariant
  violation_condition: Any indication that Cher gains genuine community-oriented motivations
    or emotional insight before s_2 is recognized as logical collapse.
- description: Cher’s emotional shift toward valuing others beyond superficial reasons
    must be triggered by observing positive effects of matchmaking (s_2).
  id: c_2
  satisfaction_condition: Cher shows genuine appreciation for the teachers’ happiness
    and begins to care beyond personal benefit, occurring only at or after s_2.
  type: achievement
  violation_condition: Cher expresses meaningful altruistic motivation or emotional
    maturity prior to s_2.
- description: Cher’s social influence expansion by adopting Tai cannot proceed before
    the positive matchmaking result with her teachers is realized (s_2 precedes s_3).
  id: c_3
  satisfaction_condition: Initiation of Tai’s makeover and social tutoring occurs
    only at or after s_2 is completed.
  type: ordering
  violation_condition: The system acknowledges Tai’s makeover or social adoption before
    the teachers’ matchmaking success.
- description: Cher’s social status remains higher than Tai’s until Tai’s popularity
    surge post-mall incident (s_3 to s_5 partway).
  id: c_4
  satisfaction_condition: During s_3 and s_4, Cher’s popularity is considered superior
    and Tai’s less than Cher’s.
  type: invariant
  violation_condition: Tai’s popularity surpasses Cher’s before the mall incident
    and the events described in s_5.
- description: Elton’s rejection of Tai and pursuit of Cher must occur after the initial
    Tai makeover and popularity rise (s_4), but before Tai’s popularity surpasses
    Cher’s (before s_5).
  id: c_5
  satisfaction_condition: Elton’s romantic rejection and pursuit sequence located
    strictly between s_4 and s_5 nodes.
  type: ordering
  violation_condition: Elton’s rejection or pursuit occurs outside of this sequence,
    breaking social logic flow.
- description: Cher does not recognize Christian’s homosexuality prior to the revelation
    triggered by Murray’s laughter (between s_6 events).
  id: c_6
  satisfaction_condition: Cher’s naïve attempts and failure to notice Christian’s
    orientation persist up to Murray’s telling.
  type: invariant
  violation_condition: Cher correctly identifies Christian’s homosexuality before
    the Murray event or any player action that contradicts the naivety window.
- description: Cher's friendship tension with Tai triggered by Tai’s interest in Josh
    and subsequent quarrel must occur after Cher’s driver’s test failure (s_7).
  id: c_7
  satisfaction_condition: The quarrel and friendship tension event only acknowledged
    after s_7’s failing driver's test event has completed.
  type: ordering
  violation_condition: Tai’s romantic interest in Josh or conflict with Cher is accepted
    before Cher’s driver’s test failure.
- description: Cher’s introspection and emotional growth, including acknowledging
    her feelings for Josh, must be initiated only after the quarrel with Tai and driver’s
    test failure (post-s_7).
  id: c_8
  satisfaction_condition: Cher’s reflective state and beginning of emotional maturation
    triggered at s_8 or later.
  type: achievement
  violation_condition: Cher exhibits mature emotional insight or romantic feelings
    for Josh prior to s_8.
- description: Cher’s active participation in responsible, caring roles signaling
    personal growth must only occur after her introspective emotional shift (from
    s_8 forward).
  id: c_9
  satisfaction_condition: Cher’s leadership in disaster relief and romantic progression
    with Josh happens from s_9 onwards.
  type: invariant
  violation_condition: Cher assumes mature caring activities or romantic intimacy
    with Josh before s_8 reflection is completed.
- description: All major social and romantic resolutions (teachers’ marriage, Tai
    and Travis couple, friendship reconciliation, Cher and Josh’s romance) must be
    achieved by the narrative end (s_10).
  id: c_10
  satisfaction_condition: Narrative completion includes stable positive resolutions
    of all listed relationships and social orders at or by s_10.
  type: achievement
  violation_condition: Any final narrative state missing these stable resolutions
    or ending with persistent unresolved conflicts in social or romantic dynamics.
