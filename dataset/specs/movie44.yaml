meta:
  genres: ["Comedy", "Romance"]
  id: movie44
  player_role: Cher Horowitz
  title: "Clueless"
synopsis: Cher Horowitz is a good-natured but superficial girl who is attractive,
  popular, and extremely wealthy. At a few months shy of sixteen, she has risen to
  the top of the high school social scene and is happy and self-assured in her insular,
  fashion-obsessed world. She lives in a Beverly Hills mansion with her father, Mel,
  a ferocious $500-an-hour litigator; her mother has long since died, having succumbed
  to complications while undergoing liposuction. Cher's best friend is Dionne Davenport,
  who is also rich, pretty, and hip, and understands what it's like to be envied.
  Among the few people to find much fault with Cher is Josh, her socially conscious
  ex-stepbrother who visits during a break from college. Josh and Cher spar continually
  but without malice; she refers to him as "granola breath" and mocks his scruffy
  idealism, while he teases her for being selfish, vain, and superficial, and says
  that her only direction in life is "toward the mall." Illustrating that Cher's selfishness
  is usually innocent and relatively harmless, Cher plays matchmaker for two lonely,
  nerdy, hard-grading teachers, Mr. Hall and Miss Geist. She achieves her original
  purpose – to make them relax their grading standards so she can renegotiate a bad
  report card – but when she sees their newfound happiness, she realizes she likes
  doing good deeds. Cher now decides that the ultimate way she can give back to the
  community would be to "adopt" a "tragically unhip" new girl at school, Tai Frasier.
  Cher and Dionne give Tai a makeover and initiate her into the mysteries of popularity.
  Cher also tries to extinguish the strong mutual attraction between Tai and Travis,
  an amiable skateboarding slacker, and to steer her toward Elton, a rich snob. Her
  second matchmaking scheme backfires when Elton rejects Tai and makes a play for
  Cher. Matters worsen, however, when Cher's "project" works a bit too well and Tai's
  popularity begins to surpass Cher's, especially after Tai has a "near-death" adventure
  at the mall that helps to skyrocket her to fame at school. Other classmates, including
  Dionne and Cher's longtime rival, Amber, soon gravitate toward Tai, and Cher finds
  herself demoted from queen to courtier at high school. Meanwhile, Cher has a couple
  of romantic mishaps with boys at school. The first involves Elton; the next concerns
  Christian, a handsome classmate with great fashion sense who turns out to be gay.
  Cher naively and repeatedly fails to recognize Christian's homosexual tendencies,
  and tries unsuccessfully to seduce him while they are alone one night watching Spartacus.
  The next day, Dionne's boyfriend, Murray, roars with laughter, which makes Cher's
  mistake clear to her at last. Events reach a crisis after Cher fails her driver's
  test and can't "renegotiate" the result. When Cher goes home, crushed, Tai confides
  that she's taken a fancy to Josh and wants Cher to help her "get" him. Cher says
  she doesn't think Josh is right for her, and they quarrel. Cher, left all alone,
  begins to think she has created a monster in her own image. Feeling "totally clueless",
  she reflects on her priorities and her repeated failures to understand or appreciate
  the people in her life. Most of all, she keeps thinking about Josh and Tai, and
  wonders why she cares so much. After much soul-searching, Cher discovers she has
  fallen in love with Josh. She begins making awkward but sincere efforts to live
  a more useful life, even captaining the school's Pismo Beach disaster relief effort.
  A scene near the end of the film finds Cher and Josh stumbling over how to admit
  their mutual feelings for each other, finally culminating in a tender kiss on the
  stairs of her home. The film has a happy Hollywood ending for Cher——Mr. Hall and
  Miss Geist get married; her friendships with Tai and Dionne are reaffirmed; Tai
  and Travis are in love; and, in Josh's arms, she too has now finally found love.
trajectory:
- description: Cher Horowitz, a wealthy and popular nearly sixteen-year-old girl,
    is at the pinnacle of her high school social scene in Beverly Hills. She lives
    in a mansion with her father, Mel, a high-paid litigator. Cher's mother is deceased.
    Cher enjoys a superficial lifestyle surrounded by fashion and popularity, with
    her best friend Dionne and her ex-stepbrother Josh visiting from college. Cher
    sees life through a self-centered, mall-focused perspective, while Josh challenges
    her views.
  id: s_0
  key_delta: Introduction of Cher's social world, relationships, and the first potential
    challenge with her teachers' grading policy.
  trigger_event: Cher learns that two hard-grading teachers, Mr. Hall and Miss Geist,
    are assigned to her classes.
- description: Cher observes that her bad report card results partly from strict grading
    by Mr. Hall and Miss Geist, who seem serious and nerdy. The environment is set
    with Cher's usual confident social standing intact.
  id: s_1
  key_delta: Cher initiates a plan to change the teachers’ behavior to get her grades
    renegotiated by manipulating their personal happiness.
  trigger_event: Cher decides to play matchmaker by arranging interactions between
    Mr. Hall and Miss Geist.
- description: Mr. Hall and Miss Geist start spending more time together and grow
    happier, which mildly relaxes their grading approach. Cher’s original purpose
    of better grades is achieved but she notices their improved happiness.
  id: s_2
  key_delta: Cher’s perspective shifts slightly towards appreciating the benefits
    of her actions beyond self-interest.
  trigger_event: Cher acknowledges the positive effect of her matchmaker efforts on
    the teachers’ personal lives.
- description: Cher plans to expand her social influence by adopting Tai Frasier,
    a 'tragically unhip' new girl at school, intending to give her a makeover and
    teach her about popularity. Dionne joins the effort.
  id: s_3
  key_delta: Tai transitions from an unknown outsider to a newly popular student under
    Cher’s guidance.
  trigger_event: Cher and Dionne perform Tai’s makeover and initiate her into high
    school social life.
- description: Tai begins attracting attention at school. Cher tries to interfere
    in Tai’s romantic interests by encouraging Elton, a rich snob, while discouraging
    Travis, a laid-back skateboarder.
  id: s_4
  key_delta: Cher’s matchmaking attempt backfires, complicating her social dynamics
    with Tai and Elton.
  trigger_event: Elton openly rejects Tai and unexpectedly shows romantic interest
    in Cher instead.
- description: Tai’s popularity surges, especially after a dramatic 'near-death' incident
    at the mall, causing other students, including Dionne and rival Amber, to shift
    their allegiance to Tai.
  id: s_5
  key_delta: Cher experiences a demotion from the top social position to a lesser
    role within the school hierarchy.
  trigger_event: Cher notices her social status declining as Tai becomes the new center
    of popularity.
- description: 'Cher encounters romantic misadventures: first with Elton, then with
    Christian, a handsome classmate with great style who is gay. Cher fails to recognize
    Christian’s orientation and tries unsuccessfully to seduce him.'
  id: s_6
  key_delta: Cher’s naivety in romance is exposed, marking a personal embarrassment
    and social learning moment.
  trigger_event: During a night alone watching Spartacus, Cher’s advances toward Christian
    fail, and the next day Murray laughs upon revealing Christian’s homosexuality.
- description: Cher fails her driver’s test and is unable to negotiate a passing grade.
    Feeling disappointed and isolated, she returns home after a challenging day.
  id: s_7
  key_delta: Cher confronts tension in her friendship with Tai and recognizes the
    consequences of her earlier social engineering.
  trigger_event: Tai confesses she is interested in Josh and asks Cher for help to
    pursue him, leading to a quarrel between the two girls.
- description: Alone and reflective, Cher contemplates her repeated misunderstandings
    and strained relationships with those around her. The atmosphere is introspective
    and uncertain.
  id: s_8
  key_delta: Cher begins a gradual emotional shift toward recognizing her feelings
    for Josh and valuing deeper relationships beyond superficial popularity.
  trigger_event: Josh visits and Cher experiences awkward yet sincere attempts at
    connection and mutual understanding.
- description: Cher takes on more responsible roles, such as leading the school’s
    relief effort for a disaster in Pismo Beach, signaling her move toward a more
    useful and caring lifestyle.
  id: s_9
  key_delta: Cher’s personal growth culminates in romantic fulfillment with Josh and
    the beginning of more mature, authentic connections.
  trigger_event: Cher and Josh share a tender kiss on the stairs of her home, marking
    the start of mutual romantic feelings.
- description: 'The social and personal conflicts resolve: Mr. Hall and Miss Geist
    marry; Tai and Travis become a couple; Cher’s friendships with Tai and Dionne
    are reaffirmed; Cher and Josh begin a loving relationship. The atmosphere is celebratory
    and harmonious.'
  id: s_10
  key_delta: Stable social order restored with positive personal growth and romantic
    happy endings for Cher and her circle.
  trigger_event: Final social gatherings and reconciliations occur at various school
    and home settings.
