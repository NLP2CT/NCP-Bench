meta:
  genres: ["Fantasy", "Action"]
  id: movie57
  player_role: Hellboy
  title: "Hellboy——Blood and Iron"
synopsis: In a series of flashbacks played in reverse chronological order it is related
  that in 1939, a young Bruttenholm investigated a series of murders in Eastern Europe.
  Erzebet, a vampiress who bathed in the blood of innocents to stay young and sold
  her soul to the Queen of Witches, the goddess Hecate, was responsible and had just
  kidnapped the fiancee of one of the townsmen. When the search party confronted Erzebet
  in her castle, all members of the party were horribly killed, and Bruttenholm was
  left to face her alone. He tricked her into the sunlight, effectively destroying
  her. In the present day, an elderly Bruttenholm, who is overcome with memories of
  his encounter with Erzebet, takes a particular interest in a publicity stunt in
  the Hampdens at Long Island that Manning attempts to assign out, insisting on their
  most advanced team——Liz Sherman, Abe Sapien, Hellboy, and junior agent Sydney Leach,
  as well as himself. Despite the fact this is a marketing campaign for Oliver Trumbolt,
  a friend of the governor with hands deep in the BPRD's budget and thusly is considered
  a low priority, Bruttenholm's insistence pays off, though he does not explain his
  motives until he is certain. Ana, a blushing bride-to-be, is met on the streets
  by two elderly women who encourage her to go to her bridal gown fitting, and she
  meets with Erzebet who had unknowingly killed the shop owner Marie and her baby.
  Ana innocently comments that Erzebet reminds her of her "older" sister, offending
  her until she notices that Erzabet has no reflection. She screams, and everything
  goes dark. Later, being told that Father Lupescu was the one who convinced Ana to
  go to her fitting despite the disappearances of the young girls in the village,
  Erzabet pays him a visit, frightening him with her dark powers and confirming that
  his faith is not enough to keep her power from affecting the town. The BPRD team
  arrives and sets up to investigate a haunting that Oliver had called them for. Despite
  a few open windows, a creepy life-like replica of Erzabet and an old, suspiciously
  familiar looking groundskeeper, everything seems normal until night falls and they
  each encounter strange ghostly apparitions, culminating in dozens of spirits that
  were Erzabet's former victims. Excited that he may have found a goldmine, Trumbolt
  ignores the professor's warnings and is attacked. Ana goes to visit Father Lupescu
  who convinces her that she should not fear danger because the church is strong and
  the faith will keep her from harm; she hurries off to have her fitting done, running
  into Professor Bruttenholm as she leaves. He explains to Lupescu of Erzabet's true
  nature and her allegiance to Hecate, but he becomes offended and turns Bruttenholm
  away. Using his abilities to detect metal, Leach finds a secret passageway through
  the house's cellar, inadvertently coming across Trumbolde's body, drained of blood
  which was placed in a bath tub for what is suspected to be for Erzabet's revival.
  Bruttenholm and Liz head for the gardens to stop Hecate and Erzabet's Harpy hags
  from summoning her back from the dead while a werewolf attacks Hellboy and Abe.
  Abe is knocked unconscious and taken by the harpies for experimentation while Hellboy
  fights the werewolf, eventually subduing it and revealing that it is Father Lupescu,
  the groundskeeper that Bruttenholm had earlier identified. Meanwhile, Liz and Bruttenholm
  are attacked, first by wolves, then by Erzabet's withered body who knocks Liz out
  and takes Bruttenholm. Hellboy is dropped through a hole in the courtyard and meets
  Hecate, who is perplexed why he helps the mortals and tries to lure him to the dark
  side. He blatantly refuses again and again, forcing Hecate to take on a physical
  form to deal with him. After Abe escapes them, the harpies come across Hecate, but
  one is killed as she violently thrashes with Hellboy and the other escapes. Erzabet
  bathes in Trumbolde's blood and rejuvenates herself, but in an act that proves Bruttenholm
  still has fight in him, she begins to wither and decay again from the Holy Water
  he'd added to the bath. He breaks off a chair leg and finishes her off. Her death
  enrages Hecate who brutally attacks Hellboy and badly wounds him, and when he realizes
  her weakness is the sun he lures her outside, forcing her back into the darkness
  of her own realm, defeated. Bruttenholm is preparing for his trip to Transylvania
  where rumors have it that there is a vampire on the loose; as he is packing, his
  colleague comes in and they discuss the right hand of doom to which Bruttenholm
  asserts that so long as evil exists, good will rise up against it. Before revealing
  an image of Hellboy's right hand, signifying that he will be responsible for the
  destruction of the world, Hellboy wakens in his bed, admiring Bruttenholm, his adopted
  father, before falling back to sleep again.
trajectory:
- description: Hellboy, Abe Sapien, Liz Sherman, Sydney Leach, and Professor Bruttenholm
    arrive at the Hampden estate on Long Island at dusk to investigate a reported
    haunting. The house appears stately but quiet, with a mild unease in the atmosphere,
    and a publicity stunt event is underway nearby.
  id: s_0
  key_delta: The investigation is initiated at a location linked to strange occurrences;
    the team is assembled and focuses on the supposed haunting.
  trigger_event: The BPRD team is officially assigned and arrives at the Hampden estate
    to begin their investigation.
- description: Inside the Hampden house at night, the team finds a few open windows,
    a life-like replica of Erzebet, and an elderly groundskeeper resembling a familiar
    figure. The atmosphere grows tense as ghostly apparitions start to appear.
  id: s_1
  key_delta: Supernatural activity is confirmed through ghost sightings linked to
    Erzebet's victims.
  trigger_event: Night falls at the Hampden estate and ghostly apparitions begin manifesting.
- description: Trumbolt, the publicity figure, ignores Professor Bruttenholm’s warnings
    and explores further into the house despite dangers. Ana, a bride-to-be, disappears
    after interacting with Erzebet’s presence.
  id: s_2
  key_delta: A victim, Ana, has been targeted by Erzebet; Trumbolt is vulnerable inside
    the house against supernatural threats.
  trigger_event: Trumbolt wanders deeper into the house, and Ana meets Erzebet during
    her bridal gown fitting appointment.
- description: Sydney Leach discovers a secret passage in the cellar which leads to
    the discovery of Trumbolt’s blood-drained body in a bathtub, indicating an attempt
    or ongoing revival ritual for Erzebet.
  id: s_3
  key_delta: Evidence of Erzebet’s possible resurrection is uncovered through Trumbolt’s
    murder and the blood bath.
  trigger_event: Leach uses metal-detection abilities to find and open a secret passage
    in the cellar.
- description: Hellboy and Abe Sapien are outside the house; a werewolf attacks, identified
    later as Father Lupescu, who is linked to the darkness affecting the town.
  id: s_4
  key_delta: The groundskeeper, Father Lupescu, is revealed to be a supernatural threat
    allied unknowingly with Erzebet.
  trigger_event: A werewolf attacks Hellboy and Abe Sapien near the gardens of the
    estate.
- description: Liz Sherman and Bruttenholm move to the gardens to stop the summoning
    ritual, are attacked by wolves and then by an animated Erzebet; Liz is incapacitated
    and Bruttenholm taken captive.
  id: s_5
  key_delta: Bruttenholm is physically endangered and Erzebet is partially restored
    to power.
  trigger_event: Erzebet’s withered form attacks and captures Bruttenholm, knocking
    Liz out.
- description: Hellboy falls through a hole in the courtyard and confronts the goddess
    Hecate, who attempts to sway him to darkness but is refused repeatedly.
  id: s_6
  key_delta: Hecate’s physical manifestation and challenge to Hellboy introduces a
    divine antagonist element to the conflict.
  trigger_event: Hellboy is pulled into a hidden pit and encounters Hecate who reveals
    herself.
- description: Abe Sapien escapes from the harpies; one harpy is killed during a struggle
    with Hecate and Hellboy, while the other harpy flees, escalating the threat.
  id: s_7
  key_delta: The harpies’ diminished numbers and continuing threat increase the urgency
    of the conflict.
  trigger_event: Abe Sapien breaks free from capture and encounters Hecate and the
    harpies.
- description: Erzebet rejuvenates herself by bathing in Trumbolt’s blood, but her
    revival is undermined by Holy Water still in the bath, causing her to wither again.
  id: s_8
  key_delta: Erzebet’s revival is partially successful but ultimately compromised
    by the Holy Water effect.
  trigger_event: Erzebet bathes in the blood of Trumbolt to regain youth and strength.
- description: Bruttenholm breaks free and finishes off Erzebet by destroying her
    with a broken chair leg. Hecate, enraged, violently attacks Hellboy, badly wounding
    him.
  id: s_9
  key_delta: Erzebet is definitively destroyed; Hellboy is severely injured by Hecate’s
    rage.
  trigger_event: Bruttenholm kills Erzebet, prompting Hecate’s furious assault on
    Hellboy.
- description: Hellboy lures Hecate outside into the sunlight, exploiting her weakness
    and forcing her back into the darkness of her realm, defeated.
  id: s_10
  key_delta: Hecate is forced to retreat, ending the immediate supernatural threat
    at the estate.
  trigger_event: With Hecate driven off, the house falls quiet and Bruttenholm prepares
    to leave for Transylvania.
- description: In the quiet aftermath, an elderly Bruttenholm prepares to leave for
    Transylvania, discussing Hellboy’s destined role as the ‘right hand of doom’,
    as Hellboy sleeps peacefully unaware in his bed.
  id: s_11
  key_delta: Hellboy’s identity and future role are implicitly set, closing the current
    narrative cycle.
  trigger_event: Bruttenholm converses with a colleague before Hellboy wakes in his
    room.
