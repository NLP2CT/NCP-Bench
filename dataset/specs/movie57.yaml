commitments:
- description: The BPRD investigation at the Hampden estate (s_0) must be initiated
    before any supernatural phenomena or ghost sightings (s_1) can be acknowledged.
  id: c_0
  satisfaction_condition: Node s_0 has been completed before node s_1 is triggered.
  type: ordering
  violation_condition: Supernatural phenomena or ghost sightings (s_1) are acknowledged
    before the BPRD team arrives and begins the investigation (s_0).
- description: Ana’s encounter with Erzebet and her disappearance (s_2) cannot occur
    before ghostly apparitions (s_1) have manifested and been recognized.
  id: c_1
  satisfaction_condition: Node s_1 is completed before node s_2 is allowed.
  type: ordering
  violation_condition: Player causes Ana’s disappearance or Erzebet’s direct influence
    on her before the ghost apparitions in s_1 are reported.
- description: The secret passage discovery by Sydney Leach revealing Trumbolt’s blood-drained
    body (s_3) is always linked to the knowledge gained from investigating the haunted
    house at night (s_1).
  id: c_2
  satisfaction_condition: From node s_1 until s_3, the secret passage is undiscovered
    and the blood bath evidence is unknown; starting s_3 the discovery is fixed and
    cannot be reversed.
  type: invariant
  violation_condition: Player gains knowledge or bypasses s_1’s haunting investigation
    and either discovers or references the secret passage and Trumbolt’s murder earlier
    than s_3.
- description: Father Lupescu’s true nature as the werewolf attacking Hellboy and
    Abe (s_4) must not be revealed or conclusively identified before the actual attack
    event triggers.
  id: c_3
  satisfaction_condition: Prior to s_4, Father Lupescu is treated ambiguously; at
    s_4, the werewolf attack occurs and identification happens.
  type: invariant
  violation_condition: Player or system reveals or acts upon Lupescu’s werewolf identity
    before the werewolf attack (s_4) actually occurs.
- description: Bruttenholm and Liz Sherman’s attempt to stop the summoning ritual
    and the subsequent attack by Erzebet’s withered form (s_5) must follow the discovery
    of Trumbolt’s death and blood ritual (s_3) and the werewolf threat revelation
    (s_4).
  id: c_4
  satisfaction_condition: Nodes s_3 and s_4 are completed before node s_5 is triggered.
  type: ordering
  violation_condition: Player initiates or completes the garden ritual confrontation
    (s_5) before learning of the secret passage or werewolf attack (s_3, s_4).
- description: Hellboy’s confrontation with Hecate (s_6) can only occur after Bruttenholm
    is taken captive and Liz is incapacitated in s_5.
  id: c_5
  satisfaction_condition: s_5 is completed with captured/incapacitated states confirmed
    before s_6 is triggered.
  type: invariant
  violation_condition: Player triggers or resolves Hecate encounter (s_6) without
    the prior conditions of s_5 being fulfilled.
- description: Abe Sapien’s escape from the harpies and subsequent encounter during
    the conflict between Hecate and Hellboy (s_7) must occur after s_6, following
    Hellboy’s initial confrontation with Hecate.
  id: c_6
  satisfaction_condition: Node s_6 is completed and Hellboy is engaged with Hecate
    before s_7 occurs.
  type: ordering
  violation_condition: Player or system triggers Abe Sapien’s escape or harpy deaths
    (s_7) before Hellboy meets Hecate (s_6).
- description: Erzebet’s partial revival by bathing in Trumbolt’s blood (s_8) happens
    only after discovery of the blood bath (s_3) and before Bruttenholm finishes her
    off (s_9).
  id: c_7
  satisfaction_condition: Between s_3 and s_9, Erzebet’s rejuvenation state is active
    only after s_8 triggers and before s_9 concludes her death.
  type: invariant
  violation_condition: Player causes Erzebet’s revival (blood bath) before discovery
    of Trumbolt’s body (s_3) or after her death (s_9).
- description: Bruttenholm must kill Erzebet (s_9) before Hecate’s enraged attack
    on Hellboy occurs in the same node, closing Erzebet’s narrative arc prior to the
    goddess’s confrontation.
  id: c_8
  satisfaction_condition: In s_9, Erzebet’s death is confirmed before Hecate’s attack
    on Hellboy is resolved.
  type: ordering
  violation_condition: Hecate attacks Hellboy before Erzebet’s death has been definitively
    completed by Bruttenholm.
- description: Hellboy drawing Hecate into sunlight and forcing her retreat (s_10)
    must occur after Hecate’s attack at s_9 and Hellboy’s subsequent wounding.
  id: c_9
  satisfaction_condition: s_9 completes with Hecate attacking and wounding Hellboy
    before s_10 begins the forced retreat outside.
  type: ordering
  violation_condition: Player triggers Hecate retreat in sunlight (s_10) before her
    prior attack and Hellboy’s wounding (s_9).
- description: The narrative must conclude with the establishment of Hellboy’s destined
    role as the ‘right hand of doom’ and the aftermath of the confrontation (s_11),
    providing closure for the current story arc.
  id: c_10
  satisfaction_condition: The final node s_11 is reached with Bruttenholm’s discussion
    and Hellboy’s awakening confirmed.
  type: achievement
  violation_condition: The narrative ends without reaching or completing s_11, failing
    to establish Hellboy’s future and story closure.
- description: At no point before its official discovery (s_3) may the system acknowledge
    or allow acquisition of detailed knowledge about Trumbolt’s blood-drained body
    or the blood bath ritual.
  id: c_11
  satisfaction_condition: Between s_0 and s_3 exclusive, all references to the blood
    bath or Trumbolt’s death are absent or denied; at s_3 discovery is made and remains
    fixed.
  type: invariant
  violation_condition: Player obtains or the system reveals explicit knowledge or
    evidence of Trumbolt’s blood-drained body and blood bath ritual prior to s_3.
- description: Bruttenholm’s interest in the Hampden case and insistence on sending
    the advanced team must always precede or coincide with full team arrival (s_0),
    prohibiting premature information share or team deployment.
  id: c_12
  satisfaction_condition: No stage beyond s_0 will have the team fully present without
    Bruttenholm’s insistence having been established.
  type: invariant
  violation_condition: Player causes the team to investigate or act without Bruttenholm’s
    explicit role and directive having occurred before or at s_0.
