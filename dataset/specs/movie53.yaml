commitments:
- description: The Dent Act's influence and Gotham's apparent safety as maintained
    by the GCPD must be acknowledged from s_0 through s_6, preventing premature exposure
    of Dent's crimes or Batman's return before the designated plot progression.
  id: c_0
  satisfaction_condition: The system only acknowledges the Dent Act's impact and Gotham's
    controlled state during s_0 to s_6, with no public or official disclosure of Dent's
    crimes or Batman's identity before s_7.
  type: invariant
  violation_condition: Player causes early revelation of Dent's crimes or Batman's
    identity before s_7, or the system acknowledges Batman's active role publicly
    before s_6, collapsing the narrative foundation of Gotham's fragile facade.
- description: James Gordon's resignation speech confessing Dent’s crimes must be
    stolen by Bane (s_1) before the public exposure of the cover-up and prisoner release
    (s_7) to enforce logical causal flow.
  id: c_1
  satisfaction_condition: Event s_1 (Gordon’s speech stolen) occurs before s_7 (Bane
    reveals Dent cover-up and frees prisoners).
  type: ordering
  violation_condition: Player triggers or narrative acknowledges Bane revealing Dent’s
    crimes or releasing prisoners without first having Gordon’s speech stolen by Bane,
    breaking event causality.
- description: John Blake's promotion to detective (s_2) must precede the acknowledgement
    of his knowledge of Batman's identity and encouragement of Batman’s return (s_3
    and beyond).
  id: c_2
  satisfaction_condition: The system grants Blake detective status no later than s_2
    and acknowledges his active role in s_3 after that promotion.
  type: ordering
  violation_condition: Player or system reveals Blake’s knowledge or authority related
    to Batman before s_2 or without formal promotion and endorsement by Gordon.
- description: Bruce Wayne must remain financially ruined and Wayne Enterprises unstable
    from s_4 until Tate is entrusted with control at s_5, ensuring logical motivation
    for handing control over and subsequent events.
  id: c_3
  satisfaction_condition: Bruce’s financial ruin and collapse of Wayne Enterprises
    are persistent facts from s_4 through s_5 until the official control handover.
  type: invariant
  violation_condition: Player restores Wayne Enterprises stability or financial assets
    before s_5 or causes Tate to assume control without preceding financial decline.
- description: Batman must be captured and incapacitated by Bane (s_6) before Gotham
    falls fully under siege and social order collapses (s_7).
  id: c_4
  satisfaction_condition: The narrative reaches the milestone where Batman is physically
    broken and imprisoned by Bane (s_6) before s_7 events trigger.
  type: achievement
  violation_condition: Batman avoids capture or incapacitation, or player acts so
    that Gotham’s collapse or Bane’s public actions start before Batman’s imprisonment,
    reversing the intended narrative sequence.
- description: Bane’s control of Gotham and the nuclear threat using the fusion reactor
    core persists from s_7 through s_10 until Batman’s coalition forms and initiated
    countermeasures.
  id: c_5
  satisfaction_condition: Bane’s domination of Gotham with prisoners released, police
    trapped, and bomb armed is maintained invariantly through s_7 to s_10.
  type: invariant
  violation_condition: Player dismantles Bane’s control, frees Gotham, or disables
    the nuclear threat before Batman escapes and allies unite at s_8, violating the
    siege phase.
- description: Batman’s escape and reassembly of allies (s_8) is prerequisite to Bane’s
    death and bomb’s remote trigger disabling (s_9), ensuring that the player must
    reclaim Gotham before attempting final confrontations.
  id: c_6
  satisfaction_condition: Event s_8 (Batman escape and alliance) always occurs before
    s_9 (Bane’s death and disabling bomb remote).
  type: ordering
  violation_condition: Player kills Bane or neutralizes bomb remote trigger before
    Batman’s escape and alliance formation, or narrative tries to progress s_9 without
    s_8 completion.
- description: Talia al Ghul’s true identity as Miranda Tate and her goal to complete
    Ra’s al Ghul’s mission must remain hidden until s_9, preventing premature betrayal
    or alliance shifts.
  id: c_7
  satisfaction_condition: Talia’s identity and lethal mission remain secret and unacknowledged
    in the narrative prior to s_9.
  type: invariant
  violation_condition: Player or system reveals Tate’s true identity or her plan to
    detonate the bomb before s_9, breaking the planned narrative suspense and logic.
- description: Batman must physically haul the bomb away from Gotham using 'The Bat'
    aircraft (s_10), marking the climax that prevents nuclear disaster in the city.
  id: c_8
  satisfaction_condition: Narrative and player actions culminate in Batman utilizing
    the Bat aircraft to remove the bomb offshore as depicted in s_10.
  type: achievement
  violation_condition: Player attempts to disarm or detonate the bomb in Gotham or
    uses alternative methods to bypass hauling the bomb away, contradicting the core
    climax event.
- description: Bruce Wayne’s presumed death and public funeral (s_11) must strictly
    follow the bomb’s detonation (s_10) to preserve the narrative causality of his
    sacrifice and legacy.
  id: c_9
  satisfaction_condition: Event s_11 (funeral and legacy establishment) occurs only
    after s_10 bomb detonation is completed.
  type: ordering
  violation_condition: Player triggers Bruce’s presumed death or public funeral narrative
    prior to bomb detonation, breaking the sacrifice and aftermath chronology.
- description: The passing of the Batman mantle to John Blake and secret survival
    of Bruce Wayne must be realized by story’s end (s_12), establishing continuity
    and future hope.
  id: c_10
  satisfaction_condition: Narrative evidence confirms Bruce’s survival to Alfred and
    Blake inherits the Batcave with the Bat-Signal restored as in s_12.
  type: achievement
  violation_condition: Bruce is irreversibly dead, or Blake is denied inheritance/actions
    related to Batman’s legacy, preventing narrative closure and transfer of responsibility.
