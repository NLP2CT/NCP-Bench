meta:
  genres: ["Action", "Crime"]
  id: movie53
  player_role: Bruce Wayne
  title: "The Dark Knight Rises"
synopsis: Eight years after the death of Harvey Dent, the Gotham City Police Department
  has nearly eradicated organized crime with powers granted by the Dent Act, legislation
  inspired by Dent. Batman has disappeared, with Bruce Wayne becoming a recluse. Feeling
  guilty over his role in the cover-up of Dent's crimes, Police Commissioner James
  Gordon writes a resignation speech confessing the truth, but decides that the city
  is not ready to hear it. While pursuing criminals in the sewers, Gordon is captured
  and his speech is taken by a terrorist named Bane. Gordon escapes and is found by
  patrol officer John Blake. While recuperating, Gordon promotes Blake to detective,
  with Blake reporting directly to him. Wayne Enterprises is nearly bankrupt after
  Bruce invested in board member Miranda Tate's sustainable energy project for a fusion
  reactor, only to shut it down after discovering the reactor core could be used as
  a nuclear weapon. Blake—who has deduced Batman's identity—and Gordon encourage Batman
  to return, but Alfred Pennyworth resigns after a failed attempt to dissuade him,
  including informing Bruce that Rachel Dawes had intended to marry Dent before she
  died. Bane attacks the Gotham stock exchange and bankrupts Bruce using fingerprints
  that cat burglar Selina Kyle obtained from him to make ruinous trades in his name.
  Fearing that John Daggett—who employed Bane to aid in a hostile takeover—would gain
  access to the reactor, Bruce asks Tate to take control of Wayne Enterprises. Bane
  subsequently kills Daggett when he is no longer of use. Batman asks Selina to lead
  him to Bane, but Selina double-crosses him, leading him into a trap. Bane then reveals
  that he knows Batman's true identity and intends to fulfill Ra's al Ghul's mission
  to destroy Gotham. He breaks Batman's back and locks him away in a prison that he
  controls. While there, the inmates relate to Bruce the story of Ra's al Ghul's child,
  who was born in the prison and is the only person known to have escaped; Bruce believes
  that the child is Bane. Meanwhile, using bombs throughout the city, Bane traps most
  of Gotham's police force underground and cuts Gotham off from the rest of the world,
  using the weaponized reactor core to keep anyone from leaving the city. Bane reveals
  the cover-up of Dent's crimes and releases the prisoners in Blackgate Penitentiary
  under the pretense of starting a revolution. The wealthy and powerful are dragged
  from their homes and given show trials, presided over by Dr. Jonathan Crane, where
  the "convicted" die no matter the sentence. Bruce spends months recuperating and
  retraining himself. He escapes from the prison and enlists Selina, Blake, Tate,
  Gordon and Lucius Fox to help liberate Gotham and stop the nuclear bomb. During
  a confrontation between the police and Bane's forces, Batman subdues Bane. Tate
  comes to Bane's aid, revealing herself to be Ra's al Ghul's daughter Talia. She
  escaped the prison as a child, returning with her father and the League of Shadows
  to rescue Bane, who had helped her. She plans to complete her father's work by detonating
  the bomb and destroying Gotham. Selina kills Bane before he can execute Batman,
  while Gordon blocks the bomb's ability to be remotely detonated. Batman gives chase
  to force Talia to take the bomb to the fusion chamber where it can be stabilized,
  but she floods the chamber to prevent its disarming before she dies, taunting Batman
  that the bomb cannot be stopped. Batman realizes that the only way to stop it is
  to use "The Bat", an aircraft developed by Fox, to haul the bomb away from Gotham.
  He escorts the bomb out over the ocean, where it detonates, presumably killing Batman.
  In the aftermath, Batman is praised as a hero, while Bruce is assumed killed in
  the riots. After Bruce's funeral, Wayne Manor is left to the city to become an orphanage,
  and Bruce's remaining estate is left to Alfred. Fox discovers Bruce fixed the Bat's
  on-board autopilot system before hauling the bomb away. Gordon finds the Bat-Signal
  refurbished. Alfred witnesses Bruce and Selina together while visiting Florence,
  and Blake inherits the Batcave.
trajectory:
- description: Gotham City is under heavy control by the Gotham City Police Department,
    which has nearly eradicated organized crime following the Dent Act; Batman has
    vanished, and Bruce Wayne lives as a recluse amid the collapsing Wayne Enterprises.
  id: s_0
  key_delta: Gotham's apparent safety is maintained under a facade; Bruce Wayne's
    public absence as Batman is established, and the Dent Act laws shape the police
    force's authority.
  trigger_event: Police Commissioner James Gordon, troubled but still on duty, prepares
    a resignation speech confessing Harvey Dent's crimes but ultimately does not submit
    it.
- description: James Gordon is actively pursuing criminals in Gotham's sewers, operating
    with suspicion and caution under the heavy influence of the Dent Act enforcement.
  id: s_1
  key_delta: Gordon's confidential resignation speech is stolen by Bane, introducing
    a tangible threat to the city's concealed truths.
  trigger_event: Gordon is captured by the masked terrorist Bane during a sewer chase
    and his confidential resignation speech is seized.
- description: Gordon has escaped captivity and is found battered by patrol officer
    John Blake; the political stability of Gotham is quietly fragile with dangerous
    elements active underground.
  id: s_2
  key_delta: Blake enters a position of trust and investigative influence within the
    police, marking a new alliance for Gotham's future.
  trigger_event: Gordon recovers and promotes Blake to detective with direct reporting
    authority to himself.
- description: Bruce Wayne observes the financial decline of Wayne Enterprises after
    shutting down Miranda Tate's fusion reactor project due to weaponization fears;
    Selina Kyle, a cat burglar, is active in the city.
  id: s_3
  key_delta: Bruce Wayne is confronted with requests to resume his role as Batman,
    linking several key characters and hinting at an impending resurgence.
  trigger_event: Blake deduces Batman's identity and, alongside Gordon, urges Batman
    to return to action.
- description: Bruce Wayne suffers a personal blow as Alfred Pennyworth resigns after
    failed efforts to dissuade him from returning as Batman, revealing Rachel Dawes's
    past connection to Harvey Dent.
  id: s_4
  key_delta: Bruce Wayne's financial ruin is catalyzed by Bane's machinations, threatening
    Wayne Enterprises' control and influence.
  trigger_event: Bane launches an attack on the Gotham stock exchange, using fingerprints
    stolen by Selina Kyle to ruin Bruce financially.
- description: Bruce, financially crippled and politically cornered, entrusts Miranda
    Tate with control of Wayne Enterprises to prevent hostile takeover by John Daggett,
    who employs Bane as muscle.
  id: s_5
  key_delta: Bane asserts dominance by eliminating his employer Daggett, consolidating
    his power and freeing Bruce from Daggett’s immediate threat.
  trigger_event: John Daggett is killed by Bane when deemed unnecessary.
- description: Batman, tracking Bane, is led into a trap by Selina Kyle, revealing
    Bane’s awareness of Batman’s identity and his lethal plans for Gotham.
  id: s_6
  key_delta: Batman is physically incapacitated and removed from Gotham’s conflict,
    marking a turning point in the struggle.
  trigger_event: Bane breaks Batman’s back and imprisons him in a prison under his
    control.
- description: Imprisoned and broken, Bruce Wayne learns from inmates the story of
    Ra's al Ghul's child who escaped the prison; Gotham is isolated and under siege
    as police are trapped underground by Bane’s bombs.
  id: s_7
  key_delta: Gotham’s social order collapses with mass prisoner release and public
    exposure of political lies, intensifying the threat to the city.
  trigger_event: Bane publicly reveals Dent's crimes cover-up and frees Blackgate
    Penitentiary prisoners to incite chaos.
- description: After months in prison, Bruce retrains and recuperates, preparing for
    his return; Bane controls Gotham with the threat of the weaponized fusion reactor
    core bomb.
  id: s_8
  key_delta: Batman’s return is solidified with a coalition of trusted allies aimed
    at defeating Bane and the nuclear threat.
  trigger_event: Bruce escapes prison and reconnects with allies Selina Kyle, John
    Blake, Miranda Tate, James Gordon, and Lucius Fox to reclaim Gotham.
- description: During the battle to reclaim Gotham, Miranda Tate reveals herself as
    Talia al Ghul, Ra's al Ghul's daughter, intending to complete her father's mission
    by detonating the bomb.
  id: s_9
  key_delta: Bane is eliminated, and the bomb’s remote trigger is disabled, but Talia
    remains a lethal threat with the bomb in her control.
  trigger_event: Selina Kyle kills Bane before he can kill Batman; Gordon prevents
    the bomb’s remote detonation.
- description: Talia floods the fusion chamber to prevent bomb disarming; Batman pursues
    her as she attempts to finalize her catastrophic plan.
  id: s_10
  key_delta: The bomb is removed from Gotham city aerially, initiating its detonation
    away from civilians.
  trigger_event: Batman uses the Bat aircraft developed by Lucius Fox to haul the
    bomb away over the ocean.
- description: The bomb detonates offshore, and Bruce Wayne is presumed dead after
    an official funeral; Gotham begins recovery and reconstruction under new symbolic
    leadership and hope.
  id: s_11
  key_delta: Bruce’s official death and legacy are cemented, shifting Gotham’s social
    landscape and initiating a new era.
  trigger_event: Bruce’s funeral is held; Wayne Manor is donated to the city, and
    Alfred inherits Bruce’s estate.
- description: In the aftermath, Bruce’s secret survival is revealed only to Alfred;
    John Blake inherits the Batcave, prepared to continue Batman’s mission.
  id: s_12
  key_delta: The mantle of Batman is set to pass to the next generation, with Bruce
    and Selina beginning a new life, leaving the city in capable hands.
  trigger_event: Alfred witnesses Bruce and Selina together in Florence; Blake discovers
    the refurbished Bat-Signal.
