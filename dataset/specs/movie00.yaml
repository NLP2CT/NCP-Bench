commitments:
- description: The implanted laser projector with a safe deposit box number must remain
    undiscovered before node s_0.
  id: c_0
  satisfaction_condition: The system never reveals or acknowledges existence of the
    implanted laser projector before s_0 is reached.
  type: invariant
  violation_condition: Player attempts or system declares knowledge or usage of the
    implanted laser projector or safe deposit box number prior to s_0.
- description: The protagonist must suffer amnesia and not recall his identity before
    s_1 completes.
  id: c_1
  satisfaction_condition: The system acknowledges that the protagonist cannot remember
    his identity until s_1 is reached and amnesia is triggered.
  type: invariant
  violation_condition: Player gains or is granted explicit memory or knowledge of
    his identity prior to s_1.
- description: Protagonist must regain physical safety on land and manifest unusual
    skills despite amnesia by node s_2.
  id: c_2
  satisfaction_condition: By s_2, the protagonist is on land, fluent in multiple languages,
    and recognized as having unusual skills despite memory loss.
  type: achievement
  violation_condition: The protagonist fails to demonstrate or system disallows recognition
    of his language fluency and skills post arrival on land at or after s_2.
- description: The protagonist must discover his combat skills by incapacitating police in Zürich before accessing the safe deposit box.
  id: c_3
  satisfaction_condition: Node s_3 (police combat) occurs before node s_4 (bank visit).
  type: ordering
  violation_condition: The protagonist accesses the safe deposit box or obtains his passports before discovering his combat skills against the police.
- description: The protagonist must acquire passports and currencies from the safe deposit box, but leave the handgun behind, before the consulate chase.
  id: c_4
  satisfaction_condition: Node s_4 explicitly states the handgun is left behind, and occurs prior to the chase in s_5.
  type: achievement
  violation_condition: The protagonist takes the handgun from the safe deposit box or skips the bank visit.
- description: Escape to the U.S. consulate must occur after the police pursuit and
    before further flight from authorities.
  id: c_5
  satisfaction_condition: Node s_5 (escape to U.S. consulate) must follow s_4 and
    precede later chase sequences.
  type: ordering
  violation_condition: Player bypasses or fails to enter the U.S. consulate after
    police pursuit at s_4 before moving ahead.
- description: The protagonist must form an alliance with Marie Kreutz by offering
    payment in exchange for transportation by s_6.
  id: c_6
  satisfaction_condition: By s_6, Marie accepts the offer to assist and drive the
    protagonist to Paris.
  type: achievement
  violation_condition: Marie refuses aid or no alliance is formed before s_6 proceeds.
- description: CIA identifies the amnesiac as the high-priority target and activates
    agents only after s_7.
  id: c_7
  satisfaction_condition: The activation order for Castel, Manheim, and The Professor
    only happens at or after s_7 is reached.
  type: invariant
  violation_condition: Agents are dispatched or CIA knowledge about the man being
    a target leaks prior to s_7.
- description: The protagonist must confirm the 'Michael Kane' alias is a cover after
    arrival in Paris and not before.
  id: c_8
  satisfaction_condition: Node s_8 (confirmation Michael Kane is reported dead) occurs
    after arrival and before confronting pursuers.
  type: ordering
  violation_condition: Player uncovers or system reveals the alias death before arrival
    at s_8 or safe deposit box investigation.
- description: The protagonist must survive the ambush by Castel and defeat him in
    combat at s_9.
  id: c_9
  satisfaction_condition: Castel's ambush occurs and the protagonist successfully
    incapacitates or neutralizes him by s_9 completion.
  type: achievement
  violation_condition: The protagonist fails or is captured/killed during Castel’s
    ambush.
- description: Marie must discover wanted posters showing both her and the protagonist
    only after Castel’s ambush at s_10.
  id: c_10
  satisfaction_condition: Marie finds wanted posters inside Castel’s belongings after
    s_9 and before s_11.
  type: invariant
  violation_condition: Marie or player learns about wanted status before s_10 or without
    Castel’s ambush event.
- description: CIA’s deceptive planting of a corpse as 'Michael Kane' must occur only
    after Castel’s death and before Wombosi’s assassination.
  id: c_11
  satisfaction_condition: CIA plants the corpse in s_11 strictly after s_10 and before
    s_12.
  type: ordering
  violation_condition: Player or system reveals or triggers corpse planting before
    Castel’s death or after Wombosi’s killing.
- description: The Professor must assassinate Wombosi before the protagonist fully
    recovers identity and leaves Treadstone.
  id: c_12
  satisfaction_condition: Wombosi is assassinated at s_12 prior to protagonist’s reveal
    of full identity at s_16 or departure at s_17.
  type: achievement
  violation_condition: The player or system attempts assassination before s_12.
- description: The protagonist and Marie must retreat to Eamon’s house and establish
    a safe haven before The Professor attempts to assassinate the protagonist there.
  id: c_13
  satisfaction_condition: Node s_13 happens prior to s_14.
  type: ordering
  violation_condition: The Professor attacks before the protagonists settle at Eamon’s
    house.
- description: The protagonist must kill The Professor and gain information about
    Treadstone before sending Marie away.
  id: c_14
  satisfaction_condition: The Professor is killed and divulges Treadstone connection
    at s_14, prior to sending Marie away at s_15.
  type: achievement
  violation_condition: The Professor survives or leaves without revealing information
    before s_15.
- description: Tracking Conklin to the Treadstone safe house must happen only after
    The Professor’s death and sending Marie away.
  id: c_15
  satisfaction_condition: Node s_15 (tracking Conklin) occurs after s_14 and after
    Marie is sent away.
  type: ordering
  violation_condition: Player attempts to infiltrate or find Treadstone safe house
    before s_14 or before Marie’s departure.
- description: The protagonist must recover partial memories and reveal his real identity
    and mission during confrontation with Conklin and Parsons.
  id: c_16
  satisfaction_condition: Flashbacks and identity revelation occur at s_16 during
    safe house confrontation.
  type: achievement
  violation_condition: The system or player obtains or reveals these memories and
    identity outside or before s_16.
- description: The protagonist must sever ties with Treadstone and kill surviving
    agents only after s_16 and before the narrative end.
  id: c_17
  satisfaction_condition: The protagonist leaves Treadstone and kills agents attempting
    to assassinate him at s_17, following s_16.
  type: invariant
  violation_condition: The protagonist leaves Treadstone or kills agents before memory
    recovery at s_16.
- description: Abbott shuts down Treadstone and introduces Blackbriar only after protagonist’s
    departure and Conklin’s death.
  id: c_18
  satisfaction_condition: Node s_18 occurs after s_17 (departure and agent kills)
    and Conklin’s assassination.
  type: ordering
  violation_condition: CIA reorganization or shutdown attempts prior to protagonist’s
    defection or before Conklin’s death.
- description: The protagonist must reunite with Marie in Greece for closure and new
    life at narrative end.
  id: c_19
  satisfaction_condition: The reunion at Marie’s scooter rental stand in Greece occurs
    at or after s_19 to conclude narrative arc.
  type: achievement
  violation_condition: Player never meets Marie again or reunion is negated before
    the narrative concludes.
