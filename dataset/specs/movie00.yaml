meta:
  genres: ["Action", "Thriller"]
  id: movie00
  player_role: Jason Bourne
  title: "The Bourne Identity"
synopsis: In the Mediterranean Sea near Marseille, Italian fishermen find an unconscious
  man floating adrift with two gunshot wounds in his back. The boat's medic finds
  a tiny laser projector surgically implanted under the unknown man's skin at the
  level of the hip. When activated, the laser projector displays the number of a safe
  deposit box in Zürich. The man wakes up and discovers he is suffering from amnesia.
  Over the next few days on the ship, the man finds he is fluent in several languages
  and has unusual skills, but cannot remember anything about himself or why he was
  in the ocean. When the ship docks, he sets off to investigate the safe deposit box.
  At the CIA's headquarters, the agency's Deputy Director Ward Abbot learns about
  a failed assassination attempt against exiled African dictator Nykwana Wombosi.
  Meanwhile, in Zürich, the amnesiac incapacitates two policemen using advanced hand-to-hand
  combat when they attempt to arrest him. The next morning, he visits a bank using
  the number that was embedded in his hip, and opens a safe deposit box to find several
  passports containing his picture, large amounts of assorted currencies, and a handgun.
  He assumes the name from the first passport, Jason Bourne. He takes all the passports
  and money, but leaves the handgun. As he leaves, a bank employee contacts Operation
  Treadstone, a CIA black ops program. After being chased by police, Bourne escapes
  into a U.S. consulate where he is again pursued by authorities. Bourne escapes and
  encounters a Swiss woman named Marie Kreutz, offering her $10,000 to drive him to
  an address in Paris. Meanwhile, Alexander Conklin, the head of Treadstone, assures
  Abbott that he will destroy any evidence connecting them to Bourne, who was responsible
  for the failed assassination attempt on Wombosi. He activates three "assets" to
  take down Bourne——Castel, Manheim, and The Professor. Bourne arrives at the address
  on his passport, and after studying the apartment, hits redial on his phone and
  is connected to the Hotel Regina, which recognizes one of Bourne's passport aliases;
  Michael Kane. Bourne is told that Kane died two weeks before in a car crash. Castel
  ambushes Bourne and Marie at the apartment, but Bourne manages to defeat him after
  a fight and attempts to interrogate him unsuccessfully. Marie finds wanted posters
  in Castel's bag with both her and Bourne's pictures on them; as Bourne attempts
  to calm her down, Castel jumps out of a window to his death. Marie goes into shock,
  and Bourne escorts her from the building. Conklin plants a body in a Paris morgue
  in an attempt to fool Wombosi into thinking Kane is dead, but Wombosi recognizes
  that the body is not his assailant. The Professor assassinates Wombosi at his home.
  Bourne investigates Wombosi and concludes that he was an assassin prior to his amnesia.
  He and Marie leave the city and travel into the French countryside to stay at the
  house of Marie's stepbrother Eamon, where Bourne decides that he no longer wants
  to be who he was. In the morning, The Professor comes to kill Bourne. Bourne sends
  Marie and Eamon to hide in the basement, while he grabs Eamon's shotgun and goes
  out to find The Professor, blowing up a large propane tank as a distraction. After
  a brief standoff in a cropfield, Bourne shoots The Professor twice and interrogates
  him briefly. The Professor reveals their mutual connection to Treadstone before
  dying. Bourne sends Marie away for her own safety. He contacts Conklin to arrange
  a meet, but instead tracks Conklin's vehicle to discover the location of Treadstone's
  safe house in Paris. Bourne breaks in and holds Conklin and logistics technician
  Nicky Parsons at gunpoint, beginning to remember his last mission through successive
  flashbacks. "Kane" was an assumed identity during his mission to infiltrate Wombosi's
  entourage and kill him, but Bourne failed to kill Wombosi aboard his yacht when
  he intended to because his children were sleeping nearby. Bourne fled and was shot
  twice in the back in the process. Bourne tells Conklin that he is leaving Treadstone
  and warns not to follow him. Realizing that their conversation is being overheard,
  Bourne leaves Conklin and Parsons before killing two agents who try to kill him.
  Abbott shuts down Treadstone and has Manheim kill Conklin. Abbott goes before an
  oversight committee, dismissing Treadstone and previewing a new project codenamed
  "Blackbriar". Some time later, Jason finds Marie renting out scooters to tourists
  in Greece, and the two reunite.
trajectory:
- description: In the Mediterranean Sea near Marseille, a small fishing boat drifts
    with an unconscious man aboard, who has two gunshot wounds in his back. The boat's
    medic examines him and discovers a tiny laser projector implanted under his skin
    at the hip.
  id: s_0
  key_delta: The existence of the implanted laser projector with a safe deposit box
    number on the man is established, confirming he carries hidden information.
  trigger_event: The boat's medic activates the implanted laser projector, which displays
    a safe deposit box number in Zürich.
- description: The unconscious man wakes up on the fishing boat, in an unknown state
    with no memory of himself or how he came to be in the sea.
  id: s_1
  key_delta: The man experiences amnesia, establishing his information gap and identity
    mystery.
  trigger_event: The man regains consciousness without recollection and discovers
    his amnesia.
- description: The boat docks in port, and the amnesiac is fluent in multiple languages
    with unusual skills but still cannot recall personal details or his past.
  id: s_2
  key_delta: The man is physically safe on land and poised for action; his linguistic
    and skill advantages are established despite amnesia.
  trigger_event: The fishing boat arrives at the dock, and the man prepares to leave
    the ship.
- description: In Zürich, the amnesiac is approached by police and instinctively incapacitates them using advanced hand-to-hand combat.
  id: s_3
  key_delta: The man discovers his lethal combat skills and provokes law enforcement attention before knowing his own identity.
  trigger_event: After escaping the police confrontation, the man follows the safe-deposit clue to the Zurich bank the next morning.
- description: The next morning, the man accesses a bank using the safe deposit box number, acquiring passports and money but leaving the handgun.
  id: s_4
  key_delta: The man obtains several passports with his picture and assorted currencies, assuming the name Jason Bourne, but intentionally leaves the weapon behind.
  trigger_event: The bank visit and withdrawal alert Treadstone and local authorities, triggering the pursuit that drives him toward the U.S. consulate.
- description: As he leaves the bank, an employee contacts Treadstone. The man is pursued by police and escapes into a U.S. consulate.
  id: s_5
  key_delta: The man is actively hunted by authorities and seeks refuge in an international safe haven.
  trigger_event: After escaping the consulate, the man needs transport and recruits Marie to drive him to Paris.
- description: Outside the consulate, the man encounters Marie Kreutz, a Swiss woman.
  id: s_6
  key_delta: An alliance is formed with Marie, providing the man transportation and
    local assistance.
  trigger_event: The man offers Marie $10,000 to drive him to an address in Paris.
- description: At CIA headquarters, Deputy Director Ward Abbot learns of the failed
    assassination of exiled dictator Nykwana Wombosi and activates operatives to track
    down the amnesiac man.
  id: s_7
  key_delta: The man is formally identified as a high-priority target by the CIA's
    black ops program.
  trigger_event: Ward Abbot orders Operation Treadstone operatives Castel, Manheim,
    and The Professor to apprehend the man.
- description: The man arrives at the Paris apartment linked to one of the passports
    and discovers that his passport alias 'Michael Kane' is reported dead.
  id: s_8
  key_delta: The man confirms his assumed identity is a cover and begins unraveling
    his past identity complications.
  trigger_event: Hotel Regina recognizes 'Michael Kane' as deceased in a recent car
    crash when the man makes a phone call there.
- description: Castel ambushes the man and Marie at the apartment, but the man defeats
    Castel in a fight.
  id: s_9
  key_delta: The man confirms he is being hunted; he survives a lethal encounter and
    now is solidly on the run.
  trigger_event: Castel attacks the man and Marie unexpectedly in their apartment.
- description: Marie discovers wanted posters bearing their pictures inside Castel's
    belongings, and Castel dies after jumping from the window.
  id: s_10
  key_delta: The threat level increases as authorities have actively targeted both
    the man and Marie.
  trigger_event: Castel leaps to his death while trying to escape after the confrontation.
- description: Back in CIA operations, Conklin attempts deception by planting a body
    to mislead Wombosi about the man's death.
  id: s_11
  key_delta: The CIA’s covert dirty tactics to cover up their involvement are introduced.
  trigger_event: A corpse is placed in a Paris morgue under the alias 'Michael Kane'.
- description: The Professor successfully assassinates Nykwana Wombosi at his home.
  id: s_12
  key_delta: The original target’s assassination moves the plot forward and confirms
    CIA lethal operations continue.
  trigger_event: The Professor kills Wombosi, eliminating the target of the initial
    failed assassination attempt.
- description: The man and Marie travel to the French countryside, staying at Marie’s
    stepbrother Eamon’s house, where the man contemplates abandoning his past identity.
  id: s_13
  key_delta: A temporary safe haven is established, and the man resolves to change
    his life away from previous operatives.
  trigger_event: The man and Marie arrive and settle at Eamon’s farm outside Paris.
- description: The Professor arrives at Eamon’s house to kill the man; the man confronts
    and kills The Professor after a brief standoff.
  id: s_14
  key_delta: The man eliminates one pursued assassin and gains crucial information
    about their shared Treadstone connection.
  trigger_event: The Professor attempts to assassinate the man at the countryside
    house.
- description: After The Professor’s death, the man sends Marie away for safety and
    begins tracking Conklin to uncover more about Treadstone.
  id: s_15
  key_delta: The man gains actionable intelligence on the Treadstone program and its
    operatives.
  trigger_event: The man secretly follows Conklin’s vehicle to a Treadstone safe house
    in Paris.
- description: Inside the Treadstone safe house, the man holds Conklin and logistics
    technician Nicky Parsons at gunpoint and experiences flashbacks revealing his
    real identity and mission.
  id: s_16
  key_delta: Recovered partial memories clarify the man’s identity as Jason Bourne
    and his failed mission to assassinate Wombosi.
  trigger_event: The man confronts Conklin and Parsons, triggering fragmented memories
    of his past as an assassin and operative.
- description: The man tells Conklin he is leaving Treadstone, kills two agents who
    attempt to assassinate him, and escapes the safe house.
  id: s_17
  key_delta: The man severs his operational ties from Treadstone and solidifies his
    autonomy.
  trigger_event: Two agents try to kill the man after his confrontation, but he kills
    them and escapes.
- description: Deputy Director Ward Abbot shuts down Treadstone and has Manheim kill
    Conklin; Abbot briefs an oversight committee and introduces the next project,
    Blackbriar.
  id: s_18
  key_delta: The political and organizational fallout from Bourne’s defection reshapes
    CIA operations.
  trigger_event: Abbott orders the termination of Treadstone and initiates the Blackbriar
    program in a government hearing.
- description: Some time later, in Greece, the man reunites with Marie, who rents
    out scooters to tourists.
  id: s_19
  key_delta: The man reestablishes a personal connection and begins a new chapter
    removed from his former covert life.
  trigger_event: The man meets Marie at her scooter rental stand by the seaside.
