meta:
  genres: ["Drama", "Satire"]
  id: movie24
  player_role: Howard Beale
  title: "Network"
synopsis: Howard Beale, the longtime anchor of the UBS Evening News, learns from news
  division president Max Schumacher that he has just two more weeks on the air because
  of declining ratings. The two old friends get roaring drunk and lament the state
  of their industry. The following night, Beale announces on live television that
  he will commit suicide on next Tuesday's broadcast. UBS fires him after this incident,
  but Schumacher intervenes so that Beale can have a dignified farewell. Beale promises
  he will apologize for his outburst, but once on the air, he launches back into a
  rant claiming that life is "bullshit". Beale's outburst causes the newscast's ratings
  to spike, and much to Schumacher's dismay, the upper echelons of UBS decide to exploit
  Beale's antics rather than pull him off the air. In one impassioned diatribe, Beale
  galvanizes the nation, persuading his viewers to shout out of their windows "I'm
  as mad as hell, and I'm not going to take this anymore!". Diana Christensen heads
  the network's programming department; seeking just one hit show, she cuts a deal
  with a band of radical terrorists for a new docudrama series called the Mao-Tse
  Tung Hour for the upcoming fall season. When Beale's ratings seem to have topped
  out, Christensen approaches Schumacher and offers to help him "develop" the news
  show. He says no to the professional offer, but not to the personal one, and the
  two begin an affair. When Schumacher decides to end the "Howard as Angry Man" format,
  Christensen convinces her boss, Frank Hackett, to slot the evening news show under
  the entertainment division so that she can develop it. Hackett agrees, bullies the
  UBS executives to consent, and fires Schumacher at the same time. Soon after, Beale
  is hosting a new program called The Howard Beale Show, top-billed as "the mad prophet
  of the airwaves". Ultimately, the show becomes the most highly rated program on
  television, and Beale finds new celebrity preaching his angry message in front of
  a live studio audience that, on cue, chants Beale's signature catchphrase en masse——"We're
  as mad as hell, and we're not going to take this anymore." At first, Max's and Diana's
  romance withers as the show flourishes, but in the flush of high ratings, the two
  ultimately find their ways back together, and Schumacher leaves his wife of over
  25 years for Christensen. But Christensen's fanatical devotion to her job and emotional
  emptiness ultimately drive Max back to his wife, and he warns his former lover that
  she will self-destruct at the pace she is running with her career. "You are television
  incarnate, Diana," he tells her, "indifferent to suffering, insensitive to joy.
  All of life is reduced to the common rubble of banality." When Beale discovers that
  CCA, the conglomerate that owns UBS, will be bought out by an even larger Saudi
  Arabian conglomerate, he launches an on-screen tirade against the deal, encouraging
  viewers to send telegrams to the White House telling them, "I want the CCA deal
  stopped now!" This throws the top network brass into a state of panic because the
  company's debt load has made merger essential for survival. Hackett takes Beale
  to meet with CCA chairman Arthur Jensen, who explicates his own "corporate cosmology"
  to the attentive Beale. Jensen delivers a tirade of his own in an "appropriate setting,"
  the dramatically darkened CCA boardroom, that suggests to the docile Beale that
  Jensen may himself be some higher power — describing the interrelatedness of the
  participants in the international economy, and the illusory nature of nationality
  distinctions. Jensen persuades Beale to abandon the populist messages and preach
  his new "evangel". But television audiences find his new sermons on the dehumanization
  of society to be depressing, and ratings begin to slide, yet Jensen will not allow
  UBS executives to fire Beale. Seeing its two-for-the-price-of-one value — solving
  the Beale problem plus sparking a boost in season-opener ratings — Christensen,
  Hackett, and the other executives decide to hire the Ecumenical Liberation Army
  to assassinate Beale on the air; the assassination succeeds, putting an end to The
  Howard Beale Show and kicking off a second season of The Mao-Tse Tung Hour.
trajectory:
- description: Howard Beale is the longtime anchor of the UBS Evening News, working
    in a newsroom environment where ratings are increasingly declining, and tensions
    about the future of the news division are simmering. The atmosphere is one of
    professional strain, with upcoming changes looming but not yet enacted.
  id: s_0
  key_delta: Howard Beale learns officially of his imminent removal from the anchor
    position, establishing the central conflict of his threatened career end.
  trigger_event: Max Schumacher, news division president, informs Howard Beale in
    a private office that he has just two more weeks on the air due to declining ratings.
- description: After being informed of his firing, Howard and Max Schumacher spend
    an evening drinking heavily and expressing their frustrations about the state
    of the news industry in a private setting.
  id: s_1
  key_delta: Howard's public threat to commit suicide on air shocks the network and
    the audience, escalating the stakes surrounding his departure and forcing immediate
    network reaction.
  trigger_event: The following night's live broadcast where Howard Beale announces
    his intention to commit suicide on the next Tuesday's broadcast.
- description: Howard Beale is fired by UBS in direct response to his suicide threat
    on live television, creating a tense and uncertain environment for him and the
    news division.
  id: s_2
  key_delta: Howard is granted a controlled opportunity to say goodbye on air, temporarily
    preserving his public image and influence.
  trigger_event: Max Schumacher intervenes, negotiating for Howard to have a dignified
    farewell broadcast instead of an abrupt removal.
- description: During the farewell broadcast, Howard unexpectedly breaks his promise
    to apologize and launches into a passionate rant labeling life as 'bullshit',
    surprising the network team and viewers.
  id: s_3
  key_delta: Network executives recognize Howard's rebellious persona as a ratings
    driver, shifting their strategy from sidelining him to exploiting his antics for
    viewer engagement.
  trigger_event: The ratings spike dramatically after Howard's on-air outburst during
    the farewell broadcast.
- description: Howard Beale delivers an emotionally charged speech on live television,
    urging viewers to shout 'I'm as mad as hell, and I'm not going to take this anymore!'
    from their windows, stirring national attention.
  id: s_4
  key_delta: The network expands its pursuit of sensational content by commissioning
    a controversial program, marking a shift toward more provocative programming under
    Diana's leadership.
  trigger_event: Diana Christensen, head of programming, strikes a deal with radical
    terrorists to develop a new docudrama called the Mao-Tse Tung Hour for the upcoming
    season.
- description: Howard's ratings plateau and Diana Christensen offers Max Schumacher
    professional assistance to further develop the news show, while beginning a personal
    relationship with him.
  id: s_5
  key_delta: A new interpersonal dynamic develops between Max and Diana, intersecting
    with their professional lives and influencing future decisions at the network.
  trigger_event: After Max declines the professional offer but accepts the personal
    one, their affair begins.
- description: Max Schumacher decides to move away from the 'Howard as Angry Man'
    format, seeking to end Howard's sensationalized angry persona on the news broadcast.
  id: s_6
  key_delta: Organizational restructuring occurs with Max removed from his role, and
    control over Howard's show shifting towards Diana's entertainment-driven vision.
  trigger_event: Diana persuades Frank Hackett, her superior, to move the news show
    under the entertainment division and to fire Max Schumacher.
- description: Howard Beale becomes host of The Howard Beale Show, branded as 'the
    mad prophet of the airwaves', with a live studio audience that echoes his catchphrase
    enthusiastically.
  id: s_7
  key_delta: Howard transforms into a prominent celebrity figure, delivering his angry
    message to a mass audience and becoming a central media personality.
  trigger_event: The show's ratings soar, making it the highest-rated program on television
    and cementing Howard's celebrity status.
- description: Max and Diana's romantic relationship strains under the pressures of
    the show's success and their clashing personal priorities.
  id: s_8
  key_delta: Max commits to Diana personally, reshaping his family and personal life
    amidst the professional turmoil surrounding the show.
  trigger_event: They reconcile and resume their affair, with Max eventually leaving
    his wife of 25 years for Diana.
- description: Despite the romantic reunion, Max grows disillusioned with Diana's
    fanatical dedication to her career and emotional detachment.
  id: s_9
  key_delta: Tensions in their relationship deepen, with Max preparing to distance
    himself from Diana emotionally, forecasting further personal and professional
    conflicts.
  trigger_event: Max warns Diana about the self-destructive trajectory of her career,
    expressing his concerns about her indifference to human suffering and joy.
- description: Howard discovers that CCA, the conglomerate owning UBS, is to be acquired
    by a larger Saudi Arabian conglomerate, threatening the network's autonomy.
  id: s_10
  key_delta: Howard openly challenges corporate decisions affecting the network, raising
    alarm among UBS executives and increasing corporate tensions.
  trigger_event: Howard launches a public on-air tirade against the merger, urging
    viewers to send telegrams to the White House demanding intervention.
- description: In response to Howard's tirade, Hackett arranges a meeting between
    Howard and CCA chairman Arthur Jensen in the corporate boardroom, shifting the
    power dynamic.
  id: s_11
  key_delta: Howard's worldview is fundamentally challenged and reshaped by Jensen’s
    'corporate cosmology', prompting a shift in Howard's public messaging.
  trigger_event: Arthur Jensen delivers a persuasive and philosophical monologue to
    Howard about the nature of the global economy and interdependence.
- description: Howard adopts Jensen’s new message, preaching a corporate-centered
    evangel that dehumanizes society and contradicts his earlier populist rhetoric.
  id: s_12
  key_delta: Howard’s transformation alienates the audience, resulting in a significant
    and irreversible drop in show ratings.
  trigger_event: Audience ratings begin to decline as the new sermons are received
    as depressing and less engaging.
- description: Despite falling ratings, Jensen refuses to allow UBS executives to
    fire Howard, maintaining his controversial presence on air.
  id: s_13
  key_delta: A fatal conspiracy to eliminate Howard Beale is formed within the highest
    levels of network management.
  trigger_event: Network executives, including Diana and Hackett, conspire to hire
    the Ecumenical Liberation Army to assassinate Howard on air.
- description: Howard Beale is assassinated live on air, abruptly ending The Howard
    Beale Show.
  id: s_14
  key_delta: Howard’s death terminates his media influence and marks a definitive
    climax in the conflict between corporate control and populist media, allowing
    the network to pivot fully to new programming.
  trigger_event: The assassination coincides with the debut of the second season of
    Diana’s Mao-Tse Tung Hour.
