commitments:
- description: Howard Beale must first be informed by Max Schumacher of his imminent
    removal before publicly threatening suicide on air.
  id: c_0
  satisfaction_condition: Node s_0 occurs before s_1 is initiated; Howard has been
    officially informed prior to the suicide announcement.
  type: ordering
  violation_condition: Player attempts to trigger the suicide announcement (s_1) before
    the firing notification (s_0) has occurred.
- description: Howard’s firing must happen in direct response to his suicide threat
    on live television before he is granted a dignified farewell broadcast.
  id: c_1
  satisfaction_condition: Node s_2 occurs after s_1 and before s_3; firing is acknowledged
    prior to controlled farewell.
  type: ordering
  violation_condition: Player tries to arrange forgiveness or farewell (s_2) before
    firing (s_1) takes place.
- description: During the farewell broadcast phase (s_3), Howard either apologizes
    as promised or rants, causing ratings to spike, establishing network’s exploitation
    strategy.
  id: c_2
  satisfaction_condition: Between s_3 and s_4, Howard’s on-air outburst occurs resulting
    in a spike in ratings and network decision to exploit it.
  type: invariant
  violation_condition: Player alters farewell to omit the outburst or the ratings
    spike, negating the network’s motivation to exploit Howard’s antics.
- description: Howard’s iconic catchphrase and national galvanizing speech (s_4) must
    occur prior to Diana Christensen making deals for provocative programming and
    professional shifts in the network.
  id: c_3
  satisfaction_condition: s_4 precedes s_5 and s_6; Howard’s populist impact sets
    the stage for Diana’s programming decisions.
  type: ordering
  violation_condition: Player attempts to progress Diana’s radical programming deal
    or organizational restructuring (s_5, s_6) before the national rallying cry at
    s_4.
- description: Max and Diana’s personal relationship and professional conflicts unfold
    in sequence, impacting control over Howard’s show and Max’s employment status.
  id: c_4
  satisfaction_condition: s_5 through s_9 occur in order, reflecting affairs, professional
    refusals, firings, romantic progressions, and eventual disillusionment.
  type: invariant
  violation_condition: Player manages to execute personnel changes or relationship
    outcomes out of order, such as firing Max before their affair begins, or closing
    the romantic arc prematurely.
- description: Howard’s public opposition to the CCA buyout (s_10) must happen before
    his meeting with Arthur Jensen (s_11) to allow the philosophical conversion.
  id: c_5
  satisfaction_condition: s_10 is completed before s_11 initiates; Howard’s tirade
    triggers the Jensen meeting.
  type: ordering
  violation_condition: Player attempts to trigger or conclude Jensen’s ideology exposition
    (s_11) before Howard’s anti-merger broadcast (s_10).
- description: After the Jensen meeting, Howard must adopt the corporate evangel (s_12)
    leading to a measurable audience decline, marking a tonal and narrative shift.
  id: c_6
  satisfaction_condition: Between s_11 and s_13, Howard’s messaging changes and audience
    ratings drop as a direct consequence.
  type: invariant
  violation_condition: Player prevents or reverses Howard’s adoption of Jensen’s message
    or negates the ratings decline.
- description: Despite falling ratings, Jensen forbids firing Howard (s_13) before
    network conspirators hire the Ecumenical Liberation Army to assassinate him.
  id: c_7
  satisfaction_condition: s_13 occurs only after s_12 and before s_14; firing refusal
    must precede assassination conspiracy.
  type: ordering
  violation_condition: Player attempts to fire Howard after Jensen’s veto without
    the assassination plot or tries to assassinate Howard before Jensen’s involvement.
- description: The narrative must culminate with Howard Beale’s live on-air assassination
    and the immediate transition to Mao-Tse Tung Hour’s launch.
  id: c_8
  satisfaction_condition: s_14 finalizes the timeline, marking Howard’s death and
    the new programming debut.
  type: achievement
  violation_condition: Player prevents assassination or skips the transition to Mao-Tse
    Tung Hour, breaking the fundamental narrative resolution.
