commitments:
- description: Achilles must be approached and persuaded by Odysseus before he considers
    joining the war.
  id: c_0
  satisfaction_condition: Node s_0 is triggered before node s_2 occurs.
  type: ordering
  violation_condition: Achilles commits to war (s_2) without Odysseus' visit to Phtia
    (s_0).
- description: Achilles must receive prophecy from Thetis before deciding to join
    the war.
  id: c_1
  satisfaction_condition: Node s_1 occurs prior to Achilles' commitment at s_2.
  type: ordering
  violation_condition: Achilles decides to go to Troy (s_2) without the visit to Thetis
    (s_1).
- description: Once Achilles decides to join the war, the Greek forces begin preparations
    to sail to Troy and he leads the Myrmidons.
  id: c_2
  satisfaction_condition: From s_2 onward until s_3, it must be true that Achilles
    and the Myrmidons are preparing to sail and act as vanguard.
  type: invariant
  violation_condition: Achilles commits to war (s_2) but the Greek forces do not organize
    or sail to Troy immediately after.
- description: Achilles' dispute with Agamemnon over Briseis causes Achilles to withdraw
    from personal participation in battle during the Trojan campaign, until Patroclus
    later enters combat wearing Achilles' armor.
  id: c_3
  satisfaction_condition: Between s_3 and s_9, Achilles himself remains withdrawn
    from active battle operations; the apparent return at s_9 is actually Patroclus
    leading the Myrmidons in Achilles' armor.
  type: invariant
  violation_condition: Achilles personally resumes open battle before Patroclus'
    disguised intervention at s_9, or the story treats s_9 as Achilles truly returning
    to combat.
- description: The duel between Paris and Menelaus, and Menelaus' death by Hector,
    must precede the major battle resumption and Greek retreat.
  id: c_4
  satisfaction_condition: Nodes s_4 and s_5 occur in order before s_6.
  type: ordering
  violation_condition: Greek retreat and casualty aftermath (s_6) are shown before
    the duel and death of Menelaus (s_4, s_5).
- description: Achilles protects and tends to Briseis personally during the Greek
    army's low morale phase.
  id: c_5
  satisfaction_condition: Between s_6 and s_7, Achilles cares for Briseis and their
    relationship deepens.
  type: invariant
  violation_condition: Briseis is unattended or harmed by Greeks while Achilles ignores
    or avoids her during this period.
- description: Achilles’ emotional state deteriorates after Patroclus’ death, triggering
    rage and aggressive behavior.
  id: c_6
  satisfaction_condition: Between s_10 and s_12, Achilles exhibits grief and violent
    outbursts including assaulting Eudorus and neglecting Briseis.
  type: invariant
  violation_condition: Achilles shows no significant change in behavior following
    Patroclus’ death or before performing funeral rites.
- description: Patroclus’ death must occur before Achilles’ personal revenge duel
    with Hector.
  id: c_7
  satisfaction_condition: Node s_10 (Patroclus' death) must have occurred before s_14
    (Achilles confronts Hector).
  type: achievement
  violation_condition: Achilles faces Hector in single combat (s_14) without Patroclus
    having died previously (s_10).
- description: Hector’s death and subsequent body retrieval by Priam must precede
    the 12-day truce and funeral rites.
  id: c_8
  satisfaction_condition: Nodes s_16 and s_17 occur sequentially before s_18.
  type: ordering
  violation_condition: The funeral preparations or truce (s_18) occur before Hector’s
    death and body retrieval (s_16, s_17).
- description: During the 12-day truce, no attacks against Troy occur and both sides
    respect the ceasefire.
  id: c_9
  satisfaction_condition: Between s_17 and s_19, the Greek army abstains from attacks;
    the Trojans mourn.
  type: invariant
  violation_condition: Hostilities or offensives are initiated before the truce expires
    (i.e., before s_19).
- description: The wooden horse stratagem must be constructed and accepted into Troy
    before the Greek army infiltrates the city for the sack.
  id: c_10
  satisfaction_condition: Nodes s_20 precedes s_21.
  type: ordering
  violation_condition: Greeks infiltrate Troy by surprise (s_21) without prior placement
    and acceptance of the horse (s_20).
- description: Briseis must kill Agamemnon during the sack to assert her agency and
    survive.
  id: c_11
  satisfaction_condition: Node s_24 triggers with Agamemnon's death at Briseis' hand.
  type: achievement
  violation_condition: Agamemnon dies before or without Briseis killing him during
    the sack.
- description: Paris must shoot Achilles and Briseis must intervene before Achilles
    dies from the fatal arrow wound.
  id: c_12
  satisfaction_condition: Node s_25 must occur before s_26.
  type: ordering
  violation_condition: Achilles dies (s_26) without the preceding shooting by Paris
    and Briseis’ protection (s_25).
- description: Funeral rites for Achilles and Odysseus’ final speech must occur to
    close the story with proper legacy framing.
  id: c_13
  satisfaction_condition: Node s_27 must occur before narrative end.
  type: achievement
  violation_condition: The story ends without Achilles’ funeral and Odysseus’ concluding
    remarks.
