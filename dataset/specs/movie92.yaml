    recruitment visit (s_0) occurring.
- description: Munny's recruitment of Ned Logan (s_2) must occur after Munny has committed
    to the mission (s_1), preserving logical team formation order.
  id: c_1
  satisfaction_condition: Node s_1 is completed prior to the initiation of s_2.
  type: ordering
  violation_condition: Recruitment of Ned Logan (s_2) occurs before Munny’s mission
    commitment (s_1).
- description: Between arrival in Big Whiskey and initial confrontation (s_3) to recovery
    at the barn (s_4), Munny must remain physically identifiable as a threat to Little
    Bill’s law enforcement, i.e., he remains disarmed, beaten, and ejected, preventing
    unnoticed entry or status.
  id: c_2
  satisfaction_condition: During [s_3, s_4], Munny is found and beaten by Little Bill’s
    deputies, disarmed through their lawful action in town.
  type: invariant
  violation_condition: Munny manages to remain armed, unrecognized, or not confronted
    by Little Bill’s law enforcement during this phase.
- description: The first target of the assassination mission, Davey-Boy Bunting, must
    be killed (s_5) before any subsequent assassinations or final conflict proceeds.
  id: c_3
  satisfaction_condition: Node s_5 is completed with Bunting confirmed killed.
  type: achievement
  violation_condition: Any narrative progression attempting to kill Quick Mike (s_7)
    or begin final confrontations before Bunting is killed (s_5) is disallowed.
- description: Logan must decide to leave the assassination team (s_6) after the killing
    of Bunting (s_5) but before the killing of Quick Mike (s_7), ensuring proper team
    dynamics and character exit.
  id: c_4
  satisfaction_condition: Node s_6 occurs strictly after s_5 and prior to s_7.
  type: ordering
  violation_condition: Logan leaves before Bunting is killed (s_5) or after Quick
    Mike is killed (s_7).
- description: Between the killing of Quick Mike (s_7) and the Kid’s confession (s_8),
    the Kid must not renounce the gunfighter lifestyle or confess prior to the killing,
    maintaining causal consistency.
  id: c_5
  satisfaction_condition: The Kid’s confession in s_8 occurs only after Quick Mike's
    killing in s_7.
  type: invariant
  violation_condition: The Kid confesses to renouncing violence before or during s_7,
    prior to Quick Mike's death.
- description: The revelation of Logan’s capture and death by Little Bill’s men (s_9)
    must occur before the Kid departs alone for Kansas (s_10), maintaining proper
    exposure of danger and motivation for Munny’s retaliation.
  id: c_6
  satisfaction_condition: Node s_9, including the revelation of Logan's death and
    exposure of identities, precedes s_10.
  type: achievement
  violation_condition: The Kid departs for Kansas (s_10) without the group having
    learned of Logan’s fate (s_9).
- description: Munny must consciously revert to violent behavior (s_10) by drinking
    whiskey before returning to Big Whiskey for the final violent confrontation (s_11),
    preserving narrative of character relapse.
  id: c_7
  satisfaction_condition: Munny’s drinking and preparatory actions in s_10 occur before
    s_11’s violent entrance.
  type: ordering
  violation_condition: Munny initiates violent confrontation (s_11) without prior
    drinking or preparatory relapse (s_10).
- description: The final confrontation and elimination of Little Bill (s_13) must
    occur before the departure scene (s_14), establishing resolution of conflict before
    withdrawal.
  id: c_8
  satisfaction_condition: Node s_13 with Bill’s death completes before s_14 begins.
  type: achievement
  violation_condition: Munny departs or issues warnings (s_14) without having killed
    Little Bill (s_13).
- description: After killing Little Bill (s_13) and issuing threats (s_14), Munny
    must leave town without instigating further violent conflict immediately, preserving
    narrative closure on the immediate violent episode.
  id: c_9
  satisfaction_condition: During s_14, no new violent acts commence after threats
    prior to Munny leaving town.
  type: invariant
  violation_condition: Munny initiates or escalates additional violence in Big Whiskey
    after s_14’s warnings but before departure.
- description: Munny’s personal arc ends with his return to a peaceful life, confirmed
    by his visit to his wife’s grave and epilogue (s_15), marking narrative closure.
  id: c_10
  satisfaction_condition: Node s_15, showing Munny’s peaceful resolution and family
    prosperity, completes the narrative arc.
  type: achievement
  violation_condition: Munny fails to return to his farm or the narrative closes without
    establishing his peaceful future (s_15).
