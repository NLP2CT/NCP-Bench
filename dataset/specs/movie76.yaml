commitments:
- description: The discovery of Margot’s affair through Mark's love letter (s_0) must
    precede all planning and blackmail actions towards Swann (s_1 and beyond).
  id: c_0
  satisfaction_condition: Node s_0 has occurred before any blackmail or murder planning
    event (s_1 or later) is acknowledged by the system.
  type: ordering
  violation_condition: Player’s input leads to blackmailing or murder plans occurring
    or being acknowledged before Tony has discovered the affair evidence (before s_0).
- description: Swann remains coerced and bound by blackmail into agreeing to kill
    Margot from s_1 through s_5; any conflicting agency or motives introduced before
    Swann’s death invalidates logic.
  id: c_1
  satisfaction_condition: Between s_1 and s_5, Swann is always under Tony’s blackmail
    pressure and consent to commit the murder.
  type: invariant
  violation_condition: Player input or narrative attempts lead to Swann acting independently
    without blackmail leverage or before s_1 or after s_5 when he is already dead.
- description: The murder plan execution actions (s_3) must precede the failed assassination
    attempt and Swann’s death (s_4).
  id: c_2
  satisfaction_condition: System only acknowledges the murder plan briefing and preparation
    (s_3) before any attempt or failure thereof (s_4).
  type: ordering
  violation_condition: Player-induced sequence where Swann’s killing attempt or Margot’s
    defense occurs before murder planning is logically established.
- description: Margot kills Swann in self-defense during the failed assassination
    attempt (s_4), never the initiator of unprovoked aggression.
  id: c_3
  satisfaction_condition: At s_4, the killing of Swann must be interpreted as Margot
    defending herself against Swann’s attack.
  type: invariant
  violation_condition: Player’s actions or system states represent Margot as culpable
    for initiating violence or attacking Swann first during s_4.
- description: Tony manipulates the crime scene and instructs Margot to conceal his
    interference only after Swann’s death and before formal police involvement (s_5).
  id: c_4
  satisfaction_condition: Between s_4 and s_6, Tony plants evidence as described and
    persuades Margot to keep quiet about his instructions.
  type: invariant
  violation_condition: Player or narrative causes evidence tampering or Tony’s instructions
    to Margot outside this window or prior to Swann’s death.
- description: Police investigation and questioning (s_6) must follow the murder attempt
    and Tony’s framing efforts (s_5).
  id: c_5
  satisfaction_condition: Police interrogation by Hubbard on events and inconsistencies
    recorded only after s_5 has transpired.
  type: ordering
  violation_condition: Player triggers police interrogation or investigation before
    the murder attempt and framing actions logically occur.
- description: Margot must be arrested, tried, and convicted based on Tony’s framing
    and investigation outcomes before the final police suspicion of Tony arises (achievement
    of s_7).
  id: c_6
  satisfaction_condition: Margot's conviction (s_7) occurs before any police open
    suspicion or re-investigation towards Tony.
  type: achievement
  violation_condition: Player or system exposes Tony’s involvement before Margot is
    legally convicted.
- description: Mark’s plea for Tony to confess (s_7) occurs before Tony’s refusal
    and Hubbard’s developing suspicion (s_8).
  id: c_7
  satisfaction_condition: Mark’s appeal to Tony is present in the narrative prior
    to Hubbard’s incriminating discoveries about Tony’s key and cash.
  type: ordering
  violation_condition: Player input causes Hubbard’s suspicion or discovery of Tony’s
    evidence before Mark’s plea is made or acknowledged.
- description: Hubbard’s discovery of Tony’s hidden key and cash (s_8) must precede
    his covert reentry to the flat using Tony’s key (s_9).
  id: c_8
  satisfaction_condition: Hubbard only executes covert substitution of the raincoat
    and uses Tony’s key after confirming hidden evidence indicating Tony’s guilt.
  type: invariant
  violation_condition: Player is allowed to perform or system acknowledges Hubbard’s
    covert search actions before s_8 event.
- description: Margot’s release and evidence demonstration proving she is unaware
    of the hidden key (s_10) must occur before Tony’s exposure via inability to open
    door with handbag key and subsequent use of hidden key (s_11).
  id: c_9
  satisfaction_condition: System depicts Margot re-entering without knowledge of the
    hidden key before Tony’s failed attempt with handbag key and the later use of
    the hidden key.
  type: ordering
  violation_condition: Player or system sequences Tony’s exposure or key revelations
    before Margot’s release and her unsuccessful entry attempt.
- description: Tony’s guilt and capture must be concretely proven by his use of the
    hidden key at the front door with blocked escape (s_11), sealing the narrative
    resolution.
  id: c_10
  satisfaction_condition: Tony’s unlocking of the front door with the secret key and
    police containment happen as final proof of guilt in the narrative endpoint.
  type: achievement
  violation_condition: Player bypasses or negates this conclusive proof of guilt (e.g.,
    Tony escapes or evidence is missing) invalidating the story resolution.
- description: The narrative closure where Tony accepts arrest and drinks calmly in
    the flat surrounded by police (s_12) must follow the sealing of his guilt and
    blocking of escape (s_11).
  id: c_11
  satisfaction_condition: Narrative only ends with Tony in custody resignedly drinking
    after all evidence and capture conditions at s_11 are met.
  type: invariant
  violation_condition: Player manipulates the story to avoid or skip Tony’s acceptance
    and confinement following his exposure.
