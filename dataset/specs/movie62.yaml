commitments:
- description: The detection of the Rebel base on Hoth and subsequent Imperial assault
    must occur in strict sequence before the base falls and Rebels escape.
  id: c_0
  satisfaction_condition: Node s_0 (probe droid lands on Hoth), then s_1 (Imperial
    detection of base), then s_2 (AT-AT attack), then s_3 (Luke destroys an AT-AT),
    then s_4 (Rebel base fall and evacuation) have all occurred in order.
  type: ordering
  violation_condition: Allowing s_4 (Rebels evacuate) or any later event to occur
    before s_0 through s_3 completes, or skipping any of these nodes, breaking logical
    progression.
- description: Luke's Jedi training on Dagobah must begin only after his escape from
    Hoth and arrival on Dagobah.
  id: c_1
  satisfaction_condition: Events progress from s_4 (base fall and evacuation) to s_5
    (Luke arrives on Dagobah and meets Yoda), then s_6 (Luke trains with Yoda) in
    correct order.
  type: ordering
  violation_condition: Triggering training milestones or Jedi power growth (s_6) before
    Luke escapes Hoth or arrives on Dagobah (s_4, s_5).
- description: Han and Leia’s escape and hiding in the asteroid field must precede
    their arrival at Cloud City and subsequent betrayal by Lando.
  id: c_2
  satisfaction_condition: The trajectory follows s_4 (escape from Hoth), s_5 (asteroid
    field hiding), s_7 (Boba Fett tracks falcon), and s_8 (arrival and betrayal at
    Cloud City) in sequence.
  type: ordering
  violation_condition: Bypassing or reordering arrival and betrayal at Cloud City
    (s_8) before or without prior escape and hiding (s_4 and s_5).
- description: Han Solo remains captive and frozen in carbonite once Vader’s test
    is complete, until Rebels mount a rescue mission.
  id: c_3
  satisfaction_condition: After s_9 (Han frozen and handed to Boba Fett), Han remains
    in carbonite captivity during s_10 through s_13 until a rescue attempt is underway.
  type: invariant
  violation_condition: Premature release or escape of Han before s_13 rescue mission
    or logical narrative phase allowing rescue attempts.
- description: The critical revelation that Darth Vader is Luke’s father must be disclosed
    during their Cloud City duel before Luke’s escape.
  id: c_4
  satisfaction_condition: 'Event s_11 occurs: Vader reveals paternal identity during
    lightsaber duel with Luke prior to Luke falling down the air shaft.'
  type: achievement
  violation_condition: Allowing player or system to reveal Vader’s paternity prematurely
    (before s_11) or skipping this revelation entirely.
- description: Luke’s survival and call for help must occur after the duel and reveal,
    prompting Rebel rescue efforts.
  id: c_5
  satisfaction_condition: Event s_12 (Luke escapes fall and telepathically calls Leia)
    happens strictly after s_11 (duel and revelation).
  type: ordering
  violation_condition: Armoring or initiating rescue before Luke’s fall or telepathic
    call, or triggering rescue without Luke signaling for help.
- description: The Rebel counter-operation to rescue Han from Boba Fett must be launched
    before narrative conclusion.
  id: c_6
  satisfaction_condition: 'Event s_13 occurs: Lando and Chewbacca depart to rescue
    Han, marking transition to active recovery phase.'
  type: achievement
  violation_condition: Ending or concluding narrative without setting the rescue mission
    in motion or bypassing this counter-operation entirely.
- description: Player acting as Darth Vader must not disclose key truths to Luke or
    other characters before the corresponding narrative nodes unlock their revelation
    in-story.
  id: c_7
  satisfaction_condition: Vader’s paternity is not revealed to Luke or surfaced openly
    in the narrative before node s_11, even though Vader already knows it.
  type: invariant
  violation_condition: Player causes Vader’s paternity or other protected strategic
    truths to be revealed in-story before s_11 or before the relevant narrative phase.
- description: Vader’s use of bounty hunters to capture Rebels initiates only after
    failure to capture them through conventional Imperial means.
  id: c_8
  satisfaction_condition: Deployment of bounty hunters (s_7) occurs after Rebel escape
    from Hoth (s_4) and Falcon’s evasion (s_5).
  type: ordering
  violation_condition: Allowing bounty hunters pursuit or capture attempts before
    Rebels have escaped base or before probe droid reveals Rebel location.
