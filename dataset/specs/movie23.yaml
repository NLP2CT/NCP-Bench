    interaction with the castle or castle residents (s_1 or beyond) before s_0 is
    triggered.
- description: Frank-N-Furter's introduction must precede any knowledge or interactions
    involving his creation Rocky Horror, ensuring narrative causality and character
    influence continuity.
  id: c_1
  satisfaction_condition: Node s_2 occurs before s_3 is acknowledged or any player
    or NPC interaction references Rocky Horror's life state.
  type: ordering
  violation_condition: Player or system acknowledges Rocky Horror’s animation or existence
    (s_3) without preceding acknowledgment of Frank’s introduction (s_2).
- description: Between Frank's introduction (s_2) and the killing of Eddie (s_5),
    no explicit violence causing a character’s death may occur, preserving narrative
    pacing and character threat escalation.
  id: c_2
  satisfaction_condition: All narrative and player actions between nodes s_2 and s_5
    must show no character deaths.
  type: invariant
  violation_condition: Any violent death other than Eddie’s in s_5 is triggered or
    acknowledged before s_5.
- description: The creation and animation of Rocky Horror (s_3) must occur before
    any seduction or manipulation of Brad and Janet by Frank (s_6), preserving the
    sequence of revealing Frank’s power and his creation’s role.
  id: c_3
  satisfaction_condition: Node s_3 is completed before s_6 is acknowledged.
  type: ordering
  violation_condition: Seduction or impersonation by Frank (s_6) occurs or is recognized
    before the animation of Rocky Horror (s_3).
- description: Janet’s discovery of Rocky’s vulnerability (s_7) must precede her becoming
    intimate with Rocky (s_8), establishing conditional and causal relationship in
    their developing connection.
  id: c_4
  satisfaction_condition: Node s_7 is completed before s_8 is acknowledged.
  type: ordering
  violation_condition: Janet’s physical intimacy with Rocky (s_8) occurs or is recognized
    before discovering him in the vulnerable state (s_7).
- description: Dr. Everett Scott’s arrival and discovery at the castle (s_9) must
    precede the group's realization of Janet and Rocky hiding together (s_10), maintaining
    logical investigation sequence.
  id: c_5
  satisfaction_condition: s_9 must be achieved before s_10 is recognized.
  type: ordering
  violation_condition: The revelation of Janet and Rocky hiding (s_10) is recognized
    or acted upon before Dr. Scott’s presence (s_9).
- description: Between the intruder’s discovery (s_9) and Frank’s Medusa Transducer
    capture of the group (s_13), the group must retain autonomy and not be prematurely
    immobilized or forced to perform.
  id: c_6
  satisfaction_condition: From s_9 to s_13, no permanent immobilization or performance
    forcing occurs.
  type: invariant
  violation_condition: Group is immobilized or forced into performance states by Frank
    before node s_13 occurs.
- description: The key violent events (Eddie’s death in s_5 and the subsequent coup
    killings in s_14) must both occur to establish the irreversibility of Frank’s
    regime and shift in power.
  id: c_7
  satisfaction_condition: Both nodes s_5 (Eddie’s killing) and s_14 (coup and killings)
    have been completed.
  type: achievement
  violation_condition: The narrative concludes without having both violent milestones
    (s_5 and s_14) taking place.
- description: Throughout the narrative from s_0 to s_15, the fundamental human characters
    (Brad, Janet, Dr. Scott) must not be killed or permanently removed before the
    final release by Riff Raff and Magenta at s_15, preserving survivor status in
    the ending.
  id: c_8
  satisfaction_condition: No deaths or permanent removal of Brad, Janet, or Dr. Scott
    occur from s_0 up to s_15.
  type: invariant
  violation_condition: Any of these three characters die or are irreversibly removed
    before s_15.
- description: The final departure of the castle and alien Transylvanians (s_15) must
    occur after the overthrow coup by Riff Raff and Magenta (s_14), ensuring logical
    resolution of power dynamics.
  id: c_9
  satisfaction_condition: Node s_14 completed before s_15 is acknowledged and triggered.
  type: ordering
  violation_condition: Castle departure (s_15) occurs before or without the coup and
    killings (s_14).
- description: Once the group is captured and transformed into statues by the Medusa
    Transducer (s_13), they must remain under Frank’s control until the coup interrupts
    the performance (s_14), preventing premature release or escape.
  id: c_10
  satisfaction_condition: Between s_13 and s_14, the group remains immobilized and
    performing under Frank’s control.
  type: invariant
  violation_condition: Any release, escape, or loss of control over the group by Frank
    happens before s_14.
