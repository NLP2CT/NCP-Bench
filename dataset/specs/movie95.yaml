commitments:
- description: The story must always present Brushy Bill Roberts' claim of being Billy
    the Kid only after the initial encounter with the young attorney (s_0), preventing
    premature acceptance of his identity before hearing his full story.
  id: c_0
  satisfaction_condition: Node s_0 (Brushy Bill begins telling his story) has occurred
    before any acceptance or acknowledgment of his claim.
  type: ordering
  violation_condition: Player or system accepts or reveals Brushy Bill's identity
    as Billy the Kid before node s_0 is reached.
- description: The events of the flashback (s_1 to s_18) must unfold sequentially
    to preserve narrative coherence and gradual discovery of events leading to Billy's
    apparent death.
  id: c_1
  satisfaction_condition: All nodes from s_1 through s_18 occur strictly in their
    defined order without skipping or reordering.
  type: ordering
  violation_condition: Any node s_j (j > i) occurs before node s_i in the player's
    experience or system narration.
- description: Brushy Bill's claim to be Billy the Kid remains unconfirmed and controversial
    throughout the narrative until the epilogue, preserving the mystery and ambiguity.
  id: c_2
  satisfaction_condition: From s_0 through s_20, the system never definitively confirms
    nor denies Brushy Bill’s true identity beyond 'possibility' and preserves ambiguity.
  type: invariant
  violation_condition: System or player forces a conclusive and irrefutable verdict
    on Brushy Bill’s identity before the epilogue (s_20).
- description: The narrative must reach the final epilogue (s_20) revealing the fates
    of key figures and the unresolved debate, providing closure to the mystery framework.
  id: c_3
  satisfaction_condition: Node s_20 is reached and narrated, concluding the story
    with the historic unresolved mystery.
  type: achievement
  violation_condition: The story ends or jumps to a conclusion without presenting
    the epilogue at s_20.
- description: Pat Garrett must switch roles from gang member to lawman before initiating
    pursuit of Billy the Kid, preserving his character arc and logical motivations.
  id: c_4
  satisfaction_condition: Node s_7 (Garrett accepts sheriff role and forms posse)
    occurs strictly after s_6 (Garrett leaves gang) and before any sustained pursuit
    events (s_8+).
  type: invariant
  violation_condition: Garrett initiates official pursuit or chase of Billy before
    accepting the sheriff position and forming posse at s_7.
- description: Billy the Kid's imprisonment and failed political deal must precede
    any escape attempts, preserving causal sequence for tension and plot.
  id: c_5
  satisfaction_condition: Nodes s_2 (warrants and arrest), s_3 (governor deal), and
    s_4 (Billy is tricked) occur strictly in order before s_5 (escape via lynch mob
    disguise).
  type: ordering
  violation_condition: Player triggers escape attempt or gang reunion before Billy's
    arrest, political meeting, and failed testimony opportunity.
- description: The death of gang members (Tom O'Folliard and Doc Scurlock) must occur
    only after the pursuit by Garrett's posse has intensified and capture attempts
    are underway.
  id: c_6
  satisfaction_condition: Node s_11 (Tom shot and killed) and s_12 (Doc sacrificed)
    occur only after node s_10 (Garrett tracks Billy) has happened.
  type: ordering
  violation_condition: Player causes gang member deaths before the posse has located
    or pursued the gang.
- description: Billy's capture and formal sentencing must occur before any prison
    escape attempt, maintaining narrative logic of incarceration before breakout.
  id: c_7
  satisfaction_condition: Node s_13 (Billy captured and sentenced) occurs strictly
    before nodes s_14 and s_15 (pistol gifted and escape).
  type: ordering
  violation_condition: Billy escapes or receives aid in escaping before being officially
    captured and sentenced.
- description: Pat Garrett must not kill Billy the Kid directly; instead, the story
    mandates faking Billy’s death at the end to preserve the unresolved mystery.
  id: c_8
  satisfaction_condition: At node s_18, Garrett refuses to shoot Billy and fakes his
    death, sparing his life as per narrative.
  type: invariant
  violation_condition: Player or system triggers Garrett killing Billy outright, violating
    the fabricated-death logic.
- description: The system must not allow the lawyer character (or player assuming
    his role) to conclusively prove Brushy Bill’s identity before the completion of
    the full narrative arc and epilogue.
  id: c_9
  satisfaction_condition: Only after node s_19 (lawyer is convinced) and s_20 (epilogue)
    is the subjective belief in Brushy Bill’s claim acknowledged; no earlier certainty
    or proof is allowed.
  type: invariant
  violation_condition: The player or system reveals incontestable proof or acceptance
    of Brushy Bill’s identity before nodes s_19 and s_20.
