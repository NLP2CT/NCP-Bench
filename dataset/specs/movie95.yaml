meta:
  genres: ["Western", "Action"]
  id: movie95
  player_role: Pat Garrett
  title: "Young Guns II"
synopsis: The film opens in 1950 with a young attorney talking to an elderly man named
  Brushy Bill Roberts, who claims that he is William H. Bonney, whom "everyone" knows
  to have been shot and killed by Pat Garrett in 1881. The majority of the film takes
  place in flashbacks as the old man recalls his story for the lawyer, who asks if
  the man has any proof that he is the famous outlaw. Brushy Bill's story begins with
  the remaining Regulators having gone their separate ways. Billy has become part
  of a new gang with "Arkansas" Dave Rudabaugh and Pat Garrett. The New Mexico governor
  has issued warrants for the arrests of those involved in the Lincoln County wars,
  including Billy, Doc Scurlock, and Jose Chavez y Chavez, who are dragged into town
  and imprisoned to await hanging. Meanwhile, Billy meets with the new governor Lew
  Wallace who agrees to pardon Billy if he testifies against the Dolan-Murphy faction.
  Billy soon finds out that he was tricked into being arrested with no chance of testifying
  against his old enemies. After escaping, Billy along with the help of Rudabaugh
  and Garrett, pose as a lynch mob to spring his old comrades from a hanging. When
  the gang successfully escape Lincoln, Billy mentions the Mexican Blackbird. Garrett
  decides not to go with the gang and, instead, open a boarding house. As they make
  a run for the border along with farmer Hendry William French and 14 year old Tom
  O'Folliard, cattle baron John Simpson Chisum and Governor Wallace approach Garrett
  to offer him the job as Lincoln County Sheriff and $1000 to use whatever resources
  he needs to hunt Bonney down and kill him. Garrett agrees and, forming a posse,
  begins his pursuit of the gang. Billy and the gang soon come to the town of White
  Oaks where they meet up with former companion, Jane Greathouse who runs a local
  bordello. Later that night, the town lynch mob comes for the gang and are intent
  on a hanging. Deputy Carlisle tries to negotiate a deal, "the Indian" for a safe
  rideout. Billy refuses the offer and pushes the Deputy out the door, who is then
  accidentally killed by the lynch mob. Garrett soon tracks Billy to the bordello,
  but is too late. Billy and his gang are continuously tracked by the posse, narrowly
  evading capture, but Tom is soon shot dead by Garrett. As they hideout, Billy reveals
  that the Mexican Blackbird doesn't exist; it was just a pawn to get the gang back
  together and to keep riding. Doc is angered and tries to leave for home, but he
  is shot by one of Garrett's men and sacrifices himself to enable his friends to
  escape. Billy the Kid is soon brought back into Lincoln by Garrett and is sentenced
  to death by hanging. He is visited by Jane Greathouse, who arranges to meet him
  during his daily outhouse visit, where she gives him a pistol. Billy uses the pistol
  to kill two guards and escapes to Old Fort Sumner. By the time he arrives, Dave
  has abandoned the group to make his way to Mexico, and Chavez is dying from a bullet
  wound. During the night Garrett finds Billy as he is unarmed. Billy asks Garrett
  to let him hide in Mexico and tell the authorities that he killed him. Garrett declines
  because he believes Billy would not be able to resist coming back to the United
  States. Billy turns around, forcing Garrett to have to shoot him in the back, which
  he does not. In the morning, a fake burial is staged for Billy and Garrett's horse
  is seen being taken by Billy. The film ends with the lawyer being convinced that
  Brushy Bill is Billy the Kid. The epilogue reveals that Dave was beheaded once he
  reached Mexico to discourage more outlaws from crossing the border, Garrett's book
  detailing his pursuit of Billy is a dismal failure and he is eventually shot and
  killed, and despite corroboration from several surviving friends of the outlaw,
  Brushy Bill Roberts was never credited as being Billy the Kid and he died shortly
  after. The film ends saying that whether or not Brushy Bill was Billy the Kid remains
  a mystery. The real Brushy Bill Roberts did in fact go before New Mexico Gov. Thomas
  Mabry in 1950, but was discredited at a hearing that has been repeatedly criticized
  for its circus atmosphere. In the years since, historical and forensic evidence
  of varying degrees of credibility has emerged on both sides of the debate over the
  true identity of Brushy Bill Roberts. Could he possibly in fact have been Billy
  the Kid? The issue has never been conclusively decided, although the majority of
  academic historians now tend to discount Robert's claims. However, the debate will
  probably continue for a long time to come, as no irrefutable evidence that Roberts
  was not the Kid has emerged, and without that some will always be willing to believe
  that it is at least a possibility. The Brushy Bill story is another fascinating
  mystery of the Old West era.
trajectory:
- description: In 1950, a young attorney meets an elderly man named Brushy Bill Roberts
    who claims to be William H. Bonney, aka Billy the Kid, thought dead since 1881;
    the scene is set in a modest, quiet room where the old man begins recounting his
    story.
  id: s_0
  key_delta: Presentation of Brushy Bill Roberts claiming to be Billy the Kid; the
    historical controversy regarding Billy's death is introduced.
  trigger_event: Brushy Bill Roberts starts telling his story to the young attorney.
- description: Flashback to post-Lincoln County War period where the remaining Regulators
    have disbanded; Billy the Kid has joined a new outlaw gang with Arkansas Dave
    Rudabaugh and Pat Garrett as members.
  id: s_1
  key_delta: Introduction of Billy the Kid’s new gang dynamics including key members
    Garrett and Rudabaugh.
  trigger_event: Billy narrates the formation of his new gang and the fractured status
    of the Regulators.
- description: The New Mexico governor issues arrest warrants for Billy, Doc Scurlock,
    and Jose Chavez y Chavez for their roles in the Lincoln County wars; the scene
    is tense with law enforcement action imminent.
  id: s_2
  key_delta: Billy and several members of his former gang are imprisoned, facing hanging
    for their outlaw activities.
  trigger_event: Warrants are issued and law enforcement arrests Billy and his comrades,
    imprisoning them awaiting hanging.
- description: Billy meets Governor Lew Wallace who offers him a pardon if he testifies
    against the Dolan-Murphy faction; the meeting takes place in a formal governor’s
    office filled with political tension.
  id: s_3
  key_delta: Introduction of a deal with the governor involving a pardon contingent
    on turning against enemies.
  trigger_event: Billy agrees to discuss potential pardon in exchange for testimony.
- description: Billy discovers he was tricked and will not be allowed to testify;
    he is effectively trapped with no political leverage, creating a window for action.
  id: s_4
  key_delta: Billy and comrades lose the chance of political bailout and face imminent
    execution.
  trigger_event: Billy realizes no testimony opportunity will be granted and plans
    an escape.
- description: Billy, Rudabaugh, and Garrett masquerade as a lynch mob to free Billy’s
    old comrades from hanging; the event occurs under cover of darkness at the jail.
  id: s_5
  key_delta: Billy’s gang reunites and escapes Lincoln, temporarily avoiding death
    sentence.
  trigger_event: The staged lynch mob rescue successfully frees the prisoners from
    imminent hanging.
- description: Billy references the 'Mexican Blackbird' as they flee Lincoln; Pat
    Garrett decides not to continue with the gang and instead opens a boarding house,
    signaling a split.
  id: s_6
  key_delta: The gang’s cohesion fractures as Garrett leaves, marking diverging paths.
  trigger_event: Garrett chooses to leave the gang and start a stable livelihood running
    a boarding house.
- description: Garrett is approached by cattle baron John Simpson Chisum and Governor
    Wallace with an offer to become Lincoln County Sheriff and $1000 to pursue and
    kill Billy; Garrett is in his boarding house considering the offer.
  id: s_7
  key_delta: Garrett shifts from gang member to lawman, initiating official pursuit
    of Billy.
  trigger_event: Garrett accepts the sheriff’s position and forms a posse to hunt
    Billy the Kid.
- description: Billy and his gang arrive in White Oaks and meet Jane Greathouse who
    runs a bordello; the town atmosphere is hostile and law enforcement presence increases.
  id: s_8
  key_delta: The gang directly confronts violent civilian law enforcement threats
    in White Oaks.
  trigger_event: The local lynch mob arrives at the bordello intending to capture
    and hang the gang.
- description: Deputy Carlisle tries to negotiate a deal for safe passage involving
    'the Indian,' which Billy rejects, leading to Carlisle’s accidental death by lynch
    mob; tension escalates as violence erupts.
  id: s_9
  key_delta: Escalation of open conflict resulting in a death linked to Billy’s outright
    defiance.
  trigger_event: Billy pushes out Deputy Carlisle; Carlisle is killed accidentally
    by lynch mob.
- description: Garrett tracks Billy to the bordello but arrives too late; the posse
    continues the pursuit with increasing intensity.
  id: s_10
  key_delta: The hunt intensifies, solidifying Garrett’s role as relentless pursuer.
  trigger_event: Garrett locates but fails to capture Billy at the bordello.
- description: Tom O'Folliard is shot and killed by Garrett during a narrow escape;
    the gang is now grieving but continues flight under pressure.
  id: s_11
  key_delta: Gang suffers its first fatality at the hands of Garrett’s posse.
  trigger_event: Tom is fatally wounded in a firefight initiated by Garrett's posse.
- description: Doc Scurlock tries to leave but is shot and sacrifices himself for
    the gang’s escape; the gang's morale and numbers decline significantly.
  id: s_12
  key_delta: Loss of a key gang member due to posse gunfire, weakening gang cohesion.
  trigger_event: Doc is shot by posse members during an escape attempt, enabling the
    others to flee.
- description: Billy is captured by Garrett, brought back to Lincoln, and sentenced
    to death by hanging; the town is tense with the prospect of Billy's execution.
  id: s_13
  key_delta: Billy becomes a prisoner facing execution, signaling near end of his
    outlaw career.
  trigger_event: Garrett delivers Billy to the authorities and he is formally sentenced
    to death.
- description: Billy is visited by Jane Greathouse in prison, who provides him a pistol
    during his daily outhouse visit; prison interior is dim and guarded.
  id: s_14
  key_delta: Billy gains means to attempt a breakout from prison.
  trigger_event: Jane secretly passes a pistol to Billy during his outhouse break.
- description: Billy uses the pistol to kill two guards and escapes Lincoln jail;
    he rides toward Old Fort Sumner to regroup.
  id: s_15
  key_delta: Billy’s escape prolongs his outlaw status and flight from law enforcement.
  trigger_event: Billy shoots guards and escapes custody successfully.
- description: At Old Fort Sumner, Billy finds Dave Rudabaugh has abandoned the group
    and Chavez y Chavez is wounded and dying; the hideout is grim and tense.
  id: s_16
  key_delta: Gang splinters further with deathly wounds and desertion.
  trigger_event: Billy’s arrival reveals Dave’s absence and Chavez’s mortal condition.
- description: Garrett tracks Billy to Old Fort Sumner, where Billy is unarmed and
    asks to hide in Mexico with a fake death reported; Garrett refuses fearing Billy’s
    return.
  id: s_17
  key_delta: Billy’s plan for faked death is rejected, setting up final confrontation.
  trigger_event: Billy offers to let Garrett fake his death, but Garrett declines
    and prepares to shoot him.
- description: Billy turns away from Garrett, forcing Garrett not to shoot him in
    the back; no killing occurs. The next morning, a fake burial for Billy is staged
    and Garrett’s horse is taken by Billy.
  id: s_18
  key_delta: Billy’s life is spared and public death is fabricated, creating uncertainty
    in the historical record.
  trigger_event: Garrett chooses not to kill Billy, faking his death instead.
- description: In 1950, the lawyer becomes convinced Brushy Bill is Billy the Kid;
    the room where the interview occurs is quiet, shadows suggesting mystery.
  id: s_19
  key_delta: The lawyer’s belief legitimizes Brushy Bill’s claims from the story perspective.
  trigger_event: The lawyer accepts Brushy Bill’s story as plausible after hearing
    the full account.
- description: Epilogue reveals Dave was beheaded in Mexico, Garrett’s book failed
    commercially and he was later killed, and Brushy Bill Roberts died uncredited
    despite corroboration; historian debate remains unresolved.
  id: s_20
  key_delta: Story concludes with unresolved mystery about Brushy Bill’s true identity
    and historical legacy.
  trigger_event: Narration summarizes fates of key figures and ongoing controversy
    about Brushy Bill’s identity.
