commitments:
- description: Sam must establish himself as the de facto boss of the Tangiers casino
    before the mob sends Nicky Santoro to protect him.
  id: c_0
  satisfaction_condition: Node s_0 is completed before s_1 can be acknowledged or
    triggered.
  type: ordering
  violation_condition: Player bypasses Sam’s casino control establishment (s_0) and
    accesses or triggers Nicky’s protection involvement (s_1) prematurely.
- description: Nicky is banned from casinos and blacklisted after violent actions
    and before he detaches from sanctioned mob activities.
  id: c_1
  satisfaction_condition: Between s_2 and s_3, Nicky’s ban and blacklisting status
    remains true; his separation into unsanctioned crime only occurs after confirmation
    of ban.
  type: invariant
  violation_condition: Player triggers Nicky’s independent crimes or unsanctioned
    shakedowns before his ban/blacklisting is established at s_2.
- description: Sam and Ginger’s relationship must reach the point of marriage and
    conception of daughter Amy to enable key family-based conflicts.
  id: c_2
  satisfaction_condition: Node s_3 is achieved with confirmed marriage and conception
    before family conflicts or trust issues arise.
  type: achievement
  violation_condition: Any narrative advancement referencing Amy or marital conflicts
    occurs before Sam and Ginger’s marriage and conception are established.
- description: The financial and political conflict caused by firing Donald Ward must
    happen after Sam and Ginger’s relationship is established.
  id: c_3
  satisfaction_condition: Node s_5 occurs strictly after s_3; administrative retaliation
    and license blocking follow personal life developments.
  type: ordering
  violation_condition: Player causes or acknowledges political license denial or related
    events (s_5) before establishing Sam’s marriage or family (s_3).
- description: Sam must publicly accuse city officials of corruption only after license
    application is actively blocked and hindered.
  id: c_4
  satisfaction_condition: Between s_5 and s_6, Sam’s public accusation happens only
    after license denial trigger.
  type: invariant
  violation_condition: Player triggers or acknowledges television accusation (s_6)
    prior to political obstruction and license denial (s_5).
- description: Internal mob conflict replacing Nicky with Artie Piscano on skimming
    oversight must only occur after Sam and Nicky’s fallout.
  id: c_5
  satisfaction_condition: Node s_7 occurs only after s_6, reflecting deterioration
    of mob relations after Sam’s public actions and Nicky’s recklessness.
  type: ordering
  violation_condition: Player causes or accepts Artie’s oversight establishment (s_7)
    before Sam publicly accuses officials or before Nicky’s recklessness is evident.
- description: Incriminating FBI evidence on mob skimming ledgers via Piscano must
    be discovered to advance the story toward casino empire collapse.
  id: c_6
  satisfaction_condition: Node s_8 is triggered before the arrest sequence of mob
    bosses and related collapse (s_13).
  type: achievement
  violation_condition: Player reaches law enforcement arrests or empire collapse events
    before FBI obtains and confirms Piscano’s skimming ledgers (s_8).
- description: Ginger’s addiction and attempted escape with Amy must precede her affair
    with Nicky and subsequent family collapse.
  id: c_7
  satisfaction_condition: Node s_9 occurs before s_10; player cannot acknowledge or
    cause Ginger’s affair with Nicky before she attempts to flee with Amy.
  type: ordering
  violation_condition: Ginger’s affair (s_10) triggers or is recognized before the
    attempted escape with Amy (s_9).
- description: Sam disowning Ginger must only occur after he discovers her endangering
    their daughter Amy and betrayal with Nicky.
  id: c_8
  satisfaction_condition: Between s_10 and s_11, Sam’s disownment of Ginger is only
    acknowledged after evidence of Amy’s unsafe treatment and Ginger’s infidelity.
  type: invariant
  violation_condition: Player causes disowning or severe marital conflict before establishing
    Ginger’s endangering actions and affair.
- description: Ginger’s theft from the bank deposit box and subsequent FBI arrest
    must follow full estrangement from Sam and Nicky.
  id: c_9
  satisfaction_condition: Node s_12 occurs after s_11, only after Ginger has been
    disowned and rejected.
  type: ordering
  violation_condition: Player triggers or accepts Ginger’s arrest or theft before
    her disownment and rejection by both men.
- description: The FBI arrests of mob bosses and casino executives based on evidence
    must occur before the collapse of the casino empire.
  id: c_10
  satisfaction_condition: Node s_13 is triggered providing legal grounding before
    or at the initiation of empire collapse.
  type: achievement
  violation_condition: Player progresses to full collapse or mob boss elimination
    without FBI arrests and matching evidence acknowledged.
- description: The mob’s hit orders on insiders are only sanctioned after FBI investigations
    and arrests create threat to the organization.
  id: c_11
  satisfaction_condition: Between s_13 and s_14, the decision for murder hits is only
    valid after arrests and federal pressure.
  type: invariant
  violation_condition: Player triggers mob-sanctioned eliminations before law enforcement
    pressure and arrests.
- description: Ginger’s death and Sam’s survived assassination attempt must occur
    after mob hits begin on insiders.
  id: c_12
  satisfaction_condition: Node s_15 occurs only after s_14, reflecting escalation
    of violence and tragic consequences.
  type: ordering
  violation_condition: Player triggers character death or assassination attempt before
    sanctioned mob hits are set in motion.
- description: Nicky and Dominick’s murders by Frankie Marino are only recognized
    after bosses order removal due to instability.
  id: c_13
  satisfaction_condition: Between s_15 and s_16, Nicky’s planned elimination is only
    acknowledged after preceding violent escalations.
  type: invariant
  violation_condition: Player causes or acknowledges Nicky’s death before official
    mob decision is documented.
- description: The transition of Las Vegas casinos from mob control to corporate ownership
    must be realized after mob ousting.
  id: c_14
  satisfaction_condition: Node s_17 is triggered only after s_16’s conclusion of mob
    eliminations and empire collapse.
  type: achievement
  violation_condition: Player triggers or claims corporate takeover and demolition
    events before mob power is fully removed.
- description: Sam’s narrative closure as an older sports handicapper reminiscing
    on past events must be reached to properly end the story.
  id: c_15
  satisfaction_condition: Node s_18 is initiated only after full collapse of the mob
    empire and casino changes (post s_17).
  type: achievement
  violation_condition: Player ends narrative or claims final reflection before key
    story resolution nodes (s_16–s_17) are completed.
