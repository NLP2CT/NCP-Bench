meta:
  genres: ["Crime", "Drama"]
  id: movie33
  player_role: Sam 'Ace' Rothstein
  title: "Casino"
synopsis: Sam "Ace" Rothstein, a sports handicapper and mob associate, is sent to
  Las Vegas to run the Teamsters-funded Tangiers Casino on behalf of several midwest
  mob families. Taking advantage of lax gaming laws allowing him to work at the casino
  while his gaming license is still pending, Sam becomes the Tangiers' de facto boss
  and doubles the casino's profits, which are skimmed by the Mafia before the records
  are reported to income tax agencies. Impressed with Sam's work, the bosses send
  Sam's friend, enforcer and caporegime Nicholas "Nicky" Santoro and his crew to protect
  Sam and the whole business. Nicky, however, begins to become more of a liability
  than an asset; his violent temper quickly gets him banned by the gaming board from
  every casino, and his name is placed in the black book. Nicky then gathers his own
  crew and begins running unsanctioned shakedowns and burglaries. Sam, meanwhile,
  meets and falls in love with a hustler, Ginger McKenna. Despite Ginger's reluctance,
  they soon conceive a daughter, Amy, and marry. Their relationship begins to deteriorate
  when Sam and Nicky catch Ginger giving money to her former boyfriend, a con man
  named Lester Diamond. Sam also makes an enemy in Clark County Commissioner Pat Webb
  by firing Webb's brother-in-law Donald Ward for incompetence, and refusing to reinstate
  him. Webb retaliates by pulling Sam's casino license application from the backlog,
  forcing Sam to have a license hearing, while secretly arranging for the gaming board
  and State Senator Harrison Roberts to reject the license. Sam responds by appearing
  on television and openly accuses the city government of corruption. The bosses,
  unappreciative of Sam's publicity, ask him to return home, but he stubbornly blames
  Nicky's reckless lawbreaking for his own problems. In a heated argument in the desert,
  Nicky chastises Sam to never "go over his head" again. The bosses appoint Kansas
  City underboss Artie Piscano to oversee the skim and reduce the amount local mobsters
  are keeping for themselves, but he keeps incriminating ledgers and is caught on
  an FBI bug discussing the skim. Sam loses patience with Ginger after she and Lester
  are in Los Angeles with plans to run away to Europe with his daughter Amy. Sam talks
  Ginger into bringing Amy back, but Ginger's alcoholism and cocaine addiction anger
  him so much that he kicks her out of the house. She returns, on Sam's condition
  that she carry a beeper on her for Sam to contact her whenever he must. Ginger turns
  to Nicky for help in getting her share of her and Sam's money from the bank, and
  they begin an affair. Sam reaches his limit with Ginger when she ties Amy to her
  bed to have a night with Nicky. Sam confronts Ginger in the restaurant and disowns
  her. She turns to Nicky, but he has washed his hands of her as well. The next morning,
  Ginger goes to Sam's house, creates a disturbance, and uses the distraction to take
  the key to their bank deposit box. She takes some of the savings, but is then arrested
  by FBI agents. With Ginger's arrest and the FBI's discovery of Piscano's records,
  which are then matched with the skimming operation, the casino empire crumbles and
  the bosses are arrested. During a meeting, they decide to eliminate anyone involved
  in order to keep them from testifying, including the head of the teamsters, the
  money courier, and several casino executives. Ginger dies nearly penniless in Los
  Angeles of a drug overdose, and Sam is almost killed in a botched car bombing, which
  he suspects Nicky planted. Before Sam can confront him, however, Nicky and his brother
  Dominick are murdered by Nicky's former associate, Frankie Marino. Sam narrates
  that the bosses had finally had enough of Nicky, and had ordered Frankie to get
  rid of him. With the mob now out of power, the old casinos are purchased by big
  corporations and demolished to make way for gaudier gambling attractions financed
  by junk bonds. Sam laments that this new "family friendly" Las Vegas lacks the same
  kind of catering to the players as the older and, to his perception, classier Vegas
  he saw when he ran the Tangiers. In the final scene, an older Sam is shown living
  in San Diego, once again as a sports handicapper for the mob, or in his words, "...right
  back where I started".
trajectory:
- description: Sam 'Ace' Rothstein arrives in Las Vegas and takes charge of the Teamsters-funded
    Tangiers Casino, operating while his gaming license is still pending under lax
    gaming laws. The casino is running under Mafia oversight, with profits being skimmed
    before tax reporting.
  id: s_0
  key_delta: Sam becomes the de facto boss of the Tangiers, and the casino starts
    doubling its profits through Mafia skimming.
  trigger_event: Sam's success at the Tangiers prompts the bosses to send Nicky Santoro
    to Las Vegas.
- description: Sam has established himself as the effective boss of the Tangiers Casino,
    doubling profits while skimming operations continue. The mob bosses send Nicky
    Santoro and his crew to protect the casino and Sam.
  id: s_1
  key_delta: Nicky and his crew are now entrenched in Las Vegas around the Tangiers,
    giving him the power base that soon grows beyond Sam's control.
  trigger_event: Nicky's brutality soon gets him banned from casinos and pushes him
    into his own unsanctioned rackets.
- description: Nicky's violent temper leads to him being banned from all casinos and
    blacklisted by the gaming board. He starts operating outside mob sanctions, running
    shakedowns and burglaries with his own crew.
  id: s_2
  key_delta: Nicky detaches from sanctioned mob activities and begins unsanctioned
    criminal operations damaging the mob’s control.
  trigger_event: Nicky commits violent acts causing the gaming board to ban him and
    place his name in the black book.
- description: Sam meets and begins a romantic relationship with Ginger McKenna, a
    hustler. They conceive a daughter, Amy, and marry despite Ginger's hesitation.
  id: s_3
  key_delta: Sam's personal life becomes entwined with Ginger, establishing a family
    context that influences future conflicts.
  trigger_event: Sam and Ginger conceive their daughter Amy and get married.
- description: Sam’s relationship with Ginger starts to strain when he and Nicky catch
    her giving money to her ex-boyfriend Lester Diamond, a known con man.
  id: s_4
  key_delta: Trust issues emerge in Sam and Ginger’s marriage, and Lester’s presence
    presents a new threat.
  trigger_event: Sam's license fight with local officials escalates when he fires
    Donald Ward.
- description: Sam fires Donald Ward, the brother-in-law of Clark County Commissioner
    Pat Webb, for incompetence. Webb retaliates by stalling Sam's casino license application
    and maneuvers to have it rejected.
  id: s_5
  key_delta: Sam faces official political opposition aimed at preventing his gaming
    license approval and jeopardizing his control of the casino.
  trigger_event: Sam fires Ward, prompting Commissioner Webb to block Sam’s license
    application and enlist the gaming board and State Senator Harrison Roberts to
    reject it.
- description: Sam publicly accuses the city government of corruption on television
    in response to the license denial, drawing disapproval from the mob bosses who
    want him to return home.
  id: s_6
  key_delta: Sam invites negative publicity, alienating the mob bosses and intensifying
    his personal conflict with law and politics.
  trigger_event: The bosses answer Sam's outburst by backing Piscano and letting
    the conflict with Nicky harden.
- description: Sam blames Nicky for recklessness causing their problems. In a desert
    confrontation, Nicky warns him never to 'go over his head' again. Mob bosses appoint
    Artie Piscano to oversee the skim and reduce local mob skimming.
  id: s_7
  key_delta: Internal mob factionalism intensifies; Piscano takes control over the
    skim operation, and Nicky is sidelined.
  trigger_event: Mob bosses replace Nicky’s leadership over the casino skim with Artie
    Piscano after Sam’s complaint.
- description: With Piscano managing the skim, incriminating ledgers are kept and
    eventually discovered by the FBI through wiretapping, putting the mob’s operation
    under federal investigation.
  id: s_8
  key_delta: Evidence of the mob’s skimming operation reaches law enforcement, threatening
    the entire casino empire.
  trigger_event: The FBI records Piscano discussing skim ledgers during a bugged meeting.
- description: Ginger’s addiction worsens amid marital tensions. She and Lester plan
    to run away to Europe with Amy but return after Sam persuades her.
  id: s_9
  key_delta: Ginger’s instability and infidelity escalate household conflict and endanger
    Amy’s welfare.
  trigger_event: Ginger and Lester attempt to flee with Amy but are brought back by
    Sam.
- description: Sam, angered by Ginger’s addiction and behavior, kicks her out. She
    returns on condition to carry a beeper for Sam’s contact and begins an affair
    with Nicky.
  id: s_10
  key_delta: Ginger’s loyalties fracture further, deteriorating her marriage and alliance,
    deepening intra-criminal complications.
  trigger_event: Ginger comes back to Sam’s home and starts an affair with Nicky Santoro.
- description: Ginger ties Amy to the bed to have a night with Nicky. Sam disowns
    Ginger after confronting her and she turns to Nicky, who rejects her.
  id: s_11
  key_delta: Family breakdown reaches a crisis point; Ginger is rejected by both Sam
    and Nicky.
  trigger_event: Sam discovers Ginger tying Amy to a bed to spend time with Nicky
    and disowns her.
- description: Ginger creates a disturbance at Sam’s house to steal the key to their
    bank deposit box but is arrested by the FBI shortly after taking some money.
  id: s_12
  key_delta: Ginger’s arrest exposes further vulnerabilities to the FBI and destabilizes
    the mob-controlled financial assets.
  trigger_event: Piscano's records fall into FBI hands, bringing the skim operation
    under federal scrutiny.
- description: The FBI discovery of Piscano’s skimming records leads to arrests of
    mob bosses and casino executives; the casino empire begins to collapse.
  id: s_13
  key_delta: The mob’s casino empire crumbles due to legal pressure from federal investigations.
  trigger_event: Facing indictments, the bosses order a cleanup of anyone who could
    testify.
- description: The bosses decide to eliminate anyone involved to prevent testimony,
    ordering hits on key figures including the Teamsters head and money courier.
  id: s_14
  key_delta: Murder hits are sanctioned within the mob to contain the fallout from
    investigations.
  trigger_event: Mob bosses order the elimination of insider threats to silence them.
- description: Ginger dies nearly penniless in Los Angeles from a drug overdose, while
    Sam narrowly survives a car bombing he suspects was orchestrated by Nicky.
  id: s_15
  key_delta: Ginger’s demise finalizes her tragic downfall; Sam faces violent assassination
    attempts.
  trigger_event: Ginger’s death by overdose is reported; Sam survives an attempted
    car bombing.
- description: Nicky and his brother Dominick are murdered by former associate Frankie
    Marino, under orders from the bosses fed up with Nicky’s recklessness.
  id: s_16
  key_delta: The mob removes Nicky, eliminating a source of internal instability and
    violence.
  trigger_event: With Nicky dead and the mob losing control, corporate owners move
    in to replace the old casinos.
- description: With the mob ousted, the old casinos are sold to corporations and demolished
    for new gambling ventures funded by junk bonds; the Vegas scene changes drastically.
  id: s_17
  key_delta: Las Vegas transitions from mob-run operations to corporate, fundamentally
    altering the city’s gambling culture.
  trigger_event: Old mob-associated casinos are sold and demolished, replaced by corporate
    gambling enterprises.
- description: An older Sam is shown living in San Diego, working again as a sports
    handicapper for the mob, reflecting on the past and stating he is 'right back
    where I started.'
  id: s_18
  key_delta: Sam’s story concludes with his return to his original role, completing
    the cycle of his rise and fall.
  trigger_event: Sam is depicted working as a sports handicapper again in San Diego,
    narrating his return to origins.
