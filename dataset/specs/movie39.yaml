commitments:
- description: Eric cannot be recognized as undead or invulnerable before the awakening
    event at s_2.
  id: c_0
  satisfaction_condition: Player only acknowledges Eric's undead, invulnerable state
    after event s_2 (Eric climbing from the grave).
  type: ordering
  violation_condition: Player claims or system admits Eric is invulnerable or undead
    before s_2 is reached.
- description: Shelly remains alive but critically injured and not dead between s_0
    and s_1; her death only confirmed after s_0 is completed.
  id: c_1
  satisfaction_condition: Shelly's status is critical but alive until s_1 is reached;
    the system never confirms her death prematurely.
  type: invariant
  violation_condition: Premature system or player assertion that Shelly is dead prior
    to s_1 or contradictory player input overriding Shelly's survival during s_0.
- description: Eric's knowledge of his killers (Tin-Tin, T-Bird, Funboy, Skank) must
    only be acknowledged after s_3 flashback triggers.
  id: c_2
  satisfaction_condition: Eric's awareness or player access to the identity of killers
    only after s_3 is achieved.
  type: ordering
  violation_condition: Player or system admits Eric's killer identities prior to s_3
    event.
- description: Eric must kill each primary target (Tin-Tin, Funboy, T-Bird, Skank,
    Top Dollar's men) in logical order to progress narrative closure.
  id: c_3
  satisfaction_condition: All primary killers are eliminated in the order defined
    with no skipped forced eliminations required for final progression.
  type: achievement
  violation_condition: Player bypasses the elimination of any primary target before
    attempting to end the narrative or declares their death without appropriate events.
- description: Eric retains crow-guided invulnerability until the crow is shot inside
    the church (s_18).
  id: c_4
  satisfaction_condition: Eric is invulnerable and heals immediately during all events
    up to s_18.
  type: invariant
  violation_condition: Eric becomes vulnerable or sustaining lasting injury before
    the crow is shot as per s_18.
- description: Sarah’s abduction by Grange (s_17) must precede Eric’s vulnerability
    moment at the church (s_18) and the ensuing rescue attempt.
  id: c_5
  satisfaction_condition: Sarah is abducted at s_17 before Eric reaches the church
    and loses invulnerability at s_18.
  type: ordering
  violation_condition: Eric loses invulnerability or attempts rescue before Sarah's
    abduction occurs.
- description: Eric cannot retrieve or lose the crow’s mystical power before the rooftop
    fight and Myca’s death (s_20).
  id: c_6
  satisfaction_condition: The crow’s power remains with Eric or linked until Myca
    is blinded and killed at s_20.
  type: invariant
  violation_condition: The crow’s power is transferred, lost, or used by Myca before
    s_20 or otherwise disappears prematurely.
- description: Eric must receive and carry the transferred burden of Shelly’s 30 hours
    of pain from Albrecht (s_9) before delivering it to Top Dollar (s_21).
  id: c_7
  satisfaction_condition: Eric has acquired Shelly's suffering before confronting
    and punishing Top Dollar.
  type: achievement
  violation_condition: Eric confronts Top Dollar with the pain punishment without
    prior acquisition or acknowledgement of the suffering from Albrecht.
- description: Eric passes on Shelly’s engagement ring to Sarah only after completing
    the massacre of Top Dollar's criminal group (s_16) and before Sarah’s abduction
    (s_17).
  id: c_8
  satisfaction_condition: Ring is given to Sarah post s_15 events and before s_17.
  type: ordering
  violation_condition: Ring is given before elimination of Top Dollar’s men or after
    Sarah’s abduction.
- description: Eric must achieve peace in death with Shelly by reaching their graves
    and reuniting after all vengeance is fulfilled (s_22).
  id: c_9
  satisfaction_condition: Eric arrives at Shelly’s grave after final punishments on
    his enemies are completed.
  type: achievement
  violation_condition: Eric attempts or claims peace with Shelly before final antagonist
    elimination and resolution of vengeance.
- description: Grange cannot be killed before the church shootout (s_19), preserving
    his role as Sarah’s kidnapper and antagonist until that event.
  id: c_10
  satisfaction_condition: Grange remains alive from his introduction until his death
    at s_19.
  type: invariant
  violation_condition: Player kills Grange prematurely before s_19 or narrative advances
    ignoring his survival requirement.
- description: Albrecht's knowledge and presence relating to Shelly's suffering and
    Eric's mission must only be accessible after event s_9.
  id: c_11
  satisfaction_condition: Albrecht’s testimony, transfer of pain, and assistance are
    only available after s_9 event trigger.
  type: invariant
  violation_condition: Player or system accesses or uses Albrecht's knowledge before
    s_9.
