meta:
  genres: ["Action", "Fantasy"]
  id: movie39
  player_role: Eric Draven
  title: "The Crow"
synopsis: On October 30, Devil's Night in Detroit, Sergeant Albrecht is at the scene
  of a crime, where Shelly Webster has been beaten and raped, and her fiancé, guitarist
  Eric Draven, has been stabbed, shot, and thrown out of the window. The couple were
  to be married the next day, on Halloween. As he leaves for the hospital with Shelly,
  Albrecht meets a young girl, Sarah, whom Shelly and Eric took care of because her
  mother Darla is a negligent drug addict. Albrecht tells her that Shelly will be
  okay, but Sarah knows the truth——Shelly is going to die. Exactly one year later,
  during a visit from a lonely and heartsick Sarah, a crow taps on Eric's headstone.
  Later that night, Eric awakens from death and climbs frantically out of his grave,
  trembling and wracked with convulsions. Eric goes to his old apartment and finds
  it derelict. He has flashbacks of his death, remembering that he and Shelly were
  murdered by local thugs T-Bird, Tin-Tin, Funboy, and Skank. Eric soon discovers
  that any wounds he suffers heal immediately, and that he, being dead, is now immune
  to physical harm. He then replaces his burial clothes with dark, imposing attire,
  and paints his face in a parody of a porcelain harlequin mask, decorating his lips
  and eyes with black, scar-like slashes. Guided by the crow, he sets out to avenge
  his and Shelly's deaths. The crow helps Eric locate Tin-Tin. They engage in a one-on-one
  alley fight, which Eric wins by stabbing Tin-Tin with all of his own knives. He
  takes his coat, leaving a large crow-shaped bloodstain on the wall of the alley.
  He then goes to the pawn shop where Tin-Tin pawned Shelly's engagement ring the
  year before. Eric forces the owner, Gideon, to return the ring and blows up the
  shop, but allows Gideon to live so that he can warn the others. Eric finds Funboy
  getting high on morphine in an apartment with Darla. Funboy shoots him in the hand
  and watches in horror as the wound closes up before his eyes. Eric then disarms
  him and shoots him in the thigh. Eric then places Funboy in the tub and confronts
  a hysterical Darla, grabbing her arm and showing her the reflection of her track
  marks in the mirror as the morphine pushes its way back out of her arm. Eric tells
  her to quit drugs in order to be a good mother to Sarah. Seeing Darla flee the bar,
  Grange then goes upstairs to investigate, finding Funboy lying on the floor and
  dying from having multiple syringes stabbed into his chest. Eric visits Albrecht,
  explaining his rebirth and mission. Albrecht tells him what he knows about Shelly's
  death and that he watched as she suffered for 30 hours before dying. Eric touches
  Albrecht's face, and all the pain and memories of Shelly's death are transferred
  to Eric. Gideon goes to warn Top Dollar, the local crime boss and T-Bird's superior,
  who thinks Gideon is making it all up and kills him by stabbing him in the throat
  with a rapier. As T-Bird and Skank stop at a convenience store to get some supplies,
  Eric arrives and kidnaps T-Bird. Skank follows the pair and sees Eric as he ties
  T-Bird to the driver's seat of a car, straps explosives to him, and lets the car
  drive off the pier, where it explodes in mid-air, killing T-Bird. Eric leaves a
  fiery symbol in the shape of a crow burning at the scene. Meanwhile, Sarah and her
  mother begin to repair their strained relationship. Sarah goes to Eric's old apartment
  and tells him that she misses him and Shelly. Eric explains that, even though they
  cannot be friends anymore, he still cares about her. Top Dollar and his lover/half-sister
  Myca have become aware of Eric's actions through various reports from witnesses.
  He holds a meeting with his associates where they discuss new plans for their Devil's
  Night crime spree. Eric arrives at the meeting, looking for Skank. Top Dollar orders
  his men to shoot Eric, and a massive gunfight ensues. Top Dollar escapes with Myca
  and Grange, while Eric systematically kills everyone in the room, throwing the last,
  Skank, out of a window to his death. Eric, having finished his quest, returns to
  his grave. Sarah goes to say goodbye to him and he gives her Shelly's engagement
  ring. She is then abducted by Grange, who takes her into a nearby church where Top
  Dollar and Myca are waiting. Through the crow, Eric realizes what has happened and
  goes to the church to rescue her. Unfortunately, Grange shoots the crow as it flies
  into the church, causing Eric to lose his invincibility. Just after Top Dollar shoots
  and wounds Eric, Albrecht arrives, intending to pay his respects to Eric. Myca then
  grabs the wounded crow, intending to take its mystical power. Top Dollar ties Sarah
  up and climbs the bell tower as a fight ensues, with Albrecht killing Grange. When
  Albrecht is wounded, Eric climbs to the roof of the church on his own. On the way
  up, he encounters Myca, who tells him that all of the power that he ever had will
  soon be hers. However, just before she is about to shoot Eric, the crow escapes
  Myca's grip and pecks out her eyes, and then knocks her screaming down the bell
  tower to her death. Eric reaches the roof of the church and fights Top Dollar, who
  admits ultimate responsibility for what happened to Eric and Shelly. Top Dollar
  is about to deal a fatal blow to Eric, but Eric gives him the 30 hours of pain that
  Shelly suffered - which he absorbed from Albrecht - by brutally squeezing his eyes
  in with his thumbs; the sensation overwhlems Top Dollar and sends him flying off
  the roof of the church to be impaled on the horns of a gargoyle. Albrecht survives
  and is taken to the hospital. Eric makes his way to Shelly's grave next to his,
  where he finds peace again. He and Shelly reunite in death. Sarah pays a final visit
  to the cemetery, and sees that both Eric and Shelly's graves now lie undisturbed.
  The crow, perched on Eric's headstone, gives her Shelly's engagement ring, dropping
  it in her open hand before soaring over the city and into the night.
trajectory:
- description: On Devil's Night, October 30, in Detroit, Sergeant Albrecht is at the
    violent crime scene where Shelly Webster is beaten and raped, and her fiancé Eric
    Draven is stabbed, shot, and thrown out of a window. Shelly is critically injured
    and Eric is presumed dead. The city is tense and dark, with an ominous atmosphere
    of chaos and impending tragedy.
  id: s_0
  key_delta: The brutal assault on Shelly and Eric is established; Shelly remains
    alive but critical, Eric is presumed dead; Sarah's existence and connection to
    Shelly and Eric are introduced.
  trigger_event: Sergeant Albrecht transports the injured Shelly to the hospital,
    crossing paths with a young girl named Sarah.
- description: One year later, the Detroit cemetery at Eric Draven's gravesite is
    quiet and somber during a visit by the lonely Sarah, who mourns Shelly and Eric.
  id: s_1
  key_delta: Introduction of a supernatural sign at Eric's grave suggesting Eric's
    connection to the crow and hinting at Eric's return.
  trigger_event: A crow taps on Eric Draven's headstone, drawing Sarah's attention.
- description: Late at night in the cemetery, Eric Draven awakens violently from his
    grave, convulsing and overwhelmed, initiating his return as an undead being immune
    to physical harm.
  id: s_2
  key_delta: Eric has returned from death, now possessing rapid healing and invulnerability,
    setting the stage for his quest for vengeance.
  trigger_event: Eric climbs out of his grave, manifesting his reanimated, impervious
    state.
- description: Eric arrives at his old, derelict apartment, revisiting memories of
    his murder and Shelly's death. The environment is neglected and filled with painful
    remnants of the past.
  id: s_3
  key_delta: Eric obtains crucial knowledge of his killers' identities, clarifying
    the target of his revenge.
  trigger_event: Eric experiences flashbacks revealing that local thugs T-Bird, Tin-Tin,
    Funboy, and Skank were responsible for his and Shelly's murder.
- description: Eric, wearing dark, imposing clothes and his painted harlequin-like
    mask, stands ready outside the city streets. The crow guides him as a supernatural
    tracker.
  id: s_4
  key_delta: Eric begins his active pursuit of vengeance, empowered and equipped,
    initiating conflict with Tin-Tin.
  trigger_event: The crow leads Eric to locate Tin-Tin in an alleyway.
- description: Eric and Tin-Tin engage in an intense alley fight culminating in Eric
    fatally stabbing Tin-Tin with the thug's own knives. A large crow-shaped bloodstain
    marks the scene.
  id: s_5
  key_delta: Eric exacts the first lethal vengeance against one of his killers; Tin-Tin
    is removed as a threat.
  trigger_event: Eric uses Tin-Tin's knives to kill him in the alley.
- description: In the destroyed pawn shop where Tin-Tin pawned Shelly's engagement
    ring, Eric confronts the owner, Gideon, amidst wreckage and fire.
  id: s_6
  key_delta: Eric recovers Shelly's ring, an emotional token, and sends a warning
    to the other criminals through Gideon.
  trigger_event: Eric forces Gideon to return the engagement ring and blows up the
    shop, sparing Gideon's life.
- description: In a dingy apartment where Funboy is using morphine with Darla nearby,
    the atmosphere is hazy and tense.
  id: s_7
  key_delta: Eric displays his invulnerability to Funboy; the effect on Darla and
    her drug addiction are exposed.
  trigger_event: Funboy shoots Eric in the hand, witnessing Eric's wound instantly
    heal.
- description: Eric subdues Funboy, physically incapacitating him in a bathroom tub
    while confronting an emotionally unstable Darla about her addiction.
  id: s_8
  key_delta: Eric attempts to influence Darla's behavior, linking personal consequence
    to the broader narrative; Funboy is incapacitated.
  trigger_event: Eric grabs Darla's arm to show her track marks in a mirror and urges
    her to quit drugs to care for Sarah.
- description: Eric visits Sergeant Albrecht, who is sober and informative, in a private
    setting reflecting on Shelly's death and the 30 hours of her suffering.
  id: s_9
  key_delta: Eric acquires the burden and emotional weight of Shelly's suffering,
    deepening his motivation for vengeance.
  trigger_event: Albrecht shares his eyewitness account of Shelly's prolonged agony,
    transferring the pain and memories to Eric upon touch.
- description: In a dark scene, the pawn shop owner Gideon attempts to warn Top Dollar
    about the attacks but is unexpectedly killed by Top Dollar with a rapier.
  id: s_10
  key_delta: Top Dollar exhibits direct violence against a potential informant, raising
    stakes for Eric's mission.
  trigger_event: Top Dollar stabs Gideon in the throat, demonstrating ruthlessness
    and disbelief of the warnings.
- description: At a convenience store, T-Bird and Skank stop to gather supplies, unaware
    of Eric's approaching vengeance.
  id: s_11
  key_delta: Eric neutralizes T-Bird, escalating his campaign and establishing immediate
    danger to remaining criminals.
  trigger_event: Eric arrives and kidnaps T-Bird in front of Skank.
- description: Eric ties T-Bird to a car’s driver's seat, straps explosives on him,
    and leaves the vehicle to drive off a pier, exploding mid-air with a crow-shaped
    fire mark at the scene.
  id: s_12
  key_delta: Another killer from Eric’s past is eliminated; Eric leaves symbolic crow
    imagery as a dread warning.
  trigger_event: The car explodes, killing T-Bird dramatically.
- description: Sarah and her mother Darla begin mending their difficult relationship
    amidst attempts at normalcy, while Eric's old apartment remains a place of memory.
  id: s_13
  key_delta: Sarah emotionally processes her loss; Eric acknowledges the changed nature
    of their relationship.
  trigger_event: Sarah visits Eric's apartment and speaks aloud her longing and grief.
- description: Top Dollar holds a meeting with his criminal associates, including
    his lover and half-sister Myca, in preparation for Devil's Night crime actions.
  id: s_14
  key_delta: Eric confronts organized crime directly; the final phase of his vengeance
    nears.
  trigger_event: Eric arrives at the meeting seeking Skank.
- description: An armed gunfight ensues in the meeting room; chaos surrounds Eric's
    systematic elimination of Top Dollar’s men.
  id: s_15
  key_delta: Eric kills all associates except Top Dollar, Myca, Grange, and Skank,
    with Skank being thrown to his death out a window.
  trigger_event: Top Dollar orders his men to shoot Eric, provoking the firefight.
- description: Eric returns briefly to his grave after cleansing the meeting room,
    contemplative and prepared for his remaining tasks.
  id: s_16
  key_delta: Eric passes on a symbolic memento to Sarah, reinforcing their connection
    and his limited ability to remain involved.
  trigger_event: Sarah visits Eric at his grave and he gives her Shelly's engagement
    ring as a keepsake.
- description: Sarah is abducted by Grange and taken into a nearby church where Top
    Dollar and Myca are waiting, heightening the tension and danger.
  id: s_17
  key_delta: Sarah becomes a hostage, raising the stakes for Eric’s final confrontation.
  trigger_event: Grange kidnaps Sarah and brings her inside the church.
- description: Eric pursues the kidnappers to the church, guided by the crow, which
    is shot and wounded inside, causing Eric to lose his invincibility.
  id: s_18
  key_delta: Eric becomes vulnerable to physical harm, increasing the peril of his
    rescue attempt.
  trigger_event: Grange shoots the crow flying into the church.
- description: Inside the church, a shootout erupts; Albrecht arrives with respect
    for Eric, then engages Grange in combat.
  id: s_19
  key_delta: One of the main antagonists, Grange, is eliminated; Albrecht sustains
    injury.
  trigger_event: Albrecht kills Grange but is wounded in the process.
- description: Eric climbs alone to the church's rooftop, confronted by Myca who tries
    to seize Eric's lost crow power.
  id: s_20
  key_delta: Myca is killed, ending her threat and securing Eric’s crow-linked power
    recovery.
  trigger_event: The crow escapes Myca's grasp, blinds her by pecking out her eyes,
    and she falls to her death.
- description: At the church rooftop in a tense final showdown, Eric fights Top Dollar,
    the confessed mastermind behind the murders and tragedy.
  id: s_21
  key_delta: Top Dollar is killed; ultimate justice and revenge for Shelly and Eric’s
    deaths are achieved.
  trigger_event: Eric crushes Top Dollar's eyes, transferring Shelly's 30 hours of
    pain, causing Top Dollar to fall and die impaled on a gargoyle.
- description: Albrecht is taken to the hospital to recover from his wounds, and the
    city returns to a calm after the violent night.
  id: s_22
  key_delta: Eric finds peace in death with Shelly, closing the supernatural vengeance
    arc.
  trigger_event: Eric makes his way to Shelly's grave next to his own.
- description: Sarah visits the cemetery for the final time, where Eric and Shelly’s
    graves lay undisturbed, bathed in the peaceful night.
  id: s_23
  key_delta: Symbolic passing of legacy and closure for Sarah; story concludes with
    hope and memory preserved.
  trigger_event: The crow perches on Eric's headstone and drops Shelly's engagement
    ring into Sarah’s open hand before flying into the night.
