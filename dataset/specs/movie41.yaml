commitments:
- description: Joe Gillis cannot recognize or reveal Norma Desmond's delusional state
    before entering the mansion and meeting her (s_0 precedes s_1).
  id: c_0
  satisfaction_condition: Player encounters Norma inside the mansion only after Joe’s
    tire blows out and he enters the property (progress through s_0 then s_1).
  type: ordering
  violation_condition: Player reveals Norma’s delusion or confronts her with reality
    before arriving at the mansion or meeting Norma.
- description: Norma’s fragile mental state and denial of her fading stardom remain
    unbroken prior to Joe’s blunt confrontation (from s_1 to s_14).
  id: c_1
  satisfaction_condition: Throughout narrative nodes s_1 through s_14, Norma maintains
    denial and delusion about her current irrelevance and the truth about fan mail.
  type: invariant
  violation_condition: Player causes Norma to accept or explicitly acknowledge her
    lost fame and Max’s deceit before node s_14.
- description: Joe must become dependent on Norma before the relationship deepens
    and emotional conflicts arise (s_3 precedes s_5 and s_12).
  id: c_2
  satisfaction_condition: Player experiences Joe’s belongings moved and rent paid
    by Norma before any romantic gift-giving or jealousy events happen.
  type: ordering
  violation_condition: Player advances to emotional intimacy or jealousy scenes involving
    Norma and Joe without establishing Joe’s dependency on Norma.
- description: Joe’s secret collaboration with Betty and associated emotional triangle
    cannot develop before Joe’s initial involvement with Norma is firmly established
    (s_3 precedes s_6 and s_11).
  id: c_3
  satisfaction_condition: Player reaches scenes where Joe attends party and works
    with Betty only after dependency on Norma is established.
  type: ordering
  violation_condition: Player introduces Betty-related screenplay collaboration or
    romantic tension before Joe lives in Norma’s mansion and accepts her support.
- description: Joe must explicitly confront Norma with the truth about her fading
    fame and Max’s deceptions before the final shooting incident occurs (before s_15).
  id: c_4
  satisfaction_condition: Player triggers Joe’s blunt disclosure to Norma about the
    false fan mail and her lost stardom during or prior to s_14.
  type: achievement
  violation_condition: Player allows Joe to be shot or the narrative to end without
    this confrontation occurring.
- description: Norma remains in full delusion and refuses to accept brutal reality
    after Joe’s death, sustained by Max's intervention (from s_15 to s_16).
  id: c_5
  satisfaction_condition: Following Joe's death, Norma maintains hallucination of
    filming and Max perpetuates her fantasy until police arrive.
  type: invariant
  violation_condition: Player causes Norma to recognize Joe’s death or acknowledge
    her crushed career after the shooting and before or during police arrival.
- description: The final fantasy scene (Norma’s ‘close-up’) can only occur after Joe’s
    death and Norma’s descent into full delusion is established (s_15 precedes s_16).
  id: c_6
  satisfaction_condition: Player witnesses or triggers Norma’s final speech and take
    on her ‘close-up’ line only after Joe is confirmed dead in the pool.
  type: ordering
  violation_condition: Player skips the shooting event or introduces Norma’s acceptance
    of reality prior to the final fantasy scene.
