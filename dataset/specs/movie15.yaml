commitments:
- description: The narrative must establish Tina’s initial nightmare and corresponding
    physical injuries as the first reveal of the killer’s existence before any other
    character knowledge or action.
  id: c_0
  satisfaction_condition: Node s_0 is completed before allowing acknowledgement or
    discovery of the killer by other characters.
  type: ordering
  violation_condition: Player reveals Freddy’s identity, history, or physical evidence
    before s_0 (before Tina’s nightmare and slashes) occur.
- description: Characters must discuss and connect their nightmares and suspicions
    only after Tina’s nightmare is physically validated, to prevent premature acceptance
    of the threat.
  id: c_1
  satisfaction_condition: Node s_1 follows s_0, where the characters collectively
    recognize a shared fear originating from Tina’s nightmare evidence.
  type: ordering
  violation_condition: Shared fear or group recognition of the killer happens before
    Tina’s nightmare and evidence at s_0.
- description: Nancy’s discovery of Freddy and her investigation must only progress
    after witnessing Tina’s murder and Rod’s arrest, to maintain logical tension and
    suspicion.
  id: c_2
  satisfaction_condition: Node s_4 (Rod’s arrest and Nancy’s nightmare) occurs after
    Tina’s death in s_3.
  type: ordering
  violation_condition: Nancy directly identifies Freddy or Rod’s innocence before
    Tina’s death and Rod’s arrest.
- description: Rod Lane remains innocent of Tina’s murder until the narrative conclusively
    proves otherwise by his arrest and subsequent death.
  id: c_3
  satisfaction_condition: From s_3 to s_6, Rod is always suspected but never confirmed
    guilty by player or system; only suspicion and investigation occur.
  type: invariant
  violation_condition: Player or system states Rod’s guilt as fact before s_6 or Rod’s
    death is confirmed.
- description: Nancy must develop the critical insight that Freddy Krueger is a supernatural
    killer able to murder through dreams, connecting the dream and waking worlds meaningfully.
  id: c_4
  satisfaction_condition: Node s_8 is reached where Marge reveals Freddy’s origin,
    and Nancy possesses the hat from the dream world.
  type: achievement
  violation_condition: Player never obtains Freddy’s real identity and backstory before
    the narrative advances beyond s_8.
- description: Glen's death must occur only after Freddy's backstory and his true nature are established.
  id: c_5
  satisfaction_condition: Glen’s death at s_10 follows Rod's death at s_6 and the revealed backstory at s_8.
  type: ordering
  violation_condition: Player or system allows Glen's death before the backstory and evidence of Freddy's powers are established.
- description: Nancy’s fear is the source of Freddy’s power, and losing this fear
    is the necessary condition for his temporary neutralization.
  id: c_6
  satisfaction_condition: From s_13 onward, Nancy’s explicit declaration of fearlessness
    causes Freddy to lose power and disappear.
  type: invariant
  violation_condition: Freddy retains power after Nancy declares no fear, or the narrative
    skips Nancy’s fear confrontation.
- description: Nancy must physically confront and subdue Freddy in the waking world by pulling him out of a dream, demonstrating her agency and resistance.
  id: c_7
  satisfaction_condition: Node s_11 is completed where Nancy pulls Freddy into reality, then traps and burns him in the basement.
  type: achievement
  violation_condition: Narrative ends or progresses without Nancy actively pulling Freddy into the waking world and confronting him.
- description: The narrative must not allow Nancy to claim definitive victory or security
    over Freddy until after both her confrontation and the subsequent attack on her
    mother occur.
  id: c_8
  satisfaction_condition: Node s_12 (Freddy attacking Marge) follows Nancy’s real-world
    confrontation in s_11 before s_13 (fearlessness).
  type: ordering
  violation_condition: Nancy’s feeling of security or resolution regarding Freddy
    happens before the attack on Marge is witnessed.
- description: Freddy’s supernatural influence persists beyond his apparent defeat,
    ensuring the threat endures beyond the narrative’s apparent resolution.
  id: c_9
  satisfaction_condition: After s_13, the final scene in s_14 demonstrates Freddy’s
    ongoing threat despite Nancy leaving the room fearlessly.
  type: invariant
  violation_condition: The narrative allows Freddy’s defeat to be absolute with no
    indication of lingering threat.
- description: Discovery and acceptance of Freddy’s identity and history must precede
    any attempts by Nancy to actively confront or trap him.
  id: c_10
  satisfaction_condition: Node s_8 (knowledge revelation) is reached before Nancy’s
    plan and execution in s_11.
  type: ordering
  violation_condition: Nancy tries to trap, attack, or confront Freddy without prior
    knowledge of his identity and backstory.
