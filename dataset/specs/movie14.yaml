commitments:
- description: Michael's initial murder of Judith Myers (s_1) must occur after he
    observes Judith alone (s_0), maintaining consistent sequence of events leading
    to the first murder.
  id: c_0
  satisfaction_condition: Node s_0 must be fully achieved before node s_1 is triggered.
  type: ordering
  violation_condition: The system acknowledges Judith's murder (s_1) before the observation
    that she is alone (s_0).
- description: Michael's escape from Smith's Grove Sanitarium (s_4) cannot be acknowledged
    before his long catatonic institutionalization period (s_3) has been established.
  id: c_1
  satisfaction_condition: Node s_3 is completed before s_4 is initiated.
  type: ordering
  violation_condition: Player or system recognizes Michael's escape or violent behavior
    prior to confirmation of his catatonia and confinement.
- description: From s_3 to s_4 (inclusive), Michael must remain in a state of catatonia
    without violent actions or escape attempts.
  id: c_2
  satisfaction_condition: No violent acts or escape attempts by Michael occur prior
    to s_4.
  type: invariant
  violation_condition: Any player-induced or system-recognized violent action or escape
    by Michael before s_4.
- description: Laurie's awareness of Michael's presence (s_6) must not occur before
    Michael's escape and return to Haddonfield (s_4 and s_5), preserving suspense
    and logical build-up of threat.
  id: c_3
  satisfaction_condition: Nodes s_4 and s_5 achieved fully before s_6 is triggered.
  type: ordering
  violation_condition: Laurie identifies or encounters Michael before his escape or
    return to the town.
- description: Laurie must discover the hidden bodies of Annie and Lynda along with
    Judith's headstone (s_13) before the narrative reaches the climax involving direct
    confrontation with Michael.
  id: c_4
  satisfaction_condition: Player reaches s_13 where the murders' evidence is discovered.
  type: achievement
  violation_condition: Player skips or bypasses the discovery of the bodies and the
    symbolic headstone before final encounters.
- description: The killing of Annie (s_10) and then Lynda and Bob (s_12) must unfold
    sequentially before Laurie is attacked (s_14), maintaining temporal coherence
    of Michael's stalking and killing spree.
  id: c_5
  satisfaction_condition: Node s_10 and then s_12 completed before s_14 occurs.
  type: ordering
  violation_condition: Laurie being attacked or other subsequent events happen before
    these murders have occurred or been acknowledged.
- description: During the sequence from s_14 to s_19, Laurie remains isolated with
    dead phone lines and Michael present inside the Doyle house until she is rescued
    or Michael is incapacitated.
  id: c_6
  satisfaction_condition: Laurie lacks outside assistance and cannot communicate until
    s_18 or beyond; Michael remains a direct physical threat within the house.
  type: invariant
  violation_condition: Player or system grants Laurie external help, open communication,
    or removes Michael without narrative acknowledgment within this phase.
- description: Dr. Loomis's intervention and shooting of Michael (s_18) is necessary
    to conclude the immediate physical threat phase of the narrative.
  id: c_7
  satisfaction_condition: Node s_18 is achieved with Michael shot and incapacitated.
  type: achievement
  violation_condition: Michael’s attack on Laurie is resolved without Loomis shooting
    him or an equivalent mitigating intervention.
- description: After Michael is shot and falls from the window (s_19), his body must
    be missing at the end of the narrative, preserving the ambiguous survival and
    threat continuation.
  id: c_8
  satisfaction_condition: Michael’s body is confirmed missing after his fall as in
    s_19.
  type: invariant
  violation_condition: Michael’s body is found, confirmed dead, or the narrative closes
    definitively on his death.
