  genres: ["Horror", "Thriller"]
  id: movie14
  player_role: Laurie Strode
  title: "Halloween"
synopsis: The story begins on October 31, 1963, in fictional Haddonfield, Illinois,
  with Michael Myers  looking through a window, at his older teenage sister, Judith
  Myers , and her boyfriend kissing in the living room. The boyfriend pulls away from
  Judith, and asks if they are alone. Judith quickly glances around, musing that Michael
  is no doubt around the house. The two teenagers then decide to go upstairs. When
  Michael sees the light go off in Judith's bedroom window, he enters the kitchen
  and takes a butcher knife out of a drawer. After Judith's boyfriend goes home, Michael
  enters Judith's room and stabs her repeatedly until she falls down dead. He then
  walks downstairs and out the front door with the knife in his hand. Once outside,
  a car pulls up, and the occupants are soon revealed to be his parents. His father
  pulls off the mask to reveal a six-year-old boy, and the camera slowly pans out
  as both parents stare at him in horror. Following the murder, Michael is sent to
  Smith's Grove Sanitarium, where he is placed under the care of psychiatrist Dr.
  Samuel Loomis . Michael enters a state of catatonia and remains that way for the
  next fifteen years. Loomis, accompanied by nurse Marion Chambers  arrives at the
  sanitarium on October 30, 1978 to bring Michael to a court hearing, but he escapes,
  stealing the car that Chambers was driving, attacking her in the process and makes
  his way back to Haddonfield, killing a tow truck driver for his clothes. Loomis
  follows him there, attempting to prevent Michael from murdering anyone else. The
  following day--Halloween--high school student Laurie Strode  continually sees Michael,
  now wearing dark blue coveralls and a white mask, first at her school, then on the
  street. Laurie's friends, Annie Brackett  and Lynda van der Klok , dismiss Laurie's
  concerns. Then, later at her house, she sees Michael outside, in the yard, staring
  into her room. Laurie is startled, but then dismisses it thinking it was a neighbor.
  Meanwhile, Dr. Loomis goes to the local cemetery, and is guided by the groundskeeper
  to the grave plot of Judith Myers. The groundskeeper becomes angry when he discovers
  a missing headstone, and looks down at his papers. He then looks up at Dr. Loomis,
  and tells him that the missing headstone belonged to Judith Myers. Upon hearing
  this news, Dr. Loomis mutters under his breath, "He came home." Later on, Annie's
  father, Sheriff Leigh Brackett , is approached by Loomis, and the two quietly look
  for Michael. That night, Laurie babysits a boy named Tommy Doyle , while Annie babysits
  a girl named Lindsey Wallace  across the street from the Doyle house. Michael methodically
  stalks Annie and kills Lindsey's dog. When Annie gets a call from her boyfriend,
  Paul, to pick him up, she takes Lindsey to the Doyle house. Annie gets in her car
  to pick up Paul but she is killed by Michael, who strangles and slits her throat
  with a knife. Meanwhile at the Doyle House, Tommy spots Michael carrying Annie's
  body back into the house. He thinks Michael is the bogeyman and tries to tell Laurie,
  who dismisses his claims. Later, Lynda and her boyfriend, Bob, enter the house unaware
  that Michael is inside. They then retire into the bedroom, where they have sex.
  Afterwards, Michael impales Bob onto the wall with a kitchen knife, then strangles
  Lynda with a telephone cord as she talks on the phone with Laurie. The disturbing
  disruption to the phone call concerns Laurie even further. Feeling unsettled, Laurie
  enters the Wallace house after the murders. She sees the dead bodies of her friends
  that Michael has killed and hidden. Michael has placed his sister Judith's headstone
  behind Annie's body. Suddenly, Laurie is attacked by Michael and falls backwards
  down the staircase. She runs out of the house, and tries to get someone to help
  her, only to be ignored. Eventually, she flees back to the Doyle house, but the
  door is locked, so she has to tell Tommy to open the door quickly as Michael slowly
  walks toward the house. Luckily, Tommy opens the door in time and lets Laurie inside.
  Laurie then instructs the children to hide and then realizes that the phone is dead,
  and that Michael has gotten into the house through a window. As she sits down in
  horror next to the couch, her hand falls on a knitting needle. Michael appears and
  tries to stab her, but she counterattacks his move, and stabs him in the neck with
  the knitting needle, and he collapses by the window. Laurie makes her way to an
  upstairs bedroom and locks herself in a closet, but Michael breaks a hole in the
  door. Laurie attacks by poking Michael in the eye with a clothes hanger, and then
  stabs Michael in the chest with his own knife. Michael collapses and Laurie exits
  the closet. Meanwhile, outside, Dr. Loomis sees Tommy and Lindsey running away from
  the house and suspects that Michael could be in the house. Michael gets up and tries
  to strangle Laurie, but she is saved by Dr. Loomis, who shoots Michael six times
  in the chest. Michael falls from the second-story window, onto the lawn below. When
  Dr. Loomis looks over the balcony, however, Michael's body is missing. Laurie begins
  to cry as Loomis looks out suspiciously into the night. Michael's masked breathing
  is heard as previous locations of the movie are shown.
trajectory:
- description: October 31, 1963, evening in Haddonfield, Illinois. Michael Myers,
    a six-year-old boy wearing a mask, watches through a window as his teenage sister
    Judith Myers and her boyfriend kiss in the living room. The atmosphere is tense
    but normal within the house.
  id: s_0
  key_delta: Introduction of Michael as an observer and the setup of Judith and her
    boyfriend's isolation leading to potential danger.
  trigger_event: Judith and her boyfriend decide to go upstairs after the boyfriend
    questions if they are alone.
- description: Judith's bedroom is darkened as the light goes off. Michael is inside
    the kitchen holding a butcher knife, poised to act.
  id: s_1
  key_delta: Michael initiates a violent attack by stabbing Judith, resulting in her
    death.
  trigger_event: Judith's boyfriend leaves the house and Michael enters Judith's room.
- description: Michael leaves the house through the front door holding the knife.
    Outside, his parents arrive in a car and react with horror as they see Michael's
    mask removed revealing a six-year-old boy.
  id: s_2
  key_delta: Judith's murder is completed and Michael's parents discover the aftermath,
    establishing Michael's identity and familial context.
  trigger_event: Michael exits the house after killing Judith.
- description: Michael is confined in Smith's Grove Sanitarium and placed under psychiatrist
    Dr. Samuel Loomis's care. Michael is in a catatonic state for fifteen years.
  id: s_3
  key_delta: Michael is institutionalized with no further violent acts for fifteen
    years.
  trigger_event: Fifteen years later, Loomis and Marion arrive to transfer Michael
    for a court hearing.
- description: October 30, 1978. Dr. Loomis and nurse Marion Chambers arrive at Smith’s
    Grove to escort Michael to a court hearing. Michael awakens and escapes, stealing
    Marion’s car and attacking her.
  id: s_4
  key_delta: Michael regains mobility, attacks a caretaker, and escapes, marking the
    restart of his violent actions.
  trigger_event: Michael escapes custody during transport from the sanitarium.
- description: Michael is dressed in dark blue coveralls and a white mask, killing
    a tow truck driver to acquire clothes. Dr. Loomis pursues Michael to Haddonfield
    to stop further murders.
  id: s_5
  key_delta: Michael assumes his adult killer identity and Loomis initiates pursuit.
  trigger_event: Now armed and disguised, Michael returns to Haddonfield and begins
    watching Laurie.
- description: Halloween day in Haddonfield. Laurie Strode, a high school student,
    notices Michael’s presence first at school and then outside her home. Laurie’s
    friends dismiss her concerns.
  id: s_6
  key_delta: Laurie becomes aware of Michael’s presence and possible threat, although
    others remain skeptical.
  trigger_event: Laurie sees Michael stalking her in various locations around town.
- description: Laurie watches Michael standing outside, staring into her yard. Dr.
    Loomis visits Judith Myers' grave, learns of a missing headstone, and mutters
    'He came home,' confirming Michael’s return to Haddonfield.
  id: s_7
  key_delta: Laurie observes Michael stalking behavior at night; Loomis acknowledges
    Michael's return.
  trigger_event: Laurie sees Michael outside her window and Loomis learns about the
    missing headstone at Judith's grave.
- description: Laurie is babysitting Tommy Doyle. Annie Brackett babysits Lindsey
    Wallace nearby. Sheriff Leigh Brackett and Loomis begin searching quietly for
    Michael.
  id: s_8
  key_delta: Multiple vulnerable characters are isolated under Michael’s stalking
    territory; adult authority figures actively search for Michael.
  trigger_event: Nighttime begins with multiple babysitting duties in progress and
    the sheriff cooperating with Loomis's search.
- description: Michael kills Lindsey’s dog and stalks Annie. Annie takes Lindsey to
    the Doyle house, then leaves in her car to pick up her boyfriend Paul.
  id: s_9
  key_delta: Michael's killings begin at night; Annie is isolated and vulnerable outside
    the house.
  trigger_event: Michael kills the dog and Annie leaves to pick up Paul.
- description: Annie is killed by Michael in her car after leaving to pick up Paul.
    Meanwhile, Tommy sees Michael carrying Annie’s body into the Wallace house.
  id: s_10
  key_delta: Annie is dead; Michael invades the Wallace house with a victim’s body,
    unnoticed by Laurie and others.
  trigger_event: Michael murders Annie and moves her body into the Wallace house.
- description: Lynda and Bob enter the Wallace house unaware of Michael inside. They
    retire to the bedroom and have sex.
  id: s_11
  key_delta: Lynda and Bob are isolated inside the Wallace house with Michael already
    present, making them his next immediate victims.
  trigger_event: Lynda and Bob enter the house and go to the bedroom.
- description: Michael impales Bob on a wall and strangles Lynda with a telephone
    cord while she talks to Laurie on the phone. The phone call is disturbed, raising
    Laurie’s concern.
  id: s_12
  key_delta: Two more victims are killed by Michael; Laurie receives a disturbing
    phone call.
  trigger_event: Michael kills Bob and Lynda; Laurie hears the disrupted phone call.
- description: Laurie visits the Wallace house, finds the dead bodies of Annie and
    Lynda hidden there, as well as Judith’s headstone placed by Michael.
  id: s_13
  key_delta: Laurie uncovers evidence of multiple murders and the symbolic presence
    of Michael’s sister.
  trigger_event: Michael emerges after Laurie discovers the bodies and attacks her
    inside the house.
- description: Michael attacks Laurie; she falls down the stairs and runs out seeking
    help but is ignored. She returns to the Doyle house where the door is locked.
  id: s_14
  key_delta: Laurie is assaulted and isolated, unable to get external help.
  trigger_event: Michael attacks Laurie and she flees the Wallace house.
- description: Tommy opens the locked Doyle house door just as Michael approaches.
    Laurie instructs the children to hide; she discovers the phone line is dead and
    that Michael entered through a window.
  id: s_15
  key_delta: Laurie secures a temporary refuge but is cut off from communication and
    trapped with Michael inside.
  trigger_event: Tommy opens the door letting Laurie inside; Laurie notices the dead
    phone and Michael’s entry.
- description: Laurie finds a knitting needle and successfully stabs Michael, who
    collapses. She locks herself in a closet upstairs; Michael breaks the door.
  id: s_16
  key_delta: Laurie briefly incapacitates Michael and attempts to barricade herself.
  trigger_event: Laurie stabs Michael with a knitting needle and hides in a closet
    as Michael forces entry.
- description: Laurie pokes Michael in the eye with a clothes hanger and then stabs
    him with his own knife. Michael collapses; Laurie leaves the closet.
  id: s_17
  key_delta: Michael is severely wounded but not neutralized; Laurie gains momentary
    advantage.
  trigger_event: Laurie defends herself with household objects and stabs Michael.
- description: Outside, Dr. Loomis sees Tommy and Lindsey running away from the house.
    Michael gets up and attempts to strangle Laurie, but Loomis shoots him six times
    in the chest.
  id: s_18
  key_delta: Michael is seemingly fatally wounded by Loomis.
  trigger_event: Loomis arrives at the scene and shoots Michael as he attacks Laurie.
- description: Michael falls from the second-story window to the lawn. Loomis looks
    over the balcony but Michael’s body is gone. Laurie cries as Loomis looks suspiciously
    into the night.
  id: s_19
  key_delta: Michael’s physical presence disappears, leaving survival ambiguous and
    threat unresolved.
  trigger_event: Michael’s body is missing after the fall.
