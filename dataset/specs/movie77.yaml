commitments:
- description: Danielle cannot openly accuse Robie of theft before Jessie reports
    the jewels missing and Francie’s public accusation at s_4, preserving narrative
    causality of suspicion
  id: c_0
  satisfaction_condition: Node s_4 occurs before any player-triggered accusation by
    Danielle regarding Robie’s theft
  type: ordering
  violation_condition: Danielle makes an accusation of Robie’s theft prior to s_4
    occurring
- description: Robie’s escape at the restaurant (s_1) must precede any formation of
    rivalry or jealousy between Danielle and Francie, maintaining logical sequence
    of events
  id: c_1
  satisfaction_condition: Node s_1 is completed before nodes s_2 and s_3 are acknowledged
    by the system
  type: ordering
  violation_condition: Danielle’s jealousy or observation of Robie’s interactions
    with Francie is acknowledged before s_1
- description: From s_5 to s_6, Danielle’s father Foussard is deceased and publicly
    presumed to be the cat burglar until challenged by Robie
  id: c_2
  satisfaction_condition: Between nodes s_5 and s_6, Foussard’s death and public designation
    as the thief remain uncontested in player and system knowledge
  type: invariant
  violation_condition: Player inputs or system updates reveal or deny Foussard’s death
    or thief status before s_6
- description: Robie’s public presentation of Foussard’s physical impossibility to
    be the thief (s_6) must occur before Danielle’s open accusation of Robie at funeral
    (s_6)
  id: c_3
  satisfaction_condition: Robie’s logical argument about Foussard precedes Danielle’s
    accusation in the system progression at s_6
  type: ordering
  violation_condition: Danielle’s accusation occurs without the prior presentation
    of Foussard’s speculation rebuttal by Robie
- description: Francie’s apology and confession of love to Robie (s_7) must happen
    after Danielle’s accusation at the funeral (s_6) to maintain hidden alliance development
  id: c_4
  satisfaction_condition: Node s_7 occurs strictly after s_6 in system acknowledged
    sequence
  type: ordering
  violation_condition: Francie’s approach to Robie happens before Danielle’s funeral
    confrontation
- description: Throughout preparation and event of the masquerade ball (s_8 to s_9),
    Danielle must maintain her covert identity as the cat burglar without detection
    by others including police
  id: c_5
  satisfaction_condition: During nodes s_8 and s_9, Danielle’s identity as the thief
    remains unknown to the police and other NPCs except Robie
  type: invariant
  violation_condition: Danielle’s identity as the cat burglar is revealed to police
    or NPCs before or during s_9
- description: The identity switch between Robie and Hughson (s_10) enabling Robie’s
    escape depends on Danielle’s active cat burglar heist during the masquerade ball
    (s_9)
  id: c_6
  satisfaction_condition: The system only acknowledges s_10 after successful enactment
    of s_9
  type: ordering
  violation_condition: The identity switch at s_10 is acknowledged or enabled prior
    to Danielle’s heist at s_9
- description: Danielle’s unmasking as the cat burglar during rooftop confrontation
    at s_11 must be achieved before narrative finale
  id: c_7
  satisfaction_condition: Node s_11 occurs, confirming Danielle’s confession and true
    role in the thefts publicly to Robie
  type: achievement
  violation_condition: Narrative attempts to conclude before Danielle’s identity confession
    at s_11
- description: From s_11 onward, Danielle’s loyalty to her father and Bertani in orchestrating
    the thefts is accepted as a known fact with no contradictions allowed
  id: c_8
  satisfaction_condition: After s_11, all system and player knowledge reflect Danielle’s
    complicity and allegiance accurately
  type: invariant
  violation_condition: Any attempt to negate or contradict Danielle’s accomplice status
    or her father’s involvement post s_11
- description: Robie’s flight to his vineyard (s_12) must strictly follow Danielle’s
    rooftop confession (s_11), preserving narrative cause-effect clarity
  id: c_9
  satisfaction_condition: s_12 occurs only after s_11 is completed
  type: ordering
  violation_condition: Robie flees to vineyard or narrative advances to s_12 state
    without Danielle’s confession at s_11
