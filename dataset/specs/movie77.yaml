meta:
  genres: ["Thriller", "Romance"]
  id: movie77
  player_role: Danielle Foussard
  title: "To Catch a Thief"
synopsis: John Robie is a notorious but retired jewel thief or "cat burglar," nicknamed
  "The Cat," who now tends to his vineyards in the French Riviera. A series of robberies
  that closely resemble his in style leads the police to believe that the Cat is up
  to his old tricks again. They come to arrest him, and he adeptly gives them the
  slip. He immediately seeks refuge with his old gang from his days in the French
  Resistance, a group of ex-cons whose patriotic work led to grants of parole that
  depend on them keeping their noses clean. Bertani, Foussard, and the others are
  all under a cloud while the Cat is at large, and they blame Robie. Still, when the
  police arrive at Bertani’s restaurant, Foussard’s daughter Danielle spirits her
  old flame to safety. Robie's plan is to prove his innocence by catching the new
  cat burglar in the act, so he enlists the aid of an insurance man of Bertani's acquaintance,
  H. H. Hughson, an Englishman who reluctantly obtains a list of the most expensive
  jewels currently on the Riviera. The first owners listed are Jessie Stevens and
  her daughter Francie. Robie strikes up an acquaintance with them — delighting Jessie
  even as Francie offers a pretense of modesty, while Danielle bares her jealous claws.
  Francie is not afraid of a little fun. Although she sees through Robie’s cover as
  an American industrialist, the considerable charms of this thief are worth catching.
  She dangles before him her jewels, teases him with steamy tales of rooftop escapades,
  exposes herself as a feline of a special breed——an accomplice who might share his
  passion and be available to his sordid desires. Fireworks fill the night and can
  even be seen in the sky. The next morning, Jessie discovers her jewels are stolen,
  and Francie suddenly feels that Robie has taken advantage of her. She accuses him
  of using her to steal her mother's jewelry. The police are called and he is back
  on the lam. To catch the new burglar Robie stakes out an estate at night and finds
  himself struggling with an attacker who loses his footing and tumbles over a cliff.
  It is Foussard, who dies in the fall. The police chief publicly announces that Foussard
  was the jewel thief, but, as Robie points out to him in the presence of the abashed
  Hughson, this would have been impossible——Foussard had a prosthetic leg and could
  not possibly climb on rooftops. Robie's quiet attendance at Foussard’s funeral is
  marred by Danielle's open accusation that he is responsible for her father's death.
  Outside the graveyard, Francie apologizes to Robie and confesses her love for him.
  She arranges to help him attend a masquerade ball the coming weekend. At the ball,
  Francie is resplendent in a gold gown, Robie unrecognizable behind the mask of a
  Moor. The police hover nearby. Upstairs, the cat burglar silently cleans out several
  jewel boxes. When Jessie asks the Moor to go get her "heart pills," Robie’s voice
  tips off his identity to the authorities. Upon his return the police wait out Francie
  and the Moor as they dance the night away. Finally, Francie and the Moor go to her
  room, and the mask is removed——it is Hughson, switched to conceal Robie’s exit.
  On the rooftop Robie lurks. His patience is finally rewarded when he is joined by
  another figure in black. But just as his pursuit begins, the police throw a spotlight
  on him. Again he flees and shots ring out, but he manages to corner his foe with
  jewels in hand. Unmasked, his nemesis turns out not to be a man after all. Danielle
  is "The Cat," and she confesses that she has been working for her father and Bertani.
  Robie speeds back to his vineyard and Francie races after to convince him that she
  has a place in his life. He agrees, but seems less than thrilled about the arrangement
  including her mother.
trajectory:
- description: Danielle Foussard is at her father Foussard’s restaurant where tension
    is high as the police arrive to arrest John Robie, suspected of returning to jewel
    theft. The group of old resistance comrades, including Bertani and Foussard, is
    under pressure, and Danielle is witnessing the rising conflict as Robie evades
    capture.
  id: s_0
  key_delta: Robie escapes arrest, the old gang is blamed and placed under suspicion,
    and Danielle begins to feel conflicted loyalty toward Robie and her father.
  trigger_event: The police arrive at Bertani’s restaurant to arrest John Robie.
- description: Danielle manages to spirit John Robie to safety from the police at
    the restaurant, demonstrating her protective and defiant stance amidst the tense
    atmosphere.
  id: s_1
  key_delta: Robie is hidden and safe for now; Danielle openly sides with him against
    the police and her father’s associates.
  trigger_event: Danielle secretly escorts Robie out of the restaurant to avoid police
    detection.
- description: Danielle observes Robie forming an acquaintance with Jessie Stevens
    and her daughter Francie, whose jewels are identified as potential targets. She
    watches Robie’s interactions with them, noting especially the jealousy Danielle
    feels toward Francie.
  id: s_2
  key_delta: Robie infiltrates the wealthy social circle, increasing Danielle’s jealousy
    and suspicion toward Francie.
  trigger_event: Robie meets Jessie and Francie Stevens and begins courting them.
- description: Danielle notices Robie and Francie’s flirtatious interaction where
    Francie teases him with her jewels and stories of theft escapades; a rivalry forms
    between Danielle and Francie.
  id: s_3
  key_delta: Danielle’s jealousy intensifies, and Francie’s role as a potential accomplice
    or rival is highlighted.
  trigger_event: At a social gathering, Francie flaunts her jewels and challenges
    Robie with stories and temptation.
- description: The next morning, Jessie discovers jewels stolen from her possession
    and Francie blames Robie publicly, accusing him of betrayal and theft during their
    acquaintance.
  id: s_4
  key_delta: Robie is forced to flee again, public suspicion against him increases,
    and Danielle’s father remains implicated by association.
  trigger_event: That night, Foussard joins the rooftop pursuit and confronts the
    burglar above the cliffs.
- description: Danielle learns that during a stakeout, Foussard, her father, confronts
    an attacker at night, struggles with them, and falls to his death over a cliff,
    shocking Danielle deeply.
  id: s_5
  key_delta: Danielle loses her father; official narrative brands Foussard as the
    thief; Danielle’s grief and anger towards Robie begin to deepen.
  trigger_event: Foussard falls to his death after a rooftop struggle caught during
    Robie’s stakeout.
- description: At Foussard’s funeral, Danielle openly accuses Robie of being responsible
    for her father's death, fueling community tension. Danielle’s hostility toward
    Robie is fully expressed.
  id: s_6
  key_delta: Hostile relationship between Danielle and Robie is cemented; Danielle’s
    personal vendetta is clear.
  trigger_event: Danielle confronts Robie with accusations at the funeral procession.
- description: Outside the graveyard, Danielle is unaware as Francie privately apologizes
    to Robie and declares her love, setting up alliance and romantic tension away
    from Danielle’s view.
  id: s_7
  key_delta: Francie joins Robie’s cause; romantic subplot begins unbeknownst to Danielle.
  trigger_event: Francie approaches Robie to express regret and affection shortly
    after the funeral.
- description: Danielle prepares for a masquerade ball where police presence is high,
    watching over the wealthy guests and anticipating the cat burglar’s next move
    in the charged atmosphere.
  id: s_8
  key_delta: Danielle positions herself strategically as a key figure in protection
    and surveillance at the event.
  trigger_event: Danielle participates in the preparations and security for the masquerade
    ball.
- description: During the ball, Danielle, disguised and in collaboration with Bertani,
    operates covertly as the new cat burglar, stealing precious jewels amid the crowd
    while police watch closely.
  id: s_9
  key_delta: Danielle’s identity as the new cat burglar is revealed through her actions,
    confirming her role in the ongoing burglaries.
  trigger_event: Danielle executes a jewel theft at the masquerade ball while masked
    and unrecognized.
- description: Robie is trapped by police inside the ball but escapes through a planned
    switch of identities with Hughson, supported unknowingly by Danielle’s actions
    as the cat burglar on the rooftop.
  id: s_10
  key_delta: Robie remains free; Danielle’s heists continue to complicate the manhunt
    and deepen the conflict.
  trigger_event: Robie and Hughson exchange identities under police observation, allowing
    Robie to evade capture.
- description: Robie confronts Danielle on the rooftop after a dramatic chase with
    police in pursuit; during the confrontation, Danielle confesses her working with
    her father and Bertani, revealing her motivations.
  id: s_11
  key_delta: Danielle’s true allegiance is publicly revealed to Robie; the betrayal
    within the resistance group is exposed.
  trigger_event: Robie corners Danielle on a rooftop, and she admits her complicity
    in the thefts for her father’s cause.
- description: After the rooftop confrontation, Danielle watches as Robie flees to
    his vineyard, aware that her actions have driven a wedge between old loyalties
    and new alliances, with unresolved tensions lingering.
  id: s_12
  key_delta: Danielle is left isolated in her stance, and the fractured relationships
    among the characters reach a new low.
  trigger_event: Robie escapes to his vineyard following the confrontation.
