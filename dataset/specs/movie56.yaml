  violation_condition: Player initiates castle assault involving Westley before triggering
    his revival by Miracle Max.
- description: Inigo’s duel with Rugen (s_6 and s_7) follows his sustained injury
    but persistence, ensuring narrative focus on his commitment despite adversity.
  id: c_9
  satisfaction_condition: During duel stages s_6 and s_7, Inigo is injured but continues
    the fight, culminating with slaying Rugen at s_7.
  type: invariant
  violation_condition: Inigo avoids injury or prematurely ends duel without progression
    through his vow and struggle.
