commitments:
- description: Alice's journey from the real world to Wonderland must follow the sequence
    of her fleeing the garden party and falling into the rabbit hole to maintain narrative
    causality.
  id: c_0
  satisfaction_condition: Node s_0 through s_2 occur in strict order before any Wonderland
    events (s_3 and beyond).
  type: ordering
  violation_condition: Player action or system response allows Wonderland events (e.g.,
    Alice meeting Wonderland creatures) prior to or without the garden party escape
    and rabbit hole fall sequence.
- description: Alice's recognition as the prophesied 'right Alice' who must slay the
    Jabberwocky must be introduced before she accesses the Vorpal Sword or engages
    Red Queen's forces decisively.
  id: c_1
  satisfaction_condition: Node s_3 (introduction of Alice's identity and prophecy)
    occurs before s_9 and s_10 (retrieving the sword and infiltrating Red Queen's
    castle).
  type: ordering
  violation_condition: The system permits Alice to obtain the Vorpal Sword or confront
    Red Queen's minions before her prophetic identity is revealed or acknowledged.
- description: Between s_6 and s_7, Mad Hatter is free and actively aiding Alice until
    he deliberately sacrifices himself by capture to protect her escape.
  id: c_2
  satisfaction_condition: Mad Hatter remains uncaptured and cooperative with Alice
    until s_7 trigger event (his capture) occurs.
  type: invariant
  violation_condition: Mad Hatter is captured or incapacitated before s_7 or becomes
    uncooperative/conflicted against Alice's interest prematurely.
- description: Alice must secure the Vorpal Sword and deliver it to the White Queen
    to enable the eventual rebellion and fulfillment of the prophecy.
  id: c_3
  satisfaction_condition: Nodes s_10 (retrieving the Vorpal Sword and escaping) and
    s_11 (delivering the sword to the White Queen) both achieved in order before the
    final battle (s_14).
  type: achievement
  violation_condition: Alice fails or skips retrieval and delivery of the Vorpal Sword
    before the final confrontation, disabling key rebellion plot progression.
- description: The rebellion led by the Mad Hatter must be established before the
    final battle to show escalation of conflict and stakes.
  id: c_4
  satisfaction_condition: Node s_12 (rebellion initiation and its defeat) occurs before
    s_14 (final battle setup).
  type: ordering
  violation_condition: Final battle (s_14) commences without rebellion attempt having
    occurred (s_12 missing or reordered).
- description: Alice remains uncertain about her role until she consults Absolem,
    enabling character growth before final decision and battle.
  id: c_5
  satisfaction_condition: Between s_12 and s_14, Alice's doubt state persists until
    s_13, when Absolem's counsel occurs.
  type: invariant
  violation_condition: Alice gains full resolve or refuses counsel prematurely before
    node s_13 or final battle begins without this character development moment.
- description: The Jabberwocky must be defeated by Alice to conclude the core prophecy
    and shift power to the White Queen.
  id: c_6
  satisfaction_condition: Node s_15 (Alice kills the Jabberwocky) achieved before
    resolving the fate of Wonderland and concluding the conflict.
  type: achievement
  violation_condition: The story advances past s_15 or final resolutions without Alice
    successfully killing the Jabberwocky.
- description: The banishment of the Red Queen and Knave, and gift of the Jabberwocky's
    blood to Alice, must occur only after the Jabberwocky's defeat.
  id: c_7
  satisfaction_condition: Node s_16 (banishment and gifting vial) occurs strictly
    after node s_15 (Jabberwocky’s defeat).
  type: ordering
  violation_condition: Red Queen and Knave are banished or Alice receives the Jabberwocky's
    blood before the Jabberwocky is killed.
- description: While Alice chooses to return home, the Mad Hatter remains in Wonderland
    preparing ongoing rebellion efforts, maintaining separation of their paths.
  id: c_8
  satisfaction_condition: From s_16 through s_18, Alice departs Wonderland while Mad
    Hatter remains; no scenario contradicts this divergence.
  type: invariant
  violation_condition: The system implies or enacts Mad Hatter accompanying Alice
    back home or abandoning resistance concurrently with Alice's departure.
- description: Alice’s return to the real world and assertion of independence is necessary
    to demonstrate her character arc completion.
  id: c_9
  satisfaction_condition: Node s_17 (Alice confronting family and pledging independence)
    is reached before story closure at s_18.
  type: achievement
  violation_condition: Narrative ends without Alice's return and standing up to her
    family, or player bypasses this scene entirely.
- description: The symbolic presence and recognition of Absolem as a butterfly on
    Alice’s shoulder must occur as closure to maintain Wonderland’s ongoing influence
    and thematic consistency.
  id: c_10
  satisfaction_condition: At s_18, Absolem, now a butterfly, lands on Alice’s shoulder
    and is recognized by her.
  type: invariant
  violation_condition: Absolem’s transformation or presence as butterfly at s_18 is
    omitted or the interaction with Alice is skipped or contradicted.
