commitments:
- description: The personal tensions and living situation including Ed on the couch,
    and Pete’s recent mugging and bite, must be established before the zombie outbreak
    is acknowledged.
  id: c_0
  satisfaction_condition: Narrative has reached or passed s_0 before progressing to
    s_1 or beyond.
  type: ordering
  violation_condition: Player attempts to trigger or acknowledge the outbreak (s_1
    or later) without prior establishment of household tensions and bite status (s_0).
- description: The external zombie outbreak must be introduced before any defensive
    or escape actions against zombies are taken.
  id: c_1
  satisfaction_condition: Narrative has reached or passed s_1 before s_2 or beyond
    occurs.
  type: ordering
  violation_condition: Player attempts zombie-related defense or planning (s_2 or
    beyond) without the outbreak being known (before s_1).
- description: Between nodes s_2 and s_3, the house is under zombie attack, requiring
    defensive action and arming from the shed until Pete’s zombification and escape
    occurs.
  id: c_2
  satisfaction_condition: While within s_2 to s_3 phase, player actions must reflect
    the house being attacked and arming occurring prior to escape.
  type: invariant
  violation_condition: Player bypasses engagement with zombie attack on the house
    or does not arm before fleeing the house containing zombie Pete.
- description: Pete’s zombification and subsequent escape must occur before the group
    attempts rescue and gathering of other survivors.
  id: c_3
  satisfaction_condition: Narrative reaches s_3 before progressing to s_4 and beyond.
  type: ordering
  violation_condition: Player attempts to gather survivors (s_4+) without first confirming
    Pete’s zombification and escape (s_3).
- description: Phillip’s infection and worsening condition must be recognized before
    the group expands to include Liz and her flatmates.
  id: c_4
  satisfaction_condition: Narrative proceeds sequentially from s_4 (Phillip bitten)
    to s_5 (group expansion).
  type: ordering
  violation_condition: Player collects Liz and flatmates (s_5) before acknowledging
    Phillip’s infection state (s_4).
- description: Phillip’s death and zombification must occur before the group abandons
    the car and goes on foot towards the pub.
  id: c_5
  satisfaction_condition: Phillip’s death at s_6 is recognized before foot travel
    or subsequent events.
  type: ordering
  violation_condition: Player initiates travel on foot or other related escapes prior
    to Phillip’s death and transformation.
- description: Between s_7 and s_8, the group must attempt stealth passage but on
    being detected due to Ed and Shaun’s argument, must seek refuge in the pub.
  id: c_6
  satisfaction_condition: During s_7–s_8, player actions include stealth attempt followed
    by defensive regrouping inside the pub.
  type: invariant
  violation_condition: Player bypasses detection and refuge sequence, or ignores the
    argument’s role in alerting zombies.
- description: While in s_9, the group defends the entire pub using the Winchester
    rifle, during which Barbara’s bite wound becomes fatal requiring her to be shot
    by Shaun.
  id: c_7
  satisfaction_condition: In s_9, defense using the rifle occurs, and Barbara’s death
    and zombification followed by Shaun’s shooting is acknowledged.
  type: invariant
  violation_condition: Player avoids or negates Barbara’s death and subsequent defensive
    shooting during the pub defense at s_9.
- description: Ed’s infection via Pete’s bite must occur before the emergency escape
    and fire set inside the pub.
  id: c_8
  satisfaction_condition: Narrative reaches s_10 with Ed bitten by Pete and Molotov
    cocktail used in escape.
  type: ordering
  violation_condition: Player escapes or fires the pub without Ed being infected by
    Pete’s bite recognized first.
- description: Ed must remain behind, mortally wounded and holding the rifle in the
    cellar while Shaun and Liz escape via the service hatch.
  id: c_9
  satisfaction_condition: Narrative progresses from s_11 with Ed remaining behind
    after Shaun and Liz escape.
  type: ordering
  violation_condition: Player causes Shaun and Liz to escape without Ed’s sacrifice
    and separation having occurred.
- description: Rescue by the British Army and arrival of Yvonne must precede final
    survivor safety and reconciliation.
  id: c_10
  satisfaction_condition: Narrative reaches s_12 before survivors achieve external
    rescue and relative safety.
  type: ordering
  violation_condition: Player creates survivor safety or resolution without the recorded
    military rescue and Yvonne’s arrival.
- description: The story’s closing state with Ed zombified but tethered and living
    with Shaun and Liz six months post-outbreak must be achieved to complete the narrative
    arc.
  id: c_11
  satisfaction_condition: Narrative reaches s_13 with Ed as a zombie controlled companion
    and Shaun and Liz cohabiting.
  type: achievement
  violation_condition: Player prematurely closes or alters the narrative ending without
    depicting Ed zombified and tethered and post-outbreak normalcy.
