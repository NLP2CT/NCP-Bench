commitments:
- description: Confederate initial intelligence from spy Harrison must be received
    before Lee can confidently plan and issue strategic orders around Gettysburg.
  id: c_0
  satisfaction_condition: Player acknowledges or obtains Harrison's intelligence report
    at or after node s_0.
  type: ordering
  violation_condition: Player attempts to act on detailed enemy dispositions or issues
    major orders related to Union troop positions before Harrison's report is delivered
    and processed by Longstreet and Lee (before s_0).
- description: J.E.B. Stuart cavalry remains out of communication with Lee before
    his return late on day two, affecting Confederate intelligence completeness.
  id: c_1
  satisfaction_condition: From s_0 through s_8, Stuart’s communication status is 'out
    of contact' and does not update Lee.
  type: invariant
  violation_condition: Player gains or impersonates Stuart's intelligence report to
    Lee before s_8 or acts as if Lee already possesses such information earlier.
- description: Union forces must deploy defensively on Seminary Ridge before the first
    engagement with Confederate divisions begins.
  id: c_2
  satisfaction_condition: Union cavalry under Buford positioned on Seminary Ridge
    at or before s_1, and Heth’s division attack occurs at or after s_3.
  type: ordering
  violation_condition: Player bypasses Buford’s initial deployment and initiates or
    acknowledges battle events before Union cavalry hold Seminary Ridge.
- description: The internal discipline and cohesion of the 20th Maine regiment (including
    absorption of rebellious 2nd Maine soldiers) must be established before the battle
    at Little Round Top.
  id: c_3
  satisfaction_condition: Chamberlain successfully wins over rebellious soldiers,
    consolidating the 20th Maine by s_3 or before s_7.
  type: achievement
  violation_condition: Player attempts to engage or depend on the 20th Maine's effectiveness
    in battle without first resolving their internal discipline issues.
- description: General Reynolds' arrival and his death must logically occur after
    Buford's cavalry engagement and before Confederate flank attacks begin.
  id: c_4
  satisfaction_condition: Events at s_4 with Reynolds reinforcing Buford and subsequent
    death happen after initial battle engagements at s_3 but before Ewell's flank
    advance at s_5.
  type: ordering
  violation_condition: Player or narrative triggers Reynolds’ death or arrival out
    of sequence, such as before Buford engages or after Ewell’s flank attack starts.
- description: Ewell's failure to take Cemetery Hill must be represented as a critical
    tactical loss, preserving Union control of the hill for subsequent defensive action.
  id: c_5
  satisfaction_condition: From s_5 onwards, Cemetery Hill remains under Union control,
    with Ewell's hesitation preventing Confederate capture.
  type: invariant
  violation_condition: Player actions or changes result in Confederate forces capturing
    Cemetery Hill before or during s_5, contradicting the established tactical loss.
- description: Armistead’s personal preparations (Bible package for Hancock’s wife)
    and camaraderie with Union forces must be established before Pickett’s Charge.
  id: c_6
  satisfaction_condition: Armistead entrusts Longstreet with the package during s_6
    before the full-scale attack ordered at s_9.
  type: ordering
  violation_condition: Player skips or removes Armistead’s personal preparations prior
    to initiating the final assault phase at s_9.
- description: Chamberlain’s defense and bayonet charge on Little Round Top must occur
    to prevent Confederate breakthrough on the Union left flank during the second
    day of battle.
  id: c_7
  satisfaction_condition: The bayonet charge ordered by Chamberlain at s_7 successfully
    repels Confederate attacks and holds Little Round Top.
  type: achievement
  violation_condition: Player allows Confederate forces to take Little Round Top without
    resistance, violating the commitment of Union holding that flank.
- description: Lee maintains command discipline by denying Stuart’s resignation and
    demanding restoration of cavalry communication upon Stuart’s late return.
  id: c_8
  satisfaction_condition: At s_8, Lee rebukes Stuart and refuses resignation, enforcing
    the command structure.
  type: invariant
  violation_condition: Player accepts Stuart’s resignation before s_8 or acts as if
    Lee permits the absence to continue unchallenged.
- description: Pickett’s Charge (the final frontal assault) must be ordered by Lee
    only after prior days’ engagements and tactical developments have occurred.
  id: c_9
  satisfaction_condition: Final assault at s_9 only initiates after s_0 through s_8
    have been completed with corresponding buildup and planning.
  type: ordering
  violation_condition: Player triggers or attempts Pickett’s Charge before preceding
    battle phases are complete or strategically justified.
- description: The partial breakthrough by Confederate forces and the mortal wounding
    of Armistead must occur during Pickett’s Charge, symbolizing the heavy cost and
    failure of the assault.
  id: c_10
  satisfaction_condition: At s_10, Armistead rallies troops and is mortally wounded
    near the stone wall, and Union forces repulse the Confederate assault.
  type: achievement
  violation_condition: Any narrative progression or player action that prevents Armistead’s
    wounding or the failure of the Confederate breakthrough.
- description: Lee’s personal acceptance of defeat and ordered retreat must follow
    the failure of Pickett’s Charge and depletion of Confederate forces.
  id: c_11
  satisfaction_condition: At s_11, Lee takes responsibility and commands retreat only
    after the assault at s_10 has failed.
  type: ordering
  violation_condition: Player initiates Confederate retreat or Lee’s admission without
    the prior failed frontal assault event.
- description: The survival and emotional reunion of Chamberlain and his brother symbolize
    Union endurance and must occur after the battle's conclusion.
  id: c_12
  satisfaction_condition: At s_12, Chamberlain reunites with Tom and the Union flag
    is solemnly displayed, marking battle’s end.
  type: achievement
  violation_condition: Player proceeds to closure or victory without depicting Chamberlain
    brothers’ survival and Union symbolic victory scene.
