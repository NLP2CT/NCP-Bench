commitments:
- description: The ED-209 malfunction (s_0) must occur before the approval of the
    RoboCop program (s_1), preventing premature shift in corporate focus.
  id: c_0
  satisfaction_condition: Node s_0 is reached before node s_1.
  type: ordering
  violation_condition: Node s_1 is triggered before s_0, allowing the RoboCop program
    to begin despite the ED-209 malfunction being unaddressed.
- description: Murphy’s death (s_2) must occur after RoboCop program approval (s_1)
    and before RoboCop’s operational crime-fighting success (s_3), securing the causal
    link from human officer to cyborg.
  id: c_1
  satisfaction_condition: Node s_1 precedes s_2, and s_2 precedes s_3 in narrative
    progression.
  type: ordering
  violation_condition: RoboCop’s success (s_3) occurs without Murphy’s death/conversion
    (s_2) or before program approval (s_1).
- description: Throughout the RoboCop operational phase (s_3 to s_9), RoboCop retains
    latent memories and mannerisms of Murphy, forming the persistent human identity
    core that motivates narrative events.
  id: c_2
  satisfaction_condition: RoboCop exhibits recognizably Murphy’s mannerisms and memories
    during phases s_3 through s_9.
  type: invariant
  violation_condition: At any point in s_3 to s_9, RoboCop fully loses Murphy’s memories
    or mannerisms, eliminating the human link.
- description: Morton’s murder by Boddicker on Jones’ secret orders (s_4) must occur
    only after RoboCop’s operational success (s_3) elevates Morton’s status, establishing
    motive and consequence.
  id: c_3
  satisfaction_condition: Node s_3 precedes node s_4 in linear progression.
  type: ordering
  violation_condition: Morton’s murder (s_4) occurs before RoboCop’s success and Morton’s
    rise (s_3).
- description: Evidence linking Jones to Morton’s murder must be obtained and presented
    to the OCP chairman (s_9) before Jones’ confrontation and demise (s_10), enabling
    narrative resolution.
  id: c_4
  satisfaction_condition: Node s_9 is reached and evidence is presented to the chairman
    prior to node s_10.
  type: achievement
  violation_condition: Jones is confronted or defeated (s_10) without RoboCop presenting
    incriminating evidence (s_9).
- description: RoboCop’s fourth directive blocking harm/arrest of senior OCP executives
    must be active and disable him during Jones’ attempt to arrest (s_6 and s_10),
    preserving corporate safeguards logically within the plot.
  id: c_5
  satisfaction_condition: At encounters s_6 and s_10, RoboCop is incapacitated/prevented
    from harming Jones by his fourth directive.
  type: invariant
  violation_condition: RoboCop harms or arrests Jones at s_6 or during s_10 confrontation
    without activation of the fourth directive safeguard.
- description: Jones’ ordering of Boddicker to kill Morton (s_4) must precede Boddicker’s
    arrest by RoboCop (s_5), establishing Jones’ indirect exposure through criminal
    association.
  id: c_6
  satisfaction_condition: Node s_4 occurs before s_5 in sequence.
  type: ordering
  violation_condition: Boddicker is arrested (s_5) before Morton is murdered under
    Jones’ orders (s_4).
- description: The failure of ED-209 to kill RoboCop due to inability to descend stairs
    (s_6) must occur before RoboCop’s rescue by Anne Lewis after police SWAT attack
    (s_7), preventing premature RoboCop destruction.
  id: c_7
  satisfaction_condition: Event s_6 (ED-209 attack and RoboCop escape) occurs before
    s_7 (SWAT attack and rescue).
  type: ordering
  violation_condition: RoboCop is destroyed or rescued (s_7) before surviving the
    ED-209 attack (s_6).
- description: Jones covertly collaborates with Boddicker, providing him with resources
    to attack RoboCop (s_8), maintaining the narrative of Jones orchestrating open
    assaults to eliminate threats.
  id: c_8
  satisfaction_condition: During s_8, Boddicker’s gang is armed and directed by Jones
    to attack RoboCop.
  type: invariant
  violation_condition: Boddicker attacks RoboCop without evidence or implication of
    Jones’ sponsorship.
- description: Jones’ death (s_10) must occur only after presentation of conclusive
    evidence (s_9) and loss of corporate protection from the chairman, preventing
    premature narrative resolution.
  id: c_9
  satisfaction_condition: Node s_9 (evidence presentation) is followed by s_10 (Jones’
    confrontation and death).
  type: ordering
  violation_condition: Jones dies or is neutralized (s_10) before RoboCop presents
    definitive evidence to the chairman (s_9).
- description: RoboCop must declare his identity as 'Murphy' after Jones’ death and
    OCP’s stabilization (s_11), closing the narrative arc on human-machine identity
    fusion.
  id: c_10
  satisfaction_condition: Node s_11 occurs with RoboCop affirming the name 'Murphy'.
  type: achievement
  violation_condition: The story ends or RoboCop is recognized without the identity
    declaration 'Murphy' in s_11.
