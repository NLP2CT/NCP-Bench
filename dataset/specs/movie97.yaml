commitments:
- description: Wyatt and his brothers must establish their economic foothold in Tombstone
    (s_0) before any major conflict escalation with the Cowboys starts.
  id: c_0
  satisfaction_condition: Node s_0 (Earps gain gambling and saloon stake) is reached
    before node s_1 or any conflict-triggering events occur.
  type: ordering
  violation_condition: Player attempts to trigger conflicts with the Cowboys or mark
    escalation nodes (s_1 or later) before Earps gain economic foothold at s_0.
- description: Curly Bill Brocious must be arrested by Wyatt (at s_1) before his trial
    and acquittal (s_2) can occur, ensuring proper sequence of legal events.
  id: c_1
  satisfaction_condition: s_1 occurs before s_2; the arrest event is confirmed before
    any trial or acquittal events are acknowledged.
  type: invariant
  violation_condition: Player bypasses arrest event and triggers trial or acquittal
    before Curly Bill’s arrest by Wyatt.
- description: The Cowboys, including Ike Clanton, must be enraged and threaten the
    Earps (s_2) only after the acquittal of Curly Bill, ensuring causality in escalating
    violence.
  id: c_2
  satisfaction_condition: Threats by Cowboys and rising tensions (s_2) occur only
    after Curly Bill's trial and acquittal confirmed.
  type: invariant
  violation_condition: Player triggers threat events or Cowboy hostility toward Earps
    prior to or without Curly Bill’s trial and acquittal.
- description: Virgil Earp must become marshal and impose the weapons ban (s_3) before
    the gunfight at the O.K. Corral (within s_3), maintaining narrative causality.
  id: c_3
  satisfaction_condition: Node s_3 begins with Virgil's marshal appointment and weapons
    ban prior to the gunfight event trigger within s_3.
  type: ordering
  violation_condition: Player triggers the gunfight at the O.K. Corral scene or consequences
    before Virgil becomes marshal and enforces weapons ban.
- description: Morgan’s death and Virgil’s maiming resulting from Cowboy ambush (s_4)
    must occur as retribution after the gunfight, not before.
  id: c_4
  satisfaction_condition: Events s_4 (ambush with Morgan’s death and Virgil’s injury)
    only take place after s_3 gunfight event is completed.
  type: invariant
  violation_condition: Player instigates or verifies successful ambush and injuries
    before the gunfight at the O.K. Corral event concludes.
- description: Wyatt’s family must leave Tombstone by train (start of s_4/s_5) under
    threat from Cowboys including Ike Clanton before Wyatt declares himself U.S. Marshal
    and initiates the red sash vendetta (s_5).
  id: c_5
  satisfaction_condition: Departure event with threats from Cowboys occurs prior to
    Wyatt’s marshal declaration and vow to kill all red sash wearers.
  type: ordering
  violation_condition: Player triggers Wyatt’s declaration and gun-slinging law enforcement
    actions before family departure threat scene is completed.
- description: Wyatt’s posse’s posse ambush and Curly Bill’s death in the river gunfight
    (s_6) must happen while Cowboys are actively hostile, preserving narrative escalation.
  id: c_6
  satisfaction_condition: Ambush and Curly Bill’s death (s_6) occur after Wyatt’s
    marshal declaration and prior to Johnny Ringo leading Cowboys (s_7).
  type: invariant
  violation_condition: Player eliminates or neutralizes Cowboys leadership or Wyatt’s
    posse actions before s_5 marshal declaration and vendetta commencement.
- description: Johnny Ringo must become Cowboys leader (beginning of s_7) only after
    Curly Bill’s death (s_6), and the challenge to Wyatt for showdown must follow.
  id: c_7
  satisfaction_condition: s_7 node is unlocked only after s_6 concludes with Curly
    Bill’s death.
  type: ordering
  violation_condition: Player triggers Johnny Ringo’s leadership or showdown challenge
    before Curly Bill is killed.
- description: Doc Holliday’s preemptive killing of Johnny Ringo at the showdown (s_8)
    must occur before Wyatt reaches the showdown site and before Cowboys lose momentum.
  id: c_8
  satisfaction_condition: Doc kills Ringo at the showdown before Wyatt arrives at
    the site, disrupting Cowboys’ plans.
  type: invariant
  violation_condition: Player causes Wyatt or others to kill Ringo first or removes
    Doc’s intervention from the showdown timeline.
- description: Ike Clanton must survive the dismantling of the Cowboys (s_9) by escaping
    after discarding his red sash, remaining a fugitive, to maintain tension in story
    closure.
  id: c_9
  satisfaction_condition: Player confirms Ike Clanton’s escape post-Cowboys purge
    by removing red sash and avoiding death or capture.
  type: invariant
  violation_condition: Player kills Ike Clanton or captures him during the final assault
    on Cowboys, violating his fugitive status at s_9.
- description: The narrative closure must include the near extinction of the Cowboys,
    Doc Holliday’s death in sanatorium, and Wyatt’s retirement with his marriage to
    Josephine, marking the story’s resolution.
  id: c_10
  satisfaction_condition: Completion of node s_10 where Cowboys are nearly extinct,
    Doc’s death is confirmed, and Wyatt’s peaceful retirement and long marriage are
    acknowledged.
  type: achievement
  violation_condition: Player attempts to extend conflict beyond s_10 milestones,
    resurrect Doc, or prevents Wyatt’s pursuit of Josephine and final retirement.
