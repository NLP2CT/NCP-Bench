meta:
  genres: ["Western", "Biography"]
  id: movie97
  player_role: Ike Clanton
  title: "Tombstone"
synopsis: Wyatt Earp, a retired peace officer, reunites with his brothers Virgil and
  Morgan in Tucson, Arizona, where they venture on toward Tombstone, a small but growing
  mining town, to settle down. There they encounter Wyatt's friend Doc Holliday, a
  Southern gambler and expert gunslinger, who seeks relief from his tuberculosis in
  Arizona's drier climate. Also newly arrived in Tombstone with a traveling theatre
  troupe are Josephine Marcus and Mr. Fabian. The married Wyatt attempts to resist
  a strong attraction to Josephine. Wyatt's wife, Mattie Blaylock, is becoming dependent
  on laudanum. Just as Wyatt and his brothers begin to benefit from a stake in a gambling
  emporium and saloon, they have their first encounter with a band of outlaws called
  the Cowboys. Led by "Curly Bill" Brocious, the Cowboys are identifiable by the red
  sashes worn around their waist. Conflict is narrowly avoided upon Wyatt's insistence
  that he is retired and no longer interested in a career enforcing the law. This
  is also the first face-to-face meeting for Holliday and Johnny Ringo, who take an
  immediate dislike to one another. As tensions rise, Wyatt is pressured to help rid
  the town of the Cowboys. Shooting aimlessly after a visit to an opium house, Curly
  Bill is ordered by Marshal White to relinquish his firearms. Curly Bill shoots the
  marshal and is forcibly taken into custody by Wyatt. The arrest infuriates Ike Clanton
  and the other Cowboys, who threaten Wyatt, his brothers, and Doc. Curly Bill stands
  trial, but is found not guilty due to lack of witnesses. Virgil, unable to tolerate
  lawlessness, becomes the new marshal and imposes a weapons ban within the city limits.
  This leads to the legendary gunfight at the O.K. Corral, in which Billy Clanton,
  Frank McLaury, and Tom McLaury are killed, Virgil and Morgan are wounded, and the
  allegiance of county sheriff Johnny Behan to the Cowboys is made clear. As retribution
  for the Cowboy deaths, Wyatt's brothers are ambushed——Morgan is killed, while Virgil
  is maimed. A despondent Wyatt and his family leave Tombstone and board a train.
  Followed by Ike Clanton and Frank Stilwell, Wyatt sees that his family leaves safely,
  and then surprises the assassins who had come to kill them. Stilwell is killed,
  but Wyatt lets Clanton return to send a message. Wyatt announces that he is a U.S.
  Marshal and that he intends to kill any man he sees wearing a red sash. Wyatt, Doc,
  a reformed Cowboy named Sherman McMasters, and allies Texas Jack Vermillion and
  Turkey Creek Jack Johnson, join forces to administer justice. Wyatt and his posse
  are ambushed by the Cowboys in a riverside forest. Wyatt wades out into the river
  and engages in a gunfight which ends with Wyatt killing Brocious. Johnny Ringo then
  becomes the head of the Cowboys. Doc's health is worsening and they depend on the
  accommodations of Henry Hooker. At Hooker's ranch, they encounter Josephine, learning
  that Mr. Fabian was shot by Cowboys who tried to steal Josephine's watch. Wyatt
  finally realizes he wants to be with Josephine, but is unable to commit to her because
  of his ongoing fight against the Cowboys. Ringo sends a messenger to the ranch telling
  Wyatt that he wants a showdown to end the hostilities and Wyatt agrees. Doc knows
  he is a better match for Ringo, but is in no condition for a gunfight. Wyatt sets
  off for the showdown, not knowing that Doc has already beat him to the scene. Doc
  confronts a surprised Ringo, saying they are just finishing their previous challenge
  "to play for blood". Doc gets the first shot off, hitting Ringo, and killing him.
  Wyatt runs when he hears the gunshot only to encounter Doc. They then press on to
  finish the job of eliminating the Cowboys, although Ike Clanton escapes their vengeance
  after he throws down his red sash. Doc is later sent to a sanatorium in Glenwood
  Springs, Colorado. After a visit from Wyatt, Doc looks at his bare feet and the
  condition of the bed in which he is lying——realizing he is about to die with his
  boots off, he passes away peacefully, muttering "I'll be damned. Oh, this is funny."
  At Doc's urging, Wyatt pursues Josephine, locating her in Denver. Robert Mitchum
  narrates an account of their long marriage, ending with Wyatt's death in Los Angeles
  in 1929.
trajectory:
- description: Ike Clanton is present in Tombstone, Arizona, where tensions simmer
    between local citizens, the Cowboys gang identified by their red sashes, and law
    enforcement figures including retired lawman Wyatt Earp and his brothers.
  id: s_0
  key_delta: The Earps establish an economic foothold in Tombstone, escalating their
    prominence and setting up a basis for conflict with the Cowboys.
  trigger_event: Wyatt Earp and his brothers begin benefiting from their ownership
    stake in a gambling emporium and saloon in Tombstone.
- description: Ike Clanton witnesses the Earps' growing influence and their first
    encounter with the Cowboys, led by Curly Bill Brocious.
  id: s_1
  key_delta: Curly Bill's arrest by Wyatt intensifies the conflict between the Cowboys
    and the Earps' faction.
  trigger_event: Curly Bill, after causing a disturbance, shoots Marshal White and
    is arrested by Wyatt Earp.
- description: Ike and the Cowboys are enraged by Curly Bill's arrest, threatening
    the Earps and their ally Doc Holliday.
  id: s_2
  key_delta: The legal failure to convict Curly Bill diminishes law enforcement's
    authority and increases Cowboy boldness.
  trigger_event: Curly Bill is tried and acquitted due to lack of witnesses.
- description: Ike Clanton observes Virgil Earp becoming Tombstone marshal and imposing
    a weapons ban within the city limits.
  id: s_3
  key_delta: The gunfight results in deaths of Cowboy members and wounds to the Earps,
    further polarizing the town and aligning Sheriff Behan with the Cowboys.
  trigger_event: The weapons ban leads to escalating tensions culminating in the gunfight
    at the O.K. Corral.
- description: Following the gunfight, Ike Clanton and other Cowboys carry out retaliatory
    ambushes against the Earps, with Morgan killed and Virgil maimed.
  id: s_4
  key_delta: The assassination attempt during the departure marks an overt escalation
    into violent vendetta.
  trigger_event: Wyatt Earp and his family leave Tombstone by train, under threat
    from Cowboys including Ike Clanton and Frank Stilwell.
- description: Ike Clanton follows Wyatt's family to ensure the threat is enforced,
    resulting in an ambush where Stilwell is killed and Ike is allowed to escape.
  id: s_5
  key_delta: Wyatt publicly adopts a law enforcement role and initiates an active
    campaign against the Cowboys, intensifying hostilities.
  trigger_event: Wyatt declares himself a U.S. Marshal and vows to kill any man wearing
    a red sash.
- description: Ike Clanton is aware that Wyatt and his posse, including Doc Holliday
    and allies, are actively pursuing justice against the Cowboys.
  id: s_6
  key_delta: The death of Curly Bill weakens the Cowboys' leadership and shifts power
    within the gang.
  trigger_event: Wyatt's posse is ambushed in a riverside forest, but Wyatt kills
    Curly Bill Brocious in a river gunfight.
- description: Ike Clanton faces a shifted power structure in the Cowboys with Johnny
    Ringo now as their leader.
  id: s_7
  key_delta: A direct confrontation is set, signaling a climax in the conflict between
    the Earps and the Cowboys.
  trigger_event: Johnny Ringo challenges Wyatt Earp to a showdown to end hostilities.
- description: Ike Clanton perceives that Doc Holliday, ill yet decisive, preempts
    Wyatt by confronting and killing Johnny Ringo first.
  id: s_8
  key_delta: The death of Ringo disrupts the Cowboys' momentum and sows further chaos
    among them.
  trigger_event: Doc Holliday kills Johnny Ringo in a gunfight at the designated showdown
    site.
- description: Ike Clanton is present as the Cowboys' power diminishes significantly,
    though he personally escapes after discarding his red sash.
  id: s_9
  key_delta: The Cowboy gang is effectively dismantled, but Ike Clanton remains at
    large as a fugitive.
  trigger_event: Wyatt and his allies continue eliminating Cowboys, but Ike Clanton
    avoids capture or death.
- description: Ike Clanton, now a fugitive without his red sash, observes the final
    defeat of the Cowboys and the death of Doc Holliday in a Colorado sanatorium.
  id: s_10
  key_delta: Conflict resolves with the near extinction of the Cowboys, the death
    of Doc Holliday, and the closing of Wyatt Earp's active involvement.
  trigger_event: Wyatt pursues Josephine Marcus after Doc's death, culminating eventually
    in Wyatt's long, peaceful retirement.
