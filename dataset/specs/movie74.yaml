commitments:
- description: Leonard must not acknowledge or act upon knowledge of Teddy as 'John
    G' or the second attacker before obtaining the driver's license identifying 'John
    Edward Gammell' (node s_12).
  id: c_0
  satisfaction_condition: Player only gains and acts on Teddy’s identity as 'John
    G' after event s_12.
  type: invariant
  violation_condition: Player attempts to confront or accuse Teddy as 'John G' or
    tattoo his license plate before s_12.
- description: Leonard’s encounter and killing of Jimmy Grantz (node s_2) must occur
    before he meets Teddy to learn that Jimmy was 'John G' (node s_5).
  id: c_1
  satisfaction_condition: s_2 occurs before s_5.
  type: ordering
  violation_condition: Player obtains Teddy’s revelation from s_5 before killing Jimmy
    at s_2.
- description: Leonard’s condition of anterograde amnesia and the use of notes, Polaroids,
    and tattoos as memory aids remain a constant throughout the narrative from s_0
    to s_14.
  id: c_2
  satisfaction_condition: At all nodes s_0 through s_14, the player must demonstrate
    Leonard’s memory impairment and reliance on external cues.
  type: invariant
  violation_condition: Player behaves with intact short-term memory for more than
    a single scene or ignores all memory aids contradicting Leonard’s condition.
- description: Leonard must obtain and process the caller’s prompt at s_0 before meeting
    Teddy in the motel lobby at s_1.
  id: c_3
  satisfaction_condition: s_0 precedes s_1 without skipping the initial phone call
    and Leonard’s established investigation state.
  type: ordering
  violation_condition: Player attempts to meet Teddy or access information only available
    from s_0 prior to completing s_0.
- description: Leonard must kill Jimmy (node s_2) and create physical evidence (Polaroid
    photo developing at s_3) to solidify his belief before progressing to suspect
    Teddy as the second attacker.
  id: c_4
  satisfaction_condition: Both s_2 (killing Jimmy) and s_3 (photo developing) occur
    before s_8 (tattooing Teddy’s plate) or confronting Teddy at s_14.
  type: achievement
  violation_condition: Player accepts Teddy as the attacker or tattoos Teddy’s plate
    before completing both s_2 and s_3.
- description: Leonard’s meeting with Natalie and utilizing her assistance (s_9 and
    s_10) must occur before uncovering Teddy’s full identity via the driver’s license
    at s_12.
  id: c_5
  satisfaction_condition: s_9 and s_10 precede s_12 in the narrative flow without
    skipping.
  type: ordering
  violation_condition: Player accesses or acts on Teddy’s identity information (s_12)
    without first collaborating with Natalie (s_9/s_10).
- description: Leonard’s distrust of Teddy, marked by the photo with ‘Do not trust’
    (node s_11), remains valid after meeting Teddy until Teddy’s death at s_14.
  id: c_6
  satisfaction_condition: Between s_11 and s_14, Leonard’s system recognizes mistrust
    toward Teddy and forbids cooperation beyond investigative pragmatism.
  type: invariant
  violation_condition: Player trusts Teddy fully or reverses mistrust before s_14
    in contradiction to documented notes and narrative logic.
- description: Leonard must complete the killing of Teddy (s_14) to conclusively resolve
    the pursuit of the second attacker and close the narrative loop.
  id: c_7
  satisfaction_condition: Event s_14 (Teddy’s death) is achieved as the final narrative
    milestone.
  type: achievement
  violation_condition: Player ends or attempts to finalize the narrative without Teddy’s
    killing that matches the established causal chain.
- description: Leonard’s burning of Jimmy’s Polaroid photo (s_7) must occur after
    the confrontation and revelations involving Teddy (s_5 and s_6), symbolizing rejection
    of the false ‘John G’ identity.
  id: c_8
  satisfaction_condition: Events s_5 and s_6 occur before s_7 in proper sequence.
  type: ordering
  violation_condition: Player burns Jimmy’s photo prematurely before Teddy’s exposition
    or before understanding the false narrative.
