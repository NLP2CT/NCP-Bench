meta:
  genres: ["Western", "Adventure"]
  id: movie94
  player_role: Butch Cassidy
  title: "Butch Cassidy and the Sundance Kid"
synopsis: In late 1890s Wyoming, Butch Cassidy is the affable, clever, talkative leader
  of the outlaw Hole in the Wall Gang. His closest companion is the laconic dead-shot
  "Sundance Kid". The two return to their hideout at Hole-in-the-Wall to discover
  that the rest of the gang, irked at Butch's long absences, have selected Harvey
  Logan as their new leader. Harvey challenges Butch to a knife fight over the gang's
  leadership. Butch defeats him using trickery, but embraces his idea to rob the Union
  Pacific Overland Flyer train on both its eastward and westward runs, agreeing that
  the second robbery would be unexpected and likely reap even more money than the
  first. The first robbery goes well. To celebrate, Butch and Sundance visit a favorite
  brothel in a nearby town and watch, amused, as the town sheriff unsuccessfully attempts
  to organize a posse to track down the gang. They then visit Sundance's lover, schoolteacher
  Etta Place. On the second train robbery, Butch uses too much dynamite to blow open
  the safe, blowing up the baggage car. As the gang scrambles to gather up the money,
  a second train arrives carrying a six-man team of lawmen. The robbers scatter but
  the posse heads after Butch and Sundance, who unsuccessfully try to hide out in
  the brothel and to seek amnesty from the friendly Sheriff Bledsoe. As the posse
  remains in pursuit despite all attempts to elude them, Butch and Sundance determine
  that the group includes renowned Indian tracker "Lord Baltimore" and relentless
  lawman Joe LeFors, recognizable by his white skimmer. Butch and Sundance finally
  elude their pursuers by jumping from a cliff into a river far below. They learn
  from Etta that the posse has been paid by Union Pacific head E. H. Harriman to remain
  on their trail until Butch and Sundance are both killed. Butch persuades Sundance
  and Etta that the three should escape to Bolivia, which Butch envisions as a robber's
  paradise. On their arrival there, a dismayed Sundance regards the country with contempt
  while Butch remains optimistic. They soon discover that they know too little Spanish
  to pull off a bank robbery, so Etta attempts to teach them the language. With her
  as an accomplice, they become successful bank robbers known as Los Bandidos Yanquis.
  However, their confidence drops when they see a man wearing a white skimmer and
  fear that Harriman's posse is still after them. Butch suggests "going straight",
  and he and Sundance land their first honest job as payroll guards for a mining company.
  However, they are ambushed by local bandits on their first run and their boss, Percy
  Garris, is killed. Butch and Sundance ambush and kill the bandits, the first time
  Butch has ever shot someone. Concluding that the straight life isn't for them, they
  return to robbery, but Etta decides to return to the United States. Butch and Sundance
  steal a payroll and the mules carrying it, and arrive in a small town. A boy recognizes
  the mules' brand and alerts the local police, leading to a gunfight with the outlaws.
  They take cover in a building, but are both seriously wounded when Butch has to
  make a run to the mules for more ammunition. As dozens of Bolivian soldiers surround
  the area, Butch suggests the duo's next destination should be Australia. The film
  ends with a freeze frame shot on the pair charging out of the building, guns blazing,
  as the Bolivian forces fire repeatedly on them.
trajectory:
- description: In the Hole-in-the-Wall hideout in late 1890s Wyoming, Butch Cassidy
    leads the outlaw gang with his close companion Sundance Kid among the members;
    the gang atmosphere is tense due to Butch's frequent absences.
  id: s_0
  key_delta: Restoration of Butch's presence is confirmed, but gang members express
    dissatisfaction by selecting a new leader, Harvey Logan.
  trigger_event: Butch and Sundance return to the hideout after a long absence.
- description: The gang has chosen Harvey Logan as new leader, challenging Butch’s
    authority while stationed at the hideout.
  id: s_1
  key_delta: Leadership challenge is initiated; Butch defeats Harvey but accepts the
    idea to rob the Union Pacific Overland Flyer on both directions.
  trigger_event: Harvey Logan challenges Butch Cassidy to a knife fight for leadership.
- description: Butch and the gang prepare to execute the plan to rob the eastward
    Union Pacific Overland Flyer train.
  id: s_2
  key_delta: Successful completion of the first train robbery, securing money and
    boosting gang morale.
  trigger_event: The gang carries out the first train robbery.
- description: Butch and Sundance celebrate the successful robbery at a local brothel
    while the town sheriff attempts to organize a posse unsuccessfully.
  id: s_3
  key_delta: Confirmation that local law enforcement is ineffective so far, maintaining
    gang's relative safety momentarily.
  trigger_event: Butch and Sundance witness the sheriff fail to form a posse to pursue
    the gang.
- description: Butch and Sundance visit Sundance’s lover, schoolteacher Etta Place,
    in a nearby town.
  id: s_4
  key_delta: Personal relationship with Etta Place is established and introduced into
    the gang’s affairs.
  trigger_event: Butch and Sundance arrive at Etta Place’s residence for a visit.
- description: The gang prepares for the second Union Pacific Overland Flyer train
    robbery, expecting increased risk and gain.
  id: s_5
  key_delta: The attempt detonates excessive dynamite, blowing up the baggage car,
    alerting approaching lawmen.
  trigger_event: Gang initiates the second robbery attempt on the train westward.
- description: During the confusion caused by the explosion, the gang is scattered
    as a posse of lawmen arrives on a second train.
  id: s_6
  key_delta: The gang's operation is interrupted, forcing members to flee and triggering
    active law enforcement pursuit.
  trigger_event: A posse arrives on a second train dispatching a six-man law enforcement
    team.
- description: Butch and Sundance are pursued and seek refuge unsuccessfully in the
    brothel and by asking Sheriff Bledsoe for amnesty.
  id: s_7
  key_delta: Their protective cover is compromised and they are clearly identified
    as targets of the posse.
  trigger_event: The posse continues relentless pursuit despite Butch and Sundance's
    attempts to hide and negotiate.
- description: Butch and Sundance identify members of the posse, including tracker
    Lord Baltimore and lawman Joe LeFors distinguished by his white skimmer hat.
  id: s_8
  key_delta: Now aware of the specific enemies pursuing them, enhancing their situational
    awareness.
  trigger_event: Butch and Sundance observe and recognize key posse members tracking
    them.
- description: Butch and Sundance escape by jumping from a cliff into a river below,
    temporarily evading the posse.
  id: s_9
  key_delta: Escape from immediate danger is accomplished, allowing planning for future
    moves.
  trigger_event: Butch and Sundance jump off a cliff to evade capture during the posse’s
    pursuit.
- description: Safe with Etta, Butch learns the posse is financially backed by E.
    H. Harriman to ensure their deaths.
  id: s_10
  key_delta: Information about the lethal intent of the posse reveals intensified
    stakes for Butch and Sundance.
  trigger_event: Etta informs Butch and Sundance about Union Pacific’s sponsorship
    of the posse.
- description: Butch persuades Sundance and Etta that fleeing to Bolivia offers a
    safer, more profitable outlaw life.
  id: s_11
  key_delta: Decision to relocate internationally shifts the narrative to a new setting
    and goal.
  trigger_event: Butch convinces the others to escape to Bolivia.
- description: Arrival in Bolivia finds Sundance discontented while Butch remains
    hopeful; language barrier limits their immediate plans.
  id: s_12
  key_delta: Environmental and cultural obstacles appear; inability to immediate rob
    banks due to Spanish language gap.
  trigger_event: Butch, Sundance, and Etta arrive in Bolivia and confront linguistic
    challenges.
- description: With Etta helping to teach Spanish, Butch and Sundance become successful
    bank robbers under the alias Los Bandidos Yanquis.
  id: s_13
  key_delta: The gang establishes local criminal credibility and develops operational
    capability in Bolivia.
  trigger_event: Butch and Sundance commit successful robberies aided by Etta’s translation.
- description: Butch and Sundance observe a man in a white skimmer, stirring fear
    that their pursuers might have followed them abroad.
  id: s_14
  key_delta: Rising suspicion that Union Pacific’s posse, or its equivalent, may persist
    in tracking them internationally.
  trigger_event: Butch and Sundance spot a man wearing a white skimmer hat in Bolivia.
- description: Butch suggests abandoning outlaw life and Going Straight; they obtain
    their first honest job as payroll guards for a mining company.
  id: s_15
  key_delta: Attempt to transition into lawful work marks a drastic life strategy
    shift.
  trigger_event: Butch and Sundance accept jobs as payroll guards.
- description: On their first payroll run, Butch and Sundance are ambushed by local
    bandits; their boss Percy Garris is killed.
  id: s_16
  key_delta: Honest life is violently disrupted; loss of employer signals increased
    local lawlessness.
  trigger_event: They are attacked by bandits during the payroll escort.
- description: Butch and Sundance retaliate by ambushing and killing the bandits,
    with Butch firing his first kill shot.
  id: s_17
  key_delta: Escalation into deadly violence; Butch crosses a personal milestone by
    killing.
  trigger_event: Butch and Sundance counterattack and eliminate the bandit threat.
- description: Deciding that straight life is untenable, Butch and Sundance return
    to robbery as Etta chooses to return to the US.
  id: s_18
  key_delta: Loss of their linguistic and domestic accomplice weakens their operational
    capacity.
  trigger_event: Etta departs Bolivia, ending her active role with Butch and Sundance.
- description: Butch and Sundance steal a payroll shipment and the mules carrying
    it, entering a small town where they become recognized.
  id: s_19
  key_delta: Their cover in the town is blown, triggering law enforcement response.
  trigger_event: Local boy identifies mules’ brand and alerts authorities.
- description: A gunfight ensues in the town; Butch and Sundance take cover and both
    are seriously wounded during an ammunition run.
  id: s_20
  key_delta: Both outlaws are physically compromised and vulnerable to capture or
    death.
  trigger_event: Butch risks leaving cover to fetch more ammunition and is wounded
    along with Sundance.
- description: Surrounded by dozens of Bolivian soldiers, Butch suggests fleeing to
    Australia as their next destination.
  id: s_21
  key_delta: The immediate external threat solidifies their decision to continue on
    the run internationally.
  trigger_event: They assess the encirclement and Butch proposes escape to Australia.
- description: Butch and Sundance prepare for a final charge out of the building amidst
    heavy fire from the Bolivian forces.
  id: s_22
  key_delta: Climactic confrontation underway; their fate is uncertain as the story
    freezes on this moment.
  trigger_event: They charge out guns blazing as soldiers fire upon them.
