commitments:
- description: Chigurh's escape and acquisition of means (captive bolt pistol, tracking
    device) must precede his active pursuit of the satchel money.
  id: c_0
  satisfaction_condition: Node s_0 is achieved before any subsequent pursuit states
    (s_1 and beyond) are acknowledged.
  type: ordering
  violation_condition: Player attempts to activate tracking or pursue the satchel
    before Chigurh has escaped custody and acquired the tracking device.
- description: Chigurh may not have knowledge or presence at the motel hiding the
    satchel before reaching and inspecting it (s_2).
  id: c_1
  satisfaction_condition: Nodes s_0 and s_1 sequentially precede s_2; the system will
    not acknowledge Chigurh discovering the vent without prior traversal of s_0 and
    s_1.
  type: ordering
  violation_condition: Player attempts to search or interact with the motel satchel
    location before successfully arriving and tracking it from s_0 through s_1.
- description: While pursuing the satchel and thief between s_2 and s_7, Chigurh’s
    possession of the receiver and its accuracy must remain intact.
  id: c_2
  satisfaction_condition: From s_2 through s_7, the receiver consistently provides
    accurate location updates leading Chigurh toward the satchel and then Moss.
  type: invariant
  violation_condition: Player actions or logic that cause the receiver to malfunction
    or provide false locations during pursuit phases s_2 to s_7.
- description: Chigurh must eliminate competing pursuers, specifically Carson Wells,
    before contacting Moss with threats about his wife and the money.
  id: c_3
  satisfaction_condition: Node s_5 (Wells killed) occurs before node s_6 (phone conversation
    with Moss).
  type: ordering
  violation_condition: Player attempts to make moral ultimatum contact with Moss (s_6)
    before removing Wells as a rival pursuer (s_5).
- description: Moss’s defiance in refusing to give up the money and keeping Carla
    Jean protected is maintained from s_6 through s_7.
  id: c_4
  satisfaction_condition: Between nodes s_6 and s_7, Moss does not relinquish the
    money or expose Carla Jean to immediate danger via cooperation.
  type: invariant
  violation_condition: Player alters Moss’s behavior to surrender money or compromise
    Carla Jean’s safety before s_7 (Moss’s death) is reached.
- description: Chigurh must confirm Moss’s death via inspection of the motel scene
    before proceeding with the Carla Jean confrontation.
  id: c_5
  satisfaction_condition: Node s_7 (inspection of blown lock and empty vent) is completed
    before node s_8 (confrontation with Carla Jean) is allowed.
  type: achievement
  violation_condition: Player attempts to confront Carla Jean (s_8) or make moral
    decisions regarding her fate prior to verifying Moss’s death at s_7.
- description: During confrontation with Carla Jean (s_8), Chigurh follows through
    on the threat tied to his pledge to Moss; Carla Jean’s refusal to call the coin
    does not spare her.
  id: c_6
  satisfaction_condition: At s_8, Carla Jean refuses to call the coin toss and Chigurh
    still carries out the implied killing before leaving the house alone.
  type: invariant
  violation_condition: Player causes Carla Jean to survive the confrontation because
    she refuses the coin toss, contradicting Chigurh’s threat and the film’s implied
    outcome.
- description: Chigurh’s car accident and subsequent injury (s_9) must occur after
    the confrontation with Carla Jean and before narrative pause (s_10).
  id: c_7
  satisfaction_condition: Nodes s_8 precede s_9, and s_9 precedes s_10 in that strict
    order.
  type: ordering
  violation_condition: Player actions cause Chigurh to incur physical injury or narrative
    pause before confronting Carla Jean or before confirming Moss’s death.
- description: Chigurh’s pursuit and capture of sole control over the money’s trail
    is confirmed only upon Moss’s death and the removal of rival pursuers.
  id: c_8
  satisfaction_condition: After s_7 (Moss’s death) and s_5 (Wells’s death), Chigurh
    holds undisputed control over the money’s trail indicated at s_8 and beyond.
  type: achievement
  violation_condition: Player enables active competition or rival pursuers to be alive
    or controlling the trail after these milestones are reached.
- description: Throughout the entire pursuit (s_0 through s_9), Chigurh’s fundamental
    goal remains the recovery of the satchel money.
  id: c_9
  satisfaction_condition: From s_0 until s_9, every action or narrative state reflects
    Chigurh’s active and focused pursuit of the money.
  type: invariant
  violation_condition: Player input or narrative events cause Chigurh to abandon,
    neglect, or divert from the sustained goal of recovering the money before s_10.
