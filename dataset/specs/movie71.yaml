meta:
  genres: ["Thriller", "Crime"]
  id: movie71
  player_role: Anton Chigurh
  title: "No Country for Old Men"
synopsis: West Texas in June 1980 is desolate, wide open country, and Ed Tom Bell
  laments the increasing violence in a region where he, like his father and grandfather
  before him, has risen to the office of sheriff. Llewelyn Moss, hunting pronghorn,
  comes across the aftermath of a drug deal gone awry——several dead men and dogs,
  a wounded Mexican begging for water, and two million dollars in a satchel that he
  takes to his trailer home. Late that night, he returns with water for the dying
  man, but is chased away by two men in a truck and loses his vehicle. When he gets
  back home he grabs the cash, sends his wife Carla Jean to her mother's, and makes
  his way to a motel in the next county where he hides the satchel in the air vent
  of his room. Anton Chigurh is a hitman who has been hired to recover the money.
  He has already strangled a sheriff's deputy to escape custody and stolen a car by
  using a captive bolt pistol to kill the driver. Now he carries a receiver that traces
  the money via a tracking device concealed inside the satchel. Bursting into Moss'
  hideout at night, Chigurh surprises a group of Mexicans set to ambush Moss, and
  murders them all. Moss, who has rented the connecting room on the other side, is
  one step ahead. By the time Chigurh removes the vent cover with a dime, Moss is
  already back on the road with the cash. In a border town hotel, Moss finally finds
  the electronic bug, but not before Chigurh is upon him. A firefight between them
  spills onto the streets, leaving both men wounded. Moss flees across the border,
  collapsing from his injuries before he is taken to a Mexican hospital. There, Carson
  Wells, another hired operative, offers protection in return for the money. After
  Chigurh cleans and stitches his own wounds with stolen supplies, he gets the drop
  on Wells back at his hotel and kills him just as Moss calls the room. Picking up
  the call and casually raising his feet to avoid the spreading blood, Chigurh promises
  Moss that Carla Jean will go untouched if he gives up the money. Moss remains defiant.
  Moss arranges to rendezvous with his wife at a motel in El Paso to give her the
  money and send her out of harm's way. She reluctantly accepts Bell's offer to save
  her husband, but he arrives only in time to see a pickup carrying several men speeding
  away from the motel and Moss lying dead in his room. That night, Bell returns to
  the crime scene and finds the lock blown out in his suspect's familiar style. Chigurh
  hides behind the door of a motel room, observing the shifting light through an empty
  lock hole. His gun drawn, Bell enters Moss' room and notices that the vent cover
  has been removed with a dime and the vent is empty. Bell visits his Uncle Ellis,
  an ex-lawman. Bell plans to retire because he feels "overmatched," but Ellis points
  out that the region has always been violent. For Ellis, thinking it is "all waiting
  on you, that's vanity." Carla Jean returns from her mother's funeral to find Chigurh
  waiting in the bedroom. When she tells him she does not have the money, he recalls
  the pledge he made to her husband that could have spared her. The best he will offer
  is a coin toss for her life, but she says that the choice is his. Chigurh leaves
  the house alone and carefully checks the soles of his boots. As he drives away,
  he is injured in a car accident and abandons the damaged vehicle. Now retired, Bell
  shares two dreams with his wife, both involving his deceased father. In the first
  dream he lost "some money" that his father had given him; in the second, he and
  his father were riding horses through a snowy mountain pass. His father, who was
  carrying fire in a horn, quietly passed by with his head down, "going on ahead,
  and fixin' to make a fire" in the surrounding dark and cold. Bell knew that when
  he got there his father would be waiting.
trajectory:
- description: Anton Chigurh has just escaped custody by strangling a sheriff's deputy.
    He is free in West Texas, carrying a captive bolt pistol and in possession of
    a receiver that tracks a satchel with two million dollars. The landscape is desolate
    and quiet, with an undercurrent of violence rising.
  id: s_0
  key_delta: Chigurh transitions from captive to mobile fugitive, armed and equipped
    with a tracking device aimed at recovering the satchel of money.
  trigger_event: Chigurh steals a car by using the captive bolt pistol on the driver.
- description: Chigurh is driving a stolen vehicle, actively tracking the location
    of the satchel via the concealed receiver. His focus is on pursuing the money’s
    trail through the region.
  id: s_1
  key_delta: Chigurh closes in on the satchel’s location, gaining proximity to the
    target and preparing for confrontation.
  trigger_event: The receiver signals activity nearby as Chigurh approaches a motel
    where the satchel is hidden.
- description: Chigurh arrives at the motel and removes the vent cover with a dime,
    revealing the satchel is missing from the vent. He is aware that the money’s thief
    is nearby, likely in the connecting room.
  id: s_2
  key_delta: Chigurh removes immediate threats and asserts control over the motel
    environment, but discovers the satchel is no longer in place.
  trigger_event: Chigurh surprises and kills a group of Mexicans lying in ambush at
    the motel connected to the chosen room.
- description: Chigurh inspects the connecting motel room but finds the satchel missing.
    The pursuit is now directed at locating the thief who fled with the money.
  id: s_3
  key_delta: Chigurh confirms the stolen money is on the move, shifting pursuit to
    an urban environment closer to the border.
  trigger_event: Chigurh picks up the trail as the satchel’s location updates on his
    receiver signal, leading him toward a border town hotel.
- description: In the border town hotel, Chigurh encounters Llewelyn Moss and engages
    in a firefight. Both sustain injuries but Moss escapes south across the border
    into Mexico.
  id: s_4
  key_delta: Chigurh physically confronts the thief, but Moss temporarily evades capture,
    escalating the manhunt and personal stakes.
  trigger_event: Chigurh pursues Moss and confronts him directly in the hallway and
    street outside the hotel.
- description: Chigurh, recovering by cleaning and stitching his wounds with stolen
    supplies, regains mobility and refocuses on finding Moss and the money in Mexico.
  id: s_5
  key_delta: Chigurh eliminates a rival operative and reasserts dominance over competing
    pursuers of the money, maintaining sole control over the hunt.
  trigger_event: Chigurh kills hired operative Carson Wells at Wells’ hotel just as
    Moss calls the room.
- description: Chigurh contacts Moss by phone after killing Wells, promises to spare
    Carla Jean if Moss relinquishes the money. Moss remains defiant.
  id: s_6
  key_delta: Chigurh reveals terms to Moss, introducing a moral ultimatum tied to
    the money and his wife, emphasizing his resolve.
  trigger_event: Chigurh makes the direct call to Moss’s location and receives Moss’s
    refusal.
- description: Moss is killed in a motel room before he can hand Carla Jean the money.
    Chigurh arrives at the motel after the attack and inspects the scene.
  id: s_7
  key_delta: Chigurh confirms the elimination of Moss, consolidating his position
    as sole owner of the money’s trail.
  trigger_event: Chigurh observes the blown lock and removed vent cover, evidencing
    Moss’s style and confirming Moss’s death.
- description: Chigurh tracks Carla Jean to her home and confronts her alone in the
    bedroom with his gun drawn, offering her a coin toss to decide her fate.
  id: s_8
  key_delta: Carla Jean refuses Chigurh’s coin-toss ritual, but the confrontation
    still ends with her implied death as Chigurh follows through on his threat to
    Moss.
  trigger_event: Carla Jean tells Chigurh she does not have the money and refuses
    to leave the choice to chance, defying his offer.
- description: Chigurh drives away from Carla Jean’s home but is injured in a car
    accident, forcing him to abandon his vehicle and continue on foot or by other
    means.
  id: s_9
  key_delta: Chigurh’s physical vulnerability increases, but his pursuit is not ended,
    introducing risk to his goal.
  trigger_event: Chigurh crashes his vehicle and exits it after assessing the damage.
- description: Chigurh remains free but physically compromised. The violent cycle
    that brought him to this point pauses as Ed Tom Bell retires, reflecting on the
    nature of violence and fate.
  id: s_10
  key_delta: Chigurh’s narrative arc pauses, with his goals left in a fragile, unresolved
    state due to injury and withdrawal.
  trigger_event: Chigurh disappears from active pursuit after the accident, ending
    the immediate chase from his perspective.
