commitments:
- description: The system must prevent acknowledgment that the One Ring's resurfacing
    and possession by Bilbo is known before Gandalf becomes aware of it in the Shire
    at s_0.
  id: c_0
  satisfaction_condition: Acknowledgment that the Ring is held by Bilbo occurs only
    after completion of s_0.
  type: ordering
  violation_condition: Player obtains or acts upon knowledge that the Ring is in the
    Shire or with Bilbo before s_0 is triggered.
- description: The transition of the Ring from Bilbo to Frodo is only recognized after
    Gandalf investigates in the Shire at s_1.
  id: c_1
  satisfaction_condition: System acknowledges Frodo as Ring-bearer and Bilbo's departure
    only after s_1 occurs.
  type: ordering
  violation_condition: System or player prematurely treats Frodo as Ring-bearer before
    Gandalf's investigation in the Shire at s_1.
- description: From s_2 to s_3, Samwise Gamgee must be established as a trusted companion
    of Frodo, included in the protective group.
  id: c_2
  satisfaction_condition: Sam's status as Frodo's companion and protector is recognized
    from s_2 onward until s_3.
  type: invariant
  violation_condition: Player excludes Sam from Frodo's protective group or disregards
    his role after s_2 and before s_3.
- description: Gandalf's imprisonment by Saruman only occurs after Gandalf departs
    the Shire and meets Saruman at Isengard at s_3.
  id: c_3
  satisfaction_condition: Gandalf's capture atop Orthanc is acknowledged only during
    or after s_3.
  type: ordering
  violation_condition: Premature imprisonment of Gandalf before leaving the Shire
    or meeting Saruman at Isengard.
- description: Between s_3 and s_4, Gandalf remains physically confined and unable
    to influence events until his rescue.
  id: c_4
  satisfaction_condition: Gandalf is marked imprisoned and inactive until s_4 triggers
    his rescue.
  type: invariant
  violation_condition: Gandalf acts freely or influences other events while still
    imprisoned (before s_4).
- description: Gandalf’s escape from Orthanc precedes arrival at Rivendell and participation
    in the Council of Elrond at s_5.
  id: c_5
  satisfaction_condition: Gandalf’s presence at Rivendell and council attendance is
    only validated after s_4 release.
  type: ordering
  violation_condition: Gandalf attends the Council or arrives at Rivendell prior to
    his escape from Orthanc.
- description: From s_5 through s_6, the Council of Elrond’s decision to destroy the
    Ring and formation of the Fellowship are established milestones; no progression
    beyond can occur without these.
  id: c_6
  satisfaction_condition: The Council's conclusion and Fellowship creation are acknowledged
    as completed before s_7.
  type: invariant
  violation_condition: Player or system progresses to Fellowship journey or beyond
    without confirming the Council's decisions and Fellowship formation.
- description: The journey into the Mines of Moria and encounter with Orcs precedes
    the Balrog confrontation and Gandalf’s fall (s_7 before s_8).
  id: c_7
  satisfaction_condition: The Fellowship’s travel and discovery of hostile mines at
    s_7 is established before Gandalf’s battle and fall at s_8.
  type: ordering
  violation_condition: Gandalf’s confrontation or disappearance occurs before the
    Moria journey begins.
- description: From Gandalf's fall at s_8 through the end of this story, Gandalf
    remains presumed dead and absent as an active leader, and the Fellowship’s morale
    reflects this loss.
  id: c_8
  satisfaction_condition: Gandalf remains absent and the Fellowship mourns his loss
    from s_8 through the final split of the Fellowship.
  type: invariant
  violation_condition: Gandalf returns, provides leadership, or is treated as an
    active participant again before the narrative concludes.
- description: Galadriel’s revelation of Frodo’s destiny strictly happens during s_9
    after Gandalf’s fall and before the Fellowship continues their journey at s_10.
  id: c_9
  satisfaction_condition: Frodo’s knowledge of his destiny is granted only within
    s_9 timeframe.
  type: ordering
  violation_condition: Frodo learns about his destiny before Gandalf’s fall or after
    s_10 begins.
- description: From s_10 to s_11, the corrupting influence of the Ring on Boromir
    becomes apparent leading to his attempt to seize the Ring; the Fellowship's internal
    trust is compromised.
  id: c_10
  satisfaction_condition: Boromir’s betrayal and its impact on the Fellowship are
    recognized throughout s_10.
  type: invariant
  violation_condition: Boromir’s betrayal or Ring influence occurs before s_10 or
    is ignored by the system during s_10.
- description: Boromir’s death and the capture of Merry and Pippin at s_11 occur only
    after the Uruk-hai attack post-Frodo’s escape and Boromir’s betrayal at s_10.
  id: c_11
  satisfaction_condition: Sequence of Boromir’s betrayal, Frodo’s escape, Uruk-hai
    attack, and Boromir’s death follows strictly s_10 then s_11.
  type: ordering
  violation_condition: Boromir’s death or capture of Hobbits occurs prior to Boromir’s
    failed attempt or before Frodo’s escape.
- description: The narrative must reach the state where Frodo and Sam set out towards
    Mordor together while Aragorn, Legolas, and Gimli begin the rescue pursuit for
    Merry and Pippin (endpoint s_12).
  id: c_12
  satisfaction_condition: The story achieves s_12 with Frodo and Sam committed to
    Mordor and Aragorn, Legolas, and Gimli committed to rescuing Merry and Pippin.
  type: achievement
  violation_condition: The story ends or diverges before Frodo and Sam's departure
    and the rescue mission led by Aragorn, Legolas, and Gimli is established.
