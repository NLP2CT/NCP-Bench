    as Sauron's threat rises again.
  id: f_0
  negated: false
- content: The One Ring is lost and has not been rediscovered or reported to Gandalf
    at this time.
  id: f_1
  negated: false
- content: Gandalf is unaware of the location or possession of the One Ring.
  id: f_2
