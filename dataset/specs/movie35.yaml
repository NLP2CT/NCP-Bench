commitments:
- description: Noah Cross's introduction and Mulwray's death (s_0) must occur before
    any investigation or knowledge of Mulwray's murder attempts or Cross's involvement;
    prevents premature exposure of Cross's role.
  id: c_0
  satisfaction_condition: Progression through node s_0 (Mulwray's death recovered
    and initial context established) is achieved before nodes s_1 or later.
  type: ordering
  violation_condition: Investigators or other characters act as if Mulwray's murder
    or Cross's involvement is known before s_0 completion, e.g., confronting Cross
    with murder evidence before his death is discovered.
- description: Throughout s_0 to s_2, Cross's manipulation of water flow and covert
    land acquisition scheme must remain hidden and unconfirmed to investigators and
    the broader public.
  id: c_1
  satisfaction_condition: Before arriving at s_2, investigators/NPCs have no confirmed
    knowledge that the water releases are used to coerce landowners or that Cross
    uses fake name real estate purchases.
  type: invariant
  violation_condition: Investigators or other characters prematurely expose or use
    knowledge of Cross's land acquisition deception or water sabotage before s_2
    is reached.
- description: Cross's covert land acquisition strategy through fake purchases and
    water resource manipulation is first substantively exposed at node s_2. This
    milestone is necessary before later evidence can implicate him more directly.
  id: c_2
  satisfaction_condition: Investigators obtain documented proof or NPC confirmation
    of the fake real estate purchases and water department intimidation schemes as
    described in s_2.
  type: achievement
  violation_condition: Narrative ends or moves to final stages without this critical
    understanding established.
- description: The bifocal-glasses evidence becomes the first key direct murder link
    implicating Cross at s_3, after earlier investigation has already exposed his
    broader water-and-land conspiracy without yet resolving Mulwray's murder.
  id: c_3
  satisfaction_condition: Node s_3 is triggered after s_2, with investigators moving
    from exposing Cross's broader land-and-water scheme to obtaining the bifocal-based
    murder implication against him.
  type: ordering
  violation_condition: Investigators conclusively use the bifocal-glasses murder evidence
    against Cross before the broader land acquisition conspiracy and water manipulation
    scheme have been established.
- description: From s_3 to s_5, Cross's public assertion of familial authority over
    Katherine and his overt move to take custody of her must not be fully brought
    into the open until the final confrontation; this maintains narrative tension
    and logical escalation.
  id: c_4
  satisfaction_condition: Cross's claimed familial authority over Katherine becomes
    openly asserted and central to the conflict only at or after the s_4 confrontation.
  type: invariant
  violation_condition: Narrative openly centers Cross's custody claim over Katherine
    or resolves control of her before the required confrontational context at s_4.
- description: Final climax (s_4) with confrontation between Cross, Evelyn, and Jake
    leading to Evelyn's fatal shooting and Cross's wounding must be achieved before
    narrative resolution to mark the story’s turning point.
  id: c_5
  satisfaction_condition: Climactic event of the shooting at Chinatown (s_4) occurs
    with Evelyn’s death and Cross wounded physically on scene.
  type: achievement
  violation_condition: Narrative proceeds to resolution without this confrontation
    and its consequences occurring.
- description: Cross's uncontested control over Katherine and the effective survival
    of his land dealings are reasserted only after the Chinatown climax (s_4), when
    Gittes and his associates are released and the aftermath settles.
  id: c_6
  satisfaction_condition: Node s_5 must be reached only after s_4 confrontation and
    aftermath have fully played out.
  type: ordering
  violation_condition: Gittes or other investigators gain freedom or knowledge of
    Cross's fate and Katherine's custody before s_4 climax resolution.
- description: Throughout the narrative from s_0 to s_5, the systemic corruption and
    impunity surrounding Cross’s control over water and land interests must remain
    unbroken; no permanent justice or reform is achieved within trajectory.
  id: c_7
  satisfaction_condition: At any point through s_0 to s_5, Cross retains influence
    and no evidence or action fully dismantles his power or exposes systemic corruption
    conclusively.
  type: invariant
  violation_condition: Narrative outcomes result in Cross losing all power, systemic
    corruption being resolved, or full justice served before story end.
