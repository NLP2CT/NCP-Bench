meta:
  genres: ["Mystery", "Thriller"]
  id: movie35
  player_role: Noah Cross
  title: "Chinatown"
synopsis: Noah Cross is a powerful Los Angeles businessman and former partner of
  water engineer Hollis I. Mulwray, whose opposition to a new dam puts him at odds
  with civic and development interests. After a woman posing as Evelyn Mulwray hires
  private investigator Jake Gittes to tail Hollis, photographs of Hollis with the
  young Katherine Cross trigger a scandal. The real Evelyn exposes the deception,
  and Gittes's attempt to discover who used him leads him into the aftermath of Hollis's
  death by drowning. As Gittes investigates suspicious nighttime water releases, attacks
  by water department enforcers, and clues tied to obituaries and retirement-home
  residents, he eventually identifies Cross and is later hired by him to find Katherine,
  who has disappeared after Mulwray's death. Gittes's inquiry uncovers that land
  in the northwest San Fernando Valley is being acquired in the names of dead or unwitting
  people while water shortages and intimidation pressure landowners to sell, revealing
  a scheme that Mulwray appears to have discovered before he was killed. Cross's hidden
  interests come under greater threat when Evelyn and Gittes confirm the fraudulent
  purchases, Ida Sessions is murdered, and forensic evidence shows Mulwray's body
  was moved. Matters escalate when Gittes finds bifocal glasses in Evelyn's saltwater
  pond and learns that Katherine is both Evelyn's sister and daughter, born from Cross's
  sexual abuse. Gittes tries to help Evelyn and Katherine flee, but after Cross privately
  admits his plan to annex, irrigate, and develop the Valley, Gittes confronts him
  with the bifocals as evidence connecting him to Mulwray's murder. Mulvihill intervenes,
  forcing Gittes to lead Cross to Katherine's hiding place in Chinatown. There, police
  arrest Gittes, Cross openly claims Katherine as his granddaughter, and Evelyn shoots
  Cross in the arm before being killed by police gunfire as she attempts to escape.
  In the aftermath, Cross takes Katherine away, Gittes is released, and the corrupt
  political order surrounding Cross's water and land empire remains intact.
trajectory:
- description: Noah Cross is introduced as a powerful and influential Los Angeles
    businessman with extensive landholdings, including tracts in the northwest San
    Fernando Valley. He previously partnered in business with Hollis I. Mulwray, the
    chief engineer of the Los Angeles Department of Water and Power. The city is embroiled
    in a controversy over plans for constructing a new dam, opposed by Mulwray on
    safety grounds. The water department and real estate interests are in tension,
    and Mulwray's position is causing conflict within these circles.
  id: s_0
  key_delta: Mulwray, an obstacle to water department and development plans, is dead
    under suspicious conditions, escalating tensions and power struggles in the city.
  trigger_event: The body of Hollis I. Mulwray is recovered drowned in a reservoir
    under suspicious circumstances.
- description: Noah Cross is informed of Mulwray's death and the investigation beginning.
    He remains publicly calm but is involved behind the scenes. Katherine Cross, connected
    to Noah's family, is missing following Mulwray's death. Cross still exerts control
    over land acquisition strategies in the San Fernando Valley, aiming to incorporate
    and develop the area through water supply manipulation.
  id: s_1
  key_delta: Cross actively recruits an investigator to find Katherine, demonstrating
    direct involvement in concealing or controlling key people connected to Mulwray
    and the water conflicts.
  trigger_event: Noah Cross invites private investigator Jake Gittes to his estate
    and offers him a job to locate Katherine Cross, indicating ongoing covert maneuvers
    regarding family and land interests.
- description: Noah Cross's land acquisition tactics in the northwest San Fernando
    Valley appear complex and secretive, involving purchases in the names of individuals
    unaware of the transactions, including residents of a retirement home. Cross orchestrates
    water shortages to pressure landowners into selling, aiming to gain control of
    irrigation and development rights.
  id: s_2
  key_delta: Cross's strategy to acquire and develop land through deception and manipulation
    of water resources is confirmed, validating suspicions of corrupt land and water
    exploitation schemes.
  trigger_event: The investigation next turns from land fraud to murder evidence when
    Gittes later discovers Cross's bifocals at Evelyn's home.
- description: Noah Cross maintains a façade of legitimacy and respectability while
    overseeing covert enforcement through his men, including Mulvihill, to intimidate
    and control opposition. He remains a key power broker in the water department
    and land development conflicts. Confidential communications and actions hint at
    his involvement in silencing threats to his plans.
  id: s_3
  key_delta: Cross's direct link to evidence of Mulwray's murder is established, deepening
    the implication of his personal involvement in eliminating obstacles to his plans.
  trigger_event: Mulvihill forces Gittes to lead Cross to Katherine's hiding place,
    setting up the Chinatown confrontation.
- description: Noah Cross faces open conflict as Gittes is arrested by the police
    acting under suspicion of complicity in the murder investigation. Cross asserts
    his influence and claims guardianship over Katherine, presenting himself as her
    grandfather to legitimize control over her. The tension culminates in a confrontation
    with Evelyn Mulwray, who shoots Cross in resistance to his authority and threats.
  id: s_4
  key_delta: Cross is physically wounded but retains custody of Katherine, while Evelyn
    Mulwray is fatally shot fleeing police fire. The power struggle over Katherine
    and control of the land and water interests reaches a violent climax.
  trigger_event: Police arrive at the Chinatown safe house where Katherine is hidden;
    Evelyn shoots Cross and attempts to flee with Katherine.
- description: After the fatal shooting of Evelyn Mulwray, Noah Cross holds Katherine,
    maintaining his claimed familial and authoritative role. The police release Jake
    Gittes and his associates, signaling a suppression of full justice. Escobar directs
    the crowd and quietly manages the aftermath, while the political and business
    status quo around water and land development remains largely intact, albeit marked
    by tragic losses and corruption.
  id: s_5
  key_delta: Cross retains control over Katherine and his plans proceed unimpeded;
    the corruption in water and land dealings remains entrenched, highlighting systemic
    impunity.
  trigger_event: Police release Gittes and associates and disperse the crime scene
    crowd, leaving Cross in possession of Katherine and the corrupt order intact.
