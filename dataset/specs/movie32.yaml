commitments:
- description: Tommy must be established as a core gangster crew member under Paulie
    with Henry joining before subsequent joint operations can occur, setting the baseline
    hierarchy.
  id: c_0
  satisfaction_condition: Progression has reached or passed s_0, confirming Tommy's
    role and Henry's entry into the crew.
  type: ordering
  violation_condition: Any narrative logic that allows joint crew actions or operations
    involving Tommy, Henry, and Jimmy before s_0 is completed.
- description: Tommy, Henry, and the crew successfully complete the Air France robbery
    as their first major heist, marking their debut into organized big-time crime.
  id: c_1
  satisfaction_condition: Node s_1 is reached and the Air France robbery is executed
    successfully involving Tommy.
  type: achievement
  violation_condition: The narrative contradicts the heist accomplishment or bypasses
    this milestone before progressing to later heist-related events.
- description: The crew lifestyle upgrade to high-profile gangster status (Copacabana
    nights) logically must follow after the Air France heist success.
  id: c_2
  satisfaction_condition: Node s_2 is reached only after node s_1, depicting nights
    at Copacabana after the heist.
  type: ordering
  violation_condition: Any depiction of the glamorous Copacabana lifestyle involving
    Tommy before the Air France heist is completed.
- description: Tommy is always an aggressive, violent enforcer with a hair-trigger
    temper throughout his involvement in the crew (s_0 to s_11).
  id: c_3
  satisfaction_condition: Throughout nodes s_0 to s_11, Tommy's behavior and decisions
    consistently reflect aggressive armed robbery and violent temper.
  type: invariant
  violation_condition: Any player action or narrative that contradicts Tommy’s established
    temperament or removes his aggressive enforcement role.
- description: Tommy’s brutal beating of Billy Batts and the ensuing cover-up must
    occur in strict sequence before the ideation and execution of further major crimes
    like drug trade expansions and Lufthansa heist.
  id: c_4
  satisfaction_condition: Node s_4 occurs before nodes s_5 through s_11, maintaining
    logical flow from offense, cover-up, to subsequent consequences.
  type: ordering
  violation_condition: Any narrative suggesting later crimes or crew tensions prior
    to the Billy Batts beating and murder cover-up.
- description: The murder of Billy Batts and its cover-up remain an unrevoked, core
    crime logically acknowledged by the gang throughout nodes s_4 to s_11.
  id: c_5
  satisfaction_condition: Throughout s_4 to s_11, the murder and disposal of Billy
    Batts’ body are intact and recognized as an outstanding threat.
  type: invariant
  violation_condition: Any system state or narrative where the murder is denied, ignored,
    or magically erased before Tommy’s death.
- description: The exhumation and relocation of Billy Batts’ corpse must occur after
    the initial burial and before the crew’s continued criminal operations progress.
  id: c_6
  satisfaction_condition: Node s_6 occurs sequentially after s_5, maintaining logical
    order of events regarding the corpse.
  type: ordering
  violation_condition: Any event implying the exhumation happens before the initial
    burial or after Tommy’s death.
- description: Henry and Jimmy’s out-of-Brooklyn collection work in Florida must
    logically follow the crew’s earlier consolidation and Billy Batts cover-up, while
    Tommy remains part of the broader crew but not this specific trip.
  id: c_7
  satisfaction_condition: Node s_7 follows completion of s_4 through s_6, preserving
    the later expansion of crew operations beyond Brooklyn without requiring Tommy's
    presence on the Florida collection trip.
  type: ordering
  violation_condition: The Florida collection trip occurs before the Billy Batts
    murder and cover-up arc is settled, or Tommy is incorrectly depicted as being
    physically present on that trip.
- description: Tommy remains free of arrest during the Florida job incident while
    many associates are arrested, increasing his exposure to law enforcement pressure.
  id: c_8
  satisfaction_condition: During and after s_8, Tommy is never incarcerated while
    others from the crew are imprisoned due to the FBI tipoff.
  type: invariant
  violation_condition: Player input or narrative states Tommy was arrested or jailed
    alongside others during or immediately following the Florida job.
- description: Tommy joins Henry and Jimmy post-prison release to participate in the
    drug trade and Lufthansa heist preparations.
  id: c_9
  satisfaction_condition: Node s_9 occurs only after s_8 and prison release events
    have taken place.
  type: ordering
  violation_condition: Tommy initiates drug trade or Lufthansa heist participation
    before crew members’ release from prison.
- description: Jimmy executes ruthlessly the murder of Lufthansa heist participants
    disobedient to his orders, causing heightened paranoia impacting Tommy.
  id: c_10
  satisfaction_condition: From s_10 onward, the crew recognizes consequences of disobedience
    including enforced murders as real threats to Tommy and others.
  type: invariant
  violation_condition: Any narrative state where the consequences of Jimmy’s ordered
    killings are negated or dismissed by Tommy or the system.
- description: Tommy’s death is an inevitable and concluding event due to his past
    offenses and misjudgment about becoming a made man.
  id: c_11
  satisfaction_condition: Node s_11 is reached with Tommy’s death as a narrative endpoint,
    removing him from active story progression.
  type: achievement
  violation_condition: Any attempt to prevent or bypass Tommy’s death, continuing
    his presence or influence in the crew after s_11.
