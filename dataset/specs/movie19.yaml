commitments:
- description: The discovery and reading of the Buckner diary (s_0) must precede the
    activation of the Buckner family zombie scenario (s_1), preventing premature supernatural
    threat acknowledgment.
  id: c_0
  satisfaction_condition: Node s_0 has been reached and the diary is discovered before
    node s_1 is triggered.
  type: ordering
  violation_condition: Scenario s_1 is triggered without prior diary discovery and
    reading in s_0.
- description: From s_0 until s_2, the group is influenced by technicians remotely
    administering mood-altering drugs that lower awareness and increase libido; no
    group member can logically resist or contradict this manipulation within this
    phase.
  id: c_1
  satisfaction_condition: Between s_0 and s_2, NPC behaviors reflect drug influence;
    player cannot invalidate presence of drug effects.
  type: invariant
  violation_condition: Player action or logic denies existence of drug manipulation
    or causes characters to have full awareness and behavior inconsistent with impairment
    before s_2.
- description: Jules and Curt’s outdoor sex scene and subsequent attack/killing by
    Buckner zombies (s_2) must occur before the group inside reacts and Marty discovers
    the hidden camera (s_3), ensuring proper cause-effect timing of tension escalation.
  id: c_2
  satisfaction_condition: Scene s_2 (attack and Jules' death) is completed before
    s_3 (Marty’s suspicion and camera discovery).
  type: ordering
  violation_condition: Player attempts to reveal camera or group suspicion before
    Jules and Curt’s scene and attack has logically occurred.
- description: Between s_3 and s_6, Marty’s paranoia due to marijuana and discovery
    of control environment must remain logically consistent with his immunity to the
    drugs and increased awareness of manipulation.
  id: c_3
  satisfaction_condition: From s_3 to s_6 player’s perception aligns with Marty being
    immune and more aware than other members.
  type: invariant
  violation_condition: Player ignores or negates Marty’s continued awareness or immunity
    inconsistent with marijuana habit before escaping or being assaulted.
- description: The environmental boundaries and dangers outside the cabin (forcefield
    and tunnel collapse) must be established before Curt’s death (s_4), ensuring the
    threat environment is credibly contained.
  id: c_4
  satisfaction_condition: Player encounters and acknowledges environmental barriers
    and attack attempts before Curt’s death occurs.
  type: ordering
  violation_condition: Curt’s death or escape attempt bypasses established environmental
    barriers prior to those barriers being revealed or triggered.
- description: Holden’s death inside the RV (s_5) and subsequent RV crash into the
    lake establish the group’s reduction and separation before Dana and Marty proceed
    alone.
  id: c_5
  satisfaction_condition: Holden’s death and RV sinking occur prior to further escape
    attempts by Dana and Marty.
  type: ordering
  violation_condition: Player tries to access or command escape routes or knowledge
    inconsistent with Holden’s death and RV crash before they happen.
- description: Marty’s survival and revelation of immunity to mood-altering drugs
    (s_6, s_7) must be triggered to provide the critical turning point for player
    agency and deeper facility access.
  id: c_6
  satisfaction_condition: Marty survives initial assaults and gains access to control
    box and underground levels.
  type: achievement
  violation_condition: Marty is killed or incapacitated before survival and immunity
    are established or the control box discovery occurs.
- description: The release of imprisoned monsters (s_8) must follow discovery of control
    stations and the understanding that cellar items determine which monsters are
    released, maintaining logical cause-effect sequence.
  id: c_7
  satisfaction_condition: Player activates control station to release monsters only
    after exploration and item-monster connections are made.
  type: ordering
  violation_condition: Monsters are released or rampage before discovery of the control
    station or item-monster relationships.
- description: Encounter with the Director and the explanation of the ritual structure
    (s_9, s_10) must occur only after facility is disrupted by monsters, supporting
    narrative escalation and exposition placement.
  id: c_8
  satisfaction_condition: Director’s encounter and ritual explanation happen after
    or concurrent with staff massacre caused by released monsters.
  type: ordering
  violation_condition: Director appears and explains ritual before monsters are released
    or facility disruption occurs.
- description: From the Director’s introduction to the ritual’s climax (s_10 to s_12),
    the archetypal roles of the sacrificed youths and specific ritual rules (order
    independence except Virgin last, Virgin’s death optional but suffering required)
    must persist invariantly.
  id: c_9
  satisfaction_condition: During s_10 to s_12, sacrifices conform to archetypes and
    ritual logic without contradiction or bypass.
  type: invariant
  violation_condition: Player actions or narrative events violate archetype assignments
    or ritual conditions (e.g., Virgin dies first without suffering, or ritual completed
    without necessary archetypal deaths).
- description: The Director’s death and Patience Buckner’s intervention (s_11), followed
    by Marty and Dana’s survival and alliance, must be achieved to unlock the final
    confrontation and awakening of the Ancient Ones.
  id: c_10
  satisfaction_condition: Director is killed by Patience and Marty survives to side
    with Dana, enabling final scene.
  type: achievement
  violation_condition: Director survives or Marty/Dana fail to form alliance or survive
    the fight before Ancient Ones awaken.
- description: The awakening of the Ancient Ones and the destruction of the facility
    (s_12) is the unavoidable concluding milestone, marking the narrative end state.
  id: c_11
  satisfaction_condition: Ancient One’s hand rises and destroys the facility and cabin,
    confirming ritual completion.
  type: achievement
  violation_condition: Narrative attempts to conclude or reach final state without
    the awakening and destruction event.
