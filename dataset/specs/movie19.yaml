meta:
  genres: ["Horror", "Comedy"]
  id: movie19
  player_role: Marty Mikalski
  title: "The Cabin in the Woods"
synopsis: Technicians Gary Sitterson and Steve Hadley prepare for an operation, one
  of several taking place around the world, while joking with fellow technician Wendy
  Lin. College students Dana Polk, Holden McCrea, Marty Mikalski, Jules Louden and
  her boyfriend Curt Vaughan go to a remote cabin in the woods for a vacation. The
  technicians control the environment the group are in from afar and give them mood-altering
  drugs to manipulate them into following a scenario. The drugs gradually reduce the
  group's intelligence and awareness, and also increase their libido. After entering
  the cellar, the group discovers a large assortment of items, including a diary by
  Patience Buckner, a girl abused by her sadistic family. Reciting an incantation
  from the diary, Dana inadvertently triggers the Buckner family scenario — a family
  of zombies who rise from their graves. Curt and Jules go outside to have sex, encouraged
  by more mood-altering drugs. The Buckners attack the lovers and kill Jules, but
  Curt flees to the cabin. Meanwhile, Marty, who frequently smokes marijuana, becomes
  paranoid and believes they are being manipulated. Curt informs the group of Jules'
  death. Discovering a hidden camera, Marty thinks that he is on a reality television
  show, but is attacked and dragged away by one of the Buckners. Holden, Dana, and
  Curt attempt to flee in their RV, but the technicians barely trigger a tunnel collapse
  to block their path. Curt attempts to jump a ravine to flee only to crash into an
  invisible forcefield and fall to his death. Realizing that something is unusual
  about the environment, Dana becomes convinced that Marty's worries about their being
  manipulated were correct. While driving back to the cabin, Holden is killed by a
  Buckner who has been hiding in the RV. The RV falls into the lake and Dana swims
  away, only to be attacked by a Buckner on the dock. The technicians celebrate the
  completion of the ritual, but a phone call informs them that Marty is still alive.
  Arriving at the dock, Marty saves Dana. Marty reveals that he dismembered his assailant
  after being dragged away, stumbled upon a hidden control box, and was able to access
  an underground elevator. The technicians realize that Marty is immune to their drugs
  because of his marijuana habit. Marty and Dana take the elevator down to the lower
  levels of the facility, passing a variety of imprisoned monsters. One of the monsters
  carries an item that Dana remembers seeing in the cabin's cellar, and she realizes
  that the items in the cellar determine which monster will be released. When Dana
  and Marty are cornered by a security team, Dana uses a control station to release
  the monsters, which massacre the facility staff. Hadley, Lin and Sitterson are killed
  in the carnage, while Dana and Marty flee into the lower levels of the facility.
  Discovering a temple adorned with large stone tablets, Dana and Marty meet the Director.
  They are informed that the ritual is to appease the "Ancient Ones" — beings who
  live beneath the facility and are kept in perpetual slumber through an annual, ritual
  sacrifice of five young people who embody certain archetypes——the Whore, the Athlete,
  the Scholar, the Fool, and the Virgin. The order in which they die does not matter,
  as long as the virgin is last, and her death is optional, as long as she suffers.
  Should the Ancient Ones awake, they will destroy the world. The Director reveals
  that rituals around the world have been taking place for the same purpose, but each
  of them failed. The Director urges Dana to kill Marty to complete the ritual. Dana
  draws a gun on Marty, but is attacked by a werewolf while the Director fights with
  Marty. Patience Buckner arrives and kills the Director before Marty pushes them
  both into the Ancient Ones' pit. Marty forgives Dana for threatening to shoot him.
  The pair accepts that it might be better for another species to take humanity's
  place if this is the price of its continued existence. Marty and Dana light a joint
  and hold hands as the gigantic hand of an Ancient One rises up, destroying the facility
  and the cabin.
trajectory:
- description: Marty Mikalski arrives at a remote cabin in the woods with college
    friends Dana, Holden, Jules, and Curt for a vacation. The group is jovial and
    relaxed, unaware that technicians are remotely monitoring and controlling their
    environment.
  id: s_0
  key_delta: The discovery of the Buckner diary introduces the element of an abusive
    family history and sets up the context for the subsequent ritual scenario.
  trigger_event: Group members enter the cellar of the cabin and discover a diary
    belonging to Patience Buckner.
- description: The group is gathered in the cellar reading the diary. The environment
    remains seemingly ordinary but gradually feels increasingly oppressive.
  id: s_1
  key_delta: The recitation triggers the activation of the Buckner family zombie scenario,
    initiating the supernatural threat around the cabin.
  trigger_event: Dana recites an incantation from the Buckner diary.
- description: Jules and Curt leave the cabin to be alone outside, with the rest of
    the group inside. The technicians increase mood-altering drug dosages influencing
    the group's behavior.
  id: s_2
  key_delta: The Buckner zombies attack the outdoor couple, resulting in Jules' death
    and Curt fleeing back to the cabin.
  trigger_event: Curt and Jules begin to have sex outside as encouraged by the drug
    effects.
- description: The surviving group members inside the cabin react to Jules' death,
    with heightened tension and suspicion, especially from Marty due to his paranoia
    induced by marijuana.
  id: s_3
  key_delta: Marty suspects they are part of a reality television show and becomes
    more aware of manipulation attempts.
  trigger_event: Marty discovers a hidden camera in the cabin.
- description: The group prepares to escape the cabin by RV while the Buckner zombies
    attack again. The environment outside becomes dangerous and unpredictable.
  id: s_4
  key_delta: Curt’s death confirms the existence of an impenetrable boundary around
    the environment, heightening the threat level.
  trigger_event: Curt attempts to flee via ravine jump but crashes into an invisible
    forcefield and dies.
- description: Dana, Holden and Marty are left inside the cabin and attempt to escape
    using the RV.
  id: s_5
  key_delta: Holden’s death narrows the group further and forces Dana and Marty to
    survive on their own; the RV is destroyed.
  trigger_event: Holden is killed by a hidden Buckner zombie inside the RV, which
    then crashes into a lake.
- description: Dana swims to the dock after the RV accident and is attacked by a Buckner
    zombie; Marty arrives to save her.
  id: s_6
  key_delta: Marty’s survival and intervention reveal he is immune to the drugs and
    aware of the manipulation, changing the dynamics of the scenario.
  trigger_event: Marty arrives at the dock and rescues Dana from the attacking Buckner.
- description: Marty reveals he dismembered his assailant and found a hidden control
    box that operates an underground elevator inside the facility.
  id: s_7
  key_delta: Discovery of the facility’s underground areas exposes the deeper layers
    of the environment and the monsters contained within.
  trigger_event: Marty and Dana ride the hidden elevator down into the facility's
    monster level.
- description: Marty and Dana descend into lower facility levels and observe imprisoned
    monsters, making connections to items found earlier in the cabin’s cellar.
  id: s_8
  key_delta: The monsters are unleashed, leading to a massacre of the facility staff
    and disrupting the technicians’ control.
  trigger_event: Dana uses a control station to release the imprisoned monsters.
- description: Following the monster uprising, Marty and Dana flee deeper into the
    lower levels of the facility.
  id: s_9
  key_delta: Meeting the Director reveals the true purpose of the ritual and the mythos
    of the Ancient Ones beneath the facility.
  trigger_event: They discover a temple area adorned with large stone tablets and
    encounter the Director.
- description: 'The Director explains the ritual’s nature: annual sacrifices to appease
    the Ancient Ones, requiring five archetypal youths, with the Virgin’s death being
    optional.'
  id: s_10
  key_delta: Dana is forced to choose between killing Marty and failing the ritual,
    placing both of them in immediate danger.
  trigger_event: The Director urges Dana to kill Marty to complete the ritual.
- description: Dana aims a gun at Marty, both are suddenly attacked by a werewolf
    and the Director.
  id: s_11
  key_delta: The Director’s death and Patience’s intervention shift control and hint
    at rebellion against the ritual’s enforcement.
  trigger_event: Patience Buckner arrives and kills the Director amid the struggle.
- description: Marty pushes Patience Buckner and the Director into the pit containing
    the Ancient Ones.
  id: s_12
  key_delta: The Ancient Ones awaken and begin destroying the facility and the cabin,
    signaling possible doom or transformation for humanity.
  trigger_event: Marty and Dana hold hands as the gigantic hand of an Ancient One
    rises from the pit.
