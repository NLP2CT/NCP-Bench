meta:
  genres: ["Action", "Drama"]
  id: movie87
  player_role: Katsumoto
  title: "The Last Samurai"
synopsis: In 1876, Captain Nathan Algren is traumatized by massacring Native Americans
  in the Indian Wars and has become an alcoholic to stave off the memories. Algren
  is approached by former colleague Zebulon Gant, who takes him to meet Algren's former
  Colonel Bagley, whom Algren despises for ordering the massacre. On behalf of businessman
  Mr. Omura, Bagley offers Algren a job training conscripts of the new Meiji government
  of Japan to suppress a samurai rebellion that is opposed to Western influence, led
  by Katsumoto. Despite struggling with the painful memories of having already crushed
  a tribal rebellion, Algren accepts solely for payment. In Japan he keeps a journal
  and is accompanied by British translator Simon Graham. Despite Algren's objections,
  Omura has Bagley order the peasant conscripts to fight early and they are routed
  when engaging the samurai. Gant is killed and Algren is captured after killing leading
  samurai warrior Hirotaro. Katsumoto is reminded of a vision of a tiger while watching
  Algren fight with a tiger-embroidered spear and orders his capture. Taken to the
  samurai village, Algren is treated by Hirotaro's widow Taka and Katsumoto's son,
  Nobutada and recovers from his trauma. He begins to converse with Katsumoto, study
  swordsmanship under warrior Ujio and apologizes to Taka for Hirotaro's death which
  she accepts because of the honor of battle. Growing closer to her and her children,
  he later helps defend the village from a night attack by Omura's ninja. In spring,
  Algren is taken back to Tokyo as promised. The Imperial Japanese army have become
  better organized with American equipment and Omura offers Algren command if he reveals
  information on the rebels. Algren declines, so privately Omura orders his death.
  Katsumoto offers his counsel to the young Emperor, but finds the Emperor's control
  is weak. When Katsumoto refuses to obey the new law to not display swords, he is
  arrested. Algren frees Katsumoto with the assistance of Ujio, Nobutada and Graham.
  Nobutada is severely wounded as they escape, sacrificing himself to slow the guards.
  Katsumoto mourns, but receives word that a large Imperial Army group led by Omura
  and Bagley will engage them. Five hundred samurai are rallied as Algren references
  the Battle of Thermopylae. On the eve of battle, Algren is presented with a katana,
  kisses Taka and wears Hirotaro's red armor as a symbol of respect to her. In battle,
  the samurai fall back, preventing the Imperial army from using their full firepower.
  As they expect, Omura orders the infantry to advance, straight into their fire trap.
  The samurai then unleash a rain of arrows as a wave of swordsmen, including Katsumoto
  and Algren, attack. A second Imperial infantry wave advances, only to be countered
  by Ujio's samurai cavalry; a savage melee ensues, leaving many dead on both sides
  before the Imperial forces retreat. Realizing that fresh Imperial forces are coming,
  the samurai resolve to fight to the death in a final charge. Algren hurls his sword
  at Bagley, fatally wounding his nemesis, but the samurai are finally cut down by
  Gatling guns. Moved by the sight of his dying countrymen, the Imperial captain stops
  the fire, defying Omura's orders. Katsumoto, observing Bushido, asks Algren to assist
  in his seppuku. Katsumoto dies and the Imperial soldiers kneel and bow around the
  fallen samurai. Later, the American ambassador prepares to have the Emperor sign
  a treaty but an injured Algren enters and interrupts the proceedings, offering Katsumoto's
  sword to the Emperor who comes to realize that while Japan must modernize, it must
  chart its own path and never forget its own history and traditions. The Emperor
  dismisses the American ambassador and confiscates Omura's fortunes to be given to
  the people. Graham, who was given Algren's journal to help write a book, states
  that Algren found peace by returning to Taka and the village.
trajectory:
- description: In 1876 Japan, Katsumoto leads a samurai rebellion opposing the Meiji
    government's Westernization and disarmament policies. The atmosphere is tense,
    with the samurai village resolved to protect their traditions amidst increasing
    pressure from the modernizing forces.
  id: s_0
  key_delta: Introduction of a key foreign antagonist, Captain Algren, and the escalation
    of conflict between the samurai and the modern Imperial government.
  trigger_event: The samurai village receives news that the Meiji government has recruited
    Captain Nathan Algren, a Western military advisor, to train conscripts against
    the rebellion.
- description: Captain Algren arrives and fights in an initial skirmish where the
    peasant conscripts trained by him are routed by samurai forces. Katsumoto observes
    Algren’s combat skill and the conscripts' defeat.
  id: s_1
  key_delta: Algren is captured, shifting the power dynamic by placing the Western-trained
    soldier in the samurai’s custody.
  trigger_event: Algren's conscripts engage the samurai in battle and are defeated,
    resulting in the death of Zebulon Gant and the capture of Algren.
- description: Algren is brought to the samurai village, treated by Taka and Katsumoto’s
    son Nobutada, and begins recovering from his wounds and trauma. Katsumoto watches
    Algren closely, intrigued by his presence and fighting style.
  id: s_2
  key_delta: Algren becomes a guest within the samurai community, initiating direct
    interaction and cultural exchange.
  trigger_event: Algren awakens and is cared for by Taka and Nobutada within the village
    under Katsumoto’s watch.
- description: Within the village, Algren starts to learn samurai culture and swordsmanship
    under Ujio, while developing closer relationships with Taka and Katsumoto’s family.
    The village atmosphere shifts towards cautious acceptance of Algren.
  id: s_3
  key_delta: Algren’s attitude and skills begin to shift, incorporating samurai traditions
    and values.
  trigger_event: Algren begins training in swordsmanship with Ujio and engaging in
    conversations with Katsumoto.
- description: The samurai village repels a surprise night attack by Omura’s ninja.
    The defenders, including Algren, demonstrate increased readiness and resolve to
    protect their home.
  id: s_4
  key_delta: The village’s defenses and morale are strengthened; Algren firmly integrates
    as a warrior ally.
  trigger_event: Omura’s ninja launch a nighttime raid on the village, which is successfully
    defended by the samurai and Algren.
- description: Algren is taken back to Tokyo as promised. The imperial army, now better
    equipped, prepares to attack the samurai. Omura offers Algren command if he betrays
    the rebels, but Algren declines.
  id: s_5
  key_delta: Algren rejects collaboration with Omura’s faction, solidifying his loyalty
    to the samurai rebellion.
  trigger_event: Algren meets with Omura in Tokyo and refuses to betray the samurai
    cause despite the offer of command.
- description: Katsumoto is arrested for defying the new law banning swords. Algren
    orchestrates Katsumoto’s daring rescue with the help of Ujio, Nobutada, and Simon
    Graham.
  id: s_6
  key_delta: Katsumoto is freed and the samurai rebellion reasserts active resistance.
  trigger_event: Imperial guards arrest Katsumoto; Algren and allies launch a rescue
    operation.
- description: During the escape from arrest, Nobutada is severely wounded and sacrifices
    himself to protect the group. Katsumoto mourns but prepares for the impending
    battle against Omura and Bagley’s forces.
  id: s_7
  key_delta: Loss of Nobutada deepens the personal stakes for Katsumoto and the samurai.
  trigger_event: Nobutada is fatally wounded while helping the group evade capture.
- description: Katsumoto rallies five hundred samurai to hold a last stand against
    the approaching Imperial army. The samurai prepare their defenses, with Algren
    donning Hirotaro's red armor as a symbol of respect.
  id: s_8
  key_delta: Mobilization of samurai forces and symbolization of Algren’s full integration
    into their cause.
  trigger_event: The gathering and preparation for battle; Algren is presented with
    a katana and dons the red armor.
- description: In the battle, samurai tactics effectively blunt the Imperial army’s
    firepower, using a trap and melees to inflict heavy casualties. However, the arrival
    of fresh Imperial reinforcements escalates the fight into a final, desperate charge.
  id: s_9
  key_delta: High casualties on both sides; samurai showcase effective resistance
    but face overwhelming odds.
  trigger_event: The samurai engage in battle with the Imperial army, triggering multiple
    waves of attack.
- description: Algren fatally wounds Colonel Bagley in combat, avenging past grievances.
    Despite their valor, the samurai are ultimately cut down by Gatling guns. The
    Imperial captain defies orders and halts the firing.
  id: s_10
  key_delta: Death of Bagley; display of respect from enemy forces; marks the nearing
    end of the samurai resistance.
  trigger_event: Algren kills Bagley; the Gatling gun attack ends when the Imperial
    captain orders a ceasefire.
- description: Katsumoto commits seppuku with Algren’s assistance as per Bushido code.
    The surviving Imperial soldiers kneel and pay respects, symbolizing the samurai’s
    dignity in defeat.
  id: s_11
  key_delta: Honor maintained through ritual suicide; marks the symbolic closure of
    the samurai rebellion.
  trigger_event: Katsumoto performs seppuku; Imperial soldiers witness and honor the
    ritual.
- description: At the treaty signing ceremony, Algren interrupts and offers Katsumoto's
    sword to the Emperor, advocating respect for Japan’s traditions alongside modernization.
    The Emperor dismisses the American ambassador and seizes Omura’s assets for the
    people.
  id: s_12
  key_delta: Emperor receives a new vision balancing tradition and progress; a political
    shift marginalizing Omura’s influence.
  trigger_event: The Emperor rejects the treaty path, turns on Omura, and opens the
    way for peace after seeing Katsumoto's sword.
- description: Peace is restored to the samurai village. Algren returns to Taka and
    the community. Simon Graham begins documenting Algren’s journal, sharing the story
    of his transformation and peace.
  id: s_13
  key_delta: Closure of the story with Algren’s personal peace and the preservation
    of samurai legacy through documentation.
  trigger_event: Algren returns to the village; Graham starts composing the written
    account.
