commitments:
- description: Ensure that Algren’s arrival and initial engagement with samurai (s_1)
    must occur after the introduction of Katsumoto’s samurai rebellion and the recruitment
    of Algren (s_0) to maintain logical conflict escalation.
  id: c_0
  satisfaction_condition: Node s_0 has been triggered before node s_1.
  type: ordering
  violation_condition: Node s_1 occurs before node s_0, e.g., Algren fights samurai
    before the rebellion and recruitment are established.
- description: Capture of Algren by the samurai (s_1) must precede his cultural integration
    and recovery in the village (s_2, s_3) to guard against premature acceptance or
    alliance.
  id: c_1
  satisfaction_condition: Algren is captured by the samurai (s_1) before any village
    integration events (s_2, s_3) trigger.
  type: ordering
  violation_condition: Algren demonstrates samurai cultural assimilation or close
    relations (s_2, s_3) before being captured.
- description: Between s_2 and s_5, Algren must remain physically and politically
    inside the samurai sphere, preventing premature betrayal or collaboration with
    Omura’s forces.
  id: c_2
  satisfaction_condition: From s_2 until s_5, Algren consistently acts as a guest
    or ally to the samurai, does not accept or plot with Omura to betray them.
  type: invariant
  violation_condition: Algren accepts Omura’s offer or betrays the samurai before
    returning to Tokyo and rejecting the command offer (before s_5).
- description: Algren’s refusal to betray the rebels (s_5) is a pivotal milestone
    that must be reached to confirm his loyalty shift towards the samurai.
  id: c_3
  satisfaction_condition: At node s_5, Algren clearly declines Omura’s command offer
    to betray the samurai rebellion.
  type: achievement
  violation_condition: Algren accepts Omura’s offer to betray the samurai, changing
    fundamental alliance and breaking narrative loyalty.
- description: Katsumoto’s arrest for defying sword ban (s_6) must happen before his
    rescue by Algren and allies, ensuring proper cause and effect for the outlaw status
    of samurai.
  id: c_4
  satisfaction_condition: Node s_6 (arrest) occurs before the rescue operation (still
    part of s_6).
  type: ordering
  violation_condition: Rescue attempts happen before Katsumoto’s arrest is triggered.
- description: After Katsumoto’s rescue (s_6), the samurai rebellion must be actively
    reasserted in resistance against the Meiji government up to the final battle (s_8
    to s_10).
  id: c_5
  satisfaction_condition: Between s_6 and s_10, samurai forces prepare and engage
    in active armed resistance against Imperial forces.
  type: invariant
  violation_condition: Rebellion dissolves or surrenders prematurely before the last
    stand and battle take place.
- description: Nobutada’s sacrifice and injury (s_7) must be acknowledged to deeply
    affect Katsumoto and motivate the samurai’s final preparations.
  id: c_6
  satisfaction_condition: Node s_7 is triggered with Nobutada’s fatal wounding and
    Katsumoto’s mourning.
  type: achievement
  violation_condition: Nobutada survives or is absent at s_7, removing key emotional
    stakes for Katsumoto.
- description: The rallying and symbolic empowerment of Algren and samurai before
    the battle (s_8) must precede the unfolding large-scale battle (s_9) to maintain
    narrative buildup.
  id: c_7
  satisfaction_condition: Node s_8 happens before node s_9.
  type: ordering
  violation_condition: Battle events (s_9) unfold before the samurai rally and Algren’s
    acceptance of role (s_8).
- description: During the battle (s_9 to s_10), samurai forces must demonstrate tactical
    resistance and inflict casualties but ultimately suffer fatal losses due to overwhelming
    modern weaponry.
  id: c_8
  satisfaction_condition: Combat events portray successful samurai resistance initially
    but end in heavy casualties and defeat by Gatling guns.
  type: invariant
  violation_condition: Samurai win outright or are annihilated without resistance;
    or modern weapons are avoided or irrelevant.
- description: The killing of Bagley by Algren (s_10) is a narrative milestone confirming
    personal vengeance and culmination of past conflicts.
  id: c_9
  satisfaction_condition: Bagley is fatally wounded by Algren during battle (node
    s_10).
  type: achievement
  violation_condition: Bagley survives or is killed by others before or after this
    key event.
- description: Katsumoto’s seppuku ritual (s_11) must be enacted to uphold Bushido
    honor and symbolize the samurai’s death with dignity.
  id: c_10
  satisfaction_condition: Node s_11 occurs with Katsumoto performing seppuku assisted
    by Algren, witnessed respectfully by Imperial soldiers.
  type: achievement
  violation_condition: Katsumoto dies by other means or the ritual is omitted or dishonored.
- description: The symbolic political shift initiated by Algren at the treaty ceremony
    (s_12) must follow Katsumoto’s death to show legacy and changing ideology.
  id: c_11
  satisfaction_condition: Node s_11 (seppuku) occurs before node s_12 (treaty intervention).
  type: ordering
  violation_condition: Algren interferes with treaty signing before Katsumoto’s death.
- description: Algren’s offering of Katsumoto’s sword to the Emperor (s_12) must occur,
    marking the reconciliation of tradition and modernization.
  id: c_12
  satisfaction_condition: Algren presents Katsumoto’s sword to the Emperor at the
    treaty event in s_12.
  type: achievement
  violation_condition: Sword offering is skipped or replaced; Emperor does not reconsider
    balance of tradition and reform.
- description: The story must conclude with peace restored to the samurai village
    and Algren finding personal peace visiting Taka, preserving the legacy through
    Graham’s documentation (s_13).
  id: c_13
  satisfaction_condition: Node s_13 is triggered; Algren returns to the village and
    Graham begins chronicling the journal.
  type: achievement
  violation_condition: Algren does not return or Graham’s documentation does not commence;
    unresolved conflict persists.
