commitments:
- description: Donnie must be introduced to Frank and receive the apocalyptic prophecy
    before any related events regarding the altered perception of reality or actions
    under Frank's influence can occur.
  id: c_0
  satisfaction_condition: Node s_0 (Donnie's awakening and meeting Frank with prophecy)
    has been reached before any subsequent events referencing Frank's instructions
    or the prophecy.
  type: ordering
  violation_condition: Player behavior or dialogue leads to acknowledgment of Frank's
    prophecy or influence prior to s_0 occurrence.
- description: From s_0 to s_19, Donnie's visions of Frank are consistently treated
    as either hallucinations or supernatural phenomena within his subjective experience;
    the system must never acknowledge these as objectively real to other characters
    before the time loop is closed.
  id: c_1
  satisfaction_condition: Up to s_19, NPCs do not affirm Frank’s existence as independently
    real; only Donnie's hallucinations or visions acknowledged by psychotherapist
    and implied by events.
  type: invariant
  violation_condition: Any game state where NPCs (other than Donnie) confirm Frank’s
    physical reality during the timeline before s_19.
- description: Donnie's knowledge of time travel as a concept must only be made accessible
    after Frank introduces the topic and he consults Dr. Monnitoff leading to receiving
    the Philosophy of Time Travel book (s_6).
  id: c_2
  satisfaction_condition: Donnie gains time travel knowledge only at or after s_6.
  type: ordering
  violation_condition: Player obtains or discusses time travel knowledge with relevant
    understanding before node s_6 triggers.
- description: Donnie's psychotic diagnosis and the framing of Frank as hallucination
    must remain unrebutted and uncontested prior to the time loop reset at s_19, preserving
    the ambiguity between mental illness and supernatural influence.
  id: c_3
  satisfaction_condition: From s_7 through s_19, Dr. Thurman’s diagnosis and portrayal
    of Frank as hallucination is the only official medical explanation accepted within
    the narrative.
  type: invariant
  violation_condition: Any state where this diagnosis is officially overturned or
    disproven explicitly by characters or system prior to s_19.
- description: The sequence of destructive acts under Frank’s instructions (flooding
    school s_3, burning Cunningham’s house s_9) must occur in the order presented;
    the latter cannot precede the former.
  id: c_4
  satisfaction_condition: Node s_3 completes before s_9 activation; flooding precedes
    arson in narrative progression.
  type: ordering
  violation_condition: Player triggers or system acknowledges the arson event before
    the flooding event occurs.
- description: Gretchen’s death and its cause by the vehicle driven by Elizabeth’s
    boyfriend Frank must be preserved as a fundamental causal event within node s_15
    and s_16; it cannot be negated or reassigned.
  id: c_5
  satisfaction_condition: At s_15 and s_16, Gretchen’s death is directly caused by
    Elizabeth’s boyfriend Frank in the rabbit costume while avoiding the robbers.
  type: invariant
  violation_condition: Any narrative alteration where Gretchen survives or is killed
    by another cause inconsistent with s_15 and s_16 events.
- description: By narrative end, Donnie’s death by the jet engine falling through
    his bedroom ceiling (s_19) must be triggered to close the time loop and reset
    the 28-day altered timeline.
  id: c_6
  satisfaction_condition: At node s_19, Donnie dies from the jet engine crash, completing
    the temporal loop and ending altered timeline events.
  type: achievement
  violation_condition: Player actions or narrative deviations that prevent Donnie’s
    death by the jet engine at s_19 or cause an alternative ending.
- description: The reverse recapitulation of the 28 days and progression toward Donnie’s
    death (s_18 to s_19) must strictly follow the presentation sequence to preserve
    logical causality of the time loop closure.
  id: c_7
  satisfaction_condition: After s_17, events recapitulate backward as described in
    s_18, leading directly to s_19 without skipping or reordering.
  type: ordering
  violation_condition: Any reordering or premature jumping to s_19 without the consistent
    reverse event sequence stated in s_18.
- description: Donnie’s social and romantic relationship with Gretchen must be established
    before her death event, maintaining its emotional and narrative weight.
  id: c_8
  satisfaction_condition: By s_4 and continuing through s_14, Donnie and Gretchen
    have formed a dating relationship and shared significant interaction.
  type: invariant
  violation_condition: Gretchen’s death occurs without prior establishment of the
    relationship or its acknowledgement.
- description: During the period from s_0 to s_19, the jet engine crash at Donnie’s
    bedroom remains an unexplained and mysterious disaster, only logically explained
    by the temporal loop resolution at s_19.
  id: c_9
  satisfaction_condition: Between s_1 and s_19, all character responses treat the
    crash as unexplained, with no prior definitive causality revealed until time loop
    closure.
  type: invariant
  violation_condition: Prior to s_19, players or NPCs reveal or confirm the jet engine’s
    causal origin outside the final time loop event.
- description: Throughout the timeline from s_0 to s_19, Donnie’s actions influenced
    by Frank must consistently lead to escalating conflict or consequence, preventing
    premature neutralization of Frank’s influence.
  id: c_10
  satisfaction_condition: Donnie’s behaviors from s_3 through s_16 reflect ongoing
    destructive or disruptive acts under Frank’s instruction.
  type: invariant
  violation_condition: Player negates or circumvents Frank’s influence leading to
    absence of these critical escalating actions prior to s_17.
