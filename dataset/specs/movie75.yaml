meta:
  genres: ["Sci-Fi", "Drama"]
  id: movie75
  player_role: Donnie Darko
  title: "Donnie Darko"
synopsis: On October 2, 1988, Donnie Darko, a troubled teenager living in Middlesex,
  Virginia, is awakened and led outside by a figure in a monstrous rabbit costume,
  who introduces himself as "Frank" and tells him the world will end in 28 days, 6
  hours, 42 minutes and 12 seconds. At dawn, Donnie awakens on a golf course and returns
  home to find a jet engine has crashed into his bedroom. His older sister, Elizabeth,
  informs him the FAA investigators don't know where it came from. Donnie tells his
  psychotherapist Dr. Thurman about his continuing visits from Frank. Acting under
  Frank's influence, he floods his school by damaging a water main. He also begins
  dating new student Gretchen Ross, who has moved to town with her mother under a
  new identity to escape her violent stepfather. Conservative gym teacher Kitty Farmer
  blames the flooding on the influence of the short story "The Destructors", assigned
  by English teacher Karen Pomeroy, and begins teaching attitude lessons taken from
  motivational speaker Jim Cunningham. Donnie rebels against these lessons, leading
  to friction between Kitty and Donnie's mother Rose. Donnie asks his science teacher
  Dr. Monnitoff about time travel after Frank brings up the topic, and is given the
  book The Philosophy of Time Travel, written by Roberta Sparrow, a former science
  teacher at the school who is now a seemingly senile old woman. Dr. Thurman tells
  Donnie's parents that he is detached from reality, and that his visions of Frank
  are hallucinations, symptomatic of paranoid schizophrenia. Donnie disrupts a speech
  being given by Jim Cunningham by insulting him in front of the student body, then
  burns down Cunningham's house on instructions from Frank. When police find evidence
  of a child pornography operation in the house's remains, Cunningham is arrested.
  During a hypnotherapy session, Donnie confesses his crimes to Dr. Thurman and says
  that Frank will soon kill someone. Rose agrees to replace Kitty as chaperone for
  her daughter Samantha's dance troupe in Los Angeles, so Kitty can testify in Cunningham's
  defense; with her husband Eddie in New York on business, her older children are
  home alone. Donnie and Elizabeth take the opportunity to throw a Halloween party
  to celebrate her acceptance to Harvard University. Gretchen arrives, distraught
  that her mother has disappeared. Realizing that only hours remain before Frank's
  prophesied end of the world, Donnie takes Gretchen and two friends to seek Roberta
  Sparrow at her house. They are attacked by two school bullies who are attempting
  to rob Sparrow's house, and the fight spills into the street. An oncoming car swerves
  to avoid Sparrow but runs over Gretchen, killing her. The driver is Elizabeth's
  boyfriend Frank, wearing the same rabbit costume as the Frank of Donnie's visions.
  Donnie shoots him with his father's gun. As a vortex forms in dark clouds above
  his house, Donnie drives into the hills and watches as an airplane descends above.
  The plane, carrying Rose and the dance troupe, is wrenched violently as one of its
  engines detaches and falls into the vortex. Events of the previous 28 days recapitulate
  in reverse order and action, until Donnie finds himself in bed on the morning of
  October 2. The jet engine crashes through his room, killing him. Others with whom
  Donnie had interacted in the 28 days awaken, some looking disturbed. Gretchen rides
  by Donnie's house and learns of his death from a neighbourhood boy, but says she
  did not know him.
trajectory:
- description: It is the early morning of October 2, 1988, in Middlesex, Virginia.
    Donnie Darko is asleep in his bedroom. The atmosphere is quiet and normal with
    no visible disturbances.
  id: s_0
  key_delta: Donnie has been introduced to Frank and has received a specific apocalyptic
    prophecy, marking the start of his altered perception of reality.
  trigger_event: Donnie is awakened and led outside by a figure in a monstrous rabbit
    costume who tells him the world will end in 28 days, 6 hours, 42 minutes, and
    12 seconds.
- description: Donnie awakens at dawn on a golf course, disoriented. The early morning
    air is crisp, and the environment is calm and serene.
  id: s_1
  key_delta: Donnie learns of a bizarre, unexplained physical disaster endangering
    his personal space and life.
  trigger_event: Donnie returns home to find a jet engine has crashed through his
    bedroom ceiling.
- description: At home, Donnie discusses the event with his sister Elizabeth, who
    shares that FAA investigators are baffled by the origin of the engine. The household
    is tense but controlled.
  id: s_2
  key_delta: Donnie openly shares paranormal experiences for the first time, introducing
    a psychological dimension to his condition.
  trigger_event: Donnie tells his psychotherapist Dr. Thurman about his continuing
    visits from Frank.
- description: At school and home, tension is present but normal social routines continue.
    Donnie's behavior remains observed but typical.
  id: s_3
  key_delta: Donnie's actions become destructive and noticeable, escalating conflict
    with authority and peers.
  trigger_event: Under Frank’s influence, Donnie floods the school by damaging the
    water main.
- description: Donnie starts building a relationship with a new student, Gretchen
    Ross, who is secretive and troubled. The school environment is ongoing with social
    dynamics evolving.
  id: s_4
  key_delta: Donnie forms a significant social bond that will affect future events.
  trigger_event: Donnie begins dating Gretchen, learning about her troubled background.
- description: Tensions rise in school as conservative gym teacher Kitty Farmer blames
    the flooding on the short story 'The Destructors' and initiates motivational attitude
    lessons. Donnie’s family and school environment feel strained.
  id: s_5
  key_delta: Social and familial conflicts intensify, highlighting ideological divides.
  trigger_event: Donnie rebels against Kitty's lessons, causing friction with Kitty
    and his mother Rose.
- description: Donnie, now curious about time travel, converses with his science teacher
    Dr. Monnitoff. The school atmosphere retains normalcy, though Donnie’s inquiries
    signal deeper intellectual engagement.
  id: s_6
  key_delta: Donnie acquires new knowledge that expands his worldview about time and
    reality.
  trigger_event: Donnie receives the book The Philosophy of Time Travel from advice
    of Dr. Monnitoff after Frank mentions the topic.
- description: Donnie's mental health is under scrutiny. Dr. Thurman informs his parents
    that Donnie's visions of Frank are hallucinations indicating paranoid schizophrenia.
    The family environment becomes somber.
  id: s_7
  key_delta: Donnie’s psychological state is formally recognized and medicalized.
  trigger_event: Dr. Thurman meets with Donnie’s parents to discuss his diagnosis
    and hallucinations.
- description: At a school assembly, motivational speaker Jim Cunningham addresses
    the students. The atmosphere is charged with his message promoting conformity.
  id: s_8
  key_delta: Donnie openly opposes authority figures, increasing his social alienation.
  trigger_event: Donnie disrupts Cunningham’s speech by insulting him publicly.
- description: In the aftermath, Cunningham’s house undergoes suspicious fire damage.
    The surrounding community buzzes with rumors.
  id: s_9
  key_delta: A destructive act leads to the exposure of criminal evidence and Cunningham’s
    arrest.
  trigger_event: Donnie burns down Cunningham's house following instructions from
    Frank.
- description: Donnie is under hypnotherapy, a strained family environment continues.
    Parents and therapists engage in his care.
  id: s_10
  key_delta: Donnie reveals guilt and foresees impending violence, heightening concern.
  trigger_event: During hypnotherapy, Donnie confesses to his crimes and predicts
    Frank will kill someone soon.
- description: Donnie’s mother Rose agrees to chaperone a dance troupe in Los Angeles
    so that Kitty Farmer can testify in Cunningham's defense. The children remain
    home alone.
  id: s_11
  key_delta: Parental supervision is reduced, creating an opportunity for unsupervised
    events at home.
  trigger_event: With Rose away and the house unsupervised, Donnie and Elizabeth
    decide to turn the night into a Halloween party.
- description: Donnie and his sister Elizabeth prepare to host a Halloween party to
    celebrate Elizabeth’s acceptance to Harvard. The neighborhood is festive and busy.
  id: s_12
  key_delta: A social event is set, potentially escalating interpersonal dynamics.
  trigger_event: Gretchen arrives at the party shaken by her mother's disappearance
    and pulls Donnie into her crisis.
- description: Gretchen arrives at the party, visibly upset because her mother has
    disappeared. The party atmosphere contrasts with her distress.
  id: s_13
  key_delta: Gretchen's family emergency pulls Donnie, Gretchen, and their friends
    out of the party and into an urgent nighttime search toward Roberta Sparrow's
    house.
  trigger_event: Gretchen reveals her mother’s disappearance at the party.
- description: With only hours left before the prophesied end of the world, Donnie,
    Gretchen, and two friends seek out Roberta Sparrow at her house. The neighborhood
    is quiet and tense.
  id: s_14
  key_delta: Violent confrontation escalates danger around Donnie’s immediate circle.
  trigger_event: The group is attacked by two school bullies attempting to rob Sparrow’s
    house.
- description: The fight spills into the street. Traffic is present, the atmosphere
    chaotic and dangerous in the dark.
  id: s_15
  key_delta: Gretchen is killed in a traffic accident caused indirectly by the scuffle,
    introducing tragic loss.
  trigger_event: An oncoming car swerves to avoid Sparrow but hits and kills Gretchen.
- description: Donnie recognizes the driver as Elizabeth’s boyfriend Frank, wearing
    the same rabbit costume as his visions. The atmosphere is surreal and tense.
  id: s_16
  key_delta: Frank, a pivotal figure in Donnie’s visions, is killed, resolving a threat
    but escalating the crisis.
  trigger_event: Donnie shoots Frank with his father’s gun.
- description: Dark clouds form a vortex above Donnie’s house. Tension and surrealism
    dominate the environment as an approaching airplane is visible.
  id: s_17
  key_delta: A cosmic event aligns with the vortex and falling engine, physically
    linking to prior disasters.
  trigger_event: Donnie drives into the hills and watches an airplane descend with
    an engine detaching and falling into the vortex.
- description: The vortex pulls events of the previous 28 days into a reverse sequence.
    The environment is unstable and other characters experience confused awakenings.
  id: s_18
  key_delta: Time reversal begins, undoing prior actions and resetting causal sequences.
  trigger_event: Events of the past 28 days recapitulate backward until Donnie finds
    himself in bed on the morning of October 2.
- description: Donnie is in his bedroom on the morning of October 2, in the calm before
    the strange events repeat.
  id: s_19
  key_delta: Donnie’s death occurs, closing the temporal loop of the 28 days and ending
    his altered experience.
  trigger_event: The jet engine crashes through Donnie’s bedroom, killing him instantly.
- description: Neighbors and characters connected to Donnie awaken disturbed by the
    unexplained events. Gretchen passes by Donnie’s house and learns of his death.
  id: s_20
  key_delta: Donnie’s death is known socially, severing his direct influence and returning
    the world to a normal state.
  trigger_event: Gretchen hears of Donnie’s death but says she did not know him personally.
