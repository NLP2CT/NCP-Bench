meta:
  genres: ["Thriller", "Drama"]
  id: movie73
  player_role: Nina Sayers
  title: "Black Swan"
synopsis: Nina Sayers, a young dancer with a prestigious New York City ballet company,
  lives with her mother, Erica, a former dancer. The company is preparing to open
  the season with Swan Lake. The director, Thomas Leroy, has to cast a new principal
  dancer after forcing Beth Macintyre into retirement. Leroy wants the same ballerina
  to portray both the innocent, fragile White Swan and her dark, sensual twin, the
  Black Swan. Nina competes for the part. Although her audition goes badly, she asks
  Thomas to reconsider. He tells her she is ideal for the White Swan but lacks the
  passion necessary for the Black Swan. When he forcibly kisses her, she shows some
  spirit and bites him, and lands the part. An intoxicated Beth angrily confronts
  Thomas and Nina. She is later hit by a car and seriously injured in what Thomas
  suspects was a suicide attempt. Nina begins to witness strange happenings. Thomas,
  meanwhile, becomes increasingly critical of her "frigid" dancing and advises her
  to stop being a perfectionist and lose herself in the role. Thomas points to Lily,
  another dancer in the company, whom he describes as lacking Nina's flawless technique
  but possessing an uninhibited quality that Nina has not shown. The relationship
  between the two dancers is cool because of Lily's indiscretions, but Lily invites
  Nina to a night out. Nina is hesitant at first but decides to go against her mother's
  wishes. At a restaurant that evening, Lily offers Nina a capsule of ecstasy to help
  her loosen up. Though reassured its effects will only last a few hours, Nina turns
  it down. Lily later slips it into her drink at a nightclub while she is absent.
  Nina returns home late, fights with her mother, barricades herself in her room,
  and finds herself having sex with Lily. Next morning, Nina wakes up alone and late
  for rehearsal. When she arrives at the studio, she finds Lily dancing as the Swan
  Queen. Furious, she confronts Lily and asks her why she did not wake her up that
  morning. After Lily tells her she spent the night with a man whom she met at the
  club, Nina realizes she imagined the encounter. Nina's hallucinations become stronger
  as she sees Thomas and Lily have sex in a backstage area and Beth stabbing herself
  in the face at the hospital with a nail filer which Nina drops bloodied in the elevator.
  She has a violent argument with her mother, after which Nina passes out. Concerned
  about Nina's erratic behavior, her mother tries to prevent her from performing on
  opening night; enraged, Nina stands up to her mother and forces her way out of the
  apartment. Since her mother had called to say Nina was sick, Thomas assigned understudy
  Lily to take over, but reluctantly gives way when Nina insists on performing. The
  first act goes well, until Nina is distracted by a hallucination during a lift,
  causing her partner, playing the Prince, to drop her. Distraught, she returns to
  her dressing room and finds Lily there. As Lily announces she is to play the Black
  Swan, she transforms into Nina's double. Nina shoves her into a mirror, shattering
  it. She grabs a shard of glass and stabs her rival in the stomach, killing her.
  The corpse transforms back into Lily. Nina hides the body and returns to the stage
  to dance with passion and sensuality. Sprouting feathers, her arms become black
  wings as she finally loses herself and is transformed into a black swan. At the
  end of the act, she receives a standing ovation. Offstage, Thomas and the rest of
  the cast congratulate her on her stunning performance. Nina takes Thomas by surprise
  and kisses him. Back in her dressing room before the final act, Nina is congratulated
  by Lily, showing that their fight was imaginary. The mirror, however, is still shattered.
  She removes a shard from her own body and realizes she had stabbed herself. Dancing
  the last scene, in which the White Swan throws herself off a cliff, Nina spots her
  mother weeping in the audience. As Nina falls backward onto a hidden mattress, the
  theater erupts in thunderous applause. Thomas and the cast gather to congratulate
  her—only to find that she is severely bleeding. As the white ceiling lights envelop
  her, she whispers, "I felt it. Perfect. It was perfect."
trajectory:
- description: Nina Sayers, a young dancer living with her former dancer mother Erica,
    is part of a prestigious New York City ballet company preparing for the new season's
    opening with Swan Lake. The company faces a vacancy for the dual lead role of
    the White Swan and Black Swan after the forced retirement of Beth Macintyre.
  id: s_0
  key_delta: The central conflict for the dual role casting is established, along
    with Nina's ambition and the company's pressures.
  trigger_event: Director Thomas Leroy announces auditions to cast the new Swan Queen
    role.
- description: Nina attends her audition for the Swan Queen role. Her performance
    lacks passion, especially for the Black Swan part.
  id: s_1
  key_delta: Nina reacts defiantly by biting Thomas, demonstrating hidden spirit;
    she is cast as the Swan Queen for the White Swan role.
  trigger_event: Thomas Leroy forces a kiss on Nina during the audition to provoke
    a reaction.
- description: Nina is cast as the White Swan. Tension rises following Beth Macintyre's
    public confrontation with Thomas and Nina, ending with Beth’s severe injury after
    being hit by a car.
  id: s_2
  key_delta: Beth is incapacitated, making Lily the likely understudy; Nina’s perception
    of reality begins to destabilize.
  trigger_event: Nina witnesses strange happenings beginning to occur around her.
- description: Thomas criticizes Nina’s 'frigid' dancing and advises her to lose herself
    in the role, highlighting Lily’s uninhibited qualities as a contrast.
  id: s_3
  key_delta: Nina breaks from her routine, engaging with the nightlife and beginning
    to confront personal and artistic inhibitions.
  trigger_event: Lily invites Nina to go out to a nightclub against her mother’s wishes.
- description: At the nightclub, Nina unknowingly ingests ecstasy slipped into her
    drink by Lily, affecting her perception and behavior into the night.
  id: s_4
  key_delta: Nina’s boundaries collapse as she hallucinates and imagines intimate
    encounters with Lily.
  trigger_event: Nina returns home late, argues with her mother, and barricades herself
    in her room.
- description: The next morning, Nina wakes late for rehearsal and finds Lily dancing
    as the Swan Queen.
  id: s_5
  key_delta: Nina confirms that her previous night's events involving Lily were hallucinations,
    intensifying her mental instability.
  trigger_event: Nina confronts Lily about not waking her; Lily reveals she spent
    the night elsewhere, making Nina realize her night was hallucinated.
- description: Nina’s hallucinations intensify, involving visions of Thomas and Lily
    having sex and Beth self-harming in the hospital.
  id: s_6
  key_delta: Nina’s erratic and unstable mental state causes concern for those around
    her, especially Erica.
  trigger_event: Nina has a violent argument with her mother and subsequently passes
    out.
- description: Erica tries to prevent Nina from performing on opening night due to
    her condition, leading to conflict.
  id: s_7
  key_delta: Nina asserts control over her career, insisting on performing despite
    concerns and the understudy being set to replace her.
  trigger_event: Nina forcibly leaves the apartment against her mother’s wishes.
- description: On opening night, Nina begins performing as the White Swan. The first
    act proceeds well until she is distracted by hallucinations during a lift, causing
    a fall.
  id: s_8
  key_delta: Nina’s growing paranoia culminates in a confrontation with Lily, blurring
    the lines between reality and imagination.
  trigger_event: Nina returns to her dressing room to find Lily there, who announces
    she will play the Black Swan.
- description: Nina shoves Lily into a mirror, shattering it, and stabs her rival,
    who transforms back into Lily.
  id: s_9
  key_delta: Nina kills the hallucinated double of Lily and achieves a dramatic transformation
    into the Black Swan onstage.
  trigger_event: Nina hides the body and returns to the stage, performing with unprecedented
    passion and sensuality.
- description: After her stunning performance, Nina is congratulated backstage, kisses
    Thomas, and then returns to the dressing room where Lily appears again, revealing
    the fight was imagined.
  id: s_10
  key_delta: Nina realizes the violent act was self-inflicted, confirming her unstable
    mental state and the unreality of prior events.
  trigger_event: Nina observes the shattered mirror and discovers she has stabbed
    herself.
- description: During the final act, Nina performs the White Swan’s death scene, falling
    backward onto a hidden mattress as the audience applauds wildly.
  id: s_11
  key_delta: Nina completes her ultimate artistic transformation at the cost of grievous
    physical injury, embodying the tragic culmination of her psychological and physical
    journey.
  trigger_event: Nina’s severe bleeding is noticed by Thomas and the cast as white
    ceiling lights envelop her while she whispers 'It was perfect.'
