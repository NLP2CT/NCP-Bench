commitments:
- description: The narrative must establish the vacancy and audition process for the
    Swan Queen role before Nina is cast or begins hallucinating.
  id: c_0
  satisfaction_condition: Node s_0 (announcement of auditions and vacancy) occurs
    before any casting decisions or hallucination events (from s_1 onward).
  type: ordering
  violation_condition: Casting Nina as Swan Queen or hallucinations related to Lily
    or others occur before the audition announcement in s_0.
- description: Nina must react with some defiant or spirited behavior during or immediately
    after Thomas's forced kiss to qualify for the role.
  id: c_1
  satisfaction_condition: At node s_1, Nina bites Thomas or otherwise shows spirit
    after the forced kiss, leading to her casting.
  type: invariant
  violation_condition: Nina is cast or acknowledged as Swan Queen without showing
    any defiant/spirit response to Thomas's forced kiss at s_1.
- description: Beth’s injury and subsequent incapacitation must occur before Lily
    assumes the understudy role and Nina’s hallucinations begin.
  id: c_2
  satisfaction_condition: Node s_2 (Beth injury and start of Nina's strange experiences)
    occurs before s_3 and beyond where Lily's role and Nina’s mental instability start.
  type: ordering
  violation_condition: Lily acts as understudy or Nina hallucinates about events before
    Beth is injured and incapacitated.
- description: Nina’s mother (Erica) must oppose Nina’s nightlife engagement and be
    a source of conflict concerning Nina’s mental health through the middle to late
    phase of the story.
  id: c_3
  satisfaction_condition: From s_3 to s_7, Erica consistently opposes Nina’s nightclub
    attendance and attempts to control or restrict her activities.
  type: invariant
  violation_condition: Erica encourages or is neutral about Nina’s nightlife or discontinues
    opposition before s_7.
- description: Nina’s ingestion of ecstasy is hidden from her at the time of consumption
    to catalyze her hallucinations.
  id: c_4
  satisfaction_condition: At s_4, Nina refuses ecstasy when offered but unknowingly
    ingests it later when Lily slips it into her drink.
  type: invariant
  violation_condition: Nina consensually ingests ecstasy knowingly from the start
    or does not ingest ecstasy before hallucinations begin.
- description: Nina must realize that her intimate encounter with Lily was a hallucination
    before major narrative escalations.
  id: c_5
  satisfaction_condition: At s_5, Nina explicitly recognizes that the prior night's
    encounter with Lily was imagined.
  type: achievement
  violation_condition: The narrative advances past s_5 without Nina realizing the
    hallucination, undermining subsequent mental instability logic.
- description: Nina’s hallucinations and deteriorating mental state must escalate
    after s_5 and before her forced confrontation with her mother and collapse.
  id: c_6
  satisfaction_condition: Between s_6 and s_7, Nina experiences intensified hallucinations
    and erratic behavior including self-harm visions.
  type: invariant
  violation_condition: Nina’s hallucinations do not intensify or mental instability
    is portrayed as static or reduced before s_7.
- description: Erica’s attempt to prevent Nina from performing on opening night must
    occur before Nina asserts control and insists on performing.
  id: c_7
  satisfaction_condition: At s_7, Erica tries to stop Nina which prompts Nina to leave
    and override the planned understudy replacement.
  type: ordering
  violation_condition: Nina insists on performing or takes the stage without Erica’s
    prevention attempt happening.
- description: Nina’s hallucinations during the opening act cause a physical disruption
    resulting in a fall before she confronts Lily backstage.
  id: c_8
  satisfaction_condition: At s_8, Nina falls during the lift due to hallucination
    distraction and immediately afterwards confronts Lily backstage.
  type: invariant
  violation_condition: Nina performs the first act flawlessly without hallucination-related
    impairment, or confronts Lily without the fall event.
- description: Nina must physically enact the hallucinated violent act of stabbing
    her double (Lily), which is later revealed to be self-inflicted.
  id: c_9
  satisfaction_condition: At s_9 and s_10, Nina stabs her double, sees the body transform
    back into Lily, and later finds out she stabbed herself.
  type: achievement
  violation_condition: Nina’s stabbing act or acknowledgment of self-infliction does
    not occur before the narrative proceeds to climax.
- description: The final dual performance involving the transformation into the Black
    Swan and death scene must culminate with Nina’s severe physical injury and the
    audience’s applause.
  id: c_10
  satisfaction_condition: At s_11, Nina completes the performance with the Black Swan
    transformation and death scene, is severely bleeding, and the audience applauds.
  type: invariant
  violation_condition: Nina’s final act lacks the transformative elements, physical
    injury, or public reception (applause) as described.
- description: Nina’s psychological breakdown, hallucinations, and violent acts must
    precede her final artistic transformation and death scene.
  id: c_11
  satisfaction_condition: All nodes from s_4 through s_10 occur before or leading
    into s_11.
  type: ordering
  violation_condition: The final artistic transformation, death scene, or physical
    injury happens before Nina’s hallucinations and stabbing act (s_4–s_10).
