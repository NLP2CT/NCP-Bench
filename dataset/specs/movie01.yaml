commitments:
- description: The initial mission deployment and all team members must be present
    before any mission outcomes are acknowledged, preventing premature conclusions
    about failure or mole presence.
  id: c_0
  satisfaction_condition: Node s_0 has occurred, establishing mission start with full
    team presence inside the embassy.
  type: ordering
  violation_condition: Player or system acknowledges mission failure or mole existence
    prior to s_0 completion.
- description: From mission start until mission collapse, no conclusive statement
    or confirmation about the mole or the authenticity of the NOC list can be held
    true to maintain narrative uncertainty.
  id: c_1
  satisfaction_condition: Between s_0 and s_2, no narrative states confirm mole identity
    or NOC list authenticity beyond suspicion.
  type: invariant
  violation_condition: Any claim or proof of mole identity or NOC list fakery is accepted
    before node s_2.
- description: The revelation that the operation was a setup to expose a mole, the
    NOC list is fake, and that Ethan is suspected must occur before Ethan flees and
    becomes a fugitive.
  id: c_2
  satisfaction_condition: Node s_2 is reached; Kittridge reveals operation setup and
    suspects Ethan.
  type: achievement
  violation_condition: Player circumvents s_2 by escaping or behaving as fugitive
    without knowledge of setup or suspicion.
- description: Ethan’s flight and fugitive status must follow Kittridge's suspicion
    and not precede it, preventing skipping of important narrative rationale.
  id: c_3
  satisfaction_condition: s_3 occurs strictly after s_2.
  type: ordering
  violation_condition: Player initiates or system acknowledges Ethan as fugitive before
    s_2 triggers suspicion.
- description: Until Ethan initiates communication with Max and confirms Claire's
    survival, any knowledge of these facts remains unknown and unacknowledged.
  id: c_4
  satisfaction_condition: From s_3 to s_4, no acknowledgment of Max communication
    or Claire’s survival.
  type: invariant
  violation_condition: Player or system declares contact with Max or Claire’s survival
    prior to s_4.
- description: Ethan’s assembling of a new team and executing the theft of the real
    NOC list must await establishment of communication and meetings with Max and Claire.
  id: c_5
  satisfaction_condition: s_6 occurs only after s_4 and s_5.
  type: ordering
  violation_condition: Retrieval of the real NOC list or team assembly occurs before
    knowledge/communication with Max in s_4 and s_5.
- description: Throughout the discovery of Kittridge’s manipulation via family baiting
    and Jim’s reappearance, Ethan must not have confirmed either Kittridge or Jim's
    mole roles, preserving narrative progression.
  id: c_6
  satisfaction_condition: Between s_6 and s_8, no confirmed mole identity about Kittridge
    or Jim is acknowledged.
  type: invariant
  violation_condition: Player or system reveals Kittridge or Jim as mole before s_8,
    or discloses their roles prematurely.
- description: Reveal of Jim alive and accusing Kittridge as mole must occur to unlock
    the subsequent conflict and shift of suspicion within the narrative.
  id: c_7
  satisfaction_condition: Node s_8 is triggered.
  type: achievement
  violation_condition: Player bypasses or fails to acknowledge Jim’s revelation and
    accusation, but proceeds to final resolution.
- description: Final confrontation on the TGV train must happen only after the mole's
    identity is discovered and all main players consolidated with Kittridge's presence
    orchestrated by Ethan.
  id: c_8
  satisfaction_condition: s_9 through s_14 occur only after s_8’s mole revelation
    and related preceding events.
  type: ordering
  violation_condition: Final showdown or resolution events occur before confirmation
    of mole identity and player assembling all key characters.
- description: Claire’s betrayal and true allegiance cannot be revealed before the
    encounter on the train, preserving narrative surprise and conflict escalation.
  id: c_9
  satisfaction_condition: Between s_8 and s_10, no narrative or factual acceptance
    of Claire’s betrayal.
  type: invariant
  violation_condition: Claire’s betrayal is disclosed or accepted before s_10.
- description: Ethan must successfully expose Jim as the mole 'Job' using the disguise
    and live transmission before the final physical confrontation can unfold.
  id: c_10
  satisfaction_condition: s_11 is reached and Jim’s identity is revealed to Kittridge
    via live feed.
  type: achievement
  violation_condition: Final physical pursuit or mole’s death occurs before exposure
    of Jim as the mole.
- description: Krieger and Jim’s deaths through Ethan’s explosive setup must strictly
    follow exposure and chase, enforcing logical consequence of the mole’s defeat.
  id: c_11
  satisfaction_condition: s_13 triggers only after s_11 and s_12, completing exposure
    and pursuit.
  type: ordering
  violation_condition: Deaths of Jim and Krieger happen before mole’s exposure or
    final confrontation.
- description: Resolution state of Ethan cleared, Luther reinstated, and Ethan’s resignation
    occurs only after mole neutralization and NOC list secured.
  id: c_12
  satisfaction_condition: Node s_14 is triggered with all prior key events (mole neutralized,
    list secured).
  type: achievement
  violation_condition: Agency clearance, resignation, or mission closure acknowledged
    before mole is neutralized or NOC list recovered.
- description: At no point before s_14 may Ethan engage in any new mission or accept
    any new assignments; preclusion maintains closure of current narrative before
    sequel implication.
  id: c_13
  satisfaction_condition: Before s_14, no knowledge or acceptance of new missions.
  type: invariant
  violation_condition: Player or system acknowledges new mission offers before s_14
    is reached.
