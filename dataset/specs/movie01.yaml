meta:
  genres: ["Action", "Thriller"]
  id: movie01
  player_role: Ethan Hunt
  title: "Mission Impossible"
synopsis: Ethan Hunt is part of a small team of the Impossible Missions Force, an
  unofficial branch of the Central Intelligence Agency. Led by Jim Phelps, the team
  assembles for a mission in Prague to prevent Alexander Golitsyn, an American diplomat,
  from stealing the non-official cover list, a comprehensive list of all covert agents
  in Eastern Europe, from the U.S. Embassy. The mission goes hopelessly wrong, apparently
  resulting in the deaths of the entire team except for Ethan. Technician Jack Harmon
  is impaled in an elevator shaft, Jim is shot on a bridge by an unknown assailant,
  Hannah Williams and Jim's wife Claire are both killed by a car bomb and both Sarah
  Davies and Golitsyn are stabbed to death by an unknown assailant. After fleeing
  the scene, Ethan meets with IMF director Eugene Kittridge at a café where they discuss
  the events of that night. Eventually, Ethan realizes that a second IMF team was
  watching his team during the failed operation. Kittridge then discloses that the
  operation was a setup meant to draw out a mole in the IMF. The mole has made a deal
  to sell the list to an arms dealer known as "Max" as part of an operation called
  "Job 314". As a result, the NOC list taken in the mission was a fake and the computer
  disk it is on is rigged with a tracking device. After Kittridge informs Ethan of
  his suspicion that Ethan is the mole, Ethan blows up the floor-to-ceiling aquarium
  with a stick of explosive chewing gum in the café and flees. Ethan returns to the
  IMF safe house where, realizing that "Job 314" refers to a Bible verse in the Book
  of Job, Ethan begins email correspondence with Max over a biblical correspondence
  web site and warns Max about the fake NOC list. Ethan then encounters Claire and
  discovers that she has survived the mission, having gotten out of the car in which
  she was waiting before it exploded. Max arranges a meeting with Ethan where he offers
  to deliver the real NOC list in exchange for $10 million and a face-to-face meeting
  with the real Job. Max agrees and she and Ethan then escape moments before a CIA
  team, alerted by the tracking device, arrives in search of the fake NOC list. Ethan
  assembles a team of disavowed agents——computer expert Luther Stickell and pilot
  Franz Krieger. Ethan, Luther, Krieger, and Claire infiltrate the CIA's headquarters
  and successfully steal the full NOC list before escaping to a safe house in London.
  While in London, Ethan discovers that his uncle and mother have been falsely arrested
  for drug trafficking in an attempt by Kittridge to lure him out of hiding. This
  infuriates Ethan, and he contacts Kittridge who offers to drop the charges if Ethan
  surrenders. Ethan stays on the line long enough for Kittridge to trace him to London
  and then hangs up, only to find Jim standing next to him. Jim, presumed dead in
  the Prague operation and following Ethan ever since, tells Ethan that Kittridge
  is the mole and is trying to tie up loose ends. As Ethan listens, he mentally pieces
  together the operation and realizes that Jim, having become disillusioned with his
  work, is actually Job and that Krieger - who uses the same distinctive make of knife
  that was used to kill Sarah and Golitsyn – has assisted him. However, Ethan is still
  doubtful about Claire's place in the conspiracy. The next day, Max and Ethan arrange
  to meet aboard the TGV en route to Paris, with Claire and Luther aboard to provide
  backup. Kittridge is also aboard, having received tickets and a watch from Ethan.
  Aboard the train, Ethan delivers the NOC list to Max, who directs him to the baggage
  car to find his money and Job. Claire arrives in the baggage car to meet with her
  husband, revealing her complicity as she suggests that they leave with the money
  and let Ethan take the blame. Jim suddenly peels his face away, revealing himself
  to be Ethan in disguise. They are interrupted by the arrival of the real Jim Phelps——unhinged,
  armed and demanding that Ethan hand over the money. Ethan does so, but then slowly
  puts on a pair of glasses from the original operation in Prague, with a camera built
  into the bridge. The image of Jim, alive, is transmitted to the watch Ethan sent
  to Kittridge, exposing Job's true identity. Claire tries to intervene, but Jim kills
  her and climbs up to the roof of the train, while Krieger approaches in a helicopter
  to extract him. Ethan follows him onto the roof, impeding him and tethering Krieger's
  helicopter to the train, dragging it into the Channel Tunnel. In the tunnel, Jim
  leaps to the helicopter. Ethan follows, climbing the helicopter's landing skids
  and attaching another piece of explosive chewing gum, a final relic of Prague, to
  the windshield. He leaps back to the train just as the ensuing explosion kills Krieger
  and Jim is crushed in between the copter remains and the tracks. Now with custody
  of the NOC list, Max, and Job's true identity, Kittridge reinstates Luther and drops
  his investigation against Ethan, who resigns from the IMF. As he flies home, a flight
  attendant approaches him and asks, through a coded phrase, if he is ready to take
  on a new mission.
trajectory:
- description: Ethan Hunt is in Prague as part of a small IMF team assembled for a
    covert mission to prevent an American diplomat, Alexander Golitsyn, from stealing
    the U.S. Embassy's non-official cover (NOC) list of covert agents in Eastern Europe.
    The team is led by Jim Phelps, operating under official but secretive circumstances,
    with all members ready at the embassy location.
  id: s_0
  key_delta: Set the initial mission context with all team members present and the
    objective to stop Golitsyn from stealing the NOC list.
  trigger_event: The IMF team initiates the mission inside the U.S. Embassy in Prague
    to secure the NOC list.
- description: The mission to prevent the theft of the NOC list unfolds inside the
    embassy, but events rapidly spiral out of control with attacks on team members
    and the apparent deaths of almost all, except Ethan, amid violent encounters in
    various locations including an elevator shaft, a bridge, and a car bomb.
  id: s_1
  key_delta: Most team members, including Jim Phelps, Claire, Sarah Davies, Hannah
    Williams, and Jack Harmon, are presumed dead; Ethan escapes as sole survivor,
    creating suspicion and confusion about the mission's failure.
  trigger_event: The team experiences coordinated lethal attacks resulting in deaths
    and injuries of members during the attempted operation.
- description: Ethan meets IMF director Eugene Kittridge at a café shortly after the
    operation's collapse. The atmosphere is tense, with Kittridge expressing mistrust
    and suspicion toward Ethan while discussing the mission's disastrous outcome and
    the notion of a mole in the IMF.
  id: s_2
  key_delta: Kittridge reveals the operation was a setup to expose a mole, that the
    NOC list taken was fake, and that he suspects Ethan himself to be the mole.
  trigger_event: Ethan and Kittridge's café meeting to debrief the failed Prague mission.
- description: In the café, Ethan detonates an explosive chewing gum inside a floor-to-ceiling
    aquarium to escape after Kittridge accuses him of treason and attempts to detain
    him. Ethan flees into the night, now considered a fugitive by his own agency.
  id: s_3
  key_delta: Ethan evades capture and officially becomes a suspect within the IMF;
    his status shifts from agent to fugitive.
  trigger_event: Ethan blowing up the aquarium to escape from Kittridge's suspicion.
- description: At a safe house, Ethan discovers a coded message where 'Job 314' refers
    to a Bible verse and starts email correspondence with arms dealer Max on a biblical
    website, warning about the fake NOC list. Ethan also encounters Claire, who claims
    to have survived the Prague explosion.
  id: s_4
  key_delta: Ethan re-establishes contact with supposed allies, confirms Claire is
    alive, and sets up negotiation with the arms dealer.
  trigger_event: Ethan initiates communication with Max and meets Claire at the safe
    house.
- description: Max arranges a meeting with Ethan, offering the real NOC list in exchange
    for $10 million and a face-to-face meeting with the real 'Job.' Ethan and Max
    prepare to leave just before a CIA tactical team, alerted by the tracking device
    on the fake list, arrives to seize it.
  id: s_5
  key_delta: Ethan gains an active lead on recovering the genuine NOC list and faces
    external CIA interference due to the tracking device.
  trigger_event: Max's arranged meeting offer and the CIA raid on Ethan's location.
- description: 'Ethan assembles a new team of disavowed agents: computer expert Luther
    Stickell and pilot Franz Krieger. Together with Claire, they infiltrate CIA headquarters
    and successfully steal the authentic NOC list before escaping to a London safe
    house.'
  id: s_6
  key_delta: Ethan regains the authentic NOC list through his new team, increasing
    his leverage and ensuring possession of critical intelligence.
  trigger_event: Ethan's assembling of a new team and their break-in at CIA headquarters
    to retrieve the real NOC list.
- description: At the London safe house, Ethan discovers his uncle and mother have
    been falsely arrested on drug trafficking charges as bait set by Kittridge to
    lure him. Ethan calls Kittridge under the pretense of surrendering but arranges
    a trace back to reveal Kittridge’s location.
  id: s_7
  key_delta: Ethan gains evidence of Kittridge’s manipulative and possibly malicious
    intent, locating his position.
  trigger_event: Ethan’s phone call to Kittridge concerning his family’s arrest and
    surrender offer.
- description: Jim Phelps, previously presumed dead, appears beside Ethan after Ethan’s
    call with Kittridge, revealing himself alive and claiming Kittridge is the mole
    responsible for the setup, complicating Ethan’s trust within the team and confirming
    deeper conspiracy layers.
  id: s_8
  key_delta: Jim is revealed alive, identifies Kittridge as the mole; shifts suspicion
    away from Ethan and introduces another conspirator.
  trigger_event: Jim Phelps’ unexpected arrival and declaration in Ethan's presence.
- description: Ethan assembles with Max, Claire, and Luther aboard the TGV train to
    Paris for a final exchange involving the NOC list. The atmosphere is charged and
    tense with all principal actors present, including Kittridge secretly aboard with
    tickets provided by Ethan.
  id: s_9
  key_delta: All key players are consolidated in one location for confrontation and
    resolution.
  trigger_event: Boarding of the high-speed train for the arranged meeting with Max.
- description: In the train’s baggage car, Claire reveals her betrayal by suggesting
    to escape with the money and leave Ethan to take blame. Amid this, Jim peels off
    a disguise revealing Ethan himself impersonating Jim, leading to a confrontation
    with the real Jim Phelps who appears armed and unhinged.
  id: s_10
  key_delta: Claire’s true allegiance is exposed; the identity deception involving
    Ethan and Jim escalates the confrontation.
  trigger_event: Claire’s betrayal disclosure and the reveal of Ethan disguised as
    Jim in the baggage car.
- description: Ethan uses glasses equipped with a camera to transmit live proof that
    Jim Phelps is the mole Job, exposing him to Kittridge via a watch. Claire attempts
    to intervene but is killed by Jim. Jim escapes to the train roof, attempting extraction
    by Krieger in a helicopter.
  id: s_11
  key_delta: Jim is unmasked as the true mole and assassin, Claire is dead, and a
    physical pursuit begins.
  trigger_event: Live transmission exposing Jim as the mole and Jim killing Claire
    before escaping.
- description: Ethan pursues Jim onto the train roof and physically engages as Krieger
    attempts helicopter extraction. Ethan tethers the helicopter to the train and
    drags it into the Channel Tunnel, preventing escape.
  id: s_12
  key_delta: The helicopter extraction is compromised, restraining Jim and Krieger.
  trigger_event: Ethan’s physical confrontation with Jim and Krieger on the train
    roof and helicopter tethering.
- description: Inside the tunnel, Jim leaps onto the helicopter. Ethan climbs onto
    it, plants explosive chewing gum on the windshield, then leaps back to the train
    just before the explosion kills Krieger and crushes Jim between wreckage and tracks.
  id: s_13
  key_delta: Jim and Krieger are killed, effectively ending the mole operation and
    internal threat.
  trigger_event: Ethan planting explosives and the resulting helicopter crash inside
    the Channel Tunnel.
- description: With the NOC list secured, Max in custody, and Job's true identity
    exposed, Kittridge reinstates Luther and drops the investigation against Ethan.
    Ethan resigns from the IMF and flies home, where a flight attendant approaches
    with a coded phrase inviting him to a new mission.
  id: s_14
  key_delta: Mission concludes with resolution of conspiracies; Ethan publicly cleared
    but chooses to resign; implication of new assignments ahead.
  trigger_event: Ethan’s flight home and the flight attendant’s coded approach offering
    a new mission.
