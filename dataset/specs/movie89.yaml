meta:
  genres: ["War", "Drama"]
  id: movie89
  player_role: Lt. Werner
  title: "Das Boot"
synopsis: The story is told from the viewpoint of Lt. Werner, who has been assigned
  as a war correspondent on the German submarine U-96 in October 1941. He meets its
  captain, chief engineer, and the crew in a French nightclub. Thomsen, another captain,
  gives a crude drunken speech to celebrate his Ritterkreuz award, in which he openly
  mocks Winston Churchill and implicitly Adolf Hitler. The next morning, they sail
  out of the harbour of La Rochelle to cheering crowds and a playing band. Werner
  is given a tour of the boat. As time passes, he observes ideological differences
  between the new crew members and the hardened veterans, particularly the captain,
  who is embittered and cynical about the war. The new men, including Werner, are
  often mocked by the rest of the crew, who share a tight bond. After days of boredom,
  the crew is excited by another U-boat's spotting of an enemy convoy. They soon locate
  a British destroyer, but are bombarded with depth charges. They narrowly escape
  with only light damage. The next three weeks are spent enduring a relentless storm.
  Morale drops after what seems like an endless series of misfortunes, but the crew
  is cheered temporarily by a chance encounter with Thomsen's boat. Shortly after
  the storm ends, the boat encounters a British convoy and quickly launches four torpedoes,
  sinking two ships. However, they are spotted by a destroyer and have to dive below
  the submarine's rated limit. During the depth-charge attack, the chief mechanic,
  Johann, panics and has to be restrained. The boat sustains heavy damage, but is
  eventually able to safely surface in darkness. An enemy tanker remains afloat and
  on fire, so they torpedo the ship, only to realize that there are still sailors
  aboard; they watch in horror as the sailors, some on fire, leap overboard and swim
  towards them. Following orders not to take prisoners, the captain gives the command
  to back the ship away. The worn-out U-boat crew looks forward to returning home
  to La Rochelle in time for Christmas, but the ship is ordered to La Spezia, Italy,
  which means passing through the Strait of Gibraltar — an area heavily defended by
  the Royal Navy. The U-boat makes a secret night rendezvous at the harbour of Vigo,
  in neutral Spain, with the SS Weser, an interned German merchant ship that clandestinely
  provides U-boats with fuel, torpedoes, and other supplies. The filthy officers seem
  out of place on the opulent luxury liner, but are warmly greeted by enthusiastic
  officers eager to hear their exploits. The captain learns from an envoy of the German
  consulate that his request for Werner and the chief engineer to be sent back to
  Germany has been denied. The crew finishes resupplying and departs for Italy. As
  they carefully approach Gibraltar and are just about to dive, they are suddenly
  attacked by a British fighter plane, wounding the navigator. The captain orders
  the boat directly south towards the African coast at full speed. British ships begin
  closing in and she is forced to dive; it is later implied that the ships used HF/DF
  to locate the sub. When attempting to level off, the boat does not respond and continues
  to sink until, just before being crushed by the pressure, it lands on a sea shelf,
  at the staggering depth of 280 metres. The crew works desperately to make numerous
  repairs before running out of oxygen. After over 16 hours, they are miraculously
  able to surface by blowing out their ballast of water, and limp back to La Rochelle
  under the cover of darkness. The crew is pale and weary upon reaching the alternative
  harbour of La Rochelle on Christmas Eve. Shortly after the wounded navigator is
  taken ashore to a waiting ambulance, Allied planes bomb and strafe the facilities,
  wounding or killing most of the men. Ullmann, Johann and the 2nd Watch Officer are
  killed. Frenssen, Bootsmann Lamprecht and Hinrich are badly wounded. After the raid,
  Werner leaves the U-boat bunker in which he had taken shelter and finds the captain,
  with multiple bullet wounds and bleeding from the mouth, watching the U-boat sink
  at the dock. The captain collapses after the boat disappears under the water. Werner
  runs to the captain's lifeless body, recoils, and quickly glances around at the
  destruction, his face frozen with horror.
trajectory:
- description: Lt. Werner is present in a smoky French nightclub where he meets the
    captain, chief engineer, and crew members of the German submarine U-96 in October
    1941. The atmosphere is tense but festive, highlighted by Thomsen giving a crude
    drunken speech celebrating his Ritterkreuz award while openly mocking Winston
    Churchill and implicitly Adolf Hitler.
  id: s_0
  key_delta: Introduction of the main characters on the U-96 and establishment of
    ideological tensions and morale; the submarine departs from port to begin its
    mission.
  trigger_event: Morning arrives and the U-96 prepares to sail out of the harbour
    of La Rochelle amidst cheering crowds and a playing band.
- description: The U-96 is sailing at sea with Lt. Werner being given a tour of the
    submarine. Inside, ideological differences become apparent between the new crew
    members, including Werner, and the hardened veterans led by the embittered, cynical
    captain. The new men are mocked by the closely bonded veteran crew.
  id: s_1
  key_delta: The crew's attention shifts from routine boredom to active engagement
    in wartime operations, revealing internal social dynamics and tensions.
  trigger_event: Reports from another U-boat announce spotting an enemy convoy, exciting
    the crew.
- description: The U-96 locates a British destroyer and engages but suffers a depth
    charge attack causing only light damage. The crew narrowly escapes.
  id: s_2
  key_delta: The vessel survives an initial combat encounter, but the crew’s morale
    begins to deteriorate as they face prolonged adverse weather conditions.
  trigger_event: The submarine encounters and must endure a relentless storm lasting
    three weeks.
- description: During the storm, the U-96 has a chance encounter with Thomsen's boat,
    which temporarily cheers the crew and boosts morale.
  id: s_3
  key_delta: The temporary morale boost from the reunion is replaced by the imminent
    combat engagement with a convoy.
  trigger_event: The storm ends and the U-96 encounters a British convoy, initiating
    an attack.
- description: The U-96 launches four torpedoes, sinking two enemy ships but is subsequently
    detected by a destroyer, forcing the submarine to dive below its rated depth and
    sustain heavy damage.
  id: s_4
  key_delta: Combat causes critical damage and psychological strain within the crew,
    particularly on Johann, illustrating the stress of warfare.
  trigger_event: During the depth charge attack, the chief mechanic Johann panics
    and must be physically restrained.
- description: The damaged U-96 surfaces at night after surviving the attack. An enemy
    tanker remains afloat and burning; the crew torpedoes it, only to see sailors
    leaping into the water. The captain orders to back away following standing orders
    to take no prisoners.
  id: s_5
  key_delta: The crew faces a moral and operational dilemma linked to the rescue of
    enemy sailors and a strategic shift in orders, increasing the peril of their mission.
  trigger_event: The U-96 prepares for a return journey home with optimism for Christmas
    but receives orders to sail to La Spezia, Italy, requiring passage through the
    heavily defended Strait of Gibraltar.
- description: The U-96 makes a secret night rendezvous in Vigo, Spain, to resupply
    from the interned German merchant ship SS Weser. The captain learns his request
    to send Werner and the chief engineer back to Germany has been denied. The officers
    contrast sharply with the luxury liner’s opulence.
  id: s_6
  key_delta: The mission becomes more hazardous with the injury of a key crew member
    and maintenance of secrecy during resupply; the captain’s personnel request is
    denied, maintaining crew tension.
  trigger_event: After resupplying, the U-96 departs Vigo and approaches Gibraltar
    where it is attacked by a British fighter plane, wounding the navigator.
- description: Under direct attack and pursued by British ships, the U-96 is forced
    to dive but sinks uncontrollably until resting on a seabed at 280 meters, far
    below rated depth.
  id: s_7
  key_delta: The crew faces a life-threatening crisis with the submarine severely
    damaged and trapped at extreme depth, testing their technical and physical endurance.
  trigger_event: Crew members conduct desperate repairs to regain control and prevent
    suffocation as oxygen runs low.
- description: After over 16 hours, the U-96 surfaces using compressed air to blow
    out ballast water and limps back towards La Rochelle under cover of darkness.
    The crew is pale, weary, and facing the burden of their ordeal.
  id: s_8
  key_delta: The crew survives the underwater ordeal and returns home, only to be
    immediately confronted by a deadly enemy air attack causing heavy casualties and
    injuries.
  trigger_event: Arrival at La Rochelle on Christmas Eve, followed by an Allied air
    raid bombing and strafing the harbour facilities, causing numerous deaths and
    injuries among the crew.
- description: The wounded navigator is taken to an ambulance while the captain, severely
    wounded and bleeding, watches the U-96 sink at the dock. The port area is devastated
    by the bombing.
  id: s_9
  key_delta: The captain’s death and the destruction of the submarine at dock symbolize
    the crushing toll of the war on the crew and their mission's tragic culmination.
  trigger_event: The captain collapses after the submarine disappears underwater;
    Werner rushes to his lifeless body amid the destruction.
