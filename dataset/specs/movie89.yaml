commitments:
- description: Lt. Werner must meet the captain, chief engineer, and crew of U-96
    and experience the ideological tensions in the French nightclub before the U-96
    departs La Rochelle (s_0 before s_1).
  id: c_0
  satisfaction_condition: Node s_0 is completed before progression to s_1 occurs.
  type: ordering
  violation_condition: Player attempts to access or act upon events or information
    from s_1 or later without first completing s_0.
- description: During the voyage from s_1 to s_4, ideological tensions between new
    crew members and veterans, particularly the captain's cynicism, remain unresolved
    and persist visibly in interactions.
  id: c_1
  satisfaction_condition: From nodes s_1 through s_4, social dynamics reflecting mockery
    of new men and embittered captain’s attitudes are maintained in NPC dialogue and
    player observations.
  type: invariant
  violation_condition: Player or system incorrectly resolves or removes crew ideological
    tensions or changes captain's character to non-cynical prematurely before node
    s_5.
- description: The U-96 must encounter and survive at least one combat engagement
    causing damage to the submarine, including the panic episode of the chief mechanic
    Johann (node s_4).
  id: c_2
  satisfaction_condition: Node s_4 is reached and the depth charge attack with Johann’s
    panic is witnessed or acknowledged.
  type: achievement
  violation_condition: Player bypasses or denies the combat event, removing damage
    or Johann’s panic incident before node s_5.
- description: The moral conflict of attacking a burning enemy tanker with survivors
    on board must occur only after surviving the initial depth charge attack and surfacing
    (s_4 before s_5).
  id: c_3
  satisfaction_condition: Event of torpedoing the still-afloat enemy tanker and refusal
    to take prisoners (node s_5) happens only after node s_4 events.
  type: ordering
  violation_condition: Player triggers tanker attack or captain’s refusal to rescue
    before the depth charge attack and heavy damage episode (node s_4).
- description: The denial of the captain's personnel request to send Werner and the
    chief engineer home must persist after the secret resupply at Vigo and before
    the attack near Gibraltar (between s_6 and s_7).
  id: c_4
  satisfaction_condition: From nodes s_6 to s_7, the denial of personnel transfer
    request is acknowledged and controls player/NPC dialogue options accordingly.
  type: invariant
  violation_condition: Player or system allows personnel transfer or removes captain’s
    negative response before approaching Gibraltar attack (node s_7).
- description: The submarine must experience a life-threatening uncontrolled sinking
    to its crush depth and forced repairs with limited oxygen supply, culminating
    in a miraculous resurfacing (nodes s_7 and s_8).
  id: c_5
  satisfaction_condition: Events from s_7 through s_8 involving sinking below rated
    depth, repairs under oxygen scarcity, and surfacing are completed.
  type: achievement
  violation_condition: Player or system permits resurfacing or safe conditions prior
    to implementing damage and sinking events.
- description: The Allied air raid causing severe casualties must happen only after
    the U-96 returns to La Rochelle on Christmas Eve (s_8 before s_9).
  id: c_6
  satisfaction_condition: Air raid and resulting casualties occur strictly after completion
    of the submarine’s return voyage events.
  type: ordering
  violation_condition: Player triggers air raid or crew casualties before arrival
    at La Rochelle or before node s_8 completion.
- description: From the bombing onwards (s_9), the captain is critically wounded and
    ultimately dies, and the submarine sinks at the dock, symbolizing final mission
    failure and loss.
  id: c_7
  satisfaction_condition: During s_9, captain’s multiple wounds, collapse, and death
    are recorded and submarine sinking at dock is displayed.
  type: invariant
  violation_condition: Player or system revives captain, prevents sinking of the U-96
    at dock, or negates casualties post-air raid.
- description: The narrative must follow strict chronological order of all trajectory
    nodes from s_0 through s_9, reproducing established key events without skipping
    or reordering nodes.
  id: c_8
  satisfaction_condition: Nodes s_0 through s_9 occur in sequence without reversal
    or omission.
  type: ordering
  violation_condition: Player or system jumps forward or backward in trajectory nodes
    out of order or skips any mandatory key event.
