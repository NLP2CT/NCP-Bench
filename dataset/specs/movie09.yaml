commitments:
- description: The Driver must never violate his initial getaway driver rule of never
    working for the same criminals twice or waiting beyond the five-minute window
    before leaving them, until s_5 is reached where he breaks this by aiding Standard.
  id: c_0
  satisfaction_condition: For all trajectory nodes s_i where i < 5, the Driver has
    not repeated work for the same criminals nor waited more than five minutes for
    a job to complete.
  type: invariant
  violation_condition: The system acknowledges the Driver working with the same criminals
    in multiple jobs or waiting longer than five minutes before abandoning a job before
    s_5.
- description: The Driver’s relationship with Irene and Benicio must develop through
    initial meeting (s_0), helping with car trouble (s_1), before progressing to deeper
    involvement and meeting Standard (s_3).
  id: c_1
  satisfaction_condition: Node s_0 and s_1 have occurred before any scene involving
    Irene and Standard's family relations as in s_3.
  type: ordering
  violation_condition: The Driver obtains knowledge of or acts upon Standard or Irene’s
    family issues before meeting Irene and assisting her with car trouble.
- description: The Driver gaining the stock car and connections with Bernie and Nino
    (s_2) must precede discovery of Nino’s hostility and deeper criminal conflict
    unfolding in later nodes (s_10+).
  id: c_2
  satisfaction_condition: Node s_2 completed before revelation of Nino’s orchestration
    of the heist at s_10 or subsequent violent acts against the Driver.
  type: ordering
  violation_condition: Player accesses or acts on knowledge of Nino’s motivations
    or involvement before the event sequences in s_2.
- description: The Driver’s assistance to Standard in the pawn shop heist (s_5) must
    be established after the threats from Cook and Standard’s debt are revealed (s_4).
  id: c_3
  satisfaction_condition: s_4 has occurred prior to s_5.
  type: ordering
  violation_condition: Driver begins assisting in the pawn shop robbery before the
    debt threat from Cook is made explicit in s_4.
- description: Standard’s death (s_6) must occur before the Driver’s pursuit and evasion
    from Cook’s men, revealing betrayal and escalating danger (s_7 - s_9).
  id: c_4
  satisfaction_condition: Standard’s death has been triggered in s_6 prior to subsequent
    motel confrontation and betrayals.
  type: achievement
  violation_condition: Driver or system acknowledges or triggers motel conflicts or
    Cook’s betrayal without Standard’s death occurring first.
- description: The Driver’s discovery of Blanche’s betrayal and Cook’s double-cross
    (s_8) must precede Blanche’s death in the motel attack (s_9).
  id: c_5
  satisfaction_condition: Blanche’s betrayal is revealed in s_8 before s_9’s motel
    attack.
  type: ordering
  violation_condition: Blanche is killed in the motel siege without prior confirmation
    of her betrayal and double-cross plan.
- description: The Driver must confront Cook and reveal Nino’s role as puppet master
    of the pawn shop heist (s_10) before risks escalate with the hitman attack in
    the apartment building (s_11).
  id: c_6
  satisfaction_condition: s_10 occurs before s_11.
  type: ordering
  violation_condition: Driver faces hitman sent by Nino or experiences assault related
    to Nino’s orders before confronting Cook and learning Nino’s involvement.
- description: Irene must not observe the Driver committing lethal violence prior
    to s_11’s elevator kill scene, preserving her initial limited awareness of Driver’s
    lethal capacity.
  id: c_7
  satisfaction_condition: Before s_11, no witnessed lethal acts by Driver are shown
    to Irene.
  type: invariant
  violation_condition: Irene witnesses or knows of Driver’s lethal violence before
    the elevator hitman assassination event.
- description: Bernie and Nino’s decision to purge those with knowledge of the pawn
    shop money and Bernie’s killing of Shannon (s_12) must happen after Nino’s role
    is uncovered by Driver (s_10) and after Blanche and motel siege events.
  id: c_8
  satisfaction_condition: s_12 chronologically follows s_10 and s_9.
  type: ordering
  violation_condition: Bernie kills Shannon or attempts to purge knowledge sources
    before Driver discovers Nino’s orchestration or before Blanche’s death escalates
    conflict.
- description: The Driver’s killing of Nino (s_13) must come after Shannon’s death
    (s_12), concluding definitive elimination of major antagonists before the final
    negotiation with Bernie (s_14).
  id: c_9
  satisfaction_condition: s_12 precedes s_13; s_13 precedes s_14.
  type: ordering
  violation_condition: Driver kills Nino before Shannon is killed; or final meeting
    with Bernie (s_14) occurs before Nino’s death.
- description: The Driver’s farewell call to Irene and decision to meet Bernie for
    money-power exchange (s_14) must precede the final violent confrontation between
    Driver and Bernie (s_15).
  id: c_10
  satisfaction_condition: s_14 occurs before s_15.
  type: ordering
  violation_condition: Driver directly confronts or fights Bernie without previously
    making the call to Irene or scheduling the meeting.
- description: The final violent resolution between the Driver and Bernie (s_15) must
    occur to close the narrative, reflecting the irreconcilable conflict over money
    and safety.
  id: c_11
  satisfaction_condition: s_15 has been triggered and completed before narrative closure.
  type: achievement
  violation_condition: Narrative attempts to resolve without the Driver and Bernie’s
    fatal confrontation or skips the mutual stabbing sequence.
- description: The Driver’s departure alone and absence of response to Irene’s knock
    at the apartment door (s_16) marks narrative closure of separation and loneliness
    and must be consistent and final.
  id: c_12
  satisfaction_condition: Driver is unresponsive to Irene’s knocking and drives off
    alone at s_16.
  type: invariant
  violation_condition: Driver responds to Irene’s knock or remains present with Irene
    after s_16 within the same narrative trajectory.
