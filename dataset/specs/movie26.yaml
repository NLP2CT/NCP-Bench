commitments:
- description: Detention must be officially assigned by Richard Vernon before any
    group interaction or personal revelations occur.
  id: c_0
  satisfaction_condition: Node s_0 is completed before any nodes s_3 or later are
    initiated.
  type: ordering
  violation_condition: Player attempts to trigger student interactions, dialogues,
    or revelations before Vernon has assigned detention and the essay (before s_0).
- description: Students remain silent, seated, and separated under Vernon's supervision
    before Bender first openly defies the rules.
  id: c_1
  satisfaction_condition: From s_0 up to but not including s_1, no student initiates
    communication or moves from their seat.
  type: invariant
  violation_condition: Any student speaks, moves, or interacts before Bender's first
    defiance (before s_1).
- description: Richard Vernon maintains strict external control by periodically checking
    on the students throughout the detention prior to breakdown of silence.
  id: c_2
  satisfaction_condition: Between s_1 and s_3, Vernon intermittently enters/checks
    on the library group at least once and students remain under surveillance.
  type: invariant
  violation_condition: Vernon fails to supervise at all during this interval or players
    cause the system to skip Vernon's monitoring during this period.
- description: The students begin dialogue and share personal secrets only after Bender's
    provocations and Vernon's continued supervision have established tensions.
  id: c_3
  satisfaction_condition: Node s_3 occurs only after nodes s_1 and s_2 are completed.
  type: ordering
  violation_condition: Player instigates student bonding, confessions, or sharing
    before the escalation of tensions and Vernon's supervision (before s_3).
- description: The students must reach consensus to delegate Brian to write the essay
    challenging Vernon before the essay is physically submitted.
  id: c_4
  satisfaction_condition: At or before s_5, players achieve or trigger the group consensus
    at s_4 authorizing Brian to write the essay.
  type: achievement
  violation_condition: Player bypasses group agreement or Brian submitting the essay
    without prior consensus event (s_4) is triggered.
- description: Brian's essay must fundamentally challenge Vernon's judgments and reject
    imposed labels, not comply with the original imposed essay topic.
  id: c_5
  satisfaction_condition: At s_5, the essay left behind is explicitly a defiant letter
    signed 'The Breakfast Club' rejecting Vernon's assumptions.
  type: invariant
  violation_condition: Player causes Brian to write an essay that complies with Vernon's
    assigned topic or accepts Vernon's imposed labels.
- description: Physical intimacy and symbolic gestures indicating changed relationships
    among students must only occur after the essay submission and nearing end of detention.
  id: c_6
  satisfaction_condition: Node s_6 occurs strictly after node s_5 has concluded.
  type: ordering
  violation_condition: Player initiates student kisses, gift exchanges, or emotional
    bonding before the completion of the essay challenge (before s_5).
