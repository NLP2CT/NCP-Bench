meta:
  genres: ["Comedy", "Romance"]
  id: movie25
  player_role: Sidney Young
  title: "How to Lose Friends & Alienate People"
synopsis: Sidney Young is a smalltime, aspiring British journalist who works for a
  left-wing radical magazine. Following an incident at a party where Sidney accidentally
  lets a pig loose he is hired to work for an upscale magazine in New York City. He
  is hired by Clayton Harding, editor of Sharps magazine, a man Sidney had previously
  lampooned in his own magazine. Sidney annoys the staff he works with, first Alison
  Olsen, who is only there to pay the bills whilst she finishes her book, then his
  boss Lawrence Maddox. He also dares to target the star clients of power publicist
  Eleanor Johnson. He then meets new rising star Sophie Maes; however, he is told
  by Lawrence not to talk to her. Sidney makes it his mission to become something
  within the business; however, it is almost ruined when he accidentally kills Sophie's
  dog, as he was able to stop the dog from going out the window but unfortunately
  could not stop a vase from falling onto the dog. Luckily, Alison covers for him
  and nobody else finds out it was him. At a party, Alison and Sidney's relationship
  grows when she reveals she has just ended an affair with Lawrence. Sidney stops
  her from driving home drunk, causing him to miss his opportunity to sleep with Sophie.
  At a later party, however, just when Sidney was about to ask her out, it is revealed
  Lawrence has left his wife and that he and Alison are officially together. In a
  desperate attempt to up his career, he begs Eleanor to publish a piece on Vincent,
  a director he truly hates. The next day at work Clayton reveals that both Alison
  and Lawrence have left, and he promotes Sidney. Sidney finally becomes successful,
  getting all the girls that were disgusted by him before and even catching the eye
  of Sophie. The night before the awards ceremony she stated that if he gave her his
  late mother's ring and she won best actress, she would have sex with him. Going
  to the ceremony the next day he sees Lawrence, now being someone he used to be,
  stating that he and Alison split as she was in love with him. When the winner is
  revealed, as she is going to get her award, he realizes he does not really love
  her and asks for his ring back, then, after a heated exchange, he steals back the
  ring from Sophie, and inadvertently reveals that he killed Cuba. An enraged Sophie
  attacks him and a huge fight ensues then after the fight, Sidney leaves, quitting
  his job at Sharps and heading to New York. He meets Alison in the park, where they
  were showing her favourite movie, La Dolce Vita. She has finished her book and the
  two finally get together, with him giving her his mother's ring. The movie ends
  with him accidentally throwing the book onto a candle and jumping for it to stop
  it from going into flames.
trajectory:
- description: Sidney Young is a smalltime aspiring British journalist working for
    a left-wing radical magazine. He attends a lively house party where the atmosphere
    is casual but edgy, surrounded by acquaintances and peers from his magazine circle.
  id: s_0
  key_delta: Sidney's accidental release of the pig causes a commotion that draws
    attention to him and leads to an unexpected job offer.
  trigger_event: Sidney accidentally lets a pig loose at the party.
- description: Sidney begins working for Sharps magazine in New York City, employed
    by Clayton Harding, the editor he previously lampooned. The office environment
    is upscale and competitive.
  id: s_1
  key_delta: Sidney’s employment at Sharps is established despite past tensions with
    Clayton, setting up new workplace conflicts.
  trigger_event: Sidney arrives at Sharps and meets Clayton Harding for the first
    time.
- description: Sidney interacts with the Sharps staff, including Alison Olsen and
    Lawrence Maddox. Alison is indifferent, working to pay bills while finishing her
    book; Lawrence is Sidney’s boss who is increasingly annoyed by him.
  id: s_2
  key_delta: Sidney’s relationship with colleagues begins strained, planting seeds
    for interpersonal conflict.
  trigger_event: Sidney irritates Alison and Lawrence during his initial days working
    together.
- description: Sidney targets Eleanor Johnson’s star publicist clients, disrupting
    their relationships. Eleanor supervises high-profile clients and exerts significant
    workplace influence.
  id: s_3
  key_delta: Sidney has alienated Eleanor's clients, weakening his standing inside
    the office power structure.
  trigger_event: Sidney meets Sophie Maes, and Lawrence immediately warns him to
    stay away from her.
- description: Sidney meets Sophie Maes, a rising star in the business. Lawrence explicitly
    instructs Sidney not to speak to her. The office atmosphere deepens with underlying
    social tensions.
  id: s_4
  key_delta: Sidney receives a direct prohibition about Sophie, increasing narrative
    tension around this character.
  trigger_event: Sidney encounters Sophie and is warned by Lawrence not to engage
    with her.
- description: Sidney accidentally kills Sophie’s dog during an incident involving
    a falling vase in the Sharps office. Alison covers for him so the truth remains
    unknown to others.
  id: s_5
  key_delta: A serious secret is formed between Sidney and Alison, binding them in
    a covert alliance.
  trigger_event: Sidney inadvertently causes the death of Sophie’s dog and Alison
    intervenes to hide his responsibility.
- description: At a party, Sidney and Alison’s relationship deepens when Alison reveals
    her recent breakup with Lawrence. The mood is tense and intimate.
  id: s_6
  key_delta: An emotional connection develops between Sidney and Alison, while Sidney
    misses a chance with Sophie.
  trigger_event: Sidney prevents Alison from driving drunk after she discloses her
    affair with Lawrence has ended.
- description: At a later party, Lawrence announces he has left his wife and is now
    officially with Alison. Sidney’s hopes with Sophie are dashed amid escalating
    personal dynamics.
  id: s_7
  key_delta: Sidney faces emotional setbacks as Alison and Lawrence solidify their
    bond, complicating his personal and professional aspirations.
  trigger_event: Lawrence and Alison reveal their relationship status at the party.
- description: Sidney tries to advance his career by convincing Eleanor Johnson to
    publish a critical piece on Vincent, a director Sidney dislikes.
  id: s_8
  key_delta: Sidney’s proactive career maneuver increases his visibility but may increase
    risks with industry figures.
  trigger_event: Sidney persuades Eleanor to run an article on Vincent.
- description: The day after the article’s publication, Clayton informs Sidney that
    Alison and Lawrence have quit, and Sidney is promoted.
  id: s_9
  key_delta: Sidney moves up professionally, gaining authority and recognition at
    Sharps.
  trigger_event: Clayton announces Alison and Lawrence’s departure and Sidney’s promotion
    at work.
- description: Sidney gains popularity and romantic attention from women previously
    repulsed by him, including regaining Sophie’s interest. The office atmosphere
    becomes more favorable to Sidney.
  id: s_10
  key_delta: Sidney’s social and romantic status elevates, culminating in a key wager
    for intimacy linked to his late mother’s ring.
  trigger_event: Sophie signals romantic interest in Sidney and discusses terms involving
    his late mother's ring before an awards ceremony.
- description: On the night before the awards ceremony, Sophie proposes that if she
    wins best actress, Sidney must give her his late mother’s ring in exchange for
    sex.
  id: s_11
  key_delta: Sidney commits emotionally and materially to Sophie under contested terms,
    heightening tension.
  trigger_event: Sophie makes the conditional proposition to Sidney regarding the
    ring and the awards outcome.
- description: At the awards ceremony, Sidney sees Lawrence, who informs him that
    Alison left him because she was actually in love with Sidney. Sophie is about
    to receive her award amid growing drama.
  id: s_12
  key_delta: Sidney gains new insight into Alison’s feelings, complicating his relationship
    with Sophie and Lawrence.
  trigger_event: Lawrence shares his breakup with Alison and her feelings for Sidney
    during the ceremony.
- description: Sidney realizes he does not truly love Sophie, asks for his ring back,
    and in the confrontation, reveals that he caused the death of Sophie’s dog, Cuba.
    Sophie becomes enraged and attacks him, leading to a physical fight.
  id: s_13
  key_delta: Sidney’s secret is exposed, relationships collapse, and physical conflict
    erupts, irreversibly damaging his standing with Sophie.
  trigger_event: Sidney attempts to reclaim his ring and reveals his secret, sparking
    a violent altercation with Sophie.
- description: After the fight, Sidney leaves the ceremony, quits his job at Sharps,
    and heads out into New York City. The social and professional climate is hostile
    and tumultuous.
  id: s_14
  key_delta: Sidney breaks from his professional life and previous connections, entering
    a period of isolation and reflection.
  trigger_event: Sidney exits Sharps and departs New York City streets alone.
- description: Sidney meets Alison in a park where her favorite movie, La Dolce Vita,
    is being screened outdoors. Alison has finished her book, and a peaceful atmosphere
    contrasts previous tensions.
  id: s_15
  key_delta: Sidney reconnects with Alison in a sincere, calm environment, setting
    the foundation for renewed partnership.
  trigger_event: Sidney encounters Alison at the park during the outdoor movie screening.
- description: Sidney and Alison become a couple, symbolized by Sidney giving Alison
    his late mother’s ring. They share a tender moment as the evening ends.
  id: s_16
  key_delta: Sidney and Alison are now openly together, with his mother's ring passed
    to Alison as a lasting commitment.
  trigger_event: Their intimacy settles into a playful, comfortable rhythm by the
    end of the evening.
- description: The movie ends with Sidney accidentally throwing Alison’s book onto
    a candle’s flame and jumping to stop it from burning, showing a renewed playfulness
    and care in their relationship.
  id: s_17
  key_delta: Sidney and Alison end the story in a playful, secure relationship.
  trigger_event: Sidney knocks Alison’s book towards a candle and scrambles to save
    it from fire.
