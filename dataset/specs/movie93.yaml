meta:
  genres: ["Western", "Thriller"]
  id: movie93
  player_role: Ben Wade
  title: "3:10 to Yuma"
synopsis: In August 1884, Dan Evans, an impoverished rancher and Civil War veteran,
  although sitting awake and armed to prevent it, has his barn set ablaze by two men
  working for Glen Hollander, to whom Evans owes money. The next morning, as Evans
  and his two sons drive their herd, they stumble upon outlaw Ben Wade and his gang
  using Evans' cattle as a road blockade to ambush an armored stagecoach. As he loots
  the stage, Wade discovers Evans and his two sons watching from the hills. Acknowledging
  that they pose no threat to him and his gang, Wade takes their horses telling Evans
  that he will leave them tied up on the road to Bisbee. Wade travels with his gang
  to the town of Bisbee, Arizona to enjoy a celebratory drink at the local saloon.
  Meanwhile, the railroad guards find Evans and his sons with Byron McElroy, a Pinkerton
  agent and lone survivor of the ambush, tied up. Evans reveals Bisbee as Wade's likely
  destination, where the guards immediately return, joined by Evans and McElroy. While
  Doc Potter, the local medic/veterinarian, treats McElroy, Evans tries negotiating
  with Hollander, who reveals his intentions to sell the land to the railroad workers
  rather than grant water rights to Evans. Enraged at the loss of his livelihood and
  land, Evans tries confronting Hollander in the nearby saloon, but instead he finds
  Wade, whom he distracts long enough for the railroad guards to ambush and arrest
  him. The coach's owner, Grayson Butterfield, enlists McElroy, Potter, Tucker, one
  of Hollander's guards and Evans, who agrees for a $200 fee to deliver Wade for arrest.
  From Evans' ranch, McElroy arranges a decoy wagon to distract Wade's gang, now led
  by Charlie Prince (Ben Foster), while the real convoy charts a course for Contention,
  where Wade will be put on the 3:10 P.M. train to Yuma Territorial Prison and sentenced.
  As the group prepares to ride out, Evans' elder son William demands to accompany
  them. Evans flatly refuses his demand. During the journey, Wade kills Tucker during
  his sleep with a fork stolen from Evans' house, and later McElroy but is stopped
  from escaping by the surprise arrival of William, who had followed the group all
  the way from the ranch. Evans tries to pressure William to return back to the ranch,
  but William declines. Wade seemingly accepts to have his son with him. While taking
  a shortcut through a canyon, the group is attacked by Apaches. Evans tries to kill
  them, but he is badly wounded. Wade saves him, arms himself, and kills the remaining
  attackers. Following the shootout, Wade escapes to a Chinese laborer construction
  camp blasting a tunnel through the mountain range, where the foreman captures Wade
  for having killed his brother. One of his assistants, Zeke, tortures Wade with electric
  shocks. Evans, William, Potter, and Butterfield appear and after unsuccessful attempts
  at negotiation, Potter leads an attack on the foremen and his miners, freeing Wade.
  As they flee on their horses, Potter is shot and killed, while Wade and Evans destroy
  the tunnel behind them with dynamite. The group arrives in Contention several hours
  before the train's scheduled arrival and check into the hotel, where they are soon
  joined by several local marshals hired by Butterfield to protect them. Prince and
  the gang ambushes and interrogates the survivor of the decoy wagon, learning that
  Wade is being delivered to Contention and will board a train to Yuma; he then leaves
  the wagon to burn with the survivor trapped in it. Later Prince meets the mine foreman.
  Upon seeing Zeke with Wade's gun, Prince kills Zeke, the foreman and his assistant.
  Upon arriving in Contention and discovering the heavy guard around Wade, Prince
  offers every townsman a $200 bounty for every guard they kill. The marshals, unwilling
  to fight against such steep odds, surrender to Prince, who kills them anyway. Butterfield
  refuses to complete the mission, offering Evans the $200 salary even if Wade goes
  free. Evans refuses, noting that was the amount the government paid him for the
  loss of his leg. Instead he asks Butterfield to escort his son back to his ranch
  and to pay his wife $1,000 and a guarantee of water rights from Hollander in exchange
  for Evans delivering Wade to the train. After Butterfield agrees, Evans escorts
  Wade out of the hotel and the two make their way across town, evading continuous
  gunfire from the townsmen before taking refuge inside a storeroom. Wade, tired of
  running, nearly strangles Evans; he relents when Evans reveals that the reason he
  has a wooden leg is that his real leg was lost when Evans was shot by fellow soldiers
  while in retreat from battle, a story that would shame his sons, and that delivering
  Wade to Yuma would serve as an accomplishment his sons would admire. Wade relents
  and agrees to board the train. The two return to the streets, dodging bullets before
  barricading themselves in the station to wait for the train, where Wade reveals
  that he's been to Yuma twice and escaped both times. Wade's gang set up positions
  around the station as the train approaches. William, observing the events, stampedes
  a herd of cattle that provides cover for Evans to push Wade onto the train. As Wade
  boards, he congratulates Evans. At that moment, Prince steps up and shoots Evans
  four times, despite Wade's shouted order to stop. Wade steps off the train and catches
  the gun belt Prince tosses him. After a tense moment of silence, Wade abruptly executes
  Prince and the rest of his gang. William appears and draws his gun on Wade but finds
  he can't kill him; instead he turns to his dying father. Wade boards the train politely
  and surrenders his weapon. Evans eventually dies as Wade leaves in the train. As
  the train pulls away, he whistles for his horse, who pricks up his ears and canters
  after the running train into the distance.
trajectory:
- description: The morning after his barn was burned, Dan Evans and his sons are driving
    their herd when they encounter Ben Wade and his gang, who are preparing to act.
  id: s_0
  key_delta: Wade's gang has initiated a road blockade using Evans' cattle, setting
    the stage for a stagecoach ambush.
  trigger_event: Ben Wade and his gang use Dan Evans' cattle to block the road to
    ambush an armored stagecoach.
- description: On nearby hills, Wade spots Dan Evans and his two sons watching the
    ambush. Wade and his gang complete the stagecoach robbery in a rugged, lawless
    environment.
  id: s_1
  key_delta: Evans and his sons are disarmed and tied up by Wade after the robbery,
    temporarily neutralizing them.
  trigger_event: Wade discovers Evans and his sons watching and takes their horses,
    leaving them tied up on the road to Bisbee.
- description: In the town of Bisbee, Wade and his gang celebrate in the local saloon.
    Meanwhile, railroad guards find Evans and his sons tied up alongside Byron McElroy,
    the lone survivor of the ambush.
  id: s_2
  key_delta: Evans, his sons, and McElroy are rescued, introducing a law enforcement
    presence.
  trigger_event: Railroad guards find Evans and his family with McElroy, the lone
    survivor of the ambush, tied up near the ambush site.
- description: In Bisbee, Evans tries to negotiate with Glen Hollander, revealing
    a growing conflict over land and water rights amid railroad expansion, creating
    a tense and hostile atmosphere.
  id: s_3
  key_delta: A clear antagonistic motive of Hollander is established, deepening Evans'
    land dispute.
  trigger_event: Evans tries to negotiate with Hollander, who refuses to grant water
    rights and intends to sell the land to railroad workers.
- description: Back in Bisbee’s saloon, Wade is present when Evans confronts Hollander,
    allowing railroad guards to ambush and arrest Wade, marking a critical power shift.
  id: s_4
  key_delta: Wade is apprehended and held prisoner, shifting the story towards delivering
    him to justice.
  trigger_event: Evans distracts Wade in the saloon, enabling the guards to capture
    him.
- description: At Evans’ ranch, preparations begin for transporting Wade to Contention;
    McElroy organizes a decoy wagon as protection while Wade is held under guard.
  id: s_5
  key_delta: A planned escort mission is set in motion with multiple parties involved,
    including Evans reluctantly agreeing to the fee.
  trigger_event: McElroy arranges a decoy wagon, and the group agrees to escort Wade
    for a cash fee.
- description: The journey starts under a tense and guarded environment; Evans refuses
    his son William's demand to join, increasing family tension.
  id: s_6
  key_delta: William becomes a hidden participant, altering group dynamics and increasing
    potential complications.
  trigger_event: William follows the group secretly despite Evans’ refusal to let
    him accompany them.
- description: During the journey, Wade secretly kills Tucker and McElroy; the atmosphere
    turns dangerous and unpredictable.
  id: s_7
  key_delta: Loss of escorts weakens the group's security, underscoring Wade's lethal
    resolve.
  trigger_event: Wade murders Tucker and McElroy while traveling, escalating the threat
    level.
- description: An Apache attack ambushes the group in a canyon. Evans is wounded;
    Wade saves him and kills the attackers, shifting their relationship.
  id: s_8
  key_delta: Evans is seriously injured and Wade becomes a reluctant protector, altering
    their interaction.
  trigger_event: Apaches attack, resulting in a shootout where Wade saves the wounded
    Evans.
- description: Wade is captured at a Chinese labor camp after fleeing and is tortured;
    Evans and allies launch an attack to free him.
  id: s_9
  key_delta: Wade is liberated, but Potter is killed; the group's bond is further
    cemented despite hazards.
  trigger_event: Wade is captured and tortured; Evans, William, Potter, and Butterfield
    attack the camp to rescue him.
- description: The group reaches Contention hours before the train; marshals hired
    provide a guarded, anxious atmosphere as they prepare for the transfer.
  id: s_10
  key_delta: Wade is secured in a guarded local hotel, preparing for transport to
    Yuma prison.
  trigger_event: Arrival in Contention with heavy guard presence as the train's arrival
    approaches.
- description: Prince and his gang discover Wade’s location and prepare an ambush,
    offering bounties to townsfolk, escalating the threat imminently.
  id: s_11
  key_delta: Security collapses as the ambush escalates, forcing Evans and Wade to
    evade imminent attack.
  trigger_event: Prince kills marshals and hires townsmen to attack the guards protecting
    Wade.
- description: In the hotel, Butterfield offers Evans a bribe to release Wade, which
    Evans refuses, committing fully to delivering Wade to justice.
  id: s_12
  key_delta: Evans' moral stance solidified, reinforcing his determination to see
    Wade delivered despite temptation.
  trigger_event: Evans rejects Butterfield’s bribe, setting terms to ensure his family’s
    protection and water rights.
- description: Evans and Wade evade gunfire through town to a storeroom, where Wade
    contemplates killing Evans but relents after hearing Evans' story.
  id: s_13
  key_delta: A fragile understanding forms between Wade and Evans, deepening their
    complex relationship.
  trigger_event: Wade nearly strangles Evans during hiding but stops when Evans reveals
    the origin of his wooden leg.
- description: Barricaded inside the train station, Wade and Evans prepare to board
    amid escalating violence, with Wade revealing his past prison escapes.
  id: s_14
  key_delta: The final standoff is set with Wade’s escape history foreshadowing conflict.
  trigger_event: Wade and Evans take refuge in the station, awaiting the train while
    Wade discloses his history of escapes.
- description: William stampedes cattle to provide cover; Wade is pushed onto the
    train amid heavy fire; the atmosphere is tense and lethal.
  id: s_15
  key_delta: Wade boards the train, almost securing delivery to prison.
  trigger_event: William stampedes cattle, enabling Wade to board the train despite
    ongoing gunfire.
- description: Prince shoots Evans multiple times during the boarding; Wade kills
    Prince and the remaining gang in a violent reprisal.
  id: s_16
  key_delta: Evans is mortally wounded; Wade eliminates major threat but losses are
    incurred.
  trigger_event: Prince shoots Evans; Wade responds by executing Prince and his gang.
- description: William draws his gun on Wade but cannot shoot him; Wade boards the
    train, surrendering his weapon as Evans lies dying.
  id: s_17
  key_delta: Wade is surrendered and captured; Evans faces death, closing the mission.
  trigger_event: William aims at Wade but lowers his gun; Wade quietly boards and
    surrenders.
- description: The train departs Contention with Wade aboard; Evans dies; Wade whistles
    for his horse that follows the moving train into the distance.
  id: s_18
  key_delta: Wade is carried away on the train to Yuma while Evans dies after getting
    him aboard.
  trigger_event: The train pulls away, carrying Wade; Evans succumbs to wounds on
    the platform.
