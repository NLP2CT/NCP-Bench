commitments:
- description: The ambush by Wade and his gang using Evans' cattle (s_0) must precede
    Wade discovering and disarming Evans and his sons (s_1), preventing early knowledge
    or interference with the ambush plan.
  id: c_0
  satisfaction_condition: Node s_0 completed before s_1 is triggered.
  type: ordering
  violation_condition: Player acknowledges or acts upon Wade disarming Evans and sons
    (s_1) before the ambush has occurred (s_0).
- description: Rescue of Evans and his sons by railroad guards and McElroy (s_2) must
    happen only after Wade’s gang has been seen celebrating post-robbery (s_1), ensuring
    the capture and recovery sequence integrity.
  id: c_1
  satisfaction_condition: Node s_1 complete before node s_2 is triggered.
  type: ordering
  violation_condition: Player bypasses gang celebration and rescue, or attempts to
    rescue Evans and sons before Wade’s gang completion of the robbery is acknowledged.
- description: From the confrontation in Bisbee with Hollander (s_3) to Wade’s
    capture (s_4), Hollander’s hostile refusal to grant water rights and selling land
    to railroad workers remains fixed and undisputed, underpinning Evans' motivation.
  id: c_2
  satisfaction_condition: Throughout nodes s_3 to s_4, no player action or system
    response contradicts Hollander’s antagonistic stance.
  type: invariant
  violation_condition: Player successfully negotiates water rights or land ownership
    in a way that contradicts Hollander’s refusal before s_4 is resolved.
- description: Wade’s capture in Bisbee (s_4) must precede all subsequent escort preparations
    (s_5) to maintain logical order of custody.
  id: c_3
  satisfaction_condition: Node s_4 complete before s_5 is initiated.
  type: ordering
  violation_condition: Escort preparations (s_5) or transport related actions begin
    without confirming Wade’s capture (s_4).
- description: During the journey from the ranch to Contention (s_5 through s_15),
    Wade must remain a prisoner under guard with attempted escapes and threats escalating
    accordingly; Wade’s lethal actions against escorts only occur after appropriate
    progress triggers.
  id: c_4
  satisfaction_condition: Between s_5 and s_15, Wade’s hostility demonstrated by killing
    Tucker and McElroy (s_7) happens only after escort mission is underway; until
    then, Wade remains under guard without lethal violence.
  type: invariant
  violation_condition: Player causes Wade to kill or violently act before escort mission
    (s_5) is properly initiated or before appropriate progression (between s_5 and
    s_7).
- description: William’s secret following (s_6) must occur only after the escort mission
    is underway (s_5), preventing premature player knowledge or involvement of William
    before mission start.
  id: c_5
  satisfaction_condition: s_5 complete before s_6 is triggered.
  type: ordering
  violation_condition: William accompanies or influences events before escort departure
    (s_5).
- description: Wade’s relationship evolution with Evans, including his saving of Evans
    after Apache attack (s_8) and relenting from killing Evans after hearing the wooden
    leg story (s_13), must follow the sequence to preserve narrative thematic and
    character logic.
  id: c_6
  satisfaction_condition: Events s_8 through s_13 occur in order, with Wade’s protective
    actions and character shifts only occurring post-Apache attack and post-revelation.
  type: invariant
  violation_condition: Player triggers Wade’s trust or protection of Evans before
    the Apache attack (s_8) or prior to the wooden leg story revelation (s_13).
- description: Wade’s capture and torture at the Chinese labor camp (s_9) must be
    followed by the rescue attack by Evans and allies, ensuring the rescue event is
    consequential and properly triggered.
  id: c_7
  satisfaction_condition: Node s_9 completed before the group’s arrival and rescue
    attempt is made.
  type: ordering
  violation_condition: Player frees Wade or bypasses torture/rescue without triggering
    the capture in s_9.
- description: Wade’s arrival in Contention (s_10) and guarded hotel stay must occur
    before Prince’s ambush and bounty offer to townsfolk (s_11), preserving cause
    and effect of security collapse.
  id: c_8
  satisfaction_condition: s_10 complete before triggering s_11.
  type: ordering
  violation_condition: Ambush preparations (s_11) or bounty offers take place before
    Wade is secured in Contention (s_10).
- description: During the siege in Contention (s_11 through s_17), Evans remains committed
    to delivering Wade to justice, rejecting Butterfield's bribe to let Wade go, and
    instead negotiating a $1,000 fee and water rights to complete the mission.
  id: c_9
  satisfaction_condition: Evans consistently refuses Butterfield’s bribe (s_12) to
    abandon the mission and sets new terms to deliver Wade.
  type: invariant
  violation_condition: Evans accepts the bribe to let Wade go or abandons the mission
    before Wade’s transfer or resolution.
- description: The climax with Wade boarding the train (s_15) and being attacked by
    Prince (s_16) followed by Wade eliminating Prince and gang must occur in precise
    sequence to enable narrative closure and justify Evans’ mortal wounding.
  id: c_10
  satisfaction_condition: Sequence s_15 then s_16 followed by s_17 and s_18 completed
    without skipping or inversion.
  type: ordering
  violation_condition: Any player action causes Prince’s attack (s_16) prior to Wade
    boarding the train (s_15) or skips Wade’s retaliation.
- description: The narrative must reach the milestone where Wade is effectively surrendered
    aboard the train and Evans is mortally wounded (s_17), ensuring mission success
    and story closure.
  id: c_11
  satisfaction_condition: Node s_17 is triggered with Wade surrendering weapon aboard
    train and Evans dying from wounds.
  type: achievement
  violation_condition: Player sidesteps or prevents Wade’s surrender or Evans’ mortal
    wounding, preventing narrative resolution.
- description: Throughout the narrative until resolution, Wade remains a dangerous
    outlaw whose past escapes from Yuma prison are acknowledged (s_14), preserving
    his character’s escape artist reputation as a logical background for tension.
  id: c_12
  satisfaction_condition: Wade’s history of escapes is revealed in or after s_14 and
    not contradicted thereafter.
  type: invariant
  violation_condition: Player denies or erases Wade’s escape history before or after
    s_14.
