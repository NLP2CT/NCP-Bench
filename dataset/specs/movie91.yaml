meta:
  genres: ["Western", "Drama"]
  id: movie91
  player_role: Harmonica
  title: "Once Upon a Time in the West"
synopsis: The film portrays two conflicts that take place around Flagstone, a fictional
  town in the American Old West——a land battle related to construction of a railroad,
  and a mission of vengeance against a cold-blooded killer. The main storyline revolves
  around a struggle for Sweetwater, a piece of land near Flagstone containing the
  region's only water source. The land was bought by Brett McBain, who foresaw that
  the railroad would have to pass through that area to provide water for the steam
  locomotives. When railroad tycoon Morton learns of this, he sends his hired gun
  Frank to simply intimidate McBain to move off the land, but Frank instead kills
  McBain and his three children, planting evidence on the scene to frame the bandit
  Cheyenne and his gang. By the time McBain's new bride, Jill, arrives from New Orleans,
  the family is dead and she is the owner of the land. Meanwhile, a mysterious harmonica-playing
  gunman, whom Cheyenne later dubs "Harmonica", pursues Frank. In the film's opening
  scene, Harmonica kills three men sent by Frank to kill him, and, in a roadhouse
  on the way to Sweetwater, he informs Cheyenne that the three gunfighters he killed
  appeared to be posing as Cheyenne's men. Sometime later, Harmonica kills two men
  sent by Frank to kill Jill. Back at Sweetwater, construction materials are delivered
  to build a railroad station and a small town. Harmonica explains to Cheyenne that
  Jill will lose Sweetwater unless the station is built by the time the track's construction
  crews reach that point, and Cheyenne puts his men to work building it. Meanwhile,
  Frank turns against Morton, who wanted to make a deal with Jill. Frank's betrayal
  is made easy by the fact that Morton is crippled. After having his way with her,
  Frank forces Jill to sell the property in an auction. He tries to buy the farm cheaply
  by intimidating the other bidders, but Harmonica arrives, holding Cheyenne at gunpoint,
  and makes a much higher bid based on his reward money for delivering Cheyenne to
  the authorities. After rebuffing another intimidation attempt by Frank, Harmonica
  sells the farm back to Jill. At this point, some of Frank's men try to kill Frank,
  having been paid by Morton to turn against him, but Harmonica helps Frank kill them
  in order to save that privilege for himself. After Morton and the rest of Frank's
  men are killed in a battle with Cheyenne's gang, Frank goes to Sweetwater to confront
  Harmonica. On two occasions, Frank has asked Harmonica who he is, but both times
  Harmonica refused to answer him. Instead, he mysteriously quoted names of men Frank
  has murdered. The two men position themselves for a duel, at which point Harmonica's
  motive for revenge is revealed in a flashback——When Harmonica was a boy, Frank forced
  the boy to kill his own brother by tying a noose to the top of an arch, placing
  it around the brother's neck, and forcing the struggling Harmonica to support his
  brother on his shoulders with a harmonica in his mouth. Harmonica draws first and
  shoots Frank, and when Frank again asks who he is, he puts the harmonica in Frank's
  mouth. Frank nods weakly in recognition and dies. With Frank dead, Harmonica and
  Cheyenne say goodbye to Jill, who is supervising construction of the train station
  as the track-laying crews reach Sweetwater. Cheyenne collapses, revealing that he
  was shot during the fight with Frank's gang. The work train arrives, Jill is carrying
  water to the rail workers, and Harmonica rides off with Cheyenne's body.
trajectory:
- description: In the American Old West, around the fictional town of Flagstone, the
    land called Sweetwater holds the only water source nearby. Brett McBain, who foresaw
    the importance of Sweetwater for the railroad construction, owns this land with
    his family. The atmosphere is tense with multiple interests converging, but no
    open conflicts yet. The player (Harmonica) is off-screen, unknown and not yet
    involved.
  id: s_0
  key_delta: The player’s presence is introduced as a skilled gunman with lethal capability;
    a direct violent conflict involving Harmonica begins to unfold.
  trigger_event: In the film’s opening scene, Harmonica kills three men who were sent
    by Frank to kill him.
- description: Harmonica encounters Cheyenne in a roadhouse on the way to Sweetwater.
    The roadhouse is tense and suspicious. Harmonica informs Cheyenne that the men
    he killed were posing as Cheyenne’s gang members.
  id: s_1
  key_delta: Harmonica and Cheyenne’s paths intersect and an uneasy alliance begins;
    Cheyenne is made aware of a deeper scheme involving his name being used falsely.
  trigger_event: Harmonica tells Cheyenne about the imposters after killing the three
    men.
- description: Frank has killed Brett McBain and his three children, framing Cheyenne
    and his gang. The town around Sweetwater is relatively quiet but charged with
    underlying menace. Jill McBain has not yet arrived from New Orleans.
  id: s_2
  key_delta: Ownership of Sweetwater unexpectedly passes to Jill; the land conflict
    escalates with a new legitimate claimant present.
  trigger_event: Jill arrives at Sweetwater and finds her family dead, becoming the
    new owner of the land.
- description: Harmonica kills two men sent by Frank to murder Jill. The threat level
    around Jill increases; Harmonica moves closer to protecting Sweetwater’s new owner.
  id: s_3
  key_delta: Harmonica actively intervenes to protect Jill, solidifying his role as
    her implicit protector and opponent to Frank.
  trigger_event: Attack attempt on Jill by Frank’s men and her being saved by Harmonica.
- description: Construction materials arrive at Sweetwater to begin building a railroad
    station and small town. The atmosphere is one of determined progress mixed with
    underlying tension among the factions.
  id: s_4
  key_delta: A practical goal for defending Sweetwater emerges (building the station);
    Cheyenne’s gang is motivated to actively assist in construction.
  trigger_event: Harmonica explains to Cheyenne that unless the railroad station is
    built by the time the track crews arrive, Jill will lose Sweetwater.
- description: Frank has turned against Morton, the railroad tycoon whom he initially
    worked for. Frank is consolidating power by exploiting Morton's crippled condition,
    escalating internal conflicts among the antagonists.
  id: s_5
  key_delta: Jill loses direct control of Sweetwater temporarily; Frank gains leverage
    over the land through coercion.
  trigger_event: Frank forces Jill to sell the property in an auction after abusing
    her trust.
- description: At the auction, Frank intimidates bidders to acquire Sweetwater cheaply,
    but Harmonica arrives holding Cheyenne at gunpoint and openly bids using reward
    money.
  id: s_6
  key_delta: Harmonica regains Sweetwater at auction and sells it back to Jill, protecting
    her ownership despite Frank’s attempts.
  trigger_event: Harmonica bids significantly above others at the Sweetwater auction.
- description: 'Internal betrayal unfolds: some of Frank’s men attempt to kill him,
    incentivized by Morton. Harmonica intervenes by helping Frank defeat these mutineers.'
  id: s_7
  key_delta: Frank’s immediate position is temporarily stabilized through Harmonica’s
    intervention, preserving Frank’s dominant threat.
  trigger_event: Frank’s men try to kill him; Harmonica helps Frank kill the attackers.
- description: After Frank and Morton’s men clash with Cheyenne’s gang, Morton and
    most of Frank’s men die in battle. Cheyenne’s gang survives but with casualties,
    including Cheyenne himself injured.
  id: s_8
  key_delta: Major antagonists Morton and Frank’s forces are weakened severely; Cheyenne
    is wounded, shifting balance toward the defenders.
  trigger_event: Frank steps out after the gunfight and calls Harmonica into a final
    duel at Sweetwater.
- description: Frank confronts Harmonica at Sweetwater for a final duel. Tension is
    high, the duel site is set, the atmosphere is charged with vengeance.
  id: s_9
  key_delta: Harmonica reveals knowledge that connects him to Frank’s past crimes,
    establishing motive for revenge.
  trigger_event: Frank asks Harmonica who he is; Harmonica refuses and quotes names
    of men Frank killed.
- description: The duel occurs; Harmonica recalls a brutal childhood trauma inflicted
    by Frank involving Harmonica’s brother and the harmonica itself.
  id: s_10
  key_delta: Frank is killed by Harmonica; the revenge motive is fulfilled and Harmonica’s
    identity and past pain are implicitly confirmed.
  trigger_event: Harmonica draws first and shoots Frank; inserts the harmonica into
    Frank’s mouth as he dies.
- description: With Frank dead, Jill supervises railroad construction at Sweetwater.
    Cheyenne, seriously wounded, collapses and dies from his injuries. The train
    station is nearing completion and railroad track-laying crews are arriving.
  id: s_11
  key_delta: The immediate threats to Sweetwater are neutralized; the railroad expansion
    proceeds; Harmonica departs, ending his involvement.
  trigger_event: Cheyenne collapses from his wounds; Harmonica carries his body and
    leaves the town.
