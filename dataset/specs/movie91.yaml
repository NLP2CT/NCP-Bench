commitments:
- description: Harmonica's lethal capability and presence must be introduced before
    he can intervene in subsequent conflicts.
  id: c_0
  satisfaction_condition: Node s_0 (Harmonica kills three men sent by Frank) must
    occur before any direct player involvement related to protecting Jill or Sweetwater.
  type: ordering
  violation_condition: Player attempts to protect Jill or reveal Harmonica's role
    before killing the initial attackers at s_0.
- description: Harmonica must inform Cheyenne about the imposters posing as Cheyenne’s
    men before they form an uneasy alliance.
  id: c_1
  satisfaction_condition: Node s_1 (Harmonica informs Cheyenne in roadhouse) must
    occur before Cheyenne’s gang assists in defending Sweetwater.
  type: ordering
  violation_condition: Cheyenne's gang aiding Sweetwater or cooperating with Harmonica
    occurs before the imposters' revelation in s_1.
- description: Jill must arrive and become the owner of Sweetwater only after McBain’s
    death is established.
  id: c_2
  satisfaction_condition: Node s_2 (Jill arrives to find her family dead and inherits
    land) must occur before Jill can act as landowner or before conflict over ownership
    intensifies.
  type: ordering
  violation_condition: Jill exercises ownership rights or disputes land possession
    before confirming McBain family’s death.
- description: Harmonica actively protects Jill from attempts on her life during phases
    s_3 through s_11.
  id: c_3
  satisfaction_condition: From s_3 onward, any attack on Jill by Frank’s men must
    be intervened by Harmonica.
  type: invariant
  violation_condition: Jill is attacked or seriously harmed by Frank’s men without
    Harmonica’s intervention after s_3.
- description: Sweetwater’s survival depends on timely construction of the railroad
    station; Cheyenne’s gang must participate in this construction after s_4.
  id: c_4
  satisfaction_condition: From s_4 forward, Cheyenne’s gang is actively building the
    railroad station at Sweetwater.
  type: invariant
  violation_condition: The railroad station is not under construction at Sweetwater
    after s_4, or Cheyenne’s gang refuses to build it.
- description: Frank’s betrayal of Morton and coercion of Jill to sell Sweetwater
    must occur before Harmonica reacquires the land at auction.
  id: c_5
  satisfaction_condition: Node s_5 (Frank forces Jill to sell) must happen before
    s_6 (Harmonica bids and sells land back to Jill).
  type: ordering
  violation_condition: Harmonica attempts to buy Sweetwater at auction or confirms
    ownership before Jill loses the land under Frank’s coercion.
- description: Harmonica must successfully reacquire Sweetwater at auction and restore
    ownership to Jill.
  id: c_6
  satisfaction_condition: Completion of s_6 where Harmonica’s bid wins and he sells
    Sweetwater back to Jill.
  type: achievement
  violation_condition: Frank successfully retains control of Sweetwater through auction
    without Harmonica’s intervention or Jill permanently losing ownership.
- description: Harmonica maintains a temporary alliance with Frank by helping him
    repel mutineers before final confrontation.
  id: c_7
  satisfaction_condition: At s_7, Harmonica helps Frank kill attackers sent by Morton
    to betray him, preserving Frank’s dominance temporarily.
  type: invariant
  violation_condition: Harmonica refuses or fails to assist Frank against mutineers
    at s_7, or kills Frank prematurely.
- description: The battle between Frank, Morton, and Cheyenne’s gang must occur before
    Frank’s final duel with Harmonica.
  id: c_8
  satisfaction_condition: Node s_8 (battle resulting in Morton and most of Frank’s
    men dead) must precede s_9 (duel confrontation).
  type: ordering
  violation_condition: Final duel with Frank occurs before the major battle involving
    Cheyenne’s gang and Frank’s forces.
- description: Harmonica must confront Frank, reveal his identity through symbolic
    references, and defeat him in a duel.
  id: c_9
  satisfaction_condition: Completion of s_9 and s_10, where Harmonica quotes past
    murders and kills Frank with the harmonica symbolism.
  type: achievement
  violation_condition: Duel ends without Harmonica identifying himself or killing
    Frank, or Frank kills Harmonica.
- description: The revelation of Harmonica’s revenge motive linked to his childhood
    trauma must remain undisclosed until the duel at s_10.
  id: c_10
  satisfaction_condition: Harmonica refuses to reveal his identity before s_9; motive
    revealed only during s_10 flashback and duel.
  type: invariant
  violation_condition: Player uncovers or reveals Harmonica’s identity and motive
    before the duel confrontation.
- description: Following Frank’s death, the railroad construction at Sweetwater must
    proceed, Jill supervises work, and Harmonica departs carrying Cheyenne's body.
  id: c_11
  satisfaction_condition: Final sequence s_11 completed with active railroad construction,
    Jill managing site, Cheyenne dead from his wounds, and Harmonica leaving.
  type: achievement
  violation_condition: Railroad construction halted or no sign of progress post-Frank’s
    death; Jill absent or Harmonica remains engaged indefinitely.
