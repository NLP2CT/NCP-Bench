commitments:
- description: The public memorial service (s_0) and initial public perception of
    Lawrence must occur before any wartime events involving Lawrence are acknowledged.
  id: c_0
  satisfaction_condition: Node s_0 is reached and completed before any narrative advancement
    to s_1 or beyond.
  type: ordering
  violation_condition: Player actions or narrative states reference or reveal wartime
    events or Lawrence’s activities prior to completion of s_0.
- description: Lawrence is dispatched on a special mission only after receiving orders
    from Mr. Dryden (starting at s_1); no earlier independent military action is permitted.
  id: c_1
  satisfaction_condition: From s_1 onwards, all Lawrence-led Arab Revolt activities
    derive from Dryden's official order.
  type: invariant
  violation_condition: Player triggers Lawrence taking active action related to the
    Arab Revolt without Dryden’s order or before s_1 narrative node.
- description: Lawrence’s journey through the desert with Sherif Ali and enforcement
    of tribal customs (s_2) must precede his arrival at Faisal's camp (s_3).
  id: c_2
  satisfaction_condition: Node s_2 is completed before s_3 becomes accessible or acknowledged.
  type: ordering
  violation_condition: Lawrence arrives at Faisal’s camp (s_3) or interacts with Faisal
    before experiencing desert travel and tribal law enforcement in s_2.
- description: General Brighton’s order to keep quiet and leave (s_3) must be acknowledged
    and active at Faisal’s camp before Lawrence ignores it to engage with Faisal (s_4).
  id: c_3
  satisfaction_condition: Between s_3 and s_4, the British command’s restrictions
    on Lawrence’s speech at Faisal’s camp remain in effect.
  type: invariant
  violation_condition: Player bypasses, denies, or negates Brighton’s order at Faisal’s
    camp before s_3 or ignores it without recognition before s_4.
- description: Lawrence must successfully convince Prince Faisal to attempt the surprise
    attack on Aqaba (transition s_4 to s_5), establishing his influence.
  id: c_4
  satisfaction_condition: Clear player action or narrative acceptance confirming Faisal’s
    approval and plan to attack Aqaba as proposed by Lawrence.
  type: achievement
  violation_condition: Player fails to secure Faisal’s agreement or causes Faisal
    to reject or retreat without accepting Lawrence’s plan.
- description: The desert crossing with fifty men plus Daud and Farraj (s_6) must
    occur prior to the desert incidents involving Gasim’s loss and Lawrence's life-risking
    rescue (s_7).
  id: c_5
  satisfaction_condition: Departure on desert crossing (s_6) completed before player
    can trigger or acknowledge events of s_7.
  type: ordering
  violation_condition: Rescue of Gasim or desert incidents in s_7 occur without prior
    assembly and departure in s_6.
- description: Lawrence’s execution of Gasim to preserve the fragile tribal alliance
    (s_8) must be recognized as a factual and irreversible moral act once the murder
    within the coalition is discovered.
  id: c_6
  satisfaction_condition: Player commits to or accepts execution of Gasim before proceeding
    past s_8.
  type: invariant
  violation_condition: Player refuses, negates, or reverses the execution decision
    after it has been established or proceeds without addressing the murder and alliance
    risk.
- description: The allied forces must achieve successful capture of Aqaba (s_9), marking
    a decisive military victory and momentum shift.
  id: c_7
  satisfaction_condition: Narrative progression confirms the Turkish garrison at Aqaba
    is overrun under Lawrence’s leadership.
  type: achievement
  violation_condition: Player fails to conduct or secure the Aqaba assault or the
    garrison remains in Turkish hands before narrative proceeds beyond s_9.
- description: After Aqaba's capture (starting s_10), Lawrence has official British
    promotion and support though personal moral doubts may surface; Allenby dismisses
    these concerns.
  id: c_8
  satisfaction_condition: From s_10 onwards, Lawrence holds the rank of major with
    authorized arms and funding; moral qualms exist but do not impede British support.
  type: invariant
  violation_condition: Player denies Lawrence’s promotion, support, or Allenby dismissing
    Lawrence’s misgivings after s_10 or before official British sanction is given.
- description: Lawrence’s guerrilla campaign and international notoriety (s_11) must
    be initiated after receiving arms and British backing (s_10).
  id: c_9
  satisfaction_condition: s_10 completed prior to s_11 activities including sabotage
    and press coverage becoming active.
  type: ordering
  violation_condition: Player launches guerrilla operations or achieves media fame
    without prior British logistical support and promotion.
- description: Lawrence executing Farraj (s_12) must occur only after Farraj is critically
    injured during a raid; this act is irreversible and defines Lawrence’s harsh wartime
    reality.
  id: c_10
  satisfaction_condition: Narrative lock on Farraj’s critical injury followed immediately
    by Lawrence’s mercy killing before escape.
  type: invariant
  violation_condition: Player avoids Farraj’s execution after critical injury or denies
    the event while progressing onwards.
- description: Lawrence must first be captured and brutalized by Turkish forces at
    Daraa (s_13) before he abandons previous arrogance (s_14).
  id: c_11
  satisfaction_condition: Physical and psychological trauma of s_13 happens prior
    to Lawrence’s identity crisis and withdrawal in s_14.
  type: ordering
  violation_condition: Player triggers emotional breakdown or renounces prior behavior
    before experiencing capture and flogging at s_13.
- description: After his attempted reintegration and alienation (s_14), Lawrence must
    be pressured by Allenby to recommit to military action (s_15).
  id: c_12
  satisfaction_condition: Rejection and discomfort at British forces (s_14) precedes
    Allenby’s urging and Lawrence’s reluctant acceptance of the Damascus campaign
    (s_15).
  type: ordering
  violation_condition: Lawrence commits to Allenby’s campaign or reenlists zealously
    before undergoing alienation at s_14.
- description: The army Lawrence assembles at s_16 is composed mainly of mercenaries
    motivated by money rather than ideology, changing the moral character of his forces.
  id: c_13
  satisfaction_condition: Newly recruited forces are characterized as self-interested
    killers, distinct from previous idealistic troops.
  type: invariant
  violation_condition: Player recruits or leads an idealistic or purely nationalist
    force contrary to the mercenary composition after s_16.
- description: Lawrence must actively participate in a massacre at Tafas (s_17), crossing
    a moral boundary that shapes his internal conflict.
  id: c_14
  satisfaction_condition: Player triggers or accepts Lawrence’s involvement in the
    massacre and internal recognition of its horror.
  type: achievement
  violation_condition: Player avoids or denies participation in the massacre despite
    narrative progression to s_17.
- description: Capture of Damascus by Lawrence’s forces (s_18) must precede the breakdown
    of tribal governance and British reoccupation (s_19).
  id: c_15
  satisfaction_condition: 'Authority transition sequences: Arab tribal council established
    after city capture, then cedes control to British authorities.'
  type: ordering
  violation_condition: Player allows British governance before Damascus is secured
    by Lawrence’s coalition or tribal disputes escalate prematurely.
- description: The Arab council is incapable of effectively governing Damascus, leading
    to its abandonment of city administration in favor of British bureaucracy after
    s_19.
  id: c_16
  satisfaction_condition: Arab governance failure and British bureaucratic authority
    restored as factual narrative after s_19.
  type: invariant
  violation_condition: Player succeeds in maintaining Arab council governance or prevents
    British administrative takeover after s_19.
- description: Lawrence’s promotion to colonel and recall to Britain (s_20) must occur
    only after the British regaining control of Damascus and the failure of the Arab
    revolt’s political goals.
  id: c_17
  satisfaction_condition: Narrative completes s_19 before advancing to Lawrence’s
    recall at s_20.
  type: ordering
  violation_condition: Player triggers Lawrence’s recall or promotion before the Arab
    revolt’s political failure and British control solidify.
- description: The narrative must conclude with Lawrence’s dejection and removal from
    active involvement, marking an end to his direct influence in the Arab Revolt.
  id: c_18
  satisfaction_condition: Narrative terminates at s_20 with Lawrence’s departure from
    the theatre of war, visibly dejected and isolated.
  type: achievement
  violation_condition: Narrative continues with Lawrence retaining active influence
    or military leadership after s_20.
