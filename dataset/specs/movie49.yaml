commitments:
- description: The player cannot identify Karen Eiffel as the narrator's voice before
    visiting Jules Hilbert and discussing the literary nature of Harold's situation.
  id: c_0
  satisfaction_condition: Identification of Karen Eiffel as narrator voice occurs
    only at or after node s_9.
  type: ordering
  violation_condition: Player attempts or system acknowledges Karen Eiffel's identity
    as narrator before s_9.
- description: The narrative cannot acknowledge the inevitability or acceptance of
    Harold's death before Harold reads the manuscript and fully comprehends the death
    scenario.
  id: c_1
  satisfaction_condition: Acceptance of Harold's death as inevitable occurs only at
    or after node s_12.
  type: ordering
  violation_condition: System confirms or player acts on acceptance of fate prior
    to Harold reading the manuscript (s_12).
- description: Harold's death as described in Karen Eiffel's manuscript remains an
    unavoidable narrative element until node s_14 where the death outcome is subverted
    by survival.
  id: c_2
  satisfaction_condition: From s_10 through s_13, the narrative treats Harold’s scripted
    death as inevitable and undisputed.
  type: invariant
  violation_condition: Any narrative or system acknowledgement of Harold’s survival
    or failure of death before s_14.
- description: The narrative must achieve Harold’s acceptance of his fate by reading
    and appreciating Karen Eiffel’s manuscript to progress the story toward resolution.
  id: c_3
  satisfaction_condition: Player triggers Harold reading the manuscript and confirming
    its ending (s_12).
  type: achievement
  violation_condition: Narrative attempts to proceed to final events without Harold
    having read and accepted the manuscript.
- description: Ana Pascal’s attitude towards Harold shifts naturally based on their
    interactions (e.g., cookie incident), preventing premature reconciliation before
    s_8 when Harold embraces life fully.
  id: c_4
  satisfaction_condition: From s_6 through s_7, Ana and Harold’s relationship is strained;
    affectionate or reconciliatory interactions do not occur before s_8.
  type: invariant
  violation_condition: Player triggers or system acknowledges affectionate/resolved
    relationship between Ana and Harold before s_8.
- description: Harold cannot meaningfully attempt to control or alter his narrative
    fate before confronting the narrative genre dilemma with Jules Hilbert.
  id: c_5
  satisfaction_condition: Harold’s attempts to influence his destiny (e.g., doing
    nothing day) happen only after node s_5 and Jules’ advice (starting s_7).
  type: ordering
  violation_condition: System permits or player triggers attempts to alter plot before
    the literary analysis phase at s_5.
- description: The narrator’s voice remains incomprehensible and non-communicable
    to Harold until the literary consultation phase.
  id: c_6
  satisfaction_condition: From s_2 through s_5, Harold hears the narrator but cannot
    engage in dialogue or influence the voice directly.
  type: invariant
  violation_condition: Player elicits meaningful communication or alters narrator
    voice prior to s_5.
- description: The narrative must include Harold’s self-sacrificial act pushing the
    child out of the bus’s path as a climax milestone.
  id: c_7
  satisfaction_condition: Harold performs the act saving the child at or after s_13.
  type: achievement
  violation_condition: The story attempts to conclude or diverge without this pivotal
    event occurring.
- description: The revelation of the wristwatch’s role in preventing Harold’s death
    must occur only after Harold’s accident and hospital awakening.
  id: c_8
  satisfaction_condition: The narrative reveals watch fragments saving Harold only
    at s_14 or after.
  type: ordering
  violation_condition: Player or system acknowledges watch's saving effect before
    Harold’s accident and hospitalization (before s_14).
- description: The final narrative resolution frames the wristwatch, not Harold, as
    the tragic death character after Harold’s survival is confirmed.
  id: c_9
  satisfaction_condition: From s_15 onward, the tragic focal point of the narrative
    shifts exclusively to the wristwatch’s anthropomorphized death.
  type: invariant
  violation_condition: Any narrative or system asserts Harold’s death remains the
    tragic focal point after s_14.
- description: Medical evaluation and literary consultation must precede any acknowledgment
    of supernatural or metafictional elements.
  id: c_10
  satisfaction_condition: Harold visits psychiatrist (s_4) and Jules (s_5) before
    system allows acceptance of metafictional narrator existence.
  type: ordering
  violation_condition: System allows or player uncovers metafictional elements before
    medical and expert consultation events.
