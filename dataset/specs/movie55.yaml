  satisfaction_condition: Nodes s_4 and s_5 are completed before node s_6 starts.
  type: ordering
  violation_condition: Node s_6 triggered before completion of s_4 and s_5.
- description: Requires the B.P.R.D. team must reach the Golden Army’s location and
    meet the Angel of Death (s_7) before Hellboy can be healed by the Angel (s_8),
    establishing proper narrative sequence.
  id: c_5
  satisfaction_condition: Node s_7 complete before node s_8.
  type: ordering
  violation_condition: Node s_8 occurs without prior completion of s_7.
- description: Ensures Hellboy is healed and given renewed purpose by Liz's revelation
    of pregnancy before the final battle, providing necessary emotional strength for
    the climax (node s_8 must occur before s_10).
  id: c_6
  satisfaction_condition: Node s_8 is completed successfully before node s_10 initiates.
  type: achievement
  violation_condition: Player or system initiates the Golden Army battle (s_10) without
    Hellboy having been healed and emotionally reinforced (s_8).
- description: Forces the full assembly of the crown through the surrender of the
    final piece by Abe (s_9) before Nuada commands the Golden Army to fight (s_10),
    avoiding premature activation.
  id: c_7
  satisfaction_condition: Node s_9 fully completed before the triggering of s_10.
  type: ordering
  violation_condition: Golden Army is commanded or battle starts (s_10) without crown
    being complete (s_9).
- description: Restricts the personal duel challenge between Hellboy and Nuada (s_10)
    to occur only after the Golden Army battle has rendered the team unable to defeat
    the army, preserving cause-effect reason for duel.
  id: c_8
  satisfaction_condition: The failed battle with the Golden Army (s_10 initial conflict)
    precedes the formal duel for crown control (within s_10).
  type: ordering
  violation_condition: Duel between Hellboy and Nuada takes place before the initial
    battle with the Golden Army.
- description: The fraternal conflict concludes with Nuala’s sacrifice (s_11) to prevent
    Nuada from killing Hellboy, marking an irreversible narrative milestone in the
    story's tragic resolution phase.
  id: c_9
  satisfaction_condition: Node s_11 occurrence confirmed – Nuala commits suicide to
    stop Nuada's fatal attack.
  type: achievement
  violation_condition: The story progresses beyond the duel without Nuala’s sacrifice,
    or Nuada kills Hellboy.
- description: After s_11 and before the story conclusion (s_12,s_13), the Golden
    Army remains active until Liz melts the crown, ensuring that the army is neutralized
    only by her decisive action.
  id: c_10
  satisfaction_condition: From s_11 until s_12, the Golden Army remains active; deactivation
    only occurs upon Liz melting the crown in s_12.
  type: invariant
  violation_condition: The Golden Army is deactivated or ceases functioning prematurely
    before Liz melts the crown.
- description: Enforces that the B.P.R.D. team’s resignation (s_13) happens only after
    the Golden Army is shut down (s_12), linking resolution of the conflict to the
    characters' personal decisions.
  id: c_11
  satisfaction_condition: Node s_12 completed before node s_13 occurs.
  type: ordering
  violation_condition: Team resigns (s_13) before the Golden Army is neutralized (s_12).
- description: Hellboy and Liz’s parenthood revelation (expecting twins) must be disclosed
    before the narrative ends, marking a critical personal milestone and closure for
    character arcs (revealed in s_13).
  id: c_12
  satisfaction_condition: Player reaches node s_13 with Liz’s pregnancy of twins revealed.
  type: achievement
  violation_condition: Narrative ends or skips s_13 without revealing Liz’s twin pregnancy
    to Hellboy.
