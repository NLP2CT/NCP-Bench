    logical progression of crown acquisition.
  id: c_1
  satisfaction_condition: Node s_1 completed prior to node s_2 execution.
  type: ordering
  violation_condition: Node s_2 actions occur before completion of node s_1.
- description: Requires Princess Nuala's escape with the final crown piece (s_3) precedes
    Nuada's tracking of her (s_4), preventing her location from being revealed before
    she flees.
  id: c_2
  satisfaction_condition: Node s_3 is completed before node s_4 is triggered.
  type: ordering
